resultat_resume: "Causes à rechercher en priorité : prurit aquagénique, tabagisme, syndrome d'apnées du sommeil, iatrogénie (diurétiques, iSGLT2, androgènes). Bilan de débrouillage : ionogramme et protidémie, dosage d'EPO, gaz du sang, échographie abdominale, bilan martial et d'hémolyse. Si tout est normal, adresser à l'hématologue. Le score TRAJAK affiche de bonnes performances mais a été validé en milieu hospitalier."
