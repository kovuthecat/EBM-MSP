date_semaine: "2026-W33"
titre: "Diabète antérieur à la grossesse, consensus CNGOF-SFD : un texte honnête dont la reprise médiatique est trompeuse — 25 propositions d'experts, aucune graduée, et rien qui change la pratique de soins premiers"
