resultat_resume: "Infections respiratoires aiguës : incidence 39 pour 100 000 habitants (IC95 % 34-44), stable, activité basse typique de la saison ; Bretagne, Bourgogne-Franche-Comté et PACA au-dessus de la moyenne nationale. Part du COVID-19 dans les IRA : 1 pour 100 000 (0-3), stable et basse. Diarrhée aiguë : 54 pour 100 000 (48-59), stable, en dessous du niveau saisonnier habituel ; Grand Est, Corse et PACA les plus touchées. Varicelle : 5 pour 100 000 (3-7), en baisse, en dessous du niveau saisonnier ; Corse, Normandie et Bourgogne-Franche-Comté les plus touchées. Aucun indicateur ne signale d'alerte cette semaine."
