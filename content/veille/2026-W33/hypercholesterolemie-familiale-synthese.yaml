resultat_resume: "Le point de divergence porte sur le dépistage : les recommandations américaines le proposent de façon universelle entre 9 et 11 ans puis tous les 5 ans à partir de 19 ans, alors qu'une étude de coût-efficacité publiée dans la même revue conclut que cette stratégie ne l'est pas. En pratique : y penser devant un LDL supérieur à 1,90 g/L ou des signes cliniques, et dépister les apparentés. Attention, il s'agit d'une synthèse et non d'une étude princeps : elle ne peut pas servir de référence pour un nœud de décision."
