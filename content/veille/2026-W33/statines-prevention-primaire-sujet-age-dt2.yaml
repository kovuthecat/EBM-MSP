id: 2026-W33-statines-prevention-primaire-sujet-age-dt2
date_semaine: "2026-W33"
titre: "Statines en prévention primaire chez le diabétique de type 2 de 75 ans et plus : bénéfice cardiovasculaire modeste, revendications de mortalité et de tolérance non soutenues"
source:
  nom: PLOS Medicine
  lien: https://journals.plos.org/plosmedicine/article?id=10.1371/journal.pmed.1005136
  doi: 10.1371/journal.pmed.1005136
type_publication: cohorte
themes: [diabete-metabolisme, cardiovasculaire-prevention, geriatrie-deprescription]
professions_concernees: [MG, IPA]
route: analyse
niveau_impact: pratique
population: "Diabétiques de type 2 de 60 ans et plus, LDL-C au moins égal à 2,6 mmol/L, sans antécédent cardiovasculaire. Dossiers électroniques hospitaliers publics de Hong Kong, 2009-2015, suivi jusqu'en 2018. 70 541 paires appariées sur score de propension, dont 15 402 chez les 75-84 ans et 1 899 chez les 85 ans et plus."
resultat_resume: "Émulation d'essai cible comparant l'initiation d'une statine à l'absence d'hypolipémiant. En intention de traiter, la réduction des événements cardiovasculaires est de 12 % chez les 75-84 ans (HR 0,88) et de 14 % après 85 ans (HR 0,86). L'analyse per-protocole, mise en avant dans le résumé de l'article sans y être étiquetée comme telle, annonce 31 % et 35 %. Les auteurs concluent également à une réduction de la mortalité toutes causes et à l'absence de sur-risque musculaire ou hépatique."
appreciation_critique: |
  L'écart entre les deux analyses est le cœur du problème. En per-protocole, le bras comparateur perd 38 à 48 % de son temps d'observation par censure des non-initiateurs, contre 17 % dans le bras traité : la censure est massivement différentielle et sélectionne les patients désengagés du soin ou en déprescription de fin de vie.

  Le modèle porte un plancher de biais mesurable dans les données mêmes. Il attribue à la statine une réduction de 22 % des dysfonctions hépatiques et de 11 % des effets musculaires chez les 60-74 ans — deux effets qu'aucune statine ne produit. Ces critères fonctionnent comme des contrôles négatifs involontaires, et ils échouent de façon significative. L'analyse de sensibilité quantitative des auteurs leur attribue une E-value de 1,50, quasi identique à celle du critère principal (1,60) : le biais démontré dans ce jeu de données a presque exactement la force qu'il faudrait pour effacer le résultat.

  La mortalité toutes causes ne dispose pas d'une voie causale suffisante. Les statines n'ont aucun effet sur la mortalité non vasculaire ; à 35 % de décès vasculaires et 31 % de réduction des événements, le plancher atteignable est d'environ 0,88, contre 0,61-0,65 rapportés. La référence randomisée chez 18 686 diabétiques donne 0,91, et ALLHAT-LLT chez les 75 ans et plus donne 1,34 — direction opposée.

  Sur la tolérance, l'annexe des auteurs rapporte chez les 85 ans et plus un risque musculaire multiplié par 3 (IC 1,25-7,23 ; p = 0,014), absent du résumé, des résultats, de la discussion et de la synthèse pour auteurs. Les trois estimations disponibles dans cette tranche d'âge vont vers le risque.

  Les bénéfices absolus mis en avant ne résistent pas non plus : la différence de risque à 10 ans n'est significative ni chez les 85 ans et plus (−7,0 % ; −20,9 à +6,9 ; p = 0,326) ni chez les 75-84 ans en intention de traiter (−1,6 % ; −4,0 à +0,9 ; p = 0,220). Le NNT annoncé de 15 à 5 ans dérive de l'analyse per-protocole ; l'ordre de grandeur défendable en intention de traiter est d'environ 40.

  À porter au crédit du travail : design en nouveaux utilisateurs, temps zéro aligné sur l'apparition de l'indication, 84 essais mensuels emboîtés, étalonnage sur une strate à réponse connue, dix analyses de sensibilité toutes publiées — y compris celles qui abîment la conclusion. Le signal sur l'infarctus du myocarde est le plus spécifique et le plus solide. Financement exclusivement public ; une co-autrice déclare des liens industriels larges, hors travail soumis. Protocole non pré-enregistré, daté de janvier 2026 pour des données closes en 2018, et la définition du critère musculaire a été élargie après relecture par les pairs.
