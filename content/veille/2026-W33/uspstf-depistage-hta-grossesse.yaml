population: "Toute personne enceinte sans diagnostic connu de trouble hypertensif de la grossesse ou d'hypertension chronique."
resultat_resume: "Recommandation finale du 19 septembre 2023, également parue dans le JAMA : mesurer la pression artérielle tout au long de la grossesse, avec un niveau de certitude modéré quant au bénéfice net (grade B). L'évolution par rapport à la version précédente porte sur le périmètre — le dépistage ne vise plus la seule prééclampsie mais aussi l'hypertension gestationnelle, l'éclampsie et l'hypertension chronique. Recommandation étatsunienne : elle ne se substitue pas au suivi prévu en France, où la mesure tensionnelle à chaque consultation prénatale est déjà la règle."
