# Module RHD — écran de module (DECISIONS.md D22), premier usage du mécanisme.
#
# PROVENANCE DU TEXTE : aucun contenu clinique n'est créé ici. Le `cadrage` reprend ce que les deux
# nœuds `rhd-alimentation` et `rhd-activite-physique` affirmaient DÉJÀ, chacun de son côté, dans leur
# `population_cible` et leurs commentaires — c'est précisément la duplication que D22 vise à supprimer
# (invariant I4 : un concept, un encodage). Le point structurel « suggérer un rapprochement, jamais une
# cible à atteindre » est une directive explicite du référent (2026-07-26).
#
# GARDE-FOU R1 (D22, § Conséquences) : ce fichier ne porte AUCUN critère et ne transmet AUCUNE valeur.
# Le module est un flux d'écran, pas un chaînage : chaque nœud reste évaluable seul, avec ses propres
# critères saisis chez lui. Le socle de terrain partagé qu'évoquait D22 (`fragilite`, `age`…) n'est donc
# PAS livré ici — il suppose un état de saisie partagé entre écrans, qui reste à arbitrer.
id: rhd
domaine: diabete-type-2
libelle: RHD
titre: "Règles hygiéno-diététiques"
population_cible: >-
  Adulte DT2, en consultation de médecine générale. Deux axes travaillés séparément — alimentation et
  activité physique — parce que les traiter d'un bloc porterait le recueil au-delà de ce qu'une
  consultation absorbe.
cadrage:
  - >-
    Ces deux nœuds suggèrent des pistes de RAPPROCHEMENT d'un repère démontré ; ils ne fixent jamais un
    objectif chiffré à atteindre, et ne calculent aucun score d'adhérence. La négociation avec le patient
    fait partie du geste : une piste refusée n'est pas un échec, c'est une information.
  - >-
    Chaque axe est autonome : on peut n'en ouvrir qu'un, dans n'importe quel ordre, sans que l'autre ait
    été renseigné. Leurs conseils respectifs ne se mélangent jamais — mais les critères de terrain
    partagés (dont la fragilité) circulent d'un nœud à l'autre, comme entre tous les nœuds de cette
    consultation.
  - >-
    Hors périmètre des deux nœuds : l'objectif de perte de poids et la rémission, la prescription
    diététique détaillée (orientation vers le diététicien de la structure) et le bilan d'aptitude
    physique (enseignant en activité physique adaptée).
primer:
  question: "Quel levier travailler avec ce patient aujourd'hui ?"
  orientations:
    - noeud: rhd-alimentation
      libelle: "L'alimentation"
      indices:
        - "Le patient décrit spontanément ce qu'il mange, ou vous demande « quoi manger »."
        - "Boissons sucrées, plats ultratransformés ou restauration rapide sont au premier plan."
        - "Une piste alimentaire simple et négociable manque pour la prochaine consultation."
    - noeud: rhd-activite-physique
      libelle: "L'activité physique et la sédentarité"
      indices:
        - "Le patient est assis la plus grande partie de la journée."
        - "La marche, les déplacements ou une reprise de pratique sont le sujet de la consultation."
        - "Une expérience passée négative (blessure, moquerie, essoufflement) bloque la reprise."
meta:
  date_revue: "2026-07-26"
  auteur: "référent DT2 + Claude Code"
  statut: brouillon
  version: "0.2"
  changelog:
    - date: "2026-08-02"
      auteur: "référent DT2 + Claude Code"
      resume: >-
        T-130 (P12/S7) — le cadrage affirmait « aucune valeur ne circule de l'un à l'autre », ce qui est
        FAUX depuis que `fragilite` (et les autres critères `partage: true`) circulent bien entre
        `rhd-alimentation` et `rhd-activite-physique`, comme entre tous les nœuds de la consultation (D28,
        2026-07-27) — recette du 2026-08-02, N8. Le code n'a jamais menti (`partage: true` posé sur les
        deux nœuds depuis D28) : seul le texte affirmait une étanchéité totale qui n'existe pas. Reformulé
        pour dire ce qui est vrai : les CONSEILS des deux axes ne se mélangent jamais, mais les critères de
        TERRAIN partagés circulent. Aucun critère ajouté à ce fichier (garde-fou R1 inchangé).
