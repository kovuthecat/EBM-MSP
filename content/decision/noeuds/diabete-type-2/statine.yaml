    # T-152 (P13/S7, I28/D18) — TENTÉ PUIS REVERTÉ (2026-08-05). `statine_deja_en_place == false`
    # n'apparaît QUE dans les `exclusions` de cette option, jamais dans `conditions`/`prerequis` : un
    # motif ici satisferait le rendu (`describeReasons` lit `exclusions` via `option.motifs`, T-144) mais
    # PAS l'invariant I24 (`engine/banc/invariants-contenu.test.ts`), dont `branchesDeclarees` ne scanne
    # QUE `conditions`/`prerequis` — jamais `exclusions`. Fixer I24 exigerait de modifier sa logique
    # (ajouter `exclusions` à `branchesDeclarees`), hors mandat de cette session (contenu seul, aucun
    # fichier `src/` sauf la levée d'exemption nommément autorisée dans `rendu-textuel.test.ts`). Dette
    # laissée en l'état, exemption I28 restaurée dans `rendu-textuel.test.ts` — cf. bilan P13/S7.
    avantages:
      - "Bénéfice sur critères durs — mortalité, infarctus, AVC, revascularisation — et nombre de patients à traiter bas, parce que le risque de base est élevé : c'est la situation où une statine rapporte le plus."
      - "Le bénéfice est identique chez le diabétique et chez le non-diabétique (méta CTT 2008) : le diabète ne module pas l'effet attendu du traitement."
      - "Il est retrouvé dans les sous-groupes diabète de prévention secondaire de HPS, CARE et 4S, avec des molécules et des doses différentes — la cohérence entre essais est bonne."
      - "Monter en haute intensité apporte un gain supplémentaire réel sur les événements non fatals (CTT more-vs-less 2010 ; TNT et PROVE-IT dans leurs sous-groupes diabète) : la dose n'est pas indifférente."
      - "C'est la situation où les recommandations convergent totalement : française 2026, ESC/EAS et ADA prescrivent toutes une statine de haute intensité en prévention secondaire chez le diabétique."
    inconvenients:
      - "L'intensification, haute contre modérée, ne réduit PAS la mortalité toutes causes : TNT, cohorte totale, HR 1,01 ; IDEAL et SEARCH non significatifs sur leur critère principal. Le bénéfice de mortalité vient de « statine contre rien », pas de la montée en dose."
      - "Le gain de l'intensification est réel mais modeste : chez le diabétique en prévention secondaire, la méta de Vries 2014 donne RR 0,91, soit −9 %."
      - "Risque résiduel majeur : dans HPS, environ 78 % des événements vasculaires majeurs ne sont pas prévenus."
      - "Surcroît de myopathie aux très fortes doses : dans SEARCH, 0,9 % sous simvastatine 80 mg contre 0,03 % sous simvastatine 20 mg. La simvastatine 80 mg est à éviter (restriction FDA)."
    effet_attendu: >-
      Événements vasculaires majeurs RR ~0,79 par mmol/L de LDL abaissé (CTT, sous-groupe diabète). Dans
      les sous-groupes diabète de prévention secondaire, HPS donne 20,2 % contre 25,1 %, CARE −25 % et 4S
      des événements coronaires à RR 0,45 ; les NNT correspondants, de l'ordre de 12 à 20 sur 5 à 6 ans,
      sont calculés à partir de ces taux et ne figurent pas tels quels dans les publications.
      Intensification haute contre modérée : −15 % d'événements supplémentaires (CTT more-vs-less), et
      HR 0,75 dans les sous-groupes diabète de TNT (13,8 % contre 17,9 %) comme de PROVE-IT (21,1 %
      contre 26,6 %). Mortalité : réduite par la statine elle-même, pas par l'intensification seule
      (TNT, cohorte totale, HR 1,01).
