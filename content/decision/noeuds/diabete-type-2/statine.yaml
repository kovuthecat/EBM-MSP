meta:
  date_revue: "2026-07-26"
  auteur: "référent DT2 (Thibault) + Claude Code"
  statut: brouillon
  version: "1.24"
  changelog:
    - date: "2026-08-04"
      auteur: "Claude Code — en attente de relecture référent"
      resume: >-
        REFONTE DE L'ARGUMENTAIRE (D48), propagation depuis le nœud `prescription`. (1) `argumentaire`
        réécrit en sept paragraphes — le champ est désormais AFFICHÉ (« Comment ce nœud raisonne »).
        (2) TROIS `divergences[]` en forme comparable, extraites d'un paragraphe d'`explication` qui les
        énumérait en « (1)… (2)… » : piloter la décision par une cible de LDL, ce qu'on annonce comme
        bénéfice en prévention primaire, et la conduite au-delà de 10 N de CK (arrêt définitif côté
        français, interruption temporaire ici). Cette troisième descend d'`incertitudes`, où elle vivait
        noyée dans un récit de vérification de sources. `explication` ne garde que les points d'accord et
        la mention des conflits d'intérêt, sans en faire un argument. (3) `reco_officielle.source`
        resserré : ses vingt lignes de bibliographie et de corrections d'attribution passent en
        `references[]`, une citation vérifiable par ligne — dont la distinction NHS England / NICE NG238,
        que le texte précédent portait en avertissement inline. (4) `synthese_critique.appuis` cite les
        huit essais qui portent la lecture. (5) Les 17 incertitudes deviennent 16, toutes fondées sur la
        donnée ou son absence. DEUX SORTENT VERS DES COMMENTAIRES, n'ayant rien de clinique : la
        couverture du banc sur la bande CK 10-50 N et les bornes `min`/`max` d'`autres_FDRCV`. Aucun fait
        clinique perdu — absence d'essai en population intolérante, chiffres réels du protocole de
        réintroduction, écart sur le déclencheur du dosage de CK, non-conclusion du cas dialysé en
        prévention secondaire, écart de PLACE et non de RANG sur l'acide bempédoïque, tous conservés.
        (6) Argumentaire exhaustif nettoyé de ses attributions de décision et de ses dates de correction.
        Aucune condition, aucun seuil, aucune option touchés.
    - date: "2026-08-03"
      auteur: "Claude Code (P12/S8, T-133) — en attente de relecture référent"
      resume: >-
        CONVERSION D'UNITÉS (T-133, P12/S8) : `CK_x_normale` devient un critère DÉRIVÉ
        (`CK_UI_L / CK_normale_sup`) au lieu d'une saisie directe du multiple de la normale — motif direct
        de la tâche : « en N14, le praticien a saisi "1" au jugé pour ce champ, une valeur inventée entrait
        dans un garde-fou de sécurité ». Un praticien lit « 210 UI/L » sur un compte-rendu et une norme à
        côté, jamais un multiple déjà calculé. AJOUTÉS : `CK_UI_L` (valeur mesurée, UI/L) et
        `CK_normale_sup` (borne haute de la normale DU LABORATOIRE — un champ, pas une constante, parce
        qu'elle varie d'un laboratoire/sexe à l'autre). AUCUN seuil changé : `> 4`, `<= 5`, `> 5`, `> 10`,
        `<= 50`, `> 50` continuent de lire le MÊME nom de critère `CK_x_normale`, désormais calculé — aucune
        des six expressions qui le lisent n'a été touchée. LA CONVENTION « 0 = non dosé » du commentaire de
        contenu est REMPLACÉE, pas cassée en silence : tant que `CK_UI_L` n'est pas renseigné,
        `CK_x_normale` reste INDÉTERMINÉ (D20) — une comparaison qui le lit part EN ATTENTE plutôt que de
        se refermer silencieusement sur « CK normales » (amélioration réelle : l'ancien « 0 » par défaut
        d'un champ vide n'a jamais été une affirmation clinique, seulement un défaut générique de
        formulaire, `lib/formLayout.ts` `valeurParDefaut`). EXTENSION DU MOTEUR PARTAGÉE avec la conversion
        IMC de `prescription.yaml` (même lot, même changement à `engine/deriveCritere.ts`) : `derive` rend
        désormais une VALEUR NUMÉRIQUE pour un critère `type: nombre`, avec propagation D20 vérifiée
        explicitement par des tests écrits avant le correctif (`engine/deriveCritere.test.ts`,
        `engine/evaluateNode.indetermine.test.ts`). Équivalence vérifiée sur le golden master de
        caractérisation (`__snapshots__/caracterisation.statine.txt`) : aucune conclusion changée.
    - date: "2026-08-02"
      auteur: "Claude Code (P12/S7, T-132) — en attente de relecture référent"
      resume: >-
        Section renommée « Statine en cours » → « Tolérance de la statine » (2 occurrences, `groupe` de
        `intolerance_statine` et `CK_x_normale`) — recette du 02/08, N4 : le titre promettait la molécule
        et la dose de la statine actuelle, que la section ne demande pas (seules l'intolérance et les CK y
        sont saisies). ISSUE (a) DU CADRAGE RETENUE — renommer plutôt qu'ajouter molécule/dose : le
        `cadrage` du nœud déclare aujourd'hui explicitement cette donnée hors périmètre (« à valider par le
        référent », entrée du 2026-07-31 ci-dessous). QUESTION OUVERTE, non tranchée par cette tâche : le
        référent doit encore statuer sur l'issue (b) — ajouter molécule + dose actuelles pour permettre à
        l'outil de confronter le traitement en cours à sa recommandation. Aucune `condition`, aucun critère
        ni aucune option modifiés — un seul champ `groupe` (texte d'affichage), sur deux critères.
    - date: "2026-08-02"
      auteur: "Claude Code (P12/S2, T-121) — en attente de relecture référent"
      resume: >-
        7 INTITULÉS RACCOURCIS SUR 7 — libellés seuls, aucune règle touchée. Même mesure de cadrage que
        sur `prescription.yaml`/`insuline.yaml` (plan P12) : les 7 options du nœud dépassaient toutes
        55 caractères. Parenthèse/suffixe retiré après vérification qu'il figure déjà dans `motifs`
        (affiché via « Proposé parce que ») et/ou `avantages` de la MÊME option : « Interrompre la
        statine 4 à 6 semaines et réévaluer (CK au-dessus de 5 fois la normale) » → sans la parenthèse
        (le motif rédigé de l'unique branche la nomme déjà) ; « Interrompre la statine — la classe reste
        indisponible (intolérance avérée, CK au-dessus de 5 fois la normale) » → sans la parenthèse, même
        raison ; « Débuter la statine à dose plus faible (CK élevées mais sous 5 fois la normale, avant
        initiation) » → sans la parenthèse, motif rédigé équivalent ; « Statine de haute intensité —
        prévention secondaire (maladie athéromateuse établie) » → sans la parenthèse (ASCVD établie est la
        seule condition de l'option, rendue mécaniquement dans « Proposé parce que », et `avantages` le
        redit en toutes lettres) ; « Discuter la statine (décision partagée) — diabète non compliqué à
        faible risque absolu » → « Discuter la statine » (« décision partagée » et le profil de risque
        sont tous deux dans `motifs`/`avantages`) ; « Statine indisponible (intolérance avérée ou
        contre-indication) — alternatives hypolipémiantes » → « Statine indisponible » (les deux voies
        d'accès sont dans `motifs`, les alternatives dans `avantages`) ; « Statine (prévention primaire,
        intensité modérée — haute si risque très élevé) » → « Statine — prévention primaire » (intensité
        modérée/haute est détaillée dans `avantages` ; l'axe prévention primaire/secondaire est conservé
        dans le titre car c'est la seule information qui distingue ce repli de « Statine de haute
        intensité — prévention secondaire », même si le nœud est `ordered-first-match` — une seule carte
        statine s'affiche jamais par patient, donc aucun risque de coexistence à l'écran, mais la
        cohérence entre consultations reste utile). CE QUI N'A PAS CHANGÉ : aucune `condition`,
        `exclusions`, `prerequis`, `role`, `action`, `famille`, `priorite`, `niveau_preuve` ni `badge`, sur
        aucune option. Snapshots de caractérisation régénérés puis relus en entier : seuls les libellés
        changent, badges/rangs/motifs/options écartées identiques. Tableau avant/après complet :
        `plans/P12/S2.md`, bilan de session.
    - date: "2026-07-31"
      auteur: "Claude Code (P10/S5, T-082) — en attente de relecture référent"
      resume: >-
        Motifs rédigés (`Option.motifs`, mécanisme P10/S2) sur les branches opaques de 4 des 7 options :
