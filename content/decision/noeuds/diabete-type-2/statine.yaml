    # session. Cf. le commentaire complet plus haut et le bilan P13/S7.
    motifs:
      "autres_FDRCV == 0": "aucun autre facteur de risque cardiovasculaire"
      "diabete_complique == false": "diabète non compliqué (pas d'atteinte d'organe)"
    # Même motif que l'option précédente : cette carte propose elle aussi une statine (« décision partagée »
    # sur l'initiation). Sans cette exclusion, l'ordered-first-match l'aurait offerte en repli au patient
    # intolérant avéré retiré de l'option de haute intensité — en le présentant, de surcroît, comme un
    # patient à faible risque absolu.
    exclusions:
      - "intolerance_statine == averee"
      - "intolerance_statine != non AND CK_x_normale > 5 AND statine_deja_en_place == false"
    avantages:
      - "Le risque absolu est ici faible, en deçà des populations où le bénéfice a été démontré par essai randomisé : CARDS recrutait des diabétiques de 40 à 75 ans ayant au moins un facteur de risque, et ASPEN, à plus bas risque, est nul."
      - "Le bénéfice absolu d'une statine y est donc faible : la décision se partage avec le patient plutôt qu'elle ne s'impose."
    inconvenients:
      - "Le bénéfice relatif des statines est à peu près constant quel que soit le risque (CTT : ~21 % par mmol/L, même à bas risque) ; c'est le bénéfice absolu, faible ici, qui justifie la décision partagée."
      - "Réévaluer à chaque consultation : une ancienneté qui atteint 10 ans, l'apparition d'un facteur de risque ou d'une complication font basculer vers le traitement."
      - "SCORE2-Diabète peut aider à objectiver le risque absolu dans cette situation précise — c'est la seule où il sert vraiment. Réserve : le modèle n'est validé que de 40 à 69 ans, or ce profil est souvent plus jeune."
