        NG238 §1.5.7 demande de DÉBUTER À DOSE PLUS FAIBLE. Ce n'était pas un défaut d'affichage : c'était
        une SOUS-PRESCRIPTION chez un patient dont le risque cardiovasculaire n'avait pas bougé. Le « seuil
        le plus bas donc le plus prudent » retenu le matin ne l'était donc pas.
        (1) SEUIL — six expressions passent de `> 4` à `> 5` (condition et exclusions des options CK,
        condition et alerte de l'option terminale). Bandes 10 N et 50 N INCHANGÉES : NG238 ne les couvre
        pas, le parcours NHS/AAC en reste seule source.
        (2) NOUVELLE OPTION « Débuter la statine à dose plus faible » (4-5 N, avant initiation), placée
        AVANT « haute intensité » — sans quoi, en ordered-first-match, un patient ASCVD à 4,5 N recevrait
        la dose forte que la source écarte. PÉRIMÈTRE RESTREINT par arbitrage Q1 : NG238 écrit « toute
        élévation sous 5 N », le référent a retenu 4-5 N pour ne pas changer la conduite des patients à
        1-4 N, aujourd'hui traités à dose pleine sans que rien ne l'ait signalé comme un défaut. Écart au
        texte assumé et enregistré dans `incertitudes`.
        (3) NOUVELLE ALERTE DE NŒUD « rassurer » (4-5 N, sous traitement, `niveau: info`) : NG238 §1.11.4,
        pas d'interruption sous 5 N. Alerte et non option (arbitrage Q2, D21) — « rassurer » n'est pas un
        geste, et le patient concerné peut atterrir sur plusieurs cartes selon son profil.
        (4) SCISSION DE « INTERROMPRE » en deux options (A2) : intolérance RAPPORTÉE → interrompre et
        réévaluer, la réintroduction est la suite attendue ; intolérance AVÉRÉE → interrompre, la classe
        reste fermée. La seconde PORTE elle-même l'orientation vers les alternatives (ézétimibe, acide
        bempédoïque, anti-PCSK9) — arbitrage Q3 : en ordered-first-match elle gagne avant la carte
        terminale, et renvoyer à une carte que le patient ne verra pas n'aurait rien orienté. Dette de
        duplication assumée et signalée dans le fichier.
        (5) QUATRE AFFIRMATIONS FAUSSES RETIRÉES (arbitrage Q4) : le nœud écrivait que « rien de plus
        récent ne remplace le parcours NHS ». NG238 porte son propre protocole de réintroduction
        (§1.9.2-1.9.4) et une section §1.10. Le parcours NHS reste la source de la conduite détaillée —
