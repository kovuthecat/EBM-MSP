        false`) retire « Statine de haute intensité — prévention secondaire », la boucle continue vers
        l'option suivante, qui ignore tout de `ASCVD_etablie`. Un patient DIALYSÉ AVEC ASCVD ÉTABLIE, PAS
        encore sous statine, atterrissait donc sur « Discuter la statine […] à faible risque absolu » ou
        sur le repli « prévention primaire, intensité modérée » — un patient de prévention SECONDAIRE
        présenté comme à faible risque, sous-dosé (12,5 % du banc réaliste `statine`, 360/2880 profils).
        VOIE RETENUE (parmi les deux esquissées par le red-team) : une alerte PORTÉE PAR CHACUNE des deux
        options atteintes (`options[].alertes`, D21 : « le fait qualifie un geste sans l'interdire »,
        visible UNIQUEMENT quand l'option est réellement applicable pour ce patient), plutôt qu'un gate
        `ASCVD_etablie` dans leurs `conditions` (qui les auraient rendues inapplicables aux VRAIS patients
        à faible risque / prévention primaire du même tier — le nœud n'a pas de 4e filet derrière le repli,
        I2′) ou qu'une option dédiée « statine non recommandée » (proportion disproportionnée pour un
        sous-groupe de 12,5 % dont la conduite optimale n'est de toute façon pas tranchée par le dossier).
        Message : ASCVD établie = prévention secondaire (pas le profil que décrit la carte), l'option de
        haute intensité a été retirée pour un motif de preuve en dialyse (4D/AURORA) et non de risque
        absolu, et le dossier NE TRANCHE PAS la conduite optimale pour ce sous-groupe précis — à discuter
        au cas par cas, pas d'invention d'une conduite au-delà de ce que le dossier établit. Les TROIS
        propriétés vérifiées ensemble (cf. rapport de tâche) : (1) dialysé SANS statine → pas d'initiation
        haute intensité (exclusion D21 inchangée) ; (2) dialysé AVEC statine → poursuite offerte
        (`statine_deja_en_place == true` contourne l'exclusion, inchangé) ; (3) un patient de prévention
        secondaire n'est plus JAMAIS présenté comme à faible risque absolu, quelle que soit l'option
        atteinte (nouveau). AUCUN changement de `conditions`/`exclusions` : le routage
        `applicable`/`excluded`/`nonRetenues` est rigoureusement inchangé (vérifié : F-02/F-03 restent
        verts tels quels). 2 nouvelles vignettes F-10/F-11 (`evaluateNode.statine.test.ts`, au niveau
        `construireVueDecision` — une alerte d'option n'existe pas dans `EvaluateNodeResult`, calculée
        seulement à l'affichage). CORRECTION ANNEXE (même red-team, `redteam-preuve-statine-sujet-tres-age.
        md`) : libellé de l'alerte « > 75 ans » repris tel que proposé par le red-team (pas réécrit) — le
        chiffre « ~2,5 ans » est désormais présenté explicitement comme une EXTRAPOLATION d'une
        méta-analyse portant sur des sujets de 50 à 75 ans (Yourman 2021), reprise telle quelle par la reco
        SFE/SFD/NSFA/SFC 2026, jamais mesurée directement après 75 ans — le chiffre n'est PAS retiré, sa
        nature est dite. NE TOUCHE PAS : `age` reste délibérément non décisif sur les options (F-statine
        §9.4) ; F-07 (82 ans + ASCVD → pas d'alerte > 75 ans) intact, c'est le comportement protégé.
        REFUSÉ / HORS PÉRIMÈTRE : régénération des snapshots de caractérisation
        (`engine/banc/__snapshots__/caracterisation{,-indetermine}.statine.txt`), consigne de tâche. RESTE
        EN BROUILLON : revalidation clinique référent toujours en attente (invariant CLAUDE.md 4).
