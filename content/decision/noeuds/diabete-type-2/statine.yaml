      Aucun essai n'a mesuré le bénéfice à ce niveau de risque : CARDS, seul grand essai dédié positif,
      recrutait des diabétiques de 40 à 75 ans ayant au moins un facteur de risque (composite HR 0,63,
      5,8 % contre 9,0 %), et ASPEN, mené plus bas dans l'échelle de risque, est nul. Le bénéfice relatif
      reste à peu près constant quel que soit le risque (CTT, environ 21 % par mmol/L de LDL abaissé, y
      compris à bas risque) ; c'est le bénéfice absolu qui décroît, et il est ici faible — peu
      d'événements évités pour 1000 patients traités. Aucune donnée de mortalité. La recommandation
      française 2026 classe ce profil en risque modéré.
    niveau_preuve: faible
    references:
