    # D21 (2026-07-27, 6e série) — MÊME DÉFAUT QUE LA DIALYSE, AUTRE CAUSE. Jusqu'ici, un patient ASCVD dont
    # l'intolérance était AVÉRÉE recevait d'abord et uniquement cette carte — « atorvastatine 40-80 mg ou
    # rosuvastatine 10-20 mg » — contredite par une seule alerte de nœud. C'est-à-dire une carte qui PRESCRIT
    # un geste que le dossier du patient déclare indisponible : exactement la configuration que D21 existe
