  synthese_critique:
    donnee: >-
      Décision fondée sur le risque absolu, pas sur une cible LDL chiffrée : aucun essai n'a randomisé
      deux valeurs cibles de LDL, et une stratégie de treat-to-target n'est pas supérieure à une dose
      fixe de haute intensité (LODESTAR, *JAMA* 2023, non-infériorité) ; CARDS et HPS ont démontré le
      bénéfice à dose fixe, indépendamment du LDL de base. En prévention secondaire, le bénéfice net est
      solidement établi (méta CTT, sous-groupe diabète : RR 0,79 par mmol/L de LDL abaissé). En
      prévention primaire, le bénéfice a été démontré dans la population des essais dédiés — CARDS :
      40-75 ans avec ≥ 1 facteur de risque cardiovasculaire additionnel ; ASPEN, à plus bas risque, est
      nul — d'où une décision graduée par le risque plutôt qu'un traitement systématique.
    appuis:
      - ctt-diabete
      - cards
      - hps
      - lodestar
      - aspen
      - clear-outcomes
      - kraut-2023
      - aebi-2025
    # REVUES SECONDAIRES CONSULTÉES — retirées de l'écran le 2026-08-04 (le champ
    # `synthese_critique.references` n'existe plus au schéma). Motif : rendues sous la position comme
    # « Réf. : Prescrire », elles se lisaient « Prescrire dit que » — exactement ce que D23 avait voulu
    # empêcher en les sortant du sujet grammatical des arguments. Elles restent CONSULTÉES et tracées
    # ici ; l'écran ne cite plus que des essais et des textes de recommandation officiels.
    # - nom: "Prescrire"
    # detail: "Position éditoriale constante ; réf. Rev Prescrire, « Diabète de type 2 : une statine pour certains patients », juillet 2005 — texte réservé aux abonnés."
    # - nom: "Minerva"
    # - nom: "RecoMédicales"
    # lien: "https://recomedicales.fr/recommandations/statines/"
    # - nom: "Louvain Médical"
  reco_officielle:
    source: "Reco française 2026 (SFE/SFD/NSFA/SFC) · ESC/EAS 2019-2025 · ADA 2026 · NHS England 2022"
    references:
      - nom: "Reco française 2026"
        detail: "SFE/SFD/NSFA/SFC, « Management of dyslipidemia in adults », Diabetes & Metabolism 2026;52:101725 — consensus multi-sociétés. C'est la recommandation française à jour : ni la HAS 2024 sur le DT2 ni la prise de position SFD 2025 sur l'hyperglycémie ne traitent de la statine, et la reco HAS 2017 sur les dyslipidémies est supplantée."
      - nom: "ESC/EAS 2019"
        detail: "Mach, Eur Heart J 2020;41:111-188 ; complétée par ESC 2023 (diabète) et par le focused update ESC/EAS 2025, qui place l'acide bempédoïque en classe I niveau B chez le patient qui ne peut pas prendre de statine."
      - nom: "ADA 2026"
        detail: "Standards of Care, chapitre 10 (prise en charge cardiovasculaire)."
      - nom: "SCORE2-Diabetes"
        detail: "Eur Heart J 2023;44:2544 — modèle d'estimation du risque, validé sur 40-69 ans."
      - nom: "NHS England / AAC 2022"
        detail: "« Statin Intolerance Pathway » (janvier 2022, avalisé par NICE en décembre 2021). ⚠ Ce parcours n'est PAS dans NG238 : NICE ne fait que l'héberger. Sa date de révision (janvier 2024) est dépassée."
      - nom: "NICE NG238"
        detail: "Décembre 2023 — §1.5.7 (conduite entre 4 et 5 N) et §1.9.2-1.9.4 (protocole de réintroduction propre à NICE, distinct du parcours NHS ci-dessus)."
      - nom: "HAS 2025"
        detail: "Commission de la transparence, avis NILEMDO 180 mg (acide bempédoïque) du 12/02/2025 : SMR important dans un périmètre restreint, insuffisant ailleurs, ASMR V. Remboursement effectif au 12/12/2025."
    position: >-
      Le diabétique est stratifié — jamais « bas risque » — en risque MODÉRÉ (diabète de moins de 10 ans,
      non compliqué), ÉLEVÉ ou TRÈS ÉLEVÉ, selon une grille de facteurs cliniques : durée, complications
      micro ou macrovasculaires, rapport albumine/créatinine et DFG, LDL au-dessus de 1,9 g/L, insuffisance
      cardiaque ou fibrillation atriale, hypertrophie ventriculaire gauche, artériopathie. SCORE2-Diabetes
      sert aux 40-69 ans non compliqués. Statine en première intention, avec une intensité et une cible LDL
      par catégorie : risque modéré, statine d'intensité modérée et cible sous 1,0 g/L, l'initiation
      relevant d'une décision partagée si le LDL reste au-dessus de la cible malgré les mesures
      hygiéno-diététiques ; risque élevé, sous 0,70 g/L ; risque très élevé, sous 0,55 g/L, avec escalade
      par ézétimibe puis anti-PCSK9. Ancrage d'efficacité : −21 % d'événements cardiovasculaires majeurs et
      −10 % de mortalité toutes causes par mmol/L de LDL abaissé (CTT). En prévention primaire au-delà de
      75 ans, la cible n'est pas fondée sur le risque mais sur l'espérance de vie : la statine étant utile
      au-delà de 2,5 ans, ne pas initier en deçà. En dialyse, bénéfice non démontré (4D, AURORA).
    divergence: true
    divergences:
      - sujet: "Piloter la décision par une cible de LDL"
        position_officielle: >-
          Une cible chiffrée de LDL est fixée par catégorie de risque — sous 1,0, 0,70 ou 0,55 g/L —, et
          l'escalade thérapeutique se déclenche quand elle n'est pas atteinte.
        position_outil: >-
          L'outil ne demande pas le LDL et ne pilote rien par une cible : il choisit une intensité fixe
          selon le niveau de risque. Aucune option n'affiche de valeur cible.
        appui: >-
          Aucun essai ne valide une valeur cible : LODESTAR montre que viser une cible équivaut à une dose
          fixe, et la revue VA/DoD 2026 conclut à une preuve insuffisante pour le treat-to-target. CARDS et
          HPS ont démontré le bénéfice à DOSE FIXE, indépendamment du LDL de départ. La recommandation
          française le reconnaît d'ailleurs elle-même, en toutes lettres : « despite the absence of
          randomized controlled trials defining specific LDL-c targets ».
      - sujet: "Ce qu'on annonce comme bénéfice en prévention primaire"
        position_officielle: >-
          L'ancrage d'efficacité cité est celui de la méta-analyse CTT : −21 % d'événements
          cardiovasculaires majeurs ET −10 % de mortalité toutes causes par mmol/L de LDL abaissé.
        position_outil: >-
          En prévention primaire chez le diabétique, l'outil annonce un bénéfice sur les ÉVÉNEMENTS
          cardiovasculaires, et dit explicitement que la réduction de la mortalité totale n'y est pas
          démontrée.
        appui: >-
          Les essais conçus pour le diabète ne montrent pas cette réduction : CARDS s'arrête à p = 0,059,
          la méta-analyse dédiée est non significative, ASPEN est nul. Le −10 % de mortalité provient de
          méta-analyses mixtes, portées par la prévention secondaire — le transposer à la prévention
          primaire du diabétique serait une extrapolation.
      - sujet: "CK au-delà de 10 fois la normale sous traitement"
        position_officielle: >-
          La recommandation française écrit qu'au-delà de 10 N la statine est arrêtée « permanently ».
        position_outil: >-
          L'outil propose une interruption TEMPORAIRE de 4 à 6 semaines, puis une réintroduction à dose
          plus basse. La position française est portée dans l'option, pas effacée.
        appui: >-
          Le parcours NHS England fait converger les bandes 4-10 N et 10-50 N vers une seule conduite
          (« stop statin for 4-6 weeks ») et réserve l'arrêt DÉFINITIF à la seule myosite nécrosante
          auto-immune. Aucune donnée n'établit qu'un franchissement ponctuel de 10 N prédise une
          intolérance définitive — et fermer la classe à un patient à haut risque qui pourrait la tolérer
          autrement a, lui, un coût mesurable en événements évités.
    explication: >-
      Sur le socle, aucun désaccord : la statine est indiquée chez le diabétique à risque, l'intensité
      monte avec le risque, et le bénéfice en prévention secondaire est solidement établi. La
      recommandation française est même proche de l'outil sur plusieurs points qu'on croirait disputés —
      elle encadre l'initiation au risque modéré par une décision partagée, et individualise le sujet de
      plus de 75 ans. Les écarts ci-dessus portent sur le GRAIN de la décision : ce qui la pilote, ce qu'on
      annonce comme bénéfice, et ce qu'on fait d'une élévation de CK. À noter, sans que cela vaille
      argument : la recommandation française, comme ses homologues internationales, est cosignée par des
      experts aux liens industriels étendus avec les fabricants d'hypolipémiants. Ce contexte pèse sur le
      versant agressif — cibles très basses, escalade — pas sur le socle, qui reste solidement établi.
# NOTES DE COUVERTURE DU BANC (jamais affichées — elles ne disent rien de clinique et vivaient à tort
# dans `incertitudes`, cf. D48) :
#   — Bande CK 10-50 N : le générateur de profils figés tire 0, 3, 4, 5 et 60 pour `CK_x_normale`. La
#     bande qui déclenche la vérification de la fonction rénale n'est représentée par AUCUN profil du
#     golden master ; elle est couverte par la seule vignette F-24 (20 N posé explicitement). Ne pas lire
#     le golden master comme une couverture de cette bande.
#   — `autres_FDRCV` acceptait des valeurs hors domaine (ex. -1), qui faisaient basculer la sortie d'un
#     tier à l'autre. Bornes `min: 0` / `max: 6` ajoutées au schéma et renseignées ici. Second usage des
#     bornes, moins évident : elles empêchent le générateur du banc d'attribuer à un critère les littéraux
#     d'un autre critère cité dans la même règle.
incertitudes:
  - "Mortalité toutes causes en prévention primaire du diabète de type 2 : NON démontrée. Les essais dédiés au diabète sont non significatifs (CARDS p = 0,059 ; ASPEN nul) ; le signal provient des méta-analyses mixtes, portées par la prévention secondaire. L'outil affiche donc le bénéfice sur les événements cardiovasculaires, pas sur la survie."
  - "La frontière entre « discuter » et « traiter » est un jugement de valeur, pas un seuil issu des essais. Le bénéfice RELATIF de la statine est à peu près constant quel que soit le risque (CTT) ; seul le bénéfice ABSOLU décroît. L'outil place la frontière là où s'arrêtent les critères d'enrichissement des essais eux-mêmes (CARDS et HPS recrutaient au moins un facteur de risque, une complication, ou une ancienneté d'au moins 10 ans)."
  - "Le caractère « compliqué » du diabète reste un jugement clinique — atteinte rétinienne, rénale ou neurologique, ou maladie macrovasculaire. La grille française détaille des critères chiffrés (rapport albumine/créatinine, DFG, sévérité de la rétinopathie) qui ne sont pas éclatés ici, pour rester lisible."
  - "SCORE2-Diabetes est une aide à l'estimation du risque absolu, pas une règle de décision : aucun seuil de pourcentage ne commande d'option. Un seuil de modèle serait un artefact, pas une donnée d'essai. Son rappel n'apparaît que dans la situation où il aide vraiment — le patient sans aucun critère de grille — et porte sa réserve de validation : le modèle n'est validé que de 40 à 69 ans, or ce profil est souvent plus jeune."
  - "Prévention primaire après 75 ans : preuve faible. STAREE exclut les diabétiques, PREVENTABLE est en cours. La situation est signalée par une alerte plutôt que modélisée en option distincte."
  - "Dialyse : l'initiation d'une haute intensité est retirée (4D et AURORA sont neutres), mais cette exclusion ne porte PAS sur les options « discuter » et « prévention primaire modérée » — un patient dialysé sans statine en cours peut donc encore les voir s'afficher. Les retirer aussi laisserait certains patients sans aucune conduite affichée, ce qu'un garde-fou du moteur interdit. Limite connue, signalée plutôt que masquée."
  - "Dialysé, en prévention secondaire, jamais traité : le dossier de preuve ne tranche pas. Ni l'excès d'une haute intensité non démontrée en dialyse, ni le sous-traitement d'un risque de prévention secondaire réel ne sont établis. Une alerte restaure le contexte et renvoie à une discussion individualisée, plutôt que d'inventer une conduite. Un essai dédié — statine chez le dialysé en prévention secondaire — trancherait ; il n'existe pas."
  - "Protocole de réintroduction après interruption : le nœud porte celui du parcours NHS England (statine à faible dose, titrée à 8 semaines d'intervalle : atorvastatine 10 ou 20 mg par jour, ou rosuvastatine 5 ou 10 mg par jour). Deux réserves. Ce document date de janvier 2022 et sa date de révision, janvier 2024, est dépassée. Et NICE porte, dans NG238, son PROPRE protocole de réintroduction, distinct : les deux coexistent, l'outil a retenu le premier parce que les autres conduites du volet CK en découlent. Une mise à jour devra vérifier lequel fait référence."
  - "Le dosage des CK est demandé devant une intolérance aux STATINES. Le parcours source, lui, le demande devant « une douleur musculaire généralisée persistante et inexpliquée, liée ou non à un traitement hypolipémiant antérieur » — c'est-à-dire aussi chez un patient qui n'a jamais pris de statine. Ce patient-là n'entre pas dans la case, et son dosage ne sera pas demandé avant initiation. Écart assumé, pour ne pas ajouter un critère de saisie ; il se comblerait par un booléen « douleur musculaire persistante inexpliquée »."
  - "Le nœud oriente vers les alternatives à la statine sans piloter leur séquence complète (ézétimibe, puis anti-PCSK9, puis acide bempédoïque) : c'est hors de son périmètre déclaré."
  - "Taux de reprise d'une statine après réintroduction : non affiché, faute de chiffre utilisable. Les valeurs disponibles vont de 72,5 % (série rétrospective) à « plus de 90 % à un an », avec des dénominateurs et des définitions incompatibles. En choisir un reviendrait à inventer une précision qui n'existe pas."
  - "Il n'existe AUCUN essai de morbi-mortalité conduit dans une population DÉFINIE par l'intolérance aux statines, en dehors de CLEAR Outcomes — et dans CLEAR lui-même l'intolérance est déclarative (« unable or unwilling »), avec 22,7 % de participants encore sous statine à très faible dose. VESALIUS-CV (évolocumab, 12 257 patients, 59 % de diabétiques, MACE-3 −25 %) et ORION-4 contiennent certainement des intolérants sans être des essais d'intolérance : le premier a été mené sur fond de traitement optimisé, 68 % sous statine de haute intensité. Écrire « chez des patients intolérants » à leur propos serait faux."
  - "Place de l'acide bempédoïque : les recommandations divergent entre elles. La reco française le qualifie de traitement de dernier recours ; l'ESC 2025 le place en classe I niveau B chez le patient qui ne peut pas prendre de statine. La nuance compte : la mention française est une phrase de texte courant, NON graduée, et la table des recommandations graduées ne contient rien sur cette molécule — il n'y a donc pas d'écart de RANG à opposer, seulement un écart de PLACE. Les deux positions sont portées dans l'option, sans trancher entre elles. La reco française rapporte d'ailleurs CLEAR Outcomes fidèlement (« −13 % de MACE, −23 % d'infarctus, sans effet sur l'AVC ni la mortalité ») : le désaccord ne vient pas d'une lecture biaisée des chiffres."
  - "L'âge est recueilli mais n'entre dans AUCUNE condition d'option : il ne joue que dans l'alerte du sujet de plus de 75 ans en prévention primaire. C'est délibéré — un diabétique de 30 ans avec deux facteurs de risque est traité comme un diabétique de 60 ans avec deux facteurs de risque, parce que c'est l'ancienneté du diabète, les facteurs de risque et l'atteinte d'organe qui stratifient, pas l'âge. C'est la logique de la grille française, suivie ici sans y ajouter de seuil d'âge qu'aucune donnée ne soutient."
  - "Cibles de LDL en prévention secondaire et en très haut risque : le sujet est évolutif (essais de ciblage intensif par ézétimibe et anti-PCSK9). Hors du périmètre de ce nœud, à suivre en veille."
  - "Les recommandations officielles sur les dyslipidémies — française comme internationales — sont cosignées par des experts aux liens industriels étendus avec les fabricants d'hypolipémiants et d'anti-PCSK9. Ce contexte pèse sur le versant agressif (cibles très basses, escalade), pas sur le socle « statine chez le diabétique à risque », qui reste solidement établi."
