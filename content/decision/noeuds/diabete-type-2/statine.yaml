# Nœud F « Statine chez le diabétique » — BROUILLON (2026-07-26, en attente de revalidation clinique).
# Autorité : docs/decision/noeuds/F-statine.md (dossier de preuve : agents A × red-team B (essais + reco) ×
# OpenEvidence OE-F1→F5, PMID/DOI vérifiés contre source primaire) §1-8 + .argumentaire.md (niveau 3) ; §9
# (2026-07-26) porte les arbitrages référent de ce lot (recette in-app 2026-07-25/26). Le nœud avait été
# VALIDÉ référent (Thibault) + vérifié bi-agents le 2026-07-23 (pipeline étape 8, feu vert : 0 finding
# HAUTE) ; CE LOT LE REPASSE EN BROUILLON (CLAUDE.md invariants 4/6) — revalidation clinique référent
# restante avant `statut: valide`. Les valeurs cliniques ne se modifient pas hors workflow veille →
# algorithme (D5).
#
# NŒUD ORDERED-FIRST-MATCH (D11) : sortie UNIQUE, échelle de risque — le patient relève d'UN tier, la 1re
# option satisfaite dans l'ordre l'emporte, le `default` en dernier. `priorite` ignoré dans ce mode.
# 4 OPTIONS depuis le 2026-07-27 : haute intensité → discuter → TERMINALE (statine indisponible) → repli.
# L'ORDRE porte ici une garantie de sécurité, et c'est le seul endroit du nœud où c'est le cas : le repli
# `default` ne porte AUCUNE exclusion et n'en a pas besoin, parce que la terminale le précède et capte
# exactement les patients qu'il faudrait lui retirer. Déplacer la terminale rouvrirait la faille en silence
# — voir le commentaire porté par le repli lui-même.
# ORTHOGONAL aux nœuds glycémiques (A/B/C/D/E) : la statine se décide INDÉPENDAMMENT de l'HbA1c et du
# traitement antidiabétique. `prevention` n'est PAS une variable : prévention secondaire ⟺ ASCVD_etablie
# (une seule source de vérité, cf. dossier §1). Pas de critère LDL : la statine est indiquée indépendamment
# du LDL de base (HPS) et l'outil ne pilote pas par une cible chiffrée (position « pas de cible dogmatique »).
# STRATIFICATION du risque en prévention primaire par des FACTEURS ANCRÉS SUR LES ECR (CARDS/HPS), alignés sur
# la grille française 2026 (v0.3, « que dit l'EBM ») : diabète NON compliqué + RÉCENT (< 10 ans) + SANS autre
# FDR = risque faible → décision partagée ; sinon (≥ 1 FDR OU diabète compliqué OU ancienneté ≥ 10 ans) →
# traiter. Fondement EBM : le bénéfice relatif de la statine est ~constant quel que soit le risque (CTT), donc
# il n'existe PAS de seuil-EBM ; la population PROUVÉE est celle des ECR (CARDS = 40-75 ans + ≥ 1 FDR ; ASPEN,
# plus bas risque, est nul). `age` est DÉLIBÉRÉMENT NON DÉCISIF sur cette stratification (référent,
# 2026-07-26, F-statine §9.4, 2ᵉ série : une règle `age >= 40` proposée par un lot précédent a été REJETÉE —
# « tout dépend de l'ancienneté du diabète et des atteintes d'organe, on colle à la grille ») ; `age` n'agit
# QUE via l'alerte > 75 ans ci-dessous — voir le commentaire porté par le critère `age` dans
# `criteres_entree`, ci-dessous. SCORE2-Diabète = AIDE à l'estimation du risque absolu (seuils FIXES ESC
# 2023, validé 40-69 ans), PAS un gate (un seuil % serait un artefact de modèle, pas une donnée d'ECR ;
# l'ancien encodage âge-bandé était une erreur méthodo — red-team) ; depuis le 2026-07-26 (F-statine §9.5,
# 2ᵉ série), son alerte est CIBLÉE sur le tier « discuter » (seule situation où l'estimation sert, référent)
# et porte la réserve de validation ESC 2023 — un profil sans critère de grille étant souvent jeune, donc
# potentiellement hors de la plage 40-69 ans.
# 5 ALERTES (D15, D21) : > 75 ans en prévention primaire = individualiser ; dialyse = rappel EBM (4D/AURORA
# neutres) — depuis le 2026-07-26 (D21, F-statine §9.1), l'INITIATION est en outre retirée par une
# `exclusion` structurelle sur l'option haute intensité (`dialyse == true AND statine_deja_en_place ==
# false`) plutôt que seulement affirmée par l'alerte (contradiction relevée en recette, cf. changelog) ;
# intolérance RAPPORTÉE = rappel EBM (> 90 % des symptômes musculaires non attribuables, réintroduction en
# aveugle, choix de molécule) — reciblée le 2026-07-27 sur la seule valeur `rapportee` : adressée à un
# patient dont l'intolérance est AVÉRÉE, elle l'inviterait à ignorer son propre dossier ; SCORE2-Diabète = aide ciblée sur le tier « discuter » uniquement, réserve de validation 40-69
# ans (F-statine §9.5) ; rappel « risque absolu, pas de cible LDL » (alerte `default`, désormais scindée du
# volet SCORE2 qu'elle portait jusqu'ici).
# 2 ALERTES D'OPTION supplémentaires (D21, schéma § additions) depuis le 2026-07-26 — correctif du finding
# HAUTE-4 (`docs/decision/validation/chantier-2026-07-26/redteam-clinique-securite.md`) : le nœud est en
# ORDERED-FIRST-MATCH, donc quand l'exclusion dialyse ci-dessus retire « haute intensité », la boucle
# continue vers l'option suivante — laquelle ignore tout de l'ASCVD. Un patient dialysé, ASCVD établie, PAS
# encore sous statine atterrissait donc sur « discuter » (faible risque) ou sur le repli (prévention
# primaire modérée), présenté à tort comme un patient à faible risque absolu. Corrigé par une alerte PORTÉE
# PAR CHACUNE de ces deux options (`options[].alertes`, visible UNIQUEMENT quand l'option est réellement
# applicable — D21 : « le fait qualifie un geste sans l'interdire »), sur
# `ASCVD_etablie == true AND dialyse == true AND statine_deja_en_place == false` : elle restaure le contexte
# perdu par l'exclusion SANS toucher aux `conditions` (qui resteraient fausses pour ce cas de toute façon —
# router ces options sur l'ASCVD les videraient pour les patients réellement à faible risque). Un patient de
# prévention SECONDAIRE ne doit JAMAIS être présenté comme à faible risque absolu, quel que soit le tier
# atteint — voir `incertitudes` pour ce que le dossier NE tranche PAS (la conduite optimale pour ce
# sous-groupe précis).
# DÉFINITIONS (validées référent 2026-07-23, complétées §9.1 le 2026-07-26) : `diabete_complique` (bool) =
# toute atteinte d'organe cible (rétinopathie, néphropathie / albuminurie, neuropathie) OU maladie
# macrovasculaire non-ASCVD — SEUL booléen du domaine qui portait `confirmation_requise: true` (D20,
# F-statine §9.2 ; `ASCVD_etablie`/`dialyse` explicitement écartés par le référent SOUS L'ANCIEN RÉGIME).
# MISE À JOUR D30/T-018 (P4/S1, 2026-07-28) : le défaut « bool non répondu = déterminé » qui rendait cette
# déclaration nécessaire est désormais INVERSÉ pour tout le domaine — `diabete_complique` perd le champ
# (il reste indéterminé tant que non répondu, comme avant, mais par le NOUVEAU défaut universel, plus
# besoin de le déclarer) ; `ASCVD_etablie` reçoit `presomption_non: true` (éligible mécaniquement — ne
# garde aucune `exclusions`/option `role: securite` de ce nœud, cohérent avec le choix référent d'alors) ;
# `dialyse`, en revanche, garde une `exclusions` réelle sur ce nœud (« Statine de haute intensité —
# prévention secondaire ») et N'EST PLUS éligible sous le nouveau régime, plus strict — il devient
# indéterminé tant que non répondu, alors qu'il était présumé « non » sous l'ancien régime. `autres_FDRCV` = compte des
# facteurs de risque CV additionnels (HTA, tabac, dyslipidémie, hérédité CV précoce…) ;
# `statine_deja_en_place` (bool) = statine déjà prescrite (distingue INITIATION de POURSUITE, F-statine
# §9.1) ; `intolerance_statine` (ENUM depuis le 2026-07-27 : non / rapportee / averee) — `rapportee` =
# intolérance/effet indésirable sous statine rapporté par le patient, sans épreuve ; `averee` = intolérance
# établie, qui rend la classe indisponible pour ce patient et RETIRE les options de statine ;
# `CK_x_normale` (nombre, 0 = non dosé ; visible seulement si une intolérance est rapportée ou avérée)
# = CK en multiples de la normale. Trois seuils agissent : > 4 contre-indique l'INITIATION et déclenche,
# sous traitement, l'interruption de 4-6 semaines ; > 10 y ajoute la vérification de la fonction rénale ;
# > 50 impose un avis spécialisé urgent (rhabdomyolyse).
# Libellés d'intensité (Table 4 SFE/SFD/NSFA/SFC 2026) : haute = atorva 40-80 / rosuva 10-20 ; modérée =
# atorva 10-20 / simva 20-40 / prava 40.
# ⚠ MESSAGES À NE JAMAIS TENIR (dossier §5d) : la statine ne « réduit pas la mortalité toutes causes » en
# prévention primaire du DT2 (non démontré — événements CV seulement) ; ne pas transformer une cible LDL de
# guideline en objectif dur ; ne pas initier en dialyse (exclusion structurelle sur l'option haute
# intensité seulement — limite connue sur « discuter »/repli, cf. changelog 2026-07-26) ; le « diabète
# induit par statine » est SANS OBJET chez un patient déjà diabétique ; ne JAMAIS présenter un patient ASCVD
# établie comme « à faible risque absolu » ou « en prévention primaire », quel que soit le tier atteint
# (HAUTE-4, corrigé le 2026-07-26 par les 2 alertes d'option ci-dessus) ; ne JAMAIS prêter à l'acide
# bempédoïque un bénéfice de mortalité (CLEAR Outcomes : décès CV HR 1,04, toutes causes HR 1,03 —
# estimations ponctuelles DÉFAVORABLES, pas seulement « neutres ») ; ne jamais écrire qu'un essai de
# morbi-mortalité a été mené « chez des patients intolérants » en dehors de CLEAR Outcomes, ni présenter la
# place française de l'acide bempédoïque comme un RANG opposable à la classe I de l'ESC (la mention
# française n'est pas graduée — red-team 2026-07-27).
id: statine
domaine: diabete-type-2
titre: "Prescrire une statine dans le DT2"
population_cible: >-
  Adulte DT2, hors DT1 et grossesse (statines contre-indiquées pendant la grossesse). Décision du volet
  lipidique de la prévention cardiovasculaire, indépendante de l'HbA1c et du traitement antidiabétique.
  Couvre à la fois l'INITIATION et la POURSUITE d'une statine déjà en place, ainsi que la
  situation d'intolérance aux statines déclarée (à TROIS valeurs : non, rapportée, avérée) ainsi que la
  contre-indication biologique par des CK > 5 N avant
  initiation. Une option TERMINALE couvre le patient pour qui la statine n'est pas
  disponible et l'oriente vers les alternatives hypolipémiantes : il n'existe plus de profil à qui cet
  outil propose une statine que le dossier du patient déclare contre-indiquée. Hors périmètre :
  hypercholestérolémie familiale (prise en charge spécifique), intensification par ézétimibe / anti-PCSK9
  si la cible n'est pas atteinte sous statine maximale tolérée, séquence complète des alternatives au-delà
  de l'orientation, et PROTOCOLE de réintroduction en aveugle (lavage, seuils, paliers de dose) — sa seule
  source détaillée n'a pas pu être ouverte, et n'est pas encodée à partir d'une source de seconde main
  (cf. Incertitudes).
selection: ordered-first-match
argumentaire_exhaustif: "statine.argumentaire.md"
criteres_entree:
  # `age` est délibérément NON DÉCISIF sur les options et n'agit que via l'alerte « > 75 ans » ci-dessous
  # (décision référent 2026-07-26, F-statine §9.4, 2ᵉ série). Un lot précédent avait proposé un gate
  # `age >= 40` : le référent l'a REJETÉ — « tout dépend de l'ancienneté du diabète et des atteintes
  # d'organe. On colle à la grille. » La stratification traiter/discuter reste gouvernée UNIQUEMENT par
  # `anciennete_diabete_annees`, `autres_FDRCV` et `diabete_complique` (grille française 2026). NE PAS
  # câbler `age` dans une condition d'option sans nouvelle décision référent explicite : une future passe
  # de l'invariant générique R5 (« un critère qu'on demande doit agir ») verrait `age` inerte hors de
  # l'alerte et serait tentée de le brancher dans une option — ce qui annulerait cette décision référent
  # sans que personne ne s'en aperçoive. Ce commentaire EST la trace qui doit l'en empêcher.
  - nom: age
    # `partage` ajouté le 2026-07-29 (recette référent, item F) : même concept, encodage IDENTIQUE
    # sur tous les nœuds qui le déclarent (type, valeurs, bornes) — condition de l'invariant I19.
    partage: true
    type: nombre
    min: 18
    max: 105
  - nom: ASCVD_etablie
    # `partage` ajouté le 2026-07-29 (recette référent, item F) : même concept, encodage IDENTIQUE
    # sur tous les nœuds qui le déclarent (type, valeurs, bornes) — condition de l'invariant I19.
    partage: true
    type: bool
    # T-018 (P4/S1, D30) : éligible mécaniquement à presomption_non (ne participe à aucune condition
    # d'option `role: securite` ni à aucune `exclusions` de ce nœud — seulement des `alertes`, canal
    # distinct). Partagé avec `prescription`, où il est ÉGALEMENT éligible (pas de divergence I4/S7).
    presomption_non: true
  - nom: anciennete_diabete_annees
    # `partage` ajouté le 2026-07-29 (recette référent, item F) : même concept, encodage IDENTIQUE
    # sur tous les nœuds qui le déclarent (type, valeurs, bornes) — condition de l'invariant I19.
    partage: true
    type: nombre
    min: 0
    max: 60
  # Borne ajoutée le 2026-07-26 (table validée par le référent, docs/decision/GRAMMAIRE-NOEUD.md) :
  # corrige le défaut signalé ci-dessous jusqu'ici (recette 2026-07-26, défaut 13.4) — une valeur hors
  # domaine (ex. -1) faisait basculer la sortie d'un tier à l'autre. `min`/`max` bloque la saisie côté
  # formulaire (components/CriteriaForm.tsx) et filtre les littéraux étrangers extraits par les deux
  # générateurs de valeurs candidates du banc (engine/banc/profils.ts, engine/relevance.ts).
  - nom: autres_FDRCV
    type: nombre
    min: 0
    max: 6
    # `aide` ajouté T-069 (P9/S2, 2026-07-30) : liste reprise du commentaire déjà présent en tête de fichier
    # (« autres_FDRCV = compte des facteurs de risque CV additionnels »), pour qu'elle soit lisible à
    # l'écran et non plus seulement en commentaire.
    aide: >-
      Facteurs de risque cardiovasculaire additionnels à compter, au-delà du diabète lui-même :
      hypertension artérielle, tabac, dyslipidémie, antécédent familial cardiovasculaire précoce.
  - nom: diabete_complique
    type: bool
  - nom: dialyse
    type: bool
  - nom: statine_deja_en_place
    type: bool
    # Remontée UI (2026-07-29) : le libellé de section précédent, « Statine en cours », se lisait comme
    # une CONDITION (« ne remplir que si le patient a déjà une statine ») alors que c'est la question
    # elle-même qui détermine si oui ou non — même convention que « Traitement actuel et contrôle » sur
    # `prescription`/`insuline` (un intitulé neutre, jamais une instruction de saisie conditionnelle).
    groupe: Traitement actuel
  # DE BOOLÉEN À TROIS VALEURS (décision référent 2026-07-27, 6e série). Le booléen ne disait qu'une chose :
  # « le patient rapporte une intolérance ». Or les deux situations qu'il confondait n'appellent pas la même
  # conduite, et la donnée le montre nettement :
  #   - INTOLÉRANCE RAPPORTÉE, non éprouvée → la conduite est la RÉINTRODUCTION EN AVEUGLE, pas le
  #     renoncement. Chez des patients déjà étiquetés intolérants et réintroduits en aveugle, l'excès réel
  #     porte sur l'ARRÊT du traitement, pas sur les symptômes : Aebi 2025 (13 ECR, 1 868 participants)
  #     donne symptômes OR 1,19 (0,86-1,64) NON significatif mais arrêt OR 1,48 (1,03-2,12) significatif ;
  #     Kraut 2023 donne RR d'intolérance 1,40 (1,23-1,60), NNH 10 (chiffre PUBLIÉ dans le résumé).
  #   - INTOLÉRANCE AVÉRÉE → la statine n'est pas disponible pour ce patient, et lui afficher une carte qui
  #     en prescrit une est une prescription que son dossier falsifie (voir l'option terminale, plus bas).
  # ENUM ET NON `liste` : les trois valeurs sont MUTUELLEMENT EXCLUSIVES (un patient n'est pas à la fois
  # « non » et « avérée »). `liste` est le type des sélections multiples de ce dépôt (`traitements_en_cours`).
  # La description de l'arbitrage parlait de « liste à 3 valeurs » au sens courant du mot ; l'encodage fidèle
  # à ce qu'elle désigne est `enum`.
  # LA DISTINCTION A UNE CONSÉQUENCE ADMINISTRATIVE RÉELLE EN FRANCE, ce qui achève de la justifier : la HAS
  # conditionne le remboursement de l'acide bempédoïque à une intolérance « AVÉRÉE » ET à un traitement
  # hypolipémiant optimisé « incluant au moins l'ézétimibe » (avis de la Commission de la transparence,
  # NILEMDO 180 mg, adopté le 12/02/2025).
  - nom: intolerance_statine
    type: enum
    groupe: Tolérance de la statine
    valeurs: [non, rapportee, averee]
  # GARDE-FOU CK — REPRIS le 2026-07-27 (soir) sur SOURCE PRIMAIRE, après que le référent a récupéré les
  # deux documents NICE que ni la collecte ni le red-team n'avaient pu ouvrir (403 répétés) :
  # `docs/decision/sources/statin-intolerance-pathway.pdf` et `docs/decision/sources/NICE 2023.pdf`.
  #
  # IDENTITÉ EXACTE DU PATHWAY, à connaître avant de s'y appuyer — et c'est une CORRECTION D'ATTRIBUTION
  # du même type que le « convention KDIGO » corrigé le matin même sur `prescription` : ce protocole n'est
  # PAS dans NG238. C'est un document NHS England (AAC Clinical Subgroup, auteurs R. Khatib et D. Neely),
  # daté de janvier 2022, « endorsed by NICE Dec 2021 », qui se rattache à CG181 — la recommandation que
  # NG238 a remplacée en décembre 2023 — et qui porte « Review date: Jan 2024 ». Il a donc dépassé sa
  # propre date de révision et renvoie à un référentiel remplacé. Le référent a décidé de l'utiliser
  # malgré cela, en portant la réserve : c'est la conduite à tenir la plus concrète de tout le dossier.
  #
  # ⚠ CORRECTION DU 2026-07-27 (soir) — ce commentaire, et trois autres endroits du fichier, affirmaient
  # que « rien de plus récent ne le remplace ». C'EST FAUX, et la source primaire le dit : NG238 porte son
  # PROPRE protocole de réintroduction (§1.9.2-1.9.4) et une section entière « Treatment if statins are
  # contraindicated or not tolerated » (§1.10). Décision référent (Q4, SPEC-passage-statine.md) : retirer
  # les affirmations fausses — cela ne se discutait pas — et MAINTENIR le parcours NHS comme source de la
  # conduite détaillée, parce que basculer sur NG238 rouvrirait les trois autres arbitrages ci-dessous, tous
  # rendus sur le parcours. Le choix de source est donc désormais un choix ASSUMÉ, plus une fausse absence
  # d'alternative. Un lot de veille devra comparer les deux protocoles sur pièces.
  #
  # QUATRE ARBITRAGES RÉFÉRENT, pris sur les divergences que ce document a révélées :
  # 1. QUAND DOSER — « Do not measure CK if person is asymptomatic » (verbatim). Le champ n'apparaît donc
  #    plus qu'à partir du moment où quelque chose est rapporté (`visible_si` ci-dessous). Le nœud demandait
  #    ce dosage à TOUT patient à l'initiation, c'est-à-dire exactement l'examen que la source déconseille.
  # 2. SEUIL À L'INITIATION — 5 N. ⚠ RÉVISÉ le 2026-07-27 (soir), arbitrage A1 : ce point avait d'abord été
  #    tranché à 4 N, « le seuil le plus bas donc le plus prudent », sur la seule confrontation reco
  #    française (« CK levels >5-fold higher than normal are contraindications ») / pathway (« If CK levels
  #    are > 4x ULN do not start statin »). La lecture de NG238 §1.5.7 en source primaire a montré que le
  #    « plus prudent » ne l'était pas : la source pose 5 N AVEC re-dosage à 7 jours, et surtout traite la
  #    bande basse par « débuter à DOSE PLUS FAIBLE » et non par l'abstention. Retenir 4 N revenait donc à
  #    ne PAS traiter un patient que la source veut traiter — une sous-prescription, pas une précaution.
  # 3. AU-DELÀ DE 10 N — arrêt TEMPORAIRE, pas définitif. Divergence la plus lourde des deux documents :
  #    la reco française écrit « statin treatment is stopped permanently » ; le pathway fait converger les
  #    bandes hautes vers la même case, « Stop statin for 4-6 weeks », suivie d'une réévaluation
  #    et d'une réintroduction à dose plus faible. L'arrêt définitif y est réservé à la myosite nécrosante
  #    auto-immune (SRM 6), « avoidance of re-exposure to statins ». Le référent a suivi le pathway : ne pas
  #    fermer définitivement la classe à un patient à haut risque cardiovasculaire qui pourrait la tolérer
  #    autrement. La position française est SIGNALÉE dans l'option, pas effacée.
  # 4. LE PROTOCOLE DE RÉINTRODUCTION EST ENCODÉ, avec sa réserve de date. Le red-team avait demandé de ne
  #    PAS l'encoder tant qu'il était de seconde main ; il ne l'est plus. Au passage, la collecte s'était
  #    trompée dessus : elle annonçait « atorvastatine 20 → 40 mg », le pathway écrit « Atorvastatin 10 or
  #    20 mg OD, or Rosuvastatin 5 or 10mg OD », titrées à 8 semaines d'intervalle.
  #
  # NOMBRE ET NON BOOLÉEN : quatre seuils distincts agissent (4 / 5 / 10 / 50) depuis l'ouverture de la
  # bande basse, un booléen n'en exprimait qu'un.
  # 0 = NON DOSÉ, et c'est le défaut : aucune comparaison `> 4` n'est vraie à 0, donc aucun garde-fou ne se
  # déclenche sur un champ vide — pas besoin du garde `> 0` qu'exigent les seuils par le bas.
  #
  # PORTÉE ÉCRITE DEUX FOIS, DÉLIBÉRÉMENT. `visible_si` n'est lu que par la couche FORMULAIRE
  # (`lib/formLayout.ts`) ; le moteur ne le connaît pas. Chaque expression qui lit ce critère porte donc
  # AUSSI son propre terme de portée (`AND statine_deja_en_place == false` pour l'initiation, `== true`
  # pour la conduite sous traitement) : sans quoi une valeur saisie puis rendue invisible continuerait
  # d'agir. La redondance sert deux choses différentes — l'ergonomie et la correction.
  #
  # ⚠ ÉCART CONNU AVEC LA SOURCE, signalé plutôt que masqué (invariant 6) : le pathway fait doser les CK
  # devant « persistent generalised unexplained muscle pain, whether associated or not with previous
  # lipid-lowering therapy » — c'est-à-dire une douleur musculaire, liée ou non à une statine. Notre
  # `visible_si` s'accroche à `intolerance_statine`, qui parle d'intolérance AUX STATINES. Un patient
  # douloureux n'ayant jamais pris de statine n'entre donc pas dans la case. Le référent a préféré cette
  # solution à un critère supplémentaire ; l'écart est enregistré dans `incertitudes`.
  #
  # CK_UI_L / CK_normale_sup (T-133, P12/S8, 2026-08-03) : remplacent la SAISIE DIRECTE du multiple de la
  # normale. LE DÉFAUT QUI MOTIVE CE CHANGEMENT (N14, motif de la tâche) : le praticien lit « 210 UI/L » sur
  # un compte-rendu de laboratoire et une norme à côté — jamais un multiple déjà calculé. Un praticien a
  # SAISI « 1 » AU JUGÉ pour ce champ faute de mieux : une valeur inventée entrait alors dans un garde-fou
  # de sécurité (les seuils 4/5/10/50 ci-dessus). `CK_normale_sup` est un CHAMP, pas une constante : la
  # borne haute de la normale varie d'un laboratoire à l'autre (et selon le sexe).
  # BORNES (min/max) choisies pour rester à la fois cliniquement plausibles (la borne haute de la normale
  # varie couramment entre 80 et 280 UI/L selon le laboratoire/le sexe ; les CK mesurées vont de la
  # normale à la rhabdomyolyse) ET pour que le banc dynamique (`engine/banc/couverture.test.ts`) explore
  # bien les CINQ bandes du garde-fou (`<= 4`, `]4, 5]`, `]5, 10]`, `]10, 50]`, `> 50`) — aucun seuil
  # littéral ne mentionne `CK_UI_L`/`CK_normale_sup` par leur nom (ils n'apparaissent que dans le
  # `derive` de `CK_x_normale`, sans littéral), le banc retombe donc sur l'échantillonnage de domaine
  # (`profils.ts` `tirageDansDomaine`) plutôt que sur des candidats ciblés par seuil — vérifié
  # empiriquement que ces bornes précises couvrent les cinq bandes avant de les figer ici.
  - nom: CK_UI_L
    type: nombre
    min: 0
    max: 4100
    groupe: Tolérance de la statine
    visible_si: "intolerance_statine != non"
    debut_de_ligne: true
  - nom: CK_normale_sup
    type: nombre
    min: 80
    max: 280
    groupe: Tolérance de la statine
    visible_si: "intolerance_statine != non"
    aide: "Indiquée sur le compte-rendu du laboratoire, à côté de la valeur mesurée."
  - nom: CK_x_normale
    type: nombre
    min: 0
    max: 60
    groupe: Tolérance de la statine
    visible_si: "intolerance_statine != non"
    # DEVENU UN DÉRIVÉ le 2026-08-03 (T-133, P12/S8) — CK_UI_L / CK_normale_sup, CALCULÉ plutôt que SAISI.
    # Les quatre seuils qui le lisent plus bas (`> 4`, `<= 5`, `> 5`, `> 10`, `<= 50`, `> 50`) continuent de
    # fonctionner À L'IDENTIQUE, sans une seule réécriture — c'est tout l'intérêt de garder le MÊME nom.
    #
    # « 0 = NON DOSÉ » (convention du commentaire ci-dessus) : REMPLACÉE par un VRAI non-dosé, pas cassée
    # en silence. Tant que `CK_UI_L` (ou `CK_normale_sup`) n'est pas renseigné, `CK_x_normale` reste
    # INDÉTERMINÉ (D20) — une comparaison qui le lit part EN ATTENTE, elle ne se referme jamais
    # silencieusement sur « CK normales » faute de saisie. C'est le même principe que partout ailleurs
    # dans ce chantier (IMC sur `prescription.yaml`) : la valeur « 0 » qui apparaissait avant sur un
    # formulaire vierge n'était déjà qu'un défaut générique de champ vide (`lib/formLayout.ts`,
    # `valeurParDefaut`), jamais une AFFIRMATION que le moteur pouvait lire comme « dosé, normal » — cette
    # conversion la rend, pour la première fois, réellement INDÉTERMINÉE plutôt que 0 par convention.
    #
    # `visible_si` (présentation, cf. plus haut) reste porté ICI À DESSEIN, même si ce critère n'est plus
    # rendu comme champ (`derive`, `lib/formLayout.ts`) : il documente la PORTÉE clinique du multiple
    # (sans objet hors intolérance rapportée/avérée), inchangée par cette conversion — laissé pour ne pas
    # effacer cette information du contenu, bien que le moteur ne le lise plus sur un critère dérivé.
    derive: "CK_UI_L / CK_normale_sup"
options:
  # ======================================================================================================
  # LES TROIS PREMIÈRES OPTIONS DU NŒUD SONT LES OPTIONS « CK », et leur ordre n'est pas un hasard : en
  # `ordered-first-match`, la première option satisfaite l'emporte. Un patient dont les CK dépassent le
  # seuil relève de ces gestes-là et d'aucun autre — lui afficher d'abord « statine de haute intensité »
  # serait exactement le défaut que D21 corrige ailleurs dans ce fichier.
  #
  # SEUIL PORTÉ DE 4 N À 5 N le 2026-07-27 (soir) — arbitrage référent A1, chantier-2026-07-27. Le seuil
  # de 4 N venait du parcours NHS/AAC et avait été retenu comme « le plus bas donc le plus prudent ».
  # NG238 §1.5.7, lue depuis en source primaire, pose **5 N avec re-dosage à 7 jours**, et surtout traite
  # la bande basse autrement : « *raised but < 5× ULN* → débuter la statine à DOSE PLUS FAIBLE ». Le nœud
  # rendait donc « statine indisponible » à un patient que la source veut traiter — une SOUS-PRESCRIPTION
  # chez un patient dont le risque cardiovasculaire, lui, n'a pas bougé. Les bandes 10 N et 50 N restent
  # inchangées : NG238 ne les couvre pas, le parcours NHS en reste seule source.
  #
  # PÉRIMÈTRE DE LA BANDE BASSE — arbitrage référent Q1 (SPEC-passage-statine.md) : NG238 écrit « toute
  # élévation sous 5 N », ce qui aurait aussi changé la conduite des patients à 1-4 N, aujourd'hui traités
  # à dose pleine sans que rien ne l'ait signalé comme un défaut. Le référent a retenu la lecture
  # RESTREINTE — 4 à 5 N — qui corrige le défaut constaté et ne touche à aucune autre conduite. L'écart au
  # texte de NG238 est assumé et enregistré ici plutôt que masqué (invariant 6).
  #
  # SCISSION DE « INTERROMPRE » — arbitrage référent A2. Le geste d'arrêt est le même pour l'intolérance
  # rapportée et l'intolérance avérée ; c'est la SUITE qui diffère, et une seule carte ne pouvait pas dire
  # les deux. La carte « la classe reste indisponible » porte donc elle-même l'orientation vers les
  # alternatives (arbitrage Q3) : en `ordered-first-match` elle gagne AVANT la carte terminale, et sans
  # cela le patient s'entendrait dire que la classe est fermée sans voir par quoi la remplacer.
  #
  # SOURCE DE LA CONDUITE : NHS England / AAC, *Statin Intolerance Pathway* (janvier 2022, avalisé par
  # NICE en décembre 2021, rattaché à CG181, date de révision dépassée — cf. le commentaire du critère
  # `CK_x_normale`). Les bandes 5-10 N et 10-50 N y convergent vers UNE SEULE case, « Stop statin for 4-6
  # weeks » : c'est pourquoi ces options n'ont qu'un seuil d'entrée et deux alertes qui les qualifient
  # au-delà, plutôt que des options empilées.
  - intitule: "Interrompre la statine 4 à 6 semaines et réévaluer"
    role: securite
    conditions:
      - "intolerance_statine == rapportee AND CK_x_normale > 5 AND statine_deja_en_place == true"
    # P10/S5 (T-082) : la branche brute conjugue 3 comparaisons techniques (« Intolérance aux statines
    # (non / rapportée / avérée) = Rapportée et CK, en multiples de la normale (0 = non dosé) > 5 et
    # Statine déjà en place ») — famille 3 de S3 (conjonction qui décrit UNE seule situation clinique).
    motifs:
      "intolerance_statine == rapportee AND CK_x_normale > 5 AND statine_deja_en_place == true": "intolérance rapportée avec CK au-dessus de 5 fois la normale, sous statine en cours"
    avantages:
      - "Conduite du parcours NHS England / AAC : interrompre la statine 4 à 6 SEMAINES, en documentant le délai d'apparition des symptômes et celui de leur résolution. C'est une interruption d'épreuve, pas un renoncement — elle sert à établir si la statine est bien en cause."
      - "Re-doser les CK à 7 JOURS (NG238 §1.5.7) : c'est ce contrôle qui distingue une élévation transitoire — effort physique, geste récent, cause non médicamenteuse — d'une élévation persistante attribuable au traitement."
      - "Réintroduction ensuite, sous trois conditions cumulatives : CK normalisées, symptômes résolus, et patient asymptomatique depuis au moins 2 semaines. On reprend alors à dose BASSE ou MODÉRÉE d'une statine de haute intensité — atorvastatine 10 ou 20 mg, ou rosuvastatine 5 ou 10 mg — puis on titre à 8 semaines d'intervalle."
      - "Une statine à dose plus faible vaut mieux que pas de statine du tout : c'est la position explicite du parcours. Si la prise quotidienne n'est pas tolérée, un jour sur deux ou deux fois par semaine reste une option — l'atorvastatine et la rosuvastatine ont des demi-vies qui le permettent."
      - "L'intolérance est ici RAPPORTÉE, pas éprouvée : chez des patients étiquetés intolérants puis réintroduits en aveugle, l'excès porte sur l'ARRÊT du traitement et non sur les symptômes (Aebi 2025 : symptômes OR 1,19 non significatif, arrêt OR 1,48). La réintroduction est donc la conduite attendue, pas l'exception."
    inconvenients:
      - "DIVERGENCE DE SOURCES sur ce point précis, et elle porte sur une règle de sécurité : la recommandation française 2026 écrit qu'au-delà de 10 fois la normale la statine est arrêtée DÉFINITIVEMENT. Le parcours NHS ne réserve l'arrêt définitif qu'à la myosite nécrosante auto-immune. Le nœud suit le parcours NHS — pour ne pas fermer définitivement la classe à un patient à haut risque cardiovasculaire qui pourrait la tolérer autrement — mais la position française est ici, et elle est défendable."
      - "Le bénéfice cardiovasculaire des stratégies de réintroduction à dose réduite ou espacée n'est PAS démontré sur critère dur : le parcours l'écrit lui-même (« cardiovascular benefits have not been proven for all the above approaches »). Ce qui est acquis, c'est l'abaissement du LDL."
      - "Provenance à connaître : document NHS England / AAC de janvier 2022, avalisé par NICE en décembre 2021, rattaché à CG181 (remplacée par NG238 en décembre 2023) et portant une date de révision de janvier 2024, dépassée. NG238 porte pour sa part son propre protocole de réintroduction (§1.9.2-1.9.4) et une section « Treatment if statins are contraindicated or not tolerated » (§1.10) : les deux coexistent, le nœud retient le parcours NHS comme source de la conduite détaillée sans affirmer que rien de plus récent n'existe."
    effet_attendu: >-
      Non chiffrable : aucune étude ne mesure le devenir cardiovasculaire de cette séquence. Ce qu'elle
      permet, c'est d'établir l'imputabilité et de récupérer une statine tolérée chez une partie des
      patients — deux cohortes rétrospectives donnent 72,5 % et 70,7 % de reprise après réintroduction,
      chiffres NON comparables entre eux (dénominateurs et définitions différents) et à ne pas présenter
      comme « le » taux de reprise.
    niveau_preuve: faible
    references:
      - kraut-2023
      - aebi-2025
      - samson
      - statinwise
      - gauss-3
      - ctt-symptomes-musculaires
    alertes:
      # Les deux bandes hautes du parcours. D21 : ces faits QUALIFIENT le geste proposé (l'interruption)
      # sans le remplacer — c'est la même interruption, avec un examen de plus ou une urgence en plus.
      # DUPLIQUÉES sur la carte « la classe reste indisponible » ci-dessous : les deux cartes couvrent le
      # même geste d'arrêt, un patient à 20 N peut atterrir sur l'une ou l'autre selon son intolérance.
      - quand: "CK_x_normale > 10 AND CK_x_normale <= 50"
        niveau: attention
        message: >-
          CK entre 10 et 50 fois la normale : vérifier la FONCTION RÉNALE avant tout. Si le débit de
          filtration glomérulaire est stable et normal, la conduite reste l'interruption de 4 à 6 semaines
          décrite ci-dessus. S'il est altéré, évoquer une rhabdomyolyse et demander un avis spécialisé.
          Si les CK ne se normalisent pas malgré l'arrêt et que la faiblesse musculaire progresse, penser
          à la myosite nécrosante auto-immune induite par les statines — c'est la seule situation où le
          parcours proscrit définitivement toute réexposition à la classe.
      - quand: "CK_x_normale > 50"
        niveau: attention
        message: >-
          CK au-dessus de 50 fois la normale : arrêter la statine et évoquer une RHABDOMYOLYSE. Avis
          spécialisé URGENT et évaluation hospitalière — ne pas attendre le dosage de la myoglobinurie
          pour réhydrater. Ce n'est plus la séquence d'interruption-réintroduction décrite ci-dessus.
  # ------------------------------------------------------------------------------------------------------
  # A2, second volet. MÊME GESTE, SUITE DIFFÉRENTE : on interrompt aussi, mais on ne réintroduit pas — la
  # classe est fermée pour ce patient. Q3 : cette carte PORTE l'orientation vers les alternatives, qu'elle
  # duplique de la carte terminale (« Statine indisponible »), parce qu'en `ordered-first-match` elle gagne
  # avant elle. Renvoyer à une carte que le patient ne verra pas n'aurait rien orienté du tout.
  # ⚠ DETTE ASSUMÉE : ce contenu est en DEUX exemplaires dans le fichier. Toute mise à jour de la séquence
  # française (ézétimibe → anti-PCSK9 → acide bempédoïque) doit toucher les deux. C'est le prix explicite
  # de l'arbitrage Q3, préféré au renvoi.
  - intitule: "Interrompre la statine — la classe reste indisponible"
    role: securite
    conditions:
      - "intolerance_statine == averee AND CK_x_normale > 5 AND statine_deja_en_place == true"
    # P10/S5 (T-082) : même défaut que la carte précédente (famille 3 de S3), branche jumelle sur
    # l'intolérance AVÉRÉE plutôt que rapportée.
    motifs:
      "intolerance_statine == averee AND CK_x_normale > 5 AND statine_deja_en_place == true": "intolérance avérée avec CK au-dessus de 5 fois la normale, sous statine en cours"
    avantages:
      - "Interrompre la statine 4 à 6 semaines, comme dans l'intolérance rapportée : le geste d'arrêt et sa surveillance sont identiques. Re-doser les CK à 7 jours (NG238 §1.5.7)."
      - "CE QUI DIFFÈRE : l'intolérance étant AVÉRÉE, la réintroduction n'est pas la suite attendue. Ne pas laisser ce patient sans hypolipémiant pour autant — son risque cardiovasculaire n'a pas diminué, seule la voie pour le réduire s'est fermée."
      - "SÉQUENCE FRANÇAISE À PRENDRE ENSUITE (recommandation SFE/SFD/NSFA/SFC 2026) : ézétimibe seul en premier — « en cas de contre-indication formelle aux statines ou d'intolérance avérée, un traitement par ézétimibe seul peut être envisagé » (§6.1), et c'est le prérequis de remboursement de tout ce qui suit ; puis anti-PCSK9 en 3e ligne ; l'acide bempédoïque y est qualifié de « traitement de dernier recours »."
      - "ACIDE BEMPÉDOÏQUE — le SEUL agent disposant d'un essai de morbi-mortalité mené dans cette population (CLEAR Outcomes, n=13 970) : composite HR 0,87 (0,79-0,96), sous-groupe diabète HR 0,83 (0,72-0,95), réduction ABSOLUE 2,4 %. Prodrogue activée uniquement dans le foie et non dans le muscle, donc sans douleur musculaire significative même chez l'intolérant aux statines (verbatim de la reco française) — c'est ce qui le distingue ici."
    inconvenients:
      - "Ne JAMAIS présenter l'acide bempédoïque comme réduisant la mortalité : dans CLEAR Outcomes, décès cardiovasculaire HR 1,04 et décès toutes causes HR 1,03, tous deux non significatifs et de point estimé DÉFAVORABLE ; aucun effet sur l'AVC. La HAS lui a attribué une ASMR V pour ces motifs précis."
      - "ÉZÉTIMIBE : aucun essai de critère dur ne l'a testé chez l'intolérant. IMPROVE-IT est un ADD-ON chez des patients qui TOLÉRAIENT leur statine — son bénéfice n'y est pas transposable tel quel."
      - "DIVERGENCE DE SOURCES sur l'arrêt : la recommandation française 2026 écrit qu'au-delà de 10 fois la normale la statine est arrêtée DÉFINITIVEMENT ; le parcours NHS ne réserve l'arrêt définitif qu'à la myosite nécrosante auto-immune. Le nœud suit le parcours NHS ; la position française est ici, et elle est défendable."
      - "⚠ « Intolérance avérée » est une qualification CLINIQUE, portée par le praticien : c'est elle qui ferme la classe, et le nœud ne la vérifie pas. Chez des patients étiquetés intolérants puis réintroduits en aveugle, environ un tiers seulement le sont réellement à la statine — et un quart au PLACEBO (Kraut 2023). S'assurer que l'imputabilité a été établie avant de conclure."
    effet_attendu: >-
      Acide bempédoïque, sous-groupe diabète de CLEAR Outcomes : réduction absolue du composite de 2,4 %
      sur un suivi médian de 3,4 ans (chiffre publié). Ézétimibe seul chez l'intolérant : aucun effet
      chiffrable sur critère dur, faute d'essai. L'interruption elle-même n'a pas d'effet chiffrable —
      aucune étude ne mesure le devenir cardiovasculaire de cette séquence.
    # R2 : repris du suivi médian publié de CLEAR Outcomes (40,6 mois), non recalculé.
    delai_benefice: "3-4 ans"
    niveau_preuve: modere
    references:
      - clear-outcomes
      - clear-diabete
      - improve-it-diabete
      - kraut-2023
      - aebi-2025
    contre_indications:
      - "REMBOURSEMENT FR de l'acide bempédoïque : effectif depuis le 12/12/2025, à 65 %, dans un périmètre RESTREINT — intolérance AVÉRÉE et traitement hypolipémiant optimisé « incluant au moins l'ézétimibe ». SMR important dans ce périmètre, insuffisant en dehors ; ASMR V."
      - "PÉRIMÈTRE : cette carte ORIENTE, elle ne pilote pas la séquence complète des alternatives — le nœud déclare ce point hors périmètre depuis l'origine."
    alertes:
      # Mêmes deux bandes hautes que la carte précédente, et pour la même raison (D21 : elles qualifient
      # le geste sans le remplacer). Dupliquées parce que les deux cartes sont mutuellement exclusives.
      - quand: "CK_x_normale > 10 AND CK_x_normale <= 50"
        niveau: attention
        message: >-
          CK entre 10 et 50 fois la normale : vérifier la FONCTION RÉNALE avant tout. Si le débit de
          filtration glomérulaire est stable et normal, la conduite reste l'interruption de 4 à 6 semaines
          décrite ci-dessus. S'il est altéré, évoquer une rhabdomyolyse et demander un avis spécialisé.
          Si les CK ne se normalisent pas malgré l'arrêt et que la faiblesse musculaire progresse, penser
          à la myosite nécrosante auto-immune induite par les statines.
      - quand: "CK_x_normale > 50"
        niveau: attention
        message: >-
          CK au-dessus de 50 fois la normale : arrêter la statine et évoquer une RHABDOMYOLYSE. Avis
          spécialisé URGENT et évaluation hospitalière — ne pas attendre le dosage de la myoglobinurie
          pour réhydrater. Ce n'est plus la séquence décrite ci-dessus.
      - quand: "ASCVD_etablie == true"
        niveau: attention
        message: >-
          Ce patient a une maladie cardiovasculaire ÉTABLIE : il relève de la prévention SECONDAIRE, où le
          bénéfice de l'abaissement du LDL est le mieux démontré et le NNT le plus bas. L'indisponibilité
          de la statine ne diminue en rien son risque absolu — elle rend seulement plus difficile de le
          réduire.
  # ------------------------------------------------------------------------------------------------------
  # A1-b — LA BANDE 4-5 N À L'INITIATION. C'est le défaut de sous-prescription que ce passage corrige :
  # ce patient recevait « statine indisponible », NG238 §1.5.7 demande de le TRAITER, à dose plus faible.
  # Placée AVANT « haute intensité » : en `ordered-first-match`, sans cela un patient ASCVD à 4,5 N
  # recevrait la dose forte que la source écarte précisément.
  # `intolerance_statine == rapportee` et non `!= non` : chez l'intolérant AVÉRÉ la classe est fermée quel
  # que soit le taux de CK — il relève de la carte terminale, pas d'une initiation prudente. Le terme porte
  # aussi le garde de portée exigé par R8/I10 (`CK_x_normale` est masqué quand aucune intolérance n'est
  # déclarée) : les deux rôles coïncident ici, mais ce sont bien deux exigences distinctes.
  - intitule: "Débuter la statine à dose plus faible"
    role: geste
    conditions:
      - "intolerance_statine == rapportee AND CK_x_normale > 4 AND CK_x_normale <= 5 AND statine_deja_en_place == false"
    # P10/S5 (T-082) : même famille 3 (conjonction à 4 termes = une seule situation, la bande basse
    # avant initiation), branche encore plus longue que ses deux voisines ci-dessus.
    motifs:
      "intolerance_statine == rapportee AND CK_x_normale > 4 AND CK_x_normale <= 5 AND statine_deja_en_place == false": "intolérance rapportée avec CK entre 4 et 5 fois la normale, avant initiation de la statine"
    avantages:
      - "NG238 §1.5.7, verbatim : des CK « raised but < 5× ULN » ne contre-indiquent PAS la statine — on débute à DOSE PLUS FAIBLE. Ne pas traiter ce patient reviendrait à lui retirer un bénéfice démontré sur critères durs au motif d'un taux que la source elle-même juge compatible avec le traitement."
      - "Re-doser les CK à 7 JOURS avant de conclure (NG238 §1.5.7) : une élévation modérée est souvent transitoire — effort physique récent, geste traumatique, cause non médicamenteuse."
      - "Dose de départ, reprise du parcours NHS/AAC : atorvastatine 10 ou 20 mg, ou rosuvastatine 5 ou 10 mg, à titrer à 8 semaines d'intervalle selon la tolérance et le LDL obtenu."
    inconvenients:
      - "Le bénéfice cardiovasculaire d'une stratégie à dose réduite n'est PAS démontré sur critère dur chez ce patient précis : ce qui est acquis, c'est l'abaissement du LDL, et le bénéfice relatif ~constant par mmol/L abaissé (CTT). Une dose plus faible abaisse moins, donc protège moins — c'est un compromis de tolérance, pas un équivalent."
      - "PÉRIMÈTRE RESTREINT, écart assumé avec la source : NG238 écrit « toute élévation sous 5 N », le nœud n'ouvre cette carte qu'entre 4 et 5 N. Un patient à 2 ou 3 N reçoit donc la conduite ordinaire, à dose pleine — ce qu'aucune donnée ne signale comme un défaut. L'écart est enregistré plutôt que masqué."
      - "Rappel de portée : les CK ne sont dosées, dans ce nœud, que si une intolérance est rapportée ou avérée — « Do not measure CK if person is asymptomatic » (parcours NHS/AAC). Un patient asymptomatique n'atteint donc jamais cette carte, et c'est voulu."
    effet_attendu: >-
      Non chiffrable tel quel : aucun essai n'a comparé « débuter à dose plus faible » à « ne pas
      débuter » chez un patient aux CK modérément élevées. Le bénéfice attendu est celui d'une statine à
      dose basse ou modérée, proportionnel au LDL abaissé (CTT : événements vasculaires majeurs RR ~0,79
      par 1 mmol/L chez le diabétique).
    niveau_preuve: faible
    references:
      - ctt-symptomes-musculaires
    alertes:
      - quand: "ASCVD_etablie == true"
        niveau: attention
        message: >-
          Ce patient a une maladie cardiovasculaire ÉTABLIE : il relèverait sans ces CK d'une statine de
          HAUTE intensité, où le bénéfice est le mieux démontré. La dose plus faible proposée ici est un
          compromis de sécurité biologique, pas la dose cible — re-doser les CK à 7 jours et titrer dès
          que le taux le permet.
  - intitule: "Statine de haute intensité — prévention secondaire"
    role: geste
    conditions:
      - "ASCVD_etablie == true"
    avantages:
      - "Bénéfice sur critères DURS (mortalité, IDM, AVC, revascularisation), à NNT bas car le risque de base est élevé : événements vasculaires majeurs RR ~0,79 par 1 mmol/L de LDL abaissé chez le diabétique (méta CTT 2008, effet identique aux non-diabétiques) ; NNT ~12-20 sur 5-6 ans dans les sous-groupes de prévention secondaire (CARE, HPS, LIPID)."
      - "Haute intensité justifiée : gain incrémental démontré sur les événements CV non fatals (CTT more-vs-less 2010 : −15 % ; TNT sous-groupe diabète HR 0,75, NNT ~24 sur 4,9 ans)."
    inconvenients:
      - "L'INTENSIFICATION (haute vs modérée) ne réduit PAS la mortalité toutes causes (TNT cohorte totale HR 1,01 ; IDEAL et SEARCH non significatifs sur leur critère principal) : le gain de la haute intensité porte sur les événements CV, pas sur la survie — le bénéfice de mortalité vient de « statine vs rien »."
      - "Risque résiduel majeur (HPS : ~78 % des événements vasculaires majeurs non prévenus). Surcroît de myopathie à très haute dose (simvastatine 80 mg — à éviter, restriction FDA)."
    effet_attendu: >-
      Événements vasculaires majeurs RR ~0,79 par 1 mmol/L de LDL abaissé (CTT diabète) ; NNT ~12-20 sur
      5-6 ans en prévention secondaire (CARE NNT ~12 ; HPS ~20 ; LIPID ~18/6 ans, critère 1aire du sous-groupe
      NS). Intensification haute vs modérée : −15 % d'événements supplémentaires (CTT more-vs-less, NNT ~25 sur
      5 ans). Mortalité : réduite par la statine elle-même, PAS par l'intensification seule (TNT HR 1,01).
    # R2 : extrait de l'`effet_attendu` ci-dessus (« NNT ~12-20 sur 5-6 ans »), non recalculé.
    delai_benefice: "5-6 ans"
    niveau_preuve: eleve
    references:
      - ctt-diabete
      - ctt-more-vs-less
      - care
      - lipid
      - quatre-s
      - tnt
      - prove-it
      - quatre-d
      - aurora
    contre_indications:
      - "Molécules de haute intensité (baisse de LDL ≥ 50 %, SFE/SFD/NSFA/SFC 2026 Table 4) : atorvastatine 40-80 mg ou rosuvastatine 10-20 mg. Prudence d'interaction via le CYP3A4 avec l'atorvastatine (macrolides, azolés, amiodarone, vérapamil/diltiazem, inhibiteurs de protéase) ; préférer la rosuvastatine en cas de co-prescription à risque."
      - "Ne pas INITIER de statine chez un patient déjà en dialyse sans statine en cours (exclusion structurelle ci-dessous, voir alerte) ; grossesse."
    # T-076 (P9/S9) — aperçu affiché dans le titre du dépli REPLIÉ, reprenant exactement les molécules/
    # doses déjà écrites dans `contre_indications` ci-dessus (séparateur « / » au lieu de « ou », pour
    # tenir sur une ligne de titre — aucune information ajoutée ni recalculée). Cas exact cité par le
    # rapport de recette S9 : « la bonne réponse est là, et l'écran me la cache derrière un mauvais
    # titre ». Application volontairement limitée à CETTE option pour ce lot (hors périmètre S9 :
    # généraliser à d'autres options).
    apercu: "atorvastatine 40-80 mg / rosuvastatine 10-20 mg"
    # D21 (2026-07-26, F-statine §9.1) : l'alerte dialyse interdisait ce que rien ne retirait — cette
    # exclusion corrige la contradiction la plus sévère relevée en recette (« ne pas INITIER » affiché à
    # côté de « Statine de haute intensité »). Bornée à l'INITIATION (`statine_deja_en_place == false`) :
    # la poursuite d'une statine déjà en place reste possible, conformément au texte même de l'alerte.
    # PAS étendue aux options « discuter »/repli (invariant générique I2′, `engine/banc/invariants.test.ts`
    # — jamais de sortie vide quand tout est renseigné ; ce nœud, en `ordered-first-match` à 3 options,
    # n'a pas de 4e filet derrière le repli) : limite documentée en `incertitudes` et dans le changelog.
    # D21 (2026-07-27, 6e série) — MÊME DÉFAUT QUE LA DIALYSE, AUTRE CAUSE. Jusqu'ici, un patient ASCVD dont
    # l'intolérance était AVÉRÉE recevait d'abord et uniquement cette carte — « atorvastatine 40-80 mg ou
    # rosuvastatine 10-20 mg » — contredite par une seule alerte de nœud. C'est-à-dire une carte qui PRESCRIT
    # un geste que le dossier du patient déclare indisponible : exactement la configuration que D21 existe
    # pour interdire, et le défaut corrigé sur CE nœud six semaines plus tôt (« l'alerte dialyse interdisait
    # ce que rien ne retirait »). Une alerte QUALIFIE un geste ; elle ne le retire pas.
    # L'exclusion ne porte QUE sur `averee` : une intolérance seulement RAPPORTÉE ne retire rien — la conduite
    # y est la réintroduction en aveugle, pas le renoncement (cf. le critère et l'alerte de nœud).
    exclusions:
      - "dialyse == true AND statine_deja_en_place == false"
      - "intolerance_statine == averee"
      - "intolerance_statine != non AND CK_x_normale > 5 AND statine_deja_en_place == false"
  - intitule: "Discuter la statine"
    role: geste
    conditions:
      - "anciennete_diabete_annees < 10"
      - "autres_FDRCV == 0"
      - "diabete_complique == false"
    # P10/S5 (T-082) : `anciennete_diabete_annees < 10` se lit déjà telle quelle (même registre que
    # « IMC ≥ 30 », S3) — aucun motif. Les deux autres branches méritent un motif : `autres_FDRCV == 0`
    # s'affiche « = 0 » (comparaison arithmétique, pas une phrase clinique) ; `diabete_complique == false`
    # traîne le libellé long du critère (définition entière de la complication) dans une tournure « : non »
    # — famille 1/2 de S3 (garde exposée en comparaison technique / libellé verbeux).
    motifs:
      "autres_FDRCV == 0": "aucun autre facteur de risque cardiovasculaire"
      "diabete_complique == false": "diabète non compliqué (pas d'atteinte d'organe)"
    # Même motif que l'option précédente : cette carte propose elle aussi une statine (« décision partagée »
    # sur l'initiation). Sans cette exclusion, l'ordered-first-match l'aurait offerte en repli au patient
    # intolérant avéré retiré de l'option de haute intensité — en le présentant, de surcroît, comme un
    # patient à faible risque absolu.
    exclusions:
      - "intolerance_statine == averee"
      - "intolerance_statine != non AND CK_x_normale > 5 AND statine_deja_en_place == false"
    avantages:
      - "Diabète RÉCENT (< 10 ans), NON compliqué (pas d'atteinte d'organe rétinienne / rénale / neurologique ni de maladie macrovasculaire) et SANS autre facteur de risque cardiovasculaire : le risque absolu est faible, en-deçà des populations où le bénéfice a été démontré par ECR (CARDS a inclus des diabétiques 40-75 ans AVEC ≥ 1 facteur de risque ; ASPEN, à plus bas risque, est nul). Le bénéfice ABSOLU d'une statine y est faible → décision partagée plutôt qu'automatisme."
    inconvenients:
      - "Le bénéfice RELATIF des statines est ~constant quel que soit le risque (CTT : ~21 % par mmol/L, même à bas risque — CTT 2012) ; c'est le bénéfice ABSOLU, faible ici, qui justifie la décision partagée."
      - "Réévaluer à chaque consultation : une ancienneté qui atteint 10 ans, l'apparition d'un facteur de risque ou d'une complication font basculer vers le traitement. SCORE2-Diabète (voir rappel) aide à estimer le risque absolu."
    effet_attendu: >-
      Bénéfice absolu faible à ce niveau de risque (peu d'événements évités pour 1000 patients traités) ;
      aucune donnée de mortalité. La reco française 2026 classe ce profil « risque modéré » et fait de
      l'initiation une décision partagée si le LDL reste au-dessus de la cible malgré les mesures d'hygiène.
    niveau_preuve: faible
    references:
      - cards
      - aspen
      - ctt-bas-risque
    # HAUTE-4 (2026-07-26, chantier-2026-07-26/redteam-clinique-securite.md) : cette option n'a AUCUNE
    # condition portant sur `ASCVD_etablie` — un patient ASCVD établie peut l'atteindre via l'exclusion
    # dialyse ci-dessus (option « haute intensité »), l'ordered-first-match continuant vers ce tier sans
    # jamais revoir son statut ASCVD. L'alerte restaure ce contexte, visible SEULEMENT quand cette option
    # est réellement atteinte pour ce patient (D21, § additions au schéma).
    alertes:
      - quand: "ASCVD_etablie == true AND dialyse == true AND statine_deja_en_place == false"
        niveau: attention
        message: >-
          Ce patient a une maladie cardiovasculaire ÉTABLIE (ASCVD) : il relève de la PRÉVENTION
          SECONDAIRE, pas du profil « faible risque » que décrit cette carte. Il n'atteint ce tier que
          parce qu'il est dialysé SANS statine en cours — l'option de haute intensité est retirée faute de
          bénéfice démontré sur critères durs en dialyse (4D, AURORA), PAS parce que son risque
          cardiovasculaire serait faible. Le dossier de preuve ne TRANCHE PAS la conduite optimale pour un
          patient dialysé en prévention secondaire non encore traité (ni l'excès d'une haute intensité non
          prouvée en dialyse, ni le sous-traitement d'un risque cardiovasculaire réel ne sont justifiés par
          la donnée disponible) : à discuter au cas par cas, en tenant compte de ce statut, plutôt qu'à
          déduire du tier affiché.
  # ======================================================================================================
  # OPTION TERMINALE (2026-07-27, 6e série — décision référent). Placée AVANT le repli `default`, qu'elle
  # relaie : c'est elle qui rattrape le patient retiré des trois options précédentes par les deux exclusions
  # ci-dessus, de sorte qu'aucune sortie ne soit jamais vide (invariant I2′) et qu'aucun patient de
  # prévention secondaire ne se retrouve affiché sur une carte de bas risque faute de mieux.
  # POURQUOI UNE OPTION ET NON UNE ALERTE — l'argument est de structure, pas de confort. Une alerte porte un
  # `niveau` et une chaîne de caractères. Une option porte `type_critere` via `sources`, `niveau_preuve`,
  # `effet_attendu`, `delai_benefice`, `avantages`, `inconvenients`, `contre_indications` — c'est-à-dire tous
  # les champs que ce projet a construits pour faire respecter la distinction dur / substitution. Or le fait
  # central de ce dossier (l'acide bempédoïque est le seul agent disposant d'un essai de critère DUR mené
  # dans cette population) est très exactement un objet `type_critere: dur` + `effet_attendu` +
  # `delai_benefice`. L'écrire dans une chaîne d'alerte l'aurait dépouillé de tout ce qui le rend auditable.
  # PÉRIMÈTRE : cette option ORIENTE, elle ne pilote pas la séquence complète des alternatives (le nœud
  # déclare ce point hors périmètre depuis l'origine). Elle nomme ce que les sources françaises nomment, dans
  # l'ordre où elles le nomment, avec le niveau de preuve de chacune.
  - intitule: "Statine indisponible"
    role: securite
    conditions:
      - "intolerance_statine == averee OR intolerance_statine != non AND CK_x_normale > 5 AND statine_deja_en_place == false"
    # P10/S5 (T-082) : la disjonction couvre deux branches, chacune opaque à sa façon. La première
    # traîne le libellé énuméré du critère (« Intolérance aux statines (non / rapportée / avérée) =
    # Avérée ») — famille 2 (libellé interne verbeux). La seconde est une conjonction à 3 termes avec un
    # garde technique (`!= non`) qui dit en fait « intolérance, rapportée ou avérée » — famille 1 + 3.
    motifs:
      "intolerance_statine == averee": "intolérance avérée aux statines"
      "intolerance_statine != non AND CK_x_normale > 5 AND statine_deja_en_place == false": "intolérance (rapportée ou avérée) avec CK au-dessus de 5 fois la normale, avant initiation"
    avantages:
      - "ÉZÉTIMIBE SEUL = la conduite que nomme explicitement la recommandation française : « en cas de contre-indication formelle aux statines ou d'intolérance avérée, un traitement par ézétimibe seul peut être envisagé » (SFE/SFD/NSFA/SFC 2026, §6.1). C'est aussi le prérequis de remboursement de tout ce qui vient après."
      - "ACIDE BEMPÉDOÏQUE = le SEUL agent disposant d'un essai de morbi-mortalité mené dans cette population (CLEAR Outcomes, n=13 970, suivi médian 40,6 mois) : critère composite 11,7 % vs 13,3 %, HR 0,87 (0,79-0,96) ; IDM HR 0,77 ; revascularisation HR 0,81. Sous-groupe DIABÈTE (n=6 373, 45,6 %) : HR 0,83 (0,72-0,95), réduction ABSOLUE de 2,4 % — chiffre publié, pas dérivé."
      - "Propriété décisive dans ce contexte précis : l'acide bempédoïque est une prodrogue activée UNIQUEMENT dans le foie et non dans le muscle, « ce qui réduit le risque de myopathie », avec « aucune douleur musculaire significative, même chez les patients intolérants aux statines » (SFE/SFD/NSFA/SFC 2026, verbatim). C'est ce qui le distingue des autres alternatives chez ce patient."
    inconvenients:
      - "ÉZÉTIMIBE : aucun essai de critère dur ne l'a testé chez l'intolérant. IMPROVE-IT (sous-groupe diabète : HR 0,85 [0,78-0,94], 5,5 % en absolu à 7 ans, p d'interaction 0,02) est un ADD-ON chez des patients qui TOLÉRAIENT leur statine — le bénéfice n'y est pas transposable tel quel. EWTOPIA 75 (ézétimibe seul) est ouvert, contre conseils diététiques, tiré par la revascularisation, neutre sur l'AVC et la mortalité."
      - "ACIDE BEMPÉDOÏQUE — ce que CLEAR Outcomes NE montre PAS : aucun effet sur l'AVC (HR 0,85), et les estimations ponctuelles de mortalité sont DÉFAVORABLES — décès cardiovasculaire HR 1,04 (0,88-1,24), décès toutes causes HR 1,03 (0,90-1,18). Ne jamais présenter cet agent comme réduisant la mortalité. La HAS lui a d'ailleurs attribué une ASMR V, motivée précisément par cette absence de démonstration sur AVC et mortalité, et par l'absence de comparaison à un comparateur actif « alors que celle-ci était possible »."
      - "Effets indésirables de l'acide bempédoïque, en excès net dans CLEAR : goutte 3,1 % vs 2,1 %, lithiase biliaire 2,2 % vs 1,2 % (soit environ un cas supplémentaire pour 100 patients traités, pour chacun des deux)."
      - "L'intolérance de CLEAR Outcomes est DÉCLARATIVE (« unable or unwilling ») et 22,7 % des participants prenaient encore une statine à très faible dose : la population de l'essai n'est pas celle d'une intolérance éprouvée en aveugle."
      - "ANTI-PCSK9 : 3e ligne dans la séquence française, et leurs essais de critère dur (FOURIER, ODYSSEY OUTCOMES) ont été menés SOUS statine — pas chez l'intolérant. Aucun essai de morbi-mortalité n'a été conduit dans une population DÉFINIE par l'intolérance aux statines, en dehors de CLEAR Outcomes."
    effet_attendu: >-
      Acide bempédoïque, sous-groupe diabète de CLEAR Outcomes : réduction absolue du composite de 2,4 % sur
      un suivi médian de 3,4 ans (chiffre publié). Le NNT d'environ 42 qui en découle est une DÉRIVATION,
      absente des publications — le seul NNT réellement publié du dossier est 43, pour la strate prévention
      primaire de CLEAR (JAMA 2023). Mortalité : NON démontrée, estimations ponctuelles défavorables.
      Ézétimibe seul chez l'intolérant : aucun effet chiffrable sur critère dur, faute d'essai.
    # R2 : repris du suivi médian publié de CLEAR Outcomes (40,6 mois), non recalculé.
    delai_benefice: "3-4 ans"
    niveau_preuve: modere
    references:
      - clear-outcomes
      - clear-diabete
      - clear-primaire
      - improve-it-diabete
      - ewtopia-75
      - fourier-diabete
      - odyssey-outcomes-diabete
      - odyssey-alternative
    contre_indications:
      - "SÉQUENCE FRANÇAISE, telle que l'écrit la recommandation 2026 : statine → ézétimibe (2e ligne) → anti-PCSK9 (3e ligne) → acide bempédoïque, qualifié de « traitement de dernier recours ». ⚠ Cette place de dernier recours est une phrase de TEXTE COURANT, non graduée : la table des recommandations graduées de la reco ne contient AUCUNE recommandation sur l'acide bempédoïque — ni classe, ni niveau."
      - "DIVERGENCE ASSUMÉE, à connaître : l'ESC 2025 recommande l'acide bempédoïque en CLASSE I / niveau B chez le patient qui ne peut pas prendre de statine, et l'ESC 2024 en classe I / niveau B en association à l'ézétimibe chez l'intolérant. Les deux sociétés lisent le même essai et en tirent une place différente. La reco française rapporte pourtant CLEAR fidèlement (« −13 % de MACE, −23 % d'IDM, sans effet sur l'AVC ni la mortalité ») : la divergence porte sur la place accordée, pas sur la lecture des chiffres."
      - "REMBOURSEMENT FR de l'acide bempédoïque : effectif depuis le 12/12/2025 (arrêté du 09/12/2025, JORF), à 65 %, dans un périmètre RESTREINT — intolérance AVÉRÉE et traitement hypolipémiant optimisé « incluant au moins l'ézétimibe ». SMR important dans ce périmètre, insuffisant en dehors ; ASMR V. La recommandation française, dont la clôture bibliographique est de septembre 2025, écrivait donc à juste titre qu'il n'était « pas encore commercialisé en France » — ce n'était pas une erreur de sa part."
    alertes:
      # Les deux voies d'accès à cette option n'appellent pas la même conduite : l'une est un constat
      # d'intolérance, l'autre un signal biologique qui demande d'abord un diagnostic. D21 : le fait
      # QUALIFIE le geste proposé sans le retirer — donc une alerte d'option, pas une exclusion de plus.
      - quand: "intolerance_statine != non AND CK_x_normale > 5 AND statine_deja_en_place == false"
        niveau: attention
        message: >-
          Cette carte est atteinte parce que les CK dépassent 5 fois la normale AVANT toute initiation — ce
          qui, dans la recommandation française 2026, est une contre-indication à la statine. Ce n'est PAS
          un constat d'intolérance : la même recommandation demande de doser les CK avant de traiter
          précisément « pour écarter une maladie musculaire chez les sujets à risque de myopathie ». La
          conduite est donc d'abord DIAGNOSTIQUE — chercher la cause de cette élévation — avant de conclure
          que la classe est définitivement indisponible pour ce patient.
      - quand: "ASCVD_etablie == true"
        niveau: attention
        message: >-
          Ce patient a une maladie cardiovasculaire ÉTABLIE : il relève de la prévention SECONDAIRE, où le
          bénéfice de l'abaissement du LDL est le mieux démontré et le NNT le plus bas. L'indisponibilité de
          la statine ne diminue en rien son risque absolu — elle rend seulement plus difficile de le
          réduire. Ne pas laisser ce patient sans traitement hypolipémiant au motif que la statine est
          écartée.
  - intitule: "Statine — prévention primaire"
    role: repli
    conditions:
      - "default"
    # PAS D'EXCLUSION ICI, et c'est structurel — pas un oubli.
    # Ce repli propose lui aussi une statine, donc l'instinct est de le retirer au patient intolérant avéré,
    # comme les deux options précédentes. J'avais écrit ces exclusions ; l'invariant de couverture du banc
    # (`banc/couverture.test.ts` — « chaque option porteuse d'exclusions est exclue pour au moins un
    # profil ») les a immédiatement signalées comme JAMAIS déclenchées, sur 180 profils.
    # Raison : en `ordered-first-match`, l'évaluation s'ARRÊTE à la première option satisfaite. Les
    # conditions de l'option terminale qui précède (`intolerance_statine == averee OR CK_x_normale > 5`)
    # sont exactement complémentaires de ces exclusions : chaque fois que l'une d'elles aurait mordu, la
    # terminale a déjà gagné et ce repli n'est même pas atteint. Le garde-fou était donc du code mort — pire
    # qu'absent, puisqu'il laissait croire à une protection qui n'existait pas.
    # ⚠ CE QUI PROTÈGE RÉELLEMENT CE REPLI, c'est donc la POSITION de l'option terminale, juste avant lui.
    # Déplacer la terminale après ce repli, ou restreindre ses conditions, rouvrirait la faille en silence —
    # sans qu'aucune exclusion ne soit modifiée. C'est le seul point de ce nœud où l'ORDRE porte une garantie
    # de sécurité ; le commentaire est ici pour qu'on ne le découvre pas à l'usage.
    avantages:
      - "Diabétique en prévention primaire à risque non négligeable — ≥ 1 facteur de risque CV additionnel, OU diabète compliqué (atteinte d'organe), OU diabète ancien (≥ 10 ans) : population où la statine réduit de façon ROBUSTE les événements CV majeurs (CARDS : composite HR 0,63, NNT ~27-32 sur ~4 ans ; sous-groupe prévention primaire du HPS RRR 33 %, NNT ~22 sur 5 ans ; méta CTT). La reco française 2026 les classe « risque élevé / très élevé »."
      - "Intensité MODÉRÉE en 1re intention (atorvastatine 10-20 mg, ou simvastatine / pravastatine — dose fixe calée sur le risque), sans course à une cible LDL chiffrée (voir alerte)."
    inconvenients:
      - "La réduction de la MORTALITÉ TOTALE n'est PAS démontrée en prévention primaire chez le diabétique (CARDS : HR 0,73 p=0,059 NS ; méta des essais dédiés au diabète non significative ; ASPEN nul) : le bénéfice porte sur les événements CV, à présenter honnêtement."
      - "Intensité HAUTE réservée au risque très élevé (multiples facteurs de risque, atteinte d'organe) ; sinon la dose modérée suffit — la population démontrée par CARDS/HPS est traitée à dose fixe modérée, et LODESTAR confirme qu'une stratégie de cible n'apporte pas de bénéfice supplémentaire."
    effet_attendu: >-
      Événements CV majeurs : NNT de l'ordre de ~22-37 sur 3-5 ans selon le risque de base (CARDS ~27-32 sur
      3,9 ans ; sous-groupe prévention primaire du HPS ~22 sur 5 ans). Mortalité toutes causes : NON démontrée
      en prévention primaire du DT2 (le signal de mortalité provient des méta-analyses mixtes prévention
      primaire + secondaire, porté par le secondaire).
    # R2 : extrait de l'`effet_attendu` ci-dessus (« NNT ~22-37 sur 3-5 ans »), non recalculé.
    delai_benefice: "3-5 ans"
    niveau_preuve: modere
    references:
      - cards
      - hps
      - ctt-diabete
      - aspen
      - lodestar
      - ctt-bas-risque
    contre_indications:
      - "Molécule d'intensité modérée en 1re intention : atorvastatine 10-20 mg, ou simvastatine 20-40 mg / pravastatine 40 mg (mieux évaluées, moins d'interactions — position EBM). Escalade vers la haute intensité si le risque est très élevé."
      - "En dialyse sans statine en cours, aucun bénéfice n'est démontré sur les critères durs (voir alerte) : discuter au cas par cas l'intérêt d'une initiation à ce stade (ce tier n'a pas d'exclusion structurelle, cf. changelog) ; grossesse contre-indiquée."
    # HAUTE-4 (2026-07-26, chantier-2026-07-26/redteam-clinique-securite.md) : ce repli n'a, par construction
    # (`default`), aucune condition sur `ASCVD_etablie` — un patient ASCVD établie peut l'atteindre via
    # l'exclusion dialyse (option « haute intensité »), l'ordered-first-match continuant jusqu'ici sans
    # jamais revoir son statut ASCVD. Même alerte que sur l'option « discuter » ci-dessus, pour la même
    # raison (D21, § additions au schéma) : visible SEULEMENT quand ce repli est réellement atteint pour ce
    # patient.
    alertes:
      - quand: "ASCVD_etablie == true AND dialyse == true AND statine_deja_en_place == false"
        niveau: attention
        message: >-
          Ce patient a une maladie cardiovasculaire ÉTABLIE (ASCVD) : il relève de la PRÉVENTION
          SECONDAIRE, pas du profil « prévention primaire » que décrit cette carte. Il n'atteint ce tier
          que parce qu'il est dialysé SANS statine en cours — l'option de haute intensité est retirée
          faute de bénéfice démontré sur critères durs en dialyse (4D, AURORA), PAS parce que son risque
          cardiovasculaire serait celui d'une prévention primaire. Le dossier de preuve ne TRANCHE PAS la
          conduite optimale pour un patient dialysé en prévention secondaire non encore traité (ni l'excès
          d'une haute intensité non prouvée en dialyse, ni le sous-traitement d'un risque cardiovasculaire
          réel ne sont justifiés par la donnée disponible) : à discuter au cas par cas, en tenant compte de
          ce statut, plutôt qu'à déduire du tier affiché.
alertes:
  # Libellé corrigé le 2026-07-26 (chantier-2026-07-26/redteam-preuve-statine-sujet-tres-age.md, « Proposition
  # de libellé corrigé pour l'alerte "> 75 ans" », repris tel quel) : le chiffre « ~2,5 ans » est réel et bien
  # transcrit depuis la reco française (SFE/SFD/NSFA/SFC 2026, texte intégral vérifié par le red-team), mais
  # l'ancien libellé le présentait comme une mesure du sujet très âgé alors qu'il provient d'une méta-analyse
  # portant sur des sujets de 50 à 75 ans (Yourman 2021), extrapolation assumée comme telle par la reco
  # elle-même. Correctif = DIRE que c'est une extrapolation, pas retirer le chiffre.
  - quand: "age > 75 AND ASCVD_etablie == false"
    niveau: attention
    message: >-
      Prévention primaire après 75 ans : preuve plus faible et moins directe (méta CTT par âge 2019 ; PROSPER :
      sous-groupe prévention primaire non significatif, pas de bénéfice de mortalité ; aucun essai randomisé
      dédié au sujet très âgé — StAREE exclut les diabétiques, PREVENTABLE en cours). Individualiser selon
      l'espérance de vie, la fragilité et les préférences : le seuil de 2,5 ans avancé par la reco
      SFE/SFD/NSFA/SFC 2026 est extrapolé d'une méta-analyse portant sur des sujets de 50 à 75 ans, faute de
      donnée directe après cet âge — à utiliser comme repère, pas comme mesure. En prévention secondaire
      (ASCVD établie), le bénéfice de la statine persiste à tout âge.
  - quand: "dialyse == true"
    niveau: attention
    message: >-
      Patient en dialyse : le bénéfice d'une statine n'est pas démontré sur les critères durs dans cette
      population (4D chez le DT2 hémodialysé : critère principal RR 0,92 NS, avec un signal d'AVC fatal ;
      AURORA : neutre malgré −43 % de LDL). Chez un patient dialysé SANS statine en cours, l'option de haute
      intensité (prévention secondaire) n'est plus proposée par cet outil — retrait structurel, pas
      seulement un rappel. Si une statine est DÉJÀ en place, sa poursuite reste raisonnable et les options
      ci-dessus s'appliquent normalement. En maladie rénale chronique NON dialysée, la statine reste indiquée.
  # A1-c (arbitrage référent, 2026-07-27 soir) — RASSURER. NG238 §1.11.4 : sous traitement, des CK
  # au-dessous de 5 N ne demandent ni arrêt ni interruption ; §1.11.5 ajoute de ne PAS doser les CK chez
  # l'asymptomatique traité (c'est ce que fait déjà le `visible_si` du critère).
  # POURQUOI UNE ALERTE ET NON UNE OPTION (arbitrage Q2, D21) : « rassurer » n'est pas un geste
  # thérapeutique, c'est une information — et le patient concerné peut atterrir sur PLUSIEURS cartes
  # différentes (haute intensité, bas risque, repli) selon son profil. L'accrocher à l'une d'elles la
  # ferait disparaître pour les autres. D'où une alerte de NŒUD, indépendante de ce que le moteur retient.
  # BORNE BASSE À 4 N, et c'est la conséquence directe de l'arbitrage Q1 : la lecture restreinte ne change
  # la conduite que dans la bande 4-5 N — c'est-à-dire celle qui, jusqu'à ce passage, déclenchait à tort
  # une interruption. En deçà de 4 N, rien ne changeait et il n'y a rien à rassurer.
  - quand: "intolerance_statine != non AND CK_x_normale > 4 AND CK_x_normale <= 5 AND statine_deja_en_place == true"
    niveau: info
    message: >-
      CK élevées mais AU-DESSOUS de 5 fois la normale, sous traitement : il n'y a pas lieu d'interrompre la
      statine (NG238 §1.11.4). Rassurer le patient, re-doser à 7 jours pour vérifier qu'il ne s'agit pas
      d'une élévation transitoire (effort physique récent, geste traumatique), et poursuivre le traitement.
      Chercher aussi les causes non médicamenteuses avant d'attribuer cette élévation à la statine.
  # RECIBLÉE sur `rapportee` le 2026-07-27 (6e série) : ce message dit « n'écartez pas la classe trop vite ».
  # Il a du sens tant que l'intolérance n'est pas éprouvée ; adressé à un patient dont elle EST avérée, il
  # devient une invitation à ignorer son dossier. Pour celui-là, c'est l'option terminale qui s'affiche.
  - quand: "intolerance_statine == rapportee"
    niveau: attention
    message: >-
      Intolérance aux statines RAPPORTÉE, non éprouvée : plus de 90 % des symptômes musculaires rapportés
      sous statine ne sont, en réalité, PAS attribuables à la statine, l'excès réel de risque étant limité à
      la 1re année de traitement (méta CTT sur données individuelles, 2022). Ce que montrent les
      réintroductions EN AVEUGLE chez des patients déjà étiquetés intolérants : l'excès réel porte sur
      l'ARRÊT du traitement, pas sur les symptômes eux-mêmes (Aebi 2025, 13 ECR : symptômes OR 1,19
      [0,86-1,64] non significatif, mais arrêt OR 1,48 [1,03-2,12] significatif ; Kraut 2023 : environ un
      tiers de ces patients sont réellement intolérants à la statine, et un quart le sont au PLACEBO).
      Avant d'écarter la classe entière : une réintroduction, un changement de molécule (pravastatine,
      rosuvastatine et pitavastatine ont moins d'interactions CYP3A4 que simvastatine/atorvastatine) ou une
      dose plus faible titrée progressivement — la reco française 2026 note que « cette titration permet
      d'identifier le seuil d'apparition des effets musculaires ». Ce n'est qu'une fois l'intolérance
      AVÉRÉE que la statine cesse d'être une option pour ce patient.
  # F-statine §9.5 (2026-07-26, 2ᵉ série) : SCORE2-Diabète n'a d'objet que pour le patient SANS critère de la
  # grille (tier « discuter » — cf. option 2, mêmes 3 conditions) ; en prévention secondaire (ASCVD_etablie
  # == true) il est sans objet, d'où le terme explicite `ASCVD_etablie == false` (les alertes ne voient que
  # les critères, jamais l'option résolue par l'ordered-first-match — un patient ASCVD peut par ailleurs
  # remplir les 3 autres conditions). Déjà en forme normale disjonctive (le DSL n'a pas de parenthèses, AND
  # prime sur OR) : ici un unique terme conjonctif, pas de OR nécessaire.
  - quand: "ASCVD_etablie == false AND anciennete_diabete_annees < 10 AND autres_FDRCV == 0 AND diabete_complique == false"
    niveau: info
    message: >-
      Absence de tout critère de la grille (diabète récent, non compliqué, sans autre facteur de risque
      cardiovasculaire) : le risque absolu est probablement faible, et l'outil SCORE2-Diabète peut aider à
      l'objectiver (seuils fixes ESC 2023 : faible < 5 %, modéré 5-<10 %, haut 10-<20 %, très haut ≥ 20 %).
      Réserve : SCORE2-Diabète n'est validé que 40-69 ans (SCORE2-OP / jugement clinique au-delà) — un
      profil sans critère de la grille est souvent JEUNE, donc potentiellement hors de la plage de
      validation de l'outil qu'on lui suggère de calculer.
# Position de lecture du nœud (D24) — DÉPLACÉE le 2026-07-26 depuis `alertes` où elle était écrite en
# `quand: "default"`, ce que D21 (interdit n°2) proscrit. Texte inchangé : le défaut était le canal, pas
# l'énoncé. C'est la thèse structurante du nœud (risque absolu vs cible LDL) — elle vaut pour tous ses
# patients, elle ne peut être fausse pour aucun, donc elle n'a jamais été une alerte.
cadrage:
  - >-
    La décision (traiter / discuter) et l'intensité se gradent sur le RISQUE ABSOLU, pas sur une cible LDL
    chiffrée : aucun ECR ne valide une valeur cible de LDL (LODESTAR : viser une cible ≡ dose fixe ; VA/DoD
    2026 : preuve insuffisante pour le treat-to-target), et le bénéfice est indépendant du LDL de base (HPS).
  # P10/S5 (T-082) : section « ce que ce nœud ne prend pas en compte », demandée par la recette référent
  # sur le patron de `prescription`. Liste À VALIDER PAR LE RÉFÉRENT (cf. bilan de session) : elle est
  # déduite de `criteres_entree` (ce qui n'y figure pas) et de ce que le nœud demande sans jamais exploiter.
  - >-
    Ce nœud ne prend en compte ni le LDL du patient (cohérent avec la position « pas de cible LDL chiffrée »
    ci-dessus, mais jamais dit explicitement), ni la molécule ni la dose de la statine déjà en place
    (`statine_deja_en_place` ne demande qu'un oui/non), ni les autres hypolipémiants déjà en cours —
    l'ézétimibe notamment, en dehors de la situation d'intolérance avérée où il est nommé comme alternative —
    ni l'historique des statines déjà essayées avant la situation actuelle.
argumentaire: >
  La statine est le volet lipidique de la prévention cardiovasculaire du diabétique. Elle se décide
  indépendamment de l'HbA1c, et sur le RISQUE ABSOLU du patient — jamais sur une valeur cible de LDL.


  En prévention SECONDAIRE, maladie athéromateuse établie, le bénéfice est fort, sur critères durs, à NNT
  bas : la méta-analyse CTT donne −21 % d'événements vasculaires majeurs par mmol/L de LDL abaissé, effet
  identique chez le diabétique et le non-diabétique, NNT de l'ordre de 12 à 20 sur 5 ans. La haute
  intensité apporte un gain supplémentaire réel mais plus modeste (CTT more-vs-less −15 % ; TNT chez le
  diabétique HR 0,75), sans réduction de la mortalité par l'intensification seule (TNT, cohorte totale,
  HR 1,01).


  En prévention PRIMAIRE, le bénéfice sur les événements cardiovasculaires majeurs est solide — CARDS, le
  seul grand essai dédié, donne un composite à HR 0,63, NNT de 27 à 32 ; le sous-groupe primaire du HPS
  donne une réduction relative de 33 %. Mais il est modeste en absolu, et — c'est le point de vigilance
  anti-sur-traitement — la réduction de la MORTALITÉ TOTALE n'est PAS démontrée dans les essais conçus
  pour le diabète : CARDS s'arrête à p = 0,059, la méta-analyse dédiée est non significative, ASPEN est
  nul. Le signal de mortalité provient des méta-analyses mixtes, portées par la prévention secondaire.


  D'où une décision graduée par le risque : statine quasi systématique en prévention secondaire, à haute
  intensité ; en prévention primaire, statine d'intensité modérée pilotée par le risque — 40 ans et plus,
  ou plus jeune avec facteurs de risque ou diabète ancien — et décision partagée chez le sujet jeune à bas
  risque, où le bénéfice absolu est faible. L'intensité est calée sur le niveau de risque et non sur une
  cible LDL : aucun essai ne valide une valeur cible (LODESTAR montre que viser une cible équivaut à une
  dose fixe), et CARDS comme HPS ont démontré le bénéfice à dose fixe, indépendamment du LDL de départ.


  Cas particuliers. Après 75 ans en prévention primaire, individualiser — la preuve est faible. En dialyse
  sans statine en cours, la haute intensité n'est plus proposée (4D et AURORA sont neutres) ; une statine
  déjà en place peut raisonnablement être poursuivie. Le « diabète induit par statine » est sans objet
  chez un patient déjà diabétique.


  QUATRIÈME SITUATION : la statine INDISPONIBLE, c'est-à-dire une intolérance AVÉRÉE ou des CK au-dessus
  de 5 fois la normale avant initiation. Une intolérance seulement RAPPORTÉE ne retire rien : chez des
  patients étiquetés intolérants puis réintroduits en aveugle, l'excès porte sur l'ARRÊT du traitement et
  non sur les symptômes (Aebi 2025 : symptômes OR 1,19 non significatif, arrêt OR 1,48 ; Kraut 2023 :
  environ un tiers réellement intolérants à la statine, un quart au PLACEBO). Seule l'intolérance avérée
  ferme la classe, et une carte terminale oriente alors vers les alternatives : ézétimibe seul (position
  française, mais aucun essai de critère dur chez l'intolérant), acide bempédoïque — le seul agent
  disposant d'un essai de morbi-mortalité dans cette population, CLEAR Outcomes, sous-groupe diabète
  HR 0,83, réduction absolue 2,4 %, sans bénéfice de mortalité — puis anti-PCSK9 en troisième ligne.


  Sous traitement, des CK au-dessus de 5 N imposent d'interrompre 4 à 6 semaines avant tout autre
  raisonnement, puis de réintroduire à dose plus basse — sauf intolérance avérée, où la classe reste
  fermée. Entre 4 et 5 N, on rassure et on re-dose à 7 jours sous traitement ; avant initiation, on débute
  à dose plus faible plutôt que de déclarer la classe indisponible.
