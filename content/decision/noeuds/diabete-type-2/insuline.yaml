    # indépendant sur chaque option consommatrice — un concept, un encodage (invariant I4). Le OR littéral
    # `hypo_severe_recurrente == true` est donc RETIRÉ ici : redondant, `risque_hypoglycemique_eleve` le couvre déjà.
    # Comportement de CETTE option rigoureusement inchangé pour tout profil déjà testé (E-07/E-08 : `hypo_
    # severe_recurrente` y vaut `false`) ; seul gagne un cas nouveau, non testé avant ce lot : basal-bolus,
