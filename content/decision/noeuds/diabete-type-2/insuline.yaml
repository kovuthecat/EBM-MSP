  synthese_critique:
    # RÉÉCRIT le 2026-08-06 (contre-relecture rédactionnelle) : phrases complètes au lieu des formes
    # abrégées (« Schéma de choix = … », « hypo 2,3 vs 12,0 »), sigles développés à leur première
    # occurrence, « temps dans la cible » au lieu de « Time in Range », PMID retiré de la prose (il vit
    # dans la bibliographie du nœud). La « remarque de sourçage » finale est retirée : le même fait —
    # Prescrire ne traite pas la hiérarchie NPH / analogues — est déjà porté par l'argumentaire exhaustif
    # (§ 8, « Réserves »), et il parlait du corpus de l'outil, pas de la donnée.
    donnee: >-
      Le schéma de choix est une insuline basale ajoutée aux antidiabétiques oraux ou à un agoniste du
      récepteur du GLP-1 : c'est celui dont le profil de tolérance et de poids est le meilleur en essai
      randomisé (4T : hypoglycémie 2,3 contre 12,0 événements par patient et par an, prise de poids +1,9
      contre +5,7 kg face à un schéma prandial, à 1 an). Les schémas prandial et prémélangé systématiques
      restent hors de la première intention : leur gain d'HbA1c est modeste, de 0,24 à 0,38 %, et c'est un
      critère de substitution (Bertuol, méta-analyse en réseau de 58 essais et 19 122 patients, 2026). Le
      GLP-1 est préféré avant tout bolus, à contrôle équivalent et avec moins d'hypoglycémie et de poids
      (DUAL VII ; méta-analyses Eng et Maiorino). La vigilance porte sur le surtraitement du sujet âgé :
      aucune métrique, HbA1c ou mesure continue du glucose (MCG), ne prédit fiablement le risque
      d'hypoglycémie, et les cibles de temps dans la cible restent un consensus d'experts (Battelino/ATTD
      2019), non un critère dur validé sur les complications — le lien entre temps dans la cible et
      complications est observationnel (Beck 2019 dans le diabète de type 1, DT1 ; Lu 2021 dans le diabète
      de type 2, DT2). L'insuline s'ajoute lorsque l'HbA1c est très élevée, ou lorsque éviter la prise de
      poids n'est pas prioritaire. Ses effets indésirables sont l'hypoglycémie, la prise de poids et
      l'aggravation d'une rétinopathie préexistante en cas de baisse rapide de l'HbA1c.
    appuis:
      - origin
      - devote
      - switch-2
      - dual-vii
      - fullstep
      - quatre-t
      - battelino
      - jancev
    # REVUES SECONDAIRES CONSULTÉES — retirées de l'écran le 2026-08-04 (le champ
    # `synthese_critique.references` n'existe plus au schéma). Motif : rendues sous la position comme
    # « Réf. : Prescrire », elles se lisaient « Prescrire dit que » — exactement ce que D23 avait voulu
    # empêcher en les sortant du sujet grammatical des arguments. Elles restent CONSULTÉES et tracées
    # ici ; l'écran ne cite plus que des essais et des textes de recommandation officiels.
    # - nom: "ebmfrance/Duodecim"
    # lien: "https://www.ebmfrance.net/Guidelines/Details/ebm00491"
    # - nom: "Médicalement Geek / DragiWebdo"
    # - nom: "Prescrire"
    # detail: "Résumé sous droit d'auteur ; réf. prescrire-dt2.md P1/P3/P5/P8."
  reco_officielle:
    source: "SFD 2025 · HAS 2024 · ADA 2026 · ADA/EASD 2022 · AACE 2022-2026"
    references:
      - nom: "SFD 2025"
        detail: "Darmon P et al., Méd Mal Métab 2025;19(8):630-662 — recommandation française de référence. Avis 18 bis (analogues de 2ᵉ génération si risque d'hypoglycémie), Avis 19 (AR GLP-1 préféré comme premier injectable et avant le bolus ; seuil de 0,5 U/kg/j), Avis 21 (désintensification du sujet âgé), Avis 23 (mesure continue du glucose)."
      - nom: "HAS 2024"
        detail: "Stratégie thérapeutique du DT2 — R.88 (accord d'experts) place l'insuline prémélangée à parité avec le basal-bolus ; R.103 (désintensification du sujet âgé). Muette sur la préférence de 2ᵉ génération et sur l'AR GLP-1 avant le bolus."
      - nom: "ADA 2026"
        detail: "Standards of Care, chapitre 7 (technologie) et chapitre 9 (traitement pharmacologique) — rec 7.15 (mesure continue, grade A), rec 9.21 (AR GLP-1 avant le bolus), Table 13.2 (cibles du sujet âgé, grade C). Le seuil de 0,5 U/kg/j comme signe de sur-basalisation a été RETIRÉ en 2025."
      - nom: "ADA/EASD 2022"
        detail: "Davies et al., PMID 36148880 — consensus de prise en charge."
      - nom: "AACE 2022-2026"
        detail: "Maintient, elle, le seuil de 0,5 U/kg/j comme repère de sur-basalisation — divergence avec l'ADA."
      - nom: "Battelino / ATTD 2019"
        detail: "Cibles de temps dans la cible (Time in Range) — consensus d'experts, pas un critère dur."
    position: >-
      Insuline basale ajoutée aux antidiabétiques en cours ; AR GLP-1 préféré comme premier injectable et
      avant le bolus ; analogues de deuxième génération en cas de risque d'hypoglycémie ; désintensification
      du sujet âgé ; mesure continue du glucose recommandée et remboursée chez le patient traité par
      insuline, avec les cibles de temps dans la cible du consensus de 2019.
    divergence: true
    divergences:
      - sujet: "Place de l'insuline prémélangée"
        position_officielle: >-
          La recommandation française de la HAS place l'insuline prémélangée à PARITÉ avec le basal-bolus
          (accord d'experts).
        position_outil: >-
          L'outil ne propose pas de schéma prémélangé d'emblée : il intensifie par l'AR GLP-1 ou
          l'association fixe, puis par le basal-plus, puis par le basal-bolus.
        appui: >-
          Les schémas prandial et prémélangé systématiques apportent un surcroît d'hypoglycémie et de poids
          sans gain durable (4T ; Bertuol). L'AR GLP-1 avant le bolus donne le même contrôle avec moins
          d'hypoglycémie et moins de poids (DUAL VII ; méta-analyses Eng et Maiorino), et FullSTEP montre
          que le basal-plus par étapes suffit avant le basal-bolus complet. La parité affichée par la HAS
          repose sur un accord d'experts, pas sur ces essais.
      - sujet: "Préférence pour les analogues de deuxième génération"
        position_officielle: >-
          La HAS reste silencieuse sur le choix entre générations d'analogues basaux.
        position_outil: >-
          L'outil préfère explicitement un analogue de deuxième génération en cas de risque hypoglycémique
          élevé : âge avancé, fragilité, espérance de vie limitée, schéma qui expose déjà, ou antécédent
          d'hypoglycémie sévère récurrente.
        appui: >-
          La réduction de l'hypoglycémie est démontrée (SWITCH 2 : symptomatique globale RR 0,70, nocturne
          RR 0,58 ; EDITION U300 : −31 % d'épisodes nocturnes), et celle de l'hypoglycémie SÉVÈRE l'est
          pour le dégludec contre glargine U100 (DEVOTE, NNT ~59
          sur 2 ans). L'outil ne va pas plus loin que la donnée : aucune supériorité n'est affirmée entre
          les deux analogues de deuxième génération (BRIGHT, CONCLUDE), et pour la première génération
          contre NPH la différence n'est pas significative (Cochrane 2020).
      - sujet: "Ce qu'on fait des cibles de temps dans la cible"
        position_officielle: >-
          La mesure continue du glucose est recommandée en grade A chez le patient traité par insuline, avec
          des cibles chiffrées de temps dans la cible.
        position_outil: >-
          L'outil affiche ces cibles et s'en sert pour INTERPRÉTER un profil, mais ne fait agir aucune
          option sur le temps dans la cible. Seule la dimension hypoglycémie — temps sous la cible,
          variabilité, hypoglycémies nocturnes — déclenche des gestes.
        appui: >-
          Les cibles de temps dans la cible sont un consensus d'experts, pas un critère dur : le lien avec
          les complications est observationnel (Beck, ré-analyse du DCCT dans le diabète de type 1 ; Lu,
          cohorte de type 2), et le bénéfice de la mesure continue dans le diabète de type 2 porte sur des
          critères de substitution — HbA1c et temps dans la cible — sans preuve sur les complications dures
          ni sur la mortalité (Jancev). Aucune métrique ne prédit fiablement l'hypoglycémie. Faire agir une
          cible non démontrée exposerait au sur-traitement guidé par la technologie.
      # DIVERGENCE AJOUTÉE : elle était argumentée dans l'argumentaire exhaustif (§ 5 bis et § 9) et dans
      # les commentaires de `gaj_a_cible`, mais nulle part dans le bloc que l'écran affiche à côté de la
      # reco officielle — alors que deux titres de références du MÊME panneau annoncent d'autres bornes.
      - sujet: "La cible de glycémie avant les repas"
        position_officielle: >-
          La HAS vise 0,70 à 1,20 g/L avant les repas (fiche de bon usage de 2011, reprise à l'identique
          dans le guide Parcours de soins de 2025). La SFD (Avis 18) et l'ADA visent, elles, 0,80 à
          1,30 g/L. Aucune de ces sources n'imprime de grade ni ne cite d'essai.
        position_outil: >-
          L'outil retient 0,70 à 1,30 g/L : la borne haute de la SFD et de l'ADA, la borne basse de la HAS.
          Concrètement, il ne propose d'augmenter la dose qu'au-dessus de 1,30 g/L, donc un peu plus tard
          que la HAS, et il traite toute valeur sous 0,70 g/L comme un signal à corriger.
        appui: >-
          Les deux bornes ne jouent pas le même rôle. La borne haute est un seuil de titration : la placer
          à 1,30 g/L plutôt qu'à 1,20 g/L retarde légèrement la majoration de dose, dans le sens de la
          prudence, et suit les deux sociétés savantes les plus récentes. La borne basse, elle, n'est pas
          un bord d'intervalle mais un déclencheur de sécurité : 0,70 g/L EST le seuil international
          d'hypoglycémie (Battelino ; SFD, Tableau II), c'est-à-dire l'endroit exact où la cible commence
          et où l'hypoglycémie finit. La fixer à 0,80 g/L ferait réduire l'insuline sur des valeurs
          qu'aucune source ne qualifie de basses.
    explication: >-
      Sur le fond, l'outil suit la recommandation française, qui converge avec les données sur l'essentiel :
      basale d'abord, AR GLP-1 avant le bolus, analogues de deuxième génération quand le risque
      hypoglycémique le justifie, allègement chez le sujet âgé. Les quatre écarts recensés portent sur des
      points où une recommandation reste silencieuse, s'appuie sur un accord d'experts plutôt que sur des
      essais, ou fixe une cible que la donnée ne soutient pas encore. À noter : les recommandations les plus
      technophiles sur la mesure continue portent d'importants liens d'intérêt avec les fabricants de
      dispositifs — ce n'est pas un argument, c'est un contexte de lecture.
# NOTES D'ENCODAGE (jamais affichées — elles vivaient à tort dans `incertitudes`, cf. D48 : elles disent
# comment le nœud est construit, pas ce que la preuve établit) :
#   — `risque_hypoglycemique_eleve` s'appelait `terrain_fragile` : le dérivé désigne un RISQUE
#     HYPOGLYCÉMIQUE (il inclut le schéma à risque et l'antécédent d'hypoglycémie sévère), pas une
#     fragilité gériatrique — les CIBLES sont confiées à `terrain_cible_assouplie`. ⚠ À ARBITRER : le nœud
#     `prescription` déclare LUI AUSSI un dérivé `terrain_fragile`, avec une définition DIFFÉRENTE (sans
#     `hypo_severe_recurrente`, qu'il ne recueille pas). Deux nœuds, un même nom, deux encodages —
#     exactement ce que l'invariant I4 interdit, mais I4 est vérifié PAR NŒUD et ne peut pas le voir. Soit
#     `prescription` recueille l'antécédent d'hypoglycémie sévère et les deux convergent, soit son dérivé
#     est renommé à son tour.
#   — Chevauchement de `priorite` : les quatre blocs de situation réutilisent les rangs 1-2-3. Sans
#     conséquence d'affichage depuis que le nœud déclare six `familles` (sécurité / instaurer / intensifier
#     / ajuster / alléger / aucun geste) : le rang ne regroupe plus qu'à l'intérieur d'une même nature de
#     geste. Les `priorite` n'ont pas été renumérotées — remaniement large, sans gain, et qui rendrait le
#     golden master illisible.
#   — Reste ouvert côté écran : l'AFFICHAGE du nombre de dose calculé (le moteur le calcule, l'écran ne le
#     rend pas encore).
incertitudes:
  - "AUTOSURVEILLANCE GLYCÉMIQUE : aucun bénéfice propre démontré chez le diabétique de type 2 insulino-traité. Nauck 2014 (n = 300) a randomisé exactement cette question — autosurveillance contre absence d'autosurveillance — et le résultat est NÉGATIF (différence d'HbA1c 0,0 %, IC −0,2 à +0,2). Ce résultat porte sur l'effet propre de la mesure, non sur son utilité comme instrument : c'est sur elle que reposent la titration et le repérage des hypoglycémies, en particulier lorsque la mesure continue du glucose n'est pas disponible."
  - "CIBLER LA GLYCÉMIE POST-PRANDIALE N'A JAMAIS AMÉLIORÉ UN CRITÈRE DUR. Les trois essais d'une stratégie à visée post-prandiale sont nuls (HEART2D, ACE, NAVIGATOR), et STEP-Wise, qui a randomisé le pivot de titration lui-même — post-prandial contre pré-prandial —, ne trouve aucune différence (−0,06 %, IC −0,29 à +0,17). Le seuil de 1,80 g/L à 2 heures reste la cible officielle française et américaine, mais c'est un accord d'experts : la titration d'un bolus se fait sur la glycémie relevée avant le repas suivant, seul pivot qu'un essai ait réellement instrumenté (FullSTEP)."
  - "AUCUNE DONNÉE NE SOUTIENT UN GARDE-FOU DE SUR-TITRATION PAR CRÉNEAUX HORAIRES. Aucun essai n'a randomisé l'attribution « heure de la journée → composant de l'insuline à modifier » : Bergenstal 2008 l'instrumente dans ses DEUX bras, il la présuppose donc au lieu de la tester. Le découpage en quatre périodes fixes n'existe dans aucune source, et les fenêtres nocturnes divergent d'un essai à l'autre. Sur le sujet âgé, « relever la cible » a plusieurs sources ; « titrer plus lentement » n'en a aucune — SENIOR, seul essai dédié, randomise deux insulines à cible commune et n'a testé ni un pas ni un intervalle différents."
  - "SEUIL DE SUR-BASALISATION À 0,5 U/kg/j : faiblement fondé, et les sociétés savantes divergent. Le chiffre est écrit tel quel dans la recommandation française (SFD 2025, Avis 19), mais l'ADA l'a explicitement retiré de ses Standards en 2025 alors que l'AACE le maintient. Son seul support de données est un post-hoc non pré-spécifié, financé par le fabricant. Aucun essai n'a comparé « plafonner puis intensifier autrement » à « continuer à titrer », et les doses d'entretien réellement atteintes à la cible s'étalent de 0,34 à 0,78 U/kg. C'est pourquoi ce seuil est seulement signalé comme un repère à interpréter, en l'absence de mesure continue du glucose : il n'ouvre aucune conduite et n'en retire aucune. Ce qu'il prétend décrire — une nuit sur-couverte — se lit sur la courbe nocturne, et non sur le rapport de la dose au poids."
  - "MESURE CONTINUE DU GLUCOSE : les cibles (temps dans la cible au-dessus de 70 %, etc.) sont un consensus d'experts, pas un critère dur. Le lien entre temps dans la cible et complications est observationnel — ré-analyse du DCCT dans le diabète de type 1, cohorte dans le type 2 — et le bénéfice de la mesure continue dans le diabète de type 2 porte sur des critères de substitution, sans preuve sur les complications dures ni sur la mortalité."
  - "Le bénéfice microvasculaire de l'insuline est EXTRAPOLÉ du contrôle glycémique en général (UKPDS) : aucun essai dédié à l'insuline ne l'a démontré sur critère dur. Et l'insuline est cardiovasculairement neutre (ORIGIN)."
  - "Une courbe nocturne PLATE avec une HbA1c au-dessus de l'objectif ne dit pas « la titration reste ouverte » mais « la basale n'est pas en cause » — l'écart est alors ailleurs, et monter la basale n'aiderait pas. Seule une HAUSSE continue pendant la nuit signe une couverture insuffisante. Symétriquement, une hypoglycémie ENTRE les repas accuse le bolus (dose trop importante par rapport au repas), pas la basale. C'est une lecture clinique standard du profil, pas un résultat d'essai."
  - "Une hypoglycémie sévère récurrente appelle une OPTIMISATION DU TRAITEMENT, pas un assouplissement des cibles : elle dit que le schéma expose, pas que le contrôle a cessé d'être utile. C'est pourquoi elle oriente vers un analogue basal de deuxième génération et vers l'allègement du schéma, sans entrer dans ce qui relâche les cibles — lesquelles ne dépendent que de l'âge, de la fragilité et de l'espérance de vie."
  - "Analogues de deuxième génération : la réduction de l'hypoglycémie SÉVÈRE n'est démontrée que pour le dégludec contre glargine U100 (DEVOTE). Pour la première génération contre NPH, elle n'est pas significative (Cochrane 2020). Et aucun analogue de deuxième génération n'est supérieur à l'autre (BRIGHT, CONCLUDE)."
  - "Associations fixes (IDegLira, iGlarLixi) : le bénéfice est sur critères de substitution. Aucun essai de morbi-mortalité cardiovasculaire ne leur est dédié."
