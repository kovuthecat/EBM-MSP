  # Vérifié avant suppression : aucun `motifs`, aucune `priorite` d'une autre option et aucun commentaire
  # actif de ce fichier ne référencent plus cette carte par son intitulé.
  # ═══════════ SITUATION 2 — BASALE SEULE À OPTIMISER ═══════════
  - intitule: "Corriger l'hypoglycémie ou la variabilité"
    role: securite
    famille: "Sécurité — à corriger d'abord"
    # I2/F3 (redteam-clinique-silences.md, 2026-07-26, 4ᵉ lot) : option RÉUTILISÉE (aucun contenu clinique
    # nouveau) pour couvrir aussi « basale_plus_bolus », qui n'avait jusqu'ici AUCUNE option de sécurité —
    # 401/401 profils du banc avec un signal d'hypoglycémie documenté (TBR > 4 OU TBR_severe > 1 OU
    # hypo_severe_recurrente) n'avaient aucune réponse, et les 2 options d'escalade de cette situation
    # (ci-dessous, même lot) portent désormais des `exclusions` sur ces mêmes signaux : sans ce relais,
    # l'exclusion aurait converti le défaut en silence (renvoyant au seul repli « Poursuivre... », dont le
    # texte affirme à tort « sans hypoglycémie » — R4/incertitudes).
    # `hypo_severe_recurrente` GÉNÉRALISÉ le 2026-07-27 (arbitrage référent) : il était conjoint à
    # `situation_insuline == basale_plus_bolus`, donc muet en « basale seule ». Motif du référent : un
    # antécédent d'hypoglycémie sévère récurrente est une propriété DU PATIENT, pas du schéma — il n'y a
    # aucune raison qu'il ouvre un geste correctif sous basale + bolus et se taise sous basale seule. La
    # restriction d'origine était une prudence de portée prise sans mandat, jamais un choix clinique.
    # (En basal-bolus, le relais est assuré par « Désintensifier / alléger le schéma », qui lit
    # `risque_hypoglycemique_eleve` — lequel inclut ce même signal : les trois situations sont donc couvertes.)
    conditions:
      - "situation_insuline == basale_seule OR situation_insuline == basale_plus_bolus"
      # T-033 (P5/S2, 2026-07-28) : les 4 termes MCG regagnent `mcg_disponible == true AND` EN TÊTE — pas
      # seulement pour I10 (déjà couvert par `situation_insuline` acquis via la condition voisine
      # ci-dessus), mais parce que sans capteur ces 4 champs sont maintenant MASQUÉS (T-033) : sans ce
      # garde, un patient sans capteur laissait ce terme INDÉTERMINÉ (jamais faux), l'option partait « en
      # attente » en réclamant des champs invisibles (I11). `hypo_severe_recurrente` reste hors garde : ce
      # signal n'est pas un champ de capteur, il reste toujours visible et déterminable.
      # 2026-07-29 (passe A) : le terme `mcg_disponible == true AND TBR_severe > 1` a été retiré avec le
      # critère. Les 4 autres signaux de la disjonction sont inchangés — le geste correctif se déclenche
