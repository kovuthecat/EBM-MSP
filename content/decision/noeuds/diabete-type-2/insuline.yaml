    # l'option la nomme elle-même dans ses `avantages` ci-dessous (« ce qui est un sur-traitement »), le
    # motif ne fait que reprendre cette lecture déjà validée par le contenu, pas l'inventer.
    motifs:
      "situation_insuline != naif AND ecart_sous_objectif_cible == true": "une insulinothérapie déjà en place, en sur-traitement (HbA1c ≥ 1 point sous l'objectif)"
    priorite: 1
