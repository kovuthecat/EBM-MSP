    # décision que ci-dessus pour « Choisir un analogue... » (situation « naïf »). Cas vérifié : patient de
    # 80 ans, HbA1c 6 % pour une cible de 7 %, sous basal-bolus, case « fragile » NON cochée — ne recevait
    # aucun allègement (âge absent de l'ancienne condition) ; `risque_hypoglycemique_eleve` (age >= 75 inclus) corrige.
    # RÉSOLU 2026-07-26 (4ᵉ lot, I3/F4 — cf. `redteam-clinique-silences.md`) : le point ci-dessus, laissé
    # ouvert plus tôt le même jour, est tranché. `hypo_severe_recurrente` figurait ici en OR littéral, et
    # nulle part ailleurs — le même concept de sécurité (antécédent d'hypoglycémie sévère) n'orientait PAS
