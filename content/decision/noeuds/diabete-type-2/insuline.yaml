    - date: "2026-07-29"
      auteur: "référent DT2 (Thibault) + Claude Code — passe A, quatrième lot : CONSIGNATION (aucun changement de comportement)"
      resume: >-
        CONSIGNATION DE LA PASSE A, demandée par le référent : « toute nouvelle donnée utilisée devra
        être consignée dans la base de données consolidée et ajoutée dans les argumentaires spécifiques
        et dans l'argumentaire exhaustif ». Ce lot ne touche AUCUNE `conditions`, AUCUNE `exclusions`,
        AUCUN `derive` : le moteur se comporte exactement comme en v0.29. Il rend les textes affichés
        fidèles aux sources, et il inscrit les sources.
        .
        DOUZE RÉFÉRENCES AJOUTÉES à `sources.references_primaires`, dont les cinq qui manquaient le plus :
        les deux fiches HAS qui portent réellement les seuils capillaires du nœud (fiche BUTS 2011 et
        guide Parcours de soins 2025 §5.2, cette dernière trouvée par le red-team B3, absente du corpus
        et citée par AUCUNE des cinq collectes), la SFD 2025 (Avis 18 pour la titration, Avis 23 pour la
        primo-prescription de MCG), ebmfrance (d'où vient le « 3 matins de suite » que le nœud affichait
        sans le dire) et HAS 2024 R.87 (la règle de descente, symétrique, que le nœud n'avait encodée
        que dans le sens de la montée). Plus les essais du pilotage sans capteur : STEP-Wise, HEART2D,
        ACE, NAVIGATOR, Nauck, Munshi, SENIOR.
        .
        ⚠ TOUS CES PMID ONT ÉTÉ RE-DÉRIVÉS PAR LE RED-TEAM B2 CONTRE PUBMED, AUCUN N'EST REPRIS
        D'OPENEVIDENCE. Six des sept PMID rendus par OE lors de cette passe étaient faux tout en
        pointant vers des articles réels et sans rapport (ACE → neuro-imagerie, NAVIGATOR → ACCORD
        Lipid, 4T → gynécomastie puis histiocytose). Un PMID faux ne se voit pas : il a la bonne forme,
        il résout, et il donne l'apparence d'une vérification. Ses DOI, eux, étaient justes (3/3). La
        règle qui en découle est versée dans `docs/decision/00-global.md`.
        .
        D2 — CHIFFRE ORPHELIN, CORRIGÉ EN QUATRE ENDROITS. La borne « ± 10-20 % » n'avait aucune source :
        la SFD écrit 10 %, l'ADA 10-15 %, PERSONNE n'écrit 20 %. Sa face la plus visible était un
        `calculs` qui AFFICHAIT une dose réduite de 20 % au praticien — le chiffre inventé était donc
        arrivé jusqu'à l'écran, sous forme de nombre calculé. Ramené à 10 % (SFD 2025 Avis 18) dans le
        calcul, dans les deux textes qui le portaient et dans le cadrage de tête.
        .
        D3 — MÉSATTRIBUTION, CORRIGÉE. L'algorithme de titration de « Titrer la basale » était présenté
        comme « validé (Treat-to-Target) ». Riddle 2003 décrit tout autre chose : titration HEBDOMADAIRE,
        graduée par bande (+2/+4/+6/+8 U), vers une cible ≤ 1,00 g/L. Ni le pas de 2 U, ni les « 3 matins
        de suite », ni le rythme de 3 jours ne viennent de cet essai — SEUL le « ~60 % » est de lui.
        Chaque élément est rendu à sa source, et le mot « validé » retiré : aucun essai n'a jamais
        randomisé une règle de titration de ce type, ni a fortiori une règle de DESCENTE.
        .
        D4 — FAIT FAUX DANS `incertitudes`, CORRIGÉ. L'entrée sur la sur-basalisation affirmait
        qu'« aucune source SFD ne porte le seuil de 0,5 U/kg ». Il y est VERBATIM (Avis n° 19), établi
        indépendamment par deux red-teams qui ont simplement ouvert le PDF du corpus local. Le red-team
        du 2026-07-27 avait conclu à l'absence en travaillant sur un téléchargement web illisible. Le
        nœud affichait donc un repère français en omettant la société savante française qui le porte :
        la mention SFD est ajoutée au texte de l'option. L'arbitrage de fond ne se rouvre pas — il
        portait sur le canal, et il tient.
        .
        DEUX INCERTITUDES AJOUTÉES, toutes deux des résultats NÉGATIFS qu'il faut protéger d'une
        « correction » future : (1) cibler la post-prandiale n'a jamais amélioré un critère dur
        (HEART2D nul mais séparation glycémique NON obtenue — donc « pas démontré », jamais
        « réfuté » ; ACE et NAVIGATOR nuls ; IDF verbatim), ce qui justifie que le nœud AFFICHE
        1,80 g/L sans le faire AGIR ; (2) le garde-fou par créneaux horaires, reporté par le référent,
        n'a aucun socle — personne n'a randomisé « heure → composant », Bergenstal 2008 le présuppose
        dans ses deux bras, le découpage en quatre périodes n'existe nulle part, et les fenêtres
        nocturnes divergent d'un essai à l'autre. Idem pour l'âge : SENIOR fonde « relever la cible »,
        jamais « titrer plus lentement ».
        .
        TRAÇABILITÉ I8 : quatre options voyaient leur texte nommer des preuves absentes de la
        bibliographie du nœud — « Ajouter un bolus » citait STEP-Wise et HAS 2025 depuis la correction
        de D1 sans les déclarer. Corrigé partout.
        .
        Une seule information NOUVELLE apparaît à l'écran, sur « Titrer la basale » et sur l'option
        MCG : sans capteur, 93 % des épisodes d'hypoglycémie échappent à une autosurveillance à 4
        mesures par jour ET aux symptômes (Munshi). Elle est affichée avec sa portée réelle — série de
        40 sujets âgés, population mixte DT1/DT2, proportion d'ÉPISODES et non de patients — et comme
        une raison de prudence, jamais de renoncement : c'est la limite du repli capillaire, pas son
        procès. Le nœud continue de NE PAS dire que l'autosurveillance est sans bénéfice démontré
        (arbitrage F du référent, motif consigné en `incertitudes` avec Nauck 2014).
    - date: "2026-07-29"
      auteur: "référent DT2 (Thibault) + Claude Code — passe A, troisième lot : le pivot et l'instrument"
      resume: >-
        LES DEUX DERNIERS ARBITRAGES DE LA PASSE A, qui referment le chantier « insuline sans capteur ».
        (B) PIVOT « AVANT LES REPAS ». Le cadrage du 2026-07-27 posait « la glycémie à jeun pour la
        basale, les POST-prandiales pour la rapide » : la seconde moitié est renversée par la collecte,
        vérifiée en primaire. Dans tous les protocoles de basal-plus, la dose de bolus se titre sur la
        glycémie PRÉ-prandiale du repas SUIVANT (FullSTEP : 4,0-7,2 mmol/L, ± 1 U) ; STEP-Wise a
        randomisé les deux stratégies et ne trouve aucune différence (ETD −0,06 % [−0,29 ; +0,17]) ; et
        la HAS écrit « avant les repas », jamais « à jeun ». La cible 0,70-1,30 n'est donc pas une cible
        à jeun : c'est une cible pré-prandiale dont la glycémie du matin est un cas particulier.
        CONSÉQUENCE ENCODÉE : un champ `glycemie_pre_repas` (au repas le moins bien couvert), plus ses
        deux états `pre_repas_haute` / `pre_repas_basse`, qui ouvrent « Optimiser la répartition du
        basal-bolus » — la seule option qui ajuste un bolus déjà en place. UN SEUL champ et non trois
        (forme 1, retenue par le référent) : la charge de saisie est le risque n°1 du projet, et un seul
        suffit à décider même s'il ne localise pas. Gardé sur `mcg_disponible == false` ET sur
        l'existence d'un bolus ; les deux dérivés RÉPÈTENT ce garde (R8) — l'invariant I10 avait rejeté
        la première rédaction qui l'omettait, et il avait raison : masqué, le champ retombe à 0 et
        « sous 0,70 » serait devenu vrai pour tout le monde.
        (G) OPTION « ENVISAGER D'INSTAURER UNE MESURE CONTINUE DU GLUCOSE », placée EN TÊTE dans une
        famille nouvelle (« Avant de décider — la mesure ») dont l'ordre précède la sécurité — elle ne
        corrige rien, elle interroge l'instrument sur lequel tout le reste de l'écran repose, et elle ne
        s'affiche que chez le patient sans capteur. Texte validé par le référent. Fait clinique nouveau
        pour le nœud, vérifié en primaire par le red-team sur `sources/SFD 2025.pdf` (Avis 23) : la MCG
        est remboursée ET primo-prescriptible par le médecin généraliste dès 1 à 2 injections si
        l'équilibre n'est pas atteint. Le nœud dit donc désormais que la branche « sans capteur » est
        souvent RÉVERSIBLE en consultation, que le raisonnement capillaire reste valide mais MOINS
        FIABLE, et qu'en l'absence d'urgence il est légitime de DIFFÉRER l'ajustement. Option et non
        `cadrage` : un cadrage s'affiche sans condition, or cet énoncé ne vaut que sans capteur.
        « Moins fiable » est énoncé SANS CHIFFRE, délibérément : le red-team a confirmé Munshi (93 % des
        épisodes manqués à 4 mesures/jour) mais sur des sujets âgés insulino-traités, et le « 46 % » de
        Zick s'est révélé être un calcul d'agent non publié.
        (D1, défaut établi par le red-team) L'`effet_attendu` de « Ajouter un bolus » disait « ajuster
        SUR la glycémie post-prandiale (< 1,80 g/L à 2 h) » en citant `fullstep`/`bertuol`/`quatre-t` :
        aucune des trois ne porte ce nombre, et FullSTEP a fait l'inverse. Réécrit sur ce que les
        protocoles ont réellement fait ; le seuil de 1,80 g/L reste mentionné, mais à sa juste place —
        cible officielle (HAS 2025, ADA Table 6.3) et accord d'experts, avec la mention que STEP-Wise
        n'a trouvé aucune différence entre viser l'un ou l'autre. `fullstep` redevient exacte.
        Le texte de « Optimiser la répartition » gagne sa table de lecture CAPILLAIRE, en regard de la
        table AGP existante.
    - date: "2026-07-29"
      auteur: "référent DT2 (Thibault) + Claude Code — passe A, second lot : arbitrages POST-COLLECTE"
      resume: >-
        SIX ARBITRAGES RENDUS APRÈS LA COLLECTE DE PREUVE ET SA PASSE ADVERSARIALE (5 agents A ×
        retour OpenEvidence × 3 red-teams B). Synthèse opposable :
        `docs/decision/validation/chantier-2026-07-29/CONCILIATION-passeA.md`.
        (A) `hypo_severe_recurrente` NE RETIRE NI NE COMMANDE PLUS AUCUN GESTE. Motif référent : « un
        antécédent d'hypoglycémie sévère sous un ANCIEN schéma ne présume pas du risque sous le schéma
        ACTUEL ; il ne doit pas empêcher de titrer. » Retiré des 2 `exclusions` d'escalade et du
        déclencheur de « Corriger l'hypoglycémie » ; remplacé par une ALERTE de nœud (canal R8, qualifie
        sans interdire) ; conservé dans `risque_hypoglycemique_eleve`, qui pilote le choix de molécule et
        l'allègement. Amende l'arbitrage du 2026-07-27 sur le CANAL, pas sur la PORTÉE — une alerte de
        nœud n'étant gatée par aucune situation, l'universalité voulue alors est préservée. Lève au
        passage la contradiction de la vignette V-A2 (« réduire la basale » et « +2 U » sur le même
        écran).
        (C) BANDE DE CIBLE 0,70-1,30 g/L (borne haute 1,20 → 1,30). Borne haute reprise de SFD 2025
        Avis 18 et d'ADA 2026 : DIVERGENCE ASSUMÉE avec la HAS (1,20), à déclarer dans `reco_officielle`.
        Borne basse maintenue à 0,70 sur arbitrage explicite : ce n'est pas une frontière de cible mais
        le DÉCLENCHEUR d'une réduction de dose, et 0,70 est le seuil international d'hypoglycémie
        (Battelino 2019, Tableau II SFD) — donc l'endroit exact d'un garde-fou. La réserve « la cible
        commence où finit l'hypoglycémie » (collecte A5, divergence D-1) ne vaut que si l'on lit 0,70
        comme une borne de cible ; elle tombe pour un seuil d'alerte.
        SOURÇAGE CORRIGÉ ET VÉRIFIÉ EN PRIMAIRE : ces bornes ne viennent PAS de Treat-to-Target — c'était
        une erreur introduite plus tôt le même jour. Elles viennent de la HAS, et deux PDF ont été versés
        au corpus et relus page à page : fiche de bon usage « BUTS » d'avril 2011 (en mg/dL) et surtout
        **guide HAS « Parcours de soins du patient adulte vivant avec un DT2 » du 26 juin 2025, §5.2, qui
        les écrit en g/L**. Ni l'un ni l'autre n'imprime de grade ni ne cite d'essai : force forte,
        certitude TRÈS FAIBLE.
        (D) La règle de descente suit ebmfrance, qui ne réagit pas à une valeur isolée (« 1 fois sur 3 :
        ne rien changer ; plus souvent : −2 U »). Plutôt qu'un critère de fréquence supplémentaire —
        la charge de saisie est le risque n°1 déclaré du projet — la fréquence est portée par le LIBELLÉ
        (« Glycémie à jeun HABITUELLE ») et par un champ `aide` explicite. C'est déjà l'esprit de la règle
        de montée affichée par le nœud (« 3 matins de suite ») et de HAS R.87 (adaptation « tous les
        3 jours »).
        (E) Le concept de sur-traitement reste l'ÉCART À LA CIBLE (`ecart_sous_objectif_cible`, inchangé).
        Le déclencheur alternatif trouvé dans le guide HAS 2025 §8.1 (« la baisse de l'HbA1c survenant en
        l'absence d'intensification évoque un surtraitement ») est ÉCARTÉ : il porte sur une trajectoire,
        donc supposerait de recueillir l'HbA1c précédente. Motif référent : « on garde l'écart à la cible,
        plus simple ».
        (F) SILENCE DÉLIBÉRÉ sur la valeur propre de l'autosurveillance — cf. `incertitudes`, entrée
        dédiée. Le red-team a trouvé l'ECR qui manquait (Nauck 2014, négatif) ; le nœud n'en dira rien.
        Motif référent : « prête à confusion ; les glycémies capillaires permettent a minima au soignant
        de raisonner en l'absence de MCG ». L'ASG est l'instrument de mesure, pas une intervention dont on
        vanterait l'effet.
        Aucun `[À VÉRIFIER]` n'est encodé. Restent NON TRAITÉS dans ce lot, et documentés au §5 de la
        conciliation : (B) le pivot « avant les repas » — validé sur le principe, la FORME du champ reste
        à arrêter ; (G) l'option « envisager d'instaurer une MCG » et l'énoncé que le raisonnement sans
        capteur est moins fiable, avec possibilité de différer si rien n'est urgent. Restent également
        ouverts les défauts D1 à D3 de la conciliation (mésattributions de sources dans `references` et
        `effet_attendu`, borne « +10-20 % » orpheline), qui relèvent de la consignation.
    - date: "2026-07-29"
      auteur: "référent DT2 (Thibault) + Claude Code — passe A (insuline sans capteur), volet arbitrable"
      resume: >-
        QUATRE ARBITRAGES RÉFÉRENT DU 2026-07-29, rendus sur les vignettes `docs/decision/validation/
        chantier-2026-07-29/vignettes-insuline-sans-capteur.md` (12 profils rejoués un à un sur le moteur
        réel avant et après ce lot). Ce lot encode UNIQUEMENT ce qui a été tranché ; les questions de
        preuve (seuils post-prandiaux, règle de descente chiffrée, créneaux horaires) partent en collecte
        et n'entrent pas ici.
        (1) `TBR_severe` RETIRÉ DU NŒUD — pas seulement masqué. Motif référent : la répartition TBR / TBR
        sévère ne se lit pas en consultation, MÊME chez un patient équipé (elle suppose de télécharger les
        données sur un ordinateur, geste rarement fait pendant la consultation). Le champ était donc
        inatteignable au moment où la décision se prend, capteur ou non. Partent avec lui : la contrainte
        de saisie D31 (`TBR_severe <= TBR`, sans objet désormais), 4 termes de `conditions`, 4
        `exclusions`, 1 terme de l'alerte d'orientation spécialiste, et le libellé (`lib/labels.ts`, sans
        quoi le compte de libellés morts d'I20bis montait, or son plafond ne peut que descendre).
        ⚠ CE QUE ÇA COÛTE EXACTEMENT — première rédaction de cette entrée corrigée après relecture du
        golden master, où elle affirmait « aucun garde-fou ne disparaît ». C'est trop commode. Dans chacun
        des 9 emplacements, les autres termes de la disjonction (`TBR > 4`, `CV_glycemique > 36`,
        `hypo_nocturne`, `hypo_severe_recurrente`) sont bien inchangés — mais il existe une fenêtre où
        `TBR_severe > 1` était le SEUL terme vrai : `TBR` entre 1 et 4 % avec un TBR sévère au-dessus de
        1 %. Le profil #23 du banc figé le montre (le geste de sécurité disparaît, et la titration, qui
        était écartée par ce seul terme, réapparaît). Ces patients perdent donc réellement un signal.
        Ce qui rend le retrait acceptable n'est pas qu'il ne coûte rien, c'est que le signal perdu
        n'était **pas obtenable** : le référent a établi que la répartition TBR / TBR sévère ne se lit pas
        en consultation. Aucun signal OBTENABLE ne disparaît — c'est l'affirmation exacte, et elle est
        plus faible que celle que j'avais écrite.
        (2) GLYCÉMIE À JEUN — TROIS ÉTATS au lieu d'une appartenance. `gaj_a_cible` (0,70-1,20 g/L) est
        conservé tel quel ; deux dérivés le complètent, `gaj_basse` (< 0,70) et `gaj_haute` (> 1,20).
        LE DÉFAUT CORRIGÉ, mesuré sur le moteur : « Titrer la basale » se déclenchait sans MCG sur
        `gaj_a_cible == false`, qui confond au-dessus et EN DESSOUS — un patient à 0,58 g/L le matin,
        HbA1c 8,4 % pour une cible de 7 %, recevait « Titrer la basale, +2 U » comme SEULE carte, et rien
        ne le rattrapait (0,37 U/kg, donc hors du repère de sur-basalisation). Le pivot de titration sans
        MCG devient `gaj_haute == true` ; `gaj_basse == true` devient une `exclusions` de « Titrer la
        basale » (canal R4/R8 : un fait de sécurité s'affiche avec son motif, il ne disparaît pas en
        silence) et un déclencheur de « Corriger l'hypoglycémie ou la variabilité », qui portait déjà la
        conduite (−2 à −4 U ou −10-20 %). AUCUN SEUIL NOUVEAU : 0,70 et 1,20 sont les bornes que
        `gaj_a_cible` portait déjà, sourcées Treat-to-Target (Riddle 2003, PMID 14578243).
        (3) CONCEPT « SOUS LA CIBLE » ajouté au nœud (`ecart_sous_objectif_cible`, écart ≥ 1 point sous
        l'objectif). LE DÉFAUT CORRIGÉ : `cible_atteinte` lit « HbA1c ≤ cible », si bien qu'une HbA1c à
        6,3 % pour une cible de 8 % se lisait « objectif atteint » — un homme de 84 ans fragile,
        franchement sur-traité sous basale seule, recevait « Poursuivre le schéma en cours ». L'option
        « Désintensifier / alléger le schéma » n'existait qu'en `basal_bolus` ; elle gagne un SECOND
