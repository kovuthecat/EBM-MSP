      # fait de SÉCURITÉ, il doit s'afficher avec son motif, pas disparaître en silence. Utile aussi chez
      # le patient AVEC capteur : la voie `profil_nocturne_permet_titration` pouvait proposer la titration
      # sur une courbe en hausse alors que la glycémie du matin était basse.
      # ⚠ Ceci ne referme PAS le garde-fou de sur-titration reporté par le référent le 2026-07-29 (il
      # attend les créneaux horaires et la collecte) : ça n'en couvre qu'un cas, celui que la glycémie à
      # jeun rend visible sans rien mesurer de plus.
      # GARDE `mcg_disponible == false` AJOUTÉ le 2026-07-29 (2ᵉ arbitrage du jour). La première
      # rédaction laissait ce terme SANS garde, délibérément, pour qu'il protège aussi le patient équipé
      # d'un capteur. Le référent a corrigé : « quand il y a une MCG on regarde rarement les mesures de
      # glycémie isolée ; une glycémie à jeun basse se verra sur la courbe. » Une valeur ponctuelle ne
      # doit donc pas retirer un geste chez un patient dont on lit la courbe — ce sont `TBR > 4` et
      # `profil_nocturne == baisse_continue` (ci-dessus) qui portent ce fait, et ils suffisent.
      - "mcg_disponible == false AND gaj_basse == true"
    # `over_basalisation` A ÉTÉ RETIRÉ de ces exclusions le 2026-07-27 (arbitrage référent, après collecte
    # de preuve + red-team : `chantier-2026-07-27/preuve-sur-basalisation.md` et `redteam-sur-basalisation.md`).
    #
    # HISTORIQUE. Le 2026-07-25 le seuil était une alerte d'option ; le 2026-07-26 il est devenu une
    # EXCLUSION, au motif — juste — qu'une alerte laissait la carte recommander « Titrer, +2 U » tout en
    # affichant sur elle-même un message disant de ne pas majorer. La contradiction interne était réelle.
    # Mais la correction était disproportionnée à la preuve : RETIRER un geste est le canal le plus fort
    # de D21, et ce seuil ne le porte pas.
    #
    # CE QUI L'A FAIT RETIRER (tout vérifié en source primaire par le red-team) : le seuil vient d'un
    # post-hoc de 3 essais glargine (Umpierrez 2019, N=458, financé par le fabricant), où il n'était PAS
    # pré-spécifié — c'est la lecture de l'inflexion d'une courbe. L'ADA l'a porté de 2018 à 2023 puis l'a
    # explicitement RETIRÉ en 2025 (« Recommendation 9.27 was revised to remove consideration of basal
    # insulin doses exceeding 0.5 units/kg/day as evidence of overbasalization »), et il reste absent en
    # 2026. L'AACE, elle, le MAINTIENT depuis 2018 : les deux sociétés divergent, le seuil n'est donc ni
    # consensuel ni abandonné. Aucun essai n'a testé la stratégie « plafonner puis intensifier autrement »
    # contre « continuer à titrer ». Enfin les doses d'entretien réellement atteintes à la cible dans les
    # essais s'étalent de 0,34 à 0,78 U/kg : un gate à 0,5 coupe au milieu de la plage normale.
    #
    # CE QUI RESTAIT (jusqu'au 2026-08-06). Le seuil gardait un rôle de DÉCLENCHEUR sur « Ne pas
    # sur-titrer la basale — intensifier autrement » (ci-dessus), et le rang était censé hiérarchiser les
    # deux cartes quand elles coexistaient. RÉVISÉ le 2026-08-06 (P14/S4, T-167, décision référent) : ce
    # mécanisme n'opérait pas — `groupesExAequo` ne calcule les rangs qu'À L'INTÉRIEUR d'une famille, et
    # ces deux options sont dans deux familles différentes (« Sécurité — à corriger d'abord » /
    # « Intensifier le traitement »), dont l'une, `exclusive: false`, badge « recommandée » TOUTES ses
    # cartes. Vérifié : 2 des 180 profils figés du banc affichaient les deux cartes simultanément. La
    # sur-basalisation se lit désormais SUR LA COURBE MCG NOCTURNE (`profil_nocturne`), qui fait déjà
    # partition avec « Titrer la basale » et « Réduire la basale » (cf. leurs `conditions`) : le ratio
    # dose/poids, renommé `ratio_basale_poids_eleve`, n'est plus lu par AUCUNE `conditions`/`exclusions`
    # d'option — il redevient un simple REPÈRE, porté par une alerte de nœud (ci-dessous), limité à
    # l'absence de capteur (`mcg_disponible == false`). Le praticien qui titre sans capteur continue de
    # voir le repère, nommément relié aux deux cartes qui portent le geste (« Envisager d'instaurer une
    # mesure continue du glucose », « Ne pas sur-titrer la basale »).
    #
    # CE QUI N'A PAS ÉTÉ RETIRÉ, et pourquoi : la mention « majore l'hypoglycémie ». La collecte
    # concluait qu'elle était démentie par sa propre source ; le RED-TEAM a montré que c'était une lecture
    # sélective — l'analyse invoquée (Reid 2016) comporte deux volets, et le volet INTRA-PATIENT établit
    # qu'après franchissement du seuil la probabilité d'hypoglycémie augmente. La retirer aurait introduit
    # une erreur, et contredit l'ADA 2025/2026 qui conserve l'hypoglycémie parmi les signaux.
  # ═══════════ NOUVELLE OPTION — RÉDUIRE LA BASALE (T-067) ═══════════
  # CRÉÉE le 2026-08-02 (P12/S4), en exécution des arbitrages référent B3a/B3b/B3c du 2026-07-30
  # (`plans/P8/S9.md`, jamais lancée sur ce chemin — relancée ici après correction des chemins et des
  # numéros de ligne périmés, T-067). Mots du référent : « je confirme la volonté de changer hypo
  # nocturne par baisse continue qui déclenche diminuer la basale plutôt que corriger l'hypoglycémie ».
  #
  # B3a — POURQUOI UNE OPTION À PART. Avant ce lot, la baisse continue nocturne (AGP) déclenchait
  # « Corriger l'hypoglycémie ou la variabilité » (ci-dessus, désormais amputée de ce seul déclencheur —
  # cf. son commentaire) et AUCUNE option ne s'intitulait « réduire la basale » : le geste n'existait
  # qu'en texte, dans les `avantages` d' « Optimiser la répartition du basal-bolus » (« baisse continue
  # nocturne → réduire la basale »), derrière le chevron d'argumentaire et une table à cinq branches —
  # défaut mesuré en N11 de la recette du 2026-08-02 (`docs/decision/validation/
  # recette-praticien-naif-2026-08-02.md`) : « l'outil sait que je suis dans la branche 'baisse continue
  # nocturne', il possède la règle qui dit 'réduire la basale', et il m'affiche à la place un titre
  # générique en me laissant faire l'appariement moi-même ». OUVERTE DANS TOUS LES SCHÉMAS COMPORTANT UNE
  # BASALE (`situation_insuline != naif`), pas seulement `basale_seule`/`basale_plus_bolus` comme
  # l'ex-déclencheur : bénéfice de bord relevé par la même recette, « Corriger l'hypoglycémie… » est
  # fermée en `basal_bolus` (schéma qui en fait le plus) — cette carte, ouverte partout où il y a une
  # basale, comble ce trou aussi pour la baisse continue nocturne.
  #
  # FAMILLE — « Ajuster le schéma en place », pas « Alléger le schéma » (les deux options laissées au
  # choix par T-067). Justification en une ligne : ce geste ajuste UNE dose déjà en place à partir d'une
  # lecture AGP, exactement le registre d' « Optimiser la répartition du basal-bolus » (même famille,
  # même raisonnement — cette dernière porte déjà la phrase « baisse continue nocturne → réduire la
  # basale » dans ses `avantages`, réutilisée ici comme carte à part entière) ; « Alléger le schéma »
  # répond, elle, à un sur-traitement de FOND (fragilité, HbA1c sous la cible) sans signal actif ni
  # chiffre — cf. `inconvenients` ci-dessous pour la distinction explicite avec « Désintensifier… ».
  #
  # PAS DE DOUBLON avec « Optimiser la répartition du basal-bolus » (même famille, coexistence possible
  # en `basale_plus_bolus`/`basal_bolus` : cette dernière continue de proposer, en prose, la lecture
  # complète des 5 branches AGP — hors périmètre T-067, qui ne retouche pas cette option). `priorite: 1`
  # devant elle (`priorite: 2`) : la carte SPÉCIFIQUE au signal présent passe devant la carte GÉNÉRALE.
  #
  # B3b — CHIFFRAGE, PROVENANCE. ⚠ CORRIGÉ le 2026-08-02, en 2ᵉ passe, sur retour de l'orchestrateur du
  # plan P12. La 1ʳᵉ passe de cette carte écrivait « par symétrie avec le protocole de titration ; aucune
  # donnée propre à la décroissance » — en application littérale de la rectification de `plans/P12/S4.md`
  # (qui citait un rapport OpenEvidence : « aucun schéma de décroissance validé PAR ESSAI n'existe »).
  # VÉRIFICATION FAITE (étape 5 de P8/S9, « si une source du nœud porte un protocole de descente,
  # utilise-la et signale-le ») ET SIGNALÉE plutôt que tranchée par cette session : le nœud cite déjà HAS
  # 2024 R.87 et SFD 2025 Avis 18 comme portant EXPLICITEMENT la règle dans les deux sens (« augmentée OU
  # réduite de 1 ou 2 UI » — cf. commentaire de « Corriger l'hypoglycémie… » ci-dessus, § 4 et § 6 de
  # `insuline.argumentaire.md`) pour la descente RÉACTIVE (hypoglycémie/variabilité documentée) —
  # exactement le registre de cette carte. L'orchestrateur a confirmé l'erreur : OpenEvidence dit « aucun
  # ESSAI » (un fait sur le NIVEAU DE CERTITUDE, accord d'experts plutôt que randomisé) — pas « aucune
  # SOURCE » (l'existence d'une source, elle, n'est pas contestée). L'arbitrage référent du 2026-07-30
  # (« chiffrer par symétrie faute de donnée ») reposait donc sur une absence que le nœud lui-même
  # contredit — pas une décision clinique à rouvrir, une prémisse factuelle à corriger.
  # RÉSOLUTION : les chiffres (−2 U, −10 % au-delà de 40 U/j, réévaluation à 3 jours) sont désormais
  # portés, sur cette carte comme sur « Corriger l'hypoglycémie… », par HAS 2024 R.87 et SFD 2025
  # Avis 18 — accord d'experts (grade AE), PAS une donnée de devenir dur : aucun essai n'a comparé cette
  # règle de décroissance à une autre stratégie (nuance qui reste vraie et qui est conservée en
  # `inconvenients`, dans le même registre que « le recul manque, pas l'autorisation »). `niveau_preuve`
  # aligné sur `modere`, comme la carte voisine — mêmes sources, même grade, pas de raison de certitude
  # différente entre les deux cartes pour les mêmes chiffres (le déclencheur diffère, pas la preuve du
  # chiffre lui-même).
  #
  # PLANCHER — pas de garde-fou encodable. Vérifié dans `engine/deriveCritere.ts` (grammaire `calculs`,
  # ARITH_RE) : un seul opérateur binaire par expression, aucune fonction `max`/`min`/clamp, aucune
  # branche conditionnelle. Impossible d'écrire « la dose ne descend jamais sous 0 (ou un plancher
  # clinique) » dans `dose_basale_actuelle - 2` sans casser le parseur. Comme demandé par « Si bloqué »
  # de P8/S9 (« si rien n'existe, dis-le dans le bilan plutôt que d'inventer une garde dans l'expression
  # ») : rien n'existe, signalé ici et dans le bilan de session — pas de garde inventée. La carte le dit
  # en `inconvenients` (vérifier cliniquement à très faible dose).
  #
  # B3c — GARDE-FOUS. `mcg_disponible == true AND profil_nocturne == baisse_continue` reste, TEL QUEL,
  # une `exclusions` de « Titrer la basale » (ci-dessus) et de « Ne pas sur-titrer la basale » : cette
  # carte ne peut donc PAS cohabiter avec « Titrer la basale » — vérifié, ce sont ces exclusions
  # (inchangées, rôle 2 de la Décision clé de T-067) qui l'en empêchent mécaniquement, aucune exclusion
  # nouvelle à écrire ici. La cohabitation avec « Ajouter un bolus / un GLP-1 » (rôle 3, E-04b) reste
  # possible et voulue : sécurité/ajustement et intensification sont cumulables, jamais une alternative.
  - intitule: "Basale"
    role: geste
    action: reduire
    famille: "Ajuster le schéma en place"
    conditions:
      - "situation_insuline != naif"
      - "mcg_disponible == true AND profil_nocturne == baisse_continue"
    # MOTIFS AJOUTÉS le 2026-08-06 (contre-relecture rédactionnelle) : cette option n'en portait aucun,
    # et « Proposé parce que » rendait mécaniquement « Situation d'insulinothérapie ≠ Naïf d'insuline et
    # MCG disponible et Baisse continue… », lisible comme du code sur ses deux branches. Le premier motif
    # reprend la formulation déjà employée par « Désintensifier / alléger le schéma » pour la même branche.
    motifs:
      "situation_insuline != naif": "une insulinothérapie déjà en place"
      "mcg_disponible == true AND profil_nocturne == baisse_continue": "une baisse continue de la glycémie pendant la nuit, lue sur la mesure continue du glucose"
    priorite: 1
    avantages:
      - "Une baisse continue de la glycémie pendant la nuit, lue sur le profil de glucose ambulatoire (AGP) du capteur, désigne la basale : c'est elle qu'il faut réduire, et non le bolus."
      - "Le geste est chiffré et son rythme aussi : la même règle d'adaptation sert dans les deux sens, à la hausse comme à la baisse (HAS 2024, R.87 : « augmentée ou réduite de 1 ou 2 UI » ; SFD 2025, Avis 18)."
    inconvenients:
      - "Aucun essai n'a randomisé cette règle de décroissance contre une autre stratégie : c'est un accord d'experts, pas une donnée de devenir dur. Il encadre le geste, il ne le démontre pas."
      - "À très faible dose de basale, retirer 2 U représente une part importante du traitement : vérifier cliniquement la pertinence du résultat avant de l'appliquer."
      - "Ce geste corrige la couverture de la nuit ; il ne répond pas à un sur-traitement de fond — terrain fragile, HbA1c durablement sous l'objectif —, qui appelle un allègement plus large du schéma."
    effet_attendu: >-
      Aucun essai n'a mesuré ce que change une règle de décroissance de l'insuline basale, ni comparé
      celle-ci à une autre stratégie : le pas (−2 U, ou −10 % de la dose au-delà de 40 U/j) et le rythme
      (réévaluation tous les 3 jours) sont un accord d'experts concordant (HAS 2024 R.87 ; SFD 2025
      Avis 18) — la même règle que pour la montée, écrite explicitement dans les deux sens.
    delai_benefice: "3 jours — délai de réévaluation après une baisse de dose (accord d'experts) ; aucun essai n'a mesuré de délai de bénéfice"
    # `modere` → `faible` le 2026-08-07 (arbitrage référent) : aucun essai n'a randomisé cette règle de
    # décroissance (accord d'experts seul, cf. `effet_attendu` ci-dessus) — même fondement que
    # « Désintensifier », qui porte `faible` depuis le 2026-08-05 pour le même motif. Deux cartes au même
    # fondement portaient deux badges différents.
    niveau_preuve: faible
    references:
      - sfd-2025-avis18
      - has-2024-r87
    calculs:
      - { libelle: "Basale réduite (−2 U)", expression: "dose_basale_actuelle - 2", unite: "U/j" }
    apercu: "−2 U, ou −10 % de la dose au-delà de 40 U/j, avec réévaluation à 3 jours"
    posologie_detail:
      - "Réduire la basale de 2 U, ou de 10 % de la dose si elle dépasse 40 U/j (SFD 2025, Avis 18) ; réévaluer tous les 3 jours (HAS 2024, R.87)."
  # ═══════════ SITUATION 3 — AJOUT D'UN BOLUS / BASAL-PLUS ═══════════
  # E-04b/E-06 (2026-07-26) : les DEUX options ci-dessous sont désormais aussi applicables en situation
  # « basale seule » (3ᵉ item du 1er `conditions`) — RÉUTILISÉES telles quelles (même intitulé, même
  # argumentaire, mêmes `prerequis`), pas de contenu clinique nouveau, conformément à la décision référent
  # (« appuie-toi sur l'option existante… plutôt que d'inventer »). Cause commune aux 2 vignettes : en
  # « basale seule », dès que le geste de SÉCURITÉ (« Corriger l'hypoglycémie… ») ou le geste
  # « Ne pas sur-titrer... » est indiqué (HbA1c au-dessus de la cible malgré tout), le patient restait SANS
  # AUCUNE option d'EFFICACITÉ — seul un texte en prose (`avantages` de « Ne pas sur-titrer... ») évoquait
  # le GLP-1/bolus, jamais une carte actionnable. Référent : « oui, action de contrôle glycémique en
  # fonction des autres critères : soit un traitement non insulinique, soit ajouter un bolus. » Sécurité et
  # efficacité sont CUMULABLES, jamais une alternative — les deux options ci-dessous s'ajoutent donc à côté
  # du geste de sécurité/temporisation, sans le remplacer ; le choix entre elles reste porté par leurs
  # `prerequis` existants (ne pas déjà prendre la classe visée), déjà « les critères déjà collectés ».
  #
  # Déclencheur en « basale seule » : `cible_atteinte == false` ET l'un des signaux nommés par le
  # référent — hypoglycémie/variabilité nocturne (les 4 termes du déclencheur de « Corriger
  # l'hypoglycémie… », répétés ici à l'identique, aucun contenu nouveau) OU nuit déjà à la cible
  # (`gaj_a_cible`/`profil_nocturne_a_cible`, écart diurne — cf. bloc ci-dessous). `over_basalisation
  # == true` (RENOMMÉ `ratio_basale_poids_eleve`) RETIRÉ de ce déclencheur le 2026-08-06 (P14/S4, T-167,
  # décision référent) : la sur-basalisation se lit désormais sur la courbe MCG nocturne, pas sur le
  # ratio dose/poids — celui-ci ne pousse plus vers AUCUNE option, seule une alerte de nœud le porte.
  # Conséquence assumée : un patient sans capteur à GAJ HAUTE (nuit qui monte) n'obtient plus cette carte
  # ni « Ajouter un bolus » — la conduite est de titrer la basale (carte suivante) et d'envisager un
  # capteur (carte de tête, famille « Avant de décider — la mesure ») ; vérifié par vignette explicite
  # (`evaluateNode.insuline.test.ts`), pas seulement par lecture. ⚠ Portée volontairement LIMITÉE aux 2
  # signaux nommés par le référent en 2026-07-27 (hypoglycémie/variabilité nocturne, nuit à la cible) :
  # le cas « aucun signal » n'ouvre pas ce déclencheur — laissé en l'état (prose seule sur « Ne pas
  # sur-titrer... »), non demandé par le référent, non testé par une vignette ; signalé comme limite
  # plutôt que généralisé sans mandat.
  - intitule: "GLP-1 / association fixe d'abord"
    role: geste
    action: ajouter
    famille: "Intensifier le traitement"
    conditions:
      - "situation_insuline == basale_plus_bolus OR situation_insuline == basale_seule"
      # 12.11 (recette) : condition unique = situation, préemptant le repli pour toute entrée en
      # « basale_plus_bolus ». Ce geste d'intensification n'a d'objet que si l'objectif n'est pas atteint.
      - "cible_atteinte == false"
      # E-04b/E-06 : en « basale_plus_bolus », 1er terme toujours vrai (comportement inchangé, aucun
      # déclencheur supplémentaire) ; en « basale_seule », le 1er terme est faux et seul l'un des 5
      # signaux restants peut satisfaire cet item — cf. bloc de commentaire ci-dessus.
      # ÉCART POST-PRANDIAL ajouté le 2026-07-27 (arbitrage référent). Les deux derniers termes
      # couvrent le cas jusqu'ici sans réponse concrète en « basale seule » : le jeûne/la nuit sont
      # DÉJÀ à la cible (`gaj_a_cible` sans MCG, `profil_nocturne_a_cible` avec MCG) alors que
      # `cible_atteinte == false` — l'écart d'HbA1c est donc diurne, et monter la basale n'y peut
      # rien. Le patient ne recevait que la PROSE de « Ne pas sur-titrer… — intensifier autrement »,
      # qui dit d'intensifier sans dire par quoi ; il reçoit désormais les deux gestes nommés.
      # T-033 (P5/S2, 2026-07-28) : `mcg_disponible == true AND` ajouté devant les 4 signaux MCG bruts ET
      # devant `profil_nocturne_a_cible` (lui-même dérivé de `profil_nocturne`, désormais masqué sans
      # capteur) — sans quoi, sans capteur, ce terme restait INDÉTERMINÉ (I11). `gaj_a_cible` reste hors
      # garde : il ne dépend d'aucun champ masqué par T-033. `over_basalisation` (RENOMMÉ
      # `ratio_basale_poids_eleve`) est RETIRÉ de ce terme depuis le 2026-08-06 (P14/S4, T-167) — il n'a
      # donc plus sa place ici, gardée ou non.
      # 2026-07-29 (passe A) — DEUX changements dans ce terme :
      # (1) `mcg_disponible == true AND TBR_severe > 1` retiré avec le critère ;
      # (2) `gaj_basse == true` AJOUTÉ à côté de `gaj_a_cible == true`. Motif : ces deux termes disent la
      #     même chose du raisonnement — le jeûne/la nuit ne sont PAS le problème, donc monter la basale
      #     n'aidera pas et l'écart d'HbA1c est diurne. Une glycémie à jeun BASSE le dit a fortiori d'une
      #     glycémie à jeun à la cible. Sans cet ajout, le patient de la vignette V-A1 (nuit basse,
      #     HbA1c haute) recevrait le geste de sécurité (« Corriger l'hypoglycémie ») et AUCUNE réponse à
      #     son écart diurne — exactement le silence que l'arbitrage du 2026-07-27 avait comblé pour
      #     `gaj_a_cible`. ⚠ EXTENSION À CONFIRMER PAR LE RÉFÉRENT (invariant 6) : elle découle de
      #     « câbler au-dessus et en dessous », elle n'a pas été énoncée mot pour mot.
      - "situation_insuline == basale_plus_bolus OR mcg_disponible == true AND TBR > 4 OR mcg_disponible == true AND CV_glycemique > 36 OR mcg_disponible == true AND profil_nocturne == baisse_continue OR gaj_a_cible == true OR mcg_disponible == false AND gaj_basse == true OR mcg_disponible == true AND profil_nocturne_a_cible == true"
    # T-125 (P12/S5) : motif sur la branche booléenne négative isolée (2ᵉ item `conditions` ci-dessus) —
    # sans lui, rendu mécanique en « HbA1c à la cible : non », lisible comme du code.
    # T-152 (P13/S7, I28/D18) : motif négatif ajouté pour la branche `mcg_disponible == false AND
    # gaj_basse == true` (clé = la branche `OR` entière, cf. commentaire détaillé sur « Corriger
    # l'hypoglycémie ou la variabilité » plus haut) — sans lui, rendu mécanique en « … et MCG disponible :
    # non et Glycémie à jeun sous la cible (< 0,70 g/L) », lisible comme du code sur son premier atome.
    motifs:
      "cible_atteinte == false": "cible glycémique non atteinte"
      "mcg_disponible == false AND gaj_basse == true": "absence de mesure continue du glucose, glycémie à jeun sous la cible (< 0,70 g/L)"
    # R6 : garde-fou de cohérence (ne pas déjà prendre l'une des classes visées) — jamais montré comme
    # justification.
    prerequis:
      - "traitements_en_cours ne_contient_pas aGLP1 AND traitements_en_cours ne_contient_pas tirzepatide"
    priorite: 1
    avantages:
      - "Avant tout bolus prandial : ajouter un AR GLP-1, ou passer à une association fixe (IDegLira, iGlarLixi). Le contrôle obtenu est le même que sous basal-bolus (DUAL VII : HbA1c non-inférieure, écart −0,02 % ; méta Eng : −0,1 %)."
      - "Ce que cela épargne au patient : l'hypoglycémie (DUAL VII : rate ratio 0,11 ; méta Eng : RR 0,67 ; méta Maiorino : RR 0,66), la prise de poids (−3,6 kg ; −5,66 kg ; −4,7 kg) et les injections multiples (1 contre ≥ 4)."
