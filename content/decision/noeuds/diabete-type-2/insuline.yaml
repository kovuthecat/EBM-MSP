# Nœud E « Insuline » — contenu BROUILLON (2026-07-24).
# Autorité : docs/decision/noeuds/E-insuline.md (dossier de preuve : 5 agents A × OpenEvidence 2ᵉ passe ×
# red-team B1/B2/B3, PMID/DOI vérifiés/corrigés contre source primaire — §5b) + .argumentaire.md (niveau 3).
# EN ATTENTE DE VALIDATION RÉFÉRENT (arbitrages §8-1→8-7 tranchés). Les valeurs cliniques ne se modifient pas
# hors workflow veille → algorithme (D5).
#
# NŒUD MULTI-OPTIONS ROUTÉ PAR `situation_insuline` (4 situations séquentielles mutuellement exclusives :
# naif → basale_seule → basale_plus_bolus → basal_bolus). Chaque option porte le gate de sa situation ;
# dans une situation, plusieurs recommandations s'empilent, triées par `priorite` (rang croissant).
#
# DIMENSION MCG (§8-4) : deux axes. Axe CONTRÔLE (TIR/TAR/GMI) = redondant avec l'HbA1c qui gate déjà →
# interprétation + alertes (cibles = CONSENSUS Battelino 2019, PAS un critère dur). Axe SÉCURITÉ
# (TBR/TBR_severe/CV/hypo nocturnes) = critère DUR (EBM DEVOTE) → gate les recommandations de sécurité.
#
# DÉRIVÉS FORMULAIRE : `cible_atteinte` (position_vs_cible == a_l_objectif OR sous_objectif — RECÂBLÉ le
# 2026-08-06, P14/S11, T-180 : ex-`HbA1c_actuelle <= HbA1c_cible`, calculé ; unifié sur la définition de
# `prescription`, désormais la définition unique du domaine, cf. changelog et D50), `gaj_a_cible` (GAJ dans
# la cible), `ratio_basale_poids_eleve`
# (ex-`over_basalisation`, renommé le 2026-08-06 — P14/S4, T-167 : dose_basale_actuelle / poids > 0,5 U/kg
# ET absence de MCG — repère [À VÉRIFIER], jamais un déclencheur ni une exclusion d'option depuis cette
# date : la sur-basalisation se lit désormais SUR LA COURBE MCG nocturne (`profil_nocturne`), ce ratio
# n'alimente plus qu'une alerte de nœud, `niveau: attention`, limitée à l'absence de capteur), `risque_hypoglycemique_eleve` (fragilite OR esperance_vie==limitee OR age>=75 OR
# risque_hypoglycemie_schema==eleve OR hypo_severe_recurrente==true, aligné sur la relaxation du nœud A ; depuis 2026-07-26, gate
# (en `conditions`) « Désintensifier / alléger le schéma », qui utilisait jusque-là un triplet brut sans
# l'âge — cf. changelog. Gatait AUSSI « Choisir un analogue basal de 2ᵉ génération » jusqu'au 2026-08-06
# (P14/S5, T-168) : cette option est SUPPRIMÉE ce jour-là (modalité de posologie, pas une alternative — cf.
# son commentaire de suppression et le changelog), et le même repère ne pilote plus qu'une PROSE
# conditionnelle dans `posologie_detail` de « Initier une insuline basale », plus une `conditions` d'option.
# `hypo_severe_recurrente` FUSIONNÉ dans ce dérivé
# le 2026-07-26 (4ᵉ lot, arbitrage I3 du rapport red-team `docs/decision/validation/chantier-2026-07-26/
# redteam-clinique-silences.md` F4) : même concept de sécurité encodé deux fois — `risque_hypoglycemique_eleve` ici,
# `hypo_severe_recurrente` en OR littéral sur « Désintensifier » seulement — le défaut que l'invariant I4
# (« un concept, un encodage », `docs/decision/CONSTRUIRE-UN-MODULE.md`) cite nommément pour ce nœud.
# Conséquence à noter : élargit aussi la population qui reçoit les cibles de MCG ASSOUPLIES (alertes
# ci-dessous) à un patient dont le SEUL signal est un antécédent d'hypoglycémie sévère récurrente —
# décision non distinctement revue par le référent, cf. incertitudes).
#
# DOSES (§8-7) : aide au CALCUL à partir de `poids` (initiation = poids × 0,1-0,2 U/kg ; repli fixe 10 U) et
# des doses actuelles (majorations +2 U ou +10 % au-delà de 40 U/j ; diminutions −2 U, −10 % au-delà de
# 40 U/j, jusqu'à −4 U si l'hypoglycémie est symptomatique ; réévaluation tous les 3 jours ; basal-plus ≈ 10 % de
# la basale). Ratios dans l'argumentaire ; calcul câblé au formulaire (P3). Scope basal → basal-bolus (§8-5) ;
# HORS périmètre : ratios glucides-insuline / facteur de sensibilité formels, pompe & boucle fermée.
#
# ⚠ MESSAGES À NE JAMAIS TENIR : « l'insuline réduit les événements CV / la mortalité » (ORIGIN neutre) ; les
# cibles TIR ne sont PAS un critère dur (consensus) ; prandial/prémix systématique n'est pas fondé sur les
# preuves ; la réduction d'hypo SÉVÈRE des analogues 1ʳᵉ gén vs NPH n'est PAS significative (Cochrane 2020) ;
# Prescrire ne pose PAS la NPH en référence (invention écartée) ; il n'existe pas de position CMG dédiée.
id: insuline
domaine: diabete-type-2
titre: "Initier ou optimiser une insulinothérapie"
# `icone` ajouté 2026-08-05 (T-149, amélioration esthétique de l'écran de sélection des nœuds) —
# seringue : identification immédiate du nœud insuline, cf. `shared/icons/paths.ts`.
icone: seringue
population_cible: >-
  Adulte DT2 (hors DT1, grossesse, diabètes secondaires) chez qui une insulinothérapie est justifiée. Aide à
  la prescription en médecine générale : initiation et titration d'une basale, intensification par étapes
  (GLP-1 / combo fixe avant le bolus, puis basal-plus), adaptation d'un basal-bolus. Hors périmètre : pompe à
  insuline et boucle fermée (centres initiateurs) ; calcul formel des ratios glucides-insuline / facteur de
  sensibilité (éducation spécialisée).
selection: multi-options
argumentaire_exhaustif: "insuline.argumentaire.md"
criteres_entree:
  - nom: situation_insuline
    type: enum
    groupe: Situation d'insulinothérapie
    valeurs: [naif, basale_seule, basale_plus_bolus, basal_bolus]
  - nom: age
    # `partage` ajouté le 2026-07-29 (recette référent, item F) : même concept, encodage IDENTIQUE
    # sur tous les nœuds qui le déclarent (type, valeurs, bornes) — condition de l'invariant I19.
    partage: true
    type: nombre
    groupe: Profil et objectif glycémique
    min: 18
    max: 105
  - nom: HbA1c_actuelle
    type: nombre
    groupe: Profil et objectif glycémique
    min: 4
    max: 18
    # K6 (décision référent, 2026-07-27) : cette valeur SAISIE est reprise d'un nœud à l'autre dans la
    # même consultation, pré-remplie et signalée comme telle — jamais imposée. Bornes IDENTIQUES sur tous
    # les nœuds qui la déclarent : un critère `partage` doit avoir le même encodage partout (invariant du
    # banc), sinon on ferait circuler un concept sous un nom commun avec deux définitions.
    partage: true
  - nom: HbA1c_cible
    type: nombre
    groupe: Profil et objectif glycémique
    min: 6
    max: 9.5
    partage: true
    # `cache: true` (2026-08-10, demande utilisateur, unifié avec `prescription`) : ce nombre chiffré
    # n'est plus rendu dans le formulaire — il n'alimente plus que le `preremplissage` de
    # `position_vs_cible` en coulisse, qui reste seul visible/modifiable (R1 intact). Non traité par
    # `reinitialiserChampsMasques` : la valeur publiée par « Déterminer la cible » survit au rendu.
    cache: true
    # SEUL LECTEUR depuis le 2026-08-06 (P14/S11, T-180/T-181, D50) : le `preremplissage` de
    # `position_vs_cible` ci-dessous. `cible_atteinte`/`ecart_sous_objectif_cible` NE LE LISENT PLUS
    # (unifiés sur `position_vs_cible`, cf. leurs `derive` plus bas) — condition du garde-fou D50 : un
    # critère que `cible-glycemique` PUBLIE (T-181) ne peut avoir AUCUN lecteur hors `preremplissage`
    # (invariant dédié du banc, `invariants-contenu.test.ts`). Suffisant pour R5/T-164 : `preremplissage`
    # compte comme lecteur (S2/T-164, décision de plan explicite).
  # AJOUTÉ le 2026-08-06 (P14/S11, T-180, D50) : la définition de `prescription` — « où en est ce patient »
  # SE DÉCLARE, elle ne se déduit pas de la comparaison HbA1c_actuelle/HbA1c_cible — devient celle du
  # domaine (décision référent : la position déclarée par le praticien prime). `partage: true`, encodage
  # IDENTIQUE à `prescription` (même `type`, mêmes `valeurs`, même ORDRE — I19/I32) : `a_l_objectif` en
  # tête reste la seule valeur inerte sur un formulaire vierge, même raison qu'sur `prescription`.
  - nom: position_vs_cible
    type: enum
    groupe: Profil et objectif glycémique
    valeurs: [a_l_objectif, au_dessus, nettement_au_dessus, sous_objectif]
    partage: true
    # PRÉ-REMPLISSAGE (D50/T-181, P14/S11) — IDENTIQUE, texte pour texte, à celui de `prescription` (même
    # exigence que pour `cible_atteinte` ci-dessous : une divergence textuelle serait une divergence de
    # définition). Suggère la position depuis l'écart (HbA1c mesurée − cible PUBLIÉE par « Déterminer la
    # cible ») SEULEMENT si l'écart est net ; ZONE MORTE délibérée entre +0,3 et +0,5 point (bornes exclues
    # : rien n'y est proposé, aucune règle ne couvre cet intervalle — c'est le point de D50, cf. le
    # commentaire complet côté `prescription`, qui fait autorité pour ce mécanisme). PAS DE `default` :
    # un repli poserait une valeur sur un écart ambigu, exactement ce que la zone morte évite. ÉNUMÉRÉ PAR
    # VALEUR DE CIBLE (7/8/9, les trois plafonds que `cible-glycemique` publie — D50) plutôt qu'en une
    # comparaison arithmétique générale : le DSL de `conditions`/`preremplissage` (`engine/conditions.ts`)
    # ne compare QUE `variable OP littéral` ou `variable OP variable`, JAMAIS `variable OP (variable ±
    # littéral)` — l'arithmétique n'existe que côté `derive` (`engine/deriveCritere.ts`), et un `derive` qui
    # lirait `HbA1c_cible` violerait le garde-fou D50 (lecteur hors `preremplissage`). CONSÉQUENCE ASSUMÉE :
    # une cible SAISIE À LA MAIN hors {7, 8, 9} (ex. 7,5) ne déclenche aucune suggestion — cohérent avec
    # D50 (« si le nœud voisin n'a pas été ouvert, rien n'est publié, le champ reste purement déclaré »),
    # pas un défaut de ce contenu.
    preremplissage:
      - quand: "HbA1c_actuelle > 0 AND HbA1c_cible > 0 AND HbA1c_cible == 7 AND HbA1c_actuelle < 6.5 OR HbA1c_actuelle > 0 AND HbA1c_cible > 0 AND HbA1c_cible == 8 AND HbA1c_actuelle < 7.5 OR HbA1c_actuelle > 0 AND HbA1c_cible > 0 AND HbA1c_cible == 9 AND HbA1c_actuelle < 8.5"
        valeur: sous_objectif
      - quand: "HbA1c_actuelle > 0 AND HbA1c_cible > 0 AND HbA1c_cible == 7 AND HbA1c_actuelle >= 6.5 AND HbA1c_actuelle <= 7.3 OR HbA1c_actuelle > 0 AND HbA1c_cible > 0 AND HbA1c_cible == 8 AND HbA1c_actuelle >= 7.5 AND HbA1c_actuelle <= 8.3 OR HbA1c_actuelle > 0 AND HbA1c_cible > 0 AND HbA1c_cible == 9 AND HbA1c_actuelle >= 8.5 AND HbA1c_actuelle <= 9.3"
        valeur: a_l_objectif
      - quand: "HbA1c_actuelle > 0 AND HbA1c_cible > 0 AND HbA1c_cible == 7 AND HbA1c_actuelle >= 7.5 AND HbA1c_actuelle <= 8.5 OR HbA1c_actuelle > 0 AND HbA1c_cible > 0 AND HbA1c_cible == 8 AND HbA1c_actuelle >= 8.5 AND HbA1c_actuelle <= 9.5 OR HbA1c_actuelle > 0 AND HbA1c_cible > 0 AND HbA1c_cible == 9 AND HbA1c_actuelle >= 9.5 AND HbA1c_actuelle <= 10.5"
        valeur: au_dessus
      - quand: "HbA1c_actuelle > 0 AND HbA1c_cible > 0 AND HbA1c_cible == 7 AND HbA1c_actuelle > 8.5 OR HbA1c_actuelle > 0 AND HbA1c_cible > 0 AND HbA1c_cible == 8 AND HbA1c_actuelle > 9.5 OR HbA1c_actuelle > 0 AND HbA1c_cible > 0 AND HbA1c_cible == 9 AND HbA1c_actuelle > 10.5"
        valeur: nettement_au_dessus
  - nom: cible_atteinte
    type: bool
    # RECÂBLÉ le 2026-08-06 (P14/S11, T-180, D50) : ex-`HbA1c_actuelle <= HbA1c_cible` (CALCULÉ).
    # `prescription` définissait déjà « cible atteinte » comme un ÉTAT DÉCLARÉ — R1 (GRAMMAIRE-NOEUD.md) —
    # et cette définition devient celle du DOMAINE (décision référent 2026-08-06 : « la position déclarée
    # par le praticien prime »). EXPRESSION LITTÉRALEMENT IDENTIQUE à `prescription.cible_atteinte` :
    # l'invariant T-162 (S2/`coherence-inter-noeuds.test.ts`) compare le TEXTE de la règle, pas sa
    # sémantique — toute reformulation même équivalente romprait l'unification qu'il vérifie.
    derive: "position_vs_cible == a_l_objectif OR position_vs_cible == sous_objectif"
  - nom: ecart_sous_objectif_cible
    type: bool
    # « SOUS la cible », ajouté le 2026-07-29 (passe A, arbitrage référent : « il faut effectivement que
    # le nœud insuline comporte le concept de sous la cible »).
    #
    # LE DÉFAUT CORRIGÉ (vignette V-A5, mesuré sur le moteur) : `cible_atteinte` lisait « HbA1c ≤ cible »,
    # si bien qu'une HbA1c à 6,3 % pour une cible fixée à 8 % se lisait « objectif atteint ». Un homme de
    # 84 ans, fragile, vivant seul, franchement SUR-TRAITÉ, recevait « Poursuivre le schéma d'insuline en
    # cours et réévaluer » — alors que le sur-traitement du sujet âgé est le risque autour duquel tout le
    # nœud A est construit. Le nœud ne portait aucun concept d'écart NÉGATIF à la cible.
    #
    # ⚠ NOM REPRIS OCTET POUR OCTET de `prescription` (P7/T-048, même journée), et ce n'est pas une
    # coquetterie de nommage — cf. l'historique complet plus bas dans le changelog pour la collision de
    # nom évitée avec `hba1c_sous_cible` (concept DIFFÉRENT, plancher ABSOLU indépendant de la cible).
    #
    # RECÂBLÉ le 2026-08-06 (P14/S11, T-180, D50, « on garde position vs cible pour insuline 12 ») :
    # ex-`HbA1c_actuelle > 0 AND HbA1c_cible > 0 AND HbA1c_cible - HbA1c_actuelle >= 1` (écart ≥ 1 point
    # sous l'objectif, CALCULÉ). CE QUI SE PERD : la nuance de MAGNITUDE — « au moins 1 point sous la
    # cible » devient simplement « sous la cible », quel que soit l'écart réel (0,1 point ou 3 points se
    # lisent désormais pareil). CE QUI EST GAGNÉ : une seule définition de « sous la cible » dans tout le
    # domaine, cohérente avec `cible_atteinte` ci-dessus et avec `prescription` — un patient qui déclare sa
    # position ne peut plus se lire différemment selon l'écran. Arbitrage référent explicite (pas un
    # correctif mécanique) : la magnitude n'était lue nulle part ailleurs que par ce seuil précis, et la
    # définition unique prime sur elle.
    derive: "position_vs_cible == sous_objectif"
  - nom: DFG
    # `partage` ajouté le 2026-07-29 (recette référent, item F) : même concept, encodage IDENTIQUE
    # sur tous les nœuds qui le déclarent (type, valeurs, bornes) — condition de l'invariant I19.
    partage: true
    type: nombre
    groupe: Profil et objectif glycémique
    min: 3
    max: 150
  - nom: traitements_en_cours
    type: liste
    groupe: Traitement actuel
    # ORDRE ALIGNÉ sur celui de `prescription` (I19 : un critère `partage` a le même encodage partout,
    # `valeurs` inclus). Un réordonnancement pour raison de lisibilité (regrouper sulfamide/gliptine/
    # glinide dans la grille de cases à cocher) a été TENTÉ puis ANNULÉ le 2026-08-01 : `valeurs` n'est
    # pas purement présentationnel comme on pourrait le croire — `engine/banc/profils.ts`
    # (`sousEnsemblesStratifies`) mélange CET ORDRE DÉCLARÉ (Fisher-Yates) pour tirer les sous-ensembles
    # du banc, et le changer a fait perdre à CE nœud son seul profil couvrant le repli « Pas d'indication
    # à initier une insuline aujourd'hui » (banc de 1760 profils). Restauré à l'ordre d'origine.
    valeurs: [metformine, iSGLT2, aGLP1, tirzepatide, sulfamide, gliptine, insuline_basale, insuline_rapide, glinide]
    # `partage` ajouté le 2026-07-29 (recette référent, point 5) : ce qui est COCHÉ sur un module
    # apparaît coché sur l'autre. Ne touche PAS à `presomption_non` (présent ici, absent sur
    # `prescription`) : la recopie ne concerne que les valeurs réellement TOUCHÉES par le praticien
    # (`lib/sessionCriteres.ts` `memoriserCriteres`), alors que `presomption_non` ne régit que le cas
    # NON touché (déterminisme du moteur). Les deux préoccupations sont disjointes — cf. l'entrée
    # `traitements_en_cours` de `CRITERES_DIVERGENTS_CONNUS`.
    partage: true
    # T-018 (P4/S1, D30) : éligible mécaniquement à presomption_non SUR CE NŒUD (ne participe ici à aucune
    # condition d'option `role: securite` ni à aucune `exclusions` — seulement des `alertes` de nœud,
    # canal distinct). Ce critère est déjà connu DIVERGENT entre nœuds (`engine/banc/
    # coherence-inter-noeuds.test.ts`, valeurs différentes sur `insuline`) : sur `prescription`, ce même
    # nom NE reçoit PAS presomption_non (il y gate plusieurs options `role: securite` et exclusions
    # rénales/cétose) — divergence assumée, cf. l'entrée existante.
    presomption_non: true
    # A4/F (2026-07-27) — PREMIER USAGE de `valeurs_visible_si`, et le défaut qui l'a fait écrire : chez un
    # patient déclaré NAÏF d'insuline, les deux cases d'insuline restaient cochables. Le contenu ne pouvait
    # rien y faire et le disait déjà lui-même, quelques lignes plus bas sur `profil_glycemique` :
    # « `visible_si` porte sur un champ entier : impossible de masquer UNE valeur d'une liste dont les
    # quatre autres restent pertinentes ». Ce critère est PARTAGÉ avec `prescription` — le contournement
    # employé deux fois (scinder la valeur en critère propre, cf. `hypo_interprandiale`) ne s'y appliquait
    # pas sans dupliquer un critère commun. Troisième occurrence du même manque, d'où le mécanisme.
    #
    # ARTICULATION AVEC LA CONTRAINTE de saisie déclarée en tête de ce fichier, qui couvre la MÊME
    # incohérence : les deux sont nécessaires et ne font pas double emploi. R8 le dit — « une alerte ne
    # retire rien : elle commente une saisie qu'il faudrait empêcher ». Ici, le masquage EMPÊCHE la saisie
    # dans le formulaire ; la contrainte, elle, reste indispensable au BANC, qui ignore `visible_si` et
    # continuerait sinon d'engendrer des patients naïfs sous insuline. Prévention à l'écran, garde-fou à
    # l'instrument.
    valeurs_visible_si:
      insuline_basale: "situation_insuline != naif"
      insuline_rapide: "situation_insuline != naif"
  - nom: preference_injection
    type: enum
    groupe: Traitement actuel
    # ORDRE ALIGNÉ le 2026-07-29 sur celui de `prescription` (`indifferent` en tête). Ce n'était PAS
    # cosmétique : `valeurParDefaut` renvoie la PREMIÈRE valeur déclarée, donc la même question s'ouvrait
    # sur « accepte » ici et sur « indifferent » là. `indifferent` est retenu comme défaut parce qu'il est
    # le seul des trois qui n'oriente pas la réponse. Divergence résorbée -> son entrée est retirée de
    # `CRITERES_DIVERGENTS_CONNUS` (`engine/banc/coherence-inter-noeuds.test.ts`).
    valeurs: [indifferent, accepte, refuse]
    # `partage` ajouté le 2026-07-29 (recette référent, item F/point 5) : encodage désormais IDENTIQUE
    # sur tous les nœuds qui le déclarent (type, valeurs, bornes, presomption_non) — condition I19.
    partage: true
  # T4/(a) (chantier visible_si, capture 7) : ce groupe de 7 champs n'a d'objet que pour un patient DÉJÀ
  # sous insuline (surveillance/titration) — un patient « naïf » n'a ni dose en cours ni MCG à interpréter.
  # Masquer les remet à leur valeur par défaut (P1) ; vérifié sans conséquence pour ces 7 : aucune règle
  # d'option ne les lit hors de leur situation propre, à l'exception des alertes I6/I7 (gatées par
  # `mcg_disponible == true`, donc naturellement inertes une fois celui-ci remis à `false`) et de l'alerte
  # `mcg_disponible == false` (piège actif, corrigée ci-dessous par un second terme de situation).
  - nom: mcg_disponible
    type: bool
    groupe: Surveillance glycémique
    visible_si: "situation_insuline != naif"
  - nom: TBR
    type: nombre
    groupe: Surveillance glycémique
    min: 0
    max: 100
    # T-033 (P5/S2, 2026-07-28, BILAN-P4 §3bis) : second terme ajouté. `mcg_disponible` existait déjà
    # comme critère mais ne commandait aucun affichage — un patient non naïf mais SANS capteur se voyait
    # réclamer ce champ qu'il ne peut structurellement pas remplir (un lecteur capillaire ne rend pas de
    # TBR). Masquage désormais conditionné aux DEUX : schéma déjà instauré ET capteur disponible.
    visible_si: "situation_insuline != naif AND mcg_disponible == true"
  # ─────────────────────────────────────────────────────────────────────────────────────────────────
  # `TBR_severe` A ÉTÉ RETIRÉ DU NŒUD le 2026-07-29 (passe A, arbitrage référent). Il était ici, entre
  # `TBR` et `CV_glycemique`, masqué depuis T-033 quand le capteur manquait.
  #
  # MOTIF, et il est plus large que le masquage : la répartition TBR / TBR sévère **ne se lit pas en
  # consultation, même chez un patient ÉQUIPÉ d'un capteur**. Elle suppose de télécharger les données du
  # récepteur sur un ordinateur, geste rarement fait pendant la consultation. Le champ n'était donc pas
  # seulement inatteignable SANS capteur (ce que T-033 avait traité en le masquant) : il l'est aussi en
  # pratique AVEC capteur, au moment précis où la décision se prend. Un champ qu'on ne peut pas remplir
  # au bon moment n'est pas un champ « à masquer », c'est un champ qui n'a pas lieu d'être — R5 (« un
  # critère qu'on demande doit agir ») lu par l'autre bout : ici il ne peut même pas être renseigné.
  #
  # CE QUI PART AVEC LUI : la contrainte de saisie D31 (`TBR_severe <= TBR`, cf. bloc `contraintes`
  # ci-dessous), qui n'a plus d'objet ; 4 termes de `conditions` ; 4 `exclusions` ; 1 terme de l'alerte
  # d'orientation spécialiste. Dans TOUS ces emplacements, le signal de sécurité reste porté par les
  # autres termes de la même disjonction (`TBR > 4`, `CV_glycemique > 36`, `profil_nocturne ==
  # baisse_continue` — ex-`profil_glycemique contient hypo_nocturne`, renommé P8/S7 2026-07-30 —,
  # `hypo_severe_recurrente`) : aucun garde-fou ne disparaît, seul son 2ᵉ seuil s'en va.
  # ─────────────────────────────────────────────────────────────────────────────────────────────────
  - nom: CV_glycemique
    type: nombre
    groupe: Surveillance glycémique
    min: 0
    max: 100
    # Même piège, même conclusion que TBR_severe ci-dessus (0 n'est jamais > 36) — y compris après T-033
    # (P5/S2, 2026-07-28) : même second terme, même mécanisme de remise à défaut.
    visible_si: "situation_insuline != naif AND mcg_disponible == true"
  # ─────────────────────────────────────────────────────────────────────────────────────────────────
  # DEUX CHAMPS, DEUX `enum` (P8/S7, arbitrage référent 2026-07-30). Remplace l'ancien `profil_glycemique`
  # (`liste`, 4 valeurs cochables : hypo_nocturne / phenomene_aube / excursions_postprandiales / stable) ET
  # le critère propre `hypo_interprandiale`, qui en avait été SORTI le 2026-07-27 — `visible_si` porte sur
  # un champ ENTIER : impossible de masquer UNE valeur d'une liste dont les quatre autres restent
  # pertinentes en « basale seule ». Le référent défait cette scission autrement, EN CONNAISSANCE DE
  # CAUSE : les deux signaux ENTRE LES REPAS (excursions post-prandiales, hypo interprandiale) rejoignent
  # leur PROPRE champ `profil_entre_repas`, gaté sur la présence d'un bolus — le motif R5 qui avait imposé
  # la scission est donc satisfait autrement, et mieux : un champ par groupe clinique (nocturne / entre les
  # repas) plutôt qu'un champ scindé en deux natures différentes.
  - nom: profil_nocturne
    type: enum
    groupe: Profil glycémique nocturne
    # Trois FORMES de la courbe nocturne, et non plus quatre cases cochables : la nuit BAISSE, MONTE, ou
    # reste PLATE. `courbe_plate` remplace `stable` — même observation, nom qui ne préjuge plus d'un geste
    # (« stable » laissait entendre « rien à faire » ; le geste dépend désormais de `cible_atteinte`, cf.
    # les deux dérivés ci-dessous — c'est la partie clinique de cette session).
    valeurs: [baisse_continue, hausse_continue, courbe_plate]
    # `visible_si` RECOPIÉ À L'IDENTIQUE de l'ancien `profil_glycemique` (T-033, P5/S2, 2026-07-28) : un
    # profil AGP n'existe que si un capteur est posé, et pas chez le naïf.
    visible_si: "situation_insuline != naif AND mcg_disponible == true"
  - nom: profil_entre_repas
    type: enum
    groupe: Profil glycémique entre les repas
    # Trois valeurs : une hausse (ex-`excursions_postprandiales`, pic post-prandial — le jeûne/la nuit sont
    # à la cible, l'écart est diurne), une baisse (ex-`hypo_interprandiale`, hypoglycémie entre les repas —
    # accuse le BOLUS, pas la basale), et « pas de signal ». CETTE TROISIÈME VALEUR N'EST PAS UNE LIBERTÉ
    # DE CONCEPTION, c'est une conséquence de D20/D30 : `hypo_interprandiale` portait `presomption_non:
    # true` (non répondu = « non ») ; un `enum` n'a pas de présomption (ce mécanisme ne s'applique qu'à
    # `bool`/`liste`, `engine/deriveCritere.ts` `critereEstDetermine`). Sans cette troisième valeur, un
    # praticien qui n'a AUCUN signal entre les repas ne peut pas le dire, et « Optimiser la répartition du
    # basal-bolus » — dont la condition cite ce critère dans une disjonction — partirait « en attente » au
    # lieu de se résoudre.
    valeurs: [hausse_entre_repas, baisse_entre_repas, pas_de_signal]
    # `visible_si` RECOPIÉ À L'IDENTIQUE de l'ancien `hypo_interprandiale` (R5 : un critère qu'on demande
    # doit agir — en « basale seule » ou chez le naïf, il n'y a pas de bolus à réduire ou majorer, la
    # question n'est pas posée).
    visible_si: "situation_insuline == basale_plus_bolus OR situation_insuline == basal_bolus"
  # ─────────────────────────────────────────────────────────────────────────────────────────────────
  - nom: GAJ
    type: nombre
    groupe: Surveillance glycémique
    min: 0.4
    max: 5
    # CORRECTIF PRÉ-RECETTE (2026-08-02, backlog `TASKS.md` non numéroté) : second terme ajouté, MÊME mécanisme que T-033 sur
    # `TBR`/`CV_glycemique`/`profil_nocturne` ci-dessus. `GAJ` est le repère de repli quand il N'Y A PAS
    # de capteur (cf. commentaire de `gaj_a_cible`/`gaj_basse`/`gaj_haute` plus bas : « la GAJ est le cas
    # de repli quand il n'y a pas de MCG »). Sans ce second terme, un patient ÉQUIPÉ d'un capteur se
    # voyait réclamer une saisie manuelle que le moteur n'utilise jamais dans son cas — bruit de saisie
    # sur le nœud le plus lourd du domaine (34 critères), constaté et tracé dans `STATUS.md`/`TASKS.md`.
    visible_si: "situation_insuline != naif AND mcg_disponible == false"
    # LA VALEUR ATTENDUE EST UNE HABITUDE, PAS UNE MESURE ISOLÉE (arbitrage référent, 2026-07-29).
    # Motif : la règle de descente retenue est celle d'ebmfrance, qui ne réagit pas à une glycémie basse
    # isolée (« 1 fois sur 3 : ne rien changer ; plus souvent : −2 U »). Encoder cette fréquence aurait
    # demandé un critère de plus ; le référent a préféré la porter par le LIBELLÉ et l'AIDE du champ —
    # solution retenue aussi parce que c'est déjà l'esprit de la règle de MONTÉE que le nœud affiche
    # (« +2 U si elle reste au-dessus 3 matins de suite »). Le champ décrit donc la valeur HABITUELLE des
    # derniers matins, et non la dernière relevée : c'est ce qui rend la lecture des trois états
    # (`gaj_basse` / `gaj_a_cible` / `gaj_haute`) conforme aux règles qu'ils déclenchent.
    # ⚠ À NE PAS « SIMPLIFIER » PLUS TARD : retirer cette aide rendrait le nœud réactif à une valeur
    # isolée, ce que ni ebmfrance ni HAS R.87 (qui adapte « tous les 3 jours ») ne font.
    aide: >-
      Reportez la valeur HABITUELLE des 3 derniers matins, pas la dernière mesure. Une seule glycémie
      basse isolée ne justifie pas de réduire la dose ; c'est sa répétition qui compte.
  # TROIS ÉTATS DE LA GLYCÉMIE À JEUN, et non plus un booléen d'appartenance (passe A, arbitrage référent
  # du 2026-07-29 : « il faut bien câbler au-dessus et en dessous pour la glycémie à jeun »).
  #
  # LE DÉFAUT CORRIGÉ, tel qu'il a été mesuré sur le moteur le 2026-07-29 (vignette V-A1,
  # `docs/decision/validation/chantier-2026-07-29/vignettes-insuline-sans-capteur.md`) : `gaj_a_cible`
  # décrit l'APPARTENANCE à l'intervalle 0,70-1,20 g/L, donc sa négation confond « au-dessus » et « en
  # dessous ». Or « Titrer la basale » se déclenchait sans MCG sur `gaj_a_cible == false`. Conséquence
  # réelle : un patient à 0,58 g/L le matin, HbA1c 8,4 % pour une cible de 7 %, recevait
  # « Titrer la basale — +2 U » comme SEULE carte de l'écran. Le tableau était celui d'une
  # sur-basalisation (nuit trop couverte, écart diurne), et l'outil répondait exactement à l'envers.
  # À 0,37 U/kg, ce patient n'était même pas rattrapé par le repère de sur-basalisation (0,5 U/kg).
  #
  # BANDE DE CIBLE = 0,70-1,30 g/L (arbitrage référent du 2026-07-29, après collecte + red-team).
  #
  # SOURÇAGE, ÉTABLI ET VÉRIFIÉ EN PRIMAIRE — la première rédaction de ce commentaire (2026-07-29, moi)
  # attribuait ces bornes à Treat-to-Target (Riddle 2003) : c'était FAUX. L'algorithme de Riddle est
  # hebdomadaire, gradué (+2/+4/+6/+8 U par bande) et vise ≤ 1,00 g/L. Les bornes du nœud viennent de la
  # HAS : fiche de bon usage « BUTS » d'avril 2011 (en mg/dL, « avant les repas, 70 à 120 ; en
  # post-prandial à 2 h, < 180 ») et surtout **guide HAS « Parcours de soins du patient adulte vivant avec
  # un DT2 » du 26 juin 2025, §5.2, qui les écrit EN G/L** : « avant les repas : 0,70 à 1,20 g/l ; en
  # post-prandial (2 heures après le repas) : < 1,80 g/l ». Les deux PDF sont désormais dans
  # `docs/decision/sources/` et ont été vérifiés page à page. ⚠ Ni l'un ni l'autre n'imprime de GRADE ni
  # ne cite d'essai : force forte, **certitude très faible**.
  #
  # POURQUOI 1,30 ET NON 1,20 — DIVERGENCE ASSUMÉE AVEC LA HAS. Le référent a retenu la borne haute de
  # SFD 2025 (Avis 18) et d'ADA 2026, qui visent 0,80-1,30, plutôt que celle de la HAS. Effet : on ne titre
  # à la hausse qu'au-dessus de 1,30, donc un peu plus tard. Cette divergence a désormais son entrée dans
  # `sources.reco_officielle.divergences[]` (« La cible de glycémie avant les repas ») — jusqu'ici ce
  # commentaire affirmait qu'elle y était déclarée, alors qu'elle ne vivait qu'en prose dans
  # l'argumentaire exhaustif et dans ce commentaire même.
  #
  # POURQUOI 0,70 EN BAS, ALORS QUE SFD ET ADA DISENT 0,80. Arbitrage référent, et il est cohérent :
  # la borne basse n'est pas ici une frontière de cible, c'est le DÉCLENCHEUR d'une réduction de dose
  # (`gaj_basse`, ci-dessous). La placer à 0,80 ferait baisser l'insuline sur des valeurs qu'aucune source
  # ne juge basses. À 0,70, elle coïncide avec le seuil international d'HYPOGLYCÉMIE (Battelino 2019,
  # repris au Tableau II de la SFD) — ce qui est exactement où doit se trouver un déclencheur de sécurité.
  # La réserve soulevée par la collecte A5 (« la cible commence là où finit l'hypoglycémie ») ne vaut donc
  # que si l'on lit 0,70 comme une borne de cible ; lue comme un seuil d'alerte, elle tombe.
  #
  # PAS DE GARDE `GAJ > 0` sur `gaj_basse`, à la différence de la convention posée par P7/T-048 sur les
  # dérivés d'HbA1c — et c'est délibéré : les seuls chemins qui remettent `GAJ` à sa valeur par défaut (0)
  # sont les deux masquages `visible_si` (`situation_insuline != naif AND mcg_disponible == false`,
  # correctif pré-recette 2026-08-02), et les DEUX termes sont DÉJÀ répétés en tête de chaque dérivé
  # ci-dessous (R8, `docs/decision/GRAMMAIRE-NOEUD.md`). Ajouter `GAJ > 0` introduirait le littéral `0`
  # dans les règles du nœud, donc la valeur `1` dans le domaine de tirage du banc (`seuilsNumeriques`,
  # `banc/profils.ts`, qui ajoute chaque littéral ±1) : un rééchantillonnage complet du banc, pour un
  # garde-fou inatteignable.
  #
  # `mcg_disponible == false` RÉPÉTÉ ICI (et non seulement dans le `visible_si` de `GAJ`) — correctif
  # pré-recette 2026-08-02, R8 : sans ce second terme, un patient non naïf ÉQUIPÉ d'un capteur (`GAJ`
  # masqué, donc remis à 0) verrait ces trois dérivés lus sur `GAJ = 0` par `calculerCriteresDerives`
  # (qui ne connaît pas `renseignes`, cf. sa docstring) — `gaj_basse` serait alors calculé `true` (0 < 0,7)
  # pour un patient dont on n'a simplement rien demandé. La détermination effective (`determinesEffectifs`)
  # neutralise déjà ce risque pour le MOTEUR (elle exclut `gaj_basse` de `effectifs` puisque `GAJ` n'est
  # pas dans `primitifs`) — cette répétition protège la LECTURE du contenu, pas seulement l'exécution :
  # R8 l'exige indépendamment de ce filet ternaire, cf. `invariants-contenu.test.ts` I10.
  - nom: gaj_a_cible
    type: bool
    derive: "situation_insuline != naif AND mcg_disponible == false AND GAJ >= 0.7 AND GAJ <= 1.3"
  - nom: gaj_basse
    type: bool
    # Glycémie à jeun SOUS la cible : la basale est trop forte la nuit. Ne titre jamais à la hausse —
    # `exclusions` de « Titrer la basale » ET déclencheur du geste correctif (« Corriger l'hypoglycémie
    # ou la variabilité », qui porte déjà la conduite : −2 U, ou −10 % au-delà de 40 U/j).
    derive: "situation_insuline != naif AND mcg_disponible == false AND GAJ < 0.7"
  - nom: gaj_haute
    type: bool
    # Glycémie à jeun AU-DESSUS de la cible : c'est le pivot de titration du repli sans MCG. Remplace
    # `gaj_a_cible == false` dans les `conditions` de « Titrer la basale » — même population MOINS les
    # patients en hypoglycémie à jeun, qui basculent sur `gaj_basse`.
    derive: "situation_insuline != naif AND mcg_disponible == false AND GAJ > 1.3"
  # E-03 (2026-07-26), REDÉFINI le 2026-07-30 (P8/S7, arbitrage référent) : PIVOT nocturne de la situation
  # « basale seule ». Le modèle change de forme, pas de principe — le référent avait dit trois fois (dont
  # recette capture 8) : « titrer sur la courbe nocturne, pas la GAJ ; la GAJ est le cas de repli quand il
  # n'y a pas de MCG, ce qui est maintenant rare. » Ces deux dérivés lisent `profil_nocturne` (jamais
  # `GAJ`) et remplacent `gaj_a_cible` comme pivot de « Titrer la basale » / « Ne pas sur-titrer... »
  # QUAND `mcg_disponible == true` (`gaj_a_cible` reste le pivot du repli SANS MCG, comportement inchangé
  # — cf. ces deux options plus bas). Un seul niveau de dérivation (ne référencent que `profil_nocturne`,
  # jamais un autre dérivé — `deriveCritere.ts` n'enchaîne pas les dérivés, cf. sa docstring
  # `calculerCriteresDerives` : « les critères dérivés dépendent des primitives saisies, pas les uns des
  # autres »). CE QUE LE 2026-07-30 CHANGE, ET C'EST LA PARTIE CLINIQUE DE LA SESSION : la courbe plate
  # (ex-« stable ») cesse d'admettre la titration ; seule une HAUSSE continue le fait désormais. Le
  # référent tranche que la courbe plate, si l'HbA1c reste au-dessus de l'objectif, dit que la basale
  # N'EST PAS EN CAUSE — c'est `profil_nocturne_a_cible` (composé avec `cible_atteinte` dans les
  # `conditions` des options consommatrices, cf. ci-dessous) qui porte désormais ce cas.
  - nom: profil_nocturne_permet_titration
    type: bool
    # Vrai SEULEMENT si la courbe MONTE (couverture basale insuffisante en fin de nuit) — c'est le seul
    # changement demandé le 2026-07-30 : la courbe PLATE en SORT (elle admettait la titration jusqu'ici,
    # au même titre que la hausse ; elle ne le fait plus, cf. `profil_nocturne_a_cible` ci-dessous).
    # ⚠ VIGILANCE (référent, inchangée) : `profil_nocturne` non renseigné (`enum` jamais présumé, D20) ne
    # vaut ni « plat » ni « en hausse » — ce dérivé reste `false` sur un champ non renseigné (ni
    # rassurant, ni un motif de titrer), sans passer par `presomption_non` (D30) : ce mécanisme ne
    # s'applique qu'aux critères SAISIS (`critereEstDetermine` ne l'évalue jamais sur un `derive`) ;
    # `profil_nocturne_permet_titration` est lui-même un dérivé, la question est ici de contenu clinique,
    # pas de saisie manquante.
    derive: "profil_nocturne == hausse_continue"
  - nom: profil_nocturne_a_cible
    type: bool
    # REDÉFINI le 2026-07-30 (arbitrage référent) : vrai si la courbe nocturne est PLATE — la nuit/le
    # jeûne sont à la cible, un écart d'HbA1c restant vient donc du JOUR, pas de la basale (même rationale
    # que `gaj_a_cible == true` côté GAJ). Le NIVEAU (HbA1c au-dessus de l'objectif) ne peut PAS entrer
    # dans ce dérivé : `cible_atteinte` est LUI-MÊME un `derive` (`HbA1c_actuelle <= HbA1c_cible`), et la
    # borne « un seul niveau de dérivation » ci-dessus l'interdit (composer les deux créerait un dérivé de
    # dérivé — `calculerCriteresDerives` calcule chaque `derive` depuis les PRIMITIFS saisis, jamais depuis
    # un autre `derive` déjà résolu). REPLI APPLIQUÉ (celui documenté dans le plan de tâche) : le second
    # terme (`cible_atteinte == false`) est porté dans les `conditions` des options consommatrices plutôt
    # que dans ce dérivé — VÉRIFIÉ : les 3 options qui lisent `profil_nocturne_a_cible` (« Ne pas
    # sur-titrer... », « Ajouter un GLP-1... », « Ajouter un bolus... ») portent déjà `cible_atteinte ==
    # false` comme item ANDé séparé de leurs `conditions` (pour d'autres raisons, antérieures à ce lot),
    # donc ce repli ne change la liste d'AUCUNE option concernée. L'ancien fondement (excursions
    # post-prandiales) change de champ : ce signal vit désormais dans `profil_entre_repas`
    # (`hausse_entre_repas`), qui n'a plus de rôle sur le pivot nocturne — TRANCHÉ le 2026-07-30, amende le
    # 2026-07-27 (qui l'y avait mis).
    derive: "profil_nocturne == courbe_plate"
  # ─────────────────────────────────────────────────────────────────────────────────────────────────
  # LE PIVOT « AVANT LES REPAS » (arbitrage référent B, 2026-07-29, forme 1 retenue : UN champ de plus).
  #
  # CE QUE LA COLLECTE A RENVERSÉ. Le cadrage du 2026-07-27 posait « la glycémie à jeun pour la basale,
  # les glycémies POST-prandiales pour la rapide ». La seconde moitié ne tient pas :
  #  - dans TOUS les protocoles de basal-plus (FullSTEP, STEP-Wise, 1-2-3, 4T), l'ajout d'un bolus est
  #    déclenché par l'HbA1c, et la dose se titre sur la glycémie PRÉ-prandiale du repas SUIVANT —
  #    FullSTEP vise 4,0-7,2 mmol/L, ± 1 U (vérifié en primaire, red-team B1) ;
  #  - STEP-Wise a RANDOMISÉ la question (titrer sur la post-prandiale vs sur le pré-prandial du plus
  #    gros repas) et ne trouve AUCUNE différence — ETD −0,06 % [−0,29 ; +0,17] (red-team B2 ; le
  #    « 31 % vs 27 % » qui circulait est invérifiable et n'est pas repris) ;
  #  - la HAS écrit « AVANT LES REPAS : 0,70 à 1,20 g/l », jamais « à jeun » (fiche BUTS 2011 et guide
  #    Parcours de soins du 26 juin 2025 §5.2, les deux au corpus, relus page à page).
  # Autrement dit, la cible du nœud n'a jamais été une cible « à jeun » : c'est une cible PRÉ-PRANDIALE,
  # dont la glycémie du matin n'est qu'un cas particulier. Le même seuil, posé avant un autre repas,
  # donne donc le critère du bolus — SANS créer de champ post-prandial.
  #
  # POURQUOI UN SEUL CHAMP, et pas un par repas. La charge de saisie est le risque n°1 déclaré du projet
  # (le nœud compte déjà 22 champs). Trois champs localiseraient l'injection en cause ; un seul suffit à
  # DÉCIDER, et c'est exactement ce que FullSTEP a fait — titrer le bolus du repas le plus déséquilibré.
  # Si l'usage montre qu'il faut localiser, le passage à trois champs se fera sans rien défaire.
  #
  # GARDES. Visible seulement si un BOLUS existe (sans bolus, il n'y a rien à titrer avec — même garde
  # que `profil_entre_repas`, ex-`hypo_interprandiale`) ET seulement SANS capteur : « quand il y a une MCG
  # on regarde rarement les mesures de glycémie isolée » (référent, 2026-07-29). Avec capteur, c'est
  # `profil_entre_repas` qui porte cette information (P8/S7, 2026-07-30 : ex-`profil_glycemique`).
  # ─────────────────────────────────────────────────────────────────────────────────────────────────
  - nom: glycemie_pre_repas
    type: nombre
    groupe: Surveillance glycémique
    min: 0.4
    max: 5
    visible_si: "mcg_disponible == false AND situation_insuline == basale_plus_bolus OR mcg_disponible == false AND situation_insuline == basal_bolus"
    aide: >-
      Au repas qui vous paraît le moins bien couvert : la glycémie mesurée juste AVANT le repas suivant
      (et non 2 h après celui-ci). Reportez la valeur habituelle, pas une mesure isolée. Même cible que
      le matin : 0,70 à 1,30 g/L.
  # ⚠ LES DEUX DÉRIVÉS CI-DESSOUS RÉPÈTENT LE GARDE `visible_si` DU CHAMP, et ce n'est pas de la
  # redondance décorative : c'est R8, et l'invariant I10 a rejeté la première rédaction qui l'omettait.
  # Sans le garde, un patient sans bolus (ou avec capteur) laisse le champ MASQUÉ, donc remis à sa valeur
  # par défaut 0 — et `glycemie_pre_repas < 0.7` deviendrait VRAI pour tout le monde. Le `> 0` seul ne
  # suffisait pas non plus : il protège du zéro, pas de l'indétermination qui ferait partir l'option
  # « en attente » sur un champ que l'écran n'affiche pas. Forme normale disjonctive obligatoire (le DSL
  # n'a pas de parenthèses et AND lie plus fort que OR), d'où la répétition des deux branches.
  - nom: pre_repas_haute
    type: bool
    # Le bolus du repas précédent est insuffisant. Même seuil que `gaj_haute` — c'est la même cible
    # pré-prandiale, à un autre moment de la journée.
    derive: "mcg_disponible == false AND situation_insuline == basale_plus_bolus AND glycemie_pre_repas > 1.3 OR mcg_disponible == false AND situation_insuline == basal_bolus AND glycemie_pre_repas > 1.3"
  - nom: pre_repas_basse
    type: bool
    # Le bolus du repas précédent est trop fort. Équivalent capillaire de `profil_entre_repas ==
    # baisse_entre_repas` (ex-`hypo_interprandiale`) : les deux ouvrent le même geste (réduire ce bolus).
    derive: "mcg_disponible == false AND situation_insuline == basale_plus_bolus AND glycemie_pre_repas > 0 AND glycemie_pre_repas < 0.7 OR mcg_disponible == false AND situation_insuline == basal_bolus AND glycemie_pre_repas > 0 AND glycemie_pre_repas < 0.7"
  # `partage` ajouté le 2026-08-05 (P13/S5, T-147, I3 de la revue de conception du 2026-08-04) : le
  # poids saisi sur `prescription` pilote directement les doses calculées ici (0,1/0,2 U/kg à
  # l'initiation) — le ressaisir était le défaut mesuré par la revue. MÊME ENCODAGE que
  # `prescription.yaml` (nombre, min 35, max 250, aucun `derive`) — condition de l'invariant I32
  # (`engine/banc/coherence-inter-noeuds.test.ts`) ; les DEUX nœuds doivent déclarer `partage: true`
  # pour qu'une valeur circule (`lib/sessionCriteres.ts` `valeursReprises` filtre sur le critère du nœud
  # LECTEUR, pas seulement de l'émetteur).
  - nom: poids
    type: nombre
    groupe: Profil et objectif glycémique
    min: 35
    max: 250
    partage: true
  - nom: dose_basale_actuelle
    type: nombre
    groupe: Traitement actuel
    min: 0
    max: 150
    # T4/(a) : un naïf n'a par définition aucune dose de basale en cours (12.10/capture 7) — pourtant
    # comptée parmi les critères décisifs non confirmés dans la recette. Sûr au masquage : aucune option
    # de la situation « naïf » ne lit ce champ ; `ratio_basale_poids_eleve` (ex-`over_basalisation`)
    # resterait à 0 (faux), le comportement déjà voulu pour un naïf.
    visible_si: "situation_insuline != naif"
  - nom: dose_rapide_actuelle
    type: nombre
    groupe: Traitement actuel
    min: 0
    max: 150
    # Seul le `calculs` de « Optimiser la répartition du basal-bolus » lit ce champ (dose totale = basale +
    # rapide). I1/F2 (2026-07-26, 4ᵉ lot) : cette option couvre désormais aussi « basale_plus_bolus » (un
    # bolus y est déjà en place, donc `dose_rapide_actuelle` y est tout aussi réel qu'en « basal_bolus ») —
    # `visible_si` élargi en conséquence, sinon le calcul « dose totale » aurait silencieusement ignoré la
    # dose de bolus déjà administrée (remise à 0 par défaut) pour cette situation.
    visible_si: "situation_insuline == basal_bolus OR situation_insuline == basale_plus_bolus"
  - nom: ratio_basale_poids_eleve
    type: bool
    # Renommé depuis `over_basalisation` le 2026-08-06 (P14/S4, T-167, décision référent) : le nom dit ce
    # qui est MESURÉ (un ratio dose/poids), pas ce qui est CONCLU (une sur-basalisation) — c'est exactement
    # l'écart que la preuve (`docs/decision/validation/chantier-2026-07-27/preuve-sur-basalisation.md`,
    # `redteam-sur-basalisation.md`) a établi : seuil grade E, post-hoc non pré-spécifié (Umpierrez 2019,
    # N=458, financé par le fabricant), porté par l'ADA de 2018 à 2023 puis explicitement retiré en 2025
    # (absent en 2026), maintenu par l'AACE depuis 2018 — deux sociétés savantes divergent, le seuil n'est
    # donc ni consensuel ni abandonné. Garde `mcg_disponible == false` AJOUTÉ au même arbitrage : la
    # sur-basalisation elle-même se lit désormais SUR LA COURBE MCG NOCTURNE (`profil_nocturne`, cf.
    # `profil_nocturne_a_cible`/`profil_nocturne_permet_titration`) ; ce ratio ne redevient un repère que
    # faute de capteur, où il n'y a rien d'autre à lire. Ne pilote plus aucune `conditions`/`exclusions`
    # d'option (cf. « Ne pas sur-titrer la basale », « Ajouter un GLP-1... », « Ajouter un bolus... »
    # ci-dessous) : seule une alerte de nœud le lit désormais (canal R8 « qualifie sans interdire »).
    derive: "situation_insuline != naif AND mcg_disponible == false AND dose_basale_actuelle / poids > 0.5"
  # P6/SA3 (2026-07-29) : les 5 champs ci-dessous (+ leurs 2 dérivés) étaient auparavant intercalés juste
  # après `DFG`, avant `traitements_en_cours` — reportés ici, à la fin de `criteres_entree`, uniquement
  # pour que l'ORDRE D'AFFICHAGE des groupes suive le raisonnement clinique (situation → profil → traitement
  # actuel → surveillance → signaux d'alerte → terrain) plutôt que l'ordre d'écriture d'origine. Aucun champ
  # renommé, supprimé, ni de logique modifiée — seul le classement en groupe d'affichage change (D5).
  - nom: risque_hypoglycemie_schema
    # `partage` ajouté le 2026-07-29 (recette référent, item F) : même concept, encodage IDENTIQUE
    # sur tous les nœuds qui le déclarent (type, valeurs, bornes) — condition de l'invariant I19.
    partage: true
    type: enum
    groupe: Signaux d'alerte et tolérance
    valeurs: [faible, eleve]
    # `aide` ajouté T-086 (P10/S9, 2026-08-01) — TEXTE IDENTIQUE à celui de `prescription.yaml` (le
    # critère est `partage: true` : deux définitions différentes du même champ seraient pires que zéro).
    # En réponse au rapport de recette (« aucune définition, aucune infobulle » sur le champ qui fait
    # basculer « Désintensifier » au clic « Élevé »). L'investigation P9/S7 (bilan complet dans
    # `plans/P9/S7.md`) a établi que ce champ cumule DEUX lectures irréductibles l'une à l'autre, portées
    # par ses 4 usages (A/C sur `prescription.yaml`, D ici dans le `derive` de
    # `risque_hypoglycemique_eleve` — schéma déjà en place ; B sur `prescription.yaml` — terrain qui
    # exposerait un traitement pas encore introduit), et que ni la fusion en un dérivé automatique
    # (issue 1) ni le silence (issue 3) n'étaient tenables : le champ reste SAISI, tel quel (arbitrage
    # référent du 2026-07-31, hors périmètre de cette tâche). Le texte ci-dessous couvre les deux
    # versants sans trancher entre eux, plutôt que d'en cacher un.
    aide: >-
      Un jugement clinique, pas une simple case du dossier : « Élevé » si le schéma en cours expose
      (sécrétagogue — sulfamide, glinide — ou insuline, dose élevée, prises irrégulières ou repas
      sautés), ou si le terrain exposerait un futur traitement même sans hypoglycémiant actuel (âge
      avancé, insuffisance rénale, fragilité, hypoglycémie sévère antérieure). « Faible » sinon.
  # CONVERTI (2026-08-07, P14/S17, T-190) : déclaration complète remplacée par `{ ref: hypo_severe_recurrente }`,
  # référence à sa DÉFINITION déplacée vers content/decision/criteres-communs/diabete-type-2.yaml (ajoutée par
  # S16, T-189, reprise à l'identique de cette déclaration — `type: bool` seul). `groupe` reste ici : c'est de
  # la mise en scène LOCALE à ce nœud, pas une part de la définition du fait. Aucun autre champ de mise en
  # scène (`visible_si`, `valeurs_visible_si`, `debut_de_ligne`, `masque_si_indetermine`, `preremplissage`,
  # `libelle_masque`, `presomption_non`) : la déclaration d'origine n'en portait aucun — vérifié avant cette
  # conversion, rien à reporter. Résolu par `loadNodes.ts` au chargement — ce nœud continue de recevoir
  # `hypo_severe_recurrente` en `CritereEntree` complet, identique bit à bit à avant ce changement (S14/T-190,
  # docs/decision/validation/criteres-communs-2026-08-06.md § « Liste candidate au fichier commun »).
  - ref: hypo_severe_recurrente
    groupe: Signaux d'alerte et tolérance
  # AJOUTÉ le 2026-08-07 (P14/S18, T-191) — LE FAIT MANQUANT LE PLUS NET DE LA REVUE DE CONCEPTION DU
  # 2026-08-04 (cas D5, `docs/decision/validation/criteres-communs-2026-08-06.md` § 3.1) : ce nœud
  # PRESCRIT `insuline_basale`/`insuline_rapide` — `prerequis: "traitements_en_cours ne_contient_pas
  # insuline_basale"` de « Initier une insuline basale » (`:845`), `ne_contient_pas insuline_rapide` de
  # l'option bolus équivalente (`:1571`) — les DEUX valeurs que `concerne` de `cetonemie` nomme
  # (`content/decision/criteres-communs/diabete-type-2.yaml`), sans jamais déclarer le fait lui-même :
  # c'est l'ABSENCE SILENCIEUSE que l'invariant I33 (P14/S16, T-189) mesure. DÉFINITION DÉJÀ COMMUNE
  # depuis S15 (démonstration du mécanisme `{ ref }`, reprise à l'identique de `prescription.yaml`) : ce
  # nœud n'a donc RIEN à définir, seulement à RÉFÉRENCER — même geste que `hypo_severe_recurrente`
  # juste au-dessus.
  #
  # SOURCE PRIMAIRE VÉRIFIÉE AVANT D'ÉCRIRE QUOI QUE CE SOIT (étape 1, `plans/P14/S18.md`) : les DEUX
  # cartes `role: securite` de `prescription.yaml` qui lisent `cetonemie` — « iSGLT2 — suspendre » (patient
  # DÉJÀ sous iSGLT2) et « Insuline d'initiation » (patient PAS ENCORE sous insuline, `prerequis:
  # "traitements_en_cours ne_contient_pas insuline_basale AND … ne_contient_pas insuline_rapide"`,
  # `:1099-1100`) — portent, TOUTES DEUX, le même texte de `contre_indications` : « Cétonémie ≥ 3 mmol/L →
  # urgence (insuline + hospitalisation), hors périmètre de cet écran. » (`:1064`, `:1124`). Et surtout,
  # `prescription.yaml` porte DÉJÀ une alerte de nœud dédiée au patient DÉJÀ SOUS INSULINE — exactement la
  # situation de CE nœud — ajoutée le 2026-07-26 pour colmater une régression : `quand: "intention != initier
  # AND cetonemie == true AND traitements_en_cours contient insuline_basale OR … insuline_rapide"` (`:2603`),
  # message : « État catabolique (cétonémie) chez un patient DÉJÀ sous insuline : rare en pratique — la
  # PREMIÈRE chose à rechercher est une RUPTURE THÉRAPEUTIQUE … Si l'insuline est bien prise et correctement
  # administrée, l'ajustement du schéma est urgent et relève de L'INSULINOTHÉRAPIE (HORS PÉRIMÈTRE DE CET
  # ÉCRAN) … Cétonémie ≥ 3 mmol/L → urgence … Suspecter un DT1… » (`:2606-2611`). Ce texte dit lui-même,
  # noir sur blanc, que le relais revient à CE nœud — qui jusqu'ici ne disait rien. La preuve porte donc
  # bien la situation du nœud `insuline` (patient déjà sous insuline OU sur le point d'y être mis), pas
  # seulement l'initiation d'un iSGLT2 : aucun STOP nécessaire (cf. `plans/P14/S18.md` § Si bloqué).
  #
  # CANAL (R8, ordre de préférence) : ALERTE DE NŒUD, voir `alertes` ci-dessous (en tête de liste). Pas une
  # alerte d'option — le message vaut à l'identique quelle que soit la carte affichée à ce patient
  # (initiation chez le naïf, titration d'une basale, ajustement d'un bolus…) : c'est le premier critère de
  # préférence de R8 (« vrai quel que soit le geste retenu, mais pas pour tous les patients »). Pas une
  # `exclusions` : aucun geste PROPOSÉ PAR CE NŒUD ne devient dangereux du fait de la cétonémie — ce qui
  # change, c'est le PÉRIMÈTRE de prise en charge (orienter/hospitaliser au lieu d'ajuster une dose), pas la
  # sécurité d'un geste précis que ce nœud offrirait par ailleurs. Poser une exclusion aurait donc exigé un
  # arbitrage référent explicite qui n'a pas été donné pour ce cas — cf. `plans/P14/S18.md` § Si bloqué,
  # non déclenché ici.
  #
  # COHÉRENCE AVEC L'ALERTE iSGLT2 EXISTANTE (`alertes`, `quand: "traitements_en_cours contient iSGLT2"`,
  # ci-dessous) VÉRIFIÉE : deux faits DISTINCTS, R8 respectée (un fait, un canal — pas « un fait, au moins un
  # canal »). L'alerte iSGLT2 se déclenche sur la PRÉSENCE de la classe dans le traitement, jamais sur une
  # cétonémie MESURÉE (elle prévient d'un risque futur pour qui est sous iSGLT2 + insuline) ; la nouvelle
  # alerte se déclenche sur `cetonemie == true`, jamais sur la seule présence d'une classe. Aucun
  # chevauchement de déclencheur, aucune contradiction de conduite entre les deux.
  #
  # PAS DE `visible_si` : visible dans toutes les situations (`situation_insuline`), comme sur
  # `prescription` — un patient encore naïf ET un patient déjà sous insuline sont TOUS DEUX concernés
  # (cf. les deux cartes sources ci-dessus). PAS DE `presomption_non` : mécaniquement éligible sur CE nœud
  # (le fait n'y gate aucune `conditions`/`exclusions`/`prerequis` d'option `role: securite`, seulement
  # l'alerte ci-dessous — R7), mais la présomption « non » sur un signe d'urgence catabolique reste un choix
  # clinique, pas une conséquence mécanique automatique : non posée, comme `symptomes_glucotoxicite` juste
  # en dessous, qui partage exactement ce profil (même famille de signal, même nœud, même absence de
  # `presomption_non`).
  - ref: cetonemie
    groupe: Signaux d'alerte et tolérance
  - nom: symptomes_glucotoxicite
    # `partage` ajouté le 2026-07-29 (recette référent, item F) : même concept, encodage IDENTIQUE
    # sur tous les nœuds qui le déclarent (type, valeurs, bornes) — condition de l'invariant I19.
    partage: true
    type: bool
    groupe: Signaux d'alerte et tolérance
  - nom: fragilite
    # `partage` ajouté le 2026-07-29 (recette référent, item F/point 5) : encodage désormais IDENTIQUE
    # sur tous les nœuds qui le déclarent (type, valeurs, bornes, presomption_non) — condition I19.
    partage: true
    type: bool
    groupe: Terrain
  - nom: esperance_vie
    # `partage` ajouté le 2026-07-29 (recette référent, item F) : même concept, encodage IDENTIQUE
    # sur tous les nœuds qui le déclarent (type, valeurs, bornes) — condition de l'invariant I19.
    partage: true
    type: enum
    groupe: Terrain
    valeurs: [longue, intermediaire, limitee]
  # DEUX dérivés de terrain, volontairement DISTINCTS (arbitrage référent 2026-07-27). Ce ne sont pas
  # deux encodages d'un même concept (ce que I4 interdit) mais deux concepts que la fusion confondait :
  #   - `risque_hypoglycemique_eleve` = « ce patient est exposé à l'hypoglycémie » → pilote le CHOIX DU TRAITEMENT
  #     (analogue de 2ᵉ génération, désintensification) ;
  #   - `terrain_cible_assouplie` = « ce patient a peu à gagner d'un contrôle strict » → pilote la CIBLE.
  # Principe référent, énoncé le 2026-07-27 : « la cible doit être assouplie en fonction des comorbidités
  # et de l'impact supposé des complications à long terme. Des hypos sévères appellent à une OPTIMISATION
  # DU TRAITEMENT, pas à un assouplissement des cibles. » C'est le même principe qui lui avait déjà fait
  # retirer `risque_hypoglycemie_schema` du nœud A (cible glycémique) : un risque hypoglycémique est une
  # propriété du SCHÉMA, qu'on corrige — jamais une raison de renoncer au contrôle.
  - nom: risque_hypoglycemique_eleve
    type: bool
    # I3/F4 (redteam-clinique-silences.md, 2026-07-26, 4ᵉ lot) : `hypo_severe_recurrente` ajouté ici.
    # CONFIRMÉ par le référent le 2026-07-27 POUR CET USAGE (choix du traitement) : le signal était déjà
    # décisif plus loin dans le nœud (déclencheur indépendant de « Désintensifier / alléger le schéma »),
    # mais jamais lu par « Choisir un analogue basal de 2ᵉ génération » — même concept de sécurité, deux
    # encodages (invariant I4). Fusion conservée ici, mais son effet de bord sur les CIBLES MCG a été
    # écarté par le référent : celles-ci lisent désormais `terrain_cible_assouplie` (ci-dessous).
    # ⚠ NOMMAGE : ce dérivé désigne en réalité un RISQUE HYPOGLYCÉMIQUE, pas une « fragilité » au sens
    # gériatrique — le nom est trompeur depuis qu'il porte les deux signaux d'hypoglycémie. Renommage
    # (`risque_hypoglycemique_eleve`) signalé au référent, non fait : sans gain clinique immédiat.
    derive: "fragilite OR esperance_vie == limitee OR age >= 75 OR risque_hypoglycemie_schema == eleve OR hypo_severe_recurrente == true"
  - nom: terrain_cible_assouplie
    type: bool
    # Terrain qui justifie de RELÂCHER LA CIBLE : âge, fragilité, horizon de vie — c'est-à-dire un
    # bénéfice attendu du contrôle strict amoindri par les comorbidités et l'horizon. EXCLUT délibérément
    # les deux signaux d'hypoglycémie (`risque_hypoglycemie_schema`, `hypo_severe_recurrente`) : ils
    # appellent une correction du traitement, pas une cible plus permissive. C'est le miroir exact des
    # déclencheurs de relaxation du nœud A, dont ce nœud doit rester cohérent (cf. incertitudes).
    derive: "age >= 75 OR fragilite == true OR esperance_vie == limitee"
# FAMILLES DÉCLARÉES (D22/correctif « ordre accidentel », arbitrage référent 2026-07-27). Motif : les
# rangs `priorite` 1-2-3 sont RÉUTILISÉS par les quatre blocs de situation de ce nœud, si bien que deux
# gestes de nature opposée pouvaient s'afficher sous la mention « à égalité » — typiquement « Corriger
# l'hypoglycémie » (rang 1, sécurité) à côté d'« Ajouter un GLP-1 » (rang 1, escalade). Les familles
# séparent les sections : le rang ne regroupe plus qu'à l'intérieur d'une même nature de geste.
# L'ORDRE DE CE TABLEAU est l'ordre d'affichage — sécurité d'abord, comme sur `prescription`.
# `exclusive: false` PARTOUT, délibérément : ce nœud n'a pas de famille dont les options soient de
# véritables alternatives à choisir (« Initier une basale » et « Choisir un analogue de 2ᵉ génération »
# sont un geste et sa modalité, pas deux routes concurrentes). Marquer une famille `exclusive: true`
# ferait afficher « en choisir un », ce qui serait faux ici. À reconfirmer visuellement par le référent.
#
# ─────────────────────────────────────────────────────────────────────────────────────────────────────
# CONTRAINTES DE SAISIE (champ ajouté au schéma le 2026-07-27 — défaut K3 de la seconde recette).
# Relations entre critères qui décrivent un patient IMPOSSIBLE quand elles sont fausses. Signalées au
# praticien dans le formulaire ; jamais corrigées à sa place (l'outil ne peut pas savoir laquelle des deux
# valeurs est fausse). Aucun effet sur la sélection des options — `evaluateNode` ne les lit pas.
# Les deux portent leur garde `situation_insuline` comme n'importe quelle règle lisant un critère à
# `visible_si` (R8/I10) : un champ que le formulaire ne montre pas ne peut pas être en contradiction.
contraintes:
  # LA CONTRAINTE D31 (`situation_insuline == naif OR TBR_severe <= TBR`) A ÉTÉ RETIRÉE le 2026-07-29,
  # en même temps que le critère `TBR_severe` qu'elle gardait (cf. la pierre tombale dans
  # `criteres_entree`). Elle répondait au défaut K3 de la seconde recette navigateur (`TBR = 1` ·
  # `TBR sévère = 95` accepté sans un mot, d'où trois cartes « Recommandée » chez un patient que la
  # saisie décrivait comme passant 95 % du temps en hypoglycémie sévère). Le correctif D31 reste juste
  # dans son principe ; c'est son OBJET qui disparaît — il n'y a plus deux seuils à ordonner.
  # ⚠ Conséquence pour le banc : `reparerFixtureProfils` ne remplace plus de profils sur ce motif. Les
  # 84 profils figés qui avaient été remplacés en 2026-07-27 restent leurs remplaçants — on ne défait
  # pas un golden master, et ces patients-là sont valides pour la contrainte restante.
  # MIGRÉE DEPUIS `alertes` le 2026-07-27. C'était déjà une incohérence de SAISIE, et elle était écrite
  # comme une alerte faute d'un canal pour le dire — le commentaire de l'ancienne alerte le notait
  # lui-même (« c'est une incohérence de SAISIE (situation vs traitements déclarés), pas une observation
  # clinique sur le patient »). Le canal existe désormais : elle se lit dans le formulaire, à côté des deux
  # champs qui se contredisent, plutôt que dans le panneau de résultats à côté de conduites cliniques.
  # CONSÉQUENCE MESURÉE, et c'est ce qui débloque le prérequis d'I15 : les 7 profils sur 1760 que
  # l'invariant I2′ signalait comme « écran vide » étaient TOUS de cette forme (naïf + insuline cochée).
  # Le banc ne les engendre plus, parce qu'ils ne décrivent aucun patient.
  # Précédence : AND lie plus fort que OR, donc ceci se lit bien
  # `situation_insuline != naif OR (ne_contient_pas basale AND ne_contient_pas rapide)`.
  - expression: "situation_insuline != naif OR traitements_en_cours ne_contient_pas insuline_basale AND traitements_en_cours ne_contient_pas insuline_rapide"
    message: >-
      La situation « naïf d'insuline » et une insuline déjà cochée dans les traitements en cours sont
      contradictoires : un patient naïf n'est, par définition, pas déjà sous insuline. Vérifier la
      situation renseignée ou la liste des traitements en cours.
# ─────────────────────────────────────────────────────────────────────────────────────────────────────
familles:
  # FAMILLE AJOUTÉE EN TÊTE le 2026-07-29 (arbitrage référent G : « c'est une option qui se place en
  # tête »). L'ORDRE DE CE TABLEAU EST L'ORDRE D'AFFICHAGE — elle passe donc avant la sécurité, et c'est
  # voulu : elle ne corrige rien, elle interroge l'INSTRUMENT sur lequel tout le reste de l'écran repose.
  # Elle ne s'affiche que chez le patient sans capteur, donc elle ne pousse jamais la sécurité vers le bas
  # pour quelqu'un qui en a un.
  # DEUX FAMILLES PASSÉES À `exclusive: true` le 2026-08-06 (P14/S5, T-168, décision référent) : leurs
  # cartes sont des ALTERNATIVES (on en choisit une), pas des gestes cumulables — ce que `exclusive: false`
  # affirmait à tort jusqu'ici (mention « — gestes cumulables » et badge « recommandée » sur les trois
  # voies d'escalade de « Intensifier le traitement », alors que la carte prémélangée s'y présente
  # elle-même comme une « option dégradée, dernier recours »).
  #  - « Instaurer l'insuline » : après la suppression de « Choisir un analogue basal de 2ᵉ génération »
  #    (cf. son commentaire de suppression, plus bas), ne contient plus que « Envisager un GLP-1 avant ou
  #    avec l'insuline » (rang 1) et « Initier une insuline basale » (rang 2) — deux voies alternatives.
  #  - « Intensifier le traitement » : « Ajouter un GLP-1 / une association fixe d'abord » (rang 1),
  #    « Ajouter un bolus au repas principal » (rang 2), « Insuline prémélangée — option dégradée, dernier
  #    recours » (rang 3).
  # EFFET DE BADGE VÉRIFIÉ (étape 5 de T-168), pas seulement supposé — cf. rapport de session pour le
  # profil exact et la sortie observée : en famille exclusive, `computeBadges` (lib/optionBadges.ts)
  # réserve la mise en avant au groupe d'égalité de TÊTE (rang 1, `groupesExAequo`) ; la carte
  # prémélangée (rang 3) cesse donc d'être badgée « recommandée » dès que le GLP-1 (rang 1) ou le bolus
  # (rang 2) s'applique — c'est le résultat visé. Les trois rangs de « Intensifier le traitement » sont
  # FIXES et tous distincts (aucune règle `priorite` conditionnelle sur ces trois options) : aucun risque
  # de rang à égalité entre elles. Les CINQ autres familles restent `exclusive: false` : leurs cartes sont
  # des faits distincts, réellement cumulables — aucune n'est retouchée par T-168.
  - libelle: "Avant de décider — la mesure"
    exclusive: false
  - libelle: "Sécurité — à corriger d'abord"
    exclusive: false
  - libelle: "Instaurer l'insuline"
    exclusive: true
  - libelle: "Intensifier le traitement"
    exclusive: true
  - libelle: "Ajuster le schéma en place"
    exclusive: false
  - libelle: "Alléger le schéma"
    exclusive: false
  - libelle: "Aucun geste — surveiller"
    exclusive: false
options:
  # ═══════════ TRANSVERSE — L'INSTRUMENT DE MESURE ═══════════
  # Option CRÉÉE le 2026-07-29 (arbitrage référent G). Texte validé par le référent.
  # Elle répond à un constat de la collecte que le nœud ne portait nulle part : la branche « sans
  # capteur » décrit souvent une situation RÉVERSIBLE en consultation. Vérifié en primaire par le
  # red-team B3 sur `sources/SFD 2025.pdf` — Avis 23 : la MCG est remboursée chez le DT2 insulino-traité
  # ET primo-prescriptible par le médecin généraliste dès 1 à 2 injections si l'équilibre n'est pas
  # atteint.
  # POURQUOI UNE OPTION ET NON UN `cadrage` (D24) : un cadrage s'affiche pour TOUT LE MONDE, sans
  # condition. Or cet énoncé ne concerne que le patient SANS capteur — chez un patient équipé, il serait
  # au mieux inutile, au pire déroutant. La condition est donc essentielle, et seule une option en porte.
  # PAS DE CHIFFRE SUR « MOINS FIABLE », délibérément : le red-team a confirmé Munshi (93 % des épisodes
  # manqués avec 4 mesures/jour) mais sur une population de sujets âgés insulino-traités, et le « 46 % »
  # de Zick s'est révélé être un calcul d'agent non publié. L'énoncé qualitatif est solide (GRADE modéré,
  # constant en direction) ; le chiffre ne l'est pas.
  - intitule: "Envisager d'instaurer une mesure continue du glucose"
    role: geste
    famille: "Avant de décider — la mesure"
    conditions:
      - "situation_insuline != naif"
      - "mcg_disponible == false"
      # 3ᵉ item AJOUTÉ après échec de la vignette E-08, et c'est une CORRECTION DE FOND, pas un
      # contournement de test. Deux motifs, qui convergent :
      #  - LA SOURCE le dit — SFD 2025 Avis 23 vise le patient sous 1-2 injections « dont l'équilibre
      #    n'est pas atteint ». Sans ce terme, l'option était plus large que ce qui la fonde ;
      #  - LE MOTEUR le sanctionne — une option qui se déclenche sur la seule situation PRÉEMPTE le repli
      #    `default` (« Poursuivre le schéma en cours et réévaluer »), qui n'est applicable que si aucune
      #    option non-default ne l'est. E-08 (basal-bolus, à l'objectif, rien à signaler) perdait ainsi
      #    sa seule carte. C'est le défaut « 12.11 » que ce nœud a déjà corrigé trois fois sur d'autres
      #    options ; je l'ai reproduit une quatrième.
      # Avec ce terme, les deux options sont mutuellement exclusives par construction : à l'objectif on
      # poursuit, hors objectif on peut vouloir mieux voir avant de décider.
      - "cible_atteinte == false"
    # T-125 (P12/S5) : les deux branches booléennes négatives ci-dessus n'avaient pas de `motifs` — rendu
    # mécanique en « Label : non », lisible comme du code (même défaut relevé en recette du 02/08 sur
    # `prescription.yaml`).
    motifs:
      "situation_insuline != naif": "une insulinothérapie déjà en place"
      "mcg_disponible == false": "pas de mesure continue du glucose en place"
      "cible_atteinte == false": "cible glycémique non atteinte"
    priorite: 1
    avantages:
      - "La mesure continue du glucose (MCG) est remboursée chez le diabétique de type 2 traité par insuline, et le médecin généraliste peut la primo-prescrire (SFD 2025, Avis 23) : l'obstacle à mieux voir est clinique, pas économique. Elle est simplement peu souvent proposée."
      - "Elle lève la principale limite du raisonnement sur glycémies capillaires : chez le sujet âgé sous insuline, 93 % des épisodes d'hypoglycémie ne sont reconnus ni par une autosurveillance à 4 mesures par jour, ni par les symptômes (Munshi ; série de 40 patients, population mixte DT1/DT2)."
      - "En l'absence d'urgence, il est légitime de différer l'ajustement en attendant des données de mesure continue. S'il faut trancher aujourd'hui, le raisonnement sur les glycémies capillaires disponibles reste possible, avec une fiabilité moindre."
    inconvenients:
      - "Certains patients la refusent ; d'autres sont en rupture de capteur entre deux consultations. Le raisonnement sur glycémies capillaires reste valide dans ces cas — il est seulement moins fiable."
      - "Le bénéfice démontré de la mesure continue du glucose dans le diabète de type 2 porte sur des critères de SUBSTITUTION (HbA1c, temps dans la cible) : aucune preuve sur les complications dures ni la mortalité."
    effet_attendu: >-
      Ce que les essais ont mesuré, chez des diabétiques de type 2 sous insuline : HbA1c −0,4 % et temps
      dans la cible +15 points sous basale seule (MOBILE) ; HbA1c −0,6 % et −0,5 % sous basale associée à
      un iSGLT2 ou à un agoniste du récepteur du GLP-1, avec 0 hypoglycémie sévère contre 2 (FreeDM2) ; en
      méta-analyse de 12 essais, HbA1c −0,31 % et temps dans la cible +6,4 points, la réduction des
      hypoglycémies sévères n'y atteignant pas la significativité (RR 0,66 — Jancev). Aucun essai n'a
      mesuré d'effet sur les complications dures ni sur la mortalité.
    delai_benefice: "non établi — durée de suivi non précisée par MOBILE, FreeDM2 ni la méta-analyse Jancev pour cette question"
    niveau_preuve: modere
    references:
      - mobile
      - freedm2
      - jancev
      - sfd-2025-avis18
      - munshi-asg
  # ═══════════ SITUATION 1 — NAÏF D'INSULINE ═══════════
  - intitule: "Envisager un GLP-1 avant ou avec l'insuline"
    role: geste
    action: ajouter
    famille: "Instaurer l'insuline"
    conditions:
      - "situation_insuline == naif"
      # 12.11 (recette) : sans ce second terme, cette option se déclenchait sur la seule situation —
      # préemptant structurellement le repli du nœud pour TOUTE entrée en situation « naïf ». Même
      # déclencheur que l'option sœur « Initier une insuline basale » (ligne suivante) : un naïf à
      # l'objectif et sans glucotoxicité n'a, à ce stade, aucun geste d'insulinothérapie à envisager.
      - "cible_atteinte == false OR symptomes_glucotoxicite == true"
    # T-125 (P12/S5) : motif sur la branche booléenne négative — sans lui, rendu mécanique en
    # « HbA1c à la cible : non », lisible comme du code.
    motifs:
      "cible_atteinte == false": "cible glycémique non atteinte"
    # R6 (docs/decision/GRAMMAIRE-NOEUD.md, arbitrage indication/prérequis) : garde-fou de cohérence
    # (ne pas déjà prendre la classe visée) — jamais montré comme justification.
    prerequis:
      - "traitements_en_cours ne_contient_pas aGLP1"
    priorite: 1
    avantages:
      - "Un agoniste du récepteur du GLP-1 (AR GLP-1), ou un co-agoniste des récepteurs GIP (polypeptide insulinotrope glucose-dépendant) et GLP-1, est préféré à l'insuline comme premier injectable (ADA 2026 rec 9.21 ; SFD 2025 Avis 19) : moins d'hypoglycémie, perte de poids, et un bénéfice cardiovasculaire propre démontré au niveau de la classe, que l'insuline n'a pas (ORIGIN neutre)."
      - "Les associations à ratio fixe (IDegLira, iGlarLixi) simplifient le schéma (1 injection) tout en apportant l'effet de l'AR GLP-1."
    inconvenients:
      - "Effets indésirables digestifs ; l'AR GLP-1 ne remplace pas l'insuline en cas de glucotoxicité sévère, de cétose ou d'hyperglycémie très symptomatique."
      - "Les associations fixes n'ont aucun essai de morbi-mortalité cardiovasculaire dédié : leur bénéfice cardiovasculaire s'infère de leurs composants, il n'est pas démontré pour la combinaison elle-même."
    effet_attendu: >-
      Les essais cités ont comparé une insuline basale associée à un AR GLP-1 au schéma basal-bolus, chez
      des patients DÉJÀ sous insuline : contrôle équivalent (DUAL VII : HbA1c non-inférieure, écart
      −0,02 % ; méta Eng : −0,1 %), avec moins d'hypoglycémie (rate ratio 0,11 ; RR 0,67 ; RR 0,66) et un
      poids inférieur (−3,6 kg ; −5,66 kg ; −4,7 kg). Aucun de ces essais n'a randomisé le CHOIX DU
      PREMIER INJECTABLE chez un patient naïf d'insuline : la préférence pour l'AR GLP-1 à ce stade est une
      recommandation, pas un résultat d'essai.
    delai_benefice: "non établi — durée de suivi non précisée dans le dossier pour cette question"
    niveau_preuve: modere
    references:
      - eng
      - maiorino
      - dual-vii
  - intitule: "Insuline basale"
    role: geste
    action: ajouter
    famille: "Instaurer l'insuline"
    conditions:
      - "situation_insuline == naif"
      - "cible_atteinte == false OR symptomes_glucotoxicite == true"
    # T-125 (P12/S5) : motif sur la branche booléenne négative — sans lui, rendu mécanique en
    # « HbA1c à la cible : non », lisible comme du code.
    motifs:
      "cible_atteinte == false": "cible glycémique non atteinte"
    # R6 : garde-fou de cohérence — les déclarations « situation » et « traitements en cours » n'étaient
    # jamais recoupées (12.10, recette) : un patient déjà sous insuline basale mais dont la situation
    # restait déclarée « naïf » se voyait recommander de l'« initier » et une dose de départ calculée.
    prerequis:
      - "traitements_en_cours ne_contient_pas insuline_basale"
    priorite: 2
    avantages:
      - "L'insuline basale du soir associée aux antidiabétiques en cours (oraux et/ou AR GLP-1) a le meilleur profil de tolérance parmi les schémas testés en essai randomisé (4T) ; réalisable en soins primaires."
      - "Meilleur profil hypoglycémie / poids que les schémas prandial ou prémélangé (4T : hypoglycémie 2,3 contre 12,0 événements/patient/an et poids +1,9 contre +5,7 kg face à un schéma prandial, à 1 an)."
      # AJOUTÉ le 2026-08-06 (P14/S5, T-168, étape 1) : REVERSÉ depuis `avantages` de « Choisir un analogue
      # basal de 2ᵉ génération », supprimée ci-dessous — cf. son commentaire de suppression pour le détail
      # complet du reversement.
      - "Chez le patient à risque d'hypoglycémie, le choix de la molécule compte autant que celui du schéma : un analogue basal de 2ᵉ génération réduit les hypoglycémies symptomatiques et nocturnes par rapport à glargine U100 ou détémir, a fortiori à la NPH (SFD 2025, Avis 18 bis)."
    inconvenients:
      - "Hypoglycémie (ORIGIN : hypoglycémie sévère 1,00 contre 0,31 pour 100 personnes-années) et prise de poids (~+1,6 kg) ; aucun bénéfice sur les événements cardiovasculaires (ORIGIN : MACE HR 1,02)."
      - "Le bénéfice microvasculaire est extrapolé du contrôle glycémique (UKPDS), non démontré par un essai dédié à l'insuline sur critère dur."
      # AJOUTÉ le 2026-08-06 (P14/S5, T-168, étape 1) : REVERSÉ depuis `inconvenients` de « Choisir un
      # analogue basal de 2ᵉ génération », supprimée ci-dessous.
      - "Le bénéfice de l'analogue de 2ᵉ génération sur l'hypoglycémie SÉVÈRE (critère dur) n'est démontré que pour le dégludec contre glargine U100 (DEVOTE : RR 0,60, NNT ~59 sur ~2 ans, en population à très haut risque)."
      - "Aucune supériorité n'est démontrée d'un analogue de 2ᵉ génération sur l'autre (BRIGHT : équivalence ; CONCLUDE : critère primaire négatif), et pour la 1ʳᵉ génération contre NPH la réduction de l'hypoglycémie sévère n'est pas significative (Cochrane 2020 : RR 0,68, IC 0,46-1,01)."
      - "Le surcoût de l'analogue de 2ᵉ génération est à peser, et aucun bénéfice cardiovasculaire n'est propre à la molécule."
    # DERNIÈRES PHRASES AJOUTÉES le 2026-08-06 (P14/S5, T-168, étape 1) : REVERSÉES depuis `effet_attendu`
    # de « Choisir un analogue basal de 2ᵉ génération », supprimée ci-dessous — chiffres inchangés.
    # RÉORGANISÉ le même jour (contre-relecture rédactionnelle) : le champ atteignait 259 mots et
    # répondait à deux questions distinctes. Deux temps désormais — démarrer une basale, puis choisir la
    # molécule. Les chiffres retirés (7,6-7,3-7,2 % à 3 ans détaillés, 81,6 %, RR 0,70 / 0,58, −31 %,
    # RR 0,60, NNT ~59, RR 0,88, p = 0,35) sont TOUS portés ailleurs : `avantages`/`inconvenients` de
    # cette même carte, `delai_benefice` ci-dessous, ou `insuline.argumentaire.md` §1 et §2.
    effet_attendu: >-
      FAUT-IL DÉMARRER UNE BASALE. À 1 an, un départ en basale laisse une HbA1c un peu plus haute que les
      schémas prémélangé et prandial (7,6 contre 7,3 et 7,2 %), pour cinq fois moins d'hypoglycémies
      (2,3 contre 5,7 et 12,0 événements/patient/an) et une prise de poids moindre (+1,9 contre +4,7 et
      +5,7 kg) ; à 3 ans les HbA1c convergent et l'avantage de tolérance persiste (4T). Sur les événements
      cardiovasculaires, l'insuline est neutre : MACE HR 1,02 (0,94-1,11) sur 6,2 ans, au prix d'environ
      trois fois plus d'hypoglycémies sévères et de ~+1,6 kg (ORIGIN).


      QUELLE INSULINE CHOISIR. Le choix de la molécule se joue sur l'hypoglycémie, et sur des critères de
      substitution : chez le patient à risque élevé, le dégludec réduit les épisodes symptomatiques et
      nocturnes face à glargine U100 (SWITCH 2), et glargine U300 réduit les épisodes nocturnes face à U100
      (EDITION). Sur l'hypoglycémie SÉVÈRE, critère dur, une seule démonstration : le dégludec contre
      glargine U100 en population à très haut risque (DEVOTE) ; ailleurs le résultat n'est pas significatif.
      Les essais tête-à-tête ne départagent pas les deux molécules de 2ᵉ génération (BRIGHT, CONCLUDE),
      d'où une recommandation au niveau de la CLASSE plutôt que d'une molécule nommée.
    # DERNIER MEMBRE AJOUTÉ le 2026-08-06 (P14/S5, T-168, étape 1) : REVERSÉ depuis `delai_benefice` de
    # « Choisir un analogue basal de 2ᵉ génération », supprimée ci-dessous.
    delai_benefice: "1 an pour l'avantage d'hypoglycémie et de poids (4T, maintenu à 3 ans) ; aucun bénéfice cardiovasculaire à 6,2 ans (ORIGIN) ; ~2 ans pour la réduction de l'hypoglycémie sévère par l'analogue de 2ᵉ génération chez le patient à risque élevé (DEVOTE)"
    niveau_preuve: modere
    # 2026-07-29 (consignation passe A) : « +10-20 % » → « +10 % » (D2, borne haute sans source — la SFD
    # écrit 10 %, l'ADA 10-15 %, personne n'écrit 20 %) et sources de l'algorithme ajoutées. `treat-to-target`
    # est CONSERVÉ ici, mais pour ce qu'il porte réellement : la faisabilité d'une titration sur la glycémie
    # à jeun, pas le détail du pas ni du rythme (cf. commentaire D3 sur « Titrer la basale »).
    # 5 IDS AJOUTÉS le 2026-08-06 (P14/S5, T-168, étape 1) : REVERSÉS depuis `references` de « Choisir un
    # analogue basal de 2ᵉ génération », supprimée ci-dessous (I8 : cette carte revendique désormais, dans
    # `avantages`/`inconvenients`/`effet_attendu` ci-dessus, des chiffres tirés de ces 5 essais — elle doit
    # dire d'où elle les tient).
    # LISTE RESSERRÉE le 2026-08-06 (contre-relecture rédactionnelle) : la ligne « D'après : » dépassait
    # 250 mots au rendu, avec 12 essais dont 5 n'appuyaient plus aucun chiffre d'`effet_attendu`
    # (`originale`, `treat-to-target`, `ebmfrance-insuline`, `sfd-2025-avis18`, `has-2024-r87` — les trois
    # dernières restent NOMMÉES, source par source, dans `posologie_detail` ci-dessous, qui est leur canal).
    # Ne restent que les 7 essais qui portent les chiffres réellement affichés en état des preuves.
    references:
      - origin
      - quatre-t
      - devote
      - switch-2
      - bright
      - conclude
      - edition-pool
    # `contre_indications` VIDÉE le 2026-08-06 (contre-relecture rédactionnelle) : le panneau annonçait
    # « 1 contre-indication » puis affichait « Pas de contre-indication absolue à l'insuline » — un
    # compteur qui contredisait son propre texte. Le contenu ne porte aucune contre-indication absolue à
    # l'insuline ; la consigne d'arrêt du sulfamide / du glinide, qui n'en est pas une, rejoint
    # `posologie_detail` ci-dessous (elle reste par ailleurs portée par l'alerte de nœud dédiée, gatée sur
    # la présence effective de l'une de ces deux classes).
    contre_indications: []
    calculs:
      - { libelle: "Dose initiale (0,1 U/kg)", expression: "poids * 0.1", unite: "U/j" }
      - { libelle: "Dose initiale (0,2 U/kg)", expression: "poids * 0.2", unite: "U/j" }
    apercu: "initiation : poids × 0,1-0,2 U/kg/j le soir, puis +2 U tous les 3 jours si la glycémie à jeun reste haute"
    # PROTOCOLE D'INITIATION DÉPLACÉ ICI depuis `effet_attendu` : le panneau « État des preuves » doit
    # porter ce que les essais ont mesuré, la posologie a son propre panneau (même correctif que sur
    # `prescription.yaml`, option « Metformine »). Chiffres inchangés, source par source.
    # DERNIER ITEM AJOUTÉ le 2026-08-06 (P14/S5, T-168, étape 1) : le SCHÉMA DE CHOIX DE MOLÉCULE de
    # « Choisir un analogue basal de 2ᵉ génération » (supprimée ci-dessous) REVERSÉ ici plutôt que dans
    # `avantages`/`inconvenients` — c'est une CONDUITE PRATIQUE (quelle molécule, pour qui), pas un état de
    # la preuve ; le panneau posologie est le bon canal (même principe que les deux items ci-dessus).
    posologie_detail:
      - "Dose d'initiation = poids × 0,1 à 0,2 U/kg/j, en une injection le soir. Repli fixe de 10 U le soir si le poids n'est pas disponible — repère pragmatique, non issu d'un essai dédié."
      - "Titration par auto-ajustement : +2 U si la glycémie à jeun reste au-dessus de la cible 3 matins de suite (ebmfrance), ou +10 % par paliers si la dose dépasse 40 U/j (SFD 2025, Avis 18) ; adapter tous les 3 jours (HAS 2024, R.87). Cible de glycémie avant les repas ~0,70-1,30 g/L, à individualiser."
      - "Maintenir la metformine et les traitements à bénéfice cardio-rénal en cours (iSGLT2, AR GLP-1)."
      # ITEM DÉPLACÉ DEPUIS `contre_indications` le 2026-08-06 (contre-relecture rédactionnelle) : une
      # consigne d'arrêt d'un traitement en cours est une modalité de prescription, pas une
      # contre-indication à l'insuline — le panneau sécurité n'était pas son canal.
      - "Un sulfamide ou un glinide en cours s'arrête à l'introduction de l'insuline : leurs effets hypoglycémiants s'additionnent."
      - "Choix de la MOLÉCULE, piloté par le risque hypoglycémique — fragilité, espérance de vie limitée, âge ≥ 75 ans, schéma à risque hypoglycémique élevé, ou antécédent d'hypoglycémie sévère récurrente : préférer un analogue basal de 2ᵉ génération (glargine U300 ou dégludec) à glargine U100, détémir, a fortiori à la NPH (SFD 2025, Avis 18 bis). Les deux molécules de 2ᵉ génération ne se départagent pas entre elles en tête-à-tête (BRIGHT, CONCLUDE) : la préférence se joue au niveau de la CLASSE, pas d'une molécule nommée. Hors ce contexte de risque élevé, glargine U100, détémir ou NPH restent des choix valides, à surcoût moindre."
  # ═══════════ OPTION SUPPRIMÉE le 2026-08-06 (P14/S5, T-168, décision référent) ═══════════
  # « Choisir un analogue basal de 2ᵉ génération » (naïf, `risque_hypoglycemique_eleve == true`, priorite 3)
