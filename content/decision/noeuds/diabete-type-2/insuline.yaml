      # réduction graduée d'insuline, et sans préciser le sens de l'écart ; l'Avis 21 de la SFD chiffre une
      # CIBLE glycémique (1-2 g/L préprandial chez le fragile/dépendant), pas un rythme de réduction. Une
      # recherche web dédiée (guides de déprescription gériatriques) n'a trouvé qu'un guide canadien
      # (Farrell et al., Déprescription des antihyperglycémiants chez les personnes âgées) à preuve TRÈS
      # FAIBLE (2 études avant-après), hors corpus français, non retenu (D23/D12). ⚠ « Inverser » le rythme
      # de titration à la hausse (+2 U/3 j) n'est PAS une source : c'est l'inférence par analogie que D23
      # interdit — l'asymétrie est clinique (le risque d'une descente trop lente n'est pas celui d'une
      # montée trop lente). N'ÉCRIT DONC AUCUN CHIFFRE ICI.
      # MIS À JOUR le 2026-08-02 (T-067, P12/S4) : la phrase distinguait jusqu'ici « glycémies basses, TBR
      # élevé OU profil nocturne en baisse » comme un seul groupe renvoyant tous vers « Corriger
      # l'hypoglycémie… ». Depuis ce lot, la baisse continue nocturne ne déclenche plus cette carte-là
      # (déplacée vers « Réduire la basale ») — la phrase est scindée pour ne plus pointer vers la
      # mauvaise carte. CORRIGÉ le 2026-08-02 (2ᵉ passe) : « Réduire la basale » cite désormais les mêmes
      # sources (HAS 2024 R.87, SFD 2025 Avis 18) que « Corriger l'hypoglycémie… » pour ce même chiffre —
      # ce n'est plus une symétrie sans donnée, cf. commentaire de l'option et changelog.
      - "Aucune source ne chiffre le rythme ni l'ampleur de cette réduction programmée : la dose se règle au jugement clinique, sous surveillance glycémique rapprochée. C'est une question distincte de la correction d'une hypoglycémie ou d'une variabilité déjà documentées, qui disposent, elles, d'un pas et d'un rythme chiffrés."
    effet_attendu: >-
      Aucun essai n'a mesuré ce que change l'allègement d'un schéma d'insuline chez le sujet fragile ou
      sur-traité : ni sur la fréquence des hypoglycémies, ni sur la qualité de vie, ni sur la mortalité.
      La conduite repose sur un accord d'experts — HAS 2024 R.103, qui pose le principe sans aucun
      chiffre ; SFD 2025 Avis 21, qui chiffre une cible de glycémie préprandiale de 1 à 2 g/L chez le
      patient fragile ou dépendant, mais aucun rythme de réduction de dose. Ce qui est mesuré, en
      revanche, c'est le risque que l'allègement vise : sous insuline, l'hypoglycémie sévère atteint 1,00
      pour 100 personnes-années contre 0,31 sans, sans bénéfice cardiovasculaire (ORIGIN : MACE HR 1,02).
    apercu: "réduire au jugement clinique — aucun rythme ni ampleur chiffrés pour un allègement programmé"
    # NIVEAU DE PREUVE ABAISSÉ le 2026-07-27 — décision de principe du référent, en réponse à la question
    # que l'invariant I8 avait fait surgir : « le niveau de preuve doit refléter la CERTITUDE DE LA PREUVE,
    # c'est l'intérêt d'un outil EBM et pas d'un listing de recos officielles. »
    # Cette option était étiquetée `modere`. Son fondement est un accord d'experts (ADA §13, HAS R.103, SFD Avis 5 bis) — il n'existe
    # aucun essai qui l'établisse, et il n'en existera pas. Au sens GRADE, la certitude est donc FAIBLE,
    # quelle que soit la force de la recommandation qui la porte. Les deux notions étaient confondues.
    # Le geste reste EXACTEMENT le même : c'est l'étiquette qui devient honnête, pas la conduite.
    niveau_preuve: faible
    # BIBLIOGRAPHIE CÂBLÉE : cette carte nommait HAS R.103 et SFD Avis 21 dans son texte sans qu'aucun
    # des deux existe en `references_primaires` — le panneau « D'après : » restait donc vide. Les deux
    # entrées sont versées à la bibliographie du nœud, avec ce que le dossier de preuve porte déjà
    # (R.103 : principe sans chiffre, vérifié p. 29 ; Avis 21 : cible glycémique du sujet fragile).
    references:
      - origin
      - has-2024-r103
      - sfd-2025-avis21
  - intitule: "Optimiser la répartition du basal-bolus"
    role: geste
    famille: "Ajuster le schéma en place"
    # 12.11 (recette) : condition unique = situation, préemptant le repli — un patient à l'objectif,
    # sans hypoglycémie ni variabilité, recevait quand même cette option sur le seul fait d'être sous
    # basal-bolus. Mêmes seuils que la situation « basale seule » (TBR/TBR_severe/CV_glycemique/
    # hypo nocturne) : il n'y a rien à optimiser si le contrôle est atteint et le schéma stable.
    #
    # I1/F2 (redteam-clinique-silences.md, 2026-07-26, 4ᵉ lot) : 1er item ÉLARGI à « basale_plus_bolus »
    # (RÉUTILISATION, aucun contenu clinique nouveau). Jusqu'ici, une fois les 2 options d'escalade de
    # cette situation épuisées (GLP-1/tirzépatide ET bolus déjà en place), le patient retombait sur le
    # seul repli « Poursuivre... » malgré une cible non atteinte (60/92 profils du banc, F2). Le calcul
    # « Dose totale quotidienne » (basale + rapide, ci-dessous) reste correct : `dose_rapide_actuelle` est
    # désormais aussi visible en « basale_plus_bolus » (cf. `criteres_entree`, même lot). Portée non
    # affinée (limite du moteur, R3 `docs/decision/GRAMMAIRE-NOEUD.md` — « ce qui ne s'encode pas ») :
    # cette option devient offerte dès `cible_atteinte == false` en « basale_plus_bolus », QUE les 2
    # options d'escalade soient épuisées (prerequis) ou non — le moteur ne sait pas conditionner une
    # option sur l'inapplicabilité d'une autre. Sans conséquence clinique pour le patient (options
    # cumulables, principe déjà établi E-04b/E-06 de ce nœud) ; cf. incertitudes pour le chevauchement de
    # `priorite` que cela introduit avec les options d'escalade réutilisées.
    # `hypo_interprandiale` AJOUTÉ le 2026-07-27 (arbitrage référent), devenu `profil_entre_repas ==
    # baisse_entre_repas` le 2026-07-30 (P8/S7, même critère, nouveau nom) : c'est LE geste que ce signal
    # appelle — une hypoglycémie entre les repas accuse un bolus trop important par rapport au repas, et
    # cette option porte déjà la conduite correspondante dans ses `avantages` (« hausse/baisse entre les
    # repas → augmenter/réduire le bolus »). Le signal ne bloque volontairement PAS la titration de la
    # basale : si l'hypo est post-bolus, la basale n'est pas en cause — l'assimiler à une baisse NOCTURNE
    # aurait fait renoncer à une titration parfois nécessaire.
    conditions:
      - "situation_insuline == basal_bolus OR situation_insuline == basale_plus_bolus"
      # T-033 (P5/S2, 2026-07-28) : même correctif que « Corriger l'hypoglycémie... » ci-dessus —
      # `mcg_disponible == true AND` devant les 4 signaux MCG bruts (I11). `profil_entre_repas` (ex-
      # `hypo_interprandiale`) hors garde MCG : champ gardé par la situation du schéma (item ci-dessus,
      # ANDé — I10 le tient pour ACQUIS), pas par le capteur, inchangé.
      # 2026-07-29 (passe A) : `mcg_disponible == true AND TBR_severe > 1` retiré avec le critère.
      # PIVOT « avant les repas » (arbitrage B, même jour) : les deux états de `glycemie_pre_repas`
      # rejoignent la disjonction. C'est ICI qu'ils agissent, et nulle part ailleurs — cette option est
      # la seule qui ajuste un bolus DÉJÀ EN PLACE, et son texte porte déjà la conduite correspondante
      # (« hausse entre les repas → augmenter le bolus ; baisse entre les repas → réduire le bolus »).
      # `pre_repas_basse` fait donc exactement ce que fait `profil_entre_repas == baisse_entre_repas`, en
      # chiffré.
      - "cible_atteinte == false OR mcg_disponible == true AND TBR > 4 OR mcg_disponible == true AND CV_glycemique > 36 OR mcg_disponible == true AND profil_nocturne == baisse_continue OR profil_entre_repas == baisse_entre_repas OR pre_repas_haute == true OR pre_repas_basse == true"
    # T-125 (P12/S5) : motif sur la branche booléenne négative — sans lui, rendu mécanique en
    # « HbA1c à la cible : non », lisible comme du code.
    motifs:
      "cible_atteinte == false": "cible glycémique non atteinte"
    priorite: 2
    avantages:
      - "Le basal-bolus s'ajuste en médecine générale : équilibrer basale et bolus autour de 50/50, à partir des doses déjà en cours."
      - "Avec capteur, la forme de la courbe désigne l'injection à corriger. Une baisse continue de la glycémie pendant la nuit accuse la basale — la réduire."
      - "Une hausse continue de la glycémie pendant la nuit signe une couverture basale insuffisante — augmenter la basale."
      - "Une courbe nocturne plate dit que la basale n'est pas en cause : l'écart d'HbA1c restant vient du jour, monter la basale n'y changerait rien."
      - "Une hausse de la glycémie entre les repas accuse le bolus du repas précédent — l'augmenter, ou l'avancer par rapport au repas."
      - "Une baisse de la glycémie entre les repas accuse un bolus trop fort pour le repas — le réduire."
      - "Sans capteur, la même lecture se fait sur les glycémies mesurées avant les repas : celle du matin juge la basale, celle prise avant un repas juge le bolus du repas précédent — au-dessus de 1,30 g/L l'augmenter, sous 0,70 g/L le réduire."
    inconvenients:
      - "Le calcul formel des ratios glucides-insuline et du facteur de sensibilité n'est pas inclus (éducation spécialisée)."
      - "Lorsque le déséquilibre PERSISTE malgré l'optimisation, ou dans une situation particulière — hypoglycémies sévères récurrentes ou non perçues, instabilité marquée, grossesse ou projet de grossesse —, orienter vers le spécialiste."
    effet_attendu: >-
      Aucun essai n'a mesuré ce qu'apporte le rééquilibrage d'un basal-bolus déjà en place, ni la lecture
      branche par branche d'un profil de glucose : c'est une lecture clinique standard du profil, pas un
      résultat d'essai. Les seuls résultats mesurés qui la bornent portent sur le PIVOT de titration d'un
      bolus — la glycémie relevée avant le repas suivant (FullSTEP : bande 4,0-7,2 mmol/L, pas de ± 1 U) —
      et sur le fait que titrer plutôt sur la glycémie post-prandiale ne change rien (STEP-Wise : écart de
      traitement −0,06 % [−0,29 ; +0,17]). Les seuils affichés avant les repas (0,70-1,30 g/L) sont, eux,
      une cible officielle sans essai derrière (HAS 2025 ; SFD 2025, Avis 18).
    niveau_preuve: faible
    references:
      - fullstep
      - step-wise
      - has-2025-parcours
      - sfd-2025-avis18
    calculs:
      - { libelle: "Dose totale quotidienne", expression: "dose_basale_actuelle + dose_rapide_actuelle", unite: "U/j" }
  - intitule: "Poursuivre le schéma d'insuline en cours et réévaluer"
    role: repli
    action: maintenir
    famille: "Aucun geste — surveiller"
    conditions:
      - "default"
    # PRÉREQUIS POSÉ le 2026-07-27 (R9 / invariant I15 : un repli qui propose de CONTINUER doit dire à
    # quelle condition). Tranché par le référent dès le 2026-07-26, il avait dû être RETIRÉ le jour même :
    # il faisait échouer I2′ (« jamais aucune option quand tout est renseigné ») sur 7 profils du banc — et
    # retirer un repli, c'est retirer le filet. Diagnostic alors posé et vérifié : ces 7 profils étaient
    # TOUS des saisies incohérentes (naïf + insuline déjà cochée), c'est-à-dire des artefacts du générateur,
    # qui tire chaque critère indépendamment — jamais des patients. Ils ne sont plus engendrés depuis que
    # cette combinaison est déclarée en `contraintes` (en tête de fichier), et le prérequis se pose donc
    # sans rien casser : « poursuivre le schéma en cours » suppose qu'un schéma existe.
    prerequis:
      - "situation_insuline != naif"
    # MOTIF AJOUTÉ P10/S4 (T-081, 2026-07-31) — ce `prerequis` N'EST PAS un garde-fou R6 « traitements en
    # cours » (ceux-là sont des tests de périmètre sur une `liste`, filtrés par `nettoyerNonRetenues` et
    # donc jamais montrés) : `situation_insuline` est un `enum`, `estTestDePerimetre` ne le reconnaît pas,
    # et sa négation SE VOIT réellement chez un patient naïf, dans « Pourquoi pas d'autres options » —
    # `il faudrait Situation d'insulinothérapie ≠ Naïf d'insuline`, une double négation qui se lit comme de
    # la logique. Motif = la reformulation positive que le commentaire ci-dessus donne déjà lui-même
    # (« poursuivre le schéma en cours suppose qu'un schéma existe »).
    motifs:
      "situation_insuline != naif": "un schéma d'insuline déjà en place"
    avantages:
      - "Poursuivre le schéma en cours et le réévaluer à 3-6 mois : ne rien changer à un schéma qui tient son objectif sans hypoglycémie évite l'exposition supplémentaire qu'apporterait toute majoration."
    inconvenients:
      - "Réévaluer à chaque consultation la tolérance, les hypoglycémies et l'adhésion : l'apparition d'une hypoglycémie, d'une variabilité excessive ou d'un objectif manqué rouvre l'ajustement."
    effet_attendu: >-
      Pas de modification. Surveillance du contrôle, de la tolérance et de l'apparition d'un signal de
      sécurité.
    niveau_preuve: faible
  # ═══════════ SECOND REPLI — SITUATION « NAÏF » (créé le 2026-07-30) ═══════════
  # ⚠ TEXTE PROVISOIRE — À VALIDER PAR LE RÉFÉRENT (brouillon rédigé par Claude Code, jamais relu
  # cliniquement). La MÉCANIQUE est, elle, établie : cf. ci-dessous.
  #
  # LE TROU BOUCHÉ, et pourquoi il est LE MÊME que celui du 2026-07-25, dans une autre situation.
  # Le repli ci-dessus (« Poursuivre le schéma d'insuline en cours… ») a été créé le 2026-07-25 pour
  # boucher la « sortie muette » de la situation `basale_seule` à l'objectif et sans clause de sécurité
  # déclenchée. Son `prerequis` `situation_insuline != naif` (posé le 2026-07-27, R9/I15 — « poursuivre
  # le schéma en cours » suppose qu'un schéma existe) l'a du même coup rendu inatteignable au patient
  # NAÏF, et personne n'a écrit la contrepartie. Résultat, mesuré sur le banc le 2026-07-30 (profil
  # #1213 sur 1760, `situation_insuline: naif`, HbA1c 6,86 % pour une cible de 9,5 %,
  # `symptomes_glucotoxicite: false`, `risque_hypoglycemique_eleve: false`) : les trois options de la
  # situation « naïf » sont toutes NON RETENUES (les deux premières exigent
  # `cible_atteinte == false OR symptomes_glucotoxicite == true`, la troisième
  # `risque_hypoglycemique_eleve == true`), le repli ci-dessus l'est aussi par son prérequis — et l'écran
  # n'affiche NI recommandation NI « il manque telle information ». Silence total pour le praticien.
  # Attrapé par I2′ (`banc/invariants.test.ts`, sous information COMPLÈTE) et par I23
  # (`banc/securite-atteignable.test.ts`, sous chacun des 11 critères masqués un à un — dont `DFG`).
  #
  # POURQUOI UNE SECONDE OPTION `["default"]` ET NON UN ÉLARGISSEMENT DE LA PREMIÈRE. Les deux énoncés
  # ne sont pas le même : « poursuivre le schéma en cours » est une conduite qui présuppose un schéma
  # d'insuline ; « pas d'indication à en initier » est une conduite qui présuppose l'inverse. Fusionner
  # les deux redonnerait exactement l'option sans présupposé que R9/I15 a fait corriger le 2026-07-27
  # (« Le nœud propose de poursuivre un traitement qui n'existe pas »). En `multi-options`, le moteur
  # évalue TOUS les replis (`engine/evaluateNode.ts`, boucle `for (const option of defaults)`) : deux
  # replis sont donc licites, à condition qu'ils soient MUTUELLEMENT EXCLUSIFS — ce que garantit la
  # partition `situation_insuline == naif` / `!= naif` sur leurs `prerequis` respectifs.
  #
  # POURQUOI CE `prerequis` NE PEUT PAS REPRODUIRE LE TROU (vérifié sur le moteur, pas seulement
  # raisonné). L'objection est légitime : un repli gardé par un critère lui-même masquable pourrait
  # redevenir muet. Elle tombe ici parce que la partition est EXHAUSTIVE et que `classerOption` traite
  # l'indétermination en `enAttente`, jamais en silence :
  #   - `situation_insuline` renseigné ⇒ exactement UN des deux prérequis est vrai, donc exactement un
  #     repli est applicable dès qu'aucune option ordinaire ne l'est ;
  #   - `situation_insuline` masqué ⇒ `enAttente` est non vide de toute façon, par l'un ou l'autre de deux
  #     mécanismes. Soit une option ORDINAIRE y est déjà partie (indéterminée sur ce même critère), et la
  #     branche des replis n'est alors même pas évaluée — `if (!anyNonDefaultApplicable && enAttente.size
  #     === 0)` : c'est le cas mesuré sur le profil #1213, et il est plus fort que la garantie cherchée.
  #     Soit aucune ne l'est, et ce sont les DEUX replis qui y partent, leur prérequis devenant
  #     indéterminé. Dans les deux cas l'écran affiche « à renseigner : situation d'insulinothérapie »
  #     plutôt que rien — I23 est satisfait par `enAttente`, pas par `applicable`, ce que D20 veut.
  #     Vignettes de non-régression : `engine/evaluateNode.insuline.test.ts`, bloc « la partition des
  #     deux replis ».
  # Une garde INCONDITIONNELLE (aucun `prerequis`, comme le repli terminal de `statine`) était l'autre
  # forme possible, mais elle ferait s'afficher les DEUX replis côte à côte chez tout patient non naïf
  # sans geste — « poursuivre le schéma en cours » ET « pas d'indication à initier » sur le même écran,
  # c'est-à-dire une contradiction. La partition est donc la seule forme correcte des deux.
  - intitule: "Pas d'indication à initier une insuline aujourd'hui"
    role: repli
    action: maintenir
    famille: "Aucun geste — surveiller"
    conditions:
      - "default"
    # Contrepartie EXACTE du `prerequis` du repli ci-dessus (partition de `situation_insuline`) : c'est
    # ce qui rend les deux replis mutuellement exclusifs, et ce qui referme le trou sans en ouvrir un
    # autre. Ne pas le retirer sans relire le raisonnement ci-dessus.
    prerequis:
      - "situation_insuline == naif"
    # ⚠ RÉDACTION PROVISOIRE — À VALIDER PAR LE RÉFÉRENT (cf. bandeau ci-dessus). Ce qui est affirmé ci-
    # dessous est borné à ce que le moteur SAIT au moment où ce repli s'affiche (D20) : un repli n'est
    # atteint qu'avec `enAttente` vide (`engine/evaluateNode.ts`, révision du 2026-07-27), donc tous les
    # critères décisifs sont renseignés, et aucune des trois options de la situation « naïf » ne s'est
    # déclenchée — c'est-à-dire objectif d'HbA1c atteint ET pas de symptôme de glucotoxicité. Rien de
    # plus n'est avancé : en particulier, ce texte ne se prononce PAS sur le traitement non insulinique
    # (ni sur son éventuel excès), qui n'est pas du ressort de ce nœud.
    avantages:
      - "L'objectif d'HbA1c est atteint sans insuline et il n'y a pas de symptôme de glucotoxicité : rien n'appelle à instaurer une insulinothérapie aujourd'hui. Chez un patient jamais traité par insuline, l'épargner tant qu'elle n'est pas nécessaire évite d'emblée l'hypoglycémie et la prise de poids qui l'accompagnent (ORIGIN : hypoglycémie sévère 1,00 vs 0,31 pour 100 personnes-années, poids ~+1,6 kg), pour un bénéfice cardiovasculaire nul (ORIGIN : MACE HR 1,02)."
    inconvenients:
      - "Réévaluer au prochain contrôle : une HbA1c qui repasse au-dessus de l'objectif, l'apparition de symptômes de glucotoxicité (amaigrissement, syndrome polyuro-polydipsique) ou une décompensation intercurrente rouvrent la question de l'insuline."
      - "Le choix et l'ajustement des antidiabétiques non insuliniques — y compris la question d'un allègement si l'HbA1c est nettement SOUS l'objectif individualisé — relèvent de la décision de prescription, comme les mesures hygiéno-diététiques."
    effet_attendu: >-
      Pas d'instauration d'insuline. Surveillance de l'HbA1c, de la tolérance du traitement en cours et de
      l'apparition de signes de glucotoxicité.
    niveau_preuve: faible
    references:
      - origin
alertes:
  # AJOUTÉ le 2026-08-07 (P14/S18, T-191) — cf. le commentaire complet sur le critère `cetonemie`
  # (`criteres_entree` ci-dessus) pour le sourcing, le choix du canal et la vérification de cohérence avec
  # l'alerte iSGLT2 plus bas dans cette même liste. PLACÉE EN TÊTE : c'est le signal le plus grave que ce
  # nœud puisse recevoir (urgence métabolique potentielle), avant les alertes de sécurité qui suivent.
  # PAS DE GARDE DE SITUATION (`situation_insuline`), délibérément — même construction que les alertes
  # `hypo_severe_recurrente`/`fragilite` juste en dessous : le fait vaut aussi bien chez le naïf que chez
  # le patient déjà sous insuline (les deux cas sourcés dans le commentaire du critère). TEXTE ENTIÈREMENT
  # REPRIS de `prescription.yaml` (`contre_indications` des cartes « iSGLT2 — suspendre » / « Insuline
  # d'initiation », `:1064`/`:1124` ; alerte de nœud dédiée au patient déjà sous insuline, `:2603-2611` ;
  # alerte de nœud proxy-cétonémie, `:2582-2587`) — AUCUN chiffre ni seuil nouveau, aucune source nouvelle.
  # SANS TOURNURE PROHIBITIVE (I7, `docs/decision/GRAMMAIRE-NOEUD.md`) : elle CONSTATE et ORIENTE («
  # rechercher », « pousse à démarrer », « reste une urgence »), elle n'interdit aucun geste de ce nœud —
  # aucune `exclusions`/`prerequis` n'est donc requise en contrepartie (cf. le commentaire du critère pour
  # la justification complète de ce choix de canal).
  - quand: "cetonemie == true"
    niveau: attention
    message: >-
      Cétonémie confirmée : décompensation catabolique. Chez un patient déjà sous insuline, cette
      situation est rare en pratique — la première chose à rechercher est une rupture thérapeutique
      (arrêt, oubli, défaut d'administration, panne de pompe) avant d'envisager un ajustement de schéma.
      Chez un patient encore naïf, c'est un signal qui pousse à démarrer l'insulinothérapie sans délai.
      Dans les deux cas, une cétonémie ≥ 3 mmol/L reste une urgence (insuline + hospitalisation), hors
      périmètre de cet écran de titration. Devant une cétose ou un amaigrissement rapide chez un sujet non
      obèse, évoquer aussi un diabète de type 1 méconnu.
  # E-02 (2026-07-26) A MIGRÉ VERS `contraintes` le 2026-07-27 — voir le bloc `contraintes` en tête de
  # fichier. Référent : « si il est naïf, il ne peut pas avoir une basale dans son traitement — c'est une
  # erreur du praticien. » Elle disait déjà d'elle-même être « une incohérence de SAISIE (situation vs
  # traitements déclarés), pas une observation clinique sur le patient » : elle vivait ici faute d'un canal
  # pour le dire. Le canal existe, et le message se lit désormais dans le FORMULAIRE, à côté des deux champs
  # qui se contredisent — pas dans le panneau de résultats, entre des conduites cliniques. Portée ÉLARGIE au
  # passage : elle ne couvrait que `insuline_basale`, la contrainte couvre aussi `insuline_rapide`.
  # 2026-07-29 (passe A) : le 3ᵉ terme `situation_insuline != naif AND TBR_severe > 1` est retiré avec le
  # critère. Le « temps en hypoglycémie sévère » disparaît donc des DÉCLENCHEURS de cette alerte ; il reste
  # mentionné dans son TEXTE, qui décrit la situation clinique au praticien sans prétendre la mesurer.
  # Les deux autres déclencheurs (antécédent d'hypo sévère récurrente, CV élevé) portent seuls l'orientation.
  - quand: "hypo_severe_recurrente == true OR situation_insuline != naif AND CV_glycemique > 36"
    niveau: attention
    message: >-
      Orienter vers le spécialiste (± pompe à insuline / boucle fermée = centres initiateurs) si le déséquilibre
      PERSISTE malgré l'optimisation, ou en situation particulière : hypoglycémies sévères récurrentes /
      non-perception, instabilité marquée (coefficient de variation élevé), grossesse ou projet de
      grossesse. En attendant : relâcher l'objectif, envisager un analogue basal de 2ᵉ génération, éduquer,
      envisager une mesure continue du glucose.
  # ALERTE CRÉÉE le 2026-07-29 (arbitrage référent) : elle reprend le rôle que `hypo_severe_recurrente`
  # tenait à tort ailleurs — déclencheur d'un geste correctif, et exclusion de deux options d'escalade.
  # Canal R8 « qualifie sans interdire » : ce signal doit rendre le praticien prudent, jamais retirer une
  # option. Pas de garde de situation : `hypo_severe_recurrente` est visible dans toutes les situations, y
  # compris chez le naïf, où l'avertissement vaut aussi (il oriente le choix de la molécule à l'initiation
  # via `risque_hypoglycemique_eleve`). C'est ce qui préserve la PORTÉE universelle voulue par l'arbitrage
  # du 2026-07-27, tout en changeant le canal.
  - quand: "hypo_severe_recurrente == true"
    niveau: attention
    message: >-
      Antécédent d'hypoglycémie sévère récurrente. Il a pu survenir sous un schéma antérieur : il ne
      préjuge pas du risque sous le schéma actuel et ne doit pas faire renoncer à titrer si la glycémie
      le justifie. Il invite en revanche à titrer prudemment, à préférer un analogue basal de 2ᵉ
      génération, et à réévaluer la perception des hypoglycémies.
  # AJOUTÉ le 2026-08-07 (P14/S17, arbitrage 2 de S14, docs/decision/validation/
  # criteres-communs-2026-08-06.md §6 : décision référent en conversation, « passons en sécurité
  # partout »). Jusqu'ici `fragilite` n'avait, sur ce nœud, AUCUN canal `niveau: attention` propre : elle
  # n'était lue que par `risque_hypoglycemique_eleve` (qui ne gate plus, aujourd'hui, QUE la `conditions`
  # de « Désintensifier / alléger le schéma », et seulement en situation `basal_bolus` — les commentaires
  # plus haut qui parlent encore d'un effet sur le choix de molécule à l'INITIATION décrivent l'état
  # d'AVANT la suppression de « Choisir un analogue basal de 2ᵉ génération » le 2026-08-06, périmés sur ce
  # point précis) et par `terrain_cible_assouplie` (alerte `niveau: info` sur les cibles MCG, ci-dessous,
  # et seulement si `mcg_disponible == true`). Un patient fragile en situation `naif`, `basale_seule` ou
  # `basale_plus_bolus`, sans mesure continue du glucose, ne recevait donc AUCUN signal. Cette alerte
  # comble le trou, sur le modèle exact de l'alerte `hypo_severe_recurrente` juste au-dessus (R8 canal
  # « alerte de nœud » : vrai quel que soit le geste retenu, pas pour tous les patients — pas de garde de
  # situation, le signal vaut dans toutes les situations, y compris chez le naïf).
  # CONDITIONNÉE SUR `fragilite == true` SEUL, PAS sur `risque_hypoglycemique_eleve` : ce dérivé agrège
  # aussi l'âge, l'espérance de vie limitée et le risque du schéma — l'utiliser ici aurait dilué le signal
  # fragilité dans ces trois autres faits et fait doublonner cette alerte avec `hypo_severe_recurrente`
  # juste au-dessus (l'un des OR du même dérivé). `fragilite == true` seul isole exactement le fait que
  # l'arbitrage demande d'élever — un fait, un canal (R8), même choix que les 4 alertes `fragilite`
  # existantes de `prescription.yaml`, elles aussi toutes conditionnées sur `fragilite == true` seul.
  # RIEN D'INVENTÉ : la préférence pour un analogue basal de 2ᵉ génération chez le patient fragile est
  # déjà écrite, nommément, dans le dernier item de `posologie_detail` de « Initier une insuline basale »
  # ci-dessus (« Choix de la MOLÉCULE, piloté par le risque hypoglycémique — fragilité, … » — SFD 2025,
  # Avis 18 bis) ; la prudence de titration et la réévaluation de la perception des hypoglycémies sont
  # reprises de l'alerte `hypo_severe_recurrente` ci-dessus ; l'allègement en basal-bolus et les cibles MCG
  # assouplies sont les deux mécanismes déjà existants cités plus haut dans ce commentaire.
  - quand: "fragilite == true"
    niveau: attention
    message: >-
      Sujet fragile sous insulinothérapie : risque hypoglycémique majoré, quel que soit le schéma en
      cours et la situation clinique. Préférer un analogue basal de 2ᵉ génération (glargine U300 ou
      dégludec) à glargine U100, détémir ou NPH, titrer prudemment, et réévaluer la perception des
      hypoglycémies — même conduite que devant un antécédent d'hypoglycémie sévère récurrente
      (ci-dessus). En basal-bolus, ce terrain ouvre aussi l'allègement du schéma (« Désintensifier /
      alléger le schéma ») ; si une mesure continue du glucose est en place, il applique déjà des cibles
      de temps dans la cible assouplies (alerte ci-dessous).
  - quand: "traitements_en_cours contient sulfamide OR traitements_en_cours contient glinide"
    niveau: attention
    message: "À l'introduction ou l'intensification de l'insuline : arrêter le sulfamide / le glinide (risque d'hypoglycémie cumulée)."
  # ENRICHIE T-127 (P12/S6, 2026-08-03) — même fait de sécurité que l'alerte ajoutée sur l'option
  # « Introduire un iSGLT2 » de `prescription.yaml` (arbitrage référent du 2026-08-02, cf. son
  # `meta.changelog`), CE NŒUD LISANT LUI AUSSI un iSGLT2 en cours (vérifié, pas supposé — ce `quand`
  # existait déjà). Un seul canal par fait de sécurité (D21) : le `quand` N'EST PAS DUPLIQUÉ en
  # `denutrition == true` (la brief S6 le trigger ainsi sur `prescription`) — cette alerte-ci a une portée
  # DÉJÀ PLUS LARGE (tout patient sous iSGLT2 + insuline, dénutri ou non) qui la couvre déjà entièrement ;
  # la RÉTRÉCIR au seul cas dénutri aurait perdu la couverture jeûne/chirurgie/maladie aiguë chez le
  # patient non dénutri. Seul le MESSAGE est enrichi des deux éléments que le rapport OpenEvidence du
  # 2026-08-02 ajoute et qu'aucune version antérieure ne portait (vérifié : absents avant cette entrée) :
  # le fait que la glycémie peut rester proche de la normale (ce qui retarde le diagnostic — à mettre en
  # premier, c'est le point le plus traître) et le délai chirurgical CHIFFRÉ (≥ 3 j, 4 j pour
  # l'ertugliflozine, ACC 2020), qui n'était nulle part dans ce nœud avant cet ajout.
  - quand: "traitements_en_cours contient iSGLT2"
    niveau: attention
    message: >-
      iSGLT2 + insuline : maintenir l'iSGLT2 pour le bénéfice cardio-rénal, mais informer du risque
      d'acidocétose euglycémique — une complication traître car la GLYCÉMIE PEUT RESTER PROCHE DE LA
      NORMALE, ce qui retarde le diagnostic si l'on ne s'appuie que sur elle. Suspendre en cas de jeûne,
      d'apports glucidiques manifestement insuffisants, de chirurgie ou de maladie aiguë intercurrente —
      et par principe au moins 3 jours avant une chirurgie programmée (4 jours pour l'ertugliflozine,
      ACC 2020).
  - quand: "DFG < 45"
    niveau: attention
    message: >-
      Insuffisance rénale : besoins en insuline réduits et risque d'hypoglycémie majoré (adapter les doses,
      renforcer la surveillance) ; sulfamide (s'il est encore utilisé) : gliclazide/glimépiride à dose réduite
      et surveillance rapprochée si DFG 30-44, contre-indiqué si DFG < 30 (convention KDIGO/SFD ; la place
      résiduelle des sulfamides et des gliptines relève de la décision de prescription) ; adapter ou arrêter
      la metformine selon le DFG.
  # Ces deux alertes lisent `terrain_cible_assouplie` (et NON `risque_hypoglycemique_eleve`) depuis le 2026-07-27 :
  # un risque hypoglycémique appelle une correction du traitement, pas une cible plus permissive — cf. le
  # commentaire des deux dérivés dans `criteres_entree`. Conséquence concrète : un patient de 55 ans, non
  # fragile, dont le seul signal est un antécédent d'hypoglycémie sévère, garde les cibles STANDARD et
  # reçoit par ailleurs le geste correctif (« Corriger l'hypoglycémie… », généralisé le même jour).
  - quand: "mcg_disponible == true AND terrain_cible_assouplie == false"
    niveau: info
    message: >-
      Cibles de mesure continue du glucose standard (consensus international Battelino 2019 — repères
      d'interprétation, PAS un critère dur validé sur les complications) : temps dans la cible (TIR) > 70 % ;
      temps sous la cible (TBR) < 4 % sous 0,70 g/L (70 mg/dL) et < 1 % sous 0,54 g/L (54 mg/dL) ; temps
      au-dessus de la cible (TAR) < 25 % au-dessus de 1,80 g/L (180 mg/dL) et < 5 % au-dessus de 2,50 g/L
      (250 mg/dL) ; coefficient de variation ≤ 36 %.
  - quand: "mcg_disponible == true AND terrain_cible_assouplie == true"
    niveau: info
    message: >-
      Sujet âgé / fragile / à espérance de vie limitée : cibles de mesure continue du glucose ASSOUPLIES —
      temps dans la cible (TIR) > 50 %, temps sous la cible (TBR) < 1 %, temps au-dessus de la cible (TAR)
      plus permissif. Cohérent avec l'objectif d'HbA1c retenu pour ce patient, lui aussi relâché.
  - quand: "mcg_disponible == false AND situation_insuline != naif"
    # Garde-fou T4/P1 (chantier visible_si) : `mcg_disponible` est masqué (donc remis à `false`, sa valeur
    # par défaut) pour la situation « naïf » (cf. `criteres_entree` ci-dessus). Sans ce second terme, le
    # masquage AFFIRMERAIT — via cette alerte non filtrée — un message de titration prématuré pour un
    # patient qui n'a pas encore d'insuline à titrer.
    niveau: info
    message: >-
      Sans mesure continue du glucose : titrer la basale sur la glycémie à jeun (cible ~0,70-1,30 g/L) ;
      utiliser des profils capillaires 6-7 points (avant/après les 3 repas + coucher) pour guider
      l'intensification prandiale.
  # ALERTE CRÉÉE le 2026-08-06 (P14/S4, T-167, décision référent) — canal R8 « qualifie sans interdire » :
  # le ratio dose/poids devient un repère PORTÉ PAR UNE ALERTE plutôt qu'un déclencheur/une exclusion
  # d'option (cf. le renommage `over_basalisation` → `ratio_basale_poids_eleve` en tête de
  # `criteres_entree`, et le commentaire de « Ne pas sur-titrer la basale » ci-dessus). Rédaction
  # contrainte par I7 (`engine/banc/invariants-contenu.test.ts`) : elle CONSTATE et ORIENTE, elle
  # n'interdit rien — une tournure prohibitive (« ne pas majorer », « ne pas titrer au-delà ») aurait
  # exigé un garde-fou qui retire un geste, exactement la boucle du 2026-07-26 que la décision du
  # 2026-08-06 referme. Pour la même raison, le message ne CITE PAS littéralement l'intitulé « Ne pas
  # sur-titrer la basale » (qui contient lui-même la tournure « ne pas ») : il le désigne par un repère
  # sans ambiguïté (sa famille, unique dans cette situation) plutôt que par une citation qui ferait
  # échouer I7 sur un simple artefact de formulation, pas sur un fond prohibitif.
  - quand: "ratio_basale_poids_eleve == true"
    niveau: attention
    message: >-
      Dose de basale rapportée au poids au-delà de 0,5 U/kg/j. Ce repère est discuté, pas consensuel :
      porté par l'ADA de 2018 à 2023, il en a été retiré en 2025 et reste absent en 2026 ; l'AACE le
      maintient depuis 2018. Dans les essais qui fondent la titration, les doses d'entretien réellement
      atteintes à la cible s'étalent de 0,34 à 0,78 U/kg/j — un seuil à 0,5 coupe au milieu de la plage
      normale. Sans mesure continue du glucose, ce seul repère ne suffit pas à juger si la nuit est
      réellement sur-couverte : instaurer une mesure continue du glucose permet de le vérifier sur la
      courbe nocturne. En attendant, si la glycémie à jeun est déjà à la cible alors que l'HbA1c ne l'est
      pas, l'écart restant vient de la journée : le geste utile est alors d'ajouter un AR GLP-1, de passer
      à une association fixe, ou d'ajouter un bolus au repas le plus hyperglycémiant.
  # ALERTE CRÉÉE le 2026-08-06 (P14/S5, T-168, décision référent, étape 3) — REVERSE la question que
  # portait « Choisir un analogue basal de 2ᵉ génération » (supprimée ci-dessus, cf. son commentaire de
  # suppression) vers le patient qu'elle ne voyait JAMAIS : cette option exigeait `situation_insuline ==
  # naif`, donc un patient déjà sous basale ne recevait ni carte ni question sur la molécule en place — et
  # personne ne la lui pose aujourd'hui. Canal R8 « qualifie sans interdire » (même registre que l'alerte
  # `ratio_basale_poids_eleve` juste au-dessus) : elle CONSTATE une question à poser, elle ne retire ni
  # n'impose aucun geste. Pas de garde de situation : `traitements_en_cours` (donc `insuline_basale`) n'est
  # de toute façon montré au formulaire que pour `situation_insuline != naif` (`valeurs_visible_si`,
  # `criteres_entree` en tête de fichier), donc cette alerte ne peut jamais se déclencher chez un naïf.
  # Chiffres REPRIS tels quels de l'ancien `avantages` de l'option supprimée, aucun chiffre nouveau :
  # SWITCH 2 (RR 0,58 nocturne) et EDITION U300 (−31 % nocturne), désormais dans `references` de
  # « Initier une insuline basale » ci-dessus.
  - quand: "traitements_en_cours contient insuline_basale"
    niveau: info
    message: >-
      La basale en place est-elle un analogue de 2ᵉ génération (glargine U300 ou dégludec) ? À contrôle
      glycémique égal, cela réduit l'hypoglycémie nocturne par rapport à glargine U100, détémir ou NPH
      (SWITCH 2 : RR 0,58 ; EDITION U300 : −31 % d'épisodes nocturnes).
# Position de lecture du nœud (D24) — DÉPLACÉE le 2026-07-26 depuis `alertes` où elle était écrite en
# `quand: "default"`, ce que D21 (interdit n°2) proscrit. Texte inchangé : le défaut était le canal, pas
# l'énoncé. Ce fait ne dépend d'aucun critère du patient — il dit ce que vaut la preuve pour TOUTE
# l'insuline, donc comment lire toutes les options ci-dessus.
cadrage:
  - >-
    L'insuline améliore le contrôle glycémique et prévient les complications microvasculaires, mais N'A PAS
    de bénéfice cardiovasculaire démontré (ORIGIN neutre) : ne pas la survendre ; surveiller le poids et les
    hypoglycémies, et maintenir les traitements à bénéfice cardio-rénal (iSGLT2, GLP-1).
  # POINT AJOUTÉ P10/S4 (T-081, 2026-07-31) — EXTENSION du `cadrage` existant (le point ci-dessus n'est pas
  # touché), pas une réécriture. Déduit de ce qui manque à `criteres_entree` ci-dessus ET changerait une
  # conduite en consultation (S3.md, Décision clé). ⚠ LISTE PROVISOIRE — À VALIDER PAR LE RÉFÉRENT : dire
  # ce qu'un outil ignore est un engagement clinique, cf. bilan de session.
  - >-
    Aucune conduite de cet écran n'est déclenchée par le temps dans la cible (TIR) : il n'en demande pas la
    valeur — seuls le temps sous la cible et le coefficient de variation sont saisis — et les cibles de
    temps dans la cible qu'il affiche servent uniquement de repères pour lire un profil. Ne sont pas non
    plus pris en compte : l'heure précise d'une hypoglycémie au-delà du repère « nocturne » ou « entre les
    repas », le fait de vivre seul, une profession exposée au risque hypoglycémique, ni le fait que
    l'absence de capteur tienne à un refus du patient plutôt qu'à une indisponibilité — autant d'éléments
    qui peuvent changer la conduite en consultation.
  # POINT DÉPLACÉ DEPUIS `incertitudes` : il dit ce que ce nœud lit et ce qu'il ne recalcule pas, donc une
  # position de lecture (D24) — pas ce que la preuve établit ou n'établit pas.
  - >-
    L'objectif d'HbA1c utilisé ici est celui retenu pour ce patient ; cet écran ne le recalcule pas. Les
    éléments qui justifient de le relâcher — âge, fragilité, espérance de vie — sont aussi ceux qui pilotent
    ici l'allègement du schéma et les cibles de mesure continue du glucose.
# ARGUMENTAIRE RESSERRÉ le 2026-08-06 (contre-relecture rédactionnelle) : ~320 mots ramenés à ~200, en
# retirant les chiffres et les noms d'essais que la carte affichée et l'argumentaire exhaustif portent déjà
# (NNT ~59, DEVOTE, DUAL VII, 4T, Bertuol) et la mention « hypoglycémies nocturnes » comme motif de choix
# d'un analogue de 2ᵉ génération, qui n'a jamais fait partie du signal de risque de ce nœud.
argumentaire: >
  Quand une insuline devient nécessaire dans le diabète de type 2, le schéma de choix est une insuline
  BASALE ajoutée aux antidiabétiques en cours, l'AR GLP-1 restant préféré comme premier injectable. Les
  schémas prandial et prémélangé d'emblée ne sont pas fondés sur les preuves : surcroît d'hypoglycémie et
  de poids, sans gain durable.


  L'intensification suit un ordre : AR GLP-1 ou association fixe AVANT le bolus — même contrôle que le
  basal-bolus, avec moins d'hypoglycémie et de poids —, puis un bolus ajouté par étapes.


  Le choix de la molécule et de la cible se pilote sur le RISQUE HYPOGLYCÉMIQUE, pas sur l'HbA1c seule :
  un analogue de deuxième génération lorsque ce risque est élevé. Le bénéfice y porte sur l'hypoglycémie
  symptomatique et nocturne, critères de substitution ; sur l'hypoglycémie SÉVÈRE, seul le dégludec contre
  glargine U100 l'a démontré.


  L'insuline est cardiovasculairement neutre : son bénéfice est glycémique et microvasculaire, ce dernier
  extrapolé du contrôle glycémique — jamais une promesse de survie. C'est cette distinction entre critère
  de substitution et critère dur que gradue le niveau de preuve affiché sur chaque proposition.


  Les cibles de mesure continue du glucose sont un consensus d'experts : elles servent à lire un profil,
  non à décider. Seule la dimension hypoglycémie y pilote des gestes de sécurité.
