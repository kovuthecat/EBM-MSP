    # « cibles assouplies » (ci-dessous) au même signal — cf. incertitudes.
    # ─────────────────────────────────────────────────────────────────────────────────────────────────
    # 2026-07-29 (passe A, arbitrage référent) — SECOND DÉCLENCHEUR : l'HbA1c SOUS la cible, dans TOUTE
    # situation non naïve. Jusqu'ici cette option n'existait qu'en `basal_bolus`, et uniquement sur le
    # terrain (`risque_hypoglycemique_eleve`). Deux conséquences, l'une et l'autre mesurées sur le moteur
    # le 2026-07-29 (vignettes V-A5 et V-A6) :
    #
    # - un sujet âgé fragile SOUS BASALE SEULE, à 6,3 % pour une cible de 8 %, ne recevait AUCUN
    #   allègement — le nœud n'avait pas d'option de désintensification hors basal-bolus, et
    #   `cible_atteinte` lisait ce sur-traitement franc comme un « objectif atteint » ;
    # - à l'inverse, étendre la seule branche `risque_hypoglycemique_eleve` aux autres situations aurait
    #   proposé d'alléger à un patient de 84 ans à 9,1 % pour une cible de 8 % — c'est-à-dire d'alléger
    #   ET de titrer sur le même écran (V-A6). C'est pourquoi le second déclencheur est l'écart à la
    #   cible, PAS le terrain : le terrain choisit la prudence, l'écart négatif justifie le geste.
    #
    # La branche `basal_bolus AND risque_hypoglycemique_eleve` est conservée TELLE QUELLE (arbitrage
    # 2026-07-26, non rouvert). Forme normale disjonctive obligatoire : le DSL n'a pas de parenthèses et
    # AND lie plus fort que OR ; les deux branches ne partagent aucun terme, donc un seul item.
    # ─────────────────────────────────────────────────────────────────────────────────────────────────
    conditions:
      - "situation_insuline == basal_bolus AND risque_hypoglycemique_eleve == true OR situation_insuline != naif AND ecart_sous_objectif_cible == true"
    # MOTIF AJOUTÉ P10/S4 (T-081, 2026-07-31) — seule la 2ᵉ branche : la 1ʳᵉ (« Basal-bolus et risque
