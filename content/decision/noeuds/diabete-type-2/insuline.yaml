        2026-07-27 (R9/I15 : « poursuivre le schéma en cours » suppose qu'un schéma existe) l'a du même
        coup rendu inatteignable au patient NAÏF — et la contrepartie n'a jamais été écrite. La situation
        « naïf » se retrouvait donc sans aucune sortie pour le patient qui n'a rien à instaurer : ses
        trois options exigent toutes soit `cible_atteinte == false OR symptomes_glucotoxicite == true`
        (les deux premières), soit `risque_hypoglycemique_eleve == true` (la troisième).
        .
        MESURE (banc, 2026-07-30) : profil #1213 sur 1760 — `situation_insuline: naif`, HbA1c 6,86 % pour
        une cible de 9,5 %, pas de symptôme de glucotoxicité, pas de risque hypoglycémique élevé. Le
        moteur renvoyait `applicable` VIDE **et** `enAttente` VIDE simultanément : ni recommandation, ni
        « il manque telle information ». Silence total pour le praticien, ce que ni un formulaire complet
        ni un formulaire partiel ne rattrapait. Attrapé par I2′ (`banc/invariants.test.ts`, sous
        information complète) et par I23 (`banc/securite-atteignable.test.ts`, sur chacun des 11 critères
        masqués un à un, dont `DFG`). Le trou était le SEUL du nœud : après correctif, plus aucun profil
        muet sur les 1760 × 11 évaluations du balayage.
        .
        DEUX REPLIS, ET POURQUOI CE N'EST PAS UNE FUSION QU'IL FALLAIT. « Poursuivre le schéma en cours »
        et « pas d'indication à en initier » sont deux conduites aux présupposés OPPOSÉS ; les réunir sous
        un intitulé sans présupposé redonnerait précisément l'option que R9/I15 a fait corriger le
        2026-07-27 (« le nœud propose de poursuivre un traitement qui n'existe pas »). En `multi-options`
        le moteur évalue TOUS les replis, donc deux sont licites à condition d'être mutuellement
        exclusifs : c'est la partition `situation_insuline == naif` / `!= naif` sur leurs `prerequis`.
        Vérifié que cette forme ne peut pas rouvrir le trou : la partition est exhaustive quand le critère
        est renseigné, et quand il est masqué les DEUX replis partent dans `enAttente` (D20), qui devient
        non vide — I23 est alors satisfait par l'attente, comme il doit l'être.
        .
        ⚠ TEXTE À VALIDER. Les `avantages` / `inconvenients` / `effet_attendu` de la carte sont un
        BROUILLON rédigé sans relecture clinique. Ils se bornent à ce que le moteur sait au moment où ce
        repli s'affiche (objectif atteint, pas de symptôme de glucotoxicité — un repli n'est atteint
        qu'avec `enAttente` vide) et renvoient explicitement au nœud `prescription` pour tout ce qui
        concerne le traitement non insulinique, y compris un éventuel allègement si l'HbA1c est nettement
        SOUS l'objectif individualisé (`ecart_sous_objectif_cible`, dont la branche de désintensification
        de ce nœud est gardée par `situation_insuline != naif` — délibérément).
        .
        SIGNALÉ, NON TRAITÉ (hors périmètre, demande un arbitrage clinique) : chez un patient naïf DÉJÀ À
        L'OBJECTIF mais à risque hypoglycémique élevé (âge ≥ 75, fragilité, espérance de vie limitée…),
        c'est « Choisir un analogue basal de 2ᵉ génération » qui reste la seule carte de l'écran — une
        carte sur la MODALITÉ d'une insulinothérapie qu'aucune autre option ne propose d'instaurer. Ce
        n'est pas un écran muet (donc hors du défaut corrigé ici), mais l'option se déclenche sur la seule
        conjonction `situation_insuline == naif AND risque_hypoglycemique_eleve == true`, sans terme sur
        l'atteinte de l'objectif — la même forme de défaut que le point 12.11 de la recette du 2026-07-26
        a corrigé quatre fois ailleurs dans ce nœud.
