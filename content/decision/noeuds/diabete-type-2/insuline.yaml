        volontairement étroite (T-033, §3bis « exécutable directement ») : le pivot de décision sans capteur
        et les 4 créneaux horaires d'hypoglycémie capillaire, également identifiés par ce même §3bis, restent
        des arbitrages cliniques référent, non traités ici.
        Vérifié : I10 (`banc/invariants-contenu.test.ts`) reste vert sans nouvelle dette — toutes les lectures
        de ces 4 critères ailleurs dans le nœud portaient déjà `situation_insuline` comme garde mentionné/
        acquis (I10 ne vérifie qu'UNE mention parmi les critères du garde, pas leur conjonction). MAIS I11
