      - "Le gain attendu est une baisse du risque d'hypoglycémie chez un patient pour qui un contrôle strict n'apporte plus grand-chose : sous insuline, l'hypoglycémie sévère atteint 1,00 pour 100 personnes-années contre 0,31 sans, sans aucun bénéfice cardiovasculaire (ORIGIN : MACE HR 1,02)."
    inconvenients:
      - "Contrôle glycémique volontairement moins strict — le bénéfice attendu est la réduction du risque d'hypoglycémie."
