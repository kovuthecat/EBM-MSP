alertes:
  # DÉCISION RÉFÉRENT 2026-07-27 : le verrou d'effort retire toute la famille « pratique structurée » dès
  # qu'un signe est positif — y compris pour une neuropathie / un mal perforant plantaire, alors que la
  # source HAS restreint la contre-indication aux membres INFÉRIEURS. Arbitrage : garder le blocage
  # (le nœud ne recueille pas de quoi qualifier chaque piste par segment corporel) mais RESTITUER
  # l'information par une alerte, pour qu'un patient neuropathe ne reparte pas sans aucune piste.
  # Alerte de NŒUD et non d'option (D21) : elle doit s'afficher précisément quand l'option a disparu —
  # une alerte d'option ne serait jamais rendue, l'option étant exclue.
  - quand: "neuropathie_ou_mal_perforant_plantaire == true"
    niveau: attention
    message: >-
      Neuropathie périphérique ou mal perforant plantaire. La source HAS restreint la limitation aux
      activités en charge des membres inférieurs : marche prolongée, course. Restent possibles les
      activités qui sollicitent les membres supérieurs et le travail en décharge — vélo assis, activités
      en position assise, renforcement du haut du corps, activités aquatiques après avis podologique.
      L'outil retire ici la famille « pratique structurée » dans son ensemble, faute de recueillir de quoi
      distinguer les pistes par segment corporel. Orienter vers une pratique adaptée, plutôt que de
      conclure à l'absence d'activité possible. Surveillance podologique et chaussage adaptés dans tous
      les cas.
  - quand: "insuline_ou_insulinosecreteur == true"
    niveau: attention
    message: >-
      Sous insuline, sulfamide ou glinide, toute augmentation de la dépense énergétique majore le risque
      d'hypoglycémie à l'effort — un mécanisme distinct de l'hypoglycémie par restriction des apports.
      Signaler le risque au patient : resucrage à disposition, autosurveillance autour de l'effort. Ce
      risque se prévient, il ne justifie pas de renoncer à bouger : aucune piste n'est bloquée ici.
  - quand: "fragilite == true"
    niveau: attention
    message: >-
      Sujet fragile : éviter les activités physiques prolongées par forte chaleur, favoriser l'hydratation
      même en l'absence de sensation de soif, et éviter les activités de renforcement musculaire de forte
      intensité en ambiance chaude (HAS, guide des connaissances sur l'activité physique et la sédentarité).
# `cadrage` créé (P10/S6, T-083) : ce nœud n'en portait aucun. Registre du primer RHD
# (`content/decision/modules/diabete-type-2/rhd.yaml`), seul endroit de l'app cité comme réussi sur ce
# terrain par le praticien — concret, court, orienté consultation. Le premier énoncé reprend ce que
# `argumentaire`/l'en-tête du fichier disaient déjà (la réserve majeure EBM), sans rien y ajouter
# (D23). Le second, la liste « ce que ce nœud ne prend pas en compte », est DÉDUIT de ce qui manque à
# `criteres_entree` et changerait une conduite (vignette N9 de recette : le projet propre du patient,
# l'ECG déjà réalisé, le sevrage tabagique récent ne sont jamais interrogés ; « une évaluation médicale
# minimale » est exigée par une alerte sans être définie nulle part) — À VALIDER PAR LE RÉFÉRENT (cf.
# bilan de session), au même titre que la liste équivalente du nœud `prescription` (S3).
cadrage:
  - >-
    Ce nœud suggère des pistes de rapprochement de la régularité de pratique, seul repère prédictif
    retenu ici, jamais un objectif chiffré (150 min/semaine, 10 000 pas). Aucune piste ne revendique de
    bénéfice cardiovasculaire dur : aucun essai contrôlé d'exercice isolé ne l'a démontré dans le diabète
    de type 2 établi. Ce qui est démontré est d'un autre ordre — environ 0,6 point d'HbA1c en moins avec
    l'exercice structuré, c'est-à-dire un marqueur amélioré, pas un événement évité.
  - >-
    Aucun signe recueilli ici ne conclut à l'impossibilité de bouger. Le verrou de sécurité à l'effort ne
    ferme que la pratique structurée et la montée d'intensité, jamais les déplacements actifs, l'activité
    quotidienne ni la rupture de sédentarité. Le risque d'hypoglycémie sous insuline, sulfamide ou glinide
    est signalé quand il existe, jamais bloquant : il se prévient.
  - >-
    L'évaluation médicale avant une montée d'intensité et le contrôle de la glycémie avant l'effort ne
    sont pas des données recueillies ici : ce sont des rappels ponctuels, portés par une alerte au moment
    où ils servent.
  - >-
    Ce que ce nœud ne prend pas en compte : le projet ou la motivation propre du patient (ex. envie de
    reprendre la course) ; si un bilan cardiologique (ECG) a déjà été réalisé ; un sevrage tabagique
    récent ; ce que recouvre concrètement « l'évaluation médicale minimale » recommandée avant l'effort,
    nommée par une alerte sans être définie ; le nom des structures d'activité physique adaptée du
    secteur — l'orientation reste générique, ces informations vieillissent vite et le praticien connaît
    son territoire.
argumentaire: >
  Sur cet axe, la preuve est plus mince que le discours courant ne le laisse croire, et le nœud le dit
  plutôt que de l'atténuer. Aucun essai contrôlé randomisé d'exercice isolé, dans le diabète de type 2
  établi, ne démontre de bénéfice sur un critère cardiovasculaire ou sur la mortalité. Look AHEAD, mené
  dans cette population exacte, est neutre sur son critère cardiovasculaire primaire (HR 0,95, essai
  arrêté pour futilité) et ne réduit pas la mortalité toutes causes. En amont du diabète, chez des sujets
  seulement à risque, le seul essai à avoir isolé un bras « exercice seul » — Da Qing — n'atteint pas non
  plus la significativité sur les critères durs. Le seul bénéfice cardiovasculaire dur des mesures
  hygiéno-diététiques est porté par le régime méditerranéen, côté alimentation, pas par l'activité
  physique seule. Aucune piste de ce nœud ne porte donc l'étiquette « bénéfice sur critère dur ».


  Cette réserve n'est pas un rejet. Ce que l'exercice fait de démontré, il le fait sur un marqueur
  intermédiaire : dans le diabète de type 2 établi, l'exercice structuré abaisse l'HbA1c d'environ
  0,6 point (méta-analyse Cochrane, essais de 8 semaines à 12 mois) — un effet net et cohérent d'une
  source à l'autre, mais qui reste un marqueur amélioré, pas un événement évité.


  Ce que la preuve désigne le mieux n'est pas un chiffre, c'est un principe : l'activité physique
  régulière prédit un bon résultat à long terme, davantage que l'intensité ou que la perte de poids
  initiale (guide EBM européen, grade A). C'est cette régularité que le recueil et les pistes cherchent à
  faire progresser.


  Les repères chiffrés officiels existent — 150 à 300 minutes hebdomadaires d'intensité modérée, sans
  volume minimal en dessous duquel il n'y aurait aucun bénéfice, fractionnables y compris en périodes de
  moins de dix minutes ; 2 à 3 séances d'activité physique adaptée par semaine ; une progression de 1 000
  à 3 000 pas hebdomadaires plutôt qu'un objectif de 10 000 pas érigé en dogme. Ils vivent ici en
  contexte, jamais comme cible affichée au patient : administrer un chiffre reviendrait à mesurer un
  écart, donc à produire un score d'adhérence. C'est d'ailleurs la formule de la source officielle
  elle-même, qui met en garde contre le dogme du nombre de pas.


  Les pistes sont organisées en six familles cumulables : déplacements actifs, rupture de sédentarité,
  activité quotidienne, pratique structurée, orientation vers une ressource, et maintien de ce qui est
  déjà en place chez un patient dont la pratique est régulière. Le repère retenu pour la rupture de
  sédentarité — au moins une minute toutes les heures — est le plus bas et le mieux gradé des seuils
  voisins disponibles, et le plus atteignable ; d'autres sources en proposent de plus élevés, sans
  gradation, cf. « ce qui reste incertain ».


  Une remarque sur les badges de preuve portés par chaque piste, parce qu'ils peuvent surprendre à côté
  d'un texte qui cite un grade A. Le badge gradue la certitude de la donnée pour le geste isolé tel qu'il
  est proposé ici ; le grade d'une recommandation, lui, porte sur le principe d'ensemble qu'elle défend.
  Les deux ne mesurent pas le même objet et peuvent donc diverger : le principe « la régularité prédit le
  résultat à long terme » est solidement établi, tandis que la piste concrète qui en découle n'a le plus
  souvent jamais été testée seule contre un comparateur. Un outil de lecture des preuves grade la
  certitude de la donnée, pas la force de la recommandation qui l'englobe — d'où des badges « preuve
  modérée » ou « faible » au voisinage d'un grade A, sans contradiction.


  Un verrou de sécurité à l'effort — limitation physique connue, symptômes d'ischémie à l'effort,
  rétinopathie non stabilisée ou proliférante, neuropathie périphérique ou mal perforant plantaire —
  bloque la montée d'intensité et la pratique structurée, jamais les déplacements actifs ni la rupture de
  sédentarité : ce qui est risqué, c'est l'effort soutenu, pas le mouvement. L'hypoglycémie sous insuline,
  sulfamide ou glinide reste une alerte et jamais un blocage, dès qu'une piste augmente la dépense
  énergétique.
