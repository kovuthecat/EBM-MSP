        `prerequis`, `priorite`, `role`, `famille` ni `niveau_preuve` modifiés ; aucune clé de `motifs`
        touchée (I24). (1) CONTRADICTIONS INTERNES : l'`argumentaire` annonçait six familles et en
        énumérait cinq — la famille « Maintien » est rétablie dans l'énumération. Le même énoncé
        (régularité prédictive, grade A) était revendiqué à l'identique sur une carte en preuve modérée et
        sur une carte en preuve faible : la carte faible (« Poursuivre les habitudes actuelles… ») ne
        revendique plus le grade, elle dit ce que son badge soutient (principe établi, transposition non
        testée), et un paragraphe de l'`argumentaire` explique désormais ce que le badge gradue — la
        certitude de la donnée pour le geste isolé, distincte de la force de la recommandation qui
        l'englobe. (2) DA QING n'est plus présenté comme un essai « dans le diabète de type 2 établi » :
        la phrase distingue explicitement la population à risque non encore diabétique, dans
        l'`argumentaire` et dans l'appui de divergence ; l'essai reçoit une entrée bibliographique
        (`da-qing`, décomposition par bras à 30 ans, 2024), qui lui manquait alors qu'il porte la moitié
        de la réserve majeure. (3) JAMBE POSITIVE DE LA PREUVE, jusqu'ici absente de tous les niveaux :
        la magnitude sur l'HbA1c (environ 0,6 point, essais de 8 semaines à 12 mois) entre en `cadrage`,
        en `argumentaire`, en `synthese_critique`, dans l'`effet_attendu` et le `delai_benefice` de la
        piste « programme d'activité physique adaptée », avec sa référence (`cochrane-exercice-dt2`).
        (4) PANNEAU DE PREUVES : 9 options qui citaient leur source en prose déclarent maintenant l'id
        correspondant (`spf-antisedentarite`, `has-dt2-ap`, `has-guide-ap`, `has-obesite-ap`,
        `duodecim-ap`) ; la piste « programme d'activité physique adaptée » adosse `look-ahead` et
        `da-qing`, qui portent l'affirmation d'absence de preuve dure de son `effet_attendu`.
        12 options sur 13 portent désormais au moins une référence. (5) CONTRE-INDICATIONS : les quatre
        signes du verrou de sécurité à l'effort quittent la colonne « inconvénients », où ils étaient
        rangés à tort, pour le champ `contre_indications` de la piste « programme d'activité physique
        adaptée » (forme longue, chacun avec la condition qui l'active — aucune expression nouvelle, copie
        des termes de l'`exclusions` existante, qui n'est pas modifiée). L'inconvénient restant ne garde
        que ce qui en est un : délai d'accès et disponibilité de l'offre locale. (6) APERÇUS : 6 options
        reçoivent un `apercu` (modalité pratique déjà présente dans leur texte) ; aucun chiffre-cible
        nouveau n'est exposé, conformément à la règle « mouvement, pas cible ». (7) COLONNE
        « AVANTAGES » : les 13 préfixes « Provenance : … » sont retirés — cette information de niveau de
        preuve est versée dans l'`effet_attendu` de chaque option. Sont également retirés un commentaire
        éditorial sur le choix d'un libellé, deux tournures de voix de conception et un renvoi au
        vocabulaire de la grille de recueil interne. La seule carte qui tutoyait le patient est réécrite
        à la troisième personne, sans ré-énumérer ses conditions déclenchantes. (8) INCERTITUDES : sept
        deviennent trois. Sortent les quatre énoncés qui décrivaient un choix de conception (alerte
        plutôt que critère, alerte jamais bloquante, affichage cumulable voulu, absence de structure
        nommée) — leur substance clinique est reversée en `cadrage`, qui passe de deux à quatre énoncés.
        Entre une incertitude réelle : les limites de la magnitude sur l'HbA1c. (9) LISIBILITÉ : capitales
        d'insistance retirées partout sauf où elles ne portaient rien, phrases-fleuves découpées (dont la
        première phrase de l'alerte neuropathie, à contenu strictement préservé), sigles développés
        (questionnaires d'activité physique dans `population_cible`), identifiants de règles internes
        retirés des champs affichés, et l'`effet_attendu` de la piste « programme d'activité physique
        adaptée » ne répète plus son premier avantage. (10) ARGUMENTAIRE EXHAUSTIF : le paragraphe de
        mécanique de banc de test et l'entrée de changelog déguisée en argumentaire sont réécrits en
        registre clinique ; une section sur la divergence des trois seuils de rupture de sédentarité y est
        ajoutée, ce qui rend enfin exacts les renvois qui la citaient ; les renvois d'atelier (chemin de
