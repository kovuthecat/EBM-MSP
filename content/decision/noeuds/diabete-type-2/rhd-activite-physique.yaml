# Module RHD — nœud ACTIVITÉ PHYSIQUE — BROUILLON v0.1 (2026-07-26), pas encore validé référent.
# Autorité : docs/decision/validation/chantier-2026-07-26/CONCEPTION-module-rhd.md (structure, décisions
# référent §4bis) + rhd-collecte-activite-physique.md (grille + bibliothèque de pistes, révisée après
# red-team) + redteam-collectes-rhd.md.
#
# REMPLACE, À TERME, LE VOLET ACTIVITÉ DU NŒUD `rhd` (perte de poids/rémission, en cours de bascule —
# `rhd.yaml` n'est PAS modifié ici, un agent parallèle y travaille sur ses `sources`). Ce nœud ne traite
# QUE l'axe activité physique (dont sédentarité, famille de pistes pilote à l'intérieur de ce nœud,
# décision référent — extractible en nœud distinct plus tard si le volume le justifie) ; l'objectif de
# perte de poids/rémission reste porté par `rhd`.
#
# ⚠ RÉSERVE MAJEURE, confirmée par une passe de preuve dédiée et son red-team (`preuve-activite-physique.md`
# cité par CONCEPTION-module-rhd.md §3, `H-rhd.md` §3 sous-dossier H3, `rhd-collecte-activite-physique.md`
# §0/P3) : AUCUNE piste de ce nœud ne porte l'étiquette « bénéfice EBM sur critère dur ». Aucun ECR
# d'exercice isolé, dans le DT2 établi, ne démontre de bénéfice sur un critère cardiovasculaire ou de
# mortalité (Look AHEAD : critère CV primaire neutre HR 0,95, essai arrêté pour futilité ; mortalité non
# réduite ; le bras exercice seul de Da Qing n'est pas significatif). Le seul bénéfice CV dur des mesures
# hygiéno-diététiques est porté par le régime méditerranéen (nœud sœur `rhd-alimentation`), pas par
# l'activité physique isolée. Le corpus HAS/PNNS mobilisé ci-dessous enrichit le REGISTRE officiel des
# pistes, PAS leur niveau de preuve — toutes les options portent donc l'étiquette « recommandation
# officielle » ou « savoir-faire (non EBM) ».
#
# RÈGLE STRUCTURELLE (référent 2026-07-26, CONCEPTION-module-rhd.md §4bis-0/§0, prioritaire) : le nœud
# SUGGÈRE des pistes pour se rapprocher de la régularité démontrée prédictive (EBM Guidelines/Duodecim,
# grade A : « l'activité physique régulière prédit un bon résultat à long terme, pas la perte de poids
# rapide au début ») — il ne propose JAMAIS de cible chiffrée (150 min/sem., 10 000 pas). Conséquences :
#   1. Le recueil porte sur une FRÉQUENCE/DURÉE DÉCLARÉE en BANDES, jamais une quantité comparée à un
#      seuil précis.
#   2. Aucune piste n'affiche de valeur à atteindre : les repères chiffrés officiels (150-300 min/sem.,
#      2-3 séances d'APA/sem., + 1 000-3 000 pas/sem.) vivent en CONTEXTE (avantages/argumentaire),
#      jamais dans le geste proposé. La HAS elle-même déconseille le dogme du chiffre pour le pas
#      quotidien (« proposer d'augmenter progressivement… chaque pas en plus est bénéfique ») — c'est la
#      meilleure illustration trouvée du principe « mouvement, pas cible », reprise en piste dédiée.
#   3. Aucun score d'adhérence.
#   4. Le rang d'une piste (`priorite`) est déclaré : 1 = renforcement positif du patient déjà actif et
#      rupture de sédentarité (repère le plus bas, le mieux gradé, le plus atteignable) ; au-delà =
#      activité quotidienne puis pratique structurée (accompagnement, effort de mise en œuvre plus élevé).
#
# GARDE-FOUS — DES `exclusions`, PAS DES ALERTES (D21), ancrés HAS DT2 R.19/R.27/R.28 : le verrou
# « sécurité à l'effort » (`verrou_effort`, dérivé de 4 signes, tous `presomption_non` ABSENT — D30/T-018,
# P4/S1 : ce sont exactement les 4 signes qui gardent l'exclusion de la famille « pratique structurée »,
# donc jamais éligibles à une présomption de « non » — limitation physique connue, symptômes d'ischémie à
# l'effort, rétinopathie non stabilisée/proliférante, neuropathie périphérique/mal perforant plantaire)
# bloque UNIQUEMENT la montée d'intensité/pratique
# structurée (décision de bucketing du référent, CONCEPTION-module-rhd.md §4) ; il laisse passer
# l'activité quotidienne, les déplacements actifs et la rupture de sédentarité. L'hypoglycémie sous
# insuline/sulfamide/glinide reste une ALERTE simple, jamais un blocage (arbitrage référent explicite,
# tranchant le point laissé ouvert par le red-team, finding B-3).
#
# SÉDENTARITÉ — seuil de rupture retenu : REPÈRE (pas un seuil administré) « au moins 1 minute par heure »
# (HAS DT2 R.16, grade C — le plus bas des seuils voisins, le mieux gradé, le plus atteignable ; une
# source HAS parallèle juge par ailleurs les preuves insuffisantes sur ce chiffre précis, signalé en
# argumentaire).
#
# TERRAIN (I4) : `fragilite` est déclaré IDENTIQUE au reste du domaine et au nœud sœur
# `rhd-alimentation`. `traitements_en_cours` a été REMPLACÉ le 2026-07-29, dans les deux nœuds RHD
# ensemble, par le bool `insuline_ou_insulinosecreteur` (cf. sa déclaration) — nom différent parce que
# concept différent : les deux nœuds RHD ne lisaient que l'exposition à l'hypoglycémie, pas la classe.
# `age`/`esperance_vie` NE SONT PAS déclarés ici : aucune règle de ce nœud ne les rend décisifs (R5).
#
# PORTÉE VOLONTAIREMENT RÉDUITE vs la collecte (R5, charge de saisie) : S7 (goûts/préférence d'activité)
# NON repris — la source elle-même le décrit comme une aide à la négociation qui « ne bloque rien »,
# donc jamais décisif ; la conversation directe en consultation y pourvoit (même traitement que la
# culture culinaire du nœud sœur `rhd-alimentation`). AA5/AA6 (vécu négatif, peur de se blesser, crainte
# des moqueries) FUSIONNÉS en un seul critère (`experience_activite_negative`) : les deux alimentaient la
# même piste unique (5.2), une distinction plus fine n'aurait rien changé au geste proposé. G1
# (évaluation médicale avant intensité si inactif/FDR CV) et G7 (glycémie avant l'effort, seuil 2,5 g/L)
# NE SONT PAS des critères d'entrée : ce sont des rappels attachés à l'option « pratique structurée »
# (alerte d'option), pas des données chroniques à recueillir — G7 est un repère d'auto-surveillance
# ponctuel du patient, pas une donnée que le praticien saisit dans ce nœud.
id: rhd-activite-physique
domaine: diabete-type-2
module: RHD
titre: "Activité physique — se rapprocher de la régularité"
population_cible: >-
  Adulte DT2, en consultation de médecine générale. Nœud du module RHD (axe activité physique, y compris
  sédentarité) : recueil bref des habitudes de pratique, de déplacement et de sédentarité, puis pistes
  concrètes et négociables de rapprochement de la régularité — jamais un objectif chiffré à atteindre,
  jamais un score d'adhérence. Autonome : évaluable seul, sans prérequis d'un autre nœud. Hors
  périmètre : objectif de perte de poids et rémission (aucun nœud ne les porte à ce jour) ; bilan
  d'aptitude physique détaillé (endurance cardiorespiratoire, force, souplesse — évaluation professionnelle
  d'un enseignant en activité physique adaptée) ; questionnaire d'activité physique structuré, qu'il
  s'agisse du GPAQ de l'Organisation mondiale de la santé ou du questionnaire de l'Observatoire national
  de l'activité physique et de la sédentarité — aucun des deux n'est repris ici.
selection: multi-options
argumentaire_exhaustif: "rhd-activite-physique.argumentaire.md"
familles:
  - libelle: "Déplacements actifs"
    exclusive: false
  - libelle: "Rupture de sédentarité"
    exclusive: false
  - libelle: "Activité quotidienne"
    exclusive: false
  - libelle: "Pratique structurée"
    exclusive: false
  - libelle: "Orientation vers une ressource"
    exclusive: false
  - libelle: "Maintien"
    exclusive: false
criteres_entree:
  # ── Terrain (I4 : `fragilite` identique à rhd.yaml/prescription.yaml/insuline.yaml/rhd-alimentation.yaml) ──
  - nom: fragilite
    # `partage` ajouté le 2026-07-29 (recette référent, item F/point 5) : encodage désormais IDENTIQUE
    # sur tous les nœuds qui le déclarent (type, valeurs, bornes, presomption_non) — condition I19.
    partage: true
    type: bool
    groupe: Terrain
  # 2026-07-29 — REMPLACE `traitements_en_cours` (`liste` de 9 classes) SUR CE NŒUD UNIQUEMENT, à
  # l'identique du nœud sœur `rhd-alimentation`. Motif (R5) : sur les 9 cases, ce nœud n'en lisait que 4
  # (insuline basale, insuline rapide, sulfamide, glinide) et toujours ensemble, dans l'unique `quand` de
  # l'alerte d'hypoglycémie à l'effort ci-dessous ; les 5 autres (metformine, iSGLT2, aGLP1, tirzépatide,
  # gliptine) n'apparaissaient dans aucune condition — cliniquement inertes ici. NOM : « hypoglycémiant »
  # serait ambigu (metformine et gliptine sont des antihyperglycémiants) — on nomme les deux mécanismes
  # qui exposent réellement à l'hypoglycémie. `prescription.yaml`/`insuline.yaml` gardent, eux,
  # `traitements_en_cours` en 9 valeurs (`partage: true`) : ils prescrivent, ils ont besoin de la classe.
  - nom: insuline_ou_insulinosecreteur
    type: bool
    groupe: Terrain
    aide: >-
      Insuline (basale ou rapide), sulfamide hypoglycémiant (gliclazide, glimépiride…) ou glinide
      (répaglinide) — les seules classes qui exposent à l'hypoglycémie à l'effort. Metformine, iSGLT2,
      AR GLP-1, tirzépatide et gliptine n'y exposent pas en monothérapie et ne sont pas concernées.
    # `presomption_non` CONSERVÉ (T-018/D30) : éligibilité mécanique inchangée par ce renommage — aucune
    # condition d'option `role: securite`, aucune `exclusions`, aucun `prerequis` ne le lit ; il ne
    # conditionne qu'une `alerte` de nœud (canal distinct, R8). Le retirer changerait le comportement
    # (indéterminé, donc « décisif à confirmer » sur formulaire vierge) : hors périmètre de ce lot.
    presomption_non: true
    # `partage` ajouté le 2026-08-05 (P13/S5, T-147) — revue COMPLÈTE de la liste `partage` (pas
    # seulement poids/taille) : ce drapeau est un fait OBJECTIF (une classe de traitement en cours) et
    # STABLE en consultation, déclaré à L'IDENTIQUE (`type: bool`, même `presomption_non: true`) sur
    # `rhd-alimentation.yaml` — les deux nœuds RHD sont typiquement ouverts l'un après l'autre dans la
    # même consultation (cf. `docs/decision/validation/revue-conception-fable-2026-08-04.md`, § Complément
    # sur la mémoire de session, où la circulation RAS entre les deux nœuds RHD est déjà vérifiée). Ajouté
    # SUR LES DEUX NŒUDS dans la même session (`lib/sessionCriteres.ts` exige `partage: true` du côté
    # émetteur ET du côté lecteur) ; encodage identique vérifié par I32
    # (`engine/banc/coherence-inter-noeuds.test.ts`) avant l'ajout.
    partage: true
  # ── Socle — habitudes d'activité physique (S1-S5) ──
  - nom: frequence_activite_structuree
    type: enum
    groupe: Habitudes d'activité physique
    valeurs: [jamais, une_fois_semaine, deux_a_trois_fois_semaine, quatre_fois_ou_plus_semaine]
  - nom: duree_seance
    type: enum
    groupe: Habitudes d'activité physique
    valeurs: [moins_10_min, dix_a_trente_min, plus_30_min]
    # Masqué si aucune séance n'est jamais pratiquée (R5, recette N9 du 2026-07-30) — P8/S4, T-062.
    visible_si: "frequence_activite_structuree != jamais"
  - nom: mode_deplacement_courts_trajets
    type: enum
    groupe: Habitudes d'activité physique
    valeurs: [actif_pied_ou_velo, motorise_ou_assis, mixte]
  - nom: temps_assis_quotidien
    type: enum
    groupe: Habitudes d'activité physique
    valeurs: [moins_4h, quatre_a_huit_h, plus_8h]
  - nom: rupture_sedentarite_habituelle
    type: bool
    groupe: Habitudes d'activité physique
    # T-018 (P4/S1, D30) — RETIRÉ après vérification empirique par I21 (`engine/banc/vierge.test.ts`,
    # T-019) : ce critère satisfait la lecture LITTÉRALE de l'étape 4 (aucune condition d'option
    # `role: securite`, aucune `exclusions`), mais I21 a montré que le poser reproduisait EXACTEMENT le
    # défaut D-01 de la recette navigateur du 2026-07-28 (4 cartes « Recommandée » sur un formulaire
    # vierge) — ce critère est lu comme `rupture_sedentarite_habituelle == false` dans une disjonction
    # `OR` de 3 options « geste » (« Se lever et bouger… », « S'appuyer sur un repère… », « Transformer
    # une pause… ») : présumé « non » (donc « false »), ce terme devient VRAI À LUI SEUL et suffit à
    # rendre les 3 options applicables sans qu'aucune autre donnée n'ait été saisie. La lecture littérale
    # de l'étape 4 (role: securite + exclusions) ne suffit donc pas à garantir « l'absence de réponse ne
    # peut pas nuire » quand le défaut du critère sert de DÉCLENCHEUR positif d'un `OR` plutôt que d'un
    # simple repli neutre — I21 est l'arbitre empirique final, cf. rapport de tâche T-018.
  # ── Verrou — sécurité à l'effort (S6 + G2/G4/G5, HAS R.19/R.27/R.28). Bloque UNIQUEMENT la pratique
  #    structurée (décision de bucketing du référent) ; laisse passer déplacements actifs, activité
  #    quotidienne et rupture de sédentarité. Chaque signe garde `presomption_non` ABSENT — aucun des
  #    quatre n'est éligible mécaniquement (T-018, P4/S1) : ils gardent tous l'exclusion de la famille
  #    « pratique structurée » (cf. `verrou_effort` ci-dessous et l'option qu'il exclut). Avant D30, ces
  #    quatre portaient `confirmation_requise: true` (même effet : indéterminé tant que non répondu) ; le
  #    renommage D30 inverse le SENS du champ (une déclaration positive présume désormais le « non », pas
  #    l'inverse), donc ils PERDENT le champ plutôt que de le porter sous le nouveau nom. ──
  - nom: limitation_physique_connue
    type: bool
    groupe: Sécurité à l'effort
  - nom: symptomes_ischemie_effort
    type: bool
    groupe: Sécurité à l'effort
  - nom: retinopathie_non_stabilisee_ou_proliferante
    type: bool
    groupe: Sécurité à l'effort
  - nom: neuropathie_ou_mal_perforant_plantaire
    type: bool
    groupe: Sécurité à l'effort
  - nom: verrou_effort
    type: bool
    groupe: Sécurité à l'effort
    derive: >-
      limitation_physique_connue == true OR symptomes_ischemie_effort == true
      OR retinopathie_non_stabilisee_ou_proliferante == true OR neuropathie_ou_mal_perforant_plantaire == true
  # ── Approfondissement (décisifs uniquement, R5) ──
  # T-018 (P4/S1, D30) : éligible mécaniquement à presomption_non (aucune condition d'option
  # `role: securite`, aucune `exclusions` de ce nœud) — et vérifié par I21 (`engine/banc/vierge.test.ts`,
  # T-019) : sa seule lecture (« Orienter vers une structure… », condition `limitation_physique_connue ==
  # true OR difficulte_acces_activite == true OR offre_proximite_connue == false ») l'utilise comme
  # déclencheur POSITIF (`== true`) — présumé « non », ce terme reste FAUX et ne peut jamais, à lui seul,
  # rendre l'option applicable sur un formulaire vierge.
  - nom: difficulte_acces_activite
    type: bool
    groupe: Approfondissement (si besoin)
    presomption_non: true
  - nom: offre_proximite_connue
    type: bool
    groupe: Approfondissement (si besoin)
    # T-018 (P4/S1, D30) — RETIRÉ après vérification empirique par I21 (`engine/banc/vierge.test.ts`,
    # T-019) : satisfait la lecture littérale de l'étape 4, mais sa seule lecture (« Orienter vers une
    # structure… ») le cite `OR offre_proximite_connue == false` — présumé « non » (donc `false`), ce
    # terme devient VRAI À LUI SEUL et rend l'option applicable sur un formulaire vierge (même famille de
    # défaut D-01 que `rupture_sedentarite_habituelle` ci-dessus). I21 est l'arbitre empirique final.
  - nom: experience_activite_negative
    type: bool
    groupe: Approfondissement (si besoin)
    # T-018 (P4/S1, D30) : éligible mécaniquement à presomption_non, vérifié par I21 — sa seule lecture
    # (« Proposer un bilan avec un enseignant en activité physique adaptée… ») l'utilise comme
    # déclencheur POSITIF (`experience_activite_negative == true`), jamais comme terme `== false` : présumé
    # « non », le terme reste FAUX, sans risque de rendre l'option applicable à tort.
    presomption_non: true
options:
  # ═══════════ FAMILLE DÉPLACEMENTS ACTIFS ═══════════
  - intitule: "Remplacer un trajet motorisé par la marche ou le vélo, une à deux fois par semaine"
    role: geste
    conditions:
      - "mode_deplacement_courts_trajets == motorise_ou_assis"
    priorite: 5
    famille: "Déplacements actifs"
    apercu: "un à deux trajets courts par semaine faits à pied ou à vélo, au choix du patient"
    avantages:
      - "Rapproche de l'activité intégrée aux déplacements quotidiens, sans passer par une pratique structurée — un trajet à la fois, sans viser l'exhaustivité."
    inconvenients:
      - "Extrapolation raisonnée d'un principe général (l'activité dans les déplacements quotidiens compte) plutôt qu'un essai contrôlé testant spécifiquement ce report modal."
    effet_attendu: "Savoir-faire de consultation, sans essai dédié : contribue au volume d'activité quotidienne, effet propre de ce geste isolé non chiffrable."
    niveau_preuve: faible
  - intitule: "Pour les courses, préférer plusieurs petits déplacements actifs à un grand trajet motorisé"
    role: geste
    conditions:
      - "mode_deplacement_courts_trajets == motorise_ou_assis"
    priorite: 5
    famille: "Déplacements actifs"
    avantages:
      - "Multiplie les occasions de bouger dans la semaine plutôt qu'une seule sortie motorisée — repère concret de Santé publique France, cohérent avec l'incitation à la marche, au vélo ou à la trottinette dans les activités quotidiennes."
    inconvenients:
      - "Dépend de la proximité réelle des commerces — à négocier selon le contexte du patient."
    effet_attendu: "Repère de recommandation officielle, sans essai dédié : contribue au volume d'activité quotidienne, effet propre de ce geste isolé non chiffrable."
    niveau_preuve: faible
    references:
      - spf-antisedentarite
  # ═══════════ FAMILLE RUPTURE DE SÉDENTARITÉ ═══════════
  - intitule: "Se lever et bouger quelques minutes à chaque heure de position assise prolongée"
    role: geste
    conditions:
      - "temps_assis_quotidien == quatre_a_huit_h OR temps_assis_quotidien == plus_8h OR rupture_sedentarite_habituelle == false"
    # T-125 (P12/S5) : motif sur la branche booléenne négative — sans lui, rendu mécanique en
    # « Interrompt habituellement les longues périodes assises : non », lisible comme du code.
    motifs:
      "rupture_sedentarite_habituelle == false": "aucune interruption habituelle des périodes assises"
    priorite: 2
    famille: "Rupture de sédentarité"
    apercu: "au moins une minute de mouvement par heure passée assis — un repère, pas un objectif à atteindre"
    avantages:
      - "Réduit le temps de sédentarité continue. Le repère de la HAS pour le diabète de type 2 est « au moins une minute toutes les heures » : le plus bas et le mieux gradé des seuils proposés par les différentes sources, donc le plus atteignable."
      - "Formulé à chaque pause ou changement de tâche plutôt qu'en objectif abstrait de « moins s'asseoir »."
    inconvenients:
      - "Une minute par heure est un repère, pas un seuil validé par un essai contrôlé dédié : une source HAS parallèle juge les preuves encore insuffisantes sur ce chiffre précis, et les autres sources en donnent de plus élevés, sans gradation (voir « ce qui reste incertain »)."
    effet_attendu: "Repère de recommandation officielle : réduit le temps de sédentarité continue, effet propre de ce geste isolé non chiffrable."
    niveau_preuve: faible
    references:
      - has-dt2-ap
  - intitule: "S'appuyer sur un repère du quotidien pour penser à se lever (téléphone hors de portée, appel pris en marchant)"
    role: geste
    conditions:
      - "temps_assis_quotidien == quatre_a_huit_h OR temps_assis_quotidien == plus_8h OR rupture_sedentarite_habituelle == false"
    # T-125 (P12/S5) : motif sur la branche booléenne négative — sans lui, rendu mécanique en
    # « Interrompt habituellement les longues périodes assises : non », lisible comme du code.
    motifs:
      "rupture_sedentarite_habituelle == false": "aucune interruption habituelle des périodes assises"
    priorite: 3
    famille: "Rupture de sédentarité"
    avantages:
      - "Donne un déclencheur concret et mémorisable à la rupture de sédentarité, plutôt qu'une intention abstraite — repère de Santé publique France (astuces anti-sédentarité)."
    inconvenients:
      - "Formulé pour le télétravail dans la source, généralisé ici à toute position assise prolongée (bureau, écrans)."
    effet_attendu: "Repère de recommandation officielle, sans essai dédié : effet propre de ce geste isolé non chiffrable."
    niveau_preuve: faible
    references:
      - spf-antisedentarite
  - intitule: "Transformer une pause déjà prise dans la journée en occasion de bouger quelques instants"
    role: geste
    conditions:
      - "temps_assis_quotidien == quatre_a_huit_h OR temps_assis_quotidien == plus_8h OR rupture_sedentarite_habituelle == false"
    # T-125 (P12/S5) : motif sur la branche booléenne négative — sans lui, rendu mécanique en
    # « Interrompt habituellement les longues périodes assises : non », lisible comme du code.
    motifs:
      "rupture_sedentarite_habituelle == false": "aucune interruption habituelle des périodes assises"
    priorite: 3
    famille: "Rupture de sédentarité"
    avantages:
      - "Rattache la rupture de sédentarité à un moment déjà existant (pause café, changement de dossier) plutôt qu'à un nouvel effort à programmer — repère de Santé publique France."
    inconvenients:
      - "Extrapolation d'un principe général : aucun essai contrôlé dédié à cette tactique spécifique."
    effet_attendu: "Repère de recommandation officielle, sans essai dédié : effet propre de ce geste isolé non chiffrable."
    niveau_preuve: faible
    references:
      - spf-antisedentarite
  # ═══════════ FAMILLE ACTIVITÉ QUOTIDIENNE ═══════════
  - intitule: "Intégrer du mouvement dans les tâches déjà présentes dans la journée (escaliers, ménage, jardinage, courses portées)"
    role: geste
    conditions:
      - "frequence_activite_structuree == jamais OR frequence_activite_structuree == une_fois_semaine"
    priorite: 2
    famille: "Activité quotidienne"
    avantages:
