  synthese_critique:
    donnee: >-
      Aucune revue secondaire indépendante consultée pour ce nœud ne revendique de bénéfice
      cardiovasculaire dur propre à l'exercice isolé dans le diabète de type 2 établi — position cohérente
      avec le constat de preuve retenu ici. Le bénéfice cardiovasculaire dur des mesures
      hygiéno-diététiques reste porté par le régime méditerranéen, traité par le nœud « Alimentation — se
      rapprocher du repère méditerranéen », pas par l'activité physique seule. Ce qui est solidement
      documenté du côté de l'activité physique porte sur un marqueur : environ 0,6 point d'HbA1c en moins
      avec l'exercice structuré. Aucune synthèse dédiée spécifiquement aux gestes proposés par ce nœud n'a
      été identifiée dans le corpus rassemblé (signalé plutôt qu'inventé).
    appuis:
      - look-ahead
      - da-qing
      - cochrane-exercice-dt2
      - duodecim-ap
    # REVUES SECONDAIRES CONSULTÉES — retirées de l'écran le 2026-08-04 (le champ
    # `synthese_critique.references` n'existe plus au schéma). Motif : rendues sous la position comme
    # « Réf. : Prescrire », elles se lisaient « Prescrire dit que » — exactement ce que D23 avait voulu
    # empêcher en les sortant du sujet grammatical des arguments. Elles restent CONSULTÉES et tracées
    # ici ; l'écran ne cite plus que des essais et des textes de recommandation officiels.
    # - nom: "Prescrire"
    # detail: "Fiche Diabète de type 2 : situe l'activité physique, avec les mesures diététiques, en 1er choix — sans revendiquer elle-même de bénéfice cardiovasculaire dur propre à l'exercice isolé."
    # - nom: "Médicalement Geek / DragiWebdo"
    # lien: "https://www.medicalement-geek.com/2017/12/dragi-webdo-n163.html"
    # detail: "Ligne éditoriale générale (EBM francophone, anti-sur-traitement) cohérente avec la position de ce nœud, sans source spécifique rattachée à une piste précise de cet axe."
  reco_officielle:
    source: "HAS 2024 · HAS 2022/2023 · Santé publique France · EBM Guidelines (Duodecim)"
    references:
      - nom: "HAS 2024"
        detail: "Stratégie thérapeutique du DT2, volet activité physique — R.16, R.19, R.24, R.25, R.27, R.28."
      - nom: "HAS 2022"
        detail: "Guide des connaissances sur l'activité physique et la sédentarité — repères OMS/HAS, principe « chaque pas compte », mise en garde contre le dogme des 10 000 pas."
      - nom: "HAS 2023"
        detail: "Parcours de soins Surpoids et obésité de l'adulte, Fiche 5 (enseignant en activité physique adaptée)."
      - nom: "Santé publique France"
        detail: "« 10 petites astuces anti-sédentarité », « Augmenter l'activité physique », « Réduire le temps passé assis »."
      - nom: "EBM Guidelines / Duodecim"
        detail: "Lifestyle education in type 2 diabetes — la régularité prédit le résultat à long terme (grade A)."
    position: >-
      Programme d'activité physique adaptée, d'endurance et de renforcement musculaire : 2 à 3 séances par
      semaine, trois mois renouvelables (accord d'experts). Repère de volume hebdomadaire pour la
      population générale : 150 à 300 minutes d'intensité modérée, sans volume minimal requis pour obtenir
      un bénéfice. Rupture de la sédentarité encouragée — au moins une minute toutes les heures (grade C).
      Orientation systématique vers les structures d'activité physique adaptée du territoire.
    divergence: true
    divergences:
      - sujet: "Les repères chiffrés comme objectif donné au patient"
        position_officielle: >-
          Les recommandations expriment les repères en valeurs chiffrées : minutes hebdomadaires, nombre
          de séances, nombre de pas.
        position_outil: >-
          L'outil ne les administre jamais comme objectif au patient. Ils restent en contexte, dans
          l'argumentaire ; aucune piste n'affiche de cible chiffrée.
        appui: >-
          Aucune donnée n'établit de seuil en dessous duquel il n'y aurait pas de bénéfice — les sources
          officielles l'écrivent elles-mêmes, et l'une d'elles met explicitement en garde contre le dogme
          du nombre de pas. Ce qui est démontré, c'est que la régularité prédit le résultat à long terme
          mieux que l'intensité ou que la perte de poids initiale (grade A). Un chiffre affiché
          transformerait une pratique en écart mesurable, là où la donnée ne soutient qu'une direction.
      - sujet: "Le bénéfice cardiovasculaire de l'exercice"
        position_officielle: >-
          L'activité physique est placée en première intention, avec les mesures diététiques, dans la prise
          en charge du diabète de type 2.
        position_outil: >-
          L'outil la propose tout autant, mais affiche explicitement qu'aucune de ses pistes ne porte de
          bénéfice démontré sur critère dur.
        appui: >-
          Aucun essai contrôlé d'exercice isolé dans le diabète de type 2 établi ne montre de bénéfice
          cardiovasculaire ou de mortalité : Look AHEAD, mené dans cette population, est neutre sur son
          critère primaire (HR 0,95, arrêt pour futilité) et sur la mortalité toutes causes. En amont du
          diabète, chez des sujets seulement à risque, le bras exercice seul de Da Qing n'atteint pas non
          plus la significativité. Ce que l'exercice améliore de façon documentée est un marqueur —
          environ 0,6 point d'HbA1c. Ce n'est pas un argument contre l'activité physique : c'est un refus
          de lui prêter une preuve qu'elle n'a pas.
    explication: >-
      Sur le fond, aucun désaccord : l'activité physique est utile, elle se propose à tous, et les
      structures d'activité physique adaptée sont la bonne orientation quand une limitation existe. Les
      deux écarts ci-dessus portent sur la forme du conseil et sur ce qu'on lui fait dire — pas sur son
      opportunité.
incertitudes:
  - "Aucune piste de ce nœud ne porte de bénéfice démontré sur critère dur. Look AHEAD est neutre sur son critère cardiovasculaire primaire et sur la mortalité toutes causes ; aucun essai contrôlé d'exercice isolé dans le diabète de type 2 établi n'en montre. C'est l'état de la preuve sur cet axe, pas une lacune de cette revue."
  - "Seuil de rupture de sédentarité : trois sources institutionnelles donnent trois repères différents pour le même geste — « au moins une minute toutes les heures » (grade C, retenu ici), « 4 à 5 minutes toutes les heures et demie » (non gradé), « minimum 1 à 5 minutes » (non gradé, assorti d'une réserve explicite sur la littérature internationale sous-jacente). Le repère le plus bas et le mieux gradé a été retenu ; les sources ne convergent pas."
  - "Le verrou de sécurité à l'effort bloque toute la famille « pratique structurée » dès qu'un signe est positif, y compris pour une neuropathie ou un mal perforant plantaire — alors que la contre-indication ne porte, à la source, que sur l'activité des membres inférieurs. Le nœud ne recueille pas de quoi qualifier chaque piste par segment corporel ; il énonce donc ce qui reste possible (activités des membres supérieurs, travail en décharge) par une alerte dédiée, plutôt que de filtrer plus finement. Sur-blocage assumé, du côté sûr."
  - "La magnitude retenue pour l'effet sur l'HbA1c — environ 0,6 point — vient d'essais courts (8 semaines à 12 mois) et de petits effectifs. Elle est cohérente d'une source à l'autre, mais aucun de ces essais n'était dimensionné pour observer une complication ou un décès : la durée du bénéfice au-delà d'un an n'est pas documentée par cette littérature."
