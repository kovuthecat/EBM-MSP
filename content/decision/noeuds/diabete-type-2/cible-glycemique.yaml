# Nœud A « Cible glycémique » — contenu VALIDÉ (T-007bis, ré-encodage post-2ᵉ passe ; révision
# 2026-07-26 : antecedent_cv ouvre désormais une route vers ≤ 8 %, risque_hypoglycemie_schema retiré
# du nœud — cf. changelog).
# Autorité : docs/decision/noeuds/A-cible-glycemique.md (dossier de preuve) + .verification-p2.md
# (double vérification indépendante) + .argumentaire.md (niveau 3). Ne pas modifier les valeurs
# cliniques hors workflow veille → algorithme (DECISIONS.md D5) ou revue de fond du comité.
id: cible-glycemique
domaine: diabete-type-2
titre: "Déterminer la cible d'HbA1c"
# `icone` ajouté 2026-08-05 (T-149, amélioration esthétique de l'écran de sélection des nœuds) — cible :
# ce nœud fixe un objectif chiffré, cf. `shared/icons/paths.ts`.
icone: cible
population_cible: "Adulte DT2 (hors DT1, grossesse, décompensation aiguë)."
selection: ordered-first-match
argumentaire_exhaustif: "cible-glycemique.argumentaire.md"
criteres_entree:
  - nom: age
    # `partage` ajouté le 2026-07-29 (recette référent, item F) : même concept, encodage IDENTIQUE
    # sur tous les nœuds qui le déclarent (type, valeurs, bornes) — condition de l'invariant I19.
    partage: true
    type: nombre
    min: 18
    max: 105
  - nom: anciennete_diabete_annees
    # `partage` ajouté le 2026-07-29 (recette référent, item F) : même concept, encodage IDENTIQUE
    # sur tous les nœuds qui le déclarent (type, valeurs, bornes) — condition de l'invariant I19.
    partage: true
    type: nombre
    min: 0
    max: 60
  - nom: esperance_vie
    # `partage` ajouté le 2026-07-29 (recette référent, item F) : même concept, encodage IDENTIQUE
    # sur tous les nœuds qui le déclarent (type, valeurs, bornes) — condition de l'invariant I19.
    partage: true
    type: enum
    valeurs: [longue, intermediaire, limitee]
  - nom: fragilite
    # `partage` ajouté le 2026-07-29 (recette référent, item F/point 5) : encodage désormais IDENTIQUE
    # sur tous les nœuds qui le déclarent (type, valeurs, bornes, presomption_non) — condition I19.
    partage: true
    type: bool
  - nom: antecedent_cv
    type: bool
    # T-018 (P4/S1, D30) : éligible mécaniquement à presomption_non (ne participe à aucune condition
    # d'option `role: securite` ni à aucune `exclusions` de ce nœud). `fragilite`, partagé avec 4 autres
    # nœuds DT2 où il EST disqualifié (`prescription`, `rhd-alimentation`), n'en reçoit pas — un critère
    # partagé garde un encodage unique (I4/S7).
    presomption_non: true
  - nom: comorbidite_grave
    type: bool
    presomption_non: true
options:
  - intitule: "Cible < 9 %"
    role: geste
    conditions:
      - "esperance_vie == limitee"
      - "fragilite == true OR comorbidite_grave == true"
    avantages:
      - "Évite l'hyperglycémie symptomatique tout en écartant le sur-traitement."
      - "Donne la priorité à la qualité de vie."
    inconvenients:
      - "Vise le confort, pas la prévention des complications (bénéfice non attendu à cet horizon)."
    effet_attendu: >-
      Non chiffrable : aucun essai n'a testé une cible aussi haute. Ce que les essais mesurent, c'est le
      coût du serrage inverse — l'hypoglycémie sévère est multipliée par 2 à 2,5 sous contrôle intensif
      (Boussageon : risque relatif 2,33 ; Turnbull/CONTROL : 2,48), sans réduction de la mortalité
      toutes causes (1,04, non significatif). C'est ce coût qu'une cible haute évite.
    delai_benefice: "immédiat pour le confort ; non établi pour toute prévention de complication"
    niveau_preuve: tres_faible
    references:
      - boussageon
      - turnbull-control
  - intitule: "Cible ≤ 8 %"
    role: geste
    conditions:
      - "fragilite == true OR comorbidite_grave == true OR esperance_vie == limitee OR antecedent_cv == true"
    avantages:
      - "Réduit le risque d'hypoglycémie sévère."
      - "Écarte le sur-traitement, dont le risque dépasse ici le bénéfice attendu."
    inconvenients:
      - "Moindre bénéfice microvasculaire à très long terme."
    effet_attendu: >-
      Chez le diabète installé, le serrage glycémique n'a démontré aucun bénéfice sur critère dur : la
      mortalité toutes causes n'est pas réduite (méta-analyses sur données individuelles : 1,04, non
      significatif). Ce qui est mesuré, c'est son coût — l'hypoglycémie sévère est multipliée par 2 à
      2,5 (Boussageon : risque relatif 2,33 ; Turnbull/CONTROL : 2,48). Dans ACCORD, mené chez des
      patients dont 35 % avaient une maladie cardiovasculaire, viser moins de 6 % (6,4 % atteint) a
      produit une surmortalité : rapport de risque 1,22, soit environ un décès supplémentaire pour
      100 patients en trois ans et demi.
    delai_benefice: "non établi — aucun essai n'a testé cette bande de cible, et aucun bénéfice sur critère dur n'est démontré chez le diabète installé"
    niveau_preuve: faible
    references:
      - accord
      - boussageon
      - turnbull-control
  - intitule: "Cible ~6,5 % (6,5–7 %)"
    role: geste
    conditions:
      - "age < 70"
      - "anciennete_diabete_annees < 5"
      - "esperance_vie == longue"
      - "antecedent_cv == false"
      - "comorbidite_grave == false"
      - "fragilite == false"
    # T-125 (P12/S5) : trois motifs sur les gardes booléens négatifs, non couverts jusqu'ici — sans eux
    # `describeReasons` retombait sur la traduction mécanique (« Antécédent cardiovasculaire : non »,
    # etc.), un « : non » de fin de phrase qui trahit la sérialisation plutôt qu'une raison clinique
    # (même défaut que celui relevé en recette sur `prescription.yaml`, cf. son changelog).
    motifs:
      "antecedent_cv == false": "Aucun antécédent cardiovasculaire"
      "comorbidite_grave == false": "Aucune comorbidité grave"
      "fragilite == false": "Patient non fragile"
    avantages:
      - "Bénéfice microvasculaire, à condition que la cible soit atteinte sans hypoglycémie."
      - "Seule situation où un bénéfice différé sur l'infarctus et la mortalité a été observé, dans le suivi prolongé d'UKPDS."
    inconvenients:
      - "Aucun bénéfice de mortalité démontré à court terme."
      - "Ne vaut que si la cible est atteinte sans hypoglycémie : sous sulfamide ou sous insuline, c'est le traitement qu'il faut revoir avant l'objectif."
    effet_attendu: >-
      Gain surtout microvasculaire, et sur des critères de substitution : dans ADVANCE, 6,5 % contre
      7,3 % réduit le composite macrovasculaire et microvasculaire (rapport de risque 0,90), un gain
      porté par la néphropathie, sans effet sur la mortalité. Bénéfice différé sur critère dur : dans
      UKPDS, chez des patients nouvellement diagnostiqués, le suivi prolongé au-delà de l'essai montre
      13 % de mortalité toutes causes en moins et 15 % d'infarctus du myocarde en moins — non retrouvés
      chez le diabète ancien (VADT à 15 ans, ADVANCE-ON). Contrepartie mesurée : hypoglycémie sévère
      plus fréquente sous contrôle intensif (ADVANCE : rapport de risque 1,86).
    delai_benefice: "10 ans d'essai pour le bénéfice microvasculaire (UKPDS) ; au-delà pour la mortalité et l'infarctus, apparus seulement dans le suivi prolongé"
    niveau_preuve: faible
    references:
      - advance
      - ukpds-80
      - vadt
    contre_indications:
      - texte: "Antécédent cardiovasculaire établi"
        condition: "antecedent_cv == true"
      - "Traitement exposant à l'hypoglycémie (sulfamide, insuline)"
      - "Rétinopathie préexistante : éviter une baisse rapide de l'HbA1c (risque d'aggravation)"
  - intitule: "Cible ≤ 7 %"
    role: repli
    conditions:
      - "default"
    # Motif du repli (clé sentinelle réservée `default`, P10 post-S5) : SEULE la partie universellement
    # vraie pour quiconque atteint ce repli est affirmée — ni fragilité, ni comorbidité grave, ni
    # antécédent CV, ni espérance de vie limitée (sinon une des trois options ci-dessus aurait mordu).
    # « espérance de vie longue » n'y figure PAS : un patient à espérance de vie « intermédiaire »
    # atteint aussi ce repli, tout comme un patient à espérance de vie longue mais ancienneté ≥ 5 ans ou
    # âge ≥ 70 ans (cas réel de la vignette N2, Mme Lantier) — l'affirmer aurait dit plus que la branche.
    motifs:
      "default": "ni fragilité, ni comorbidité grave, ni antécédent cardiovasculaire, ni espérance de vie limitée : situation intermédiaire, en dehors des critères qui feraient basculer vers une cible plus prudente (< 9 % ou ≤ 8 %) ou plus stricte (~6,5 %)"
    avantages:
      - "Compromis pour la majorité des patients : c'est la cible par défaut des recommandations françaises comme internationales."
    inconvenients:
      - "Ni la mortalité ni les événements macrovasculaires durs ne sont réduits par le seul serrage glycémique."
    effet_attendu: >-
      Sur l'ensemble des essais de contrôle intensif, le seul gain est l'infarctus du myocarde non
      fatal, réduit d'environ 15 % en relatif (Turnbull/CONTROL et Boussageon donnent 0,85 l'un et
      l'autre) ; le bénéfice absolu reste modeste. La mortalité toutes causes n'est pas réduite (1,04,
      non significatif) et l'accident vasculaire cérébral non plus. En regard, l'hypoglycémie sévère est
      multipliée par 2 à 2,5.
    delai_benefice: "3 ans et demi à 10 ans — durée des grands essais de contrôle glycémique (ACCORD arrêté à trois ans et demi, UKPDS suivi 10 ans)"
    niveau_preuve: faible
    references:
      - turnbull-control
      - boussageon
# P10/S5 (T-082) : premier `cadrage` de ce nœud, patron `statine`/`insuline`. Périmètre relevé par la
# recette référent — un périmètre ASSUMÉ, pas un défaut : ce nœud répond à « quelle cible viser », jamais
# à « où en est ce patient par rapport à elle » (c'est `prescription`, via `position_vs_cible`/
# `hba1c_sous_cible`, qui porte cette confrontation). Rien n'était écrit nulle part pour le dire.
# LISTE À VALIDER PAR LE RÉFÉRENT (cf. bilan de session).
cadrage:
  - >-
    Cet écran fixe la cible d'HbA1c à viser ; il ne confronte jamais cette cible à l'HbA1c réelle du patient
    (l'écart à l'objectif, le constat d'échec ou de réussite du traitement en cours) — cette lecture relève
    de « Traiter ». Il ne dit rien non plus du délai auquel réévaluer la cible fixée.
  # Volet « choix de l'outil » de l'incertitude sur l'ancienneté du diabète : l'entrée `incertitudes`
  # correspondante ne porte plus que ce que la DONNÉE ne tranche pas, ce qui relève de la conduite de
  # l'outil est ici.
  - >-
    Une ancienneté de diabète élevée ne suffit pas, à elle seule, à relâcher la cible proposée : elle
    n'agit ici qu'en réservant la cible la plus stricte aux diabètes qui évoluent depuis moins de cinq
    ans. Un relâchement à ≤ 8 % demande un autre motif — fragilité, comorbidité grave, antécédent
    cardiovasculaire ou espérance de vie limitée.
argumentaire: >
  Aucun essai n'a comparé des bandes de cible étroites : les seuils affichés sont extrapolés. C'est cela
  que gradue le badge de preuve — la certitude sur le chiffre visé, non la solidité de l'individualisation,
  qui ne fait pas débat. Chez le diabète installé, serrer la glycémie n'apporte ni bénéfice de mortalité ni
  bénéfice macrovasculaire dur ; seul l'infarctus non fatal baisse, au prix d'une hypoglycémie sévère
  multipliée par 2 à 2,5. Le bénéfice microvasculaire est réel, mais surtout de substitution. Le bénéfice
  différé sur la mortalité n'a été observé que chez le sujet jeune récemment diagnostiqué, jamais chez le
  diabète ancien. D'où quatre bandes, du plus strict au plus prudent : ~6,5 % quand ce bénéfice différé est
  plausible et le risque hypoglycémique faible ; ≤ 7 % par défaut ; ≤ 8 %, puis < 9 %, quand la fragilité,
  la comorbidité grave, l'antécédent cardiovasculaire ou l'espérance de vie limitée prennent le pas. Garde-fou : une baisse rapide de l'HbA1c peut aggraver une rétinopathie préexistante.
sources:
  references_primaires:
    - id: accord
      titre: "ACCORD"
      annee: 2008
      type_critere: dur
      lien: "https://doi.org/10.1056/NEJMoa0802743"
    - id: advance
      titre: "ADVANCE (+ ADVANCE-ON 2014)"
      annee: 2008
      type_critere: mixte
      lien: "https://doi.org/10.1056/NEJMoa0802987"
    - id: vadt
      titre: "VADT (+ suivi 15 ans, 2019)"
      annee: 2009
      type_critere: dur
      lien: "https://doi.org/10.1056/NEJMoa0808431"
    - id: ukpds-80
      titre: "UKPDS 80 (effet legacy)"
      annee: 2008
      type_critere: mixte
      lien: "https://doi.org/10.1056/NEJMoa0806470"
    - id: ukpds-35-stratton
      titre: "UKPDS 35 — Stratton (épidémiologique)"
      annee: 2000
      type_critere: substitution
      lien: "https://doi.org/10.1136/bmj.321.7258.405"
    - id: turnbull-control
      titre: "Turnbull / CONTROL (méta-analyse sur données individuelles)"
      annee: 2009
      type_critere: dur
      lien: "https://doi.org/10.1007/s00125-009-1470-0"
    - id: boussageon
      titre: "Boussageon (méta-analyse BMJ)"
      annee: 2011
      type_critere: dur
      lien: "https://doi.org/10.1136/bmj.d4169"
    - id: cochrane-hemmingsen
      titre: "Cochrane (Hemmingsen) — revue retirée en 2015 pour conflit d'intérêts non déclaré, résultats non invalidés"
      annee: 2013
      type_critere: dur
      lien: "https://doi.org/10.1002/14651858.CD008143.pub3"
  synthese_critique:
    donnee: >-
      Aucun essai n'a comparé de bandes de cible étroites : les seuils fins sont extrapolés. Sous contrôle
      intensif, le risque d'hypoglycémie sévère double à triple (Boussageon 2011 : risque relatif 2,33),
      sans bénéfice de mortalité démontré chez le diabète installé. ACCORD a montré une surmortalité
      inexpliquée au serrage agressif (rapport de risque 1,22, pour 6,4 % contre 7,5 %) là où ADVANCE
      atteignait 6,5 % sans surmortalité. D'où une cible plus prudente : viser environ 7 % les premières
      années, puis environ 7,5 % ; relâcher entre 7,5 et 8,5 %, voire entre 8 et 9 %, chez le sujet âgé ou
      fragile, en cas de complication vasculaire majeure, d'affection grave associée ou d'espérance de vie
      inférieure à 5 ans ; envisager d'alléger le traitement si l'HbA1c descend sous 6,5 % sous agent
      hypoglycémiant. Le sujet jeune, récemment diagnostiqué et sans maladie cardiovasculaire fait
      exception. Individualiser plutôt qu'appliquer une bande unique : l'objectif est d'éviter le
      sur-traitement, pas de faire baisser l'HbA1c en soi.
    appuis:
      - accord
      - advance
      - boussageon
      - ukpds-80
      - turnbull-control
    # REVUES SECONDAIRES CONSULTÉES — retirées de l'écran le 2026-08-04 (le champ
    # `synthese_critique.references` n'existe plus au schéma). Motif : rendues sous la position comme
    # « Réf. : Prescrire », elles se lisaient « Prescrire dit que » — exactement ce que D23 avait voulu
    # empêcher en les sortant du sujet grammatical des arguments. Elles restent CONSULTÉES et tracées
    # ici ; l'écran ne cite plus que des essais et des textes de recommandation officiels.
    # - nom: "Prescrire"
    # detail: "« Diabète de type 2 chez un adulte » (Premiers Choix, févr 2026) ; « Quand la metformine ne suffit pas » (Rev Prescrire 2023;43(478):595-605) — résumé, droit d'auteur."
    # - nom: "Médicalement Geek / DragiWebdo"
    # lien: "https://www.medicalement-geek.com/p/diabetologie.html"
  reco_officielle:
    source: "HAS 2024 · ADA Standards of Care · ACP 2018"
    references:
      - nom: "HAS 2024"
        detail: "Stratégie thérapeutique du DT2 (RBP validée le 30/05/2024), Annexe 3 — les cibles de 2013 sont maintenues."
      - nom: "ADA"
        detail: "Standards of Care in Diabetes, section « Glycemic Goals », édition en cours."
      - nom: "ACP 2018"
        detail: "Guidance statement — bande cible 7 à 8 % chez la plupart des adultes."
    position: "Individualisée : ≤ 7 % pour la plupart ; ≤ 6,5 % si diabète récent, espérance de vie > 15 ans et sans maladie cardiovasculaire ; ≤ 8 % en cas de comorbidité grave, d'espérance de vie limitée ou de complication macrovasculaire évoluée ; < 9 % chez le sujet âgé dépendant."
    divergence: true
    divergences:
      - sujet: "Le seuil de 6,5 % chez le sujet jeune sans maladie cardiovasculaire"
        position_officielle: >-
          La HAS recommande une cible ≤ 6,5 % pour ce profil : diabète récent, espérance de vie longue,
          pas de maladie cardiovasculaire.
        position_outil: >-
          L'outil vise plutôt ~7 % pour le même patient, et propose d'alléger le traitement en dessous de
          6,5 % sous agent hypoglycémiant.
        appui: >-
          Sous contrôle intensif, le risque d'hypoglycémie sévère double à triple (Boussageon 2011 :
          risque relatif 2,33), sans bénéfice de mortalité démontré chez le diabète installé. ACCORD a
          montré une surmortalité inexpliquée au serrage agressif (rapport de risque 1,22, pour 6,4 %
          contre 7,5 %) là où ADVANCE atteignait 6,5 % sans surmortalité. Aucun essai n'ayant comparé des
          bandes de cible étroites, la différence entre 6,5 et 7 % relève d'une extrapolation des deux
          côtés — l'outil choisit celle qui expose le moins.
    explication: >-
      Les deux lectures s'accordent sur l'essentiel : l'HbA1c est un critère intermédiaire et non une fin,
      la cible s'individualise, et le sur-traitement est le risque principal. La HAS elle-même reconnaît
      l'absence de lien démontré entre la baisse de l'HbA1c et la morbi-mortalité. L'écart ne porte donc
      pas sur la logique, mais sur un seul chiffre, dans un seul profil.
incertitudes:
  - "Cible optimale exacte : aucune bande étroite n'a été testée en essai randomisé."
  - "Mécanisme de la surmortalité d'ACCORD : inexpliqué, l'hypoglycémie ayant été écartée par les analyses."
  - >-
    Transposabilité aux traitements d'aujourd'hui : les essais de contrôle glycémique sont antérieurs à la
    diffusion des agonistes du récepteur du GLP-1 et des inhibiteurs de SGLT2, qui réduisent la mortalité
    cardiovasculaire et rénale indépendamment de l'HbA1c.
  - "Valeur du temps passé dans la cible glycémique, mesuré en continu, sur les critères durs."
  - >-
    Effet propre de l'ancienneté du diabète, indépendamment des hypoglycémies : aucun essai ne l'a testée
    seule comme critère de relâchement de la cible, et la table officielle ne l'associe à une cible plus
    haute qu'en présence d'hypoglycémies.
veille_liee: []
