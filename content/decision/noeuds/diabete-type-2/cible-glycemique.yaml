# Nœud A « Cible glycémique » — contenu VALIDÉ (T-007bis, ré-encodage post-2ᵉ passe ; révision
# 2026-07-26 : antecedent_cv ouvre désormais une route vers ≤ 8 %, risque_hypoglycemie_schema retiré
# du nœud — cf. changelog).
# Autorité : docs/decision/noeuds/A-cible-glycemique.md (dossier de preuve) + .verification-p2.md
# (double vérification indépendante) + .argumentaire.md (niveau 3). Ne pas modifier les valeurs
# cliniques hors workflow veille → algorithme (DECISIONS.md D5) ou revue de fond du comité.
id: cible-glycemique
domaine: diabete-type-2
titre: "Fixer la cible d'HbA1c"
population_cible: "Adulte DT2, hors grossesse, hors DT1, hors décompensation aiguë."
selection: ordered-first-match
argumentaire_exhaustif: "cible-glycemique.argumentaire.md"
criteres_entree:
  - nom: age
    # `partage` ajouté le 2026-07-29 (recette référent, item F) : même concept, encodage IDENTIQUE
    # sur tous les nœuds qui le déclarent (type, valeurs, bornes) — condition de l'invariant I19.
    partage: true
    type: nombre
    min: 18
    max: 105
  - nom: anciennete_diabete_annees
    # `partage` ajouté le 2026-07-29 (recette référent, item F) : même concept, encodage IDENTIQUE
    # sur tous les nœuds qui le déclarent (type, valeurs, bornes) — condition de l'invariant I19.
    partage: true
    type: nombre
    min: 0
    max: 60
  - nom: esperance_vie
    # `partage` ajouté le 2026-07-29 (recette référent, item F) : même concept, encodage IDENTIQUE
    # sur tous les nœuds qui le déclarent (type, valeurs, bornes) — condition de l'invariant I19.
    partage: true
    type: enum
    valeurs: [longue, intermediaire, limitee]
  - nom: fragilite
    # `partage` ajouté le 2026-07-29 (recette référent, item F/point 5) : encodage désormais IDENTIQUE
    # sur tous les nœuds qui le déclarent (type, valeurs, bornes, presomption_non) — condition I19.
    partage: true
    type: bool
  - nom: antecedent_cv
    type: bool
    # T-018 (P4/S1, D30) : éligible mécaniquement à presomption_non (ne participe à aucune condition
    # d'option `role: securite` ni à aucune `exclusions` de ce nœud). `fragilite`, partagé avec 4 autres
    # nœuds DT2 où il EST disqualifié (`prescription`, `rhd-alimentation`), n'en reçoit pas — un critère
    # partagé garde un encodage unique (I4/S7).
    presomption_non: true
  - nom: comorbidite_grave
    type: bool
    presomption_non: true
options:
  - intitule: "Cible < 9 %"
    role: geste
    conditions:
      - "esperance_vie == limitee"
      - "fragilite == true OR comorbidite_grave == true"
    avantages:
      - "Évite l'hyperglycémie symptomatique et le sur-traitement en fin de vie ; priorité à la qualité de vie."
    inconvenients:
      - "Vise le confort, pas la prévention des complications (bénéfice non attendu à cet horizon)."
    effet_attendu: "non chiffrable"
    niveau_preuve: tres_faible
  - intitule: "Cible ≤ 8 %"
    role: geste
    conditions:
      - "fragilite == true OR comorbidite_grave == true OR esperance_vie == limitee OR antecedent_cv == true"
    avantages:
      - "Réduit le risque d'hypoglycémie sévère ; adapté au sujet fragile, à comorbidité grave (maladie cardiovasculaire évoluée, IRC sévère) ou à antécédent cardiovasculaire établi."
    inconvenients:
      - "Moindre bénéfice microvasculaire à très long terme."
    effet_attendu: "Pas de bénéfice dur démontré à cet horizon ; bénéfice principal = réduction du risque hypoglycémique (fragile, comorbidité grave) et prudence chez l'antécédent cardiovasculaire établi (ACCORD : surmortalité sous contrôle intensif dans une population à ~35 % de maladie CV)."
    niveau_preuve: faible
  - intitule: "Cible ~6,5 % (6,5–7 %)"
    role: geste
    conditions:
      - "age < 70"
      - "anciennete_diabete_annees < 5"
      - "esperance_vie == longue"
      - "antecedent_cv == false"
      - "comorbidite_grave == false"
      - "fragilite == false"
    # T-125 (P12/S5) : trois motifs sur les gardes booléens négatifs, non couverts jusqu'ici — sans eux
    # `describeReasons` retombait sur la traduction mécanique (« Antécédent cardiovasculaire : non »,
    # etc.), un « : non » de fin de phrase qui trahit la sérialisation plutôt qu'une raison clinique
    # (même défaut que celui relevé en recette sur `prescription.yaml`, cf. son changelog).
    motifs:
      "antecedent_cv == false": "Aucun antécédent cardiovasculaire"
      "comorbidite_grave == false": "Aucune comorbidité grave"
      "fragilite == false": "Patient non fragile"
    avantages:
      - "Bénéfice microvasculaire et effet legacy (IDM/mortalité différés, profil UKPDS du sujet jeune) si atteint sans hypoglycémie."
    inconvenients:
      - "Aucun bénéfice de mortalité prouvé à court terme ; risque si atteint par sulfamide/insuline."
    effet_attendu: "Gain surtout microvasculaire (substitution) ; bénéfice dur différé (legacy) chez le sujet jeune récemment diagnostiqué."
    niveau_preuve: faible
    contre_indications:
      - texte: "Antécédent cardiovasculaire établi"
        condition: "antecedent_cv == true"
      - "Schéma à risque d'hypoglycémie"
      - "Rétinopathie préexistante : éviter une baisse rapide de l'HbA1c (risque d'aggravation)"
  - intitule: "Cible ≤ 7 %"
    role: repli
    conditions:
      - "default"
    # Motif du repli (clé sentinelle réservée `default`, P10 post-S5) : SEULE la partie universellement
    # vraie pour quiconque atteint ce repli est affirmée — ni fragilité, ni comorbidité grave, ni
    # antécédent CV, ni espérance de vie limitée (sinon une des trois options ci-dessus aurait mordu).
    # « espérance de vie longue » n'y figure PAS : un patient à espérance de vie « intermédiaire »
    # atteint aussi ce repli, tout comme un patient à espérance de vie longue mais ancienneté ≥ 5 ans ou
    # âge ≥ 70 ans (cas réel de la vignette N2, Mme Lantier) — l'affirmer aurait dit plus que la branche.
    motifs:
      "default": "ni fragilité, ni comorbidité grave, ni antécédent cardiovasculaire, ni espérance de vie limitée : situation intermédiaire, en dehors des critères qui feraient basculer vers une cible plus prudente (< 9 % ou ≤ 8 %) ou plus stricte (~6,5 %)"
    avantages:
      - "Compromis pour la majorité des patients."
    inconvenients:
      - "Bénéfice macrovasculaire/mortalité non démontré par le seul serrage glycémique."
    effet_attendu: "Réduction de l'IDM non fatal (méta-analyses), pas de la mortalité ; bénéfice absolu modeste."
    niveau_preuve: faible
# P10/S5 (T-082) : premier `cadrage` de ce nœud, patron `statine`/`insuline`. Périmètre relevé par la
# recette référent — un périmètre ASSUMÉ, pas un défaut : ce nœud répond à « quelle cible viser », jamais
# à « où en est ce patient par rapport à elle » (c'est `prescription`, via `position_vs_cible`/
# `hba1c_sous_cible`, qui porte cette confrontation). Rien n'était écrit nulle part pour le dire.
# LISTE À VALIDER PAR LE RÉFÉRENT (cf. bilan de session).
cadrage:
  - >-
    Ce nœud fixe la cible d'HbA1c à viser ; il ne confronte jamais cette cible à l'HbA1c réelle du patient
    (l'écart à l'objectif, le constat d'échec ou de réussite du traitement en cours) — cette lecture relève
    du nœud « Traiter ». Il ne dit rien non plus du délai auquel réévaluer la cible fixée.
argumentaire: >
  Aucun ECR n'a comparé des bandes de cible étroites : les seuils sont extrapolés. Chez le diabète
  établi (ACCORD, ADVANCE, VADT), le contrôle intensif n'apporte pas de bénéfice de mortalité ni
  macrovasculaire dur ; seul l'IDM non fatal est modestement réduit, au prix d'un risque
  d'hypoglycémie sévère multiplié par ~2 à 2,5. ACCORD (6,4 vs 7,5 %) a montré une surmortalité
  (HR 1,22) dont le mécanisme reste inexpliqué ; ADVANCE a atteint 6,5 % sans surmortalité, ce qui
  suggère — sans le démontrer, comparaison indirecte — que le danger tient à une stratégie de serrage
  agressive plutôt qu'au niveau atteint. Le bénéfice microvasculaire est robuste mais surtout de
  substitution ; l'effet legacy (mortalité/IDM différés) n'est établi que dans le profil UKPDS (sujet
  jeune, diabète récent), non répliqué chez le diabète installé (VADT à 15 ans, ADVANCE-ON). D'où une
  cible individualisée : ~6,5 % réservée au sujet jeune récemment diagnostiqué, sans maladie
  cardiovasculaire et sans risque hypoglycémique ; ≤7 % par défaut ; relâchement (≤8 %, voire <9 %)
  chez le fragile, la comorbidité grave ou l'espérance de vie limitée. Garde-fou : une baisse rapide
  de l'HbA1c peut aggraver une rétinopathie préexistante.
sources:
  references_primaires:
    - id: accord
      titre: "ACCORD"
      annee: 2008
      type_critere: dur
      lien: "https://doi.org/10.1056/NEJMoa0802743"
    - id: advance
      titre: "ADVANCE (+ ADVANCE-ON 2014)"
      annee: 2008
      type_critere: mixte
      lien: "https://doi.org/10.1056/NEJMoa0802987"
    - id: vadt
      titre: "VADT (+ suivi 15 ans, 2019)"
      annee: 2009
      type_critere: dur
      lien: "https://doi.org/10.1056/NEJMoa0808431"
    - id: ukpds-80
      titre: "UKPDS 80 (effet legacy)"
      annee: 2008
      type_critere: mixte
      lien: "https://doi.org/10.1056/NEJMoa0806470"
    - id: ukpds-35-stratton
      titre: "UKPDS 35 — Stratton (épidémiologique)"
      annee: 2000
      type_critere: substitution
      lien: "https://doi.org/10.1136/bmj.321.7258.405"
    - id: turnbull-control
      titre: "Turnbull / CONTROL (méta-analyse sur données individuelles)"
      annee: 2009
      type_critere: dur
      lien: "https://doi.org/10.1007/s00125-009-1470-0"
    - id: boussageon
      titre: "Boussageon (méta-analyse BMJ)"
      annee: 2011
      type_critere: dur
      lien: "https://doi.org/10.1136/bmj.d4169"
    - id: cochrane-hemmingsen
      titre: "Cochrane (Hemmingsen) — RETIRÉE 2015 (COI non déclaré) ; résultats non invalidés"
      annee: 2013
      type_critere: dur
      lien: "https://doi.org/10.1002/14651858.CD008143.pub3"
  synthese_critique:
    donnee: >-
      Aucun essai n'a comparé de bandes de cible étroites (extrapolation) : le risque d'hypoglycémie
      sévère double à triple sous contrôle intensif (Boussageon, méta-analyse BMJ 2011, RR ~2,3) sans
      bénéfice de mortalité démontré chez le diabète installé, et ACCORD a montré une surmortalité
      inexpliquée au serrage agressif (HR 1,22, 6,4 vs 7,5 %) quand ADVANCE a atteint 6,5 % sans
      surmortalité — d'où une cible plus prudente : viser ≈ 7 % les premières années puis ≈ 7,5 %,
      avec relâchement (7,5-8,5 %, voire 8-9 %) chez l'âgé/fragile, la complication vasculaire majeure,
      l'affection grave associée ou l'espérance de vie < 5 ans, et une déprescription envisagée si
      HbA1c < 6,5 % sous agent hypoglycémiant — hors du profil UKPDS (sujet jeune, diabète récent,
      sans maladie cardiovasculaire). Individualiser plutôt qu'appliquer une bande unique ; éviter le
      sur-traitement reste l'objectif, pas la baisse d'HbA1c en soi.
    references:
      - nom: "Prescrire"
        detail: "« Diabète de type 2 chez un adulte » (Premiers Choix, févr 2026) ; « Quand la metformine ne suffit pas » (Rev Prescrire 2023;43(478):595-605) — résumé, droit d'auteur."
      - nom: "Médicalement Geek / DragiWebdo"
        lien: "https://www.medicalement-geek.com/p/diabetologie.html"
  reco_officielle:
    source: "HAS 2024 (Stratégie thérapeutique du DT2, Annexe 3 — cibles 2013 maintenues) ; ADA Standards of Care ; ACP 2018"
    position: "Individualisée : ≤7 % (la plupart) ; ≤6,5 % si récent, EV>15 ans, sans MCV ; ≤8 % comorbidité grave / EV limitée / macro évoluée ; <9 % âgé dépendant"
    divergence: true
    explication: >-
      Convergence forte sur les principes (HbA1c = critère intermédiaire, individualisation,
      anti-sur-traitement — la HAS reconnaît l'absence de lien démontré entre baisse de l'HbA1c et
      morbi-mortalité). Divergence sur le seuil ~6,5 % : recommandé par la HAS pour le profil jeune
      sans MCV ; une lecture plus prudente (Boussageon, méta-analyse BMJ 2011, RR d'hypoglycémie
      sévère ~2,3 sous contrôle intensif ; ACCORD, surmortalité inexpliquée HR 1,22) vise plutôt ~7 %,
      voire une déprescription sous 6,5 %.
incertitudes:
  - "Cible optimale exacte (aucune bande étroite testée en ECR)."
  - "Mécanisme de la surmortalité d'ACCORD (inexpliqué)."
  - "Transposabilité à l'ère des GLP-1 RA / iSGLT2 (essais pré-2015)."
  - >-
    Le rôle de l'ancienneté du diabète prise ISOLÉMENT (> 10 ans, sans autre facteur) sur l'assouplissement
    de la cible reste incertain : cet outil ne l'utilise pas seule pour relâcher la cible à ≤ 8 % — position
    prudente, cohérente avec la HAS, qui elle non plus n'associe l'ancienneté à un relâchement de cible qu'en
    présence d'hypoglycémies, jamais isolément (cf. `argumentaire`, tableau HAS), et avec la même exigence
    retenue pour la statine (l'ancienneté seule n'y suffit pas non plus, il faut aussi une atteinte d'organe).
    `anciennete_diabete_annees` continue d'agir ailleurs dans ce nœud (borne stricte ~6,5 % via `< 5 ans`).
    Aucun essai ne teste directement l'ancienneté isolée comme critère de relâchement de cible : le choix
    reste donc prudent plutôt que définitivement validé par la preuve.
veille_liee: []
