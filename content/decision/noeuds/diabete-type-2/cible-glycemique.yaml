        le code (`OptionCard.tsx` l.289 passe pourtant bien `option.motifs`, mais `reasons` vaut
        littéralement `['default']` pour cette option, jamais transformé en branche par
        `raisonsSituationnelles`/`termesVrais`, cf. `vueDecision.ts` `estSentinelle`). Le mécanisme de
        motifs livré par S2 ne permet donc PAS à une option de repli de porter son propre texte : **STOP**
        signalé (petite extension de S2 nécessaire dans `conditionText.ts::describeReasons`, hors périmètre
