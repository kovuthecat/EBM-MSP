    - date: "2026-08-05"
      auteur: "Claude Code (T-149)"
      resume: >-
        Ajout de `icone: cible` — purement esthétique (écran de sélection des nœuds), aucune
        `conditions`/`prerequis`/`exclusions`/`priorite`/critère touchés. Ne remet pas en cause le
        `statut: valide` du nœud.
    - date: "2026-08-05"
      auteur: "Claude Code — en attente de relecture clinique"
      resume: >-
        PASSE DE RÉDACTION SUR LES QUATRE NIVEAUX DE LECTURE (aucune `conditions`/`prerequis`/
        `exclusions`/`priorite`/`role`/`famille`/`niveau_preuve` touchée, aucune clé de `motifs`
        modifiée, aucun critère d'entrée touché). (1) PANNEAU « ÉTAT DES PREUVES » : les quatre options
        reçoivent enfin des `references` (ids déjà présents dans `sources.references_primaires`) — la
        ligne « D'après : » était vide sur les quatre cartes. « Cible < 9 % » et « Cible ≤ 7 % » citent
        Boussageon et Turnbull/CONTROL ; « Cible ≤ 8 % » y ajoute ACCORD ; « Cible ~6,5 % » cite ADVANCE,
        UKPDS 80 et VADT. (2) Les quatre `effet_attendu` sont réécrits sur ce que les essais ont MESURÉ
        (chiffre, population, comparateur) : « non chiffrable » nu sur « < 9 % » devenait un panneau
        vide, et celui de « ≤ 8 % » mélangeait la mesure et la justification du déclencheur, déjà rendue
        par « Proposé parce que ». Aucun chiffre nouveau : tous proviennent de l'argumentaire exhaustif.
        (3) Les quatre options reçoivent un `delai_benefice`, absent jusqu'ici (R2). (4) `avantages` de
        « ≤ 8 % » : l'énumération « fragile, comorbidité grave, antécédent cardiovasculaire » recopiait
        les quatre branches de sa condition — retirée (R6). Une idée par puce sur les quatre cartes.
        (5) `argumentaire` resserré de 191 à ~150 mots : il porte la LOGIQUE de hiérarchisation, le
        détail d'essai (rapport de risque 1,22, 6,4 contre 7,5 %, ADVANCE à 6,5 %) restant à l'argumentaire
        exhaustif, où il figure déjà. Une phrase y dit ce que gradue le badge de preuve : la certitude sur
        le chiffre visé, non la solidité de la démarche d'individualisation. (6) `incertitudes` : la
        dernière entrée parlait de l'outil et citait un nom de champ et une expression de règle — réécrite
        sur la donnée seule ; ce qui relève de la conduite de l'outil descend en `cadrage` (2ᵉ position de
        lecture ajoutée). Ajout de l'incertitude sur le temps passé dans la cible, qui figurait à l'exhaustif
        et manquait ici ; sigles développés. (7) `synthese_critique.donnee` et `divergences[0].appui` :
        phrases de plus de 100 mots scindées, sigles remplacés par leur forme française. (8) Titre de la
        référence Cochrane : capitales d'emphase et sigle non développé remplacés par une phrase lisible.
        (9) Argumentaire exhaustif : mention de statut de travail retirée en tête ; les deux marqueurs de
        vérification en attente et le renvoi à un chemin de dépôt retirés (chiffres jamais présents, donc
        aucune perte) ; la note finale ne conserve que la réserve utile au lecteur (les nombres de patients
