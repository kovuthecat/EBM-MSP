        nœud (cible fixée dans l'absolu, jamais confrontée à l'HbA1c réelle du patient — c'est
        `prescription` qui porte cette confrontation ; rien non plus sur le délai de réévaluation) — liste
        À VALIDER PAR LE RÉFÉRENT. Aucune `condition`/`exclusions`/`priorite` ni statut d'option modifié.
