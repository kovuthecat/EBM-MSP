        `conditions`/`exclusions`/`priorite` ni statut d'option modifié.
    - date: "2026-07-31"
      auteur: "Claude Code (P10/S5, T-082) — en attente de relecture référent"
      resume: >-
        Inventaire des 13 branches non-repli des 4 options (3 sur « Cible < 9 % », 4 sur « Cible ≤ 8 % »,
        6 sur « Cible ~6,5 % ») : toutes déjà lisibles telles quelles (même registre que les exemples
        cités par S3, « IMC ≥ 30 » ; le nœud est déjà décrit comme la meilleure recette du domaine). Aucun
