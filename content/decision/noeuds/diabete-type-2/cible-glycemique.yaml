        générique (STOP de S5 levé, cf. entrée précédente) ; clé sentinelle `default` documentée dans le
        schéma. Motif rédigé sur le repli « Cible ≤ 7 % » : SEULE la partie universellement vraie pour
        quiconque atteint ce repli est affirmée (ni fragilité, ni comorbidité grave, ni antécédent CV, ni
