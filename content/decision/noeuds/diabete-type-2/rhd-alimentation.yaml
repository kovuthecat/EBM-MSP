    # - nom: "Médicalement Geek / DragiWebdo"
    # lien: "https://www.medicalement-geek.com/2017/12/dragi-webdo-n163.html"
    # detail: "Couverture générale de l'intervention de perte de poids en soins primaires (DiRECT, régime méditerranéen), pas une synthèse dédiée aux gestes alimentaires de ce nœud."
  reco_officielle:
    source: "HAS 2024/2023 · SFD 2025 · Santé publique France (PNNS) · EBM Guidelines (Duodecim)"
    references:
      - nom: "HAS 2024"
        detail: "Stratégie thérapeutique du DT2, volet nutrition — R.30 à R.38."
      - nom: "HAS 2023"
        detail: "Parcours de soins Surpoids et obésité de l'adulte — non-culpabilisation, « la stabilisation du poids est déjà un succès »."
      - nom: "HAS 2019"
        detail: "Fiche de repérage des troubles du comportement alimentaire — recherche systématique d'une hyperphagie boulimique en situation de surpoids ou d'obésité. Population cible déclarée : les jeunes, en particulier adolescentes et jeunes femmes."
      - nom: "SFD 2025"
        detail: "Prise de position, §8.7 et Avis n° 15 — périmètre MASLD/MASH, et non une recommandation générale du DT2 sur ce point."
      - nom: "Santé publique France / PNNS"
        detail: "« 50 petites astuces… », guides Manger-Bouger — repères de population générale."
      - nom: "USPSTF 2022"
        detail: "Dépistage des troubles du comportement alimentaire chez l'adolescent et l'adulte sans signe ni symptôme : preuves INSUFFISANTES pour évaluer la balance bénéfices-risques (I statement)."
      - nom: "EBM Guidelines / Duodecim"
        detail: "Lifestyle education in type 2 diabetes, gradé selon la section."
    position: >-
      Alimentation de type méditerranéen en première ligne, avec des repères chiffrés destinés à la
      population générale — au moins 5 fruits et légumes par jour, du poisson 2 fois par semaine dont 1
      gras, des légumineuses au moins 2 fois par semaine, une petite poignée de fruits à coque par jour,
      moins de boissons sucrées et de produits ultratransformés. Insistance sur la non-culpabilisation et
      sur l'évitement des régimes restrictifs rigides.
    divergence: true
    divergences:
      - sujet: "Les repères chiffrés comme objectif donné au patient"
        position_officielle: >-
          Les repères nutritionnels sont exprimés en valeurs chiffrées, quotidiennes ou hebdomadaires.
        position_outil: >-
          L'outil ne les administre jamais comme objectif. Ils sont cités comme contexte de ce qui a été
          recommandé ou testé, jamais comme cible affichée dans une piste ; le recueil porte sur une
          direction déclarée, pas sur une quantité comparée à un seuil.
        appui: >-
          Ce qui a été randomisé dans PREDIMED et CORDIOPREV, c'est un motif alimentaire d'ensemble, pas
          l'atteinte d'un chiffre par item. Aucune donnée n'établit de seuil individuel dont le
          franchissement produirait le bénéfice. Afficher une cible reviendrait à mesurer un écart, donc à
          produire un score d'adhérence — et à entrer dans le registre culpabilisant que les
          recommandations elles-mêmes déconseillent.
      - sujet: "Le repérage d'un trouble du comportement alimentaire"
        position_officielle: >-
          La HAS demande de rechercher systématiquement une hyperphagie boulimique en situation de surpoids
          ou d'obésité.
        position_outil: >-
          L'outil ne dépiste pas systématiquement : il pose trois signes d'appel, et un signe positif
          n'ouvre qu'une orientation — il ne retire aucune piste au patient.
        appui: >-
          Les deux recommandations disponibles ne disent pas la même chose : l'USPSTF conclut que les
          preuves sont insuffisantes pour évaluer la balance bénéfices-risques d'un dépistage chez la
          personne sans signe ni symptôme. S'y ajoute une question de performance : la valeur prédictive
          positive du SCOFF-F dans cette population est estimée entre ~21 % et ~38 %, et sa valeur
          prédictive négative de ~99 % reflète surtout la faible prévalence — à 5 % de prévalence, un test
          négatif ne fait gagner que 4 points. Réserve de périmètre : le patient de ce nœud, adulte
          diabétique d'âge moyen ou avancé, n'appartient à la population cible déclarée d'aucun des deux
          documents HAS invoqués.
    explication: >-
      Aucun désaccord sur le fond : l'alimentation de type méditerranéen est le bon cap, elle se propose en
      première ligne, et la non-culpabilisation est un principe partagé — c'est même une recommandation
      officielle qui le formule le plus nettement. Les deux écarts ci-dessus portent sur la manière de
      délivrer le conseil et sur ce qu'on fait d'un repérage, pas sur leur bien-fondé.
incertitudes:
  - "Le bénéfice sur critère dur du régime méditerranéen porte sur le motif alimentaire SUPPLÉMENTÉ dans son ensemble (PREDIMED, CORDIOPREV), jamais sur une piste isolée — y compris l'huile d'olive et les fruits à coque, pourtant les deux composants réellement randomisés. Aucun essai n'a testé un geste seul."
  - "Aucune version française validée du MEDAS n'a été identifiée. Sans conséquence pour cet usage : l'instrument sert de cadre pour choisir les axes recueillis, il n'est jamais administré ni scoré."
  - "Les trois signes d'appel de trouble du comportement alimentaire reformulent des signes issus d'une recommandation ; ce n'est pas un instrument validé. Aucune étude n'a évalué la performance de cette combinaison : un résultat négatif ne garantit rien, un positif ne confirme rien. Depuis que le repérage n'ouvre qu'une orientation et ne ferme plus aucune piste, un faux positif coûte une proposition de plus — il ne retire plus rien au patient."
  - "Ne pas se servir d'un dépistage négatif pour lever la prudence : la valeur prédictive négative élevée du SCOFF-F (~99 %) reflète surtout la faible prévalence. À 5 % de prévalence, la probabilité pré-test d'absence de trouble est déjà de 95 % — un test négatif ne fait gagner que 4 points."
  - "Aucune proportion chiffrée n'est affirmée pour la piste « se repérer aux proportions dans l'assiette » — ni moitié de légumes, ni quart de féculents. Aucune source du dossier ne chiffre ce ratio ; le repère reste qualitatif, la place RELATIVE des composantes. La piste de pesée des aliments a été retirée : elle relève des patients pratiquant un comptage précis en insulinothérapie fonctionnelle, et sa généralisation au diabète de type 2 tout-venant n'est soutenue par aucune source."
  - "Les contre-indications à l'EFFORT — mal perforant plantaire, rétinopathie — n'ont aucune portée ici : ce nœud ne recueille que des critères alimentaires."
  - "La piste « continuer ce qui fonctionne déjà » n'est pas un repli par défaut : sa condition (huile d'olive ET fruits à coque réguliers) peut être vraie chez un patient favorable sur ces deux axes sans l'être sur les onze autres. Elle s'affiche alors avec d'autres pistes, ce qui est voulu."
  - "Rapprocher l'alimentation émotionnelle de la tachyphagie, que la source cite pour la piste « manger sans se presser », est une extrapolation raisonnée : les deux notions sont voisines sans être identiques dans le corpus."
