    - date: "2026-07-27"
      auteur: "référent DT2 + Claude Code"
      resume: >-
        LE VERROU TCA CESSE DE BLOQUER, ET LA PISTE VIANDE EST RÉÉCRITE SUR MANGER-BOUGER — décision
        référent, prise sur un principe qui recadre tout le nœud : « dans le cadre des RHD en médecine
        générale on ne propose pas de restriction calorique, en tout cas pas chiffrée ; on propose des
        modifications d'habitudes alimentaires, jamais de régime. »
        (1) LES TROIS EXCLUSIONS `verrou_tca` SONT RETIRÉES. Un verrou anti-restriction n'a pas d'objet
        dans un nœud qui ne propose aucune restriction — et l'inventaire de ce qu'il bloquait le confirme :
        une substitution (grignotage), un repère qualitatif (proportions dans l'assiette — RELIQUAT du
        blocage de la piste de PESÉE supprimée la veille, dont l'`inconvenients` décrivait encore une piste
        disparue), et un seul geste réellement chiffré, réécrit par ce même lot. Le verrou conditionne
        désormais les deux options d'ORIENTATION, et rien d'autre. `fragilite` est MAINTENU partout où il
        était : c'est un motif nutritionnel (protéines, apport énergétique), pas comportemental — les deux
        garde-fous étaient réunis dans la même ligne d'exclusion sans avoir la même raison d'être.
        (2) « Diviser par deux la portion habituelle de fromage et de charcuterie, préférer la volaille »
        devient « Réduire la charcuterie et la viande rouge (porc, bœuf, veau, mouton, agneau, abats) ».
        Objection clinique du référent : cet intitulé « mélange des choses bien différentes ». L'affiche
        Santé publique France / Manger-Bouger versée au dossier lui donne raison noir sur blanc — la
        charcuterie et la viande sont DEUX lignes de la colonne « Réduire », tandis que le fromage relève
        des produits laitiers, rangés en « Aller vers » sous « une consommation suffisante mais limitée ».
        Deux directions opposées dans un même geste. Trois retraits : le fromage (mauvaise colonne), le
        chiffre (Manger-Bouger n'énonce jamais de quantité), et « préférer la volaille » (l'affiche ne la
        recommande pas — elle se contente de ne pas la faire figurer dans la liste à réduire ; absence
        d'une liste n'est pas une recommandation positive). Nouvelle famille « Viande et charcuterie » :
        la piste n'a plus sa place en « Matières grasses ».
        (3) PLAFOND D'AFFICHAGE — dette levée (voir `incertitudes`) : l'écran replie les pistes au-delà du
        meilleur rang derrière « Autres pistes possibles (N) ». Rien n'est retiré ni filtré.
        IMPACT GOLDEN MASTER : 124 profils sur 180 changent — 77 gagnent la piste grignotage, 58 la piste
        proportions, 41 la piste viande/charcuterie ; aucune option perdue en dehors de celle qui est
        renommée. Total d'options applicables 1366 → 1533. Mesure cross-validée par comptage brut après
        que les DEUX premiers instruments se soient trompés (découpage sur la virgule du nouvel intitulé,
        puis alternation de séparateurs incomplète qui perdait 15 occurrences d'une option inchangée).
