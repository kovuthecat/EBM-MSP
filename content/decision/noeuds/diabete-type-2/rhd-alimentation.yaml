meta:
  date_revue: "2026-07-26"
  auteur: "Claude Code (agent dédié) + référent DT2 (Thibault) — encodage en attente de validation clinique"
  statut: brouillon
  version: "0.14"
  changelog:
    - date: "2026-08-05"
      auteur: "Claude Code — en attente de relecture référent (P13/S5, T-147)"
      resume: >-
        `insuline_ou_insulinosecreteur` REÇOIT `partage: true` (revue complète de la liste `partage`,
        au-delà du seul poids/taille demandé par I3) — même ajout, même session, sur
        `rhd-activite-physique.yaml`, qui déclare ce critère à l'identique (`bool`,
        `presomption_non: true`). Fait objectif et stable, jusqu'ici ressaisi d'un nœud RHD à l'autre
        sans raison. Invariant I32 ajouté (`engine/banc/coherence-inter-noeuds.test.ts`) pour garantir
        mécaniquement que tout critère `partage: true` garde le même encodage dans tous les nœuds qui
        le déclarent ainsi.
    - date: "2026-08-04"
      auteur: "Claude Code — en attente de relecture référent"
      resume: >-
        REFONTE DE L'ARGUMENTAIRE (D48), propagation depuis le nœud `prescription`. (1) `argumentaire`
        réécrit en cinq paragraphes — le champ est désormais AFFICHÉ (« Comment ce nœud raisonne ») ; il
        portait deux phrases tronquées par une édition antérieure (« … depuis le 2026-07-27 : il
        ORIENTE. » suivi d'un fragment orphelin « que la HAS cite elle-même comme mesure
        d'accompagnement »), corrigées au passage. (2) Deux `divergences[]` en forme comparable : les
        repères chiffrés non administrés au patient, et le repérage d'un trouble du comportement
        alimentaire. LA SECONDE RÈGLE UN MANQUE SIGNALÉ DANS LE NŒUD LUI-MÊME : une incertitude expliquait
        porter le conflit HAS 2019 / USPSTF 2022 « faute d'un champ dédié dans le schéma » — ce champ
        existe désormais, le conflit y est descendu avec ses chiffres de valeur prédictive. (3)
        `reco_officielle.source` resserré, détail vérifiable descendu dans `references[]` (dont l'USPSTF,
        jusque-là cité nulle part en source). (4) `synthese_critique.appuis` cite PREDIMED, CORDIOPREV et
        le MEDAS. (5) Les 11 incertitudes deviennent 8, toutes fondées sur la donnée ou son absence : les
        journaux de décision, les dates d'arbitrage et deux notes purement techniques (repliement
        d'affichage, mécanique de sentinelle) sortent. Aucun fait clinique perdu — performance inconnue
        des trois signes d'appel, piège de la valeur prédictive négative à faible prévalence, absence de
        ratio chiffré pour les proportions dans l'assiette, retrait de la pesée, tous conservés. (6)
        Argumentaire exhaustif nettoyé de ses attributions de décision. Aucune condition, aucun seuil,
        aucune option touchés.
    - date: "2026-08-02"
      auteur: "Claude Code (P12/S7, T-131) — en attente de relecture référent"
      resume: >-
        NETTOYAGE RÉDACTIONNEL — jargon de projet retiré des champs affichés (`incertitudes`,
        `sources.reco_officielle.source`) et de `rhd-alimentation.argumentaire.md` : références internes
        (« red-team », noms de fichiers `chantier-*`/`redteam-*`, « collecte » au sens interne du terme)
        reformulées ou retirées, aucune n'était clinique. Aucune `condition`, `exclusions`, `priorite` ni
        contre-indication modifiée — vérifié par relecture des diffs. Recette du 30/07 puis du 02/08
        (3ᵉ passe sur ce défaut) : invariant de banc ajouté (`engine/banc/jargon-projet.test.ts`, I25) pour
        empêcher une 4ᵉ occurrence.
    - date: "2026-07-31"
      auteur: "Claude Code (P10, retravail post-S6) — en attente de relecture référent"
      resume: >-
        Second énoncé du `cadrage` retravaillé, sur arbitrage référent : le point le plus lourd de N8
        (impossibilité d'enregistrer que la demande du patient porte sur le poids) mis en tête, isolé,
        plutôt que noyé en fin de liste de champs manquants ; « perte de poids/rémission hors périmètre »
        n'est plus répété mais référencé (déjà affirmé texto par le primer du module RHD), pour éviter
        deux textes à synchroniser pour la même affirmation. Aucun fait nouveau, aucune
        `conditions`/`exclusions`/`priorite` modifiée — reformulation seule.
    - date: "2026-07-31"
      auteur: "Claude Code (P10/S6, T-083) — en attente de relecture référent"
      resume: >-
        Inventaire des 16 options / 29 branches de condition : 28 déjà lisibles telles quelles, 1 opaque
        (« Continuer ce qui fonctionne déjà » — conjonction à deux termes) qui reçoit un motif rédigé
        (`option.motifs`, mécanisme P10/S2). `cadrage` créé (absent jusqu'ici) : 2 énoncés dans le
        registre du primer RHD, dont une section « ce que ce nœud ne prend pas en compte » (perte de
        poids/rémission déjà hors périmètre, demande du patient sur le poids, tour de taille, tension
        artérielle, repérage SAOS — liste À VALIDER PAR LE RÉFÉRENT). Aucune condition, aucun seuil,
        aucune option, aucune exclusion modifiés — vérifié par relecture ligne à ligne des diffs de
        snapshots (aucun changement de statut d'option).
    - date: "2026-07-29"
      auteur: "Claude Code (lot « simplification de saisie ») — en attente de relecture référent"
      resume: >-
        `traitements_en_cours` (`liste` de 9 classes, réutilisée du reste du domaine) REMPLACÉ, SUR CE
        NŒUD SEULEMENT, par le bool `insuline_ou_insulinosecreteur`. Constat mécanique : ce critère
        n'était lu qu'à UN endroit du nœud — le `quand` de l'alerte d'hypoglycémie — et n'y lisait que 4
        de ses 9 valeurs (insuline basale, insuline rapide, sulfamide, glinide), toujours ensemble dans
        une même disjonction. Les 5 autres cases (metformine, iSGLT2, aGLP1, tirzépatide, gliptine)
        n'apparaissaient dans AUCUNE condition : R5 (« un critère qu'on demande doit agir ») était violé
        sur 5 cases à cocher, demandées à chaque consultation pour ne rien changer à la sortie. Le nom
        écarte « hypoglycémiant », ambigu en français (metformine et gliptine sont des
        antihyperglycémiants) au profit des deux mécanismes réellement en cause. `presomption_non: true`
        CONSERVÉ : l'éligibilité mécanique (T-018/D30) est inchangée — aucune condition d'option
        `role: securite`, aucune `exclusions`, aucun `prerequis` ne le lit, seulement une alerte de nœud
        (canal distinct, R8) ; le retirer aurait rendu le critère indéterminé, donc « décisif à
        confirmer » sur formulaire vierge, un changement de comportement que ce lot ne veut pas.
        `prescription.yaml` et `insuline.yaml` gardent la liste à 9 valeurs (`partage: true`) : eux
        prescrivent, la classe exacte y est décisive — ils sont HORS PÉRIMÈTRE de ce lot. ZÉRO
        changement de conduite : le golden master de caractérisation ne diffère que sur la ligne du
        critère et sur la présence de cette alerte — aucune option proposée, écartée ou en attente ne
        bouge sur les 180 profils. Effet de bord signalé par le banc lui-même (G3) sur le nœud sœur, cf.
        son changelog du même jour. Texte de l'alerte INCHANGÉ (il nommait déjà les classes en clair,
        jamais le critère).
    - date: "2026-07-28"
      auteur: "Claude Code (P4/S1, T-018) — correctif mécanique, en attente de relecture référent"
      resume: >-
        D30 (amende D20) inverse le défaut de détermination des critères `bool`/`liste` : indéterminés
        par défaut, sauf `presomption_non: true` explicite, réservé aux critères qui ne participent à
        aucune condition d'option `role: securite` ni à aucune `exclusions` du nœud. Audit mécanique de
        l'étape 4 de T-018 : `traitements_en_cours` reçoit `presomption_non: true` (éligible SUR CE
        NŒUD ; diverge sciemment de `prescription`, cf.
        `engine/banc/coherence-inter-noeuds.test.ts`). `signes_appel_tca` perd `confirmation_requise`
        (devenu inutile, son effet — indéterminé tant que non répondu — est désormais le défaut
        universel) mais NE reçoit PAS `presomption_non` (repérage TCA, un « non » jamais demandé ne peut
        pas être présumé sans risque). Aucun changement de logique clinique — oubli de bump/changelog
        corrigé à la consolidation P4 (D5).
    - date: "2026-07-27"
