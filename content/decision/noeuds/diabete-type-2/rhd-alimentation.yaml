      auteur: "référent DT2 + Claude Code"
      resume: >-
        LOT « REPÉRAGE TCA » — 2 arbitrages référent, après collecte de preuve
        (`docs/decision/validation/chantier-2026-07-27/preuve-repérage-tca.md`) et red-team adversarial
        (`redteam-repérage-tca.md`).
        (1) VERROU MAINTENU, PROSE ENRICHIE. La collecte affirmait que l'incertitude du nœud était « fausse
        au sens littéral » ; le red-team a établi qu'elle ne l'était PAS — elle portait sur le corpus local,
        et le corpus local ne contient effectivement aucun des deux documents HAS invoqués. Le défaut
        n'était pas d'être faux mais d'être trop étroit : l'entrée dit désormais ce que la littérature
        contient réellement (SCOFF-F, Expali™, Binge Eating Scale française) et POURQUOI le verrou reste
        préféré malgré cela — au premier rang, le fait qu'un item du SCOFF est INVERSÉ chez ce patient (la
        perte de poids récente y est un signe d'alerte, alors qu'ici c'est un objectif thérapeutique).
        Deux motifs de la collecte ont en revanche été ÉCARTÉS parce que le red-team les a démolis : la VPP
        « ≈ 20 % » est en réalité comprise entre 21 et 38 % selon la méta-analyse retenue (une seconde
        existait, non cherchée), et le « 4 patients bloqués à tort sur 5 » confondait positifs et patients
        — la proportion réelle est d'environ 16 %, soit une surestimation d'un facteur 5. Deux entrées
        `incertitudes` ajoutées : la performance du verrou est INCONNUE (raison de prudence des deux côtés,
        pas un argument pour le statu quo), et la divergence HAS 2019 (« rechercher systématiquement ») vs
        USPSTF 2022 (« preuves insuffisantes ») est désormais portée au lieu d'être arbitrée en silence.
        (2) OPTION D'ORIENTATION AJOUTÉE. Le verrou ne déclenchait qu'une orientation vers le diététicien,
        alors que le guide HAS surpoids-obésité — PDF déjà présent au dépôt — écrit qu'une orientation vers
        un psychologue ou un psychiatre spécialiste des TCA peut être nécessaire EN COMPLÉMENT. La nouvelle
        option coexiste avec la précédente (même rang), sur une condition plus étroite : le verrou TCA seul.
