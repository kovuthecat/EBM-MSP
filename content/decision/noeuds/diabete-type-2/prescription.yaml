        « Suspendre l'iSGLT2 », « Arrêter la gliptine redondante », « Réduire la posologie de l'insuline »,
        « Réduire la posologie de l'AR GLP‑1 », « Réduire la posologie du tirzépatide », « Réduire la
        posologie du sulfamide », « Réduire la posologie du glinide », « Déprescrire la metformine ».
        Défaut relevé par la recette praticien du 02/08 (`docs/decision/validation/
        recette-praticien-naif-2026-08-02.md`, N7 : « le clic n'est pas le problème ; le silence
        l'est »). Contenu clinique = rapport OpenEvidence du 2026-08-02 (analysé au cadrage du plan, cf.
        `plans/P12/S6.md`), AUCUNE recherche menée en session. NIVEAU DE PREUVE RENDU LISIBLE DANS LE
        TEXTE (exigence du brief) : les seuils rénaux (metformine, sulfamide) citent KDIGO 2022/RCP
        ANSM/SFD 2023‑2025, registre recommandation — SANS CHANGEMENT du seuil sulfamide DFG < 30, déjà
        documenté comme citation SFD (pas KDIGO) depuis le 2026-07-27 ; les deux chiffres de titration
        (−50 % sulfamide, −20 à −30 % insuline) sont explicitement étiquetés « avis d'experts » (AAFP
        2026 / JAMA Cardiol 2020), jamais au registre d'une HAS/RCP. POINT DE VIGILANCE TENU : ces deux
        chiffres n'existent QU'EN CONTEXTE DE RELAIS THÉRAPEUTIQUE (introduction d'un autre agent) — sur
        les DEUX options qui apparaissent aussi hors ce contexte (« Réduire la posologie de l'insuline »
        et « Réduire la posologie du sulfamide » sont deux des trois cartes affichées sur le profil N7 de
        la même recette, une déprescription gériatrique PURE, sans relais), l'`apercu` distingue
        explicitement les deux registres et répond « au jugement clinique, aucun rythme chiffré sourcé »
        pour le cas hors relais — le −20/−30 % du relais n'est PAS transporté vers la vignette N7 (« je
        baisse les 12 UI de combien ? » reste sans réponse chiffrée pour ce profil, à dessein). Les deux
        cas sans aucune donnée de rythme (« Réduire la posologie du glinide », « Déprescrire la
        metformine ») reprennent littéralement le registre de l'`apercu` déjà validé sur `insuline.yaml`
        (« Désintensifier / alléger le schéma », S4 : « réduire au jugement clinique — aucun rythme
