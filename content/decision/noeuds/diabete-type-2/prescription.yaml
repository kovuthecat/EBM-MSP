        maximale utilisable en France = 1 mg/semaine ; dulaglutide (Trulicity) 0,75 ou 1,5→3→4,5
        mg/semaine. Sources : RCP centralisés EMA (= RCP ANSM pour ces spécialités, procédure
        centralisée), rubrique 4.2, lus séparément pour chaque molécule ; base de données publique des
