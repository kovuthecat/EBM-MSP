      resume: >-
        RENOMMAGE DE « DÉSINTENSIFIER » — libellé seul, aucune règle touchée. Défaut constaté (arbitrage
        référent A2, faisant suite à A1 ci-dessous) : trois cartes portaient sur le même sulfamide chez le
        patient de 88 ans sous sulfamide + hypoglycémie récente décrit dans l'entrée A1, toutes badgées
