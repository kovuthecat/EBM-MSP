        un premier essai encodait le fait « dose à réduire » comme critère `derive` — `evaluerDeriveTernaire`
        (`engine/deriveCritere.ts`) ne court-circuite PAS un ET dont un opérande est faux (utile pour une
        chaîne arithmétique comme l'IMC, dangereux pour un ET booléen), contrairement à `evaluateCondition`
        (conditions/exclusions) — corrigé en écrivant l'expression EN CLAIR dans les deux `exclusions`
        plutôt que dans un `derive`. Trouvé par `banc/impasse.test.ts` (I11), pas deviné.
        AU PASSAGE : texte de posologie de la metformine réécrit (« dose maximale divisée par 2 entre
        DFG 30 et 45 » associait les deux seuils au même patient) — les deux paliers sont maintenant
        énoncés séparément avec leur propre borne de DFG.
        CANAGLIFLOZINE RETIRÉE des `avantages`/`contre_indications`/`apercu` de l'option iSGLT2 (retour
        utilisateur : non disponible en France) — la mention datait d'une vérification 2024 (T-084),
        non re-vérifiée par ce lot. La référence bibliographique CREDENCE (essai canagliflozine) reste
        en `references` : preuve valide de l'effet de classe, indépendante de la disponibilité
        commerciale actuelle de la molécule qui l'a établi.
