        touchée : `IMC >= 30`, `IMC < 22`, `IMC < 25` continuent de lire le MÊME nom de critère, désormais
        calculé plutôt que saisi — c'est tout l'intérêt d'avoir gardé le nom (voie B du cadrage, plutôt
        qu'un booléen par seuil qui aurait exigé de réécrire chaque condition). EXTENSION DU MOTEUR
        (`engine/deriveCritere.ts`) nécessaire : `derive` ne rendait qu'un booléen, un critère `type:
        nombre` en reçoit désormais la VALEUR ; l'arithmétique supporte maintenant une CHAÎNE de plusieurs
        opérateurs (`poids / taille / taille`, impossible à écrire avec un seul opérateur sans
        parenthèses). PROPAGATION DE L'INDÉTERMINÉ (D20) vérifiée explicitement : poids ou taille manquant
        ⇒ IMC INDÉTERMINÉ (jamais 0), toute condition qui le lit part EN ATTENTE plutôt que de conclure
        silencieusement (`engine/deriveCritere.test.ts`, `engine/evaluateNode.indetermine.test.ts`, écrits
        AVANT le correctif du moteur, rouges puis verts). ÉQUIVALENCE VÉRIFIÉE sur le golden master de
        caractérisation (`__snapshots__/caracterisation.prescription.txt`) : aucune conclusion changée pour
        un jeu de patients dont le poids/la taille reproduisent l'IMC déjà figé (cf. procédure de
        maintenance du banc, `engine/banc/geler-profils.maintenance.test.ts`). `albuminurie` (enum à 3
        valeurs) N'EST PAS convertie dans ce lot : `derive` ne sait produire qu'un booléen ou un nombre,
