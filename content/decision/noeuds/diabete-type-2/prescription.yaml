    source: "HAS 2024 · SFD 2025 · ADA 2026 · KDIGO 2022 · RCP ANSM"
    references:
      - nom: "HAS 2024"
        detail: "Stratégie thérapeutique du DT2, R.45 à R.105 — ordre préférentiel R.74, non-association GLP‑1/iDPP4 R.80, désintensification R.102/103/105. R.78 (grade C) nomme le répaglinide pour sa demi-vie courte et son absence de contre-indication rénale. Ne nomme jamais un sulfamide individuel et ne porte aucun seuil de DFG pour cette classe."
      - nom: "SFD 2025"
        lien: "https://doi.org/10.1016/j.mmm.2025.10.002"
        detail: "Méd Mal Métab 2025;19(8):630-662 — Avis 3/5/5bis/6/11-15. C'est ce texte, et non la KDIGO, qui porte : le seuil de DFG 30 des sulfamides (Tableau I notes 1-2 + Avis 12), le plancher d'HbA1c de 7 % sous glinide ou insuline en insuffisance rénale sévère, le « ne jamais utiliser » chez le sujet âgé dépendant (note 6), et la liste fermée des molécules utilisables sous DFG 15 (Avis 12 bis — dont le répaglinide et la vildagliptine 50 mg/j)."
      - nom: "ADA 2026"
        detail: "Standards of Care — section 13.14 (désintensification du sujet âgé)."
      - nom: "KDIGO 2022"
        detail: "Ne chiffre que la metformine et les iSGLT2 (Figure 23). Aucun seuil sur les sulfamides : le seuil de DFG 30 n'est donc pas une convention KDIGO, il vient de la SFD."
      - nom: "RCP ANSM"
        detail: "Metformine (adaptation au DFG : 3 g ≥ 60, 2 g 45-59, 1 g 30-44, contre-indication < 30), iSGLT2, incrétines, répaglinide (rubrique 4.3 : cinq contre-indications, aucune rénale ; rubrique 5.2 : exposition doublée entre 20 et 39 ml/min)."
      - nom: "Endocrine Society 2019"
        lien: "https://pubmed.ncbi.nlm.nih.gov/30903688/"
        detail: "Porte des seuils par molécule (glimépiride < 30, glyburide < 60). ÉCARTÉE : source non française, périmètre ≥ 65 ans, gliclazide absent, et ses seuils contrediraient les RCP français."
    position: >-
      Sur socle metformine + mode de vie : en cas de maladie CV établie, IC ou MRC, prescrire d'emblée un
      iSGLT2 ou un AR GLP‑1 (ou tirzépatide) à bénéfice prouvé, quel que soit l'HbA1c ; en obésité (IMC ≥ 30),
      AR GLP‑1 ou tirzépatide. Sulfamides plus la stratégie préférentielle (R.69) ; ne pas associer GLP‑1 et
      iDPP4 (R.80) ; chez le sujet âgé sur‑traité, éviter le surtraitement et désintensifier (R.102/103/105 ;
      SFD Avis 5 bis ; ADA 13.14), en maintenant iSGLT2/AR GLP‑1. Sécurité rénale metformine : 3 g ≥ 60,
      2 g 45‑59, 1 g 30‑44, CI < 30.
    divergence: true
    # CINQ DIVERGENCES, une par entrée, chacune en trois faces comparables. Elles remplacent le paragraphe
    # de prose numéroté « (1)… (2)… (3)… » qui vivait dans `explication` : on ne pouvait ni les compter, ni
    # voir pour chacune qui dit quoi et sur quelles données. Ce qui était compté « (2) granularité EBM » y
    # empilait en fait trois écarts de nature différente — ils sont ici séparés.
    divergences:
      - sujet: "Place des gliptines"
        position_officielle: >-
          HAS et SFD conservent aux gliptines une place résiduelle : sans bénéfice d'organe, mais bien
          tolérées, sans hypoglycémie et sans prise de poids, elles restent une option quand les classes à
          bénéfice prouvé sont inutilisables.
        position_outil: >-
          L'outil ne les supprime pas, mais il refuse de les présenter comme un choix parmi d'autres : la
          carte porte une étiquette « option de repli » et un rendu atténué, et son rang la place derrière
          tous les agents à bénéfice démontré. Elle ne remonte au premier plan que lorsque les deux classes
          protectrices sont réellement inutilisables chez ce patient.
        appui: >-
          Quatre essais de sécurité cardiovasculaire contre placebo, tous neutres sur les critères durs
          (TECOS : MACE et insuffisance cardiaque neutres, HR 1,00). SAVOR-TIMI 53 montre en outre un signal
          d'insuffisance cardiaque sous saxagliptine (HR 1,27). S'y ajoutent des effets indésirables
          documentés : pemphigoïde bulleuse (HR 1,42 contre sulfamide), signal de pancréatite. C'est le même
          socle de preuve des deux côtés, soupesé différemment — pas une donnée que l'un aurait et pas
          l'autre.
      - sujet: "Bénéfice d'organe et bénéfice glycémique"
        position_officielle: >-
          Les recommandations placent iSGLT2 et AR GLP‑1 en tête sur la base d'un bénéfice de classe, sans
          distinguer systématiquement l'indication d'organe de l'indication glycémique, ni la molécule
          testée de sa classe.
        position_outil: >-
          L'outil sépare les deux : quand ces classes sont proposées au seul titre glycémique, il annonce un
          bénéfice glycémique (absence d'hypoglycémie, poids) et non le bénéfice d'organe. Il nomme la
          molécule quand la protection est molécule-spécifique.
        appui: >-
          Les essais qui établissent le bénéfice d'organe ont été menés sur des populations ENRICHIES en
          insuffisance cardiaque ou en maladie rénale (EMPA-REG OUTCOME ; DAPA-CKD, NNT 19 sur 2,4 ans ;
          EMPEROR-Reduced, NNT 19), pas sur une population purement glycémique. Transposer leur résultat à
          un patient sans comorbidité serait une extrapolation, pas une lecture.
      - sujet: "Garde-fous de terrain (IMC bas, dénutrition, infections génito-urinaires)"
        position_officielle: >-
          Ces situations relèvent, dans les recommandations, du jugement clinique et de la rubrique
          « précautions d'emploi ». Aucune n'en fait une règle qui retire une classe de la proposition.
        position_outil: >-
          L'outil en fait des règles. Deux d'entre elles retirent l'option : l'AR GLP‑1 chez le maigre
          (IMC < 22) ou le dénutri même obèse, le tirzépatide chez le dénutri. La troisième rétrograde
          seulement : l'iSGLT2 tombe en fin de liste, avec une alerte, en cas d'infections
          génito-urinaires récidivantes — il reste proposable, il cesse d'être proposé en premier.
        appui: >-
          Aucun essai n'a testé ces seuils, et l'outil ne prétend pas le contraire : la direction est
          établie (perte de poids et fonte musculaire sous incrétines, risque infectieux génito-urinaire
          sous gliflozine), le chiffre est un repère. C'est un écart de FORME — une précaution transformée
          en règle — assumé du côté sûr, cf. la première entrée de « ce qui reste incertain ».
      - sujet: "Association iSGLT2 + AR GLP‑1"
        position_officielle: >-
          Les recommandations autorisent l'association et la présentent comme une intensification
          possible.
        position_outil: >-
          L'outil la propose comme la COEXISTENCE de deux indications distinctes — un séquençage —, jamais
          comme une synergie.
        appui: >-
          Le bénéfice additif sur critères durs n'est démontré par aucun essai ; PRECIDENTD est en cours.
          L'additivité glycémique et pondérale, elle, est acquise : c'est ce que l'outil annonce, et rien
          de plus.
      - sujet: "Déprescription de la metformine"
        position_officielle: >-
          La metformine reste le socle du traitement quelles que soient les comorbidités : les
          recommandations n'envisagent pas son retrait chez un patient qui la tolère.
        position_outil: >-
          L'outil propose sa déprescription sous trois conditions cumulatives strictes : sur-traitement
          déclaré, fragilité, et tous les autres agents en cours à bénéfice dur démontré. Hors de ces trois
          conditions réunies, il ne la propose jamais.
        appui: >-
          Le bénéfice de la metformine sur critère dur n'est pas démontré contre placebo (Griffin 2017,
          méta-analyse ; Boussageon 2012, non significatif). C'est une absence de preuve, pas une preuve
          d'absence — d'où le niveau de preuve faible porté par l'option, et les trois verrous. L'écart
          avec les recommandations est déclaré sur la carte elle-même, jamais présenté comme un
          alignement.
    explication: >-
      Sur la direction, les deux lectures se rejoignent largement : relégation des sulfamides et des
      gliptines derrière les classes à bénéfice démontré, priorité aux iSGLT2 et aux AR GLP‑1 selon la
      comorbidité, non-association d'une gliptine et d'un AR GLP‑1 (même voie incrétine), désintensification
      du sujet âgé sur-traité en maintenant les agents protecteurs. Les écarts ci-dessus ne portent pas sur
      le sens du traitement mais sur son grain : ce qu'on annonce comme bénéfice, à quel patient, et sous
      quelles réserves.
# CE QUI RESTE INCERTAIN — RÈGLE DE RÉDACTION (2026-08-04, demande utilisateur) : chaque entrée se fonde
# sur une DONNÉE ou sur son ABSENCE, jamais sur qui a tranché. Le praticien qui lit ne connaît pas les
# arbitrages du dépôt ; citer une décision interne transforme un argument vérifiable en argument
# d'autorité, et ne lui apprend rien. Ces entrées portaient jusqu'ici le journal de chantier — dates
# d'arbitrage, « RÉSOLU le… », PMID corrigés, historique des vérifications de sources. Cette mémoire n'est
# pas perdue : elle vit dans `meta.changelog`, dans les commentaires de ce fichier et dans l'argumentaire
# exhaustif, qui sont ses trois places légitimes. Garde-fou : `engine/banc/jargon-projet.test.ts` (I25).
incertitudes:
  - "Seuils de terrain (IMC 22 pour les AR GLP‑1, IMC 30 pour le tirzépatide) : aucun essai ne les a testés. La direction est établie — perte de poids et fonte musculaire sous incrétines, bénéfice pondéral chez l'obèse — mais le chiffre exact est un repère pragmatique, pas un résultat."
  - "Bénéfice sur critère dur de la substitution elle-même : jamais testé en switch. Les classes ont été comparées au placebo, pas l'une à l'autre chez un patient déjà traité — l'argument reste indirect, tiré de leur valeur comparée."
  - "Additivité de l'association iSGLT2 + AR GLP‑1 sur critères durs : non démontrée, PRECIDENTD en cours. L'additivité glycémique et pondérale, elle, est acquise."
  - "Désintensification : un seul essai randomisé documente son innocuité (Grant 2025 — hypoglycémie sévère non aggravée par l'allègement, 4,7 % contre 6,5 %, non significatif). Aucun essai de mortalité ni d'événements durs ; le reste repose sur un accord d'experts."
  - "Metformine en 1re intention : le bénéfice sur critère dur n'est pas démontré contre placebo (Griffin 2017, méta-analyse ; Boussageon 2012, non significatif). C'est une absence de preuve et non une preuve d'absence — les essais disponibles manquent de puissance sur ces critères."
  - "iSGLT2 prescrit sans indication d'organe : il n'est pas proposé à l'allègement sur ce seul motif. Il garde un effet glycémique, et un bénéfice rénal reste possible ; aucune donnée ne soutient son retrait dans cette situation. Il ne s'allège que s'il pose un risque avéré."
  - "Répaglinide, bénéfice sur critère dur : aucun essai randomisé dédié n'existe — une méta-analyse en réseau cherchant spécifiquement ces essais n'en a trouvé aucun (Grenet 2019, 34 essais / 175 966 patients). Le signal de mortalité disponible porte sur la CLASSE des insulinosécréteurs, sulfamides et glinides poolés (Mannucci 2020 : mortalité toute cause OR 1,11, p = 0,04 ; MACE non significatif). Le seul signal propre au répaglinide est observationnel et non causal, sans ajustement sur l'IMC ni sur l'HbA1c (Huang & Yeh 2019)."
  - "Répaglinide en dialyse : aucune donnée pharmacocinétique en administration répétée. La seule étude du patient hémodialysé est en dose unique (Marbury 2000, n = 6) — elle établit que l'hémodialyse n'épure pas la molécule, pas qu'une prise prandiale répétée soit sûre. Un signal d'accumulation est décrit après une semaine de traitement en insuffisance rénale sévère, et l'étiquetage FDA nie l'existence de toute étude sous 20 ml/min ou en dialyse. La prudence posologique est ce que la donnée soutient ; un seuil chiffré ne l'est pas."
  - "Sulfamides, distinction entre molécules : elle est réelle et documentée — le gliclazide donne des métabolites inactifs, le glimépiride un métabolite M1 actif qui s'accumule en insuffisance rénale. Elle n'est pas encodée : aucun texte français de rang recommandation ne la chiffre, et les seuils étrangers disponibles (40 et 60 ml/min) contrediraient les RCP français."
  - "Plancher d'HbA1c en insuffisance rénale sévère : le plancher de 7 % est attaché, dans la source, au couple « DFG < 30 ET glinide ou insuline en cours ». Rien n'est publié pour le patient à DFG < 30 sous un autre agent hypoglycémiant, ni pour le patient sous glinide ou insuline à DFG 30-44. Ces deux zones restent au plancher général de 6,5 % — c'est la lecture littérale de la source, pas nécessairement la meilleure lecture clinique."
  - "Sujet âgé et sulfamides : la source distingue deux crans, « éviter » chez le sujet fragile et « ne jamais utiliser » chez le sujet dépendant. Le nœud ne dispose que d'un critère de fragilité binaire et retire donc le sulfamide dès le premier cran. Sur-blocage assumé, du côté sûr d'un garde-fou d'hypoglycémie."
  - "Position vis-à-vis de l'objectif : elle est DÉCLARÉE dans ce nœud, jamais importée de celui qui fixe la cible — chaque nœud reste évaluable seul. Le garde-fou d'HbA1c < 6,5 % est absolu et ne dépend donc pas de la cible individuelle du patient."
  - "Intention « optimiser » : elle ferme la palette glycémique. Un patient déclaré au-dessus de sa cible avec cette intention ne reçoit que le socle et la poursuite du traitement. C'est fidèle à l'intention saisie, et ça peut surprendre."
  - "Indisponibilité des deux classes à bénéfice démontré : elle est calculée à partir des motifs durs déjà saisis (DFG, infections génito-urinaires, dénutrition, IMC, classe déjà en cours), et ouvre alors l'intensification glycémique résiduelle. La préférence du patient vis-à-vis de l'injectable n'y entre volontairement pas : elle ne joue que sur le rang d'affichage, jamais sur la disponibilité d'une classe."
  - "Remboursement en France de la monothérapie par AR GLP‑1 après intolérance ou contre-indication à la metformine : confirmé pour le dulaglutide et le liraglutide (formulaire Assurance Maladie, arrêté du 10/01/2025). Les autres molécules relèvent de formulaires propres, de même logique, non vérifiés un à un."
