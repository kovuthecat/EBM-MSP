        `position_vs_cible` (a_l_objectif/au_dessus/nettement_au_dessus/sous_objectif, groupe « Traitement
        actuel et contrôle », juste après HbA1c_actuelle ; `a_l_objectif` en tête = seule valeur inerte sur
        formulaire vierge). `cible_atteinte` dérive désormais de `position_vs_cible` (a_l_objectif OU
        sous_objectif), plus de `intention`. `palette_glycemique_ouverte` recâblée à l'identique : gain n°1,
        le seuil ABSOLU `HbA1c_actuelle >= 8.5` (aveugle à la cible individuelle — un fragile naïf à 8,7 %
        dont l'objectif est < 9 % déclenchait une bithérapie d'emblée) est remplacé par `nettement_au_dessus`,
        relatif à l'objectif du patient ; gain n°2, le sur-traitement n'était détecté que par le garde-fou
        absolu `hba1c_sous_cible` (< 6,5 %, INCHANGÉ, toujours indépendant) — un fragile à 6,8 % dont
        l'objectif est < 9 % ne déclenchait rien, `sous_objectif` le capte désormais via `cible_atteinte`.
        `intention` CONSERVÉE comme primer (organise le flux/l'affichage, `visible_si`), elle n'affirme plus
        aucun état. Libellés ajoutés (`labels.ts`) ; un dictionnaire orphelin d'un essai antérieur
        (`a_la_cible`/`en_dessous`/`tres_en_dessous`) y a été remplacé par les 4 valeurs réelles. Banc de
        vignettes recâblé : `position_vs_cible` ajouté à chaque profil dont le comportement dépendait de
        `intention` pour la position vs cible (reproduisant EXACTEMENT l'ancienne valeur de `cible_atteinte`/
        `palette_glycemique_ouverte`, aucune attente de test changée) + nouveau test reproduisant le profil de
        la recette référent (fragile/EV limitée/ASCVD/IMC 20, metformine+gliptine, à l'objectif : iSGLT2
        applicable, switch gliptine→GLP-1 écarté IMC < 22). Alertes de cohérence intention↔HbA1c (« rebasculer
        l'intention ») VOLONTAIREMENT NON TOUCHÉES : leur pertinence sous R1 est un arbitrage clinique du
        référent, pas de ce recâblage. STATUT toujours brouillon.
