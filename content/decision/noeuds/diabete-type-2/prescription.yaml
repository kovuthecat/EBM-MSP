        invoquée par `construireVueDecision`/`evaluateNode`, donc le banc, qui part de profils déjà
        complets, ne peut par construction voir aucun effet de cette règle. La preuve de fonctionnement
        vient du test de contrat unitaire et de la vérification navigateur, pas du banc — à savoir pour
        toute session future qui toucherait au pré-remplissage. Invariant de banc ajouté (I26,
        `engine/banc/invariants-contenu.test.ts`) : aucune règle `preremplissage` ne pose, sur un critère
        masqué dans le même état, une valeur différente de sa valeur par défaut — empêche qu'un contenu
        futur invoque ce même raisonnement de tolérance pour un cas où il ne vaudrait plus.
    - date: "2026-08-04"
