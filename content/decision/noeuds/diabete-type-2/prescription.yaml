        glucotoxicité) : l'insuline devient DE FACTO OBLIGATOIRE, sans changement de règle nécessaire —
        les 5 classes actives (iSGLT2, AR GLP‑1, association, gliptine, sulfamide) excluent déjà toutes
        `cetonemie == true` indépendamment ; seule l'insuline reste alors proposable.
