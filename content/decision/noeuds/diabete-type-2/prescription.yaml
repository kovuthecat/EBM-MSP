        sulfamide » — sans que le praticien puisse choisir laquelle appliquer au seul vu du libellé.
        Diagnostic : « Désintensifier » n'est pas un geste de posologie, c'est un geste de STRATÉGIE
        (relâcher la cible, alléger la charge thérapeutique globale — cf. son propre argumentaire, « HbA1c
        < 6,5 % sous agent hypoglycémiant = sur-traitement iatrogène », HAS R.103, SFD Avis 5 bis), mais son
        intitulé énumérait des gestes par molécule (« alléger / arrêter le sulfamide, le glinide ou réduire
        l'insuline ») qui recouvrent mot pour mot les intitulés des deux cartes spécifiques.
        CE QUI A CHANGÉ : uniquement l'`intitule` de l'option « Désintensifier », de « Désintensifier :
        alléger / arrêter le sulfamide, le glinide ou réduire l'insuline » à « Désintensifier : alléger la
        charge thérapeutique globale (relâcher la cible) ». `apercu` (champ absent sur cette option),
        `effet_attendu` et le premier item d'`avantages` ont été relus : ils n'énuméraient déjà aucune
        molécule et restent inchangés mot pour mot.
        CE QUI N'A PAS CHANGÉ : aucune `conditions`, `exclusions`, `prerequis`, `priorite`, `famille`,
        `role`, `action`, `niveau_preuve`, `motifs` — sur cette option ni sur aucune autre. Aucune source,
        aucun chiffre, aucun niveau de preuve modifié. La question de savoir si « Remplacer le sulfamide »
        et « Réduire la posologie du sulfamide » doivent être rendues mutuellement exclusives (sur le
        modèle de l'exclusion `DFG < 30` déjà posée entre « Réduire la posologie » et « Arrêter le
        sulfamide » par le red-team sécurité HAUTE-1 du 2026-07-26) reste un arbitrage clinique **non
        tranché ici** — signalé au référent, non appliqué.
