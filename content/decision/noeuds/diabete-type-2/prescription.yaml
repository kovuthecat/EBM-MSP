        (bloc `alertes`, `quand: "denutrition == true"`) — arbitrage référent du 2026-08-02, déclenché par
        le constat de la recette du 02/08 (N7, Mme Chevallier 88 ans/49 kg/dénutrie/saute des repas) :
        l'iSGLT2 lui est proposé `Preuve élevée` alors que l'AR GLP‑1 est écarté par IMC < 22 et
        dénutrition. VÉRIFIÉ, PAS RÉOUVERT : l'asymétrie est FONDÉE (l'exclusion de l'AR GLP‑1 repose sur
        son propre `inconvenients` — « aggravation de la dénutrition / sarcopénie », effet anorexigène —
        que l'iSGLT2 ne partage pas — sa perte de poids est glycosurique) ; l'arbitrage du 2026-07-29
        « pas d'exclusion sur le poids, aucune donnée ne la fonde » TIENT et n'est pas rouvert (ni
        `exclusions` ni `condition` touchée sur cette option). LE VRAI TROU : le risque de cette patiente
        n'est pas son poids mais ce qu'elle mange — l'acidocétose euglycémique est précipitée par le jeûne
        et les apports glucidiques insuffisants, déjà nommés DEUX fois dans ce nœud : `inconvenients` de
        cette même option (« risque d'acidocétose (suspendre si jeûne, chirurgie, sepsis) ») et
        `inconvenients` de l'option « Suspendre l'iSGLT2 » (« rechercher la cause (jeûne, chirurgie,
        maladie aiguë intercurrente, apports glucidiques insuffisants…) ») — mais jamais de façon
        PRÉVENTIVE : la seule carte qui suspend l'iSGLT2 se
        déclenche sur `cetonemie == true`, une cétonémie DÉJÀ CONFIRMÉE. UN SEUL CANAL (D21/R8) pour jeûne +
        apports insuffisants + chirurgie programmée — un seul fait de sécurité, pas trois — porté par
        l'OPTION (patron « Introduire un AR GLP‑1 », alerte DFG < 15) plutôt que par le nœud, car il
        qualifie spécifiquement CE geste et ne doit se lire que quand il est réellement sur la table (R8).
        CONTENU AJOUTÉ, absent jusqu'ici de ce nœud : le délai chirurgical CHIFFRÉ (≥ 3 j avant chirurgie
        programmée, 4 j pour l'ertugliflozine — ACC 2020, rapport OpenEvidence du 2026-08-02, cf. étape 1
        du brief : « non trouvé » au cadrage) et le rappel, mis EN TÊTE du message, que la glycémie peut
        rester proche de la normale (ce qui retarde le diagnostic — le point le plus traître de cette
        complication). AUCUN CRITÈRE CRÉÉ (`denutrition` existe déjà, seul porteur retenu — un champ
        « chirurgie programmée » coûterait de la saisie à tous pour servir quelques-uns). AUCUNE
        `condition`/`exclusions`/`prerequis`/`priorite`/`role`/`action`/`niveau_preuve` touchée sur AUCUNE
