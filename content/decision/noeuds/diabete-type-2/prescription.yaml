        recevait ZÉRO carte — l'intention *Initier* masque la section « Traitements en cours » sans
        répondre le critère, et l'option « Insuline d'initiation » (sécurité, déjà bien écrite) restait
        « en attente » sans issue. CORRECTIF : `traitements_en_cours` reçoit une règle
        `preremplissage` (`quand: "intention == initier"`, `valeur: []`) — la valeur de départ à
        l'initiation est « aucun traitement », proposée et non imposée, identique à la valeur par défaut
        qu'un critère masqué reçoit de toute façon (R8), modifiable en changeant d'intention. Rendu
        possible par T-137 (moteur, session parallèle du même plan) : `reglePreremplissage.valeur` accepte
        désormais un tableau (dont `[]`) en plus d'une chaîne — jusqu'ici réservé aux critères
        `enum`/`nombre`/`bool`. AUCUN CHANGEMENT DE `visible_si` : la section reste masquée à
        l'initiation, comportement voulu (arbitrage référent confirmé). EFFET NUL SUR LE GOLDEN MASTER,
