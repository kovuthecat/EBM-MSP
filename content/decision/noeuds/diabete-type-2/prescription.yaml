      resume: >-
        REFONTE DE L'ARGUMENTAIRE — LISIBILITÉ ET NATURE DES ARGUMENTS (retour utilisateur en recette
        navigateur). Cinq changements de contenu, tous sur des champs AFFICHÉS.
        (1) LES DIVERGENCES SONT STRUCTURÉES. Le paragraphe de prose numéroté « (1)… (2)… (3)… » de
        `reco_officielle.explication`, rendu en bas de panneau sous les deux colonnes, devient CINQ entrées
        `divergences[]` à trois faces comparables (ce que dit la recommandation / ce que fait l'outil / sur
        quelles données). Ce qui y était compté « (2) granularité EBM » empilait en réalité trois écarts de
        nature différente — bénéfice d'organe vs glycémique, garde-fous de terrain, association iSGLT2 +
        AR GLP‑1 — désormais séparés. `explication` ne porte plus que les points d'accord.
        (2) LES REVUES SECONDAIRES SORTENT DE L'ÉCRAN. `synthese_critique.references` (Médicalement Geek,
        Prescrire) est supprimé du modèle : la ligne « Réf. : Prescrire » sous une position se lit
        « Prescrire dit que », ce que D23 avait précisément voulu empêcher en les sortant du sujet
        grammatical des arguments. Remplacé par `appuis`, qui cite les ESSAIS (10 ids de
        `references_primaires`). Les deux revues restent consultées et tracées en commentaire YAML.
        (3) `reco_officielle.source` RESSERRÉ à un titre de bloc (« HAS 2024 · SFD 2025 · … ») ; ses dix
        lignes de détail bibliographique passent dans le nouveau `references[]`, où chaque citation est
        vérifiable ligne à ligne (numéro d'avis, de tableau, de rubrique de RCP).
        (4) LES INCERTITUDES SONT RÉÉCRITES SUR LA DONNÉE. 16 entrées devenues 15, toutes fondées sur une
        donnée publiée ou sur son absence explicite. Sortent : les dates d'arbitrage, les « RÉSOLU le… »,
        l'historique des PMID corrigés, les mentions de qui a tranché — rien de tout cela n'apprend quoi
        que ce soit au praticien qui lit, et le citer transforme un argument vérifiable en argument
        d'autorité. AUCUN FAIT CLINIQUE PERDU : chaque entrée conserve sa substance (absence d'ECR dédié
        au répaglinide, dose unique de l'étude en dialyse, distinction gliclazide/glimépiride non
        encodée, lecture littérale du plancher d'HbA1c, sur-blocage du sulfamide chez le sujet fragile) ;
        c'est l'appareil de chantier qui part, et il reste dans ce changelog et les commentaires.
        (5) `argumentaire` (le champ court) RÉÉCRIT EN SIX PARAGRAPHES. Il était obligatoire au schéma et
        AFFICHÉ NULLE PART — d'où le mélange logique du nœud / journal qui s'y était installé sans
        conséquence visible. L'écran l'affiche désormais (« Comment ce nœud raisonne »), il est donc écrit
        pour être lu.
        GARDE-FOU : `engine/banc/jargon-projet.test.ts` (I25) gagne quatre marqueurs — qui-a-tranché,
        date de chantier, statut de chantier en capitales, identifiant de tâche — et couvre les nouveaux
        champs affichés. Les cinq autres nœuds sont en dette nommée et sous cliquet.
