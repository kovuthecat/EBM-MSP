      - "En insuffisance rénale sévère, vérifier d'abord que tous les agents non insuliniques sont réellement épuisés : un AR GLP‑1 n'a aucune contre‑indication rénale, et sous DFG 30 la vildagliptine 50 mg/j reste utilisable."
    inconvenients:
      - "Contrainte d'injection et d'auto‑surveillance, hypoglycémie, prise de poids."
      - "Aucun bénéfice cardiovasculaire démontré."
    effet_attendu: >-
      Baisse d'HbA1c dose‑dépendante ; aucun bénéfice sur critère dur.
    niveau_preuve: faible
    # POSOLOGIE DÉPLACÉE depuis `inconvenients` (2026-08-06, contre-relecture rédactionnelle) : « débuter
    # par une basale, associée si possible à un AR GLP‑1 » est une modalité de prescription, pas un risque
    # à mettre en balance. Texte repris tel quel, aucun chiffre ajouté (cette carte n'en portait aucun).
    posologie_detail:
      - "Débuter par une insuline basale, associée si possible à un AR GLP‑1."
      - "Le schéma — titration, doses — devra ensuite être ajusté et suivi dans la durée."
    contre_indications:
      - "Arrêter le sulfamide / le glinide à l'introduction de l'insuline (hypoglycémie cumulée). Suspecter un DT1 devant une cétose / un amaigrissement rapide chez un sujet non obèse."
  # ---- Switch (portes SU/gliptine, branche à/au‑dessus de la cible) -------------------------------------
  # R3 (docs/decision/GRAMMAIRE-NOEUD.md) : le verdict sur la gliptine (agent sans bénéfice dur) se
  # déclenche désormais sur la SEULE présence de la ligne — la comorbidité (ASCVD/IMC/cible non atteinte)
  # a migré vers le CHOIX du remplaçant (indications/priorités des options iSGLT2/AR GLP‑1 ci‑dessus), elle
  # n'autorise plus le geste. LEVÉE DU VERROU (référent, 2026-07-25) : l'option, atomique jusqu'ici (verdict
  # + destination confondus, verrouillée sur l'AR GLP‑1 seul), est généralisée sur le modèle déjà correct de
  # l'option sulfamide — le remplaçant est iSGLT2 OU AR GLP‑1 selon la comorbidité, choisi par les options
  # d'ajout elles-mêmes. C'est ce défaut exact (remplaçant unique, exclu par le terrain IMC < 22) qui faisait
  # disparaître le verdict sur la gliptine avec lui — le défaut d'origine de toute la série R1→R4.
  # Exclusions restreintes aux seules structurelles (gate catabolique) : celles du remplaçant (IMC < 22,
  # dénutrition, propres à l'AR GLP‑1) ne portent plus sur CE verdict, cf. R3 (« les exclusions du verdict
  # sont structurelles, jamais celles d'une destination »).
  - intitule: "Gliptine — remplacer par un agent à bénéfice démontré"
    role: geste
    action: remplacer
    conditions:
      - "intention != initier AND traitements_en_cours contient gliptine"
    # R6 : garde-fous de cohérence (ne pas déjà prendre le remplaçant visé) — jamais montrés comme
    # justification (cf. option iSGLT2 plus haut).
    prerequis:
      - "traitements_en_cours ne_contient_pas aGLP1"
      - "traitements_en_cours ne_contient_pas tirzepatide"
    # P10/S3 (T-080) : même motif que sur « Arrêter la metformine » — garde technique de non-initiation.
    motifs:
      "intention != initier AND traitements_en_cours contient gliptine": "Gliptine déjà en cours"
    # EXCLUSION GLUCOTOXICITÉ LEVÉE (2026-08-05, T-148, arbitrage Thibault) : le commentaire ci-dessus
    # (R3, « exclusions restreintes aux seules structurelles — gate catabolique ») posait la glucotoxicité
    # comme blocage dur de CE verdict, quelle que soit la destination. Devenu incohérent avec la levée de
    # l'exclusion glucotoxicité sur les options d'ajout iSGLT2/AR GLP‑1 : en glucotoxicité seule, on veut
    # au contraire pouvoir switcher la gliptine (agent faible) vers un de ces deux agents puissants. La
    # cétonémie reste, elle, un blocage dur (gate catabolique réel → insuline exclusive).
    exclusions:
      - "cetonemie == true"
    priorite: 3
    famille: "Traitement à corriger ou remplacer"
    avantages:
      - "Le remplaçant apporte une protection d'organe que la gliptine n'a pas, à contrôle glycémique au moins équivalent."
      - "Choisir le remplaçant selon la comorbidité : iSGLT2 si l'insuffisance cardiaque ou l'atteinte rénale prédomine, AR GLP‑1 si la maladie athéromateuse ou l'obésité prédomine. Sans terrain particulier, l'un ou l'autre selon la tolérance et la préférence du patient."
    inconvenients:
      - "Ne JAMAIS associer une gliptine et un AR GLP‑1 : même voie incrétine, aucun bénéfice additif (Nauck 2017 ; ADA §9 ; KDIGO PP4.2.3 ; HAS R.80). Introduire un AR GLP‑1 implique d'arrêter la gliptine."
      - "Aucun essai de switch dédié ne montre que retirer la gliptine réduit un critère dur : le bénéfice d'organe est celui du remplaçant. Le switch n'est documenté que sur critères de substitution (méta Tran/Kramer : −0,69 % d'HbA1c, −2,25 kg)."
      - "Si aucun remplaçant protecteur n'est utilisable sur ce terrain, ne pas remplacer à vide : poursuivre la gliptine, bien tolérée et sans hypoglycémie, et réévaluer."
    effet_attendu: >-
      Le retrait de la gliptine n'apporte par lui-même aucun bénéfice sur critère dur : la classe est neutre
      (quatre essais de sécurité cardiovasculaire, dont TECOS, HR 1,00 sur le MACE comme sur l'insuffisance
      cardiaque) et son effet glycémique est modeste (~0,5 à 0,8 % d'HbA1c). Le bénéfice attendu est
      entièrement celui du remplaçant retenu : iSGLT2, hospitalisation pour insuffisance cardiaque
      HR ~0,61‑0,73 et progression rénale HR ~0,56‑0,76 ; AR GLP‑1, événements athéromateux, surtout l'AVC.
    # R2 — le délai est celui du REMPLAÇANT, puisque c'est lui qui porte le bénéfice attendu : les deux
    # horizons sont recopiés tels quels des `delai_benefice` des options « iSGLT2 » et « AR GLP‑1 »
    # ci-dessus, jamais recalculés. Le retrait de la gliptine, lui, n'a pas d'horizon propre : il n'a
    # pas de bénéfice propre.
    delai_benefice: "celui du remplaçant retenu — 16-26 mois pour un iSGLT2 (insuffisance cardiaque), 3,8 à 5,4 ans pour un AR GLP‑1"
    niveau_preuve: modere
    references:
      - tecos
      - pioneer-3
      - tran-kramer
    contre_indications:
      - "Ne pas maintenir la gliptine en association avec un AR GLP‑1 : la remplacer."
      - "Les contre‑indications propres au remplaçant retenu s'appliquent par ailleurs."
  - intitule: "Gliptine (redondante)"
    role: geste
    action: arreter
    conditions:
      - "intention != initier AND traitements_en_cours contient gliptine"
      - "intention != initier AND traitements_en_cours contient aGLP1 OR intention != initier AND traitements_en_cours contient tirzepatide"
    # P10/S3 (T-080) : trois motifs sur le même garde technique de non-initiation (une entrée par classe).
    motifs:
      "intention != initier AND traitements_en_cours contient gliptine": "Gliptine déjà en cours"
      "intention != initier AND traitements_en_cours contient aGLP1": "AR GLP‑1 déjà en cours"
      "intention != initier AND traitements_en_cours contient tirzepatide": "Tirzépatide déjà en cours"
    priorite: 3
    famille: "Traitement à corriger ou remplacer"
    avantages:
      - "Corrige une association INTERDITE déjà en place : gliptine + AR GLP‑1/tirzépatide = redondance incrétine sans bénéfice additif → arrêter la gliptine (ADA §9 ; KDIGO PP4.2.3 « stopping the gliptin » ; HAS R.80)."
    inconvenients:
      - "À repérer surtout chez un patient adressé déjà sous les deux ; réévaluer l'HbA1c après l'arrêt (pas de perte d'efficacité attendue)."
    effet_attendu: >-
      Simplification sans perte d'efficacité (Nauck 2017 : +78 % GLP‑1 intact sans effet glycémique additionnel).
    niveau_preuve: modere
    references:
      - nauck
    # AJOUT T-126 (P12/S6, 2026-08-03) — rapport OpenEvidence du 2026-08-02, cf. `meta.changelog`.
    apercu: "arrêt franc, sans fenêtre de chevauchement ni décroissance (JAMA Cardiol 2020)."
  # R3 (docs/decision/GRAMMAIRE-NOEUD.md) : le verdict sur le sulfamide (agent sans bénéfice dur) se
  # déclenche désormais sur la SEULE présence de la ligne — la comorbidité (IC/rein/ASCVD/IMC/hypo
  # schéma/cible non atteinte) a migré vers le CHOIX du remplaçant (indications/priorités des options
  # iSGLT2/AR GLP‑1 ci‑dessus), elle n'autorise plus le geste. `hypoglycemie_recente`/`hba1c_sous_cible`
  # restent des gardes-fous DISTINCTS : dans ces deux cas, on déprescrit, on ne switche pas (cf. l'option
  # de désintensification).
  - intitule: "Sulfamide — remplacer par un agent à bénéfice démontré"
    role: geste
    action: remplacer
    conditions:
      - "intention != initier AND traitements_en_cours contient sulfamide"
      # VERROU LEVÉ le 2026-08-01 (arbitrage référent A1, recette « Traiter » du même jour).
      # `hypoglycemie_recente == false` figurait ici et FERMAIT cette option au patient qui en a le plus
      # besoin : un sujet âgé sous sulfamide venant de faire une hypoglycémie ne pouvait recevoir que
      # « Désintensifier » et « Réduire la posologie » — jamais « Remplacer ». Contradiction frontale avec
      # l'argumentaire de cette option elle-même, qui justifie le remplacement PAR le risque
      # hypoglycémique (CAROLINA, NNT 45 sur l'hypo sévère — cf. `avantages` ci-dessous).
      # La temporalité que ce verrou encodait implicitement (R3 : sécuriser d'abord, remplacer ensuite)
      # n'est pas perdue : elle est portée par le RANG et par l'ordre des familles, jamais plus par une
      # condition qui rendait le geste injoignable.
      # SECOND VERROU LEVÉ le 2026-08-06 (P14/S6, T-169, décision référent) : `hba1c_sous_cible == false`
      # fermait aussi cette option à un patient en sur-contrôle — alors que R3 (GRAMMAIRE-NOEUD.md) pose
      # justement que « le verdict sur un agent sans bénéfice dur n'a pas à être justifié par une
      # comorbidité », et *a fortiori* pas conditionné à une position glycémique : le sulfamide n'a pas
      # plus de bénéfice d'organe à l'objectif qu'au-dessus. Le motif rédigé qui portait cette branche
      # (« HbA1c au-dessus du plancher de sécurité ») est retiré avec elle (I24 : une clé de `motifs` sans
      # branche est un défaut, pas une dette à garder). Les trois issues — remplacer, réduire, arrêter —
      # sont désormais TOUTES potentiellement applicables au même patient sous sulfamide en sur-contrôle
      # (familles « Traitement à corriger ou remplacer » et « Traitement à alléger », toutes deux
      # cumulables) : c'est un choix explicite du référent, pas un défaut de modélisation à corriger.
    # P10/S3 (T-080) : même motif que sur « Arrêter la metformine » — garde technique de non-initiation.
    motifs:
      "intention != initier AND traitements_en_cours contient sulfamide": "Sulfamide déjà en cours"
    exclusions:
      - "DFG < 30"
    priorite: 4
    famille: "Traitement à corriger ou remplacer"
    avantages:
      - "Le sulfamide n'a aucun bénéfice cardio‑rénal propre, et il coûte des hypoglycémies, du poids et une durabilité moindre."
      - "Le remplaçant divise fortement le risque d'hypoglycémie sévère et fait perdre du poids."
      # DÉPLACÉE depuis `inconvenients` (2026-08-06, contre-relecture rédactionnelle) : la même puce était
      # rangée en AVANTAGE sur « Gliptine — remplacer » et « Glinide — remplacer ». Choisir le remplaçant
      # selon la comorbidité est ce qui rend le geste ajustable au patient, jamais un coût à mettre en
      # balance — les trois cartes sœurs portent désormais cette puce dans la même colonne. Texte inchangé.
      - "Choisir le remplaçant selon la comorbidité : iSGLT2 si l'insuffisance cardiaque ou l'atteinte rénale prédomine, AR GLP‑1 si l'athérome ou l'obésité prédomine."
    inconvenients:
      - "Aucun essai de switch dédié ne montre que retirer le sulfamide réduit un critère dur : le bénéfice d'organe est celui du remplaçant."
      - "Si aucun remplaçant protecteur n'est utilisable sur ce terrain, ne pas remplacer à vide : surveiller, ou déprescrire le sulfamide."
    effet_attendu: >-
      Hypoglycémie sévère : 0,45 pour 100 patient‑années sous sulfamide contre 0,07 sous le comparateur
      (CAROLINA, NNT 45). Poids : ~−1,5 à −4 kg. Le sulfamide lui-même est neutre sur les critères durs
      (CAROLINA, TOSCA.IT) ; le bénéfice d'organe attendu est entièrement celui de l'iSGLT2 ou de
      l'AR GLP‑1 choisi.
    # R2 — le délai est celui du REMPLAÇANT, recopié tel quel des `delai_benefice` des options « iSGLT2 »
    # et « AR GLP‑1 » ci-dessus. L'HORIZON DU NNT 45 DE CAROLINA N'EST PAS ÉCRIT DANS CE DOSSIER : il n'est
    # donc pas posé ici — cf. le rapport de correction, § à arbitrer.
    delai_benefice: "celui du remplaçant retenu — 16-26 mois pour un iSGLT2 (insuffisance cardiaque), 3,8 à 5,4 ans pour un AR GLP‑1"
    niveau_preuve: modere
    references:
      - carolina
      - grade
      - tosca-it
      - simpson
    contre_indications:
      # RENVOI CORRIGÉ (2026-08-06, contre-relecture rédactionnelle) : « la désintensification » ne porte
      # plus ce geste depuis le redécoupage du 2026-08-06 — l'arrêt du sulfamide a sa propre carte.
      - "En sur‑contrôle glycémique franc, ou après une hypoglycémie ou une chute récente, la conduite est d'arrêter le sulfamide sans le remplacer — cf. « Sulfamide — arrêter »."
      - "Si un sulfamide doit être conservé : gliclazide ou glimépiride, jamais le glibenclamide."
  # ---- Remplacer le glinide (T-063, référent 2026-07-30) -------------------------------------------------
  # A1 (arbitrage référent 2026-07-30) : carte DÉDIÉE, symétrique de « Remplacer la gliptine » et
  # « Remplacer le sulfamide » ci-dessus — sans elle, l'écran ouvrait le remplaçant sans jamais nommer
  # l'agent à retirer (ambiguïté ajouter/remplacer relevée 4 fois en recette). Même famille, même `action`,
  # MÊME STRUCTURE DE CONDITIONS que « Remplacer le sulfamide » (hypoglycémie récente / sur-contrôle
  # renvoient à la désintensification, pas au switch — cf. son propre commentaire ci-dessus). PAS
  # d'exclusion `DFG < 30` : contrairement au sulfamide, le répaglinide ne porte AUCUNE contre-indication
  # rénale au RCP (cf. le commentaire de scission sulfamide/glinide, plus bas, et l'option « Réduire la
  # posologie du glinide ») — la niche rénale reste intacte, l'arbitrage A2 dit COMMENT l'articuler (voir
  # `exclusions` ci-dessous), pas qu'on la retire.
  # A2 (arbitrage référent 2026-07-30) : remplacement CONDITIONNÉ à la disponibilité effective d'un
  # remplaçant. Réutilise les dérivés déjà calculés par le nœud (`isglt2_indisponible`, `aglp1_indisponible`
  # — cf. l'option « Gliptine (sitagliptine) » plus bas qui les utilise déjà) plutôt que de ré-écrire des
  # seuils rénaux en dur : si les DEUX classes protectrices sont indisponibles sur ce terrain, cette carte
  # n'est pas la bonne réponse — la niche du répaglinide (seul insulinosécréteur utilisable sous DFG 30)
  # prend le relais via « Réduire la posologie du glinide ». `exclusions` (et non `conditions`) DÉLIBÉRÉMENT
  # : R4 (docs/decision/GRAMMAIRE-NOEUD.md) affiche toujours une option écartée par exclusion, avec son
  # motif — c'est l'information de sécurité que le praticien doit voir, pas un silence.
  #
  # Preuve du bénéfice absent (T-063, collecte dédiée vérifiée en primaire 2026-07-30, PMID vérifiés un par
  # un contre PubMed/texte intégral — détail complet dans l'argumentaire, section « Le glinide rejoint les
  # agents sans bénéfice sur critère dur ») : (1) AUCUN ECR dédié au répaglinide sur critère dur n'existe
  # (Grenet 2019, méta-analyse en réseau, 34 essais/175 966 patients : « No trials evaluating glinides […]
  # were found ») ; (2) à l'échelle de la CLASSE (sulfamides + glinides poolés), signal de sur-mortalité
  # toute cause (Mannucci 2020, 48 ECR : MH-OR 1,11 IC95% 1,00-1,23 p=0,04) SANS signal équivalent sur le
  # MACE (MH-OR 1,08 IC95% 0,96-1,22 p=0,20, NS) ; (3) signal REPAGLINIDE-SPÉCIFIQUE, observationnel :
  # Huang & Yeh 2019, cohorte taïwanaise appariée par score de propension (1,68 M patients, répaglinide
  # n=11 468 vs glimépiride référence, suivi médian 8 ans) — mortalité toute cause aHR 1,88 (IC95%
  # 1,45-2,43, p<0,001), événement CV (IDM+AVC) aHR 1,69 (IC95% 1,25-2,59, p=0,001), pire des 5
  # sécrétagogues testés. GRADE TRÈS FAIBLE assumé (`niveau_preuve: tres_faible`, à dessein différent du
  # `modere` du sulfamide/de la gliptine) : observationnel, non causal (les auteurs eux-mêmes ne concluent
  # qu'à la prudence), IMC/HbA1c/lipides NON ajustés, sévérité rénale probablement NON ajustée (codes
  # diagnostiques, pas DFG continu), population de primo-prescription différente du contexte de cette carte
  # (patients déjà avancés dans leur parcours). Le signal RENFORCE la justification clinique du remplacement
  # quand une alternative existe ; il ne remplace pas la neutralité de classe comme motif — les deux sont
  # dits, distinctement, ci-dessous.
  - intitule: "Glinide — remplacer par un agent à bénéfice démontré"
    role: geste
    action: remplacer
    conditions:
      - "intention != initier AND traitements_en_cours contient glinide"
      - "hypoglycemie_recente == false"
      # VERROU LEVÉ le 2026-08-06 (P14/S6, T-169, décision référent) — même correctif, même motif que sur
      # « Remplacer le sulfamide » ci-dessus (cf. son commentaire) : `hba1c_sous_cible == false` fermait le
      # remplacement à un patient en sur-contrôle, alors que R3 ne conditionne pas le verdict sur la ligne
      # à la position glycémique. `hypoglycemie_recente == false`, ci-dessus, N'EST PAS touché : il répond
      # à autre chose (une hypoglycémie récente relève d'abord de la réduction/désintensification, pas du
      # switch) et reste en vigueur.
    # P10/S3 (T-080) : même motif que sur « Arrêter la metformine » — garde technique de non-initiation.
    # T-125 (P12/S5) : motif ajouté sur la branche booléenne négative ci-dessus, restée brute jusqu'ici —
    # même défaut, même correctif que sur « Remplacer le sulfamide » (cf. son commentaire).
    motifs:
      "intention != initier AND traitements_en_cours contient glinide": "Glinide déjà en cours"
      "hypoglycemie_recente == false": "Aucune hypoglycémie récente à corriger d'abord"
    exclusions:
      - "isglt2_indisponible == true AND aglp1_indisponible == true"
    priorite: 4
    famille: "Traitement à corriger ou remplacer"
    avantages:
      - "Le répaglinide n'a aucun bénéfice démontré sur critère dur, et il n'a jamais été testé pour cela : c'est une absence totale de donnée randomisée, pas une neutralité mesurée."
      - "Le remplaçant, lui, apporte une protection d'organe démontrée."
      - "Choisir le remplaçant selon la comorbidité, comme pour le sulfamide et la gliptine : iSGLT2 si l'insuffisance cardiaque ou l'atteinte rénale prédomine ; AR GLP‑1 si la maladie athéromateuse ou l'obésité prédomine."
    inconvenients:
      - "Le signal de sur-risque propre au répaglinide est observationnel, jamais causal : il ne s'appuie sur aucun essai randomisé, et l'étude qui le porte n'ajuste ni sur l'IMC, ni sur l'HbA1c, ni sur la sévérité de l'insuffisance rénale. Ne pas le présenter comme un fait établi ; le détail des réserves est dans l'argumentaire exhaustif."
      - "Aucun essai de switch dédié ne montre que retirer le glinide réduit un critère dur : le bénéfice d'organe est celui du remplaçant."
      - "Si aucun remplaçant protecteur n'est utilisable sur ce terrain — iSGLT2 écarté par la fonction rénale ou des infections génito‑urinaires, AR GLP‑1 écarté par la dénutrition ou la maigreur —, réduire la dose du répaglinide vaut mieux que remplacer à vide : c'est le seul insulinosécréteur utilisable sous DFG 30."
      - "Devant une intolérance légère isolée, réduire la posologie du répaglinide est souvent préférable à un remplacement. Les deux gestes peuvent d'ailleurs être proposés ensemble : ce n'est pas une contradiction."
      - "Contrainte propre au glinide, à mettre en balance : trois prises prandiales, donc une observance plus exigeante — contre un risque d'hypoglycémie plus faible que celui des sulfamides (Leonard 2018 : hazard ratio ajusté 2,03 [IC95% 1,64‑2,52] contre metformine, mais derrière le glyburide, le glimépiride et le glipizide)."
    effet_attendu: >-
      Le retrait du glinide n'apporte par lui-même aucun bénéfice mesuré : aucun essai randomisé dédié au
      répaglinide sur critère dur n'existe (Grenet 2019, méta-analyse en réseau, 34 essais / 175 966
      patients). À l'échelle de la classe des insulinosécréteurs (sulfamides et glinides poolés), il existe
      un signal de sur-mortalité toute cause — odds ratio de Mantel-Haenszel 1,11 [IC95% 1,00‑1,23], p=0,04
      — sans signal équivalent sur l'événement cardiovasculaire majeur (MACE : 1,08 [0,96‑1,22], p=0,20,
      non significatif) (Mannucci 2020, 48 essais ≥ 52 semaines). Un signal propre au répaglinide existe,
      observationnel : mortalité toute cause hazard ratio ajusté 1,88 [1,45‑2,43] et événement
      cardiovasculaire combiné 1,69 [1,25‑2,59] contre glimépiride, sur 1,68 million de patients suivis
      8 ans en médiane (Huang & Yeh 2019) — grade très faible. Le bénéfice attendu est celui du remplaçant :
      iSGLT2, hospitalisation pour insuffisance cardiaque HR ~0,61‑0,73 et progression rénale HR ~0,56‑0,76 ;
      AR GLP‑1, événements athéromateux, surtout l'AVC.
    # R2 — même construction que sur « Sulfamide » et « Gliptine » : le bénéfice attendu est celui du
    # remplaçant, l'horizon aussi. Recopié tel quel des options « iSGLT2 » et « AR GLP‑1 ».
    delai_benefice: "celui du remplaçant retenu — 16-26 mois pour un iSGLT2 (insuffisance cardiaque), 3,8 à 5,4 ans pour un AR GLP‑1"
    niveau_preuve: tres_faible
    references:
      - grenet-2019
      - mannucci-2020
      - huang-yeh-2019
      - leonard-2018
    contre_indications:
      # RENVOI CORRIGÉ (2026-08-06, contre-relecture rédactionnelle) : cf. la carte « Sulfamide — remplacer »,
      # même correctif — l'arrêt du glinide a désormais sa propre carte.
      - "En sur‑contrôle glycémique franc, ou après une hypoglycémie ou une chute récente, la conduite est d'arrêter le glinide sans le remplacer — cf. « Glinide — arrêter »."
      - "Les contre‑indications propres au remplaçant retenu s'appliquent par ailleurs."
  # ---- Intolérance (porte : réduction OU switch) -------------------------------------------------------
  - intitule: "Optimiser l'agent mal toléré"
    role: geste
    conditions:
      - "intention != initier AND intolerance_traitement == true"
    # P10/S3 (T-080) : motif sur le garde technique de non-initiation — la branche ne dit rien de plus
    # que « intolérance à un traitement en cours » (règle d'or). Complété plus bas (après `prerequis`)
    # par les neuf motifs du garde-fou « patient déjà traité » : à la différence des autres `prerequis`
    # de ce nœud (des tests de périmètre PURS sur `traitements_en_cours`, jamais montrés — cf. R6 ci-
    # dessous), CELUI-CI mélange `intention != initier` à chaque terme ; l'écran de non-retenue ne le
    # reconnaît donc PAS comme un test de périmètre (`estTestDePerimetre`, `lib/vueDecision.ts`) et peut
    # l'afficher tel quel — exactement les neuf lignes « Traitements en cours comprend X » que le
    # docstring de `nettoyerNonRetenues` cite comme le défaut mesuré (60 % des lignes, chez qui n'en
    # prend aucun). Les motifs rédigés le corrigent là où le filtrage de `conditions` ne peut pas
    # l'atteindre (il ne regarde jamais dans `prerequis`, R6).
    motifs:
      "intention != initier AND intolerance_traitement == true": "Intolérance à un traitement en cours"
      "intention != initier AND traitements_en_cours contient metformine": "Metformine déjà en cours"
      "intention != initier AND traitements_en_cours contient iSGLT2": "iSGLT2 déjà en cours"
      "intention != initier AND traitements_en_cours contient aGLP1": "AR GLP‑1 déjà en cours"
      "intention != initier AND traitements_en_cours contient tirzepatide": "Tirzépatide déjà en cours"
      "intention != initier AND traitements_en_cours contient sulfamide": "Sulfamide déjà en cours"
      "intention != initier AND traitements_en_cours contient gliptine": "Gliptine déjà en cours"
      "intention != initier AND traitements_en_cours contient insuline_basale": "Insuline basale déjà en cours"
      "intention != initier AND traitements_en_cours contient insuline_rapide": "Insuline rapide déjà en cours"
      "intention != initier AND traitements_en_cours contient glinide": "Glinide déjà en cours"
    # GARDE-FOU AJOUTÉ le 2026-07-29 (décision référent) : cette carte parlait d'optimiser « l'agent mal
    # toléré » chez un patient dont AUCUN traitement n'est déclaré en cours — l'intolérance seule la
    # déclenchait. Un agent qui n'existe pas ne se réduit ni ne se remplace.
    #
    # DANS `prerequis` ET NON DANS `conditions` (R6, arbitrage indication/prérequis) : « le patient a un
    # traitement en cours » est un garde-fou de COHÉRENCE, pas une indication clinique — affiché en
    # justification (« Proposé parce que : le patient prend un traitement »), il n'apprendrait rien. Même
    # emplacement, même nature que les `ne_contient_pas <classe>` des options d'ajout de ce nœud.
    #
    # NEUF TERMES PLUTÔT QU'UN TEST DE LISTE VIDE : le DSL n'a pas d'opérateur « est vide » — même
    # contrainte, et même choix, que le bloc `contraintes` en tête de fichier, qui énumère les mêmes neuf
    # classes en négatif. L'énumération a l'avantage d'être auditable ligne à ligne.
    #
    # GARDE `intention != initier` RÉPÉTÉ EN TÊTE DE CHAQUE TERME (motif R8, docs/decision/
    # GRAMMAIRE-NOEUD.md ; même geste que P4/S9 · T-031 sur toutes les citations POSITIVES de
    # `traitements_en_cours`, critère masqué par `visible_si: "intention != initier"` et non éligible à
    # `presomption_non` sur ce nœud). Sans lui, le prérequis serait INDÉTERMINÉ pour un patient naïf
    # (champ masqué ⇒ jamais renseigné) au lieu d'être FAUX — un naïf ne « contient » rien, c'est la
    # sémantique voulue. Ce que ça ne change PAS pour un patient renseigné : `traitements_en_cours` NON
    # RENSEIGNÉ (intention déclarée, champ visible, case jamais cochée) laisse bien le prérequis
    # indéterminé, donc l'option EN ATTENTE — ni affirmée, ni écartée (D30/R7, comportement vérifié sur le
    # moteur, pas supposé).
    prerequis:
      - "intention != initier AND traitements_en_cours contient metformine OR intention != initier AND traitements_en_cours contient iSGLT2 OR intention != initier AND traitements_en_cours contient aGLP1 OR intention != initier AND traitements_en_cours contient tirzepatide OR intention != initier AND traitements_en_cours contient sulfamide OR intention != initier AND traitements_en_cours contient gliptine OR intention != initier AND traitements_en_cours contient insuline_basale OR intention != initier AND traitements_en_cours contient insuline_rapide OR intention != initier AND traitements_en_cours contient glinide"
    # AJOUTÉ le 2026-08-04 (retour utilisateur, « toujours 3 cartes distinctes là où il n'en faudrait
    # qu'une seule ») — cette carte GÉNÉRIQUE (neuf classes possibles, cf. `prerequis`) ne sait pas
    # identifier LAQUELLE des neuf est en cause : quand metformine est le SEUL agent en cours ET qu'elle
    # doit réellement être réduite (dose excessive pour le DFG OU intolérance digestive — même expression
    # que l'exclusion du socle plus haut, à relire ensemble si l'une change), la carte dédiée « Metformine
    # [réduire] » (sécurité, plus bas) couvre déjà TOUT ce que cette carte générique pourrait dire pour ce
    # patient, avec la dose exacte en plus. La garder affichée à côté n'ajoutait rien, seulement une
    # reformulation vague de la même conduite.
    # SCOPE ÉTROIT À DESSEIN : ne s'exclut QUE si metformine est SEULE (`metformine_seule_en_cours`) — un
    # patient sous metformine ET un autre agent intolérant (ex. sulfamide) a toujours besoin de cette carte
    # pour CET AUTRE agent, qu'aucune carte dédiée ne couvre.
    # EXPRESSION EN CLAIR (PAS `metformine_a_reduire == true`) — même motif que le socle plus haut : un
    # critère `derive` ne court-circuite pas un ET dont un opérande est faux (`evaluerDeriveTernaire`),
    # contrairement à `evaluateCondition` qui évalue cette `exclusions`. `metformine_seule_en_cours`, lui,
    # reste un `derive` légitime (aucun opérande masqué à indétermination) — cf. le commentaire complet
    # juste avant sa déclaration.
    exclusions:
      - "metformine_seule_en_cours == true AND traitements_en_cours contient metformine AND DFG >= 45 AND DFG < 60 AND dose_metformine > 2000 OR metformine_seule_en_cours == true AND traitements_en_cours contient metformine AND DFG >= 30 AND DFG < 45 AND dose_metformine > 1000 OR metformine_seule_en_cours == true AND traitements_en_cours contient metformine AND intention != initier AND intolerance_traitement == true AND nature_intolerance contient digestive"
    priorite: 2
    famille: "Traitement à alléger"
    avantages:
      - "Réduire la posologie de la molécule en cause suffit souvent quand l'intolérance n'est pas majeure : la sévérité comme la dose relèvent du jugement du praticien, aucun dosage n'est imposé."
      - "Remplacer par une classe mieux tolérée, choisie selon les comorbidités et en écartant la classe en cause, reste la seconde voie quand la réduction ne suffit pas."
    inconvenients:
      - "Documenter la nature de l'intolérance avant de conclure à un échec de classe."
      - "Intolérance digestive : la metformine et l'AR GLP‑1 en sont deux sources. Privilégier la réduction ou l'arrêt de la metformine, dont le bénéfice est le plus faible."
    effet_attendu: >-
      Restaure la tolérance sans nécessairement abandonner un agent à bénéfice d'organe. Effet non chiffrable
      (dépend de l'agent et du geste retenu).
    niveau_preuve: faible
  # ---- Cartes d'arrêt par insulinosécréteur (T-185, P14/S6, 2026-08-06, décision référent « les deux, ----
  # avec périmètres redécoupés ») : la 3ᵉ issue (arrêter) existait déjà DANS « Désintensifier » ci-dessous,
  # mais sans nommer le médicament ni porter de badge d'action (`action` absente). Les deux cartes
  # ci-dessous REPRENNENT EXACTEMENT le premier item de `conditions` de « Désintensifier » (avant sa
  # restriction aux insulines, cf. son propre commentaire), transposé à chaque médicament — même situation
  # clinique, nom du médicament en plus. Modèle de rédaction : « Sulfamide (DFG < 30) » plus haut (même
  # famille de geste — arrêter un insulinosécréteur —, `role: geste` ici et non `securite` : ce n'est pas
  # une urgence rénale mais une correction de sur-traitement, comme pour « Désintensifier »).
  - intitule: "Sulfamide"
    role: geste
    action: arreter
    conditions:
      - "intention != initier AND traitements_en_cours contient sulfamide"
      # QUATRIÈME TERME AJOUTÉ (2026-08-07, P14/S19, T-192) : `hypo_severe_recurrente == true`, EN
      # DISJONCTION INDÉPENDANTE — pas conjoint à `hypoglycemie_recente`, à la différence des deux termes
      # « hypoglycémie récente + terrain/schéma » déjà présents. Motif : un antécédent RÉCURRENT et SÉVÈRE
      # est en lui-même le signal le plus fort de ce nœud sur le risque hypoglycémique — il n'a pas besoin
      # d'un épisode récent en plus pour justifier l'arrêt, exactement comme `insuline.yaml` l'agrège SEUL
      # (OR littéral, aucune conjonction) dans `risque_hypoglycemique_eleve`, qui pilote son équivalent de
      # désintensification (cf. son commentaire, `criteres_entree`) — inspiration, pas copie : ce nœud n'a
      # pas de dérivé équivalent, le terme est ajouté directement à la carte. Canal choisi (S19, § « choisir
      # le canal », GRAMMAIRE-NOEUD.md R8) : un terme de plus sur la carte d'ALLÈGEMENT existante — pas une
      # alerte de nœud (le fait doit ici changer la conduite, pas seulement informer), pas une exclusion sur
      # « Sulfamide — introduire » (retirer la classe à l'INTRODUCTION est un arbitrage référent distinct,
      # non donné, hors périmètre de cette session). Posé UNIQUEMENT sur « arrêter », pas sur « réduire la
      # posologie » (plus bas) : un antécédent aussi lourd appelle le geste le plus net déjà offert par ce
      # nœud pour ce médicament, pas son repli `bas_rang`.
      - "hba1c_sous_cible == true OR hypoglycemie_recente == true AND terrain_cible_assouplie == true OR hypoglycemie_recente == true AND risque_hypoglycemie_schema == eleve OR position_vs_cible == sous_objectif OR hypo_severe_recurrente == true"
    # P10/S3 (T-080) : garde technique de non-initiation. Les deux motifs suivants sont repris tels quels
    # de « Désintensifier » (mêmes branches, même texte). Quatrième motif ajouté 2026-08-07 (P14/S19,
    # T-192) sur le nouveau terme ci-dessus.
    motifs:
      "intention != initier AND traitements_en_cours contient sulfamide": "Sulfamide déjà en cours"
      "hypoglycemie_recente == true AND terrain_cible_assouplie == true": "Hypoglycémie récente, terrain gériatrique (âge, fragilité, espérance de vie)"
      "hypoglycemie_recente == true AND risque_hypoglycemie_schema == eleve": "Hypoglycémie récente, schéma à risque hypoglycémique élevé"
      "hypo_severe_recurrente == true": "Hypoglycémie sévère récurrente"
    priorite: 1
    famille: "Traitement à alléger"
    avantages:
      - "Une HbA1c sous 6,5 % sous sulfamide, ou une hypoglycémie/chute récente chez un sujet dont la cible a été assouplie, est un sur-traitement iatrogène qui se corrige à tout âge — la déprescription du sulfamide chez le sujet âgé a été testée en essai randomisé, sans excès d'hypoglycémie sévère (Grant 2025)."
      - "Le sulfamide n'a aucun bénéfice cardio-rénal propre : rien ne s'oppose à son retrait complet quand le contrôle glycémique n'en a plus besoin."
    inconvenients:
      - "Grant 2025 porte sur la déprescription de l'INSULINE ET/OU DU SULFAMIDE chez le sujet âgé (≥ 75 ans, HbA1c ≤ 8 %) : il ne publie pas de résultat isolé pour le seul arrêt du sulfamide, et l'absence de différence sur l'hypoglycémie sévère (4,7 % contre 6,5 %) n'est pas significative — c'est une preuve de sécurité de la démarche, pas un bénéfice démontré de l'arrêt lui-même."
      - "Surveiller la glycémie après l'arrêt et réévaluer l'HbA1c à environ 3 mois."
      - "Si le terrain s'y prête (indication cardio-rénale ou athéromateuse), un remplacement par un agent protecteur peut être préférable à un simple arrêt : cf. « Sulfamide — remplacer par un agent à bénéfice démontré »."
    effet_attendu: >-
      Réduit le risque d'hypoglycémie sévère sans dégradation démontrée du contrôle glycémique — dans le
      seul essai randomisé disponible, portant sur la déprescription de l'insuline et/ou du sulfamide chez
      le sujet âgé, hypoglycémie sévère 4,7 % sous allègement contre 6,5 % sans, différence non
      significative (Grant 2025). Aucun résultat n'est publié isolément pour le seul arrêt du sulfamide, et
      aucun essai n'a mesuré l'effet sur la mortalité ni sur les événements durs.
    niveau_preuve: faible
    references:
      - grant
    apercu: "arrêt sans décroissance (pas de sevrage progressif requis pour un insulinosécréteur, comme pour « Sulfamide (DFG < 30) ») ; à l'introduction d'un AR GLP‑1, arrêt si HbA1c ≤ 7,5 % (avis d'experts, JAMA Cardiol 2020)."
  - intitule: "Glinide"
    role: geste
    action: arreter
    conditions:
      - "intention != initier AND traitements_en_cours contient glinide"
      # QUATRIÈME TERME AJOUTÉ (2026-08-07, P14/S19, T-192) — MÊME MOTIF, MOT POUR MOT, que sur « Sulfamide
      # — arrêter » ci-dessus (cf. son commentaire complet) : `hypo_severe_recurrente == true` en
      # disjonction INDÉPENDANTE, posé UNIQUEMENT sur « arrêter » (pas sur « réduire la posologie »).
      - "hba1c_sous_cible == true OR hypoglycemie_recente == true AND terrain_cible_assouplie == true OR hypoglycemie_recente == true AND risque_hypoglycemie_schema == eleve OR position_vs_cible == sous_objectif OR hypo_severe_recurrente == true"
    # Motif ajouté 2026-08-07 (P14/S19, T-192) sur le nouveau terme ci-dessus.
    motifs:
      "intention != initier AND traitements_en_cours contient glinide": "Glinide déjà en cours"
      "hypoglycemie_recente == true AND terrain_cible_assouplie == true": "Hypoglycémie récente, terrain gériatrique (âge, fragilité, espérance de vie)"
      "hypoglycemie_recente == true AND risque_hypoglycemie_schema == eleve": "Hypoglycémie récente, schéma à risque hypoglycémique élevé"
      "hypo_severe_recurrente == true": "Hypoglycémie sévère récurrente"
    priorite: 1
    famille: "Traitement à alléger"
    avantages:
      - "Une HbA1c sous 6,5 % sous glinide, ou une hypoglycémie/chute récente chez un sujet dont la cible a été assouplie, est un sur-traitement iatrogène qui se corrige à tout âge : le principe général (HAS R.103 ; SFD Avis 5 bis ; ADA 13.14a‑c) s'applique au répaglinide comme aux autres agents sans bénéfice dur."
      - "Le glinide n'a aucun bénéfice cardio-rénal propre : rien ne s'oppose à son retrait complet quand le contrôle glycémique n'en a plus besoin."
      - "Demi-vie courte, prise prandiale : contrairement au sulfamide, aucun risque d'hypoglycémie prolongée par accumulation après l'arrêt."
    inconvenients:
      - "Aucun essai ne teste spécifiquement l'arrêt du répaglinide chez le sujet âgé ou en sur-contrôle : ce geste applique au glinide le principe général de désintensification, il n'est pas lui-même mesuré. Grant 2025, le seul essai randomisé disponible sur la déprescription des insulinosécréteurs du sujet âgé, porte sur l'insuline et le sulfamide — le répaglinide n'y figure pas."
      - "Surveiller la glycémie après l'arrêt et réévaluer l'HbA1c à environ 3 mois."
      - "Si le terrain s'y prête (indication cardio-rénale ou athéromateuse), un remplacement par un agent protecteur peut être préférable à un simple arrêt : cf. « Glinide — remplacer par un agent à bénéfice démontré »."
    effet_attendu: >-
      Non chiffrable pour le répaglinide spécifiquement : aucun essai ne documente l'arrêt du glinide. Le
      principe (sur-traitement corrigé sans dégradation démontrée du contrôle) s'appuie sur l'essai
      randomisé de déprescription des insulinosécréteurs du sujet âgé (Grant 2025), qui porte sur l'insuline
      et le sulfamide, pas sur le glinide — une extrapolation au glinide, pas une donnée qui lui soit
      propre.
    niveau_preuve: faible
    apercu: "suspension immédiate généralement bien tolérée (demi-vie courte, prise prandiale) — aucune donnée sourcée sur les modalités d'un arrêt programmé."
  # ---- Désintensification (porte : hba1c_sous_cible à tout âge, ou hypo récente sur terrain fragile) ----
  # RENOMMÉ le 2026-08-01 (arbitrage référent A2, cf. `meta.changelog`) : l'ancien intitulé — « Désintensifier :
  # alléger / arrêter le sulfamide, le glinide ou réduire l'insuline » — énumérait des GESTES PAR MOLÉCULE qui
  # sont mot pour mot ceux des cartes « Remplacer le sulfamide » (plus haut) et « Réduire la posologie du
  # sulfamide » / « Réduire la posologie de l'insuline » (plus bas) : chez un patient sous sulfamide avec
  # hypoglycémie récente, trois cartes portaient sur le même agent sans que le praticien puisse les distinguer
  # au libellé. Or cette option n'est pas un geste de posologie : c'est un geste de STRATÉGIE — relâcher la
  # cible glycémique et alléger la charge thérapeutique globale (cf. `avantages` : « sur-traitement
  # iatrogène — déprescrire à TOUT ÂGE », HAS R.103, SFD Avis 5 bis). Le nouvel intitulé porte ce niveau de
  # décision, pas la liste des molécules concernées. AUCUNE `conditions`/`exclusions`/`priorite`/`famille`
  # n'a changé : seul le libellé bouge. La question de savoir si ces trois cartes doivent en plus être
  # rendues mutuellement exclusives reste un arbitrage clinique distinct, documenté mais non tranché ici
  # (cf. `meta.changelog`).
  - intitule: "Désintensifier : alléger la charge thérapeutique"
    role: geste
    # GÉNÉRALISATION position_vs_cible (2026-07-26, 4e série, red-team clinique silences F1,
    # GRAMMAIRE-NOEUD.md R1) : `position_vs_cible == sous_objectif` — l'ÉTAT DÉCLARÉ de sur-traitement,
    # introduit précisément pour capter ce cas sans dépendre du seuil absolu `hba1c_sous_cible` (< 6,5 %,
    # cf. commentaire du critère `cible_atteinte`) — ne pilotait jusqu'ici QUE la déprescription de la
    # metformine (`metformine_deprescriptible`). Un sur-traitement DÉCLARÉ sur l'insuline seule (sans
    # franchir le seuil absolu) ne déclenchait donc AUCUN allègement — défaut relevé par l'audit sur un
    # profil ASCVD + DFG 46 + sous_objectif + insuline seule, non fragile.
    # Ajouté ici SANS exiger la fragilité : elle ne conditionne que la déprescription de la metformine
    # (dernier agent réputé « sûr » à garder, cf. son propre commentaire), pas l'allègement de l'insuline.
    #
    # RESTREINTE AUX INSULINES le 2026-08-06 (P14/S6, T-185 étape 4, décision référent « les deux, avec
    # périmètres redécoupés ») : cette carte portait AUSSI le sulfamide et le glinide, sans les nommer ni
    # porter de badge d'action — R3/R6 (GRAMMAIRE-NOEUD.md) veulent un verdict par ligne, nommé. Les deux
    # médicaments partent désormais sur leurs cartes dédiées (« Sulfamide/Glinide — arrêter », plus haut),
    # qui reprennent EXACTEMENT la même situation déclenchante. Second item de `conditions` réduit à
    # l'insuline seule ; les deux motifs `sulfamide`/`glinide` du bloc `motifs` ci-dessous partent avec eux
    # (I24 : une clé de `motifs` sans branche est un défaut).
    conditions:
      # SCISSION I4 (2026-07-27, 6e série) : l'ex-`terrain_fragile` valait
      # `terrain_cible_assouplie OR risque_hypoglycemie_schema == eleve`. La disjonction est reconstruite ici
      # terme à terme — même valeur de vérité, deux motifs désormais lisibles séparément : le terrain
      # gériatrique d'un côté, le schéma hypoglycémiant de l'autre.
      - "hba1c_sous_cible == true OR hypoglycemie_recente == true AND terrain_cible_assouplie == true OR hypoglycemie_recente == true AND risque_hypoglycemie_schema == eleve OR position_vs_cible == sous_objectif"
      - "intention != initier AND traitements_en_cours contient insuline_basale OR intention != initier AND traitements_en_cours contient insuline_rapide"
    # P10/S3 (T-080) : quatre motifs — les deux branches reconstruites par la scission I4 ci-dessus
    # (chacune un couple de deux atomes décrivant une seule situation clinique) et les deux gardes
    # techniques de non-initiation restants (un par forme d'insuline), depuis le retrait du sulfamide/
    # glinide de cette carte (T-185, cf. commentaire ci-dessus).
    motifs:
      "hypoglycemie_recente == true AND terrain_cible_assouplie == true": "Hypoglycémie récente, terrain gériatrique (âge, fragilité, espérance de vie)"
      "hypoglycemie_recente == true AND risque_hypoglycemie_schema == eleve": "Hypoglycémie récente, schéma à risque hypoglycémique élevé"
      "intention != initier AND traitements_en_cours contient insuline_basale": "Insuline basale déjà en cours"
      "intention != initier AND traitements_en_cours contient insuline_rapide": "Insuline rapide déjà en cours"
    priorite: 1
    famille: "Traitement à alléger"
    avantages:
      - "Réduit les hypoglycémies sévères et les chutes sans dégrader le contrôle (Grant 2025 ; ADA 13.14a‑c ; HAS R.103 ; SFD Avis 5 bis)."
      - "Une HbA1c sous 6,5 % sous insuline est un sur‑traitement iatrogène : il se corrige à tout âge."
      - "Le geste combine deux leviers, pas un seul : réduire la dose d'insuline, ET relâcher la cible glycémique fixée pour ce patient."
      - "Une hypoglycémie ou une chute récente chez un sujet fragile suffit à justifier l'allègement, même à HbA1c normale : l'HbA1c seule prédit mal l'hypoglycémie, chez le patient sous insuline (HYPOAGE)."
    inconvenients:
      - "Preuve faible, largement fondée sur un accord d'experts : aucun essai ne mesure l'effet de l'allègement sur des critères durs."
      - "Surveiller la glycémie après l'allègement et réévaluer l'HbA1c à environ 3 mois."
    effet_attendu: >-
      Réduit le risque d'hypoglycémie sévère sans dégradation du contrôle — dans le seul essai randomisé
      disponible, portant sur la déprescription de l'insuline et/ou du sulfamide chez le sujet âgé,
      hypoglycémie sévère 4,7 % sous allègement contre 6,5 % sans, différence non significative (Grant
      2025). Aucun essai n'a mesuré l'effet sur la mortalité ni sur les événements durs.
    niveau_preuve: faible
    references:
      - grant
      - hypoage
    contre_indications:
      - "Ne JAMAIS retirer un iSGLT2 ni un AR GLP‑1 pour alléger : leur bénéfice cardio‑rénal est maintenu quelle que soit la glycémie (ADA 13.14d, grade A)."
      # TITRES CORRIGÉS (2026-08-06, contre-relecture rédactionnelle) : les deux intitulés cités —
      # « Sulfamide/Glinide — arrêter » et « Sulfamide/Glinide — réduire la posologie » — n'existent pas ;
      # ce sont quatre cartes distinctes, nommées ici une par une.
      - "Ce geste ne cible que l'excès d'insuline : pour le sulfamide et le glinide, cf. « Sulfamide — arrêter », « Glinide — arrêter », « Sulfamide — réduire la posologie » et « Glinide — réduire la posologie »."
  # ---- Déprescrire par RÉDUCTION de dose (distinct par traitement ; le praticien juge la dose, S8) -------
  # RETITRÉE le 2026-08-06 (contre-relecture rédactionnelle) : l'intitulé « Insuline », nu, était le seul
  # de cette famille de réductions à ne pas nommer le geste, au milieu de « AR GLP‑1 — réduire la
  # posologie », « Tirzépatide — réduire la posologie », « Sulfamide — réduire la posologie » et
  # « Glinide — réduire la posologie ». Aucune condition ni aucun rang ne bouge.
  - intitule: "Insuline"
    role: geste
    action: reduire
    # GÉNÉRALISATION position_vs_cible (2026-07-26, 4e série, red-team clinique silences F1) : voir le
    # commentaire de « Désintensifier » plus haut pour la justification complète — même ajout, même
    # raison, sans exigence de fragilité.
    conditions:
      - "intention != initier AND traitements_en_cours contient insuline_basale OR intention != initier AND traitements_en_cours contient insuline_rapide"
      - "hba1c_sous_cible == true OR hypoglycemie_recente == true OR intention != initier AND intolerance_traitement == true OR position_vs_cible == sous_objectif"
    # P10/S3 (T-080) : trois motifs sur les gardes techniques de non-initiation, mêmes textes qu'ailleurs
    # dans ce nœud pour les mêmes branches.
    motifs:
      "intention != initier AND traitements_en_cours contient insuline_basale": "Insuline basale déjà en cours"
      "intention != initier AND traitements_en_cours contient insuline_rapide": "Insuline rapide déjà en cours"
      "intention != initier AND intolerance_traitement == true": "Intolérance à un traitement en cours"
    priorite: 1
    famille: "Traitement à alléger"
    avantages:
      - "Réduire plutôt qu'arrêter : diminue le risque d'hypoglycémie (sur‑basalisation, sujet fragile) sans sevrer un patient qui en a besoin. Le praticien juge la dose (aucun dosage imposé). Le réglage fin du schéma se poursuit ensuite au long cours."
    inconvenients:
      - "Surveiller la glycémie après la baisse ; contrôle volontairement un peu moins strict (assumé)."
    effet_attendu: "Moins d'hypoglycémie sans sevrage complet ; effet non chiffrable."
    niveau_preuve: faible
    # AJOUT T-126 (P12/S6, 2026-08-03) — rapport OpenEvidence du 2026-08-02, cf. `meta.changelog`. Deux
    # registres délibérément distingués (cf. bilan de session) : le chiffre n'existe QU'EN CONTEXTE DE
    # RELAIS thérapeutique (introduction d'un autre agent) — jamais pour un allègement isolé chez le sujet
    # âgé (vignette N7 de la recette du 02/08 : « je baisse les 12 UI de combien ? » reste À DESSEIN sans
    # réponse chiffrée hors relais, cette carte étant l'une des trois affichées sur ce profil).
    apercu: "en relais thérapeutique (introduction d'un autre agent) : −10 à −20 %, ou −20 à −30 % si à l'objectif ou hypoglycémie — jamais d'arrêt brutal sans relais (avis d'experts, AAFP 2026 / JAMA Cardiol 2020) ; en allègement isolé hors relais : au jugement clinique, aucun rythme chiffré sourcé."
  - intitule: "AR GLP‑1"
    role: geste
    action: reduire
    conditions:
      - "intention != initier AND traitements_en_cours contient aGLP1"
      - "denutrition == true OR intention != initier AND intolerance_traitement == true AND nature_intolerance contient perte_poids OR intention != initier AND intolerance_traitement == true AND nature_intolerance contient digestive"
    # P10/S3 (T-080) : garde technique de non-initiation, et les deux branches qui empilent trois atomes
    # pour décrire chacune une seule situation clinique (intolérance de nature donnée).
    motifs:
      "intention != initier AND traitements_en_cours contient aGLP1": "AR GLP‑1 déjà en cours"
      "intention != initier AND intolerance_traitement == true AND nature_intolerance contient perte_poids": "Intolérance avec perte de poids excessive"
      "intention != initier AND intolerance_traitement == true AND nature_intolerance contient digestive": "Intolérance digestive"
    priorite: 2
    famille: "Traitement à alléger"
    avantages:
      - "Réduire plutôt qu'arrêter préserve une partie du bénéfice tout en limitant la perte de poids excessive ou les troubles digestifs. Le praticien juge la dose."
    inconvenients:
      - "Si la perte de poids ou la dénutrition est marquée : envisager l'arrêt. Réévaluer l'état nutritionnel."
    effet_attendu: >-
      L'effet d'une réduction de dose n'a pas été mesuré. Ce qui l'a été, c'est l'arrêt complet : environ
      50 % de la baisse d'HbA1c est reprise en 8 à 12 semaines, et environ 60 % du poids perdu est repris
      à 52 semaines (EClinicalMedicine 2026). C'est l'argument pour réduire plutôt que pour arrêter.
    niveau_preuve: faible
    # AJOUT T-126 (P12/S6, 2026-08-03) — rapport OpenEvidence du 2026-08-02, cf. `meta.changelog`. Les
    # CHIFFRES sont remontés dans `effet_attendu` (c'est ce que les données ont mesuré) ; il ne reste ici
    # que la modalité pratique du geste.
    apercu: "réduire plutôt qu'arrêter ; surveiller le poids et l'HbA1c 4 à 12 semaines après le geste."
  - intitule: "Tirzépatide"
    role: geste
    action: reduire
    conditions:
      - "intention != initier AND traitements_en_cours contient tirzepatide"
      - "denutrition == true OR intention != initier AND intolerance_traitement == true AND nature_intolerance contient perte_poids OR intention != initier AND intolerance_traitement == true AND nature_intolerance contient digestive"
    # P10/S3 (T-080) : mêmes motifs que sur « Réduire la posologie de l'AR GLP‑1 » ci-dessus (branches
    # identiques, seule la classe change).
    motifs:
      "intention != initier AND traitements_en_cours contient tirzepatide": "Tirzépatide déjà en cours"
      "intention != initier AND intolerance_traitement == true AND nature_intolerance contient perte_poids": "Intolérance avec perte de poids excessive"
      "intention != initier AND intolerance_traitement == true AND nature_intolerance contient digestive": "Intolérance digestive"
    priorite: 2
    famille: "Traitement à alléger"
    avantages:
      - "Même logique que l'AR GLP‑1 : réduire avant d'arrêter en cas de perte de poids excessive ou d'intolérance. Le praticien juge la dose."
    inconvenients:
      - "Si la dénutrition est marquée : arrêt et réévaluation nutritionnelle."
    effet_attendu: >-
      L'effet d'une réduction de dose n'a pas été mesuré. Ce qui l'a été, c'est l'arrêt complet, avec la
      même cinétique de reprise que sous AR GLP‑1 : environ 50 % de la baisse d'HbA1c et environ 60 % du
      poids perdu sont repris (SURMOUNT‑4, JAMA Intern Med 2025). C'est l'argument pour réduire plutôt que
      pour arrêter.
    niveau_preuve: faible
    # AJOUT T-126 (P12/S6, 2026-08-03) — rapport OpenEvidence du 2026-08-02, cf. `meta.changelog`. Les
    # CHIFFRES sont remontés dans `effet_attendu` ; `apercu` ne garde que la modalité pratique.
    apercu: "réduire plutôt qu'arrêter ; surveiller le poids et l'HbA1c 4 à 12 semaines après le geste."
  # ---- SCISSION SULFAMIDE / GLINIDE (2026-07-26, 5e série) --------------------------------------------
  # Ces deux gestes étaient portés par UNE SEULE option (« Réduire la posologie du sulfamide / du
  # glinide »), ce qui a fait porter au glinide l'exclusion `DFG < 30` destinée au SEUL sulfamide
  # (garde-fou HAUTE-1 de la 4e série). Question posée par le référent, tranchée sur source primaire —
  # `docs/decision/validation/chantier-2026-07-26/rcp-glinide-insuffisance-renale.md`. Les deux classes
  # ont un comportement rénal OPPOSÉ :
  #   - SULFAMIDE : contre-indication RCP formelle (gliclazide ET glimépiride, rubrique 4.3
  #     « insuffisance rénale ou hépatique sévère » ; mécanisme en 4.4 : « l'hypoglycémie pouvant être
  #     prolongée »). Le seuil chiffré « DFG < 30 » reste une convention KDIGO/SFD — le RCP dit
  #     « sévère » sans valeur, cf. `incertitudes` ;
  #   - RÉPAGLINIDE (seul glinide commercialisé en France depuis le retrait européen du natéglinide, avril
  #     2022) : AUCUNE contre-indication rénale en 4.3. Élimination hépatobiliaire (8 % seulement par voie
  #     rénale) ; en insuffisance rénale sévère (20-39 ml/min) l'exposition double (ASC ×2, rubrique 5.2)
  #     et le RCP en tire une PRUDENCE POSOLOGIQUE — c'est-à-dire exactement le geste que cette option
  #     propose, pas ce qui l'interdit.
  # L'option unique retirait donc au patient sous glinide le geste que son propre RCP recommande. Affiner
  # l'exclusion sur une option unique (`contient sulfamide AND DFG < 30`) aurait rétabli la contradiction
  # HAUTE-1 pour un patient sous les DEUX molécules — la liste `traitements_en_cours` l'autorise. D'où la
  # scission, qui suit d'ailleurs le modèle déjà appliqué au sulfamide (« Arrêter le sulfamide » est une
  # option distincte). Pas d'option « Arrêter le glinide » en miroir : sans contre-indication RCP, aucun
  # fondement à un arrêt motivé par le seul DFG (R3 — un arrêt est un geste, il lui faut une indication).
  - intitule: "Sulfamide — réduire la posologie"
    role: geste
    action: reduire
    # BAS RANG (2026-08-06, P14/S6, T-169, décision référent) : conduite faute de mieux quand le patient ne
    # veut pas changer de traitement, ou quand plus aucun agent à bénéfice dur n'est disponible à ajouter —
    # cf. `Option.bas_rang` (`node.types.ts`). Pilote une étiquette + un atténuement visuel, aucun effet sur
    # la sélection, le tri ni le badge.
    bas_rang: true
    # GÉNÉRALISATION position_vs_cible (2026-07-26, 4e série, red-team clinique silences F1) : voir le
    # commentaire de « Désintensifier » plus haut pour la justification complète — même ajout (l'ÉTAT
    # DÉCLARÉ de sur-traitement `sous_objectif` ouvre aussi cet allègement, sans exiger la fragilité, qui
    # ne conditionne que la déprescription de la metformine).
    conditions:
      - "intention != initier AND traitements_en_cours contient sulfamide"
      # ÉLARGI le 2026-08-06 (P14/S6, T-169, décision référent) : troisième terme ajouté — la « réduction »
      # doit aussi être disponible quand le patient est DÉJÀ sous les deux classes à bénéfice dur (iSGLT2 ET
      # AR GLP‑1) et n'a donc plus d'agent protecteur à ajouter en échange du sulfamide. Réutilise
      # `isglt2_indisponible`/`aglp1_indisponible`, déjà vrais quand le patient PREND DÉJÀ la classe (leur
      # `derive` porte `intention != initier AND traitements_en_cours contient …`, cf. leur commentaire dans
      # `criteres_entree`) — aucun nouveau critère, exactement la consigne référent.
      - "intention != initier AND intolerance_traitement == true OR hypoglycemie_recente == true OR position_vs_cible == sous_objectif OR isglt2_indisponible == true AND aglp1_indisponible == true"
    # P10/S3 (T-080) : deux motifs sur les gardes techniques de non-initiation, mêmes textes qu'ailleurs
    # dans ce nœud pour les mêmes branches. Motif ajouté le 2026-08-06 (T-169) sur le nouveau terme,
    # texte repris tel quel des cartes « place résiduelle » (même concept, même phrase, cf. plus bas).
    motifs:
      "intention != initier AND traitements_en_cours contient sulfamide": "Sulfamide déjà en cours"
      "intention != initier AND intolerance_traitement == true": "Intolérance à un traitement en cours"
      "isglt2_indisponible == true AND aglp1_indisponible == true": "Aucune classe protectrice disponible (iSGLT2, AR GLP‑1)"
    # GARDE-FOU (2026-07-26, 4e série, red-team clinique sécurité HAUTE-1) : sans cette exclusion, cette
    # option coexistait avec « Arrêter le sulfamide (DFG < 30) » — deux gestes CONTRADICTOIRES affichés
    # ensemble sur le même agent (« réduire » suggère de le garder à dose moindre, « arrêter » dit qu'il
    # est contre-indiqué). Miroir exact du garde-fou déjà en place sur « Réduire la posologie de la
    # metformine » (ci-dessus) et sur « Remplacer le sulfamide » (`exclusions: DFG < 30`, plus bas).
    exclusions:
      - "DFG < 30"
    priorite: 2
    famille: "Traitement à alléger"
    avantages:
      - "Réduire la dose limite l'hypoglycémie tout en gardant l'effet glycémique. Le praticien juge la dose."
    inconvenients:
      # RENVOI CORRIGÉ (2026-08-06, contre-relecture rédactionnelle) : « la désintensification » ne porte
      # plus l'arrêt du sulfamide depuis le redécoupage du 2026-08-06 — il a sa propre carte.
      - "En sur‑contrôle franc (HbA1c sous 6,5 %), ou après une hypoglycémie ou une chute chez un sujet fragile, préférer l'arrêt complet à une simple baisse de dose — cf. « Sulfamide — arrêter »."
      - "Le sulfamide n'a aucun bénéfice d'organe : si le terrain s'y prête, un remplacement par un agent protecteur vaut mieux qu'une simple baisse de dose."
    effet_attendu: >-
      Aucun essai n'a mesuré l'effet d'une réduction de dose de sulfamide. Le bénéfice attendu — moins
      d'hypoglycémies — est déduit de la relation dose‑effet, jamais chiffré.
    niveau_preuve: faible
    # AJOUT T-126 (P12/S6, 2026-08-03) — rapport OpenEvidence du 2026-08-02, cf. `meta.changelog`. Même
    # distinction relais/allègement isolé que sur « Réduire la posologie de l'insuline » ci-dessus, et pour
    # la même raison (vignette N7 : cette carte y est affichée hors tout contexte de relais AR GLP‑1 — il
    # y est d'ailleurs écarté par IMC < 22 et dénutrition).
    # RÉPARTI le 2026-08-06 (P14/S6, T-185, étape 3) : la PART ARRÊT du schéma JAMA Cardiol 2020
    # (« arrêt si HbA1c ≤ 7,5 % ») appartient désormais à la carte dédiée « Sulfamide — arrêter » ; ne
    # reste ici que la part RÉDUCTION (7,6-8,5 %) et la part MAINTIEN (> 8,5 %, contexte qui justifie de
    # NE PAS réduire pour l'instant) — répartition, aucune duplication, aucun chiffre changé.
    apercu: "à l'introduction d'un AR GLP‑1 : −50 % si HbA1c 7,6-8,5 % · maintien de la dose si > 8,5 % (avis d'experts, JAMA Cardiol 2020) ; en allègement isolé hors relais : au jugement clinique, aucun rythme chiffré sourcé."
  - intitule: "Glinide — réduire la posologie"
    role: geste
    action: reduire
    # BAS RANG (2026-08-06, P14/S6, T-169, décision référent) : même motif que sur « Sulfamide — réduire la
    # posologie » ci-dessus (cf. son commentaire) — conduite faute de mieux, `Option.bas_rang`.
    bas_rang: true
    conditions:
      - "intention != initier AND traitements_en_cours contient glinide"
      # ÉLARGI le 2026-08-06 (P14/S6, T-169, décision référent) — même correctif, même motif que sur
      # « Sulfamide — réduire la posologie » ci-dessus (cf. son commentaire complet).
      - "intention != initier AND intolerance_traitement == true OR hypoglycemie_recente == true OR position_vs_cible == sous_objectif OR isglt2_indisponible == true AND aglp1_indisponible == true"
    # P10/S3 (T-080) : deux motifs sur les gardes techniques de non-initiation, mêmes textes qu'ailleurs
    # dans ce nœud pour les mêmes branches. Motif ajouté le 2026-08-06 (T-169) sur le nouveau terme.
    motifs:
      "intention != initier AND traitements_en_cours contient glinide": "Glinide déjà en cours"
      "intention != initier AND intolerance_traitement == true": "Intolérance à un traitement en cours"
      "isglt2_indisponible == true AND aglp1_indisponible == true": "Aucune classe protectrice disponible (iSGLT2, AR GLP‑1)"
    # AUCUNE exclusion rénale, DÉLIBÉRÉMENT (cf. le commentaire de scission ci-dessus) : le RCP du
    # répaglinide ne porte aucune contre-indication rénale, et le geste qu'il recommande en insuffisance
    # rénale sévère EST la réduction de dose. L'alerte ci-dessous porte le fait de sécurité (exposition
    # doublée) sur le canal correct — une alerte d'OPTION, puisqu'elle ne vaut que si ce geste est
    # effectivement proposé (D21).
    alertes:
      - quand: "DFG < 40"
        niveau: attention
        message: >-
          Insuffisance rénale sévère : l'exposition au répaglinide — son aire sous la courbe (ASC) — et sa
          demi-vie DOUBLENT (ASC ×2 mesurée entre 20 et 39 ml/min, RCP rubrique 5.2), et la sensibilité à
          l'insuline est majorée. Réduire la dose et renforcer la surveillance des hypoglycémies. Ce n'est
          PAS une contre-indication : le RCP n'en porte aucune sur le rein, contrairement au sulfamide — il
          conclut à la prudence posologique.
    priorite: 2
    famille: "Traitement à alléger"
    avantages:
      - "Réduire la dose limite l'hypoglycémie tout en gardant l'effet glycémique. Le praticien juge la dose."
      - "Reste utilisable quand le sulfamide ne l'est plus : élimination hépatobiliaire (8 % seulement par voie rénale), aucune contre‑indication rénale au RCP."
    inconvenients:
      # RENVOI CORRIGÉ (2026-08-06, contre-relecture rédactionnelle) : cf. la carte « Sulfamide — réduire
      # la posologie », même correctif — l'arrêt du glinide a désormais sa propre carte.
      - "En sur‑contrôle franc (HbA1c sous 6,5 %), ou après une hypoglycémie ou une chute chez un sujet fragile, préférer l'arrêt complet à une simple baisse de dose — cf. « Glinide — arrêter »."
      - "Le glinide n'a aucun bénéfice d'organe : si le terrain s'y prête, un remplacement par un agent protecteur vaut mieux qu'une simple baisse de dose."
      - "Une prise à chaque repas : l'observance est plus exigeante."
      - "Le RCP ne documente pas le comportement de la molécule en dessous de 20 ml/min."
    effet_attendu: >-
      Aucun essai n'a mesuré l'effet d'une réduction de dose de répaglinide. Le bénéfice attendu — moins
      d'hypoglycémies — est déduit de la relation dose‑effet et de l'exposition doublée en insuffisance
      rénale sévère, jamais chiffré.
    niveau_preuve: faible
    # AJOUT T-126 (P12/S6, 2026-08-03) — rapport OpenEvidence du 2026-08-02, cf. `meta.changelog`. Registre
    # repris littéralement de l'apercu d'`insuline.yaml` sur « Désintensifier / alléger le schéma » (« Lire »
    # de la session) : le gabarit validé pour un cas sans donnée.
    apercu: "réduire au jugement clinique — aucun rythme chiffré sourcé pour la déprescription programmée (demi-vie courte, prise prandiale : une suspension immédiate est généralement bien tolérée)."
  # ---- Déprescription de la metformine (arbitrage référent 2026-07-26, 2e série) -----------------------
  - intitule: "Metformine (désintensification)"
    role: geste
    action: arreter
    # DÉCISION RÉFÉRENT (2026-07-26, 2e série) : arbitrage resté ouvert depuis la capture 6. Trois
    # conditions cumulatives, portées par `metformine_deprescriptible` (voir son commentaire dans
    # `criteres_entree` pour le détail — notamment la lecture stricte appliquée à l'insuline, une
    # interprétation de l'orchestrateur à confirmer/corriger par le référent). `contient metformine` est
    # une précondition structurelle évidente (même convention que les autres options « Arrêter/Réduire la
    # metformine » ci-dessus), pas une 4e condition clinique.
    conditions:
      - "intention != initier AND traitements_en_cours contient metformine"
      - "metformine_deprescriptible == true"
    # P10/S3 (T-080) : même motif que sur « Arrêter la metformine » — garde technique de non-initiation.
    # `metformine_deprescriptible` n'en reçoit pas : son libellé (`labels.ts`) énumère déjà les trois
    # conditions cumulatives en clair, un motif n'y ajouterait rien.
    motifs:
      "intention != initier AND traitements_en_cours contient metformine": "Metformine déjà en cours"
    priorite: 3
    famille: "Traitement à alléger"
    avantages:
      - "Chez ce patient, tous les autres agents en place — iSGLT2, AR GLP‑1, tirzépatide — apportent un bénéfice d'organe démontré et sont à conserver (ADA 13.14d)."
      - "La metformine est alors l'agent dont le bénéfice propre est le plus faible : c'est elle qu'on retire en premier."
      - "Réduit la charge médicamenteuse — comprimés, effets digestifs — sans toucher à la protection cardio‑rénale et athéromateuse, portée par les agents conservés."
    inconvenients:
      - "Écart déclaré avec la recommandation officielle française : la HAS maintient la metformine comme socle quelles que soient les comorbidités, y compris chez le sujet fragile."
      - "Cet écart repose sur l'ABSENCE de bénéfice démontré sur critère dur contre placebo (Griffin 2017) et sur un niveau de preuve faible. C'est une position raisonnée de l'outil, sous trois conditions strictes, et non une recommandation de la HAS, de la SFD ou de l'ADA."
      - "Tant qu'un agent sans bénéfice dur reste en place — sulfamide, gliptine, glinide, insuline comprise —, c'est celui-là qu'on allège, qu'on remplace ou qu'on arrête en premier : la metformine, malgré son bénéfice propre faible, reste la valeur la plus sûre du traitement conservé."
      - "Cas type : un sur‑traité fragile sous insuline. C'est l'insuline qu'on allège d'abord, pas la metformine."
      - "Réévaluer le contrôle glycémique après l'arrêt."
    effet_attendu: >-
      Simplification thérapeutique sans perte de protection d'organe : celle-ci est portée par les agents
      conservés, tous à bénéfice dur. Le retrait lui-même ne fait perdre aucun bénéfice sur critère dur —
      la metformine n'en a pas démontré contre placebo (Griffin 2017).
    niveau_preuve: faible
    references:
      - griffin-metformine
    contre_indications:
      - "Ne jamais retirer un agent protecteur — iSGLT2, AR GLP‑1, tirzépatide — à la place de la metformine pour alléger le traitement."
      - "Si un agent sans bénéfice dur, insuline comprise, est encore en place, c'est lui qu'on allège en priorité."
    # AJOUT T-126 (P12/S6, 2026-08-03) — rapport OpenEvidence du 2026-08-02, cf. `meta.changelog`. Même
    # gabarit « pas de donnée » que sur « Réduire la posologie du glinide » ci-dessus, verbe « arrêter »
    # au lieu de « réduire » (cette option est un `action: arreter`, cf. `metformine_deprescriptible`
    # pour les trois conditions cumulatives qui la déclenchent).
    apercu: "arrêter au jugement clinique — aucun rythme chiffré sourcé pour la déprescription programmée."
  - intitule: "Reconsidérer un agent protecteur hors indication"
    role: geste
    conditions:
      - "intention != initier AND traitements_en_cours contient iSGLT2 AND ASCVD_etablie == false AND insuffisance_cardiaque == false AND DFG >= 60 AND albuminurie == normo AND infections_uro_genitales_recidivantes == true"
    # P10/S3 (T-080) : motif sur une conjonction à six termes qui décrit en fait une seule situation
