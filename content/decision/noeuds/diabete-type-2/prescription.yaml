    - date: "2026-08-05"
      auteur: "Claude Code — en attente de relecture clinique"
      resume: >-
        PASSE DE RÉDACTION SUR LES QUATRE NIVEAUX DE LECTURE. Aucune `conditions`, `prerequis`,
        `exclusions`, `priorite`, `role`, `famille`, `action`, `action_si`, `bas_rang`, `calculs`,
        `criteres_entree`, `familles`, `contraintes[].expression`, clé de `motifs` ni `quand` d'alerte
        n'a bougé : seuls des textes affichés, les `references` de quatre options, et le `titre`.
        A · CONTRADICTIONS CLINIQUES (5). « Envisager l'insuline » disait qu'en rénal sévère « un AR GLP‑1
        ou la sitagliptine à dose adaptée » restaient utilisables — contredit par l'alerte de place
        résiduelle, par l'argumentaire et par le dossier (la sitagliptine 25 mg n'est pas commercialisée
        en France) : aligné sur la vildagliptine 50 mg/j, ici et dans le .md (§ palette glycémique). Le
        sémaglutide oral cessait d'être proposé comme repli au patient qui refuse les injections
        (contre-indications de l'AR GLP‑1 + alerte « refus des injections ») : remplacé par les classes
        orales réellement dispensées en France, avec le motif (avis HAS défavorable au remboursement) ;
        « iDPP4 » harmonisé en « gliptine » dans l'alerte, la position officielle et le titre Tran/Kramer.
        Le glinide rejoint le sulfamide et la gliptine dans le principe n° 1 (`argumentaire` + .md).
        « HbA1c sous 6,5 % sous sulfamide, glinide ou insuline » harmonisé avec le .md sur la formulation
        que le dossier soutient : « sous agent hypoglycémiant », suivi de l'énumération. L'argument COÛT
        retiré des deux textes de la carte metformine — la synthèse critique le dit inopérant en France.
        B · BADGE DE PREUVE INTERPRÉTABLE (3). Un paragraphe fixe ajouté à `argumentaire` et une section
        « Comment lire le niveau de preuve affiché sur une carte » au .md : le niveau qualifie la
        CERTITUDE DE LA DONNÉE, pas la force de la conduite — les quatre cartes de sécurité restent en
        preuve faible sans que le geste soit discutable. `niveau_preuve` INCHANGÉ partout. `delai_benefice`
        ajouté sur « Gliptine [remplacer] », « Sulfamide [remplacer] » et « Glinide [remplacer] » : c'est
        celui du REMPLAÇANT, recopié tel quel des deux options d'ajout (16-26 mois iSGLT2 ; 2 à 5,4 ans
        AR GLP‑1), puisque c'est lui qui porte le bénéfice attendu. L'horizon du NNT 45 de CAROLINA et
        celui de SURPASS-CVOT ne sont écrits nulle part dans ce dossier : NON POSÉS, à arbitrer.
        `delai_benefice` de l'iSGLT2 dédoublé (16-26 mois sur l'IC ; 2,4 ans sur le rein) et
        l'`effet_attendu` dit explicitement que les deux chiffres portent sur des critères différents.
        C · CHAQUE TEXTE À SON NIVEAU (4). Les quatre `effet_attendu: "non chiffrable"` (AR GLP‑1 réduire,
        tirzépatide réduire, sulfamide réduire, glinide réduire) disent maintenant CE QUI A ÉTÉ MESURÉ —
        les chiffres de reprise à l'arrêt remontent d'`apercu` vers `effet_attendu`, `apercu` ne garde que
        la modalité ; pour les deux sécrétagogues, l'absence de mesure est dite avec son motif. Posologies
        déplacées d'`avantages` vers `posologie_detail` : trois puces de titration AR GLP‑1, une puce de
        doses iSGLT2. Posologies déplacées de `contre_indications` vers `apercu` + `posologie_detail` :
        sitagliptine/vildagliptine (gliptine de repli), gliclazide/glimépiride (sulfamide de repli).
        « Insuline d'initiation » reçoit une dose de départ — 0,1 à 0,2 U/kg/j, repli 10 U le soir —
        RECOPIÉE de l'option d'instauration basale d'`insuline.yaml` (même geste), jamais recalculée.
        La puce de 150 mots sur les réserves de Huang & Yeh est réduite à trois lignes, le détail restant
        au .md où il figure déjà mot pour mot.
        D · TRAÇABILITÉ (2). Essais nommés à l'écran mais absents de `references_primaires` : EXAMINE,
        CARMELINA, DURATION-8, Pratley 2012, SIMPLE, ORIGIN et Boussageon 2012 (4 occurrences) — leur NOM
        est retiré du texte affiché, l'énoncé clinique conservé. Aucun DOI ni aucune année inventés.
        `references` câblées là où l'id existait déjà : `grant` + `hypoage` sur « Désintensifier »,
        `griffin-metformine` sur les deux cartes metformine. Titres de références ramenés au gabarit
        (Huang & Yeh 95 mots → 40, Marbury, Mannucci, Leonard) : les réserves méthodologiques descendent
        au .md, où elles étaient déjà ; la parenthèse de correction de PMID disparaît du titre Leonard.
        E · LE CONTENU PARLE DU PATIENT (4). Noms de champs YAML retirés des textes affichés
        (`sous_objectif`, `sources.reco_officielle`, `niveau_preuve`, `metformine_deprescriptible`,
        `hba1c_sous_cible` ×2, « gate catabolique », « par construction ») — zéro occurrence restante,
        vérifiée. Descriptions du moteur retirées ou reformulées côté patient (« rang remonté si… », « le
        rang remonte alors », « déclenchée aussi par… », « cette carte est écartée », « ne jamais la
        présenter comme un consensus officiel »). Renvois vers des intitulés qui n'existent plus après le
        raccourcissement des titres : tous vérifiés un à un contre la liste réelle des 28 options, et
        SUPPRIMÉS au profit de phrases qui se suffisent (les titres courts « iSGLT2 », « Insuline »,
        « Glinide », « Gliptine » sont ambigus — trois cartes s'appellent « Gliptine »). Trois
        `incertitudes` qui décrivaient l'outil et non la donnée déplacées dans `cadrage`.
        F · REDITES MOTEUR ↔ CONTENU (2). Énumérations de déclencheurs retirées des `avantages` de
        « Reconsidérer un agent protecteur hors indication » (conjonction à six termes recopiée),
        « Metformine [réduire] », iSGLT2, AR GLP‑1 et tirzépatide : ne reste que ce que l'option APPORTE.
        L'exclusion IMC < 22 / dénutrition de l'AR GLP‑1, écrite quatre fois, ne l'est plus qu'aux deux
        niveaux distincts qui la portent légitimement : `contre_indications` (niveau 2, canal le plus
        fort) et la divergence déclarée (niveau 3, dont c'est le sujet même). Motifs négatifs ou
        circulaires reformulés en fait clinique — « Pas de sur-contrôle glycémique » ×2, « Pas
        d'hypoglycémie récente », « iSGLT2 disponible » / « AR GLP‑1 disponible » ×4 (ces deux derniers
        nomment maintenant les motifs d'indisponibilité écartés). CLÉS de `motifs` intouchées (I24).
        G · LISIBILITÉ (4). Phrases-fleuves découpées, une idée par puce (posologie metformine 118 mots →
        7 puces ; avantages du glinide ; divergence metformine ; titration sémaglutide). Sigles développés
        à leur première apparition : patient-années, odds ratio de Mantel-Haenszel, hazard ratio ajusté,
        MACE, NAION, NEM2, maladie rénale chronique, aire sous la courbe, essai de sécurité
        cardiovasculaire. Capitales-étiquettes uniformisées : « RÈGLE DURE : », « GARDE-FOU TERRAIN : »,
        « REPLI : » ×3, « ⚠ DIVERGENCE DÉCLARÉE », « PREUVE DE GRADE TRÈS FAIBLE » retirées ; l'emphase
        ne subsiste que sur le verbe de sécurité lui-même (JAMAIS, CONTRE-INDIQUÉ, À ne PAS initier).
        Déséquilibres corrigés : « Glinide [remplacer] » resserré de 586 à ~250 mots, « Tirzépatide »
        complété (MACE-3 développé, absence de comparaison contre placebo dite), « Association iSGLT2 +
        AR GLP‑1 » passée de 16 mots à une carte complète avec `apercu` et `posologie_detail` recopiés
        des deux cartes de composants.
        H · ARGUMENTAIRE EXHAUSTIF AU PRÉSENT (5). Les passages écrits au passé sur ce que le nœud disait
        avant sont supprimés (seuil KDIGO, motif rectifié, exclusion du glinide, gliptine sous DFG 30,
        anecdote des deux PMID et de l'article sur le comportement des chèvres). Les trois liens vers des
        dossiers de preuve inatteignables depuis la page rendue, les lettres de nœuds internes (A/E/F/H)
        et le renvoi « cf. `sources` du YAML » sont remplacés par des noms lisibles ou supprimés — la
        section « Méthode & frontières » devient « Périmètre et frontières ». Noms de champs YAML réécrits
        en français. NOUVELLE SECTION « Ce que les essais ont mesuré » : les chiffres du badge de preuve
        (iSGLT2, AR GLP‑1, tirzépatide, sulfamide, gliptine, metformine) étaient introuvables au niveau 3
        — ils y sont recopiés EXACTEMENT depuis le YAML, sans dérivation. Le chapeau du document et le
        `titre` du nœud sont corrigés : « Traiter : initier, intensifier, optimiser, déprescrire »
        couvre enfin la 4ᵉ intention, qui a toute une famille et six options.
        I · SIGNALÉ, NON CORRIGÉ. L'intervalle de confiance de l'aHR 1,69 de Huang & Yeh 2019
        (1,25-2,59) n'est pas log-symétrique — √(1,25×2,59) = 1,80, pas 1,69 — alors que les trois autres
        HR du même dossier le sont. Rien n'a été touché : à revérifier sur PMID 31108137.
    - date: "2026-08-05"
      auteur: "Claude Code — en attente de relecture référent (T-148, arbitrage Thibault)"
      resume: >-
        TROU DÉCOUVERT PAR THIBAULT EN TEST MANUEL (HbA1c 8 %, glucotoxicité = oui, cétonémie non
        renseignée → seul repli « poursuivre et réévaluer » affiché, alors que les classes actives sont
        chacune écartées pour glucotoxicité). Cause initiale : la condition de « Insuline d'initiation »
        (`HbA1c_actuelle >= 10 AND symptomes_glucotoxicite == true OR cetonemie == true`) exigeait, par
        priorité de `AND` sur `OR`, HbA1c ≥ 10 ET glucotoxicité ENSEMBLE — la glucotoxicité seule
        n'ouvrait pas l'option.
        ARBITRAGE CLINIQUE COMPLET RENDU PAR THIBAULT (au-delà du seul bug de précédence) : (1) l'HbA1c
        SEULE ne conditionne plus du tout cette option — un chiffre élevé sans signe catabolique n'est
        pas une urgence insulinique, c'est le rôle de l'option distincte « Envisager l'insuline ».
        Condition réduite à `symptomes_glucotoxicite == true OR cetonemie == true`. (2) Glucotoxicité
        SEULE (sans cétonémie) : l'insuline devient une option à ENVISAGER, mais ne doit plus être la
        SEULE possible — l'exclusion `symptomes_glucotoxicite == true` est levée sur iSGLT2, AR GLP‑1 et
        l'association des deux (trois options), qui redeviennent proposables comme agents
        anti-hyperglycémiants puissants alternatifs. Gliptine et sulfamide (agents faibles, déjà
        `bas_rang`) restent, eux, exclus sur la glucotoxicité seule — décision explicite de Thibault,
