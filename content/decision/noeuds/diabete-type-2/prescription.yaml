    # clinique plutôt que l'état).
    motifs:
      "isglt2_indisponible == true AND aglp1_indisponible == true": "Aucune classe protectrice disponible (iSGLT2, AR GLP‑1)"
      "palette_glycemique_ouverte == true": "Contrôle glycémique à renforcer"
      # AJOUTÉ (2026-08-06, contre-relecture rédactionnelle) : sans motif, la branche se rendait
      # « Position vs cible ≠ Sous l'objectif », une comparaison de valeurs plutôt qu'un fait clinique.
      "position_vs_cible != sous_objectif": "Le patient n'est pas en dessous de son objectif glycémique"
    exclusions:
      - "symptomes_glucotoxicite == true"
      - "cetonemie == true"
    priorite:
      - quand: "isglt2_indisponible == true AND aglp1_indisponible == true"
