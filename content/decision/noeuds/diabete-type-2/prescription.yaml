        préexistantes (« nettement au-dessus » reste évalué avant « au-dessus »). Le seuil d'un point sous
        l'objectif est ce qui rend `sous_objectif` proposable sans risque — il ouvre la déprescription, et
        ne se déclenche donc pas sur un dixième de point (6,9 pour un objectif de 7,0 ⇒ « à l'objectif »).
        Le gros avertissement « ⚠ RIEN N'EST PRÉ-REMPLI SOUS L'OBJECTIF » est devenu faux : remplacé par ce
        qui l'est — les quatre bandes, leur origine, et le rappel que la position DÉCLARÉE fait toujours foi
        (R1 : un pré-remplissage ne s'applique qu'à un champ auquel personne n'a répondu, cesse dès que le
        praticien y touche, ne devine jamais sur une donnée manquante, et est signalé à l'écran).
