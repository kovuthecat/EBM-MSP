  reco_officielle:
    # COURT : c'est un titre de bloc à l'écran. Tout le détail vérifiable (numéros d'avis, de tableau, de
    # rubrique) est descendu dans `references` ci-dessous, où il est lisible ligne à ligne au lieu de
