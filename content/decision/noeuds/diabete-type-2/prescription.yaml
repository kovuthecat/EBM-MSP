        arbitrage référent 2026-07-30), symétrique de « Remplacer le sulfamide »/« Remplacer la gliptine »
        (même famille, même `action`), `avantages`/`inconvenients` PROPRES au répaglinide (pas de
        copier-coller) — PAS d'exclusion `DFG < 30` (contrairement au sulfamide, aucune CI rénale RCP,
        niche déjà protégée par la scission du 2026-07-26). (4) Remplacement CONDITIONNÉ à la disponibilité
        effective d'un remplaçant (A2) via `exclusions: isglt2_indisponible == true AND aglp1_indisponible
        == true` — réutilise les dérivés déjà calculés par le nœud, réserve écrite dans les
        `inconvenients` en clair (pas seulement en commentaire YAML) ; R4 affiche l'exclusion avec son
        motif. Vérifié : le rapport avec « Réduire la posologie du glinide » est dit des deux côtés (REPLI
        dans la nouvelle carte + texte déjà présent, inchangé, côté « Réduire »). Preuve du bénéfice
        absent, collecte dédiée vérifiée en primaire PMID par PMID (deux PMID de la collecte initiale
        étaient FAUX, corrigés) : absence d'ECR dédié (Grenet 2019, PMID 31237921) + signal de mortalité au
        niveau CLASSE sans signal MACE (Mannucci 2020, PMID 32811736, sulfamides+glinides poolés) + signal
        repaglinide-spécifique observationnel avec toutes ses réserves nommées (Huang & Yeh 2019, PMID
        31108137, cohorte taïwanaise appariée, mortalité aHR 1,88 IC95% 1,45-2,43 p<0,001, CV aHR 1,69
        IC95% 1,25-2,59 p=0,001) — `niveau_preuve: tres_faible` sur la carte (GRADE, à dessein différent du
        `modere` du sulfamide/de la gliptine). Quatre sources versées dans `sources.references_primaires`
        (grenet-2019, mannucci-2020, huang-yeh-2019, leonard-2018) et citées par id depuis la carte et
        l'argumentaire. Argumentaire : nouvelle section « Le glinide rejoint les agents sans bénéfice sur
        critère dur », qui détaille les trois preuves ET les réserves une par une (observationnel non
        causal, IMC/HbA1c/lipides non ajustés, sévérité rénale probablement non ajustée, population de
        primo-prescription différente du contexte de la carte) — jamais résumées en une phrase générique.
        `Hors périmètre` respecté : option « Réduire la posologie du glinide » non touchée, aucune
        `priorite` renumérotée (nouvelle carte à `priorite: 4`, égalité de rang avec « Remplacer le
        sulfamide », confinée à la même famille), famille « Agent à ajouter » non renommée. Banc relancé,
        diffs de golden master relus ligne à ligne (cf. rapport de session).
