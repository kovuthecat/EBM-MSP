    # `aide` ajouté T-086 (P10/S9, 2026-08-01), en réponse au rapport de recette (« aucune définition,
    # aucune infobulle » sur le champ qui fait basculer « Désintensifier » au clic « Élevé »).
    # L'investigation P9/S7 (bilan complet dans `plans/P9/S7.md`) a établi que ce champ cumule DEUX
    # lectures irréductibles l'une à l'autre, portées par ses 4 usages (A/C ici, D sur `insuline.yaml` —
    # schéma déjà en place ; B ici — terrain qui exposerait un traitement pas encore introduit), et que
    # ni la fusion en un dérivé automatique (issue 1) ni le silence (issue 3) n'étaient tenables : le
    # champ reste SAISI, tel quel (arbitrage référent du 2026-07-31, hors périmètre de cette tâche). Le
    # texte ci-dessous couvre les deux versants sans trancher entre eux, plutôt que d'en cacher un.
    #
    # CLAUSE « hypoglycémie sévère antérieure » RETIRÉE (2026-08-07, P14/S19, T-192) : elle demandait au
    # praticien de TRADUIRE lui-même cet antécédent dans son jugement sur `risque_hypoglycemie_schema`,
    # alors que l'antécédent est désormais un critère saisi à part entière, `hypo_severe_recurrente`
    # (ci-dessus, `criteres_entree`) — le garder aurait fait poser la même question deux fois, une fois en
    # clair, une fois noyée dans cette case de synthèse (R8, GRAMMAIRE-NOEUD.md : un fait de sécurité, un
    # canal). RELU ENTIÈREMENT après retrait : aucune des 4 lectures A/B/C/D du champ (cf. paragraphe
    # ci-dessus) ne reposait sur cette seule clause — le reste de l'aide (schéma en cours qui expose ;
    # terrain qui exposerait un futur traitement — âge, insuffisance rénale, fragilité) reste complet et
    # cohérent sans elle, la phrase n'était pas la charnière du texte.
    aide: >-
      Un jugement clinique, pas une simple case du dossier : « Élevé » si le schéma en cours expose
      (sécrétagogue — sulfamide, glinide — ou insuline, dose élevée, prises irrégulières ou repas
      sautés), ou si le terrain exposerait un futur traitement même sans hypoglycémiant actuel (âge
      avancé, insuffisance rénale, fragilité). « Faible » sinon.
  # `classes_a_benefice_indisponibles` RETIRÉ le 2026-07-29 (décision référent). C'était un drapeau SAISI
  # qui demandait au praticien de conclure lui-même « les classes à bénéfice dur sont inutilisables » —
  # alors que le nœud sait déjà le calculer : les deux dérivés `isglt2_indisponible` / `aglp1_indisponible`
  # ci-dessus portent exactement les motifs d'indisponibilité (classe déjà en cours, DFG, infections
  # génito-urinaires, dénutrition, IMC). Demander en plus la conclusion, c'était demander deux fois la même
  # chose et risquer la contradiction entre les deux réponses.
  #
  # REMPLACEMENT MÉCANIQUE, à logique constante :
  #   `classes_a_benefice_indisponibles == true`  ->  `isglt2_indisponible == true AND aglp1_indisponible == true`
  #   `classes_a_benefice_indisponibles == false` ->  `isglt2_indisponible == false OR aglp1_indisponible == false`
  # La seconde forme est bien une DISJONCTION : la négation de « les deux sont indisponibles » est « au
  # moins une reste disponible » (De Morgan). L'écrire en `AND` aurait durci la règle — elle n'aurait plus
  # laissé passer que les patients dont les DEUX classes sont disponibles.
  #
  # CE QUI N'A PAS ÉTÉ FAIT, ET C'EST UNE DÉCISION EXPLICITE DU RÉFÉRENT : `preference_injection == refuse`
  # n'est PAS versé dans `aglp1_indisponible`. Un refus d'injectable est une PRÉFÉRENCE du patient, pas une
  # contre-indication : il continue de RÉTROGRADER l'AR GLP‑1 et le tirzépatide (règles de `priorite`
  # conditionnelle, rang 7, inchangées ci-dessous), il ne les rend jamais indisponibles. Les motifs versés
  # dans les deux dérivés sont tous des blocages DURS (fonction rénale, terrain, tolérance) — mélanger les
  # deux registres ferait disparaître une option que le patient pourrait accepter après discussion.
  - nom: hba1c_sous_cible
    type: bool
    # DÉRIVÉ de l'HbA1c saisie (garde-fou ABSOLU, indépendant de la cible du nœud A). Le garde `> 0`
    # évite le faux positif quand l'HbA1c n'est pas encore saisie (défaut 0). Un défaut « false » d'un drapeau
    # manuel n'était PAS sûr pour un garde-fou (patient à 6,0 % non coché → pas de déprescription — vérif S8).
    #
    # PLANCHER CONDITIONNEL (décision référent 2026-07-27, 6e série ; source : SFD 2025, Avis n° 12,
    # Méd Mal Métab 2025;19(8):630-662, verbatim relu par le red-team `chantier-2026-07-27/
    # redteam-seuils-renaux.md` §1.1) : « Chez les patients vivant avec un DT2 et présentant une IRC sévère
    # (DFG entre 15 et 29) ou terminale (DFG < 15), on visera une HbA1c cible ≤ 8 %, avec une limite
    # INFÉRIEURE de 7 % en cas de traitement par GLINIDE ou INSULINE (SU contre-indiqués), pour minimiser le
    # risque hypoglycémique. » Le plancher unique à 6,5 % laissait donc passer un patient à DFG 25 sous
    # répaglinide et HbA1c 6,8 % — dans la zone que la SFD interdit, sans déclencher aucun garde-fou
    # numérique (finding MOYENNE-4(b) du red-team). Il n'était rattrapé que si le praticien déclarait
    # lui-même `position_vs_cible == sous_objectif`.
    # Écrit en forme normale disjonctive (AND lie plus fort que OR — même idiome que `palette_glycemique_
    # ouverte` ci-dessous). Le garde `DFG > 0` est indispensable : le défaut d'un nombre non saisi est 0, et
    # `DFG < 30` seul serait VRAI pour tout patient dont le DFG n'est pas renseigné.
    derive: "HbA1c_actuelle > 0 AND HbA1c_actuelle < 6.5 OR intention != initier AND HbA1c_actuelle > 0 AND HbA1c_actuelle < 7 AND DFG > 0 AND DFG < 30 AND traitements_en_cours contient glinide OR intention != initier AND HbA1c_actuelle > 0 AND HbA1c_actuelle < 7 AND DFG > 0 AND DFG < 30 AND traitements_en_cours contient insuline_basale OR intention != initier AND HbA1c_actuelle > 0 AND HbA1c_actuelle < 7 AND DFG > 0 AND DFG < 30 AND traitements_en_cours contient insuline_rapide"
  - nom: cible_atteinte
    type: bool
    # R1 (GRAMMAIRE-NOEUD.md) : dérivé de l'ÉTAT déclaré (`position_vs_cible`), plus de l'intention.
    # Gain n°2 de la refonte : le sur-traitement n'était détecté que par le garde-fou absolu
    # `hba1c_sous_cible` (< 6,5 %) — un patient fragile à 6,8 % dont l'objectif est < 9 % ne déclenchait
    # rien. `sous_objectif` le capte ici (cible « atteinte » au sens large : à l'objectif ou en dessous,
    # donc rien à intensifier). `hba1c_sous_cible` reste INCHANGÉ, garde-fou dur indépendant.
    derive: "position_vs_cible == a_l_objectif OR position_vs_cible == sous_objectif"
  # SCISSION de l'ex-`terrain_fragile` (décision référent 2026-07-27, 6e série — dette I4 « un concept, un
  # encodage », restée ouverte depuis le 2026-07-27 sur le nœud `insuline`). L'ancien dérivé agrégeait
  # QUATRE choses de deux natures différentes sous un seul nom :
  #   - un TERRAIN (âge ≥ 75 / fragilité / espérance de vie limitée) = « ce patient a peu à gagner d'un
  #     contrôle strict » ;
  #   - un RISQUE lié au SCHÉMA (`risque_hypoglycemie_schema == eleve`) = « ce traitement expose à l'hypo ».
  # Le nœud `insuline` a fait la même scission le 2026-07-27 ; `terrain_cible_assouplie` porte ici EXACTEMENT
  # la même définition que là-bas (age >= 75 OR fragilite OR esperance_vie == limitee) — c'est le point de la
  # scission : le même concept ne peut pas s'appeler pareil et se dériver autrement d'un nœud à l'autre.
  # Aucun invariant PAR NŒUD ne pouvait détecter cette divergence : la vérification est restée manuelle.
  # ZÉRO CHANGEMENT DE COMPORTEMENT : `risque_hypoglycemie_schema` garde ses deux consommateurs directs
  # (alertes de nœud, plus bas) et le seul consommateur de l'ex-`terrain_fragile` — l'option
  # « Désintensifier » — reconstruit la disjonction d'origine terme à terme (A AND (B OR C) ≡ A AND B OR
  # A AND C), en rendant visibles les deux motifs distincts qui la déclenchent.
  - nom: terrain_cible_assouplie
    type: bool
    derive: "age >= 75 OR fragilite == true OR esperance_vie == limitee"
  # ─── INDISPONIBILITÉ D'UNE CLASSE PROTECTRICE (2026-07-27, décision référent) ───────────────────────
  # Ces deux dérivés répondent à une objection du référent sur l'option « Envisager l'insuline » : « je ne
  # comprends pas pourquoi l'insuline devrait être conditionnée à la PRÉSENCE d'un iSGLT2 — ce dernier peut
  # être contre-indiqué par le DFG, mais aussi par les infections urinaires. »
  #
  # Elle est juste, et le défaut est de forme. La condition d'origine écrivait « la palette non insulinique
  # est épuisée » par le PROXY « le patient prend déjà un iSGLT2 », qui ne couvre que l'épuisement PAR
  # OCCUPATION. Une classe indisponible parce qu'elle est CONTRE-INDIQUÉE laissait la condition fausse, donc
  # l'option muette — alors que c'est le cas où l'insuline manque le plus.
  #
  # PÉRIMÈTRE, délibérément étroit : ces dérivés reprennent EXACTEMENT les motifs déjà encodés ailleurs dans
  # ce nœud (exclusions et alertes des options concernées), aucun motif nouveau. `aglp1_indisponible` garde
  # ses trois disjonctions d'origine terme pour terme — seul le côté iSGLT2 est généralisé, comme demandé.
  # RESTE OUVERT, et je ne l'ai pas tranché : la METFORMINE n'entre pas dans ce calcul. Un patient sous
  # iSGLT2 + AR GLP‑1 mais JAMAIS sous metformine (DFG normal) verra donc « Envisager l'insuline » alors que
  # la metformine reste sur la table — comportement d'aujourd'hui, conservé tel quel. L'y ajouter changerait
  # la sortie de profils existants : c'est un arbitrage clinique, pas une correction de forme.
  - nom: isglt2_indisponible
    type: bool
    # Les trois motifs sont ceux du nœud : déjà en cours (prérequis de l'option iSGLT2) ; DFG < 20 (son
    # exclusion) ; infections génito-urinaires récidivantes (son alerte d'option, « ne pas initier /
    # envisager l'arrêt ; risque de gangrène de Fournier »). Le garde `DFG > 0` est indispensable — le
    # défaut d'un nombre non saisi est 0, et `DFG < 20` seul serait vrai pour tout DFG non renseigné.
    derive: "intention != initier AND traitements_en_cours contient iSGLT2 OR DFG > 0 AND DFG < 20 OR infections_uro_genitales_recidivantes == true"
  - nom: aglp1_indisponible
    type: bool
    # Reprise TERME POUR TERME des trois disjonctions que portait l'ancienne condition d'« Envisager
    # l'insuline » (déjà sous AR GLP‑1 ; dénutrition ; IMC < 22 — les deux derniers étant le garde-fou
    # terrain de l'option AR GLP‑1). `IMC < 22` reste NON gardé, exactement comme dans l'exclusion d'origine
    # et comme partout où ce nœud lit l'IMC : le changer ici déplacerait des profils sans rapport avec
    # l'objection traitée.
    #
    # ÉCRIT EN `poids / taille / taille < 22`, PAS `IMC < 22`, depuis le 2026-08-03 (T-133, P12/S8) — motif
    # TECHNIQUE, pas clinique (seuil et sens INCHANGÉS). `IMC` est devenu lui-même un DÉRIVÉ (voir son
    # entrée dans `criteres_entree`) ; or `calculerCriteresDerives` (`engine/deriveCritere.ts`) évalue
    # CHAQUE dérivé contre les PRIMITIVES saisies, JAMAIS contre un autre dérivé DÉJÀ calculé (« pas les
    # uns des autres », un seul passage, sans ordre de dépendance) — un dérivé ne peut donc pas en lire un
    # autre par son nom. Réécrire l'arithmétique ICI, directement depuis `poids`/`taille`, évite ce chaînage
    # tout en gardant EXACTEMENT le même calcul (la chaîne d'opérateurs du moteur, T-133, permet
    # d'exprimer poids/taille² sans détour).
    derive: "intention != initier AND traitements_en_cours contient aGLP1 OR denutrition == true OR poids / taille / taille < 22"
  - nom: palette_glycemique_ouverte
    type: bool
    # Séquençage (décision référent S8) : la palette glycémique PURE (ajout d'un 2e agent sans indication de
    # protection) est ouverte en INTENSIFICATION quand la position déclarée est au-dessus ou nettement au-
    # dessus de l'objectif ; à l'INITIATION (naïf), seulement si NETTEMENT au-dessus (HAS : monothérapie
    # metformine d'abord, bithérapie d'emblée si nettement au-dessus). optimiser/déprescrire ⇒ fermée.
    # Gain n°1 de la refonte (R1) : l'ancien seuil ABSOLU `HbA1c_actuelle >= 8.5` était aveugle à la cible —
    # un patient fragile naïf à 8,7 % dont l'objectif est < 9 % déclenchait une bithérapie d'emblée.
    # `nettement_au_dessus` est relatif à l'objectif fixé pour CE patient, pas à un seuil universel.
    derive: "intention == intensifier AND position_vs_cible == au_dessus OR intention == intensifier AND position_vs_cible == nettement_au_dessus OR intention == initier AND position_vs_cible == nettement_au_dessus"
  - nom: remplacement_agent_sans_benefice
    type: bool
    # R3 (docs/decision/GRAMMAIRE-NOEUD.md) : remplacer un agent sans bénéfice sur critère dur est une
    # TROISIÈME voie d'accès aux classes protectrices, à côté de l'indication d'organe et de la palette
    # glycémique. Décision référent 2026-07-25 : le switch se déclenche dès qu'un tel agent est en cours,
    # sans exiger de comorbidité (« même sans maladie avérée, ça reste protecteur »). La comorbidité CHOISIT
    # désormais le remplaçant et son rang (priorités conditionnelles) ; elle n'autorise plus le geste.
    # LEVÉE DU VERROU GLIPTINE (référent, 2026-07-25) : la restriction « sulfamide seulement » est levée
    # maintenant que `ne_contient_pas gliptine` est retiré de l'option AR GLP‑1 (R4 livré, commit 3886d07).
    # La raison qui la motivait — proposer un protecteur (ex. iSGLT2) SANS verdict sur l'agent sans bénéfice
    # — disparaît avec la généralisation de l'option de switch de la gliptine : elle n'est plus verrouillée
    # sur une seule destination exclue par le terrain. C'était exactement le défaut d'origine remonté par la
    # recette référent (patient IMC 20 sous gliptine + athérome : ajout d'un iSGLT2 en CONSERVANT la
    # gliptine, faute de verdict sur cette dernière).
    # AJOUT DU GLINIDE (référent, 2026-07-30, T-063) : le glinide (répaglinide, seul commercialisé en
    # France) manquait ici alors que le reste du nœud le traitait DÉJÀ comme un agent sans bénéfice dur en
    # toutes lettres, à trois endroits au moins : l'option « Désintensifier » (« alléger / arrêter le
    # sulfamide, le glinide ou réduire l'insuline »), l'alerte de cohérence rénale (« agent SANS bénéfice
    # dur (sulfamide, gliptine, glinide, INSULINE incluse) »), et `metformine_deprescriptible` (qui exige
    # son absence au même titre que celle du sulfamide et de la gliptine). C'est une incohérence interne
    # corrigée, pas un arbitrage nouveau — le fond était déjà tranché, seule cette voie d'accès l'ignorait.
    # Le blocage initial (aucune source documentant l'absence de bénéfice dur SPÉCIFIQUE au répaglinide)
    # est levé par une collecte de preuve dédiée, vérifiée en primaire (cf. `sources.references_primaires` :
    # grenet-2019, mannucci-2020, huang-yeh-2019 ; détail dans l'argumentaire, section « Le glinide rejoint
    # les agents sans bénéfice sur critère dur »).
    derive: "intention != initier AND traitements_en_cours contient sulfamide OR intention != initier AND traitements_en_cours contient gliptine OR intention != initier AND traitements_en_cours contient glinide"
  - nom: metformine_deprescriptible
    type: bool
    # DÉCISION RÉFÉRENT (2026-07-26, 2e série) : arbitrage resté ouvert depuis la capture 6 — « on peut la
    # déprescrire si sur-traitement chez une personne fragile et que les autres agents sont tous des agents
    # à bénéfice dur. » Trois conditions CUMULATIVES, encodées ici : (1) sur-traitement = ÉTAT DÉCLARÉ
    # `position_vs_cible == sous_objectif` (R1 — jamais l'intention, qui n'affirme rien sur la position du
    # patient) ; (2) fragilité = drapeau SAISI `fragilite == true` (le référent a nommé « fragile », pas
    # `terrain_fragile` qui est plus large — âge ≥ 75 / espérance de vie limitée / risque hypo élevé sans
    # fragilité cochée ne suffit pas ici) ; (3) tous les AUTRES agents en cours à bénéfice dur = absence de
    # sulfamide / gliptine / glinide (cités par le référent) ET d'insuline.
    # LECTURE STRICTE insuline (interprétation de l'orchestrateur, à confirmer/corriger par le référent) :
    # l'insuline n'a PAS de bénéfice démontré sur critère dur (ORIGIN neutre, cf. `effet_attendu` de
    # « Envisager l'insuline » : « aucun bénéfice CV »). Un patient sous insuline ne satisfait donc pas la
    # condition 3, même si l'énoncé du référent ne citait que sulfamide/gliptine/glinide — la métonymie
    # de l'énoncé (« les autres agents ») ne fait pas exception pour l'insuline, qui n'a pas plus de
    # bénéfice dur qu'un sulfamide. Conséquence clinique cohérente : chez un sur-traité fragile SOUS
    # INSULINE, la metformine n'est pas déprescrite par cette option — c'est l'INSULINE qu'on allège
    # d'abord (cf. options « Désintensifier » / « Réduire la posologie de l'insuline », déjà applicables
    # sur ce même profil).
    # GARDE-FOU AJOUTÉ APRÈS VÉRIFICATION SUR LE BANC (2026-07-26) : `traitements_en_cours contient
    # metformine` est intégré ICI, dans le dérivé (et pas seulement comme condition de l'option), car ce
    # dérivé sert AUSSI d'exclusion sur la carte socle « Metformine — instaurer ou poursuivre » (voir plus
    # bas). Sans ce garde-fou, un patient qui n'est même PAS sous metformine mais qui remplit par ailleurs
    # les 3 conditions (ex. fragile, sous_objectif, iSGLT2 + tirzépatide seuls) voyait sa carte socle
    # « instaurer » supprimée à tort — rien à « déprescrire » chez qui n'a jamais eu la molécule. Trouvé en
    # rejouant le banc de 180 profils (`genererProfils`, profil #121 : iSGLT2+tirzépatide, fragile,
    # sous_objectif, aucun sulfamide/gliptine/glinide/insuline → carte socle exclue SANS remplacement).
    derive: "intention != initier AND traitements_en_cours contient metformine AND position_vs_cible == sous_objectif AND fragilite == true AND traitements_en_cours ne_contient_pas sulfamide AND traitements_en_cours ne_contient_pas gliptine AND traitements_en_cours ne_contient_pas glinide AND traitements_en_cours ne_contient_pas insuline_basale AND traitements_en_cours ne_contient_pas insuline_rapide"
  # BUG CORRIGÉ EN DEUX TEMPS (2026-08-04, retour utilisateur en recette navigateur).
  #
  # 1er retour : la carte socle affichait « Maintenir » PENDANT que la carte « Metformine [réduire] »
  # (sécurité, plus bas) affichait « Réduire » — deux pastilles CONTRADICTOIRES pour LA MÊME MOLÉCULE, dès
  # que le badge d'action conditionnel du socle (`action_si`, ajouté le même jour) s'est mis à distinguer
  # « Ajouter »/« Maintenir ». Avant ce champ, le socle n'affichait aucun verbe et la contradiction restait
  # silencieuse.
  #
  # 2e retour, sur le correctif du 1er (première version : `action_si` du socle basculait sur « Réduire »
  # au lieu de « Maintenir ») : « toujours 3 cartes distinctes là où il n'en faudrait qu'une seule » — la
  # cohérence textuelle ne suffisait pas, il restait DEUX cartes qui disaient la même chose (le socle ET la
  # carte de sécurité, chacune « Réduire Metformine »), PLUS une troisième carte générique (« Optimiser
  # l'agent mal toléré », plus bas) qui ne sait pas identifier metformine comme la molécule en cause.
  #
  # CORRECTIF RETENU, calqué sur le garde-fou DFG < 30 déjà en place juste au-dessus (même mécanisme) : le
  # socle EXCLUT désormais la situation où la carte de sécurité « Metformine [réduire] » est indiquée
  # (`exclusions` plus bas), au lieu d'essayer de l'imiter par un badge. Une seule carte reste à l'écran —
  # la carte de sécurité, plus précise (dose exacte, contre-indications propres).
  #
  # PAS DE CRITÈRE DÉRIVÉ ICI — ESSAYÉ, PUIS ABANDONNÉ (2026-08-04, trouvé par le banc, pas deviné).
  # `CritereEntree.derive` propage l'indétermination SANS court-circuit (`engine/deriveCritere.ts`
  # `evaluerDeriveTernaire` : « un opérande INDETERMINE, à n'importe quel maillon, rend l'expression
  # ENTIÈRE INDETERMINE » — juste pour une chaîne ARITHMÉTIQUE comme `poids / taille / taille`, où c'est
  # le comportement voulu) — CONTRAIREMENT à `evaluateCondition` (utilisé par `conditions`/`exclusions`),
  # qui applique la logique de Kleene correcte pour un ET booléen : un opérande FAUX rend le ET faux, MÊME
  # SI un autre opérande du même ET est indéterminé. Un premier essai avait donc écrit ce fait comme un
  # critère `derive: bool`, avec le garde R8 (« traitements_en_cours contient metformine AND » répété en
  # tête de chaque terme) — I10 passait, mais I11 (`banc/impasse.test.ts`) continuait de réclamer
  # `intolerance_traitement` pour un patient jamais traité par metformine : le garde en tête ne
  # court-circuitait rien via l'évaluateur de `derive`, contrairement à `evaluateCondition`. D'où
  # l'expression écrite EN CLAIR, deux fois (ci-dessous et dans « Optimiser l'agent mal toléré » plus bas),
  # directement dans une `exclusions` — jamais dans un `derive`.
  #
  # MÊMES FAITS QUE `options[].conditions[1]` de la carte « Metformine [réduire] » (D'INTENTION DUPLIQUÉS,
  # PAS UN OUBLI) : refactoriser la carte de réduction pour lire une expression commune aurait touché sa
  # logique déjà couverte par les vignettes P-39/P-50/P-57/P-58/RT-S2 (banc de tests) — le risque de
  # régression sur une carte de SÉCURITÉ dépassait le bénéfice d'un DRY ici. Un futur écart serait un vrai
  # bug (les deux cartes diraient des choses différentes) : si l'une change, l'autre doit être relue.
  #
  # 2e retour utilisateur, deuxième volet : « Optimiser l'agent mal toléré » (générique, neuf classes
  # possibles, plus bas) est redondante avec la carte « Metformine [réduire] » PRÉCISÉMENT quand metformine
  # est le SEUL agent en cours — la carte spécifique couvre alors déjà tout ce que la carte générique
  # pourrait dire (dose ET intolérance digestive). `metformine_seule_en_cours` reste, LUI, un critère
  # `derive` légitime : il ne lit que `traitements_en_cours` (jamais masqué à indétermination sur les
  # citations positives, cf. `IMPASSES_CONNUES_T018` — aucun opérande indéterminé à propager, la limite
  # ci-dessus ne s'applique donc pas ici).
  - nom: metformine_seule_en_cours
    type: bool
    derive: "traitements_en_cours contient metformine AND traitements_en_cours ne_contient_pas iSGLT2 AND traitements_en_cours ne_contient_pas aGLP1 AND traitements_en_cours ne_contient_pas tirzepatide AND traitements_en_cours ne_contient_pas sulfamide AND traitements_en_cours ne_contient_pas gliptine AND traitements_en_cours ne_contient_pas insuline_basale AND traitements_en_cours ne_contient_pas insuline_rapide AND traitements_en_cours ne_contient_pas glinide"
# `familles` (correctif « ordre accidentel / badge multi-natures », 2026-07-25) : déclaration EXPLICITE
# des sections du panneau de résultats, présentation pure (aucun effet moteur, cf.
# schema/noeud.schema.json). L'ORDRE DE CE TABLEAU EST L'ORDRE D'AFFICHAGE — « urgence d'abord » (décision
# référent) — indépendant de l'ordre d'écriture des options ci-dessous. `exclusive` porte la sémantique
# « on en choisit un » (true) vs « on fait tout » (false) ; l'UI en dérive la mention de section, jamais
# un libellé clinique en dur. Confine aussi les égalités de `priorite` À L'INTÉRIEUR d'une même famille
# (`groupesParFamille`) : deux gestes de familles différentes au même rang ne sont plus jamais présentés
# comme un choix exclusif alors qu'ils se cumulent.
#
# ─────────────────────────────────────────────────────────────────────────────────────────────────────
# CONTRAINTES DE SAISIE (champ ajouté au schéma le 2026-07-27). Celle-ci n'est pas un arbitrage clinique :
# elle recopie ce que le nœud DÉCLARE DÉJÀ de lui-même. `traitements_en_cours` porte
# `visible_si: "intention != initier"`, avec ce commentaire — « INITIER = patient naïf PAR DÉFINITION : la
# question n'a pas d'objet, le champ est masqué (et remis à vide s'il avait été rempli sous une autre
# intention) ». Le formulaire ne peut donc PAS produire cette combinaison ; seul le générateur du banc le
# pouvait, parce qu'il tire chaque critère sans regarder `visible_si`.
#
# CE QUE ÇA A COÛTÉ, mesuré : sur les 5 profils que l'invariant I2′ signalait encore comme « écran vide »
# après l'ouverture rénale de l'AR GLP‑1, TROIS étaient de cette forme — « je souhaite initier » chez un
# patient déclaré sous insuline rapide, sous iSGLT2 + tirzépatide, ou sous gliptine. Aucun n'est un patient.
#
# Neuf termes plutôt qu'un test de liste vide : le DSL n'a pas d'opérateur « est vide », et l'énumération
# a l'avantage d'être auditable ligne à ligne. Précédence : AND lie plus fort que OR, la disjonction de
# tête couvre donc bien toute la conjonction qui suit.
contraintes:
  - expression: "intention != initier OR traitements_en_cours ne_contient_pas metformine AND traitements_en_cours ne_contient_pas iSGLT2 AND traitements_en_cours ne_contient_pas aGLP1 AND traitements_en_cours ne_contient_pas tirzepatide AND traitements_en_cours ne_contient_pas sulfamide AND traitements_en_cours ne_contient_pas gliptine AND traitements_en_cours ne_contient_pas insuline_basale AND traitements_en_cours ne_contient_pas insuline_rapide AND traitements_en_cours ne_contient_pas glinide"
    message: >-
      L'intention « initier » suppose un patient naïf de tout traitement médicamenteux : elle est
      contradictoire avec un traitement déjà déclaré en cours. Choisir plutôt « intensifier » ou
      « optimiser », ou vider la liste des traitements en cours.
# ─────────────────────────────────────────────────────────────────────────────────────────────────────
familles:
  - libelle: "À faire d'emblée — sécurité"
    exclusive: false
  - libelle: "Socle du traitement"
    exclusive: false
  # ORDRE DES SECTIONS INVERSÉ le 2026-07-29 (recette référent : « Remplacer devrait passer avant
  # Ajouter »). « Traitement à corriger ou remplacer » précède désormais « Le choix de l'agent » (ex-
  # « Agent à ajouter », puis ex-« Agent glycémique », renommée deux fois P12/S5 T-124 — cf. son propre
  # commentaire plus bas).
  #
  # POURQUOI ICI ET NULLE PART AILLEURS — la demande visait l'ordre d'affichage de deux VERBES (`action:
  # remplacer` avant `action: ajouter`), mais `action` ne pilote aucun tri : c'est un simple marqueur de
  # couleur. L'ordre vient (1) de CE tableau, pour les sections, puis (2) de `priorite` à l'intérieur d'une
  # section, l'ordre de déclaration servant de départage. Or aucune section ne mélange les deux verbes :
  # toutes les options `remplacer` vivent ici, toutes les options `ajouter` dans « Le choix de l'agent » (et
  # une seule en sécurité). Il n'existait donc AUCUN cas d'égalité de rang où « remplacer » perdait contre
  # « ajouter » : ce que le référent voyait à l'écran était l'ordre des SECTIONS, et c'est le seul levier
  # qui répond réellement à sa demande. Aucun `priorite` n'a été renuméroté — chaque rang a été négocié
  # option par option, et les redériver du verbe les écraserait en silence.
  #
  # Le sens clinique va dans le même sens : corriger ce qui est déjà prescrit avant d'ajouter un agent.
  - libelle: "Traitement à corriger ou remplacer"
    exclusive: false
  # RENOMMÉE DEUX FOIS le 2026-08-02 (P12/S5, T-124, même session). Libellé SEUL dans les deux passes :
  # aucune option déplacée, aucune `condition`/`action`/`priorite` touchée. Nom final : « Le choix de
  # l'agent ». Les DEUX tentatives précédentes sont tracées ci-dessous plutôt qu'effacées, pour qu'une
  # passe future ne les « re-précise » pas et ne recasse pas la même chose une troisième fois.
  #
  # 1ʳᵉ TENTATIVE ÉCARTÉE — « Agent à ajouter » (nom d'origine). LE DÉFAUT : le titre affirmait un VERBE
  # (« ajouter ») que certaines cartes qu'il coiffe contredisent chez CE patient — recette du 02/08, 4
  # vignettes sur 15 (N3, N4, N12, N15). Cas le plus net (N4, coronarien) : « Sulfamide — option glycémique
  # de bas rang » (bas rang, sans badge) apparaît dans le même cadre visuel qu'« Introduire un iSGLT2 »
  # (preuve élevée), alors que ce même patient a un « Remplacer le sulfamide » ouvert ailleurs à l'écran
  # (famille « Traitement à corriger ou remplacer ») — lire « Agent à AJOUTER » juste au-dessus fait passer
  # pour un simple complément ce qui devrait se lire comme un choix de meilleur agent. VÉRIFIÉ SUR PIÈCES
  # (bilan de session S5) : aucune des 7 options de cette famille ne porte `action: remplacer` — le chip
  # `action` de chaque carte reste exact, c'est le TITRE DE GROUPE qui en affirmait un que la famille ne
  # tient pas pour tout patient qui la lit.
  #
  # 2ᵉ TENTATIVE ÉCARTÉE — « Agent glycémique ». Corrigeait le VERBE mais introduisait un MÉCANISME tout
  # aussi faux et cette fois DÉMENTI SUR LA MÊME CARTE. Mesuré au navigateur sur le profil Kervarec
  # (coronarien, DFG 58) : sous « Agent glycémique — en choisir un », la carte « Introduire un iSGLT2 »
  # (Recommandée, Preuve élevée) affiche « Proposé parce que : DFG < 60 ET Maladie cardiovasculaire
  # athéromateuse établie ET Agent sans bénéfice dur déjà en cours » — trois raisons RÉNALE, CARDIOVASCULAIRE
  # et de SUBSTITUTION, aucune glycémique. Le titre de groupe annonçait un mécanisme que le motif de la
  # carte, deux lignes plus bas, dément explicitement. Aggravé par un effet de bord croisé avec P12/S2 (qui
  # a par ailleurs raccourci l'intitulé de cette carte, retirant « protection cardio-rénale » de sa face
  # visible — signalé au référent, hors périmètre de cette session, cf. bilan) : plus rien à l'écran
  # n'expliquait alors pourquoi l'iSGLT2 méritait « Preuve élevée » chez ce patient précis, ni le titre de
  # groupe ni le titre de la carte.
  #
  # LA LEÇON DES DEUX ÉCHECS — cette famille contient des options dont le geste (ajouter, parfois de facto
  # remplacer) ET le mécanisme (glycémique, cardio-rénal, ou les deux selon le patient et l'agent) varient
  # trop pour tenir dans UN mot de titre sans en démentir certaines. Un titre qui ne revendique NI verbe NI
  # mécanisme est donc le seul qui ne puisse pas être contredit par une carte qu'il coiffe : « Le choix de
  # l'agent » ne dit que ce que la famille EST structurellement (`exclusive: true`, on retient un agent
  # parmi plusieurs), jamais ce qu'on en fait ni pourquoi. Le chip `action` et le « Proposé parce que » de
  # chaque carte restent les seuls porteurs du verbe et du mécanisme — c'est leur rôle, pas celui du titre
  # qui les regroupe.
  - libelle: "Le choix de l'agent"
    exclusive: true
  # HISSAGE CONDITIONNEL (arbitrage référent A3, 2026-08-01) : un praticien qui déclare vouloir
  # déprescrire ne doit pas lire « Le choix de l'agent » (carte badgée Recommandée/Preuve élevée) avant
  # « Traitement à alléger » — l'ordre de lecture contredirait l'intention qu'il vient de déclarer, sur
  # un écran lu en dix secondes (N7, docs/decision/validation/recette-praticien-naif-2026-07-30.md § N7
  # point 9). Aucune option ne bouge, aucun badge ne change — seule cette section passe en tête quand
  # `intention == deprescrire`.
  - libelle: "Traitement à alléger"
    exclusive: false
    prioritaire_si: "intention == deprescrire"
  - libelle: "Aucun geste — surveiller"
    exclusive: false
options:
  # ---- Gate / socle -------------------------------------------------------------------------------------
  - intitule: "Metformine"
    role: socle
    # BADGE D'ACTION CONDITIONNEL (2026-08-04, demande utilisateur) — cette carte est TOUJOURS la même
    # option (`conditions: ["toujours"]`) qu'elle instaure ou poursuive, mais le verbe lu sur la pastille
    # doit refléter LEQUEL des deux c'est réellement pour ce patient. `action` reste le repli (patient
    # naïf, cas le plus fréquent en instauration) ; `action_si` bascule sur « Maintenir » dès que la
    # metformine est déjà en cours — cf. `Option.action_si`, `node.types.ts`.
    #
    # PAS DE RÈGLE « RÉDUIRE » ICI (retirée le 2026-08-04, 2e retour utilisateur) : une première version
    # en ajoutait une, pour que le socle s'accorde avec la carte « Metformine [réduire] » (sécurité,
    # plus bas) plutôt que de la contredire. Ça réglait la CONTRADICTION mais pas la DUPLICATION (deux
    # cartes disant « Réduire Metformine »). Le correctif retenu va plus loin : le socle EXCLUT désormais
    # la situation où la carte de sécurité est indiquée (`exclusions` plus bas, même mécanisme que
    # `DFG < 30` juste en dessous) — une seule carte reste à l'écran, la plus précise des deux.
    action: ajouter
    action_si:
      - quand: "traitements_en_cours contient metformine"
        action: maintenir
    conditions:
      - "toujours"
    priorite: 0
    famille: "Socle du traitement"
    exclusions:
      - "DFG < 30"
      # GARDE-FOU (2026-07-26, 2e série) : sans cette exclusion, cette carte « instaurer ou poursuivre »
      # et la nouvelle option « Déprescrire la metformine » (famille « Traitement à alléger », voir
      # `metformine_deprescriptible` plus haut) s'afficheraient CÔTE À CÔTE sur le même agent —
      # contradiction directe (« poursuivre » + « déprescrire » la même molécule). Miroir exact du garde-
      # fou `DFG < 30` déjà en place au-dessus (qui protège symétriquement contre l'option « Arrêter la
      # metformine »).
      - "metformine_deprescriptible == true"
      # AJOUTÉ le 2026-08-04 (retour utilisateur, 2e passe) : même mécanisme que les deux exclusions
      # ci-dessus, pour la même raison — QUAND la carte de sécurité « Metformine [réduire] » est indiquée,
      # elle EST la conduite à tenir, plus précise (dose exacte, contre-indications propres) que le socle
      # générique. Sans cette exclusion, les deux cartes coexistaient en double emploi. EXPRESSION EN
      # CLAIR, PAS UN CRITÈRE DÉRIVÉ (cf. le long commentaire plus haut, juste avant `metformine_seule_en_cours`,
      # pour le pourquoi) — IDENTIQUE à `options[].conditions[1]` de la carte « Metformine [réduire] »,
      # à relire ensemble si l'une des deux change.
      - "traitements_en_cours contient metformine AND DFG >= 45 AND DFG < 60 AND dose_metformine > 2000 OR traitements_en_cours contient metformine AND DFG >= 30 AND DFG < 45 AND dose_metformine > 1000 OR traitements_en_cours contient metformine AND intention != initier AND intolerance_traitement == true AND nature_intolerance contient digestive"
    avantages:
      - "Reste la 1re intention des recommandations françaises : long recul d'usage, bonne tolérance, aucune hypoglycémie."
      - "Suffit seule tant qu'aucune comorbidité n'ouvre l'indication d'un agent à bénéfice d'organe."
    inconvenients:
      - "Le bénéfice propre sur critère dur repose sur une preuve faible : ce n'est pas un bénéfice cardiovasculaire prouvé."
      - "En cas d'intolérance digestive — surtout si un AR GLP‑1 est aussi en cours —, c'est la metformine qu'on réduit ou arrête en premier : c'est l'agent dont le bénéfice est le plus faible."
    effet_attendu: >-
      HbA1c −0,97 % contre placebo, sans prise de poids ni hypoglycémie. Aucun bénéfice sur critère dur
      démontré contre placebo (Griffin 2017).
    niveau_preuve: faible
    references:
      - griffin-metformine
    contre_indications:
      - "CONTRE‑INDIQUÉE si DFG < 30 (RCP ANSM) ; à écarter en insuffisance cardiaque décompensée, IDM récent, insuffisance hépatique, alcoolisme. À suspendre : déshydratation, sepsis, jeûne, produit de contraste iodé, chirurgie."
    # T-075 (P9/S8) — aperçu affiché dans le titre du dépli REPLIÉ (mécanisme T-076/P9·S9, générique,
    # réutilisé tel quel), reprenant SANS RECALCUL les chiffres déjà écrits dans les `avantages`
    # ci-dessus : c'est exactement ce que la vignette N1 réclamait, lisible en 2 minutes de consultation
    # sans ouvrir le dépli.
    apercu: "instauration : paliers de 15 j jusqu'à dose cible (ex. 2 g/j en 1 mois), 2-3 prises au repas."
    # DÉPLACÉ depuis `avantages` le 2026-08-04 (demande utilisateur) : le protocole de titration se lisait
    # dans l'argumentaire bénéfice/risque au lieu du panneau POSOLOGIE. AJOUT D'ORIGINE T-075 (P9/S8,
    # 2026-07-30), en réponse au rapport de recette N1 (« Aucune dose, aucune titration. "Instaurer ou
    # poursuivre" n'est pas une prescription. »). Vise UNIQUEMENT l'INSTAURATION (patient naïf) — le
    # protocole n'a pas de sens chez un patient déjà stabilisé sous metformine, d'où le préfixe explicite.
    # Source unique et nommée : Assurance Maladie (ameli), mémo médecin « Prescription de metformine chez
    # le patient diabétique de type 2 » (aucune date d'édition visible sur le document). Ne modifie ni ne
    # contredit les contre-indications/paliers rénaux déjà encodés dans ce nœud (DFG < 30 = CI ; réduction
    # 45-59/30-44) : la table DFG du mémo (≥60 → 3 g/j, 45-59 → 2 g/j, 30-44 → 1 g/j, <30 → CI) est
    # identique aux seuils déjà présents.
    # SOURCES SORTIES DE LA LIGNE DE LECTURE (T-200, P15/S6, 2026-08-11) : la phrase « Source des cinq
    # points ci-dessus : Assurance Maladie (ameli)… » attribuait GLOBALEMENT les cinq items précédents —
    # exactement le canal que P15 remplace par une note par item. Chaque item porte désormais son propre
    # `sources: [ameli-memo-metformine]` (même id, l'attribution était déjà globale) ; l'item de citation
    # seul a disparu, son contenu entier ayant migré. `(RCP ANSM)` de l'adaptation au DFG suit le même
    # geste vers `rcp-ansm`. cf. `docs/decision/validation/posologie-sourcage-2026-08-11.md` §1.2.
    posologie_detail:
      - texte: "Instauration (patient naïf) : 2 à 3 prises par jour, en milieu ou en fin de repas."
        sources:
          - ameli-memo-metformine
      - texte: "Augmenter par palier d'une à deux semaines selon la tolérance digestive, jusqu'à la dose cible."
        sources:
          - ameli-memo-metformine
      - texte: "Exemple pour une cible de 2 g/j avec des comprimés à 1000 mg : ½ cp matin + ½ cp soir pendant 15 jours, puis ½ cp matin + 1 cp soir pendant 15 jours, puis 1 cp matin + 1 cp soir pendant 1 mois."
        sources:
          - ameli-memo-metformine
      - texte: "Si nausées ou diarrhées non supportées : revenir au palier précédent pendant 15 jours avant de reprendre l'augmentation."
        sources:
          - ameli-memo-metformine
      - texte: "Observance : répartir les prises selon les préférences du patient, en gardant une prise au repas. Comprimés sécables en cas de trouble de la déglutition ; l'embonate de metformine (Stagid®), qui apporte moins de metformine base, peut faciliter l'instauration."
        sources:
          - ameli-memo-metformine
      - texte: "Adaptation au DFG : 3 g/j si DFG ≥ 60 · 2 g/j si 45‑59 · 1 g/j si 30‑44 · contre‑indiquée sous 30."
        sources:
          - rcp-ansm
  # ---- Sécurité rénale metformine ----------------------------------------------------------------------
  - intitule: "Metformine (DFG < 30)"
    role: securite
    action: arreter
    conditions:
      - "intention != initier AND traitements_en_cours contient metformine"
      - "DFG < 30"
    # P10/S3 (T-080) : motif rédigé sur le garde technique « intention != initier » (masquage de
    # `traitements_en_cours` à l'initiation, cf. son commentaire dans `criteres_entree`), exposé sinon
    # comme un critère clinique ("Intention ≠ Initier un traitement et Traitements en cours comprend
    # Metformine"). La branche ne dit rien de plus que « metformine déjà en cours » (règle d'or).
    motifs:
      "intention != initier AND traitements_en_cours contient metformine": "Metformine déjà en cours"
    priorite: 1
    famille: "À faire d'emblée — sécurité"
    avantages:
      - "Metformine CONTRE‑INDIQUÉE sous 30 mL/min/1,73 m² (RCP ANSM)."
      - "L'arrêt supprime le risque d'acidose lactique par accumulation."
      - "Relais possible : un iSGLT2 si le DFG est ≥ 20, ou un AR GLP‑1."
    inconvenients:
      - "Réévaluer le contrôle glycémique après l'arrêt : le socle du traitement est retiré."
      - "Renforcer souvent la protection cardio‑rénale en parallèle."
    effet_attendu: >-
      Suppression du risque d'acidose lactique en insuffisance rénale sévère (sécurité — RCP/ANSM). Aucun
      essai n'a chiffré cet effet, et aucun ne le fera : on ne randomise pas des patients vers une acidose
      lactique. Le geste n'en est pas moins fermement recommandé.
    # NIVEAU DE PREUVE ABAISSÉ le 2026-07-27 — décision de principe du référent, en réponse à la question
    # que l'invariant I8 avait fait surgir : « le niveau de preuve doit refléter la CERTITUDE DE LA PREUVE,
    # c'est l'intérêt d'un outil EBM et pas d'un listing de recos officielles. »
    # Cette option était étiquetée `eleve`. Son fondement est la contre-indication du RCP ANSM (accumulation, risque d'acidose lactique) — il n'existe
    # aucun essai qui l'établisse, et il n'en existera pas. Au sens GRADE, la certitude est donc FAIBLE,
    # quelle que soit la force de la recommandation qui la porte. Les deux notions étaient confondues.
    # Le geste reste EXACTEMENT le même : c'est l'étiquette qui devient honnête, pas la conduite.
    niveau_preuve: faible
    # AJOUT T-126 (P12/S6, 2026-08-03) — rapport OpenEvidence du 2026-08-02, cf. `meta.changelog`.
    apercu: "arrêt immédiat, sans décroissance : contre-indication formelle dès DFG < 30 (KDIGO 2022)."
  - intitule: "Metformine"
    role: securite
    action: reduire
    # GATING SUR LA DOSE (décision référent, 2026-07-26, 3e série — recette capture 1, problème 2) : avant
    # ce lot, cette option se déclenchait sur la seule fourchette de DFG, SANS savoir si la dose ACTUELLE
    # dépassait le maximum ajusté — une dose déjà sous le maximum n'a rien à « réduire ». Seuils repris
    # TELS QUELS des alertes rénales de ce même fichier (RCP ANSM, plus bas : DFG 45‑59 → max 2 000 mg/j ;
    # DFG 30‑44 → max 1 000 mg/j) — aucun seuil inventé. La branche intolérance digestive reste
    # INDÉPENDANTE de la dose (le geste s'y justifie par l'intolérance elle-même, pas par un excès de dose
    # vs DFG). Si `dose_metformine` n'est pas renseignée alors que le DFG situe le patient dans l'une des
    # deux bandes, la comparaison reste INDÉTERMINÉE (D20) : l'option passe EN ATTENTE plutôt que d'être
    # affirmée à l'aveugle — vérifié par les vignettes P-39/P-57/P-58 du banc.
    conditions:
      - "intention != initier AND traitements_en_cours contient metformine"
      - "DFG >= 45 AND DFG < 60 AND dose_metformine > 2000 OR DFG >= 30 AND DFG < 45 AND dose_metformine > 1000 OR intention != initier AND intolerance_traitement == true AND nature_intolerance contient digestive"
    # P10/S3 (T-080) : quatre motifs — le garde technique répété (« Metformine déjà en cours ») et les
    # trois branches de la seconde condition, qui répètent chacune le nom du critère DFG deux fois avec
    # des opérateurs différents (logique de programme plutôt que phrase clinique) ou empilent trois
    # atomes pour décrire une seule situation (intolérance digestive).
    motifs:
      "intention != initier AND traitements_en_cours contient metformine": "Metformine déjà en cours"
      "DFG >= 45 AND DFG < 60 AND dose_metformine > 2000": "Dose de metformine excessive pour ce DFG (45-59)"
      "DFG >= 30 AND DFG < 45 AND dose_metformine > 1000": "Dose de metformine excessive pour ce DFG (30-44)"
      "intention != initier AND intolerance_traitement == true AND nature_intolerance contient digestive": "Intolérance digestive"
    # GARDE-FOU AJOUTÉ (2026-07-26, 4e série, red-team clinique sécurité HAUTE-2) : la branche « intolérance
    # digestive » est la SEULE des trois disjoncts indépendante du DFG — sans cette exclusion, elle
    # continuait de s'appliquer sous DFG < 30, où la metformine n'est plus « à réduire » mais CONTRE‑
    # INDIQUÉE (RCP ANSM). Les deux branches « dose vs palier RCP » étaient déjà hors de ce domaine par
    # construction (bornées à DFG ≥ 30) ; seule la branche intolérance y échappait, produisant deux gestes
    # CONTRADICTOIRES affichés ensemble : « Arrêter la metformine (DFG < 30) » et « Réduire la posologie ».
    # Miroir exact du garde-fou déjà en place sur le socle (`:311`) et sur « Arrêter la metformine » elle-
    # même (structurel, options mutuellement exclusives par construction depuis cet ajout).
    exclusions:
      - "DFG < 30"
    priorite: 3
    famille: "À faire d'emblée — sécurité"
    avantages:
      - "Ramène l'exposition dans la plage que la fonction rénale autorise, sans perdre le socle du traitement. Le praticien ajuste la dose exacte."
      - "Quand un AR GLP‑1 partage l'intolérance digestive, c'est la metformine qu'on allège en premier : c'est l'agent dont le bénéfice est le plus faible."
    inconvenients:
      - "Revoir les facteurs de risque d'acidose lactique ; suspendre en cas de déshydratation, de produit de contraste iodé ou de jeûne."
      - "Si l'intolérance persiste malgré la réduction, passer à l'arrêt — une intolérance ou une contre‑indication à la metformine ouvre le remboursement d'une monothérapie par AR GLP‑1 en France."
    effet_attendu: >-
      Réduit le risque d'accumulation en maintenant le bénéfice de la metformine dans la plage utilisable
      (sécurité — RCP/ANSM). Aucun essai n'a chiffré cet effet, et aucun ne le fera : les paliers viennent
      du résumé des caractéristiques du produit, pas d'un essai randomisé. Le geste n'en est pas moins
      fermement recommandé.
    # NIVEAU DE PREUVE ABAISSÉ le 2026-07-27 — décision de principe du référent, en réponse à la question
    # que l'invariant I8 avait fait surgir : « le niveau de preuve doit refléter la CERTITUDE DE LA PREUVE,
    # c'est l'intérêt d'un outil EBM et pas d'un listing de recos officielles. »
    # Cette option était étiquetée `eleve`. Son fondement est les paliers posologiques du RCP ANSM (2 g/j si DFG 45-59, 1 g/j si 30-44) — il n'existe
    # aucun essai qui l'établisse, et il n'en existera pas. Au sens GRADE, la certitude est donc FAIBLE,
    # quelle que soit la force de la recommandation qui la porte. Les deux notions étaient confondues.
    # Le geste reste EXACTEMENT le même : c'est l'étiquette qui devient honnête, pas la conduite.
    niveau_preuve: faible
    # AJOUT T-126 (P12/S6, 2026-08-03) — rapport OpenEvidence du 2026-08-02, cf. `meta.changelog`.
    # TEXTE CORRIGÉ le 2026-08-04 (retour utilisateur : « la posologie n'est pas adaptée au DFG renseigné »).
    # L'ancienne formulation (« dose maximale divisée par 2 entre DFG 30 et 45 ») décrivait la TRANSITION
    # entre les deux paliers plutôt que CHAQUE palier avec son propre seuil — un patient à DFG 55 (palier
    # 45‑59, max 2000 mg/j) lisait « entre DFG 30 et 45 » sans savoir lequel des deux chiffres le concernait
    # RÉELLEMENT. AUCUN seuil chiffré n'a changé (toujours 2000/45‑59 et 1000/30‑44, RCP ANSM — mêmes
    # valeurs que `motifs`/l'alerte de nœud ci-dessous) : seule la PHRASE devient sans ambiguïté, chaque
    # palier associé explicitement à SON DFG.
    # TEXTE RECORRIGÉ le 2026-08-14 (retour utilisateur en consultation) : « initiation ≤ 500 mg » retiré —
    # cette option est `action: reduire` (metformine DÉJÀ en cours, cf. `conditions` ci-dessus), une dose
    # d'initiation n'y a pas de sens. Source sortie de l'incise vers `posologie_detail[].sources`, même
    # mouvement que T-200 (P15/S6) : KDIGO 2022 reçoit son `id` à cette occasion (`reco_officielle`
    # ci-dessous, jusqu'ici seule référence du nœud sans `id`, donc non citable).
    apercu: "dose maximale ajustée au DFG : ≤ 2 000 mg/j si DFG 45‑59, ≤ 1 000 mg/j si DFG 30‑44."
    posologie_detail:
      - texte: "Dose maximale ajustée au DFG : 2 000 mg/j si DFG 45‑59, 1 000 mg/j si DFG 30‑44."
        sources:
          - kdigo-2022
          - rcp-ansm
  - intitule: "Sulfamide (DFG < 30)"
    role: securite
    action: arreter
    conditions:
      - "intention != initier AND traitements_en_cours contient sulfamide"
      - "DFG < 30"
    # P10/S3 (T-080) : même motif que sur « Arrêter la metformine » — garde technique de non-initiation.
    motifs:
      "intention != initier AND traitements_en_cours contient sulfamide": "Sulfamide déjà en cours"
    priorite: 1
    famille: "À faire d'emblée — sécurité"
    # ATTRIBUTION CORRIGÉE le 2026-07-27 (6e série). Le seuil de 30 était attribué à une « convention
    # KDIGO/SFD ». Vérification en source primaire (`chantier-2026-07-27/preuve-seuils-renaux-su-glinide.md`,
    # confirmée et renforcée par `redteam-seuils-renaux.md` §2.4) : la KDIGO 2022 ne porte AUCUN chiffre sur
    # les sulfamides — sa seule phrase les reliant au DFG est qualitative (« sulfonylureas that are
    # long-acting or cleared by the kidney should be avoided at low eGFRs », réf. 349 = une revue), et sa
    # Figure 23 ne chiffre que la metformine et l'iSGLT2. Ce n'est donc PAS une convention KDIGO.
    # C'est en revanche une CITATION de la SFD, stable sur deux éditions : Tableau I note 2 (« Les sulfamides
    # hypoglycémiants sont contre-indiqués en cas d'IRC sévère ou terminale ») + note 1 (stade 4 = 15-29,
    # stade 5 = < 15) + Avis n° 12, qui attache « (SU contre-indiqués) » aux plages chiffrées dans la MÊME
    # phrase. Le seuil n'est plus une convention : c'est une citation.
    avantages:
      - "Sulfamide CONTRE‑INDIQUÉ en insuffisance rénale sévère, sous 30 mL/min/1,73 m² — seuil porté par la SFD (prises de position 2023 et 2025, Tableau I notes 1-2 et Avis n° 12)."
      - "L'arrêt supprime le risque d'hypoglycémie sévère et prolongée par accumulation."
      - "Relais possible : à ce stade l'insuline devient souvent le pivot, et la seule gliptine utilisable est la vildagliptine 50 mg/j."
    inconvenients:
      - "Réévaluer le contrôle glycémique après l'arrêt."
    effet_attendu: >-
      Suppression du risque d'hypoglycémie sévère par accumulation en insuffisance rénale (sécurité — RCP « IR
      sévère » ; seuil cité par la SFD 2023/2025). Aucun essai n'a chiffré cet effet, et aucun ne le fera :
      on ne randomise pas des patients vers une hypoglycémie sévère. Le geste n'en est pas moins fermement
      recommandé.
    # NIVEAU DE PREUVE ABAISSÉ le 2026-07-27 — décision de principe du référent, en réponse à la question
    # que l'invariant I8 avait fait surgir : « le niveau de preuve doit refléter la CERTITUDE DE LA PREUVE,
    # c'est l'intérêt d'un outil EBM et pas d'un listing de recos officielles. »
    # Cette option était étiquetée `eleve`. Son fondement est la contre-indication citée par la SFD (prise de position 2023 et 2025) — il n'existe
    # aucun essai qui l'établisse, et il n'en existera pas. Au sens GRADE, la certitude est donc FAIBLE,
    # quelle que soit la force de la recommandation qui la porte. Les deux notions étaient confondues.
    # Le geste reste EXACTEMENT le même : c'est l'étiquette qui devient honnête, pas la conduite.
    niveau_preuve: faible
    # AJOUT T-126 (P12/S6, 2026-08-03) — rapport OpenEvidence du 2026-08-02, cf. `meta.changelog`.
    apercu: "arrêt, sans décroissance ; l'hypoglycémie peut persister après la dernière prise, par accumulation (RCP, rubrique 4.4) — seuil DFG < 30 cité par la SFD (2023/2025)."
  # ---- Sécurité — acidocétose euglycémique sous iSGLT2 --------------------------------------------------
  - intitule: "iSGLT2"
    role: securite
    action: arreter
    # AJOUT (2026-07-26, 4e série, red-team clinique sécurité HAUTE-3, PRIORITÉ ABSOLUE DU LOT) : aucune
    # option de ce nœud ne suspendait l'iSGLT2 chez un patient cétonémique déjà sous cette classe — 25 % du
    # banc réaliste (traitements_en_cours contient iSGLT2 AND cetonemie == true) ne recevait AUCUN geste sur
    # l'iSGLT2, ni même une alerte (cf. l'élargissement du `quand` de l'alerte cétonémie ci-dessous).
    # L'acidocétose euglycémique sous gliflozine (glycémie pouvant rester proche de la normale, ce qui la
    # rend particulièrement piégeuse) est une complication reconnue (FDA/EMA), déjà nommée dans ce même
    # fichier comme risque de l'option « Introduire un iSGLT2 » (`:404`, « suspendre si jeûne, chirurgie,
    # sepsis ») et dans l'alerte de nœud dédiée du nœud `insuline` (« suspendre en cas de jeûne, de
    # chirurgie ou de maladie aiguë intercurrente », `insuline.yaml:499-503`) — inatteignable depuis CE nœud
    # et de toute façon jamais conditionnée à une cétonémie CONFIRMÉE (seulement à la présence de l'iSGLT2).
    # R3/R8 (GRAMMAIRE-NOEUD.md) : le verdict sur une ligne en cours est une OPTION à part (D21 — un fait qui
    # rend un geste contre-indiqué est une `exclusion` ou, ici, un verdict dédié affiché avec son motif,
    # jamais une simple alerte qui ne retire rien), sur le modèle déjà en place pour « Arrêter la metformine
    # (DFG < 30) » / « Arrêter le sulfamide (DFG < 30) » ci-dessus : conditions structurelles seulement
    # (présence de l'iSGLT2 + cétonémie confirmée), jamais liées à l'atteinte de l'objectif glycémique
    # (invariant 7 du banc : les garde-fous d'urgence sont orthogonaux à la position vs objectif — un
    # patient peut être à sa cible, voire en dessous, et en cétose).
    conditions:
      - "intention != initier AND traitements_en_cours contient iSGLT2"
      - "cetonemie == true"
    # P10/S3 (T-080) : même motif que sur « Arrêter la metformine » — garde technique de non-initiation.
    motifs:
      "intention != initier AND traitements_en_cours contient iSGLT2": "iSGLT2 déjà en cours"
    priorite: 1
    famille: "À faire d'emblée — sécurité"
    avantages:
      - "Une cétonémie confirmée sous gliflozine est le tableau typique de l'acidocétose euglycémique : la glycémie peut rester proche de la normale, ce qui retarde le diagnostic si on ne s'appuie que sur elle."
      - "Suspendre sans attendre limite la progression vers l'acidocétose franche."
    inconvenients:
      - "Le bénéfice cardio‑rénal de l'iSGLT2 est perdu le temps de la suspension : réintroduire une fois la cétonémie résolue et la cause traitée."
      - "Rechercher la cause : jeûne, chirurgie, maladie aiguë intercurrente, apports glucidiques insuffisants — ou une rupture thérapeutique si le patient est aussi sous insuline."
    effet_attendu: >-
      Suppression d'un facteur aggravant reconnu de l'acidocétose euglycémique (pharmacovigilance FDA/EMA).
      Aucun essai n'a chiffré cet effet, et aucun ne le fera. Le bénéfice cardio‑rénal habituel de la classe
      n'est pas remis en cause : il est suspendu le temps de l'épisode.
    # NIVEAU DE PREUVE ABAISSÉ le 2026-07-27 — décision de principe du référent, en réponse à la question
    # que l'invariant I8 avait fait surgir : « le niveau de preuve doit refléter la CERTITUDE DE LA PREUVE,
    # c'est l'intérêt d'un outil EBM et pas d'un listing de recos officielles. »
    # Cette option était étiquetée `eleve`. Son fondement est un garde-fou de sécurité (acidocétose euglycémique) qu'aucun essai ne pourrait randomiser — il n'existe
    # aucun essai qui l'établisse, et il n'en existera pas. Au sens GRADE, la certitude est donc FAIBLE,
    # quelle que soit la force de la recommandation qui la porte. Les deux notions étaient confondues.
    # Le geste reste EXACTEMENT le même : c'est l'étiquette qui devient honnête, pas la conduite.
    niveau_preuve: faible
    contre_indications:
      # T-070 (P9/S3, 2026-07-30) : convertie — fait unique, `cetonemie` est le critère bool déjà déclaré
      # qui porte exactement ce seuil (« Cétonémie ≥ 3 mmol/L », même sens partout où ce nœud le lit).
      - texte: "Cétonémie ≥ 3 mmol/L → urgence (insuline + hospitalisation), hors périmètre de cet écran."
        condition: "cetonemie == true"
    # AJOUT T-126 (P12/S6, 2026-08-03) — rapport OpenEvidence du 2026-08-02, cf. `meta.changelog`.
    apercu: "arrêt net, sans demi-dose : aucune relation dose-effet démontrée sur le bénéfice cardio-rénal (ACC 2020)."
  # ORDRE DE DÉCLARATION CHANGÉ le 2026-07-29 (recette référent) : cette option est le seul `ajouter` de
  # la famille « sécurité », et elle y précédait les trois `arreter` À RANG ÉGAL (1). Or à rang égal c'est
  # l'ordre de déclaration qui départage : l'écran affichait donc « ajouter de l'insuline » avant « arrêter
  # la metformine / le sulfamide » et « suspendre l'iSGLT2 ». Même correctif que l'inversion des familles
  # « remplacer »/« ajouter » plus haut, et même principe : on retire ce qui est dangereux avant d'ajouter.
  # AUCUN `priorite` renuméroté — les quatre options restent au rang 1, seule leur déclaration bouge.
  - intitule: "Insuline d'initiation"
    role: securite
    action: ajouter
    # CORRIGÉ (2026-08-05, T-148, arbitrage Thibault) : la condition posait
    # `HbA1c>=10 AND symptomes_glucotoxicite==true OR cetonemie==true`, donc — priorité de `AND` sur
    # `OR` — exigeait HbA1c ≥ 10 ET glucotoxicité ENSEMBLE (hors cétonémie) : la glucotoxicité seule,
    # sous HbA1c 10, n'ouvrait pas cette option, alors que les classes actives l'excluaient déjà dès
    # `symptomes_glucotoxicite == true` — trou où un patient glucotoxique sous objectif (HbA1c < 10,
    # sans cétonémie) ne recevait plus AUCUNE option d'intensification.
    # RECADRÉ : l'HbA1c seule NE CONDITIONNE PAS cette option — un chiffre élevé sans signe catabolique
    # n'est pas une urgence insulinique, c'est `Envisager l'insuline` (option distincte, plus bas, gérée
    # par `cible_atteinte`) qui répond à ce cas. Seuls les deux signaux de décompensation catabolique
    # comptent ici, chacun suffisant seul (glucotoxicité SEULE → à envisager, à côté de iSGLT2/AR GLP‑1
    # dont l'exclusion sur glucotoxicité est levée pour le même motif ; cétonémie, seule ou associée à
    # la glucotoxicité → les autres classes actives restent, elles, exclues par leur propre
    # `exclusions: cetonemie == true`, ce qui rend l'insuline de facto la seule option d'ajout).
    conditions:
      - "symptomes_glucotoxicite == true OR cetonemie == true"
    # PRÉREQUIS AJOUTÉ (2026-07-26, chantier prescription/prérequis) : « d'initiation » suppose un
    # patient PAS ENCORE sous insuline — aligné sur le même garde-fou que les 6 autres options d'ajout
    # du nœud (`ne_contient_pas <classe>`, R6). Non observé en recette (capture 4 portait sur « Envisager
    # l'insuline »), mais même lacune structurelle : rien n'empêchait ce libellé de s'afficher chez un
    # patient déjà sous insuline en décompensation (inventaire-existant-primer.md, T2). Si l'insuline en
    # place est insuffisante en catabolisme, l'ajustement relève du nœud E (hors périmètre, cf.
    # `population_cible`), pas d'une « initiation ».
    prerequis:
      - "traitements_en_cours ne_contient_pas insuline_basale AND traitements_en_cours ne_contient_pas insuline_rapide"
    priorite: 1
    famille: "À faire d'emblée — sécurité"
    avantages:
      - "Corrige rapidement la glucotoxicité d'une hyperglycémie sévère symptomatique ou catabolique."
      - "Le plus souvent transitoire : un relais non insulinique redevient possible une fois la glucotoxicité levée."
    inconvenients:
      - "Sans catabolisme franc, un AR GLP‑1 ou le tirzépatide (± insuline basale) est de plus en plus préféré (ADA 2026)."
      - "Contrainte d'injection et d'auto‑surveillance, hypoglycémie, prise de poids."
      - "Le schéma — doses, titration, rythme — devra ensuite être ajusté et suivi dans la durée."
    effet_attendu: >-
      Lève la glucotoxicité. Aucun bénéfice sur critère dur n'a été mesuré : la conduite repose sur un
      accord d'experts.
    niveau_preuve: tres_faible
    # DOSE DE DÉPART : reprise TELLE QUELLE de l'`effet_attendu` de l'option « Instaurer une insuline
    # basale du soir » du nœud `insuline` (même geste — instaurer une basale), jamais recalculée ici.
    # Ce nœud ne porte pas le réglage du schéma (cf. `population_cible`) : seule la mise en route est dite.
    posologie_detail:
      - "Débuter par une insuline basale du soir : 0,1 à 0,2 unité par kilogramme et par jour."
      - "Si le poids n'est pas disponible, 10 U le soir sert de repli pragmatique — ce chiffre n'est pas issu d'un essai dédié."
      - "La titration, le choix de l'analogue et le suivi du schéma relèvent ensuite de la décision d'insulinothérapie."
    apercu: "insuline basale du soir, 0,1 à 0,2 U/kg/j (repli : 10 U le soir si le poids n'est pas disponible)."
    contre_indications:
      # T-070 (P9/S3, 2026-07-30) : convertie — même fait unique que sur « Suspendre l'iSGLT2 » ci-dessus.
      - texte: "Cétonémie ≥ 3 mmol/L → urgence (insuline + hospitalisation), hors périmètre de cet écran."
        condition: "cetonemie == true"
  # ---- Ajout d'un agent protecteur (fix bug 9 : priorités conditionnelles) ------------------------------
  - intitule: "iSGLT2"
    role: geste
    action: ajouter
    conditions:
      - "insuffisance_cardiaque == true OR DFG < 60 OR albuminurie != normo OR ASCVD_etablie == true OR palette_glycemique_ouverte == true OR remplacement_agent_sans_benefice == true"
    # R6 (docs/decision/GRAMMAIRE-NOEUD.md, arbitrage indication/prérequis) : garde-fous de cohérence,
    # évalués comme des conditions mais jamais montrés comme justification (n'apprennent rien à
    # l'écran : « ne prend pas déjà d'iSGLT2 » ; la double négation « iSGLT2/AR GLP‑1 tous deux
    # inutilisables : non »).
    prerequis:
      - "traitements_en_cours ne_contient_pas iSGLT2"
      - "isglt2_indisponible == false OR aglp1_indisponible == false"
    # P10/S3 (T-080) : deux motifs sur des dérivés internes (`palette_glycemique_ouverte`,
    # `remplacement_agent_sans_benefice`) qui disent la conséquence clinique plutôt que l'état ; et les
    # deux motifs qui défont la double négation citée dans le commentaire R6 ci-dessus (« iSGLT2/AR GLP‑1
    # tous deux inutilisables : non » → une clé positive et lisible pour chaque disponibilité).
    motifs:
      "palette_glycemique_ouverte == true": "Contrôle glycémique à renforcer"
      "remplacement_agent_sans_benefice == true": "Agent sans bénéfice dur déjà en cours (sulfamide, gliptine ou glinide)"
      # AJOUTÉ (2026-08-06, contre-relecture rédactionnelle) : sans motif, la branche se rendait
      # « Albuminurie ≠ Normale », une comparaison de valeurs plutôt qu'un fait clinique.
      "albuminurie != normo": "Albuminurie présente"
      "isglt2_indisponible == false": "Rien n'interdit un iSGLT2 chez ce patient (fonction rénale, infections génito-urinaires, classe déjà en cours)"
      "aglp1_indisponible == false": "Rien n'interdit un AR GLP‑1 chez ce patient (dénutrition, maigreur, classe déjà en cours)"
    # EXCLUSION GLUCOTOXICITÉ LEVÉE (2026-08-05, T-148, arbitrage Thibault) : la glucotoxicité SEULE
    # (sans cétonémie) n'écarte plus l'iSGLT2 — l'outil doit alors proposer un agent anti-hyperglycémiant
    # puissant (iSGLT2, AR GLP‑1) ou envisager l'insuline, pas retomber sans aucune option. `cetonemie`
    # reste exclusive (risque d'acidocétose euglycémique, cf. l'alerte `denutrition` plus bas dans cette
    # même option).
    exclusions:
      - "DFG < 20"
      - "cetonemie == true"
    priorite:
      - quand: "infections_uro_genitales_recidivantes == true"
        rang: 6
      - quand: "insuffisance_cardiaque == true OR DFG < 60 OR albuminurie != normo"
        rang: 2
      - quand: "ASCVD_etablie == true OR IMC >= 30"
        rang: 3
      - quand: "default"
        rang: 2
    famille: "Le choix de l'agent"
    avantages:
      - "Réduit l'hospitalisation pour insuffisance cardiaque et la progression de la maladie rénale — effet de classe, proposé indépendamment de l'HbA1c (HAS R.64‑66, grade A)."
      - "Aussi un bon agent de contrôle glycémique, sans hypoglycémie et avec une perte de poids modeste, y compris sans comorbidité."
      # AJOUT P10/S7 (2026-08-01, T-084) — en réponse au rapport de recette (N3-N6) : « introduire un
      # iSGLT2 » sans nommer de molécule ni de dose n'est pas une prescription. Trois molécules vérifiées
      # une à une sur le RCP centralisé EMA (= RCP ANSM pour ces spécialités) et sur la base de données
      # publique des médicaments (commercialisation/remboursement France) — aucune inférée par analogie
      # (D23) : DAPA‑CKD (dapagliflozine), EMPA‑REG OUTCOME/EMPEROR‑Reduced (empagliflozine) et CREDENCE
      # (canagliflozine) sont d'ailleurs déjà les trois essais cités dans `references` ci‑dessous — aucune
      # des trois molécules n'était nommée dans le corps de la carte malgré cela. Pas de hiérarchie ajoutée
      # entre elles : la protection cardio‑rénale est un effet de classe (D12), cohérent avec le premier
      # `avantages` ci‑dessus qui ne l'attribue à aucune molécule en particulier.
      # CANAGLIFLOZINE RETIRÉE le 2026-08-04 (retour utilisateur — « non disponible en France ») : la
      # mention « troisième iSGLT2 commercialisé et remboursé » datait d'une vérification 2024 (T-084,
      # ci-dessus) et n'est plus tenue pour à jour. EN ATTENTE DE RELECTURE RÉFÉRENT (source non re-vérifiée
      # par ce lot — invariant 6, signaler plutôt qu'inventer) : la référence bibliographique CREDENCE
      # (essai canagliflozine, `references` plus bas) reste, elle, une preuve valide de l'effet de CLASSE,
      # indépendamment de la disponibilité commerciale actuelle de la molécule qui l'a établi.
    inconvenients:
      - "Aucun effet sur l'infarctus ni sur l'AVC : en athérome pur, sans insuffisance cardiaque ni maladie rénale, un AR GLP‑1 fait mieux."
      - "Infections génito‑urinaires récidivantes, gangrène de Fournier ; ne pas initier sous DFG 20."
      - "Risque d'acidocétose : suspendre en cas de jeûne, de chirurgie ou de sepsis."
      - "Le seuil de DFG en dessous duquel le RCP déconseille d'initier diffère selon la molécule — empagliflozine sous 20, dapagliflozine sous 25. Entre 20 et 24 mL/min/1,73 m², seule l'empagliflozine est soutenue par son propre RCP pour une instauration."
    effet_attendu: >-
      Hospitalisation pour insuffisance cardiaque : HR ~0,61‑0,73, soit un NNT de ~19 à 31 sur 16 à 26 mois.
      Progression de la maladie rénale — critère et horizon différents du précédent : HR ~0,56‑0,76, NNT 19
      sur 2,4 ans (DAPA‑CKD) et NNT 22 (CREDENCE). Ni l'infarctus ni l'AVC ne sont réduits.
    # R2 : extrait de l'`effet_attendu` ci-dessus, non recalculé. Les DEUX horizons sont donnés parce que
    # les deux chiffres portent sur des critères différents (cf. la correction de l'`effet_attendu`).
    delai_benefice: "16-26 mois sur l'insuffisance cardiaque ; 2,4 ans sur la progression rénale"
    niveau_preuve: eleve
    references:
      - empa-reg
      - dapa-ckd
      - credence
      - emperor-reduced
    contre_indications:
      # T-070 (P9/S3, 2026-07-30) : convertie — fait unique, seuil DFG déjà déclaré (l'aside dialyse ne
      # concerne pas cette option « Introduire », réservée par `prerequis` au patient pas encore sous iSGLT2).
      - texte: "Ne pas initier si DFG < 20 (poursuivre jusqu'à la dialyse si déjà en cours — KDIGO 2024)."
        condition: "DFG < 20"
      # « Prudence si artériopathie évoluée / amputation » RETIRÉE le 2026-08-04 (retour utilisateur :
      # canagliflozine non disponible en France) — ce signal était SPÉCIFIQUEMENT attribué à la
      # canagliflozine (CANVAS), pas établi comme effet de classe pour dapagliflozine/empagliflozine : le
      # garder sans attribution aurait prêté à ces deux molécules un signal qui n'est pas le leur
      # (invariant 6 — ne pas affirmer au-delà de ce que la source portait).
      - "Infections génito‑urinaires récidivantes ; antécédent de gangrène de Fournier."
      - "En cas d'IC avec saxagliptine en cours : arrêter la saxagliptine (signal SAVOR), ne pas se contenter d'ajouter l'iSGLT2."
    # AJOUT T-127 (P12/S6, 2026-08-03) — arbitrage référent du 2026-08-02, cf. `meta.changelog`. Canal
    # UNIQUE (D21/R8, `docs/decision/GRAMMAIRE-NOEUD.md`) pour un fait de sécurité qui QUALIFIE ce geste
    # sans l'interdire : jeûne, apports glucidiques insuffisants et chirurgie programmée sont UN SEUL fait
    # (le mécanisme précipitant de l'acidocétose euglycémique), jamais trois alertes distinctes. PORTÉE
    # PAR CETTE OPTION (patron « Introduire un AR GLP‑1 » ci-dessus), donc rendue UNIQUEMENT quand ce
    # geste est réellement sur la table pour ce patient — même sémantique que l'alerte DFG < 15 de
    # l'AR GLP‑1. `denutrition == true` SEUL comme déclencheur (pas de terme `traitements_en_cours contient
    # iSGLT2` : cette option est réservée par son propre `prerequis` au patient PAS ENCORE sous iSGLT2 —
    # un tel terme y serait toujours faux, mort par construction). Ne crée AUCUN critère nouveau
    # (`denutrition` existe déjà) et ne touche à AUCUNE `condition`/`exclusions`/`prerequis` de cette
    # option : la dénutrition seule NE RETIRE PAS l'indication (arbitrage 2026-07-29, confirmé 2026-08-02 —
    # aucune donnée ne fonde une exclusion sur le poids, à la différence de l'AR GLP‑1 dont l'effet est
    # anorexigène).
    alertes:
      - quand: "denutrition == true"
        niveau: attention
        message: >-
          Chez un patient dénutri, l'acidocétose euglycémique sous iSGLT2 peut s'installer avec une
          GLYCÉMIE RESTÉE PROCHE DE LA NORMALE — c'est ce qui la rend traître et retarde le diagnostic si
          l'on ne s'appuie que sur elle. Elle est précipitée par des apports glucidiques insuffisants, le
          jeûne ou une chirurgie : y penser avant que la cétonémie ne la confirme. Suspendre l'iSGLT2 en
          cas de jeûne prolongé ou d'apports glucidiques manifestement insuffisants, et par principe au
          moins 3 jours avant une chirurgie programmée (4 jours pour l'ertugliflozine — ACC 2020). La
          dénutrition à elle seule ne contre-indique pas l'iSGLT2 : elle impose cette surveillance,
          rien de plus.
    # AJOUT P10/S7 (2026-08-01, T-084) — mécanisme T-076/P9·S9, réutilisé tel quel (générique) : apercu
    # affiché dans le titre du dépli REPLIÉ, reprenant sans recalcul les chiffres du 3e `avantages` ci-dessus.
    apercu: "dapagliflozine 10 mg/j (fixe) ; empagliflozine 10→25 mg/j (DFG ≥ 60)."
    # DÉPLACÉ depuis `avantages` (les doses se lisaient dans l'argumentaire bénéfice/risque au lieu du
    # panneau POSOLOGIE). Chiffres INCHANGÉS, repris tels quels — RCP EMA/ANSM de chaque spécialité,
    # rubrique 4.2, molécules vérifiées une à une sur la base de données publique des médicaments.
    # SOURCE SORTIE DE LA LIGNE DE LECTURE (T-200, P15/S6, 2026-08-11) : l'ancien item « Source : RCP
    # (EMA/ANSM) de chaque spécialité… » attribuait les deux doses ci-dessus ; il disparaît au profit
    # d'une note par item (`rcp-ansm`). « Aucune hiérarchie… » ne cite rien en propre, inchangé.
    posologie_detail:
      - texte: "Dapagliflozine (Forxiga) : 10 mg/j, dose unique, sans titration."
        sources:
          - rcp-ansm
      - texte: "Empagliflozine (Jardiance) : 10 mg/j, puis 25 mg/j (dose maximale) si le DFG est ≥ 60 mL/min/1,73 m² et qu'un contrôle glycémique renforcé est recherché."
        sources:
          - rcp-ansm
      - "Aucune hiérarchie n'est posée entre les deux : la protection cardio‑rénale est un effet de classe. Les deux sont commercialisées et remboursées en France dans le diabète de type 2."
  - intitule: "AR GLP‑1"
    role: geste
    action: ajouter
    # LEVÉE DU VERROU (référent, 2026-07-25) : `ne_contient_pas gliptine` retiré. La non-association
    # gliptine + AR GLP‑1 n'est plus garantie par construction (elle empêchait aussi le SWITCH, pas
    # seulement l'association) mais par l'affichage : dès qu'une gliptine est en cours, le verdict dédié
    # (option « Remplacer la gliptine », plus bas) se déclenche systématiquement (R3) et porte l'alerte de
    # non-association (cf. `alertes`) — l'AR GLP‑1 ne peut donc jamais apparaître sans son contexte de switch.
    # TERME RÉNAL AJOUTÉ le 2026-07-27 (décision référent). L'AR GLP‑1 n'a AUCUNE exclusion rénale — ni ici
    # (`IMC < 22`, dénutrition, glucotoxicité, cétonémie), ni dans son RCP. Pourtant il n'était pas
    # proposable au patient qui en a le plus besoin : diabète nouvellement diagnostiqué, DFG < 20,
    # au-dessus de l'objectif, sans athérome ni obésité. Aucun des quatre termes d'origine n'y est vrai —
    # `palette_glycemique_ouverte` exige « NETTEMENT au-dessus » à l'initiation, et
    # `remplacement_agent_sans_benefice` exige un sulfamide ou une gliptine en cours, qu'un patient naïf n'a
    # pas. Les six profils muets du banc (cf. I15/I2′) étaient exactement ceux-là.
    #
    # Le seuil retenu est 30 et non 20, et c'est la métformine qui le fixe : sous 30 le SOCLE disparaît
    # (contre-indication RCP ANSM), donc une classe à bénéfice doit pouvoir prendre le relais. Entre 20 et
    # 29 l'iSGLT2 s'applique déjà par son indication rénale — l'AR GLP‑1 vient à côté, pas à sa place.
    # Garde `DFG > 0` obligatoire (défaut d'un nombre non saisi = 0, cf. `hba1c_sous_cible`).
    #
    # ⚠ ARBITRAGE RENDU le 2026-07-29 (référent) — ce seuil ne se présente plus comme ouvert. Il était
    # signalé ici comme « le point arbitrable de cette règle » (30 vs 20) ; le référent a tranché pour le
    # MAINTENIR À 30, en rappelant ce que ce nombre dit et ce qu'il ne dit pas : c'est le seuil de
    # DISPARITION DE LA METFORMINE (le socle s'arrête, une classe à bénéfice doit prendre le relais), et
    # non un seuil de sécurité de l'AR GLP‑1 — cette classe n'a aucune contre-indication rénale formelle
    # au RCP des molécules commercialisées en France (vérifié par le référent le 2026-07-29). Le fait de
    # sécurité réel — la classe est PEU ÉTUDIÉE sous 15 mL/min/1,73 m² — ne change donc pas les conditions
    # d'affichage de l'option : il est porté par une ALERTE D'OPTION dédiée (R8, un fait de sécurité qui
    # QUALIFIE un geste sans l'interdire ⇒ `options[].alertes`), cf. le bloc `alertes` plus bas.
    conditions:
      - "ASCVD_etablie == true OR IMC >= 30 OR palette_glycemique_ouverte == true OR remplacement_agent_sans_benefice == true OR DFG > 0 AND DFG < 30 AND cible_atteinte == false"
    # R6 : garde-fous de cohérence (ne pas déjà prendre la classe visée / une classe concurrente ;
    # niche non ouverte) — jamais montrés comme justification (cf. option iSGLT2 ci-dessus).
    prerequis:
      - "traitements_en_cours ne_contient_pas aGLP1"
      - "traitements_en_cours ne_contient_pas tirzepatide"
      - "isglt2_indisponible == false OR aglp1_indisponible == false"
    # P10/S3 (T-080) : cinq motifs — les deux dérivés internes déjà motivés sur l'option iSGLT2 ; le
    # garde technique `DFG > 0` exposé nu (« DFG > 0 et DFG < 30 » se lit comme de la logique, la branche
    # veut dire « insuffisance rénale sévère », combinée ici à la cible non atteinte) ; et les deux motifs
    # qui défont la double négation des prérequis (cf. commentaire de l'option iSGLT2 ci-dessus).
    motifs:
      "palette_glycemique_ouverte == true": "Contrôle glycémique à renforcer"
      "remplacement_agent_sans_benefice == true": "Agent sans bénéfice dur déjà en cours (sulfamide, gliptine ou glinide)"
      "DFG > 0 AND DFG < 30 AND cible_atteinte == false": "Insuffisance rénale sévère, cible glycémique non atteinte"
      "isglt2_indisponible == false": "Rien n'interdit un iSGLT2 chez ce patient (fonction rénale, infections génito-urinaires, classe déjà en cours)"
      "aglp1_indisponible == false": "Rien n'interdit un AR GLP‑1 chez ce patient (dénutrition, maigreur, classe déjà en cours)"
    # EXCLUSION GLUCOTOXICITÉ LEVÉE (2026-08-05, T-148, arbitrage Thibault) : même correctif que sur
    # l'iSGLT2 ci-dessus — la glucotoxicité SEULE ne doit plus écarter l'AR GLP‑1, qui reste un des
    # agents à proposer dans ce cas. `cetonemie` reste exclusive.
    exclusions:
      - "IMC < 22"
      - "denutrition == true"
      - "cetonemie == true"
    priorite:
      - quand: "preference_injection == refuse"
        rang: 7
      - quand: "insuffisance_cardiaque == true OR DFG < 60 OR albuminurie != normo"
        rang: 3
      - quand: "ASCVD_etablie == true OR IMC >= 30"
        rang: 2
      - quand: "IMC < 25"
        rang: 4
      - quand: "default"
        rang: 2
    famille: "Le choix de l'agent"
    avantages:
      - "Réduit les événements athéromateux, surtout l'AVC — et la mortalité cardiovasculaire pour le liraglutide."
      - "Forte baisse d'HbA1c et perte de poids, sans hypoglycémie, y compris chez un patient sans comorbidité."
      - "Le sémaglutide est le seul de la classe à avoir démontré une néphroprotection sur critère dur."
      # AJOUT P10/S7 (2026-08-01, T-084) — même motif que l'iSGLT2 ci-dessus (rapport de recette N3-N6) :
      # les trois molécules étaient déjà nommées dans l'INTITULÉ de la carte mais aucune dose n'était
      # encodée. Trois RCP lus séparément (EMA, = RCP ANSM pour ces spécialités), AUCUNE dose déduite par
      # analogie d'une molécule à l'autre (D23 — les trois protocoles de titration n'ont ni la même unité
      # de temps ni la même progression). Vérification de disponibilité France faite sur chacune des trois
      # (Vidal + base de données publique des médicaments) : c'est cette vérification, et elle seule, qui a
      # éliminé le palier 2 mg/semaine du sémaglutide (autorisé par le RCP européen, non commercialisé en
      # France) — même piège que linagliptine/alogliptine/sitagliptine 25 mg ailleurs dans ce nœud.
    inconvenients:
      - "Le bénéfice est molécule‑spécifique : le lixisénatide et l'exénatide LP en sont exclus."
      - "Effet quasi nul sur l'insuffisance cardiaque."
      - "Effets digestifs, pancréatite ; signaux encore mal cernés sur la thyroïde et, pour le sémaglutide, sur la neuropathie optique ischémique antérieure aiguë (NAION)."
      - "Chez un patient déjà sous gliptine, c'est un remplacement, jamais une association."
      - "Les trois schémas de titration n'ont pas d'équivalence de dose entre eux — 1 mg/semaine de sémaglutide ne correspond à aucune dose précise de liraglutide ou de dulaglutide. Suivre le protocole de la molécule réellement prescrite."
    effet_attendu: >-
      Événement cardiovasculaire majeur (MACE : AVC, mort cardiovasculaire, infarctus, selon la molécule)
      HR ~0,87‑0,88, soit un NNT de ~18 en prévention secondaire et de ~60 à 70 en prévention primaire.
      Sur le critère rénal dur, seul le sémaglutide a été testé (FLOW, HR 0,76).
    # R2 — vérifié à la source le 2026-07-25, les trois molécules nommées ayant trois durées distinctes :
    # SUSTAIN-6 sémaglutide 104 semaines (2 ans) ; LEADER liraglutide 3,8 ans (médiane) ; REWIND
    # dulaglutide 5,4 ans (médiane). Les 5,4 ans de REWIND portent sur une population majoritairement en
    # PRÉVENTION PRIMAIRE, où le taux d'événements est plus bas : la durée y reflète en partie la
    # population, pas seulement la cinétique de la molécule — décision référent 2026-07-25 : le dire à
    # l'écran plutôt qu'en commentaire seul, pour ne pas laisser croire que 5,4 ans est une propriété
    # uniforme de la classe.
    # DÉLAI RECADRÉ SUR LES SEULS ESSAIS CITÉS (2026-08-06, contre-relecture rédactionnelle) : la borne
    # basse était « 2 ans (sémaglutide) », c'est-à-dire SUSTAIN-6, qui n'a pas d'entrée dans
    # `references_primaires` et ne figure donc pas dans les `references` de cette carte (leader, rewind,
    # flow). Remplacée par les 3,8 ans (médiane) de LEADER, essai réellement cité. Aucun chiffre nouveau :
    # 3,8 ans figure déjà dans le commentaire de vérification ci-dessus. À reverser si une entrée
    # bibliographique SUSTAIN-6 est ajoutée.
    delai_benefice: "3,8 ans (liraglutide) à 5,4 ans (dulaglutide, population surtout en prévention primaire)"
    niveau_preuve: modere
    references:
      - leader
      - rewind
      - flow
    contre_indications:
      - "Antécédent de pancréatite ; antécédent personnel ou familial de cancer médullaire de la thyroïde ou de néoplasie endocrinienne multiple de type 2 (NEM2)."
      - "Refus des injections : se tourner vers une classe orale réellement dispensée en France — iSGLT2, ou gliptine à défaut. Le sémaglutide oral n'est pas une alternative praticable : l'avis de la HAS lui est défavorable au remboursement, et il n'est de fait pas dispensé en officine française."
      - "Rétinopathie proliférante non stabilisée : prudence."
      # T-070 (P9/S3, 2026-07-30) : convertie — fait unique, les deux critères qu'elle nomme sont déjà
      # déclarés dans ce nœud, avec exactement ce seuil (identique à `exclusions` de cette même option).
      - texte: "IMC bas / dénutrition : contre‑indication de terrain (perte de poids délétère)."
        condition: "IMC < 22 OR denutrition == true"
    # R2 — branche « on va en introduire un » de l'ancienne alerte fragilité de nœud. PORTÉE PAR L'OPTION :
    # elle ne s'affiche donc que si cette option est réellement applicable, et disparaît d'elle-même quand
    # le terrain l'écarte (IMC < 22, dénutrition). Plus besoin de recopier `ASCVD OR IMC >= 30` pour
    # deviner « envisagé » : l'applicabilité de l'option EST le fait recherché.
    #
    # SECONDE ALERTE, AJOUTÉE le 2026-07-29 (décision référent — prudence rénale). Elle qualifie le geste,
    # elle ne le retire pas : R8, un fait qui rend un geste contre-indiqué est une `exclusions`, un fait
    # qui le QUALIFIE est une alerte — ici la classe n'a aucune contre-indication rénale (RCP vérifiés par
    # le référent), seulement un manque de données à ce niveau de fonction rénale. Les `conditions` de
    # l'option sont INCHANGÉES (cf. le commentaire du seuil 30 ci-dessus) : l'option continue de s'afficher
    # normalement sous 15, avec cette réserve à côté. Garde `DFG > 0` obligatoire (défaut d'un nombre non
    # saisi = 0 : sans lui, l'alerte s'afficherait pour tout patient dont le DFG n'est pas renseigné).
    alertes:
      - quand: "fragilite == true"
        niveau: attention
        message: >-
          Chez un sujet fragile, surveiller le poids et l'état nutritionnel à l'instauration d'un
          incrétine (risque de sarcopénie / anorexie).
      - quand: "DFG > 0 AND DFG < 15"
        niveau: attention
        message: >-
          Fonction rénale très altérée (DFG < 15 mL/min/1,73 m²) : les AR GLP‑1 commercialisés en France
          restent utilisables à ce stade — leur résumé des caractéristiques du produit ne pose aucune
          limite rénale —, mais ils y ont été PEU ÉTUDIÉS. Le recul manque, pas l'autorisation : proposer
          la classe reste licite, en surveillant de près la tolérance (digestive, poids, état
          nutritionnel) et en réévaluant tôt.
    # AJOUT P10/S7 (2026-08-01, T-084) — mécanisme T-076/P9·S9, réutilisé tel quel (générique) : apercu
    # affiché dans le titre du dépli REPLIÉ, reprenant sans recalcul les chiffres des `avantages` ci-dessus.
    apercu: "liraglutide 0,6→1,8 mg/j ; sémaglutide 0,25→1 mg/sem (FR) ; dulaglutide 0,75/1,5→4,5 mg/sem."
    # DÉPLACÉ depuis `avantages` (trois puces de titration y occupaient l'essentiel de la colonne
    # bénéfice/risque). Chiffres INCHANGÉS, repris tels quels — trois RCP EMA/ANSM lus séparément,
    # rubrique 4.2, aucune dose déduite par analogie d'une molécule à l'autre.
    # SOURCE SORTIE DE LA LIGNE DE LECTURE (T-200, P15/S6, 2026-08-11) : l'ancien item « Sources : RCP
    # EMA/ANSM… ; disponibilité France vérifiée… » distinguait déjà deux usages — les trois RCP pour les
    # doses, la BDPM pour la vérification de commercialisation du palier 2 mg/semaine — répartis ici un
    # par un plutôt que recopiés en bloc.
    # RÉORDONNÉ ET ACCENTUÉ le 2026-08-14 (retour utilisateur en consultation) : l'ordre de déclaration
    # plaçait liraglutide en `posologie_detail[0]`, donc seul en gras (registre « geste »,
    # `ItemPosologie.accent`, cf. sa docstring) — alors que c'est la molécule la MOINS prescrite des
    # trois (injection QUOTIDIENNE, contre hebdomadaire pour les deux autres). Sémaglutide et dulaglutide
    # reçoivent désormais `accent: true`, liraglutide est relégué en dernier sans accent. AUCUNE dose ni
    # source ne change : mise en forme seule.
    posologie_detail:
      - texte: "Sémaglutide injectable (Ozempic) : 0,25 mg/semaine pendant 4 semaines — dose de tolérance, pas une dose d'entretien —, puis 0,5 mg/semaine, puis 1 mg/semaine après au moins 4 semaines à 0,5 mg."
        sources:
          - rcp-ansm
        accent: true
      - texte: "Sémaglutide, palier 2 mg/semaine : autorisé par le RCP européen, mais seules les présentations 0,25 / 0,5 / 1 mg sont commercialisées en France. Dose maximale utilisable en France : 1 mg/semaine."
        sources:
          - bdpm
      - texte: "Dulaglutide (Trulicity) : 0,75 mg/semaine en monothérapie, ou 1,5 mg/semaine d'emblée en association ; puis 3 mg/semaine après au moins 4 semaines à 1,5 mg, puis 4,5 mg/semaine (dose maximale) après au moins 4 semaines supplémentaires. Les quatre dosages sont commercialisés et remboursés en France."
        sources:
          - rcp-ansm
        accent: true
      - texte: "Liraglutide (Victoza) : 0,6 mg/j en initiation — dose de tolérance digestive, pas une dose d'entretien —, puis 1,2 mg/j après au moins 1 semaine, puis 1,8 mg/j (dose maximale) après au moins 1 semaine supplémentaire si le contrôle glycémique doit être renforcé."
        sources:
          - rcp-ansm
