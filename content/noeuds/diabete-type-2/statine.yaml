        doses d'intensité corrigées (haute = rosuva 10-20). Ajout d'une note CONFLITS D'INTÉRÊT (reco cosignées
        avec fabricants d'hypolipémiants/anti-PCSK9 → biais sur le versant agressif ; l'outil pondère
        EBM + sources critiques indépendantes). Restant avant `valide` : vérification d'encodage bi-agents.
