    - date: "2026-07-26"
      auteur: "référent DT2 + Claude Code"
      resume: >-
        D23, lot 2 : la seule occurrence restée dans les `options` est reformulée. `inconvenients` de
        l'option « Statine (prévention primaire, intensité modérée — haute si risque très élevé) » :
