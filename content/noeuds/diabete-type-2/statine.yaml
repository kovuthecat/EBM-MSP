      resume: >-
        Arbitrages référent, 2ᵉ série du 2026-07-26 (F-statine §9.4/§9.5). RESTE EN BROUILLON (v1.2) :
        revalidation clinique référent toujours en attente (invariant CLAUDE.md 4). (1) Règle d'âge
