  changelog:
    - date: "2026-07-27"
      auteur: "référent DT2 + Claude Code"
      resume: >-
        GARDE-FOU CK REPRIS SUR SOURCE PRIMAIRE — 4 arbitrages référent, le même jour que le lot qui l'avait
        introduit. Le référent a récupéré les deux documents NICE que ni la collecte ni le red-team
        n'avaient pu ouvrir (403 répétés) : `docs/decision/sources/statin-intolerance-pathway.pdf` et
        `NICE 2023.pdf`. La lecture change quatre choses, et corrige une attribution.
        ATTRIBUTION D'ABORD : ce protocole n'est PAS dans NG238. C'est un document NHS England / AAC
        Clinical Subgroup de janvier 2022, avalisé par NICE en décembre 2021, rattaché à CG181 (remplacée
        par NG238 en décembre 2023) et portant une date de révision de janvier 2024, dépassée. NICE ne fait
        que l'héberger. Même classe d'erreur que le « convention KDIGO » corrigé le matin sur `prescription`.
        (1) QUAND DOSER : « Do not measure CK if person is asymptomatic » (verbatim). Le nœud demandait ce
        dosage à TOUT patient à l'initiation — exactement l'examen que la source déconseille. Le champ
        n'apparaît plus que si une intolérance est rapportée ou avérée.
        (2) SEUIL D'INITIATION : 4 N, pas 5. Les deux sources divergent (française : « >5-fold […] are
        contraindications » ; parcours : « If CK levels are > 4x ULN do not start statin »). Seuil le plus
        bas retenu, donc le plus prudent.
        (3) AU-DELÀ DE 10 N : interruption de 4 à 6 semaines puis réévaluation, PAS arrêt définitif. C'est
        la divergence la plus lourde des deux documents — la reco française écrit « stopped permanently ».
        Le parcours réserve l'arrêt définitif à la myosite nécrosante auto-immune. Décision référent : ne
        pas fermer la classe à un patient à haut risque qui pourrait la tolérer autrement. La position
        française est PORTÉE dans l'option, pas effacée (vignette F-27 protège cette mention).
        (4) PROTOCOLE DE RÉINTRODUCTION ENCODÉ, avec sa réserve de date. Le red-team avait demandé de ne
        pas l'encoder tant qu'il était de seconde main ; il ne l'est plus. La collecte s'était trompée sur
        ses chiffres : elle annonçait « atorvastatine 20 → 40 mg », le parcours écrit « Atorvastatin 10 or
        20 mg OD, or Rosuvastatin 5 or 10mg OD », titrées à 8 semaines d'intervalle.
        STRUCTURE : `CK_sup_5N` (booléen) devient `CK_x_normale` (nombre, 0 = non dosé) — trois seuils
        distincts agissent (4 / 10 / 50), un booléen n'en exprimait qu'un. Nouvelle option PREMIÈRE du nœud,
        « Interrompre la statine 4 à 6 semaines et réévaluer », qui prend donc la main sur le tier de risque
        en ordered-first-match. Deux alertes d'option pour les bandes hautes : 10-50 N (vérifier la fonction
        rénale) et > 50 N (rhabdomyolyse, avis urgent), aux bornes exclusives (vignette F-25).
        BANC : la colonne CK du jeu de profils figé a été retirée à la main puis reprise à neuf par
        `EBM_FIGER_PROFILS=1` — les 7 colonnes préexistantes ressortent inchangées, vérifié valeur par
        valeur sur les 179 profils. ⚠ Le tirage obtenu (0, 3, 4, 5, 60) ne couvre PAS la bande 10-50 : la
        vignette F-24 la couvre explicitement, le golden master non — signalé en `incertitudes`.
        IMPACT GOLDEN MASTER : 58 profils / 180 changent ; 33 gagnent l'option d'interruption. Exactement
        1 option applicable par profil, avant comme après. 7 vignettes ajoutées (F-21 à F-27).
    - date: "2026-07-27"
      auteur: "référent DT2 + Claude Code"
      resume: >-
        LOT « INTOLÉRANCE AUX STATINES » — 2 arbitrages référent, après collecte de preuve
        (`docs/decision/validation/chantier-2026-07-27/preuve-intolerance-statine.md`) et red-team
        adversarial (`redteam-intolerance-statine.md`). Le red-team a relevé 5 findings HAUTE sur la
        collecte, dont trois qui auraient mis une affirmation FAUSSE sous les yeux d'un prescripteur : un
        « 42,6 % de symptômes reproductibles » lu à l'envers (le bras placebo en produit 26,5 %, et la
        phase ne donne chaque traitement qu'une fois — rien n'y est « reproductible »), une date de
        remboursement fausse de dix mois, et une hiérarchie thérapeutique attribuée à une source française
        qui écrit l'inverse. Aucune n'est entrée dans le nœud.
        (1) `intolerance_statine` passe de `bool` à `enum` (non / rapportee / averee), et une OPTION
        TERMINALE « Statine indisponible — alternatives hypolipémiantes » relaie les trois options de
        statine. L'intolérance AVÉRÉE retire les deux premières ; la RAPPORTÉE ne retire rien, la conduite
        y étant la réintroduction en aveugle. Corrige, sur l'intolérance, le défaut D21 déjà corrigé la
        veille sur la dialyse : une alerte qualifie un geste, elle ne le retire pas.
        (2) GARDE-FOU CK : nouveau critère `CK_sup_5N`, exclusion des options d'initiation. C'est la seule
        phrase de la reco française employant le mot « contre-indication », donc le seul fait du dossier
        qui relève d'`exclusions` au sens R8/D21 — la collecte en avait agrégé quatre de trois grades.
        NOTES D'INGÉNIERIE, toutes issues de garde-fous du banc qui ont mordu pendant l'écriture :
        — les exclusions posées d'abord sur le REPLI `default` étaient INATTEIGNABLES ; l'invariant de
        couverture les a signalées comme jamais déclenchées sur 180 profils. En ordered-first-match,
        l'option terminale qui le précède a toujours déjà gagné. Retirées : ce qui protège le repli est
        désormais la POSITION de la terminale, et le fichier le dit.
        — la portée « avant initiation » du critère CK est écrite DANS chaque expression
        (`AND statine_deja_en_place == false`), pas seulement dans son `visible_si` : celui-ci n'est lu que
        par la couche formulaire, jamais par le moteur. Sans cela, un praticien cochant la case avant de
        déclarer la statine en cours aurait vu son patient exclu à tort (vignette F-19).
        — le jeu de profils figé portait encore un BOOLÉEN pour `intolerance_statine`. Sa colonne a été
        retirée à la main, puis retirée à neuf par `EBM_FIGER_PROFILS=1`, qui l'a recomposée avec
        `CK_sup_5N`. Les 7 colonnes préexistantes ressortent inchangées, vérifié valeur par valeur sur les
        179 profils. Tirage obtenu : 60 non / 59 rapportée / 60 avérée, 89 CK positifs.
        IMPACT GOLDEN MASTER : 85 profils sur 180 changent de sortie, tous dans le même sens — la carte
        terminale remplace une carte proposant une statine. Aucun profil ne se retrouve sans sortie
        (contrôle : exactement 1 option applicable par profil, avant comme après).
        11 vignettes ajoutées (F-13 à F-20 et contre-épreuves), dont une qui protège la RÉDACTION : la
        carte terminale ne revendique jamais un bénéfice de mortalité, les estimations ponctuelles de
        CLEAR Outcomes étant défavorables (décès CV HR 1,04 ; toutes causes HR 1,03).
    - date: "2026-07-26"
      auteur: "référent DT2 + Claude Code"
      resume: >-
        D24 (résorption de la dette I6) : l'alerte de nœud en `quand: "default"` — « la décision et
        l'intensité se gradent sur le RISQUE ABSOLU, pas sur une cible LDL chiffrée » — est DÉPLACÉE dans
        le nouveau champ `cadrage`, TEXTE INCHANGÉ. C'est la thèse structurante du nœud : vraie pour tous
        ses patients, fausse pour aucun, donc jamais une alerte au sens de D15 malgré le canal qu'elle
