        tracé explicitement en commentaire sur le critère `age` (`criteres_entree`) et dans
        `incertitudes`, pour qu'une future passe de l'invariant générique R5 (« un critère qu'on demande
        doit agir ») ne le recâble pas par erreur et n'annule pas cette décision sans trace. (2) Alerte
        SCORE2-Diabète (§9.5) : jusqu'ici portée par l'alerte `default` (affichée à TOUT patient), elle en
        est extraite en alerte dédiée `ASCVD_etablie == false AND anciennete_diabete_annees < 10 AND
        autres_FDRCV == 0 AND diabete_complique == false` — CIBLÉE sur le tier « discuter » (seule situation
        où l'estimation sert, référent : « en l'absence de critère de la grille on pourrait suggérer de
        calculer le SCORE2-Diabète, mais il serait probablement faible »), forme normale disjonctive à un
        seul terme conjonctif (le DSL n'a pas de parenthèses, AND prime sur OR). Le terme `ASCVD_etablie ==
        false` est nécessaire car les alertes ne voient que les critères, jamais l'option résolue par
        l'ordered-first-match : sans lui, un patient ASCVD par ailleurs récent/non compliqué/sans FDR
        aurait déclenché à tort une alerte sans objet en prévention secondaire. Réserve de validation
        ajoutée au message (reprise de `incertitudes`, non inventée) : SCORE2-Diabète n'est validé que
        40-69 ans, or le profil sans critère de grille est souvent jeune donc potentiellement hors de cette
        plage. L'alerte `default` restante ne porte plus que le rappel générique « pas de cible LDL »
        (toujours affiché à tout patient). 5 alertes désormais (au lieu de 4). REFUSÉ / HORS PÉRIMÈTRE :
        entrée DECISIONS.md dédiée à ces deux arbitrages (périmètre de ce lot limité à statine.yaml +
        argumentaire + F-statine.md), signalé à l'orchestrateur. Snapshots de caractérisation
        `engine/banc/__snapshots__/caracterisation{,-indetermine}.statine.txt` NON régénérés (attendu,
        cf. tâche) : le diff est résumé dans le rapport de tâche, pas appliqué ici.
