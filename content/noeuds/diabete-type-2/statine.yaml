      resume: >-
        Refonte de la stratification « que dit l'EBM » (v0.3, BROUILLON). Le tier « discuter » n'est PLUS piloté
        par un seuil SCORE2 (encodage âge-bandé retiré : erreur méthodo — SCORE2-Diabète va avec des seuils
