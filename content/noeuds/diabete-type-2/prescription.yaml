      type_critere: dur
      lien: "https://doi.org/10.1056/NEJMoa1504720"
    - titre: "DAPA-CKD (dapagliflozine, MRC) — NNT 19 / 2,4 ans"
      annee: 2020
      type_critere: dur
      lien: "https://doi.org/10.1056/NEJMoa2024816"
    - titre: "CREDENCE (canagliflozine, néphropathie)"
      annee: 2019
      type_critere: dur
      lien: "https://doi.org/10.1056/NEJMoa1811744"
    - titre: "EMPEROR-Reduced (empagliflozine, IC FE réduite) — NNT 19"
