        detail: "Résumé sous droit d'auteur ; réf. Rev Prescrire 2023;43(478):595-605 ; synthèses docs/decision/sources/prescrire-dt2.md."
  reco_officielle:
    source: >-
      HAS 2024 (Stratégie thérapeutique DT2, R.45‑R.105) ; SFD 2025 (Med Mal Metab 2025;19:630‑662, Avis
      3/5/5bis/6/11‑15) ; ADA Standards of Care 2026 ; KDIGO 2022 ; RCP metformine/iSGLT2/incrétines (ANSM).
      Sur le volet rénal : SFD, prise de position 2025 (Méd Mal Métab 2025;19(8):630-662, DOI
      10.1016/j.mmm.2025.10.002) — Tableau I notes 1-2, note 6, Avis n° 12 et n° 12 bis : c'est elle, et non
      la KDIGO, qui porte le seuil de 30 des sulfamides, le plancher d'HbA1c de 7 % sous glinide ou insuline
      en IRC sévère, le « ne jamais utiliser » chez le sujet âgé dépendant, et la liste fermée des molécules
      utilisables sous DFG 15 (dont le répaglinide, et la vildagliptine 50 mg/j — la sitagliptine 25 mg n'étant
      pas commercialisée en France). HAS 2024, R.78 (grade C) : nomme le répaglinide pour sa demi-vie courte et
      sa « non-CI » en maladie rénale. La KDIGO 2022 ne porte aucun chiffre sur les sulfamides : le seuil de
      30 n'est pas une convention KDIGO. Endocrine Society 2019 (PMID 30903688) : porte bien des seuils
      chiffrés par molécule (glimépiride < 30, glyburide < 60), écartée délibérément — source non française,
      périmètre ≥ 65 ans, gliclazide absent, et ses seuils contrediraient les RCP français.
    position: >-
      Sur socle metformine + mode de vie : en cas de maladie CV établie, IC ou MRC, prescrire d'emblée un
      iSGLT2 ou un AR GLP‑1 (ou tirzépatide) à bénéfice prouvé, quel que soit l'HbA1c ; en obésité (IMC ≥ 30),
      AR GLP‑1 ou tirzépatide. Sulfamides plus la stratégie préférentielle (R.69) ; ne pas associer GLP‑1 et
      iDPP4 (R.80) ; chez le sujet âgé sur‑traité, éviter le surtraitement et désintensifier (R.102/103/105 ;
      SFD Avis 5 bis ; ADA 13.14), en maintenant iSGLT2/AR GLP‑1. Sécurité rénale metformine : 3 g ≥ 60,
      2 g 45‑59, 1 g 30‑44, CI < 30.
    divergence: true
    explication: >-
      Convergence forte sur la direction (relégation SU/gliptines, priorité iSGLT2/AR GLP‑1 par comorbidité,
      non‑association gliptine+GLP‑1, désintensification). Divergences : (1) sur les gliptines — aucun
      bénéfice sur critère dur dans 4 CVOT (TECOS neutre ; SAVOR-TIMI 53, signal d'insuffisance cardiaque
      HR 1,27 pour la saxagliptine) et effets indésirables documentés (pemphigoïde bulleuse HR 1,42, signal
      de pancréatite) : une lecture plus prudente les écarte entièrement de la place résiduelle, là où
      HAS/SFD les y maintiennent, bien tolérées pour le reste — même socle de preuve, soupesé différemment ;
      (2) granularité EBM — l'outil ne
      durcit pas les gains hypo/poids/HbA1c en bénéfice cardio‑rénal, nomme la molécule quand la protection est
      molécule‑spécifique, et ajoute un gating négatif de terrain (IMC bas/dénutrition/infections uro) absent
      des recos en tant que règle algorithmique. L'association iSGLT2 + AR GLP‑1 = coexistence de deux
      indications (séquençage), pas synergie prouvée (bénéfice dur additif non démontré). (3) DÉPRESCRIPTION
      METFORMINE (2026-07-26, 2e série, arbitrage référent) : la HAS maintient la metformine comme socle
      quelles que soient les comorbidités ; l'outil propose désormais sa déprescription sous 3 conditions
      cumulatives strictes (sur-traitement déclaré + fragilité + tous les autres agents en cours à bénéfice
      dur démontré, cf. option dédiée et `metformine_deprescriptible`) — appui sur l'absence de bénéfice
      démontré vs placebo (Griffin 2017, Boussageon 2012 NS), déclaré comme divergence dans l'option
      elle-même, jamais présenté comme un alignement HAS/SFD/ADA.
incertitudes:
  - "Seuils de terrain (IMC 22 pour les AR GLP‑1 ; obésité 30 pour le tirzépatide) = repères pragmatiques (décision référent) : la preuve borne la direction, pas le chiffre exact."
  - "Remboursement FR « intolérance/CI metformine → monothérapie AR GLP‑1 » : CONFIRMÉ (formulaire Assurance Maladie dulaglutide/liraglutide, Art. 61 convention médicale, arrêté du 10/01/2025). Le formulaire vise dulaglutide/liraglutide ; sémaglutide/autres = formulaires propres (même logique)."
  - "Bénéfice dur de la substitution elle-même : jamais testé en switch (argument indirect = valeur comparée des classes)."
  - "Additivité iSGLT2 + AR GLP‑1 sur critères durs : non démontrée (PRECIDENTD en cours) ; additivité glycémique/pondérale acquise."
  - "Désintensification : preuve faible / accord d'experts ; pas d'ECR de devenirs durs."
  - "Chaînage inter-nœuds A→prescription : PAS de chaînage (R1, docs/decision/GRAMMAIRE-NOEUD.md) — la cible individualisée du nœud A n'est pas importée automatiquement, la position vs objectif est DÉCLARÉE ici (`position_vs_cible`), le nœud A restant une aide, jamais un prérequis ; le garde-fou < 6,5 % (`hba1c_sous_cible`) reste absolu, indépendant de la cible. Chaînage prescription→E (insuline) : hors moteur (P3+)."
  - "PRÉMISSE FAUSSE, entrée corrigée le 2026-07-27 (question du référent : « pourquoi l'intensification glycémique est-elle fermée par l'IMC > 30 ? »). Elle ne l'est PAS : aucun verrou IMC ne ferme l'intensification dans ce nœud — vérifié en faisant tourner le profil dans le moteur. Un obèse dénutri, au-dessus de sa cible, avec l'intention INTENSIFIER reçoit bien iSGLT2, gliptine et sulfamide ; seules les incrétines sont écartées, par la dénutrition, à juste titre. La sortie appauvrie [socle metformine, poursuivre] décrite par l'ancienne entrée ne survient qu'avec l'intention OPTIMISER, où la palette glycémique est fermée par l'INTENTION DÉCLARÉE (`palette_glycemique_ouverte`, séquençage référent S8) — l'IMC n'y est pour rien. Reste, si on veut, une vraie question de cohérence sans rapport avec l'obésité : que faire d'un patient déclaré au-dessus de sa cible dont le praticien déclare l'intention « optimiser » ? Le nœud lui propose alors le socle et la poursuite, ce qui est fidèle à l'intention déclarée (R1) mais peut surprendre."
  - "L'indisponibilité des deux classes à bénéfice dur (`isglt2_indisponible == true AND aglp1_indisponible == true`) supprime l'introduction d'iSGLT2 / AR GLP-1 / tirzépatide / association et ouvre l'intensification glycémique résiduelle (correction S3-S7, M1) : cohérent avec la niche SU/gliptine qui n'existe que lorsque ces classes sont inutilisables. Depuis le 2026-07-29, cette indisponibilité est CALCULÉE à partir des motifs durs déjà encodés (DFG, infections génito-urinaires, dénutrition, IMC, classe déjà en cours) au lieu d'être un drapeau saisi — la préférence du patient pour ou contre l'injectable n'y entre volontairement pas, elle ne joue que sur le rang."
  - "Repli O11 (« pas de remplaçant protecteur pertinent ») : encodé en ALERTE A9 (2 disjonctions pur-AND, causes IMC<22 / dénutrition sans indication iSGLT2) + rappel en prose dans l'option. Couvre le cas sans indication protectrice ; ne se déclenche pas si un remplaçant serait valide."
  - "Élargir la désintensification au SOCLE (metformine, iSGLT2 sans indication d'organe), au-delà de sulfamide/glinide/insuline : demandé par le référent (recette capture 6, 2026-07-26) — PARTIELLEMENT TRANCHÉ le 2026-07-26 (2e série) pour la METFORMINE SEULE : l'arbitrage référent (« sur-traitement chez une personne fragile et tous les autres agents à bénéfice dur ») est désormais encodé (option « Déprescrire la metformine », critère `metformine_deprescriptible`). TRANCHÉ le 2026-07-27 pour l'iSGLT2 : PAS de déprescription sur le seul motif de l'absence d'indication d'organe (statu quo). Motif référent : un iSGLT2 sans indication d'organe garde un effet glycémique et un bénéfice rénal possible ; le retirer sur ce seul fondement demanderait une preuve que le dossier ne contient pas. Il ne s'allège donc que s'il pose un risque avéré — c'est l'option « Reconsidérer un agent protecteur prescrit hors indication ET posant un risque », déjà en place. Reste NON tranché : TRANCHÉ le 2026-07-27 (référent) — le comportement actuel est SUFFISANT et devient une décision assumée : un patient sur-traité qui ne réunit pas les 3 conditions relève des options d'allègement existantes (sulfamide, glinide, insuline), la metformine étant le SOCLE et donc le dernier agent qu'on retire. La séquence n'a pas besoin d'être encodée davantage : elle découle de ce qui est proposé. Conséquence sur le profil de la capture 6 (ASCVD établie + sous_objectif + intention déprescrire, sans SU/glinide/insuline en cours) : SI ce profil est aussi `fragilite == true`, il devient désormais éligible à la nouvelle option de déprescription de la metformine (en plus de la carte « Introduire un AR GLP‑1 » déjà affichée, indication transverse légitime, `:342`) ; si `fragilite == false`, son comportement reste inchangé (aucune option de désintensification applicable) — non revérifié sur la vignette exacte de la capture 6, dont le détail de `fragilite` n'est pas reproduit dans ce commentaire (invariant CLAUDE.md 6 : signaler plutôt qu'inventer)."
  - "GLINIDE SEUL (sans sulfamide) + DFG < 30 : RÉSOLU le 2026-07-26 (5e série) — l'option unique
    « Réduire la posologie du sulfamide / du glinide » a été SCINDÉE en deux, l'exclusion `DFG < 30`
    ne portant plus que sur la branche sulfamide. La vérification en source primaire
    (`docs/decision/validation/chantier-2026-07-26/rcp-glinide-insuffisance-renale.md`) établit que le
    répaglinide n'a AUCUNE contre-indication rénale au RCP (rubrique 4.3), s'élimine à > 90 % par voie
    hépatobiliaire, et que l'exposition doublée en IRC sévère (ASC ×2 entre 20 et 39 ml/min, rubrique 5.2)
    justifie une prudence posologique — c'est-à-dire précisément le geste que l'option propose. L'exclusion
    héritée retirait donc à ce patient le geste que son propre RCP recommande.
    ÉTAT DES TROIS RÉSIDUELS au 2026-07-27 (6e série, collecte + red-team adversarial) :
    (b) CLOS — deux sources françaises de rang recommandation nomment le répaglinide : SFD 2025 Avis n° 12
    bis (liste fermée des molécules utilisables sous DFG 15, répaglinide nommément) et HAS 2024 R.78
    (grade C, « répaglinide (demi-vie courte) et en raison de sa « non-CI » en cas de maladie rénale »). Le
    sourçage ne repose plus sur le seul RCP. (À noter : OpenEvidence affirmait qu'aucun texte français ne
    traitait le sujet — c'était faux, deux fois ; le red-team a tranché en rouvrant les PDF.)
    (c) CLOS — le RCP centralisé EMA de Novonorm a été extrait sans difficulté par le red-team : rubrique
    4.3, cinq contre-indications, AUCUNE rénale ; rubriques 4.2 et 5.2 identiques aux génériques consultés.
    (a) MAINTENU, REDESCENDU D'UN CRAN — et surtout PAS clos, contrairement à ce que la collecte proposait.
    Elle voulait le clore au motif qu'une PK spécifique de l'hémodialysé existerait (Marbury 2000, bras
    n = 6 avec dosage du dialysat : « hemodialysis did not significantly affect repaglinide clearance »).
    Le red-team a montré que ce bras est en DOSE UNIQUE ×2 avec washout : il établit que l'hémodialyse
    n'épure pas le répaglinide, PAS qu'une prise prandiale répétée soit sûre chez le dialysé — deux
    affirmations différentes. Il a de plus relevé la phrase que la collecte omettait, dans le même résumé :
    « the elimination rate constant in the group with severe renal impairment decreased after 1 week of
    treatment » (signal d'accumulation en administration répétée), et le fait que l'étiquetage FDA NIE
    positivement l'existence de toute étude sous CrCl 20 ou en hémodialyse.
    Formulation juste : l'option est SOUTENUE PAR UNE RECOMMANDATION (SFD, sous 15) mais SANS donnée
    pharmacocinétique d'état d'équilibre en dialyse, et avec un signal d'accumulation en IR sévère. Pas de
    borne inférieure à poser dans le nœud ; c'est la prudence posologique qui reste le geste, et elle est
    déjà ce que l'option propose."
  - "SEUIL « DFG < 30 » DU SULFAMIDE — RÉSOLU le 2026-07-27 (6e série) : ce n'est plus une convention,
    c'est une CITATION. L'entrée disait vrai sur les RCP (ni le gliclazide ni le glimépiride ne chiffrent
    l'« insuffisance rénale sévère ») mais attribuait le seuil de 30 à une « convention KDIGO/SFD ».
    Vérification en source primaire, puis re-vérification adversariale indépendante
    (`chantier-2026-07-27/preuve-seuils-renaux-su-glinide.md` et `redteam-seuils-renaux.md`) :
    — la KDIGO 2022 ne porte AUCUN chiffre sur les sulfamides (recherche exhaustive sur les 9 dénominations
    de molécules ; sa Figure 23 ne chiffre que metformine et iSGLT2). L'attribution KDIGO était fausse et a
    été retirée du nœud (option « Arrêter le sulfamide »).
    — la SFD, elle, porte le chiffre et la contre-indication DANS LA MÊME PHRASE, sur deux éditions (2023
    et 2025) : Tableau I note 1 (stade 4 = 15-29, stade 5 = < 15) + note 2 (« Les sulfamides hypoglycémiants
    sont contre-indiqués en cas d'IRC sévère ou terminale ») + Avis n° 12 (« DFG entre 15 et 29 […] ou
    terminale (DFG < 15) […] (SU contre-indiqués) »). Il n'y a aucune déduction à faire.
    — la HAS 2024 ne nomme JAMAIS un sulfamide individuel (0 occurrence de `clazide|piride|clamide|pizide`
    dans ses 17 249 lignes) et ne porte aucun seuil de DFG pour la classe ; le guide HAS parcours MRC non
    plus (il se récuse explicitement sur le glycémique). Le négatif HAS est complet et fermé.
    RESTE NON ENCODÉ, délibérément : la DISTINCTION entre molécules (gliclazide métabolisé en métabolites
    inactifs vs glimépiride produisant un métabolite M1 actif qui s'accumule) est réelle et portée par au
    moins deux sociétés savantes ÉTRANGÈRES — Endocrine Society 2019 (glimépiride « should not be used with
    an eGFR < 30 », recommandation graduée 1|⊕⊕OO, PMID 30903688) et Société suisse d'endocrinologie et de
    diabétologie 2012 (gliclazide seul jusqu'à 40, glimépiride contre-indiqué < 60). Aucune source
    FRANÇAISE de rang recommandation ne la porte, et les seuils étrangers (40 / 60) contrediraient les RCP
    français. Décision maintenue : ne pas l'encoder. Motif rectifié : « aucune source FRANÇAISE », et non
    « aucune source » — la collecte avait écrit la seconde formulation, qui est fausse."
  - "SUJET ÂGÉ « DÉPENDANT » — SUR-BLOCAGE ASSUMÉ (décision référent 2026-07-27, 6e série). La SFD 2025
    distingue deux crans : « éviter » chez le sujet âgé FRAGILE, « ne JAMAIS utiliser » chez le sujet âgé
    DÉPENDANT (Tableau I note 6 ; durcissement par rapport à 2023, qui écrivait « préférable d'éviter » pour
    les deux). Le nœud n'a pas de catégorie « dépendant » : `fragilite` est un booléen. Le référent a
    tranché pour poser l'exclusion sur ce booléen plutôt que de créer un statut gériatrique à trois valeurs
    (qui aurait obligé à reprendre tous les dérivés consommant `fragilite`). Conséquence assumée : le
    sulfamide est désormais RETIRÉ chez le sujet fragile, alors que la source dit seulement de l'éviter.
    Sur-blocage délibéré, du côté sûr d'un garde-fou d'hypoglycémie. Si un statut gériatrique à trois
    valeurs est créé un jour (ici ou ailleurs dans le domaine), cette exclusion doit être resserrée sur
    `dépendant` et le cran « fragile » redescendu en alerte."
  - "PLANCHER D'HbA1c CONDITIONNEL — le garde-fou `hba1c_sous_cible` vaut désormais 7 % (et non 6,5 %)
    quand DFG < 30 ET glinide ou insuline en cours, conformément à la SFD 2025 Avis n° 12. NON TRANCHÉ, et
    signalé plutôt que deviné : la SFD attache ce plancher au couple « IRC sévère + glinide/insuline » ;
    elle ne dit rien du patient à DFG < 30 sous un AUTRE agent hypoglycémiant, ni du patient sous
    glinide/insuline à DFG 30-44. Ces deux zones restent au plancher général de 6,5 %. C'est la lecture
    littérale de la source ; ce n'est pas nécessairement la bonne lecture clinique."
  - "GLIPTINE UTILISABLE SOUS DFG 30 — RÉSOLU le 2026-07-27. Le point de fait est TRANCHÉ : le référent a vérifié, la sitagliptine 25 mg n'est effectivement pas commercialisée en France. La SFD 2025 disait donc vrai, et l'extension de la décision aux trois endroits du nœud (option « Arrêter le sulfamide », option gliptine, alerte « place résiduelle en insuffisance rénale ») était justifiée : sous DFG 30, le nœud nomme la VILDAGLIPTINE 50 mg/j. Ce que la question a fait apparaître au passage et qui reste vrai : le red-team n'avait pas pu ouvrir la BDPM et avait explicitement laissé le point au référent plutôt que de le deviner (invariant 6) — c'est la bonne conduite, et elle a payé. La tension apparente avec la décision du nœud D (« gliptine FR = sitagliptine ») n'en est pas une : celle-là porte sur la CLASSE disponible en France, celle-ci sur le DOSAGE utilisable en rénal sévère."
  - "ABSENCE DE BÉNÉFICE DUR DU RÉPAGLINIDE — RÉSOLU le 2026-07-30 (T-063). La première tentative de cette
    tâche s'était arrêtée bloquée : le nœud traitait déjà le glinide comme un agent sans bénéfice dur à
    plusieurs endroits (désintensification, alerte de cohérence, `metformine_deprescriptible`), mais
    AUCUNE source du nœud ne documentait cette absence de bénéfice SPÉCIFIQUEMENT pour le répaglinide, et
    les 3 sources déjà présentes (Schumacher/Marbury/Hasslacher) portaient uniquement la pharmacocinétique
    rénale, pas le bénéfice/risque sur critère dur — invariant 6 (« signaler plutôt qu'inventer »), pas
    d'argumentaire par analogie avec le sulfamide. Levé par une collecte de preuve dédiée, vérifiée en
    primaire PMID par PMID (deux PMID de la collecte initiale étaient FAUX, corrigés : Leonard 2018 =
    29108130, pas 29139156 ; Monami 2014 = 24635837, pas 25266331 — ce dernier NON versé, faute d'avoir pu
    confirmer indépendamment le sous-résultat qu'il est censé porter). Preuve DÉLIBÉRÉMENT non présentée
    comme un fait clos : absence d'ECR dédié (Grenet 2019) + signal de mortalité au niveau CLASSE sans
    signal MACE (Mannucci 2020) + signal repaglinide-spécifique de grade TRÈS FAIBLE, observationnel, avec
    ses réserves de confusion nommées une à une (Huang & Yeh 2019) — `niveau_preuve: tres_faible` sur la
    carte, à dessein différent du `modere` du sulfamide/de la gliptine, qui reposent sur des CVOT neutres
    en ECR. Détail complet, sources et réserves : argumentaire, section « Le glinide rejoint les agents
    sans bénéfice sur critère dur »."
