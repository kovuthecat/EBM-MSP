  changelog:
    - date: "2026-07-27"
      auteur: "référent DT2 + Claude Code"
      resume: >-
        Incertitude close, aucun changement de comportement : le patient sur-traité qui ne réunit pas les
        3 conditions de déprescription de la metformine relève des options d'allègement existantes
        (sulfamide, glinide, insuline), la metformine étant le socle et donc le dernier agent retiré.
        La séquence découle de ce qui est proposé, elle n'a pas besoin d'être encodée davantage
        (décision référent).
    - date: "2026-07-27"
      auteur: "référent DT2 + Claude Code"
      resume: >-
        Alerte ajoutée (arbitrage référent) sur la combinaison « position déclarée AU-DESSUS de l'objectif
        + intention OPTIMISER » : l'outil ne proposait alors aucun levier glycémique, en silence. Le
        comportement est CONSERVÉ — il est fidèle à l'intention déclarée (R1), la palette étant commandée
        par l'intention et non par la position — mais sa raison devient visible, avec l'issue explicite
        (« déclarer l'intention intensifier ouvre les options correspondantes »). C'est le silence qui
        avait fait attribuer à tort ce comportement à un verrou IMC inexistant.
    - date: "2026-07-27"
      auteur: "référent DT2 + Claude Code"
      resume: >-
        Deux incertitudes closes, aucun changement de comportement. (1) Désintensification de l'iSGLT2 sans
        indication d'organe : TRANCHÉE en statu quo — pas de déprescription sur le seul motif de l'absence
        d'indication (l'agent garde un effet glycémique et un bénéfice rénal possible ; le retirer demanderait
        une preuve absente du dossier). Il ne s'allège que s'il pose un risque avéré, ce que couvre déjà
        l'option « Reconsidérer un agent protecteur… ». (2) Entrée « obèse + dénutri » RÉÉCRITE : sa prémisse
        était fausse. Aucun verrou IMC ne ferme l'intensification — vérifié en faisant tourner le profil dans
        le moteur : avec l'intention INTENSIFIER, ce patient reçoit iSGLT2, gliptine et sulfamide, seules les
        incrétines étant écartées par la dénutrition. La sortie appauvrie décrite ne survient qu'avec
        l'intention OPTIMISER, où la palette est fermée par l'intention déclarée. Deuxième entrée périmée
        trouvée en deux jours.
    - date: "2026-07-26"
      auteur: "référent DT2 + Claude Code"
      resume: >-
