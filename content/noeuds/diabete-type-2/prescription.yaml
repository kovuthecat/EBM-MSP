# Nœud « Prescription non‑insulinique du DT2 » — FUSION de B (1re intention) + C (intensification) +
# D (sulfamides/gliptines). BROUILLON v0.1 (2026‑07‑24) — issu du gel P3·S1.
# Autorité : docs/decision/noeuds/prescription.SPEC.md (gelé 2026‑07‑24) + prescription.md (dossier consolidé,
# socle de preuve importé de B/C/D) + .argumentaire.md (niveau 3). Vérification bi‑agents = P3·S4.
# Ne PAS modifier les valeurs cliniques hors workflow veille → algo (D5). Statut clinique : à valider référent.
#
# NŒUD MULTI‑OPTIONS (D10/D11) : plusieurs gestes se combinent, triés par `priorite` croissante (D13/D14).
# Piloté par le primer `intention` (S8) + `traitements_en_cours` (liste vide = naïf = 1re intention).
# GATING NÉGATIF DE TERRAIN (gel S1 §4/§5) : AR GLP‑1 exclu si IMC < 22 OU dénutrition (mord même chez l'obèse) ;
# tirzépatide réservé à l'obésité (IMC ≥ 30), exclu si dénutrition ; iSGLT2 rétrogradé (rang 6) + alerté si
# infections génito‑urinaires récidivantes ; alerte fragilité sur les incrétines. Fix « préférence » (bug 9) :
# priorités CONDITIONNELLES iSGLT2/GLP‑1 (athérome pur → GLP‑1 devant ; IC/rénal → iSGLT2 devant).
# PORTES (gel) : SU/gliptine/intolérance → SWITCH si HbA1c à/au‑dessus de la cible ; DÉPRESCRIPTION si
# hba1c_sous_cible (< 6,5 %, à tout âge — jamais un agent protecteur). Non‑association gliptine+GLP‑1 par
# construction (O6/O7 exigent ne_contient_pas gliptine). REFONTE S8 (2026-07-25) : primer = `intention`
# (initier/intensifier/optimiser/deprescrire) qui DÉDUIT `cible_atteinte` (dérivé) — remplace `position_vs_cible`.
# `hba1c_sous_cible` = drapeau SAISI < 6,5 % (garde-fou absolu). `terrain_fragile` dérivé. PALETTE GLYCÉMIQUE
# (S8) : iSGLT2/AR GLP-1 dispo aussi pour le contrôle glycémique (cible_atteinte==false), la comorbidité
# PRIORISE ; insuline/SU/gliptine = agents possibles de bas rang ; repli insuline si palette non-insulinique
# épuisée. `sur_traitement` RETIRÉ.
id: prescription
domaine: diabete-type-2
titre: "Traiter : initier, optimiser, intensifier"
population_cible: >-
  Adulte DT2 (hors DT1, grossesse), à tout stade de la prescription non‑insulinique : naïf sous mesures
  d'hygiène de vie (metformine socle), déjà traité à optimiser, ou candidat à une désintensification. Couvre
  l'ajout d'un agent protecteur, le switch d'un agent de faible valeur (sulfamide/gliptine) ou mal toléré, la
  désintensification, la place résiduelle des sulfamides/gliptines, et l'insuline d'INITIATION (état
  catabolique). Hors périmètre : ajustement fin des doses d'insuline (nœud E) ; décompensation aiguë
  (cétose/hyperosmolarité ≥ 3 mmol/L) = urgence (insuline + hospitalisation).
selection: multi-options
argumentaire_exhaustif: "prescription.argumentaire.md"
# ORDRE DE SAISIE = ORDRE DU RAISONNEMENT EN CONSULTATION (refonte UI P3 · S7-ui Lot 2, 2026-07-25).
# Les champs `groupe` / `visible_si` sont de la PRÉSENTATION PURE (aucun effet moteur) : ils décident de
# l'ordre des sections du formulaire (ordre de 1re apparition ci-dessous) et du masquage des champs sans
# objet. Séquence : pourquoi je touche au traitement → où on en est → ce qui oriente vers une classe →
# ce qui l'interdit → le terrain et les préférences.
criteres_entree:
  # 1. LE CADRE — posé en premier, il conditionne tout le reste (et l'affichage de la section suivante).
  - nom: intention
    type: enum
    groupe: Intention thérapeutique
    # PRIMER (décision référent S8, 2026-07-25) : « je souhaite… ». Remplace `position_vs_cible` (l'HbA1c
    # seule ne donne pas le « vs cible » sans le nœud A). L'intention DÉDUIT `cible_atteinte` ; elle ORGANISE
    # (flux + affichage), elle ne filtre jamais durement (non-étanche : les gestes transverses restent affichés).
    valeurs: [initier, intensifier, optimiser, deprescrire]

  # 2. L'ÉTAT DES LIEUX — ce que le patient prend déjà, et où en est le contrôle.
  - nom: traitements_en_cours
    type: liste
    groupe: Traitement actuel et contrôle
    # INITIER = patient naïf par définition : la question n'a pas d'objet, le champ est masqué (et remis à
    # vide s'il avait été rempli sous une autre intention — cf. lib/formLayout.ts).
    visible_si: "intention != initier"
    valeurs: [metformine, iSGLT2, aGLP1, tirzepatide, sulfamide, gliptine, insuline, glinide]
  - nom: HbA1c_actuelle
    type: nombre
    groupe: Traitement actuel et contrôle

  # 3. CE QUI ORIENTE POSITIVEMENT vers une classe (indications d'organe : cœur, rein, poids).
  - nom: ASCVD_etablie
    type: bool
    groupe: Ce qui oriente le choix
  - nom: insuffisance_cardiaque
    type: bool
    groupe: Ce qui oriente le choix
  - nom: DFG
    type: nombre
    groupe: Ce qui oriente le choix
  - nom: albuminurie
    type: enum
    groupe: Ce qui oriente le choix
    valeurs: [normo, micro, macro]
  - nom: IMC
    type: nombre
    groupe: Ce qui oriente le choix

  # 4. CE QUI RESTREINT — drapeaux de sécurité et de tolérance (gating négatif, gel S1 §4/§5).
  - nom: symptomes_glucotoxicite
    type: bool
    groupe: Signaux d'alerte et tolérance
  - nom: cetonemie
    type: bool
    groupe: Signaux d'alerte et tolérance
  - nom: hypoglycemie_recente
    type: bool
    groupe: Signaux d'alerte et tolérance
    # INITIER = naïf de tout traitement : on ne peut pas être en hypoglycémie SOUS traitement quand
    # aucun traitement n'est encore prescrit (décision référent, recette 2026-07-25). Question sans objet.
    visible_si: "intention != initier"
  - nom: denutrition
    type: bool
    groupe: Signaux d'alerte et tolérance
  - nom: infections_uro_genitales_recidivantes
    type: bool
    groupe: Signaux d'alerte et tolérance
  - nom: intolerance_traitement
    type: bool
    groupe: Signaux d'alerte et tolérance
    # INITIER = naïf de tout traitement : on ne peut être intolérant à un traitement qui n'a jamais été
    # instauré (décision référent, recette 2026-07-25). `nature_intolerance` suit en cascade (déjà masqué
    # derrière `intolerance_traitement == true`, lui-même désormais masqué à l'initiation).
    visible_si: "intention != initier"
  - nom: nature_intolerance
    type: enum
    groupe: Signaux d'alerte et tolérance
    # Sous-question : sans objet tant qu'aucune intolérance n'est signalée. `aucune` par défaut (sûr).
    visible_si: "intolerance_traitement == true"
    valeurs: [aucune, digestive, uro_genitale, perte_poids, cutanee, autre]

  # 5. LE TERRAIN ET LES PRÉFÉRENCES — modulent, décident rarement seuls.
  - nom: age
    type: nombre
    groupe: Terrain et préférences
  - nom: fragilite
    type: bool
    groupe: Terrain et préférences
  - nom: esperance_vie
    type: enum
    groupe: Terrain et préférences
    valeurs: [longue, intermediaire, limitee]
  - nom: risque_hypoglycemie_schema
    type: enum
    groupe: Terrain et préférences
    valeurs: [faible, eleve]
  - nom: preference_injection
    type: enum
    groupe: Terrain et préférences
    valeurs: [indifferent, accepte, refuse]
  - nom: classes_a_benefice_indisponibles
    type: bool
    groupe: Terrain et préférences
  - nom: hba1c_sous_cible
    type: bool
    # DÉRIVÉ de l'HbA1c saisie (garde-fou ABSOLU < 6,5 %, indépendant de la cible du nœud A). Le garde `> 0`
    # évite le faux positif quand l'HbA1c n'est pas encore saisie (défaut 0). Un défaut « false » d'un drapeau
    # manuel n'était PAS sûr pour un garde-fou (patient à 6,0 % non coché → pas de déprescription — vérif S8).
    derive: "HbA1c_actuelle > 0 AND HbA1c_actuelle < 6.5"
  - nom: cible_atteinte
    type: bool
    derive: "intention == optimiser OR intention == deprescrire"
  - nom: terrain_fragile
    type: bool
    derive: "age >= 75 OR fragilite == true OR esperance_vie == limitee OR risque_hypoglycemie_schema == eleve"
  - nom: palette_glycemique_ouverte
    type: bool
    # Séquençage (décision référent S8) : la palette glycémique PURE (ajout d'un 2e agent sans indication de
    # protection) est ouverte en INTENSIFICATION (déjà traité, objectif non atteint) ; à l'INITIATION (naïf),
    # seulement si HbA1c ≥ 8,5 % (HAS : monothérapie metformine d'abord, bithérapie d'emblée si nettement au-
    # dessus). optimiser/déprescrire ⇒ fermée. (≡ cible_atteinte==false, affiné par l'amplitude à l'initiation.)
    derive: "intention == intensifier OR intention == initier AND HbA1c_actuelle >= 8.5"
# `familles` (correctif « ordre accidentel / badge multi-natures », 2026-07-25) : déclaration EXPLICITE
# des sections du panneau de résultats, présentation pure (aucun effet moteur, cf.
# schema/noeud.schema.json). L'ORDRE DE CE TABLEAU EST L'ORDRE D'AFFICHAGE — « urgence d'abord » (décision
# référent) — indépendant de l'ordre d'écriture des options ci-dessous. `exclusive` porte la sémantique
# « on en choisit un » (true) vs « on fait tout » (false) ; l'UI en dérive la mention de section, jamais
# un libellé clinique en dur. Confine aussi les égalités de `priorite` À L'INTÉRIEUR d'une même famille
# (`groupesParFamille`) : deux gestes de familles différentes au même rang ne sont plus jamais présentés
# comme un choix exclusif alors qu'ils se cumulent.
familles:
  - libelle: "À faire d'emblée — sécurité"
    exclusive: false
  - libelle: "Socle du traitement"
    exclusive: false
  - libelle: "Agent à ajouter"
    exclusive: true
  - libelle: "Traitement à corriger ou remplacer"
    exclusive: false
  - libelle: "Traitement à alléger"
    exclusive: false
  - libelle: "Aucun geste — surveiller"
    exclusive: false
options:
  # ---- Gate / socle -------------------------------------------------------------------------------------
  - intitule: "Insuline d'initiation (souvent transitoire — état catabolique)"
    conditions:
      - "HbA1c_actuelle >= 10 AND symptomes_glucotoxicite == true OR cetonemie == true"
    priorite: 1
    famille: "À faire d'emblée — sécurité"
    avantages:
      - "Corrige rapidement la glucotoxicité en cas d'hyperglycémie sévère symptomatique / catabolique ; le plus souvent transitoire (relais possible une fois la glucotoxicité levée)."
    inconvenients:
      - "Sans catabolisme franc, un AR GLP‑1 / tirzépatide (± insuline basale) est de plus en plus préféré (SIMPLE, ADA 2026)."
      - "Contrainte (injections, auto‑surveillance), hypoglycémie, prise de poids. L'ajustement fin relève du nœud E."
    effet_attendu: >-
      Lève la glucotoxicité ; aucun bénéfice sur critère dur démontré (accord d'experts). Suspecter un DT1
      devant une cétose / un amaigrissement rapide chez un sujet non obèse.
    niveau_preuve: tres_faible
    contre_indications:
      - "Cétonémie ≥ 3 mmol/L → urgence (insuline + hospitalisation), hors périmètre du nœud."
  - intitule: "Metformine (socle du traitement) — instaurer ou poursuivre"
    conditions:
      - "toujours"
    priorite: 0
    famille: "Socle du traitement"
    exclusions:
      - "DFG < 30"
    avantages:
      - "Reco officielle française maintenue en 1re intention (coût, recul, tolérance, absence d'hypoglycémie) ; suffit SEULE sans indication d'agent à bénéfice d'organe."
    inconvenients:
      - "Bénéfice propre sur critère dur de preuve faible (ne pas afficher « bénéfice CV prouvé »)."
      - "EXCEPTION à la poursuite — intolérance digestive (surtout si un AR GLP‑1 est aussi en cours) : la metformine étant l'agent au bénéfice le plus faible, sa réduction / son arrêt est à privilégier (cf. option « réduire l'agent mal toléré » et alerte)."
    effet_attendu: >-
      Pas de bénéfice sur critère dur démontré vs placebo (Griffin 2017, Boussageon 2012 NS). Socle par
      tolérance / sécurité / coût / recul.
    niveau_preuve: faible
    contre_indications:
      - "CONTRE‑INDIQUÉE si DFG < 30 (RCP ANSM) ; à écarter en insuffisance cardiaque décompensée, IDM récent, insuffisance hépatique, alcoolisme. À suspendre : déshydratation, sepsis, jeûne, produit de contraste iodé, chirurgie."
  # ---- Sécurité rénale metformine ----------------------------------------------------------------------
  - intitule: "Arrêter la metformine (DFG < 30 — contre‑indication rénale)"
    conditions:
      - "traitements_en_cours contient metformine"
      - "DFG < 30"
    priorite: 1
    famille: "À faire d'emblée — sécurité"
    avantages:
      - "Metformine CONTRE‑INDIQUÉE < 30 mL/min/1,73m² (RCP ANSM) : supprime le risque d'acidose lactique par accumulation. Relais possible : iSGLT2 (si DFG ≥ 20), AR GLP‑1."
    inconvenients:
      - "Réévaluer le contrôle après l'arrêt (socle retiré) ; renforcer souvent la protection cardio‑rénale en parallèle."
    effet_attendu: >-
      Suppression du risque d'acidose lactique en insuffisance rénale sévère (sécurité — RCP/ANSM).
    niveau_preuve: eleve
  - intitule: "Réduire la posologie de la metformine (fonction rénale altérée ou intolérance digestive)"
    conditions:
      - "traitements_en_cours contient metformine"
      - "DFG >= 30 AND DFG < 60 OR nature_intolerance == digestive"
    priorite: 3
    famille: "À faire d'emblée — sécurité"
    avantages:
      - "Adapter la dose au DFG (RCP ANSM : 45‑59 → max 2 g/j ; 30‑44 → max 1 g/j), OU réduire en cas d'intolérance digestive (la metformine étant l'agent au bénéfice le plus faible : à réduire/arrêter en priorité si un AR GLP‑1 partage l'intolérance — cf. alerte). Le praticien juge la dose."
    inconvenients:
      - "Revoir les facteurs de risque d'acidose lactique ; suspendre en cas de déshydratation, contraste iodé, jeûne. Si l'intolérance persiste malgré la réduction : arrêt (l'intolérance/CI metformine ouvre le remboursement d'une monothérapie AR GLP‑1)."
    effet_attendu: >-
      Réduit le risque d'accumulation en maintenant le bénéfice de la metformine dans la plage utilisable
      (sécurité — RCP/ANSM).
    niveau_preuve: eleve
  - intitule: "Arrêter le sulfamide (DFG < 30 — contre‑indication rénale)"
    conditions:
      - "traitements_en_cours contient sulfamide"
      - "DFG < 30"
    priorite: 1
    famille: "À faire d'emblée — sécurité"
    avantages:
      - "Sulfamide CONTRE‑INDIQUÉ en insuffisance rénale sévère (DFG < 30, convention KDIGO/SFD) : risque d'hypoglycémie sévère et prolongée par accumulation. Arrêter (symétrie avec l'arrêt de la metformine)."
    inconvenients:
      - "Réévaluer le contrôle glycémique ; en rénal sévère, l'insuline devient souvent le pivot (± sitagliptine à dose adaptée au DFG)."
    effet_attendu: >-
      Suppression du risque d'hypoglycémie sévère par accumulation en insuffisance rénale (sécurité — RCP « IR
      sévère » ; convention KDIGO/SFD).
    niveau_preuve: eleve
  # ---- Ajout d'un agent protecteur (fix bug 9 : priorités conditionnelles) ------------------------------
  - intitule: "Introduire un iSGLT2 (protection cardio‑rénale et/ou contrôle glycémique)"
    conditions:
      - "insuffisance_cardiaque == true OR DFG < 60 OR albuminurie != normo OR ASCVD_etablie == true OR palette_glycemique_ouverte == true"
      - "traitements_en_cours ne_contient_pas iSGLT2"
      - "classes_a_benefice_indisponibles == false"
    exclusions:
      - "DFG < 20"
      - "symptomes_glucotoxicite == true"
      - "cetonemie == true"
    priorite:
      - quand: "infections_uro_genitales_recidivantes == true"
        rang: 6
      - quand: "insuffisance_cardiaque == true OR DFG < 60 OR albuminurie != normo"
        rang: 2
      - quand: "ASCVD_etablie == true OR IMC >= 30"
        rang: 3
      - quand: "default"
        rang: 2
    famille: "Agent à ajouter"
    avantages:
      - "Réduit l'hospitalisation pour IC et la progression rénale (effet de classe) — à privilégier quand l'IC ou la maladie rénale prédomine. Proposé indépendamment de l'HbA1c (protection, HAS R.64‑66 grade A)."
      - "Aussi un bon agent de CONTRÔLE GLYCÉMIQUE (sans hypoglycémie, perte de poids modeste) même sans comorbidité : la comorbidité le PRIORISE (versant protecteur), elle ne conditionne pas sa disponibilité comme levier glycémique."
    inconvenients:
      - "Pas d'effet sur l'IDM ni l'AVC ; en athérome pur SANS IC ni maladie rénale, préférer un AR GLP‑1."
      - "Infections génito‑urinaires récidivantes / gangrène de Fournier ; ne pas initier si DFG < 20 ; risque d'acidocétose (suspendre si jeûne, chirurgie, sepsis)."
    effet_attendu: >-
      Hospit. IC HR ~0,61‑0,73 (NNT ~19‑31 / 16‑26 mois) ; progression rénale HR ~0,56‑0,76 (NNT DAPA‑CKD 19,
      CREDENCE 22). IDM/AVC non réduits.
    niveau_preuve: eleve
    contre_indications:
      - "Ne pas initier si DFG < 20 (poursuivre jusqu'à la dialyse si déjà en cours — KDIGO 2024)."
      - "Infections génito‑urinaires récidivantes ; antécédent de gangrène de Fournier ; prudence si artériopathie évoluée / amputation (signal canagliflozine)."
      - "En cas d'IC avec saxagliptine en cours : arrêter la saxagliptine (signal SAVOR), ne pas se contenter d'ajouter l'iSGLT2."
  - intitule: "Introduire un AR GLP‑1 (liraglutide, sémaglutide, dulaglutide)"
    conditions:
      - "ASCVD_etablie == true OR IMC >= 30 OR palette_glycemique_ouverte == true"
      - "traitements_en_cours ne_contient_pas aGLP1"
      - "traitements_en_cours ne_contient_pas tirzepatide"
      - "traitements_en_cours ne_contient_pas gliptine"
      - "classes_a_benefice_indisponibles == false"
    exclusions:
      - "IMC < 22"
      - "denutrition == true"
      - "symptomes_glucotoxicite == true"
      - "cetonemie == true"
    priorite:
      - quand: "preference_injection == refuse"
        rang: 7
      - quand: "insuffisance_cardiaque == true OR DFG < 60 OR albuminurie != normo"
        rang: 3
      - quand: "ASCVD_etablie == true OR IMC >= 30"
        rang: 2
      - quand: "IMC < 25"
        rang: 4
      - quand: "default"
        rang: 2
    famille: "Agent à ajouter"
    avantages:
      - "Réduit les événements athéromateux (surtout l'AVC ; mortalité CV pour le liraglutide) — à privilégier en maladie athéromateuse ou obésité ; forte efficacité HbA1c et perte de poids. Néphroprotection dure = sémaglutide (FLOW)."
      - "Aussi un puissant agent de CONTRÔLE GLYCÉMIQUE (forte baisse d'HbA1c, pas d'hypoglycémie) même sans comorbidité — sous réserve du garde‑fou terrain (exclu si IMC<22 / dénutrition)."
    inconvenients:
      - "GARDE‑FOU TERRAIN : à ne PAS initier chez le sujet maigre (IMC < 22) ou dénutri (aggravation de la dénutrition / sarcopénie) ; prudence chez le sujet fragile (alerte)."
      - "Bénéfice molécule‑spécifique (exclure lixisénatide, exénatide LP) ; quasi nul sur l'IC ; effets digestifs, pancréatite ; signaux mal cernés (thyroïde, NAION séma). Sous gliptine : remplacer, pas associer."
    effet_attendu: >-
      MACE HR ~0,87‑0,88 (AVC/mort CV/IDM selon la molécule) ; NNT ~18 en prévention secondaire, ~60‑70 en
      primaire. Rénal dur = sémaglutide (FLOW, HR 0,76).
    niveau_preuve: modere
    contre_indications:
      - "Antécédent de pancréatite ; antécédent personnel/familial de cancer médullaire de la thyroïde ou NEM2."
      - "Refus des injections : préférer le sémaglutide oral ou une autre classe. Rétinopathie proliférante non stabilisée : prudence."
      - "IMC bas / dénutrition : contre‑indication de terrain (perte de poids délétère)."
  - intitule: "Introduire le tirzépatide (obésité — prescription spécialisée)"
    conditions:
      - "IMC >= 30"
      - "traitements_en_cours ne_contient_pas tirzepatide"
      - "traitements_en_cours ne_contient_pas aGLP1"
      - "traitements_en_cours ne_contient_pas gliptine"
      - "classes_a_benefice_indisponibles == false"
    exclusions:
      - "denutrition == true"
    priorite:
      - quand: "preference_injection == refuse"
        rang: 7
      - quand: "default"
        rang: 4
    famille: "Agent à ajouter"
    avantages:
      - "Efficacité HbA1c et perte de poids supérieures aux AR GLP‑1 ; réservé à l'OBÉSITÉ associée au diabète (IMC ≥ 30), prescription par spécialiste."
    inconvenients:
      - "Bénéfice CV par NON‑INFÉRIORITÉ au dulaglutide seulement (SURPASS‑CVOT, pas de supériorité, pas de CVOT vs placebo). Mêmes effets digestifs/pancréatiques ; injectable hebdomadaire."
      - "GARDE‑FOU TERRAIN : exclu si dénutrition (même chez l'obèse sarcopénique) ; non indiqué hors obésité."
    effet_attendu: >-
      Non‑infériorité au dulaglutide sur le MACE‑3 (HR 0,92 [0,83‑1,01]) ; composite rénal 0,77 [0,68‑0,88].
    niveau_preuve: modere
    contre_indications:
      - "Antécédent de pancréatite ; cancer médullaire de la thyroïde / NEM2 ; refus des injections ; dénutrition."
  - intitule: "Association iSGLT2 + AR GLP‑1 (deux indications distinctes)"
    conditions:
      - "insuffisance_cardiaque == true OR DFG < 60 OR albuminurie != normo"
      - "ASCVD_etablie == true OR IMC >= 30"
      - "traitements_en_cours ne_contient_pas gliptine"
      - "traitements_en_cours ne_contient_pas iSGLT2"
      - "traitements_en_cours ne_contient_pas aGLP1"
      - "traitements_en_cours ne_contient_pas tirzepatide"
      - "classes_a_benefice_indisponibles == false"
    exclusions:
      - "DFG < 20"
      - "symptomes_glucotoxicite == true"
      - "cetonemie == true"
      - "IMC < 22"
      - "denutrition == true"
    priorite:
      - quand: "preference_injection == refuse"
        rang: 7
      - quand: "default"
        rang: 4
    famille: "Agent à ajouter"
    avantages:
      - "Couvre le versant IC/rénal (iSGLT2) ET athéromateux/pondéral (AR GLP‑1) quand les deux indications sont fortes."
    inconvenients:
      - "Bénéfice additif sur critère DUR de preuve FAIBLE (observationnel + sous‑groupes ; PRECIDENTD en cours) : justifié par la coexistence de deux indications, pas par une synergie prouvée. Coût et charge de traitement cumulés (risque d'abandon)."
    effet_attendu: >-
      Additivité glycémique/pondérale acquise (DURATION‑8) ; bénéfice dur additif non confirmé par un ECR dédié.
    niveau_preuve: faible
  - intitule: "Envisager l'insuline (palette non‑insulinique épuisée — ajustement fin → nœud E)"
    conditions:
      - "cible_atteinte == false"
      - "traitements_en_cours contient iSGLT2 AND traitements_en_cours contient aGLP1 OR traitements_en_cours contient iSGLT2 AND denutrition == true OR traitements_en_cours contient iSGLT2 AND IMC < 22"
    priorite: 6
    famille: "Agent à ajouter"
    avantages:
      - "Quand les options non insuliniques sont épuisées ou contre‑indiquées, l'insuline est le levier glycémique le plus puissant et souvent nécessaire. Cas types : metformine + iSGLT2 + AR GLP‑1 toujours déséquilibré ; incrétines exclues par le terrain (dénutrition / IMC bas) chez un patient déjà sous iSGLT2 non contrôlé. (En insuffisance rénale sévère, un AR GLP‑1 ou la sitagliptine à dose adaptée restent souvent utilisables : la palette n'est pas forcément épuisée.)"
    inconvenients:
      - "Contrainte (injections, auto‑surveillance), hypoglycémie, prise de poids ; aucun bénéfice CV (ORIGIN). Débuter par une basale ± AR GLP‑1 si possible. L'AJUSTEMENT FIN (titration, schéma) relève du nœud E."
    effet_attendu: >-
      Baisse d'HbA1c dose‑dépendante ; aucun bénéfice sur critère dur. Distinct du gate catabolique (qui ne
      dépend pas de l'atteinte de l'objectif).
    niveau_preuve: faible
    contre_indications:
      - "Arrêter le sulfamide / le glinide à l'introduction de l'insuline (hypoglycémie cumulée). Suspecter un DT1 devant une cétose / un amaigrissement rapide chez un sujet non obèse."
  # ---- Switch (portes SU/gliptine, branche à/au‑dessus de la cible) -------------------------------------
  - intitule: "Remplacer la gliptine par un AR GLP‑1 (switch, jamais d'association)"
    conditions:
      - "traitements_en_cours contient gliptine"
      - "ASCVD_etablie == true OR IMC >= 30 OR cible_atteinte == false"
      - "traitements_en_cours ne_contient_pas aGLP1"
      - "traitements_en_cours ne_contient_pas tirzepatide"
    exclusions:
      - "IMC < 22"
      - "denutrition == true"
      - "symptomes_glucotoxicite == true"
      - "cetonemie == true"
    priorite: 3
    famille: "Traitement à corriger ou remplacer"
    avantages:
      - "L'AR GLP‑1 est constamment supérieur à la gliptine sur l'HbA1c et le poids (PIONEER‑3, SUSTAIN‑2, AWARD‑5 ; switch Pratley 2012, méta Tran/Kramer −0,69 % / −2,25 kg) et apporte un bénéfice cardio‑rénal que la gliptine n'a pas."
    inconvenients:
      - "RÈGLE DURE : ne jamais ASSOCIER gliptine + AR GLP‑1 (même voie incrétine, aucun bénéfice additif — Nauck 2017 ; ADA §9 ; KDIGO PP4.2.3 ; HAS R.80) → l'introduction de l'AR GLP‑1 implique l'ARRÊT de la gliptine."
      - "Gain démontré glycémique/pondéral (substitution) ; effets digestifs/pancréatiques ; injectable (sauf séma oral). Garde‑fou terrain IMC<22/dénutrition."
    effet_attendu: >-
      Switch : gain HbA1c ~−0,5 à −1,06 % et poids ~−1,6 à −4,2 kg. Bénéfice d'organe = celui de la classe
      AR GLP‑1, non redémontré ici.
    niveau_preuve: modere
    contre_indications:
      - "Ne pas maintenir la gliptine en association : la remplacer. Mêmes CI que l'AR GLP‑1 (pancréatite, thyroïde/NEM2, refus d'injection, IMC bas/dénutrition)."
  - intitule: "Arrêter la gliptine redondante (association gliptine + AR GLP‑1 / tirzépatide déjà en place)"
    conditions:
      - "traitements_en_cours contient gliptine"
      - "traitements_en_cours contient aGLP1 OR traitements_en_cours contient tirzepatide"
    priorite: 3
    famille: "Traitement à corriger ou remplacer"
    avantages:
      - "Corrige une association INTERDITE déjà en place : gliptine + AR GLP‑1/tirzépatide = redondance incrétine sans bénéfice additif → arrêter la gliptine (ADA §9 ; KDIGO PP4.2.3 « stopping the gliptin » ; HAS R.80)."
    inconvenients:
      - "À repérer surtout chez un patient adressé déjà sous les deux ; réévaluer l'HbA1c après l'arrêt (pas de perte d'efficacité attendue)."
    effet_attendu: >-
      Simplification sans perte d'efficacité (Nauck 2017 : +78 % GLP‑1 intact sans effet glycémique additionnel).
    niveau_preuve: modere
  - intitule: "Remplacer le sulfamide (moins d'hypoglycémie, moins de poids, plus de bénéfice)"
    conditions:
      - "traitements_en_cours contient sulfamide"
      - "hypoglycemie_recente == false"
      - "hba1c_sous_cible == false"
      - "insuffisance_cardiaque == true OR DFG < 60 OR albuminurie != normo OR ASCVD_etablie == true OR IMC >= 30 OR risque_hypoglycemie_schema == eleve OR cible_atteinte == false"
    exclusions:
      - "DFG < 30"
    priorite: 4
    famille: "Traitement à corriger ou remplacer"
    avantages:
      - "Le sulfamide n'a aucun bénéfice cardio‑rénal propre (CAROLINA, TOSCA.IT neutres) et cause hypoglycémie + poids + moindre durabilité. Le remplaçant réduit fortement l'hypo sévère (CAROLINA NNT 45) et fait perdre du poids."
    inconvenients:
      - "Aucun ECR de switch dédié ne montre que RETIRER le SU réduit un critère dur (bénéfice d'organe = le remplaçant, argument indirect). Choisir le remplaçant selon la comorbidité (iSGLT2 si IC/rein ; AR GLP‑1 si athérome/obésité)."
      - "REPLI : si aucun remplaçant protecteur n'est applicable sur ce terrain (AR GLP‑1 exclu par IMC<22/dénutrition ET iSGLT2 non indiqué), NE PAS switcher à vide → surveiller ou déprescrire le sulfamide."
    effet_attendu: >-
      Hypo sévère 0,45 → 0,07 / 100 p‑a (CAROLINA, NNT 45) ; poids ~−1,5 à −4 kg ; bénéfice d'organe = iSGLT2 /
      AR GLP‑1 choisi.
    niveau_preuve: modere
    contre_indications:
      - "En sur‑contrôle (hba1c_sous_cible) ou après hypoglycémie/chute récente : il s'agit de DÉSINTENSIFIER (retirer sans remplacer) — cette option ne se déclenche pas. Si un SU doit être conservé : gliclazide/glimépiride, jamais le glibenclamide."
  # ---- Intolérance (porte : réduction OU switch) -------------------------------------------------------
  - intitule: "Optimiser l'agent mal toléré : réduire la posologie (intolérance non majeure) ou remplacer"
    conditions:
      - "intolerance_traitement == true"
    priorite: 2
    famille: "Traitement à alléger"
    avantages:
      - "Une intolérance justifie d'agir. Deux voies : (1) RÉDUIRE la posologie de la molécule en cause si l'intolérance est NON MAJEURE (sévérité et dose = jugement du praticien ; aucun dosage imposé) ; (2) REMPLACER par une classe mieux tolérée (voir les options de switch selon les comorbidités, en excluant la classe en cause)."
    inconvenients:
      - "Documenter la nature de l'intolérance avant de conclure à un échec de classe. Intolérance DIGESTIVE : la metformine ET l'AR GLP‑1 en sont deux sources — privilégier la réduction/l'arrêt de la metformine (bénéfice moindre), cf. alerte."
    effet_attendu: >-
      Restaure la tolérance sans nécessairement abandonner un agent à bénéfice d'organe. Effet non chiffrable
      (dépend de l'agent et du geste retenu).
    niveau_preuve: faible
  # ---- Désintensification (porte : hba1c_sous_cible à tout âge, ou hypo récente sur terrain fragile) ----
  - intitule: "Désintensifier : alléger / arrêter le sulfamide, le glinide ou réduire l'insuline"
    conditions:
      - "hba1c_sous_cible == true OR hypoglycemie_recente == true AND terrain_fragile == true"
      - "traitements_en_cours contient sulfamide OR traitements_en_cours contient glinide OR traitements_en_cours contient insuline"
    priorite: 1
    famille: "Traitement à alléger"
    avantages:
      - "Réduit les hypoglycémies sévères et les chutes sans dégrader le contrôle (Grant 2025 ; ADA 13.14a‑c ; HAS R.103 ; SFD Avis 5 bis). Un HbA1c < 6,5 % sous agent hypoglycémiant = sur‑traitement iatrogène — déprescrire à TOUT ÂGE."
      - "Déclenchée aussi par une hypoglycémie/chute récente chez le sujet fragile (l'HbA1c seule prédit mal l'hypo — HYPOAGE)."
    inconvenients:
      - "Preuve faible / accord d'experts (aucun ECR de devenirs durs). Surveiller la glycémie après l'allègement, réévaluer l'HbA1c à ~3 mois."
    effet_attendu: >-
      Réduit le risque d'hypoglycémie sévère sans dégradation du contrôle (Grant 2025 : hypo sévère 4,7 % vs
      6,5 % NS). Bénéfice sur critères durs non chiffrable.
    niveau_preuve: faible
    contre_indications:
      - "Ne JAMAIS retirer un iSGLT2 ni un AR GLP‑1 pour désintensifier : bénéfice cardio‑rénal maintenu quelle que soit la glycémie (ADA 13.14d grade A). La désintensification ne cible que sulfamide / glinide / excès d'insuline."
  # ---- Déprescrire par RÉDUCTION de dose (distinct par traitement ; le praticien juge la dose, S8) -------
  - intitule: "Réduire la posologie de l'insuline (sur‑basalisation / hypoglycémie)"
    conditions:
      - "traitements_en_cours contient insuline"
      - "hba1c_sous_cible == true OR hypoglycemie_recente == true OR intolerance_traitement == true"
    priorite: 1
    famille: "Traitement à alléger"
    avantages:
      - "Réduire plutôt qu'arrêter : diminue le risque d'hypoglycémie (sur‑basalisation, sujet fragile) sans sevrer un patient qui en a besoin. Le praticien juge la dose (aucun dosage imposé). L'ajustement fin relève du nœud E."
    inconvenients:
      - "Surveiller la glycémie après la baisse ; contrôle volontairement un peu moins strict (assumé)."
    effet_attendu: "Moins d'hypoglycémie sans sevrage complet ; effet non chiffrable."
    niveau_preuve: faible
  - intitule: "Réduire la posologie de l'AR GLP‑1 (perte de poids excessive / intolérance digestive)"
    conditions:
      - "traitements_en_cours contient aGLP1"
      - "denutrition == true OR nature_intolerance == perte_poids OR nature_intolerance == digestive"
    priorite: 2
    famille: "Traitement à alléger"
    avantages:
      - "Réduire plutôt qu'arrêter préserve une partie du bénéfice tout en limitant la perte de poids excessive ou les troubles digestifs. Le praticien juge la dose."
    inconvenients:
      - "Si la perte de poids / dénutrition est marquée : envisager l'arrêt. Réévaluer l'état nutritionnel."
    effet_attendu: "non chiffrable"
    niveau_preuve: faible
  - intitule: "Réduire la posologie du tirzépatide (perte de poids excessive / intolérance)"
    conditions:
      - "traitements_en_cours contient tirzepatide"
      - "denutrition == true OR nature_intolerance == perte_poids OR nature_intolerance == digestive"
    priorite: 2
    famille: "Traitement à alléger"
    avantages:
      - "Même logique que l'AR GLP‑1 : réduire avant d'arrêter en cas de perte de poids excessive ou d'intolérance. Le praticien juge la dose."
    inconvenients:
      - "Si dénutrition marquée : arrêt et réévaluation nutritionnelle."
    effet_attendu: "non chiffrable"
    niveau_preuve: faible
  - intitule: "Réduire la posologie du sulfamide / du glinide (tolérance, hypoglycémie légère)"
    conditions:
      - "traitements_en_cours contient sulfamide OR traitements_en_cours contient glinide"
      - "intolerance_traitement == true OR hypoglycemie_recente == true"
    priorite: 2
    famille: "Traitement à alléger"
    avantages:
      - "Réduire la dose limite l'hypoglycémie tout en gardant l'effet glycémique. Le praticien juge la dose."
    inconvenients:
      - "En sur‑contrôle franc (< 6,5 %) ou hypo/chute chez le fragile : préférer l'allègement/l'arrêt (désintensification). Agent sans bénéfice d'organe : envisager plutôt un switch vers un agent protecteur si le terrain s'y prête."
    effet_attendu: "non chiffrable"
    niveau_preuve: faible
  - intitule: "Reconsidérer un agent protecteur prescrit hors indication ET posant un risque (ex. iSGLT2 sans terrain + infections uro)"
    conditions:
      - "traitements_en_cours contient iSGLT2 AND ASCVD_etablie == false AND insuffisance_cardiaque == false AND DFG >= 60 AND albuminurie == normo AND infections_uro_genitales_recidivantes == true"
    priorite: 4
    famille: "Traitement à alléger"
    avantages:
      - "Un agent à bénéfice associé (rein/CV) prescrit SANS le terrain correspondant ET posant un risque (iSGLT2 sans IC/rein/ASCVD avec infections génito‑urinaires récidivantes) → l'envisager en retrait / switch vers une molécule sûre et bénéfique. (La gliptine sans bénéfice relève, elle, du switch vers un AR GLP‑1 — option dédiée — ou de l'arrêt si association redondante.)"
    inconvenients:
      - "Ne JAMAIS déprescrire un agent qui COUVRE un risque établi (iSGLT2 en IC/rein, AR GLP‑1 en ASCVD). Un iSGLT2/GLP‑1 sans terrain garde une utilité glycémique : ne le retirer que si un risque (ici infections uro) le justifie."
    effet_attendu: "Simplification thérapeutique ; pas de perte de bénéfice d'organe (par construction)."
    niveau_preuve: faible
  # ---- Place résiduelle SU / gliptine (classes protectrices indisponibles) ------------------------------
  - intitule: "Gliptine (sitagliptine) — option glycémique orale de bas rang (place résiduelle)"
    conditions:
      - "classes_a_benefice_indisponibles == true OR palette_glycemique_ouverte == true"
      - "traitements_en_cours ne_contient_pas gliptine"
      - "traitements_en_cours ne_contient_pas aGLP1"
      - "traitements_en_cours ne_contient_pas tirzepatide"
    exclusions:
      - "symptomes_glucotoxicite == true"
      - "cetonemie == true"
    priorite:
      - quand: "classes_a_benefice_indisponibles == true"
        rang: 3
      - quand: "default"
        rang: 5
    famille: "Agent à ajouter"
    avantages:
      - "Agent glycémique ORAL possible « avec ses limites » (bas rang) : sans hypoglycémie, neutre sur le poids, bien toléré sur le plan digestif — la niche quand on veut éviter l'hypoglycémie sans injection, ou quand iSGLT2 et AR GLP‑1 sont indisponibles (le rang remonte alors). Molécule = SITAGLIPTINE (seule gliptine FR à sécurité CV démontrée, TECOS ; utilisable jusqu'en dialyse à dose réduite). Préférée au sulfamide (ordre HAS/SFD)."
    inconvenients:
      - "AUCUN bénéfice sur critère dur (4 CVOT neutres) ; efficacité modeste (~0,5‑0,8 % HbA1c). Effets indésirables : pemphigoïde bulleuse (Lee 2020 HR 1,42), arthralgies (FDA), pancréatite (signal méta). Prescrire l'écarte. Ne jamais associer à un AR GLP‑1."
    effet_attendu: >-
      Baisse d'HbA1c ~0,5‑0,8 % (substitution) ; aucun bénéfice dur. Face au sulfamide : absence d'hypoglycémie
      et de prise de poids (CAROLINA).
    niveau_preuve: modere
    contre_indications:
      - "SITAGLIPTINE (dose au DFG : 100 mg si ≥ 45 ; 50 mg si 30‑44 ; 25 mg si < 30, dialyse incluse). Ne pas utiliser saxagliptine (IC + retrait FR) ni lina/alogliptine (non commercialisées FR). Éruption bulleuse → évoquer pemphigoïde, arrêter."
  - intitule: "Sulfamide (gliclazide MR ou glimépiride) — option glycémique de bas rang, derrière la gliptine"
    conditions:
      - "classes_a_benefice_indisponibles == true OR palette_glycemique_ouverte == true"
      - "traitements_en_cours ne_contient_pas sulfamide"
      - "traitements_en_cours ne_contient_pas insuline"
    exclusions:
      - "DFG < 30"
      - "symptomes_glucotoxicite == true"
      - "cetonemie == true"
    priorite:
      - quand: "classes_a_benefice_indisponibles == true"
        rang: 3
      - quand: "default"
        rang: 5
    famille: "Agent à ajouter"
    avantages:
      - "Agent glycémique possible « avec ses limites » (bas rang) : efficacité nette (~1‑1,5 % HbA1c), la plus forte des deux classes résiduelles ; les SU modernes (gliclazide, glimépiride) ne sont pas plus délétères en CV que des comparateurs récents (CAROLINA, TOSCA.IT, GRADE neutres). Rang remonté si iSGLT2/AR GLP‑1 indisponibles."
    inconvenients:
      - "AUCUN bénéfice sur critère dur. Vrais inconvénients : HYPOGLYCÉMIE (sévère chez l'âgé/l'insuffisant rénal) et PRISE DE POIDS ; durabilité moindre. JAMAIS le glibenclamide (Simpson 2015)."
    effet_attendu: >-
      Baisse d'HbA1c ~1‑1,5 % (substitution) ; aucun bénéfice dur. Gain glycémique contre risque d'hypoglycémie
      (34‑42 % de toute hypo sous SU) et prise de poids.
    niveau_preuve: modere
    contre_indications:
      - "CONTRE‑INDIQUÉ si DFG < 30. Déconseillé chez le sujet à risque d'hypoglycémie élevé (âgé fragile, IR, alimentation irrégulière) : préférer la gliptine. Molécule : gliclazide MR ou glimépiride, jamais le glibenclamide."
  # ---- Repli ------------------------------------------------------------------------------------------
  - intitule: "Poursuivre le traitement en cours et réévaluer"
    conditions:
      - "default"
    famille: "Aucun geste — surveiller"
    avantages:
      - "Aucun geste d'ajout, d'optimisation ni de désintensification n'est indiqué : objectif atteint sans agent iatrogène à optimiser ni indication de protection non couverte. Poursuivre et réévaluer à 3‑6 mois (HAS R.47)."
    inconvenients:
      - "Réévaluer efficacité, tolérance et adhésion à chaque consultation ; arrêter un agent non‑répondeur (< 0,5 % sans indication de protection)."
    effet_attendu: >-
      Pas de modification. Surveillance du contrôle, de la tolérance et de l'apparition d'une indication de
      protection (qui rouvrirait la prescription).
    niveau_preuve: faible
alertes:
  - quand: "HbA1c_actuelle >= 10 OR symptomes_glucotoxicite == true"
    niveau: attention
    message: >-
      Contrôler la cétonémie capillaire (β‑hydroxybutyrate) : décompensation catabolique possible malgré une
      HbA1c non franchement élevée. ≥ 0,6 mmol/L → insuline d'initiation ; ≥ 3 mmol/L → urgence (insuline +
      hospitalisation).
  - quand: "DFG < 60 AND DFG >= 45"
    niveau: attention
    message: >-
      Metformine : dose maximale 2 000 mg/j si DFG 45‑59 (RCP ANSM) ; revoir au préalable les facteurs de
      risque d'acidose lactique.
  - quand: "DFG < 45 AND DFG >= 30"
    niveau: attention
    message: >-
      Metformine : dose maximale 1 000 mg/j, initiation ≤ 500 mg si DFG 30‑44 (RCP ANSM).
  - quand: "DFG < 30"
    niveau: attention
    message: >-
      Metformine CONTRE‑INDIQUÉE si DFG < 30 (RCP ANSM) : arrêter. Un iSGLT2 reste initiable jusqu'à DFG ≥ 20
      (indication rénale) ; en dessous, relais par une autre classe (nœud E). Sulfamide aussi CI < 30.
  - quand: "fragilite == true AND ASCVD_etablie == true OR fragilite == true AND IMC >= 30 OR fragilite == true AND traitements_en_cours contient aGLP1 OR fragilite == true AND traitements_en_cours contient tirzepatide"
    niveau: attention
    message: >-
      Sujet fragile chez qui un incrétine (AR GLP‑1 / tirzépatide) est en cours ou envisagé : surveiller le
      poids et l'état nutritionnel (risque de sarcopénie / anorexie). En cas de dénutrition ou d'IMC bas,
      l'incrétine est contre‑indiquée (garde‑fou de terrain — l'option est alors retirée).
  - quand: "infections_uro_genitales_recidivantes == true AND traitements_en_cours contient iSGLT2 OR infections_uro_genitales_recidivantes == true AND insuffisance_cardiaque == true OR infections_uro_genitales_recidivantes == true AND DFG < 60 OR infections_uro_genitales_recidivantes == true AND albuminurie != normo OR infections_uro_genitales_recidivantes == true AND ASCVD_etablie == true"
    niveau: attention
    message: >-
      iSGLT2 (en cours ou indiqué par la comorbidité) + infections génito‑urinaires récidivantes : réévaluer
      l'indication (ne pas initier / envisager l'arrêt) ; risque de gangrène de Fournier. Préférer une autre
      classe si une protection est requise.
  - quand: "nature_intolerance == digestive AND traitements_en_cours contient metformine AND traitements_en_cours contient aGLP1 OR nature_intolerance == digestive AND traitements_en_cours contient metformine AND traitements_en_cours contient tirzepatide"
    niveau: attention
    message: >-
      Intolérance digestive : la metformine ET l'AR GLP‑1 / tirzépatide en sont deux sources. Privilégier
      généralement la réduction / l'arrêt de la METFORMINE (bénéfice le plus faible). L'intolérance ou la
      contre‑indication à la metformine ouvre d'ailleurs le remboursement d'une MONOTHÉRAPIE d'AR GLP‑1
      (dulaglutide/liraglutide) en France — formulaire Assurance Maladie, Art. 61 de la convention médicale,
      arrêté du 10/01/2025 : « en monothérapie, quand l'utilisation de la metformine est considérée comme
      inappropriée en raison d'une intolérance ou de contre‑indications ».
  - quand: "classes_a_benefice_indisponibles == true AND risque_hypoglycemie_schema == eleve"
    niveau: attention
    message: >-
      Risque d'hypoglycémie élevé + place résiduelle : DÉCONSEILLER le sulfamide, préférer la gliptine
      (sitagliptine, sans hypoglycémie). Si un SU est retenu : gliclazide MR à dose basse, jamais le
      glibenclamide, avec éducation à l'hypoglycémie.
  - quand: "classes_a_benefice_indisponibles == true AND DFG < 45"
    niveau: attention
    message: >-
      Place résiduelle en insuffisance rénale : sitagliptine à dose réduite (50 mg si DFG 30‑44 ; 25 mg si
      < 30, dialyse incluse). Sulfamide gliclazide/glimépiride à dose réduite mais CONTRE‑INDIQUÉ < 30 ;
      jamais de glibenclamide.
  - quand: "traitements_en_cours contient insuline AND traitements_en_cours contient sulfamide OR traitements_en_cours contient insuline AND traitements_en_cours contient glinide"
    niveau: attention
    message: >-
      Association insuline + sulfamide / glinide : risque d'hypoglycémie cumulée. Envisager d'arrêter le
      sulfamide / le glinide, surtout à l'introduction ou à l'intensification de l'insuline.
  - quand: "preference_injection == refuse AND ASCVD_etablie == true OR preference_injection == refuse AND IMC >= 30"
    niveau: attention
    message: >-
      Refus des injections : privilégier une alternative ORALE (sémaglutide oral, iSGLT2, iDPP4) — les options
      injectables (AR GLP‑1 injectable, tirzépatide, association) sont reléguées en dernier. Si aucune
      alternative non injectable adaptée n'existe alors qu'un bénéfice cardio‑rénal prouvé est requis, un
      injectable reste à discuter avec le patient (le refus ne doit pas priver d'un traitement à bénéfice démontré).
  - quand: "traitements_en_cours contient sulfamide AND insuffisance_cardiaque == false AND ASCVD_etablie == false AND DFG >= 60 AND albuminurie == normo AND IMC < 22 OR traitements_en_cours contient sulfamide AND insuffisance_cardiaque == false AND ASCVD_etablie == false AND DFG >= 60 AND albuminurie == normo AND denutrition == true"
    niveau: attention
    message: >-
      Sulfamide chez un patient SANS indication d'iSGLT2 (pas d'IC, DFG ≥ 60, normoalbuminurie, pas d'ASCVD)
      et où l'AR GLP‑1 est contre‑indiqué par le terrain (IMC < 22 ou dénutrition) : aucun remplaçant
      protecteur pertinent. Préférer SURVEILLER ou DÉPRESCRIRE le sulfamide plutôt qu'un switch à vide (repli
      de l'option « remplacer le sulfamide »).
  - quand: "intention == optimiser AND HbA1c_actuelle >= 9 OR intention == deprescrire AND HbA1c_actuelle >= 9"
    niveau: attention
    message: >-
      Cohérence : HbA1c élevée (≥ 9 %) alors que l'intention saisie est « optimiser » / « déprescrire »
      (qui supposent l'objectif atteint ou dépassé). Vérifier l'objectif du patient — une INTENSIFICATION
      est probablement indiquée (rebasculer l'intention sur « intensifier »).
  - quand: "intention == intensifier AND hba1c_sous_cible == true"
    niveau: attention
    message: >-
      Cohérence : HbA1c < 6,5 % alors que l'intention saisie est « intensifier ». L'objectif est déjà dépassé
      sous agent hypoglycémiant — envisager plutôt une DÉPRESCRIPTION (rebasculer l'intention sur « déprescrire »).
  - quand: "traitements_en_cours contient insuline AND risque_hypoglycemie_schema == eleve"
    niveau: attention
    message: >-
      Patient sous insuline à haut risque hypoglycémique : ÉVITER d'ajouter un sécrétagogue (sulfamide /
      glinide). Privilégier un agent sans hypoglycémie (iSGLT2 / AR GLP‑1) ou l'ajustement de l'insuline
      (nœud E).
argumentaire: >
  Ce nœud unique outille toute la prescription non‑insulinique du DT2, à partir de L'INTENTION du praticien
  (initier / intensifier / optimiser / déprescrire) qui organise la saisie et déduit la position vs objectif,
  sans jamais masquer un geste transverse indiqué. La hiérarchie de valeur est constante : iSGLT2 et AR GLP‑1
  ont un bénéfice d'organe démontré (CVOT vs placebo, critères durs) EN PRÉSENCE de la comorbidité
  correspondante (IC/rein pour l'iSGLT2, athérome pour l'AR GLP‑1) ; sulfamides et gliptines n'ont aucun
  bénéfice d'organe (essais de sécurité CV neutres). Quand l'objectif n'est pas atteint, iSGLT2 et AR GLP‑1
  sont aussi des LEVIERS GLYCÉMIQUES à part entière (sans hypoglycémie, perte de poids), disponibles même sans
  comorbidité — la comorbidité les PRIORISE, elle ne conditionne pas leur disponibilité (ordre préférentiel
  HAS R.74 : iSGLT2/AR GLP‑1 > iDPP4 > sulfamide) ; insuline, sulfamide et gliptine restent des agents
  possibles « avec leurs limites » (bas rang), l'insuline en repli quand la palette non‑insulinique est
  épuisée. Fix de préférence : en athérome pur, l'AR GLP‑1 passe DEVANT l'iSGLT2 (sans effet démontré sur
  l'IDM/l'AVC). On SWITCHE un agent de faible valeur ou mal toléré, jamais en associant gliptine + AR GLP‑1
  (même voie incrétine). On DÉPRESCRIT (fort sur les hypoglycémiants ; réduction ou arrêt) : un HbA1c < 6,5 %
  sous agent hypoglycémiant est une iatrogénie à corriger à tout âge, sans jamais retirer un agent protecteur.
  Un gating négatif de terrain empêche les erreurs du sujet fragile : AR GLP‑1 et tirzépatide exclus chez le
  maigre (IMC < 22) ou le dénutri (même obèse), tirzépatide réservé à l'obésité, iSGLT2 déconseillé en cas
  d'infections génito‑urinaires récidivantes. En état catabolique, une insuline d'initiation (transitoire)
  s'impose ; son ajustement fin relève du nœud E. NB EBM : lorsqu'iSGLT2/AR GLP‑1 sont proposés au SEUL titre
  glycémique (sans comorbidité), leur bénéfice attendu est glycémique (absence d'hypoglycémie, poids), PAS le
  bénéfice d'organe des populations enrichies des CVOT ; Prescrire réserve d'ailleurs la dapagliflozine à
  l'IC / l'insuffisance rénale (divergence de degré, cf. divergence).
