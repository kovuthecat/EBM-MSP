  changelog:
    - date: "2026-07-30"
      auteur: "Claude Code (P9/S3, T-070) — en attente de relecture référent"
      resume: >-
        CONTRE-INDICATIONS VÉRIFIABLES (mécanisme T-068/P9·S1) : sur 18 contre-indications déclarées
        (14 champs `contre_indications`, un ou plusieurs items chacun), 4 converties de la forme chaîne
        vers `{ texte, condition }` — texte inchangé mot pour mot, seule la structure change. Critère de
        conversion volontairement étroit (S3.md « Décision clé ») : converti seulement si l'item décrit
        UN SEUL fait, vérifiable contre un critère déjà déclaré dans ce nœud, sans mélanger un fragment
        vérifiable à un fragment qui ne l'est pas dans la même chaîne. Conversions : (1) « Suspendre
        l'iSGLT2 » et (2) « Insuline d'initiation » — « Cétonémie ≥ 3 mmol/L → urgence… » →
        `cetonemie == true` (même fait que l'exclusion/condition de ces options ailleurs dans ce fichier).
        (3) « Introduire un iSGLT2 » — « Ne pas initier si DFG < 20… » → `DFG < 20` (seuil identique à
        l'exclusion de cette même option ; l'aside « poursuivre si déjà en cours » ne concerne pas cette
        option réservée au patient naïf d'iSGLT2). (4) « Introduire un AR GLP‑1 » — « IMC bas / dénutrition
        : contre-indication de terrain… » → `IMC < 22 OR denutrition == true` (seuils identiques à
        l'exclusion de cette même option). 14 items LAISSÉS EN TEXTE LIBRE, pour deux raisons distinctes :
        (a) aucun critère de ce nœud ne porte le fait cité (alcoolisme, insuffisance hépatique, antécédent
        de pancréatite, cancer médullaire de la thyroïde/NEM2, gangrène de Fournier, artériopathie,
        rétinopathie, molécule saxagliptine nommément) ; (b) l'item mélange dans UNE MÊME chaîne un
        fragment vérifiable et un fragment qui ne l'est pas, ou n'énonce pas un fait conditionnel mais une
        clarification de portée toujours vraie — convertir n'aurait couvert qu'une partie du texte affiché
        et aurait fait paraître « désamorcé » (barré, non applicable) un texte qui reste, pour sa partie
        non couverte, un vrai risque potentiel chez ce patient. Cas le plus net : l'item de la carte
        « Metformine (poursuivre/instaurer) » (« CONTRE-INDIQUÉE si DFG < 30 […] ; à écarter en
        insuffisance cardiaque décompensée, IDM récent, insuffisance hépatique, alcoolisme. À suspendre :
        déshydratation, sepsis, jeûne, produit de contraste iodé, chirurgie. ») cite littéralement le seuil
        DFG < 30 donné en exemple par S3.md, mais dans la MÊME chaîne que cinq autres contre-indications
        non vérifiables : y attacher `condition: "DFG < 30"` aurait fait afficher « ne s'applique pas à ce
        patient » sur l'intégralité du texte — y compris IDM récent ou alcoolisme — dès DFG ≥ 30, alors que
        ces faits-là restent à vérifier indépendamment. Laissé en texte libre intégralement, signalé comme
        cas « Si bloqué » (voir bilan de session, `plans/P9/S3.md`). Inventaire complet (18 items, a/b/c)
        dans le bilan de session. Aucun changement de logique clinique, aucune contre-indication ajoutée,
        retirée ou reformulée sur le fond — uniquement la structure de celles converties.
    - date: "2026-07-30"
      auteur: "Claude Code (P9/S2, T-069) — en attente de relecture référent"
      resume: >-
        PURGE DU JARGON DE PROJET AFFICHÉ AU CLINICIEN (rédactionnel seul, aucun changement de logique ni de
        condition). Cinq occurrences rendues de « nœud E » listées par le plan P9/S2 (intitulé de l'option
        « Envisager l'insuline », `inconvenients` × 3, `argumentaire`) remplacées par la substance clinique
        (le schéma insulinique est titré et suivi dans la durée), sans renvoyer à un autre écran par un nom
        de code. DEUX occurrences supplémentaires du même motif, trouvées hors de la liste du plan lors de
        la relecture (`population_cible` l.40, alerte de nœud « risque hypoglycémique sous insuline » l.1718),
