      - texte: "IMC bas / dénutrition : contre‑indication de terrain (perte de poids délétère)."
        condition: "IMC < 22 OR denutrition == true"
    # R2 — branche « on va en introduire un » de l'ancienne alerte fragilité de nœud. PORTÉE PAR L'OPTION :
    # elle ne s'affiche donc que si cette option est réellement applicable, et disparaît d'elle-même quand
    # le terrain l'écarte (IMC < 22, dénutrition). Plus besoin de recopier `ASCVD OR IMC >= 30` pour
    # deviner « envisagé » : l'applicabilité de l'option EST le fait recherché.
    #
    # SECONDE ALERTE, AJOUTÉE le 2026-07-29 (décision référent — prudence rénale). Elle qualifie le geste,
    # elle ne le retire pas : R8, un fait qui rend un geste contre-indiqué est une `exclusions`, un fait
    # qui le QUALIFIE est une alerte — ici la classe n'a aucune contre-indication rénale (RCP vérifiés par
    # le référent), seulement un manque de données à ce niveau de fonction rénale. Les `conditions` de
    # l'option sont INCHANGÉES (cf. le commentaire du seuil 30 ci-dessus) : l'option continue de s'afficher
    # normalement sous 15, avec cette réserve à côté. Garde `DFG > 0` obligatoire (défaut d'un nombre non
    # saisi = 0 : sans lui, l'alerte s'afficherait pour tout patient dont le DFG n'est pas renseigné).
    alertes:
      - quand: "fragilite == true"
        niveau: attention
        message: >-
          Chez un sujet fragile, surveiller le poids et l'état nutritionnel à l'instauration d'un
          incrétine (risque de sarcopénie / anorexie).
      - quand: "DFG > 0 AND DFG < 15"
        niveau: attention
        message: >-
          Fonction rénale très altérée (DFG < 15 mL/min/1,73 m²) : les AR GLP‑1 commercialisés en France
          restent utilisables à ce stade — leur résumé des caractéristiques du produit ne pose aucune
          limite rénale —, mais ils y ont été PEU ÉTUDIÉS. Le recul manque, pas l'autorisation : proposer
          la classe reste licite, en surveillant de près la tolérance (digestive, poids, état
          nutritionnel) et en réévaluant tôt.
  - intitule: "Introduire le tirzépatide (obésité — prescription spécialisée)"
    role: geste
    action: ajouter
    conditions:
      - "IMC >= 30"
    # R6 : garde-fous de cohérence (ne pas déjà prendre la classe visée / une classe concurrente ;
    # niche non ouverte) — jamais montrés comme justification (cf. option iSGLT2 plus haut).
    prerequis:
      - "traitements_en_cours ne_contient_pas tirzepatide"
      - "traitements_en_cours ne_contient_pas aGLP1"
      - "traitements_en_cours ne_contient_pas gliptine"
      - "isglt2_indisponible == false OR aglp1_indisponible == false"
    exclusions:
      - "denutrition == true"
    priorite:
      - quand: "preference_injection == refuse"
        rang: 7
      - quand: "default"
        rang: 4
    famille: "Agent à ajouter"
    avantages:
      - "Efficacité HbA1c et perte de poids supérieures aux AR GLP‑1 ; réservé à l'OBÉSITÉ associée au diabète (IMC ≥ 30), prescription par spécialiste."
    inconvenients:
      - "Bénéfice CV par NON‑INFÉRIORITÉ au dulaglutide seulement (SURPASS‑CVOT, pas de supériorité, pas de CVOT vs placebo). Mêmes effets digestifs/pancréatiques ; injectable hebdomadaire."
      - "GARDE‑FOU TERRAIN : exclu si dénutrition (même chez l'obèse sarcopénique) ; non indiqué hors obésité."
    effet_attendu: >-
      Non‑infériorité au dulaglutide sur le MACE‑3 (HR 0,92 [0,83‑1,01]) ; composite rénal 0,77 [0,68‑0,88].
    niveau_preuve: modere
    references:
      - surpass-cvot
    contre_indications:
      - "Antécédent de pancréatite ; cancer médullaire de la thyroïde / NEM2 ; refus des injections ; dénutrition."
    # R2 — même alerte que sur l'option AR GLP‑1 : l'ancienne alerte de nœud couvrait les DEUX incrétines
    # (« AR GLP‑1 / tirzépatide »), son périmètre est conservé à l'identique.
    alertes:
      - quand: "fragilite == true"
        niveau: attention
        message: >-
          Chez un sujet fragile, surveiller le poids et l'état nutritionnel à l'instauration d'un
          incrétine (risque de sarcopénie / anorexie).
  - intitule: "Association iSGLT2 + AR GLP‑1 (deux indications distinctes)"
    role: geste
    action: ajouter
    conditions:
      - "insuffisance_cardiaque == true OR DFG < 60 OR albuminurie != normo"
      - "ASCVD_etablie == true OR IMC >= 30"
    # R6 : garde-fous de cohérence (ne pas déjà prendre l'une des classes concurrentes/visées ; niche
    # non ouverte) — jamais montrés comme justification (cf. option iSGLT2 plus haut).
    prerequis:
      - "traitements_en_cours ne_contient_pas gliptine"
      - "traitements_en_cours ne_contient_pas iSGLT2"
      - "traitements_en_cours ne_contient_pas aGLP1"
      - "traitements_en_cours ne_contient_pas tirzepatide"
      - "isglt2_indisponible == false OR aglp1_indisponible == false"
    exclusions:
      - "DFG < 20"
      - "symptomes_glucotoxicite == true"
      - "cetonemie == true"
      - "IMC < 22"
      - "denutrition == true"
    priorite:
      - quand: "preference_injection == refuse"
        rang: 7
      - quand: "default"
        rang: 4
    famille: "Agent à ajouter"
    avantages:
      - "Couvre le versant IC/rénal (iSGLT2) ET athéromateux/pondéral (AR GLP‑1) quand les deux indications sont fortes."
    inconvenients:
      - "Bénéfice additif sur critère DUR de preuve FAIBLE (observationnel + sous‑groupes ; PRECIDENTD en cours) : justifié par la coexistence de deux indications, pas par une synergie prouvée. Coût et charge de traitement cumulés (risque d'abandon)."
    effet_attendu: >-
      Additivité glycémique/pondérale acquise (DURATION‑8) ; bénéfice dur additif non confirmé par un ECR dédié.
    niveau_preuve: faible
  - intitule: "Envisager l'insuline (palette non‑insulinique épuisée — schéma à titrer et suivre dans la durée)"
    role: geste
    action: ajouter
    # CONDITION GÉNÉRALISÉE le 2026-07-27 (objection du référent, cf. `isglt2_indisponible` en tête de
    # fichier). Elle s'écrivait :
    #   iSGLT2 en cours AND aGLP1 en cours  OR  iSGLT2 en cours AND dénutrition  OR  iSGLT2 en cours AND IMC<22
    # soit, en facteur : « iSGLT2 EN COURS » AND « AR GLP‑1 indisponible ». Le premier facteur ne couvrait
    # que l'épuisement par OCCUPATION ; un iSGLT2 CONTRE-INDIQUÉ (DFG < 20, infections génito-urinaires
    # récidivantes) laissait la condition fausse. Réécrite avec le facteur généralisé, elle est un SURENSEMBLE
    # STRICT de l'ancienne : les trois cas d'origine restent tous vrais.
    conditions:
      - "cible_atteinte == false"
      - "isglt2_indisponible == true AND aglp1_indisponible == true"
    # PRÉREQUIS AJOUTÉ (2026-07-26, chantier prescription/prérequis, recette capture 4 : patient déjà
    # sous insuline ET sulfamide → « Envisager l'insuline » proposée quand même, faute de vérifier
    # l'absence). Les 6 autres options d'ajout de la famille « Agent à ajouter » se gardent déjà via un
    # `prerequis` `ne_contient_pas <classe>` (iSGLT2, AR GLP‑1, tirzépatide, association, gliptine,
    # sulfamide) — celle-ci ne l'avait pas. Si l'insuline en place est mal réglée, l'ajustement relève du
    # nœud E (hors périmètre, cf. `population_cible`), pas d'un « envisager » qui suppose l'absence.
    prerequis:
      - "traitements_en_cours ne_contient_pas insuline_basale AND traitements_en_cours ne_contient_pas insuline_rapide"
    priorite: 6
    famille: "Agent à ajouter"
    avantages:
      - "Quand les options non insuliniques sont épuisées ou contre‑indiquées, l'insuline est le levier glycémique le plus puissant et souvent nécessaire. Cas types : metformine + iSGLT2 + AR GLP‑1 toujours déséquilibré ; incrétines exclues par le terrain (dénutrition / IMC bas) chez un patient déjà sous iSGLT2 non contrôlé. (En insuffisance rénale sévère, un AR GLP‑1 ou la sitagliptine à dose adaptée restent souvent utilisables : la palette n'est pas forcément épuisée.)"
    inconvenients:
      - "Contrainte (injections, auto‑surveillance), hypoglycémie, prise de poids ; aucun bénéfice CV (ORIGIN). Débuter par une basale ± AR GLP‑1 si possible. LE SCHÉMA (titration, doses) devra ensuite être ajusté et suivi dans la durée."
    effet_attendu: >-
      Baisse d'HbA1c dose‑dépendante ; aucun bénéfice sur critère dur. Distinct du gate catabolique (qui ne
      dépend pas de l'atteinte de l'objectif).
    niveau_preuve: faible
    contre_indications:
      - "Arrêter le sulfamide / le glinide à l'introduction de l'insuline (hypoglycémie cumulée). Suspecter un DT1 devant une cétose / un amaigrissement rapide chez un sujet non obèse."
  # ---- Switch (portes SU/gliptine, branche à/au‑dessus de la cible) -------------------------------------
  # R3 (docs/decision/GRAMMAIRE-NOEUD.md) : le verdict sur la gliptine (agent sans bénéfice dur) se
  # déclenche désormais sur la SEULE présence de la ligne — la comorbidité (ASCVD/IMC/cible non atteinte)
  # a migré vers le CHOIX du remplaçant (indications/priorités des options iSGLT2/AR GLP‑1 ci‑dessus), elle
  # n'autorise plus le geste. LEVÉE DU VERROU (référent, 2026-07-25) : l'option, atomique jusqu'ici (verdict
  # + destination confondus, verrouillée sur l'AR GLP‑1 seul), est généralisée sur le modèle déjà correct de
  # l'option sulfamide — le remplaçant est iSGLT2 OU AR GLP‑1 selon la comorbidité, choisi par les options
  # d'ajout elles-mêmes. C'est ce défaut exact (remplaçant unique, exclu par le terrain IMC < 22) qui faisait
  # disparaître le verdict sur la gliptine avec lui — le défaut d'origine de toute la série R1→R4.
  # Exclusions restreintes aux seules structurelles (gate catabolique) : celles du remplaçant (IMC < 22,
  # dénutrition, propres à l'AR GLP‑1) ne portent plus sur CE verdict, cf. R3 (« les exclusions du verdict
  # sont structurelles, jamais celles d'une destination »).
  - intitule: "Remplacer la gliptine (aucun bénéfice sur critère dur — préférer un agent qui en apporte)"
    role: geste
    action: remplacer
    conditions:
      - "intention != initier AND traitements_en_cours contient gliptine"
    # R6 : garde-fous de cohérence (ne pas déjà prendre le remplaçant visé) — jamais montrés comme
    # justification (cf. option iSGLT2 plus haut).
    prerequis:
      - "traitements_en_cours ne_contient_pas aGLP1"
      - "traitements_en_cours ne_contient_pas tirzepatide"
    exclusions:
      - "symptomes_glucotoxicite == true"
      - "cetonemie == true"
    priorite: 3
    famille: "Traitement à corriger ou remplacer"
    avantages:
      - "La gliptine n'apporte aucun bénéfice sur critère dur (4 CVOT neutres : TECOS, SAVOR, EXAMINE, CARMELINA) et son efficacité glycémique est modeste (~0,5-0,8 % d'HbA1c). Lui substituer un agent à bénéfice d'organe apporte une protection que la classe n'a pas, à contrôle glycémique au moins équivalent."
      - "Choisir le remplaçant selon la comorbidité, comme pour le sulfamide : iSGLT2 si l'insuffisance cardiaque ou l'atteinte rénale prédomine ; AR GLP‑1 si la maladie athéromateuse ou l'obésité prédomine. Sans terrain particulier, l'un ou l'autre selon la tolérance et la préférence du patient."
    inconvenients:
      - "RÈGLE DURE : ne jamais ASSOCIER gliptine + AR GLP‑1 (même voie incrétine, aucun bénéfice additif — Nauck 2017 ; ADA §9 ; KDIGO PP4.2.3 ; HAS R.80) → l'introduction d'un AR GLP‑1 implique l'ARRÊT de la gliptine."
      - "Aucun ECR de switch dédié ne montre que RETIRER la gliptine réduit un critère dur : le bénéfice d'organe est celui du remplaçant (argument indirect, même structure que pour le sulfamide). Le switch n'est documenté que sur critères de substitution (vers AR GLP‑1 : Pratley 2012 ; méta Tran/Kramer −0,69 % d'HbA1c, −2,25 kg)."
      - "REPLI : si aucun remplaçant protecteur n'est applicable sur ce terrain, NE PAS switcher à vide → poursuivre la gliptine, bien tolérée et sans hypoglycémie, et réévaluer."
    effet_attendu: >-
      Bénéfice d'organe = celui du remplaçant retenu (iSGLT2 : hospitalisation pour IC HR ~0,61‑0,73,
      progression rénale HR ~0,56‑0,76 ; AR GLP‑1 : événements athéromateux, surtout l'AVC). Gain propre
      au retrait de la gliptine : aucun sur critère dur.
    niveau_preuve: modere
    references:
      - tecos
      - pioneer-3
      - tran-kramer
    contre_indications:
      - "Ne pas maintenir la gliptine en association avec un AR GLP‑1 : la remplacer. Les contre-indications propres au remplaçant retenu s'appliquent (voir l'option correspondante)."
  - intitule: "Arrêter la gliptine redondante (association gliptine + AR GLP‑1 / tirzépatide déjà en place)"
    role: geste
    action: arreter
    conditions:
      - "intention != initier AND traitements_en_cours contient gliptine"
      - "intention != initier AND traitements_en_cours contient aGLP1 OR intention != initier AND traitements_en_cours contient tirzepatide"
    priorite: 3
    famille: "Traitement à corriger ou remplacer"
    avantages:
      - "Corrige une association INTERDITE déjà en place : gliptine + AR GLP‑1/tirzépatide = redondance incrétine sans bénéfice additif → arrêter la gliptine (ADA §9 ; KDIGO PP4.2.3 « stopping the gliptin » ; HAS R.80)."
    inconvenients:
      - "À repérer surtout chez un patient adressé déjà sous les deux ; réévaluer l'HbA1c après l'arrêt (pas de perte d'efficacité attendue)."
    effet_attendu: >-
      Simplification sans perte d'efficacité (Nauck 2017 : +78 % GLP‑1 intact sans effet glycémique additionnel).
    niveau_preuve: modere
    references:
      - nauck
  # R3 (docs/decision/GRAMMAIRE-NOEUD.md) : le verdict sur le sulfamide (agent sans bénéfice dur) se
  # déclenche désormais sur la SEULE présence de la ligne — la comorbidité (IC/rein/ASCVD/IMC/hypo
  # schéma/cible non atteinte) a migré vers le CHOIX du remplaçant (indications/priorités des options
  # iSGLT2/AR GLP‑1 ci‑dessus), elle n'autorise plus le geste. `hypoglycemie_recente`/`hba1c_sous_cible`
  # restent des gardes-fous DISTINCTS : dans ces deux cas, on déprescrit, on ne switche pas (cf. l'option
  # de désintensification).
  - intitule: "Remplacer le sulfamide (moins d'hypoglycémie, moins de poids, plus de bénéfice)"
    role: geste
    action: remplacer
    conditions:
      - "intention != initier AND traitements_en_cours contient sulfamide"
      - "hypoglycemie_recente == false"
      - "hba1c_sous_cible == false"
    exclusions:
      - "DFG < 30"
    priorite: 4
    famille: "Traitement à corriger ou remplacer"
    avantages:
      - "Le sulfamide n'a aucun bénéfice cardio‑rénal propre (CAROLINA, TOSCA.IT neutres) et cause hypoglycémie + poids + moindre durabilité. Le remplaçant réduit fortement l'hypo sévère (CAROLINA NNT 45) et fait perdre du poids."
    inconvenients:
      - "Aucun ECR de switch dédié ne montre que RETIRER le SU réduit un critère dur (bénéfice d'organe = le remplaçant, argument indirect). Choisir le remplaçant selon la comorbidité (iSGLT2 si IC/rein ; AR GLP‑1 si athérome/obésité)."
      - "REPLI : si aucun remplaçant protecteur n'est applicable sur ce terrain (AR GLP‑1 exclu par IMC<22/dénutrition ET iSGLT2 non indiqué), NE PAS switcher à vide → surveiller ou déprescrire le sulfamide."
    effet_attendu: >-
      Hypo sévère 0,45 → 0,07 / 100 p‑a (CAROLINA, NNT 45) ; poids ~−1,5 à −4 kg ; bénéfice d'organe = iSGLT2 /
      AR GLP‑1 choisi.
    niveau_preuve: modere
    references:
      - carolina
      - grade
      - tosca-it
      - simpson
    contre_indications:
      - "En sur‑contrôle (hba1c_sous_cible) ou après hypoglycémie/chute récente : il s'agit de DÉSINTENSIFIER (retirer sans remplacer) — cette option ne se déclenche pas. Si un SU doit être conservé : gliclazide/glimépiride, jamais le glibenclamide."
  # ---- Remplacer le glinide (T-063, référent 2026-07-30) -------------------------------------------------
  # A1 (arbitrage référent 2026-07-30) : carte DÉDIÉE, symétrique de « Remplacer la gliptine » et
  # « Remplacer le sulfamide » ci-dessus — sans elle, l'écran ouvrait le remplaçant sans jamais nommer
  # l'agent à retirer (ambiguïté ajouter/remplacer relevée 4 fois en recette). Même famille, même `action`,
  # MÊME STRUCTURE DE CONDITIONS que « Remplacer le sulfamide » (hypoglycémie récente / sur-contrôle
  # renvoient à la désintensification, pas au switch — cf. son propre commentaire ci-dessus). PAS
  # d'exclusion `DFG < 30` : contrairement au sulfamide, le répaglinide ne porte AUCUNE contre-indication
  # rénale au RCP (cf. le commentaire de scission sulfamide/glinide, plus bas, et l'option « Réduire la
  # posologie du glinide ») — la niche rénale reste intacte, l'arbitrage A2 dit COMMENT l'articuler (voir
  # `exclusions` ci-dessous), pas qu'on la retire.
  # A2 (arbitrage référent 2026-07-30) : remplacement CONDITIONNÉ à la disponibilité effective d'un
  # remplaçant. Réutilise les dérivés déjà calculés par le nœud (`isglt2_indisponible`, `aglp1_indisponible`
  # — cf. l'option « Gliptine (sitagliptine) » plus bas qui les utilise déjà) plutôt que de ré-écrire des
  # seuils rénaux en dur : si les DEUX classes protectrices sont indisponibles sur ce terrain, cette carte
  # n'est pas la bonne réponse — la niche du répaglinide (seul insulinosécréteur utilisable sous DFG 30)
  # prend le relais via « Réduire la posologie du glinide ». `exclusions` (et non `conditions`) DÉLIBÉRÉMENT
  # : R4 (docs/decision/GRAMMAIRE-NOEUD.md) affiche toujours une option écartée par exclusion, avec son
  # motif — c'est l'information de sécurité que le praticien doit voir, pas un silence.
  #
  # Preuve du bénéfice absent (T-063, collecte dédiée vérifiée en primaire 2026-07-30, PMID vérifiés un par
  # un contre PubMed/texte intégral — détail complet dans l'argumentaire, section « Le glinide rejoint les
  # agents sans bénéfice sur critère dur ») : (1) AUCUN ECR dédié au répaglinide sur critère dur n'existe
  # (Grenet 2019, méta-analyse en réseau, 34 essais/175 966 patients : « No trials evaluating glinides […]
  # were found ») ; (2) à l'échelle de la CLASSE (sulfamides + glinides poolés), signal de sur-mortalité
  # toute cause (Mannucci 2020, 48 ECR : MH-OR 1,11 IC95% 1,00-1,23 p=0,04) SANS signal équivalent sur le
  # MACE (MH-OR 1,08 IC95% 0,96-1,22 p=0,20, NS) ; (3) signal REPAGLINIDE-SPÉCIFIQUE, observationnel :
  # Huang & Yeh 2019, cohorte taïwanaise appariée par score de propension (1,68 M patients, répaglinide
  # n=11 468 vs glimépiride référence, suivi médian 8 ans) — mortalité toute cause aHR 1,88 (IC95%
  # 1,45-2,43, p<0,001), événement CV (IDM+AVC) aHR 1,69 (IC95% 1,25-2,59, p=0,001), pire des 5
  # sécrétagogues testés. GRADE TRÈS FAIBLE assumé (`niveau_preuve: tres_faible`, à dessein différent du
  # `modere` du sulfamide/de la gliptine) : observationnel, non causal (les auteurs eux-mêmes ne concluent
  # qu'à la prudence), IMC/HbA1c/lipides NON ajustés, sévérité rénale probablement NON ajustée (codes
  # diagnostiques, pas DFG continu), population de primo-prescription différente du contexte de cette carte
  # (patients déjà avancés dans leur parcours). Le signal RENFORCE la justification clinique du remplacement
  # quand une alternative existe ; il ne remplace pas la neutralité de classe comme motif — les deux sont
  # dits, distinctement, ci-dessous.
  - intitule: "Remplacer le glinide (aucun bénéfice sur critère dur — préférer un agent qui en apporte)"
    role: geste
    action: remplacer
    conditions:
      - "intention != initier AND traitements_en_cours contient glinide"
      - "hypoglycemie_recente == false"
      - "hba1c_sous_cible == false"
    exclusions:
      - "isglt2_indisponible == true AND aglp1_indisponible == true"
    priorite: 4
    famille: "Traitement à corriger ou remplacer"
    avantages:
      - "Aucun essai contrôlé randomisé dédié au répaglinide sur critère dur n'existe (Grenet 2019, méta-analyse en réseau de 34 essais/175 966 patients cherchant spécifiquement des essais avec mortalité/MACE : « No trials evaluating glinides […] were found »). À l'échelle de la CLASSE (sulfamides et glinides poolés), un signal de sur-mortalité toute cause existe (Mannucci 2020, 48 ECR ≥ 52 semaines : MH-OR 1,11, IC95% 1,00-1,23, p=0,04) sans signal équivalent sur le MACE (MH-OR 1,08, IC95% 0,96-1,22, p=0,20, non significatif) — c'est un signal de mortalité, pas de MACE, et il n'isole pas le répaglinide des sulfamides."
      - "Signal REPAGLINIDE-SPÉCIFIQUE (Huang & Yeh 2019) : cohorte nationale taïwanaise de 1,68 million de patients diabétiques incidents, répaglinide (n=11 468) apparié par score de propension au glimépiride (référence), suivi médian 8 ans — mortalité toute cause aHR 1,88 (IC95% 1,45-2,43, p<0,001) et événement cardiovasculaire combiné (IDM+AVC ischémique) aHR 1,69 (IC95% 1,25-2,59, p=0,001). Le répaglinide affiche les deux HR les plus élevés des 5 sécrétagogues comparés (pire que les 4 sulfamides testés, glibenclamide inclus), résultat retrouvé en analyse de sensibilité sans appariement (cohorte complète, Cox multivarié)."
      - "Choisir le remplaçant selon la comorbidité, comme pour le sulfamide et la gliptine : iSGLT2 si l'insuffisance cardiaque ou l'atteinte rénale prédomine ; AR GLP‑1 si la maladie athéromateuse ou l'obésité prédomine."
    inconvenients:
      - "PREUVE DE GRADE TRÈS FAIBLE, à ne jamais présenter comme un fait établi : Huang & Yeh 2019 est OBSERVATIONNEL, jamais causal — les auteurs eux-mêmes concluent seulement qu'« il serait prudent d'envisager le glimépiride quand un sécrétagogue est nécessaire », pas à une preuve de surrisque du répaglinide. Le score de propension n'ajuste NI sur l'IMC, NI sur l'HbA1c, NI sur le bilan lipidique (limite reconnue par les auteurs — confusion possible par la sévérité glycémique de base). Les comorbidités ajustées renvoient probablement à des CODES DIAGNOSTIQUES (présence d'IRC), pas à un DFG continu : la SÉVÉRITÉ de l'insuffisance rénale n'est donc probablement pas contrôlée, alors que c'est précisément ce qui pousse à prescrire du répaglinide. Enfin la cohorte est une population de PRIMO-PRESCRIPTION en monothérapie, pas des patients déjà multi-traités chez qui le DFG a déjà écarté metformine/sulfamide/gliptine — pas exactement la population visée par cette carte."
      - "Aucun ECR de switch dédié ne montre que RETIRER le glinide réduit un critère dur (même structure argumentative que pour le sulfamide et la gliptine : le bénéfice d'organe est celui du remplaçant, argument indirect)."
      - "REMPLACEMENT CONDITIONNÉ à la disponibilité effective d'un remplaçant protecteur (iSGLT2 si DFG ≥ 20 sans infection uro-génitale récidivante ; AR GLP‑1 sans dénutrition ni IMC < 22) : si aucun des deux n'est utilisable sur ce terrain, cette carte est écartée — la niche rénale du répaglinide (seul insulinosécréteur utilisable sous DFG 30, cf. l'option « Réduire la posologie du glinide ») reste alors la meilleure conduite : réduire la dose plutôt que remplacer à vide."
      - "REPLI (intolérance légère isolée, sans indication de remplacement protecteur) : préférer réduire la posologie du glinide (option dédiée) plutôt que switcher — les deux gestes peuvent être proposés ensemble chez un patient intolérant ; ce n'est pas une contradiction (cf. l'option « Optimiser l'agent mal toléré », qui pose explicitement les deux voies)."
      - "Contrainte propre au glinide, à mettre en balance : trois prises prandiales (observance) contre un profil d'hypoglycémie relativement plus favorable que les sulfamides comparés (Leonard 2018, cohorte Medicaid : répaglinide aHR 2,03, IC95% 1,64-2,52, vs metformine — moins à risque que glyburide, glimépiride et glipizide, les trois sulfamides comparés dans cette étude)."
    effet_attendu: >-
      Bénéfice d'organe = celui du remplaçant retenu (iSGLT2 : hospitalisation pour IC HR ~0,61‑0,73,
      progression rénale HR ~0,56‑0,76 ; AR GLP‑1 : événements athéromateux, surtout l'AVC). Gain propre au
      retrait du glinide : aucun sur critère dur démontré par ECR ; un signal observationnel de surmortalité
      et de sur-risque CV existe (Huang & Yeh 2019), de grade très faible.
    niveau_preuve: tres_faible
    references:
      - grenet-2019
      - mannucci-2020
      - huang-yeh-2019
      - leonard-2018
    contre_indications:
      - "En sur‑contrôle (hba1c_sous_cible) ou après hypoglycémie/chute récente : il s'agit de DÉSINTENSIFIER (retirer sans remplacer) — cette option ne se déclenche pas. Les contre-indications propres au remplaçant retenu s'appliquent par ailleurs (voir l'option correspondante)."
  # ---- Intolérance (porte : réduction OU switch) -------------------------------------------------------
  - intitule: "Optimiser l'agent mal toléré : réduire la posologie (intolérance non majeure) ou remplacer"
    role: geste
    conditions:
      - "intention != initier AND intolerance_traitement == true"
    # GARDE-FOU AJOUTÉ le 2026-07-29 (décision référent) : cette carte parlait d'optimiser « l'agent mal
    # toléré » chez un patient dont AUCUN traitement n'est déclaré en cours — l'intolérance seule la
    # déclenchait. Un agent qui n'existe pas ne se réduit ni ne se remplace.
    #
    # DANS `prerequis` ET NON DANS `conditions` (R6, arbitrage indication/prérequis) : « le patient a un
    # traitement en cours » est un garde-fou de COHÉRENCE, pas une indication clinique — affiché en
    # justification (« Proposé parce que : le patient prend un traitement »), il n'apprendrait rien. Même
    # emplacement, même nature que les `ne_contient_pas <classe>` des options d'ajout de ce nœud.
    #
    # NEUF TERMES PLUTÔT QU'UN TEST DE LISTE VIDE : le DSL n'a pas d'opérateur « est vide » — même
    # contrainte, et même choix, que le bloc `contraintes` en tête de fichier, qui énumère les mêmes neuf
    # classes en négatif. L'énumération a l'avantage d'être auditable ligne à ligne.
    #
    # GARDE `intention != initier` RÉPÉTÉ EN TÊTE DE CHAQUE TERME (motif R8, docs/decision/
    # GRAMMAIRE-NOEUD.md ; même geste que P4/S9 · T-031 sur toutes les citations POSITIVES de
    # `traitements_en_cours`, critère masqué par `visible_si: "intention != initier"` et non éligible à
    # `presomption_non` sur ce nœud). Sans lui, le prérequis serait INDÉTERMINÉ pour un patient naïf
    # (champ masqué ⇒ jamais renseigné) au lieu d'être FAUX — un naïf ne « contient » rien, c'est la
    # sémantique voulue. Ce que ça ne change PAS pour un patient renseigné : `traitements_en_cours` NON
    # RENSEIGNÉ (intention déclarée, champ visible, case jamais cochée) laisse bien le prérequis
    # indéterminé, donc l'option EN ATTENTE — ni affirmée, ni écartée (D30/R7, comportement vérifié sur le
    # moteur, pas supposé).
    prerequis:
      - "intention != initier AND traitements_en_cours contient metformine OR intention != initier AND traitements_en_cours contient iSGLT2 OR intention != initier AND traitements_en_cours contient aGLP1 OR intention != initier AND traitements_en_cours contient tirzepatide OR intention != initier AND traitements_en_cours contient sulfamide OR intention != initier AND traitements_en_cours contient gliptine OR intention != initier AND traitements_en_cours contient insuline_basale OR intention != initier AND traitements_en_cours contient insuline_rapide OR intention != initier AND traitements_en_cours contient glinide"
    priorite: 2
    famille: "Traitement à alléger"
    avantages:
      - "Une intolérance justifie d'agir. Deux voies : (1) RÉDUIRE la posologie de la molécule en cause si l'intolérance est NON MAJEURE (sévérité et dose = jugement du praticien ; aucun dosage imposé) ; (2) REMPLACER par une classe mieux tolérée (voir les options de switch selon les comorbidités, en excluant la classe en cause)."
    inconvenients:
      - "Documenter la nature de l'intolérance avant de conclure à un échec de classe. Intolérance DIGESTIVE : la metformine ET l'AR GLP‑1 en sont deux sources — privilégier la réduction/l'arrêt de la metformine (bénéfice moindre), cf. alerte."
    effet_attendu: >-
      Restaure la tolérance sans nécessairement abandonner un agent à bénéfice d'organe. Effet non chiffrable
      (dépend de l'agent et du geste retenu).
    niveau_preuve: faible
  # ---- Désintensification (porte : hba1c_sous_cible à tout âge, ou hypo récente sur terrain fragile) ----
  - intitule: "Désintensifier : alléger / arrêter le sulfamide, le glinide ou réduire l'insuline"
    role: geste
    # GÉNÉRALISATION position_vs_cible (2026-07-26, 4e série, red-team clinique silences F1,
    # GRAMMAIRE-NOEUD.md R1) : `position_vs_cible == sous_objectif` — l'ÉTAT DÉCLARÉ de sur-traitement,
    # introduit précisément pour capter ce cas sans dépendre du seuil absolu `hba1c_sous_cible` (< 6,5 %,
    # cf. commentaire du critère `cible_atteinte`) — ne pilotait jusqu'ici QUE la déprescription de la
    # metformine (`metformine_deprescriptible`). Un sur-traitement DÉCLARÉ sur l'insuline / le sulfamide /
    # le glinide seuls (sans franchir le seuil absolu) ne déclenchait donc AUCUN allègement — défaut
    # relevé par l'audit sur un profil ASCVD + DFG 46 + sous_objectif + insuline seule, non fragile.
    # Ajouté ici SANS exiger la fragilité : elle ne conditionne que la déprescription de la metformine
    # (dernier agent réputé « sûr » à garder, cf. son propre commentaire), pas l'allègement d'un agent
    # sans bénéfice dur (sulfamide/glinide/insuline).
    conditions:
      # SCISSION I4 (2026-07-27, 6e série) : l'ex-`terrain_fragile` valait
      # `terrain_cible_assouplie OR risque_hypoglycemie_schema == eleve`. La disjonction est reconstruite ici
      # terme à terme — même valeur de vérité, deux motifs désormais lisibles séparément : le terrain
      # gériatrique d'un côté, le schéma hypoglycémiant de l'autre.
      - "hba1c_sous_cible == true OR hypoglycemie_recente == true AND terrain_cible_assouplie == true OR hypoglycemie_recente == true AND risque_hypoglycemie_schema == eleve OR position_vs_cible == sous_objectif"
      - "intention != initier AND traitements_en_cours contient sulfamide OR intention != initier AND traitements_en_cours contient glinide OR intention != initier AND traitements_en_cours contient insuline_basale OR intention != initier AND traitements_en_cours contient insuline_rapide"
    priorite: 1
    famille: "Traitement à alléger"
    avantages:
      - "Réduit les hypoglycémies sévères et les chutes sans dégrader le contrôle (Grant 2025 ; ADA 13.14a‑c ; HAS R.103 ; SFD Avis 5 bis). Un HbA1c < 6,5 % sous agent hypoglycémiant = sur‑traitement iatrogène — déprescrire à TOUT ÂGE."
      - "Déclenchée aussi par une hypoglycémie/chute récente chez le sujet fragile (l'HbA1c seule prédit mal l'hypo — HYPOAGE)."
    inconvenients:
      - "Preuve faible / accord d'experts (aucun ECR de devenirs durs). Surveiller la glycémie après l'allègement, réévaluer l'HbA1c à ~3 mois."
    effet_attendu: >-
      Réduit le risque d'hypoglycémie sévère sans dégradation du contrôle (Grant 2025 : hypo sévère 4,7 % vs
      6,5 % NS). Bénéfice sur critères durs non chiffrable.
    niveau_preuve: faible
    contre_indications:
      - "Ne JAMAIS retirer un iSGLT2 ni un AR GLP‑1 pour désintensifier : bénéfice cardio‑rénal maintenu quelle que soit la glycémie (ADA 13.14d grade A). La désintensification ne cible que sulfamide / glinide / excès d'insuline."
  # ---- Déprescrire par RÉDUCTION de dose (distinct par traitement ; le praticien juge la dose, S8) -------
  - intitule: "Réduire la posologie de l'insuline (sur‑basalisation / hypoglycémie)"
    role: geste
    action: reduire
    # GÉNÉRALISATION position_vs_cible (2026-07-26, 4e série, red-team clinique silences F1) : voir le
    # commentaire de « Désintensifier » plus haut pour la justification complète — même ajout, même
    # raison, sans exigence de fragilité.
    conditions:
      - "intention != initier AND traitements_en_cours contient insuline_basale OR intention != initier AND traitements_en_cours contient insuline_rapide"
      - "hba1c_sous_cible == true OR hypoglycemie_recente == true OR intention != initier AND intolerance_traitement == true OR position_vs_cible == sous_objectif"
    priorite: 1
    famille: "Traitement à alléger"
    avantages:
      - "Réduire plutôt qu'arrêter : diminue le risque d'hypoglycémie (sur‑basalisation, sujet fragile) sans sevrer un patient qui en a besoin. Le praticien juge la dose (aucun dosage imposé). Le réglage fin du schéma se poursuit ensuite au long cours."
    inconvenients:
      - "Surveiller la glycémie après la baisse ; contrôle volontairement un peu moins strict (assumé)."
    effet_attendu: "Moins d'hypoglycémie sans sevrage complet ; effet non chiffrable."
    niveau_preuve: faible
  - intitule: "Réduire la posologie de l'AR GLP‑1 (perte de poids excessive / intolérance digestive)"
    role: geste
    action: reduire
    conditions:
      - "intention != initier AND traitements_en_cours contient aGLP1"
      - "denutrition == true OR intention != initier AND intolerance_traitement == true AND nature_intolerance contient perte_poids OR intention != initier AND intolerance_traitement == true AND nature_intolerance contient digestive"
    priorite: 2
    famille: "Traitement à alléger"
    avantages:
      - "Réduire plutôt qu'arrêter préserve une partie du bénéfice tout en limitant la perte de poids excessive ou les troubles digestifs. Le praticien juge la dose."
    inconvenients:
      - "Si la perte de poids / dénutrition est marquée : envisager l'arrêt. Réévaluer l'état nutritionnel."
    effet_attendu: "non chiffrable"
    niveau_preuve: faible
  - intitule: "Réduire la posologie du tirzépatide (perte de poids excessive / intolérance)"
    role: geste
    action: reduire
    conditions:
      - "intention != initier AND traitements_en_cours contient tirzepatide"
      - "denutrition == true OR intention != initier AND intolerance_traitement == true AND nature_intolerance contient perte_poids OR intention != initier AND intolerance_traitement == true AND nature_intolerance contient digestive"
    priorite: 2
    famille: "Traitement à alléger"
    avantages:
      - "Même logique que l'AR GLP‑1 : réduire avant d'arrêter en cas de perte de poids excessive ou d'intolérance. Le praticien juge la dose."
    inconvenients:
      - "Si dénutrition marquée : arrêt et réévaluation nutritionnelle."
    effet_attendu: "non chiffrable"
    niveau_preuve: faible
  # ---- SCISSION SULFAMIDE / GLINIDE (2026-07-26, 5e série) --------------------------------------------
  # Ces deux gestes étaient portés par UNE SEULE option (« Réduire la posologie du sulfamide / du
  # glinide »), ce qui a fait porter au glinide l'exclusion `DFG < 30` destinée au SEUL sulfamide
  # (garde-fou HAUTE-1 de la 4e série). Question posée par le référent, tranchée sur source primaire —
  # `docs/decision/validation/chantier-2026-07-26/rcp-glinide-insuffisance-renale.md`. Les deux classes
  # ont un comportement rénal OPPOSÉ :
  #   - SULFAMIDE : contre-indication RCP formelle (gliclazide ET glimépiride, rubrique 4.3
  #     « insuffisance rénale ou hépatique sévère » ; mécanisme en 4.4 : « l'hypoglycémie pouvant être
  #     prolongée »). Le seuil chiffré « DFG < 30 » reste une convention KDIGO/SFD — le RCP dit
  #     « sévère » sans valeur, cf. `incertitudes` ;
  #   - RÉPAGLINIDE (seul glinide commercialisé en France depuis le retrait européen du natéglinide, avril
  #     2022) : AUCUNE contre-indication rénale en 4.3. Élimination hépatobiliaire (8 % seulement par voie
  #     rénale) ; en insuffisance rénale sévère (20-39 ml/min) l'exposition double (ASC ×2, rubrique 5.2)
  #     et le RCP en tire une PRUDENCE POSOLOGIQUE — c'est-à-dire exactement le geste que cette option
  #     propose, pas ce qui l'interdit.
  # L'option unique retirait donc au patient sous glinide le geste que son propre RCP recommande. Affiner
  # l'exclusion sur une option unique (`contient sulfamide AND DFG < 30`) aurait rétabli la contradiction
  # HAUTE-1 pour un patient sous les DEUX molécules — la liste `traitements_en_cours` l'autorise. D'où la
  # scission, qui suit d'ailleurs le modèle déjà appliqué au sulfamide (« Arrêter le sulfamide » est une
  # option distincte). Pas d'option « Arrêter le glinide » en miroir : sans contre-indication RCP, aucun
  # fondement à un arrêt motivé par le seul DFG (R3 — un arrêt est un geste, il lui faut une indication).
  - intitule: "Réduire la posologie du sulfamide (tolérance, hypoglycémie légère)"
    role: geste
    action: reduire
    # GÉNÉRALISATION position_vs_cible (2026-07-26, 4e série, red-team clinique silences F1) : voir le
    # commentaire de « Désintensifier » plus haut pour la justification complète — même ajout (l'ÉTAT
    # DÉCLARÉ de sur-traitement `sous_objectif` ouvre aussi cet allègement, sans exiger la fragilité, qui
    # ne conditionne que la déprescription de la metformine).
    conditions:
      - "intention != initier AND traitements_en_cours contient sulfamide"
      - "intention != initier AND intolerance_traitement == true OR hypoglycemie_recente == true OR position_vs_cible == sous_objectif"
    # GARDE-FOU (2026-07-26, 4e série, red-team clinique sécurité HAUTE-1) : sans cette exclusion, cette
    # option coexistait avec « Arrêter le sulfamide (DFG < 30) » — deux gestes CONTRADICTOIRES affichés
    # ensemble sur le même agent (« réduire » suggère de le garder à dose moindre, « arrêter » dit qu'il
    # est contre-indiqué). Miroir exact du garde-fou déjà en place sur « Réduire la posologie de la
    # metformine » (ci-dessus) et sur « Remplacer le sulfamide » (`exclusions: DFG < 30`, plus bas).
    exclusions:
      - "DFG < 30"
    priorite: 2
    famille: "Traitement à alléger"
    avantages:
      - "Réduire la dose limite l'hypoglycémie tout en gardant l'effet glycémique. Le praticien juge la dose."
    inconvenients:
      - "En sur‑contrôle franc (< 6,5 %) ou hypo/chute chez le fragile : préférer l'allègement/l'arrêt (désintensification). Agent sans bénéfice d'organe : envisager plutôt un switch vers un agent protecteur si le terrain s'y prête."
    effet_attendu: "non chiffrable"
    niveau_preuve: faible
  - intitule: "Réduire la posologie du glinide (tolérance, hypoglycémie légère)"
    role: geste
    action: reduire
    conditions:
      - "intention != initier AND traitements_en_cours contient glinide"
      - "intention != initier AND intolerance_traitement == true OR hypoglycemie_recente == true OR position_vs_cible == sous_objectif"
    # AUCUNE exclusion rénale, DÉLIBÉRÉMENT (cf. le commentaire de scission ci-dessus) : le RCP du
    # répaglinide ne porte aucune contre-indication rénale, et le geste qu'il recommande en insuffisance
    # rénale sévère EST la réduction de dose. L'alerte ci-dessous porte le fait de sécurité (exposition
    # doublée) sur le canal correct — une alerte d'OPTION, puisqu'elle ne vaut que si ce geste est
    # effectivement proposé (D21).
    alertes:
      - quand: "DFG < 40"
        niveau: attention
        message: >-
          Insuffisance rénale sévère : l'exposition au répaglinide et sa demi-vie DOUBLENT (ASC ×2 mesurée
          entre 20 et 39 ml/min, RCP rubrique 5.2), et la sensibilité à l'insuline est majorée — réduire la
          dose et renforcer la surveillance des hypoglycémies. Ce n'est PAS une contre-indication : le RCP
          n'en porte aucune sur le rein (contrairement au sulfamide), il conclut à la prudence posologique.
    priorite: 2
    famille: "Traitement à alléger"
    avantages:
      - "Réduire la dose limite l'hypoglycémie tout en gardant l'effet glycémique. Le praticien juge la dose."
      - "Reste utilisable quand le sulfamide ne l'est plus : élimination hépatobiliaire (8 % seulement par voie rénale), aucune contre-indication rénale au RCP."
    inconvenients:
      - "En sur‑contrôle franc (< 6,5 %) ou hypo/chute chez le fragile : préférer l'allègement/l'arrêt (désintensification). Agent sans bénéfice d'organe : envisager plutôt un switch vers un agent protecteur si le terrain s'y prête."
      - "Prise à chaque repas (observance) ; le RCP ne documente pas le comportement en dessous de 20 ml/min."
    effet_attendu: "non chiffrable"
    niveau_preuve: faible
  # ---- Déprescription de la metformine (arbitrage référent 2026-07-26, 2e série) -----------------------
  - intitule: "Déprescrire la metformine (sur-traitement chez un patient fragile, tous les autres agents à bénéfice dur)"
    role: geste
    action: arreter
    # DÉCISION RÉFÉRENT (2026-07-26, 2e série) : arbitrage resté ouvert depuis la capture 6. Trois
    # conditions cumulatives, portées par `metformine_deprescriptible` (voir son commentaire dans
    # `criteres_entree` pour le détail — notamment la lecture stricte appliquée à l'insuline, une
    # interprétation de l'orchestrateur à confirmer/corriger par le référent). `contient metformine` est
    # une précondition structurelle évidente (même convention que les autres options « Arrêter/Réduire la
    # metformine » ci-dessus), pas une 4e condition clinique.
    conditions:
      - "intention != initier AND traitements_en_cours contient metformine"
      - "metformine_deprescriptible == true"
    priorite: 3
    famille: "Traitement à alléger"
    avantages:
      - "Sur-traitement identifié (objectif dépassé, `sous_objectif`) chez un sujet fragile, alors que tous les autres agents en place (iSGLT2 / AR GLP‑1 / tirzépatide) apportent un bénéfice d'organe démontré et sont à conserver (ADA 13.14d — ne jamais retirer un agent protecteur). La metformine est l'agent au bénéfice le plus faible du traitement en cours (cf. son propre `effet_attendu` ci-dessus) : c'est elle qu'on retire en premier pour désintensifier."
      - "Réduit la charge médicamenteuse (comprimés, effets digestifs) sans toucher à la protection cardio‑rénale/athéromateuse déjà couverte par les agents conservés."
    inconvenients:
      - "⚠ DIVERGENCE DÉCLARÉE avec la reco officielle française (cf. `sources.reco_officielle` du nœud) : la HAS maintient la metformine comme socle quelles que soient les comorbidités, y compris chez le sujet fragile. Cette option s'appuie sur l'ABSENCE de bénéfice démontré sur critère dur contre placebo (Griffin 2017, Boussageon 2012 NS) et un `niveau_preuve` faible pour justifier son retrait dans ce cas précis — c'est une position raisonnée de l'outil sous 3 conditions strictes, pas une reco HAS/SFD/ADA. Ne jamais la présenter comme un consensus officiel."
      - "Ne s'applique PAS tant qu'un agent SANS bénéfice dur (sulfamide, gliptine, glinide, INSULINE incluse) est encore en place : c'est cet agent-là qu'il faut alléger/switcher/déprescrire en premier (cf. options dédiées) — la metformine, malgré son bénéfice propre faible, reste alors la valeur la plus sûre du traitement à conserver. Cas type : sur-traité fragile SOUS INSULINE → c'est l'insuline qu'on allège d'abord (options « Désintensifier » / « Réduire la posologie de l'insuline »), pas la metformine."
      - "Réévaluer le contrôle glycémique après l'arrêt ; la protection cardio‑rénale/athéromateuse reste portée par les agents conservés."
    effet_attendu: >-
      Simplification thérapeutique sans perte de protection d'organe (portée par les agents conservés, tous
      à bénéfice dur). Aucun bénéfice sur critère dur perdu par le retrait lui-même : la metformine n'en a
      pas démontré vs placebo (Griffin 2017, Boussageon 2012 NS).
    niveau_preuve: faible
    contre_indications:
      - "Ne jamais retirer un agent PROTECTEUR (iSGLT2, AR GLP‑1, tirzépatide) à la place de la metformine pour désintensifier. Si un agent sans bénéfice dur (y compris l'insuline) est encore en place, c'est lui qu'on allège en priorité — cette option ne se déclenche d'ailleurs pas dans ce cas (cf. `metformine_deprescriptible`)."
  - intitule: "Reconsidérer un agent protecteur prescrit hors indication ET posant un risque (ex. iSGLT2 sans terrain + infections uro)"
    role: geste
    conditions:
      - "intention != initier AND traitements_en_cours contient iSGLT2 AND ASCVD_etablie == false AND insuffisance_cardiaque == false AND DFG >= 60 AND albuminurie == normo AND infections_uro_genitales_recidivantes == true"
    priorite: 4
    famille: "Traitement à alléger"
    avantages:
      - "Un agent à bénéfice associé (rein/CV) prescrit SANS le terrain correspondant ET posant un risque (iSGLT2 sans IC/rein/ASCVD avec infections génito‑urinaires récidivantes) → l'envisager en retrait / switch vers une molécule sûre et bénéfique. (La gliptine sans bénéfice relève, elle, du switch vers un AR GLP‑1 — option dédiée — ou de l'arrêt si association redondante.)"
    inconvenients:
      - "Ne JAMAIS déprescrire un agent qui COUVRE un risque établi (iSGLT2 en IC/rein, AR GLP‑1 en ASCVD). Un iSGLT2/GLP‑1 sans terrain garde une utilité glycémique : ne le retirer que si un risque (ici infections uro) le justifie."
    effet_attendu: "Simplification thérapeutique ; pas de perte de bénéfice d'organe (par construction)."
    niveau_preuve: faible
  # ---- Place résiduelle SU / gliptine (classes protectrices indisponibles) ------------------------------
  - intitule: "Gliptine (sitagliptine) — option glycémique orale de bas rang (place résiduelle)"
    role: geste
    action: ajouter
    conditions:
      - "isglt2_indisponible == true AND aglp1_indisponible == true OR palette_glycemique_ouverte == true"
      - "position_vs_cible != sous_objectif"
    # R6 : garde-fous de cohérence (ne pas déjà prendre la classe visée / une classe concurrente) —
    # jamais montrés comme justification (cf. option iSGLT2 plus haut).
    prerequis:
      - "traitements_en_cours ne_contient_pas gliptine"
      - "traitements_en_cours ne_contient_pas aGLP1"
      - "traitements_en_cours ne_contient_pas tirzepatide"
    exclusions:
      - "symptomes_glucotoxicite == true"
      - "cetonemie == true"
    priorite:
      - quand: "isglt2_indisponible == true AND aglp1_indisponible == true"
        rang: 3
      - quand: "default"
        rang: 5
    famille: "Agent à ajouter"
    avantages:
      - "Agent glycémique ORAL possible « avec ses limites » (bas rang) : sans hypoglycémie, neutre sur le poids, bien toléré sur le plan digestif — la niche quand on veut éviter l'hypoglycémie sans injection, ou quand iSGLT2 et AR GLP‑1 sont indisponibles (le rang remonte alors). Molécule = SITAGLIPTINE (seule gliptine FR à sécurité CV démontrée, TECOS) jusqu'à DFG ≥ 30 ; en dessous, voir la molécule ci‑dessous. Préférée au sulfamide (ordre HAS/SFD)."
    inconvenients:
      - "AUCUN bénéfice sur critère dur (4 CVOT neutres) ; efficacité modeste (~0,5‑0,8 % HbA1c). Effets indésirables : pemphigoïde bulleuse (Lee 2020 HR 1,42), arthralgies (FDA), pancréatite (signal méta). Ne jamais associer à un AR GLP‑1."
    effet_attendu: >-
      Baisse d'HbA1c ~0,5‑0,8 % (substitution) ; aucun bénéfice dur. Face au sulfamide : absence d'hypoglycémie
      et de prise de poids (CAROLINA).
    niveau_preuve: modere
    references:
      - tecos
      - savor-timi-53
      - lee-pemphigoide
      - carolina
    # DISPONIBILITÉ FR EN RÉNAL SÉVÈRE — corrigé le 2026-07-27 (6e série, décision référent). Le nœud
    # écrivait « sitagliptine 25 mg si DFG < 30, dialyse incluse ». Or la SFD 2025 (Avis n° 12 bis, verbatim
    # relu par `chantier-2026-07-27/redteam-seuils-renaux.md` §1.2) écrit, DEUX fois, que la forme
    # sitagliptine 25 mg n'est PAS commercialisée en France, et désigne à sa place la vildagliptine 50 mg/j :
    # « Au stade d'IRC terminale (DFG < 15), parmi les molécules commercialisées en France, seuls l'insuline,
    # le répaglinide […], la vildagliptine à la dose de 50 mg/j et la sitagliptine à la dose de 25 mg/j
    # (forme non commercialisée en France) peuvent être utilisés. »
    # Le red-team N'A PAS pu vérifier ce point sur la BDPM (§7.6) et l'a explicitement laissé au référent
    # plutôt que de le deviner (invariant 6) ; le référent a tranché pour suivre la SFD à la lettre.
    # ⚠ Cette décision portait sur l'option « Arrêter le sulfamide » ; je l'ai ÉTENDUE ici et à l'alerte
    # « place résiduelle en insuffisance rénale », qui portaient la même affirmation — laisser le nœud
    # recommander ailleurs un dosage non dispensable aurait été se contredire. À reverser en bloc si la
    # sitagliptine 25 mg existe bien en officine.
    # Le RANG et les CONDITIONS de l'option sont INCHANGÉS : la gliptine reste offerte sous 30, seule la
    # molécule nommée change. Pas d'exclusion rénale ajoutée (aucune n'est portée par la source).
    contre_indications:
      - "SITAGLIPTINE (dose au DFG : 100 mg si ≥ 45 ; 50 mg si 30‑44). En dessous de 30 (dialyse incluse), la SFD 2025 nomme la VILDAGLIPTINE 50 mg/j : la forme sitagliptine 25 mg n'est pas commercialisée en France. Ne pas utiliser saxagliptine (IC + retrait FR) ni lina/alogliptine (non commercialisées FR). Éruption bulleuse → évoquer pemphigoïde, arrêter."
  - intitule: "Sulfamide (gliclazide MR ou glimépiride) — option glycémique de bas rang, derrière la gliptine"
    role: geste
    action: ajouter
    conditions:
      - "isglt2_indisponible == true AND aglp1_indisponible == true OR palette_glycemique_ouverte == true"
      - "position_vs_cible != sous_objectif"
    # R6 : garde-fous de cohérence (ne pas déjà prendre la classe visée / une classe concurrente) —
    # jamais montrés comme justification (cf. option iSGLT2 plus haut).
    prerequis:
      - "traitements_en_cours ne_contient_pas sulfamide"
      - "traitements_en_cours ne_contient_pas insuline_basale AND traitements_en_cours ne_contient_pas insuline_rapide"
    exclusions:
      - "DFG < 30"
      - "symptomes_glucotoxicite == true"
      - "cetonemie == true"
      # SUJET ÂGÉ (décision référent 2026-07-27, 6e série ; source : SFD 2025, Tableau I note 6, verbatim
      # relu par le red-team `chantier-2026-07-27/redteam-seuils-renaux.md` MOYENNE-4(a)) : « Il est
      # recommandé d'éviter de prescrire un sulfamide ou un glinide chez les sujets âgés "fragiles" et de
      # NE JAMAIS les utiliser chez les sujets âgés "dépendants". » DURCISSEMENT par rapport à l'édition
      # 2023, qui écrivait « il est préférable d'éviter » pour les deux catégories.
      # La prohibition n'existait jusqu'ici qu'en PROSE (`contre_indications` ci-dessous, « Déconseillé chez
      # le sujet à risque d'hypoglycémie élevé »), c'est-à-dire à un cran plus faible que « ne jamais » : un
      # écart de garde-fou directement documenté par la source décisive du nœud.
      # SUR-BLOCAGE ASSUMÉ (arbitrage référent explicite) : le nœud n'a PAS de catégorie « dépendant » —
      # `fragilite` est un booléen. Créer un statut gériatrique à trois valeurs aurait collé au texte à la
      # lettre, mais obligeait à reprendre tous les dérivés qui consomment `fragilite`. Le référent a
      # tranché pour l'exclusion sur le booléen existant : elle bloque donc AUSSI le sujet « fragile », que
      # la SFD dit seulement d'éviter. Choix délibéré, du côté sûr d'un garde-fou d'hypoglycémie.
      # Le GLINIDE, visé par la même phrase de la SFD, n'a pas d'option d'AJOUT dans ce nœud (aucune option
      # ne le prescrit) : rien à exclure de ce côté. Les options qui le RÉDUISENT ou l'ARRÊTENT restent
      # ouvertes — R3 : arrêter un traitement est une OPTION, jamais une exclusion.
      - "fragilite == true"
    priorite:
      - quand: "isglt2_indisponible == true AND aglp1_indisponible == true"
        rang: 3
      - quand: "default"
        rang: 5
    famille: "Agent à ajouter"
    avantages:
      - "Agent glycémique possible « avec ses limites » (bas rang) : efficacité nette (~1‑1,5 % HbA1c), la plus forte des deux classes résiduelles ; les SU modernes (gliclazide, glimépiride) ne sont pas plus délétères en CV que des comparateurs récents (CAROLINA, TOSCA.IT, GRADE neutres). Rang remonté si iSGLT2/AR GLP‑1 indisponibles."
    inconvenients:
      - "AUCUN bénéfice sur critère dur. Vrais inconvénients : HYPOGLYCÉMIE (sévère chez l'âgé/l'insuffisant rénal) et PRISE DE POIDS ; durabilité moindre. JAMAIS le glibenclamide (Simpson 2015)."
    effet_attendu: >-
      Baisse d'HbA1c ~1‑1,5 % (substitution) ; aucun bénéfice dur. Gain glycémique contre risque d'hypoglycémie
      (34‑42 % de toute hypo sous SU) et prise de poids.
    niveau_preuve: modere
    references:
      - carolina
      - tosca-it
      - grade
      - simpson
    contre_indications:
      - "CONTRE‑INDIQUÉ si DFG < 30. Déconseillé chez le sujet à risque d'hypoglycémie élevé (âgé fragile, IR, alimentation irrégulière) : préférer la gliptine. Molécule : gliclazide MR ou glimépiride, jamais le glibenclamide."
  # ---- Repli ------------------------------------------------------------------------------------------
  # CARTE ÉCRITE le 2026-07-27 SUR ÉNONCÉ DU RÉFÉRENT, mot pour mot : « un patient naïf sous son objectif
  # ne nécessite pas de traitement, seulement des RHD. » Elle comble le dernier trou que le prérequis
  # d'I15 avait découvert sur ce nœud — deux profils du banc, patient réellement naïf et déjà à/sous son
  # objectif, où plus aucune option ne s'appliquait et où l'écran restait VIDE.
  #
  # C'est le PENDANT, côté initiation, du repli « Poursuivre le traitement en cours » ci-dessous : les deux
  # sont des `default` à `prerequis` complémentaires (`intention == initier` ici, `intention != initier`
  # là), donc jamais applicables ensemble et couvrant à eux deux toutes les intentions.
  #
  # POURQUOI UN `default` ET NON UNE OPTION À CONDITIONS. Un repli ne s'active que si AUCUNE option non-
  # default ne s'applique (`evaluateNode`). Cette carte ne peut donc jamais s'afficher à côté d'une
  # indication de PROTECTION cardio-rénale — qui, elle, ne dépend pas de la position vs objectif. Écrite
  # avec des `conditions` réelles, elle aurait dit « aucun traitement nécessaire » en face d'une carte
  # proposant un iSGLT2 pour une albuminurie : deux affirmations contradictoires sur le même écran.
  #
  # `cible_atteinte == true` en prérequis (et non seulement `intention == initier`) : c'est l'énoncé du
  # référent, et sans lui la carte affirmerait « pas de traitement » à un patient naïf AU-DESSUS de son
  # objectif chez qui tout serait par ailleurs bloqué — un écran silencieux vaut mieux qu'une carte fausse.
  - intitule: "Aucun traitement médicamenteux — mesures hygiéno‑diététiques seules, réévaluer"
    role: repli
    conditions:
      - "default"
    prerequis:
      - "intention == initier"
      - "cible_atteinte == true"
    famille: "Aucun geste — surveiller"
    avantages:
      - "Patient naïf déjà à son objectif ou en dessous : aucun agent hypoglycémiant n'est indiqué à ce stade. Les mesures hygiéno‑diététiques (alimentation, activité physique) constituent le traitement — cf. les nœuds RHD du domaine."
    inconvenients:
      - "Réévaluer l'HbA1c et l'objectif individualisé à 3‑6 mois : une dérive au‑dessus de l'objectif rouvre l'indication d'un traitement médicamenteux. Une indication de PROTECTION cardio‑rénale (insuffisance cardiaque, maladie rénale, athérome) s'apprécie indépendamment de la glycémie et ferait apparaître d'autres cartes."
    effet_attendu: >-
      Aucun traitement médicamenteux instauré. Surveillance du contrôle glycémique et de l'objectif
      individualisé.
    niveau_preuve: faible
  - intitule: "Poursuivre le traitement en cours et réévaluer"
    role: repli
    action: maintenir
    conditions:
      - "default"
    # PRÉREQUIS POSÉ le 2026-07-27, après trois obstacles levés dans l'ordre (R9 / invariant I15 : un repli
    # qui propose de CONTINUER doit dire à quelle condition — ici, qu'un traitement existe). Tranché par le
    # référent le 2026-07-26, il avait dû être retiré le jour même : il faisait échouer I2′ sur 6 profils
    # où plus aucune option ne subsistait. Ce trou PRÉEXISTAIT, masqué par ce repli qui proposait de
    # « poursuivre » un traitement inexistant ; le prérequis n'a fait que le découvrir. Ce qui l'a comblé :
    #   6 → 5  ouverture rénale de l'option AR GLP‑1 (cf. son commentaire) ;
    #   5 → 2  contrainte de saisie « initier ⇒ patient naïf » (en tête de fichier) — trois profils
    #          déclaraient un traitement en cours sous l'intention « initier », que le formulaire ne peut
    #          pas produire (`visible_si`) et que seul le générateur du banc fabriquait ;
    #   2 → 0  carte « Aucun traitement médicamenteux — MHD seules » (ci-dessus), écrite sur énoncé du
    #          référent, pour le patient naïf déjà à son objectif.
    prerequis:
      - "intention != initier"
    famille: "Aucun geste — surveiller"
    avantages:
      - "Aucun geste d'ajout, d'optimisation ni de désintensification n'est indiqué : objectif atteint sans agent iatrogène à optimiser ni indication de protection non couverte. Poursuivre et réévaluer à 3‑6 mois (HAS R.47)."
    inconvenients:
      - "Réévaluer efficacité, tolérance et adhésion à chaque consultation ; arrêter un agent non‑répondeur (< 0,5 % sans indication de protection)."
    effet_attendu: >-
      Pas de modification. Surveillance du contrôle, de la tolérance et de l'apparition d'une indication de
      protection (qui rouvrirait la prescription).
    niveau_preuve: faible
alertes:
  # DÉCISION RÉFÉRENT 2026-07-27 : rendre AUDIBLE une combinaison qui produisait jusqu'ici un silence
  # déroutant. `palette_glycemique_ouverte` est commandée par l'INTENTION (R1, séquençage S8) : un
  # praticien qui déclare « optimiser » chez un patient qu'il déclare AU-DESSUS de sa cible reçoit le
  # socle et la poursuite, sans levier glycémique — comportement fidèle à l'intention déclarée, mais qui
  # peut se lire comme une défaillance de l'outil. Le comportement est CONSERVÉ (l'outil n'infléchit pas
  # ce que le praticien a déclaré) ; seule la raison devient visible. C'est aussi l'entrée par laquelle
  # une incertitude à prémisse fausse a été démasquée : le silence était attribué à un verrou IMC qui
  # n'existe pas (cf. incertitudes).
  - quand: "intention == optimiser AND position_vs_cible == au_dessus OR intention == optimiser AND position_vs_cible == nettement_au_dessus"
    niveau: info
    # PRÉCISÉE le 2026-07-27 (nuit) — classe K10 de la seconde recette navigateur. Le rapport a vérifié
    # qu'il n'y avait PAS de contradiction logique : les cartes « Introduire… » qui suivent parfois cette
    # alerte sont des ajouts PROTECTEURS (indication cardio-rénale), pas des intensifications
    # glycémiques. Mais la distinction tenait au seul mot « glycémique », au milieu de cinq lignes, à un
    # écran de deux cartes qui commencent par « Introduire ». Le message dit désormais ce que l'outil
    # fait, explicitement — aucune revendication clinique nouvelle n'y est introduite, seule la
    # description de son propre comportement est complétée.
    message: >-
      Position déclarée AU-DESSUS de l'objectif, avec une intention d'OPTIMISATION : l'outil s'en tient à
      ce qui est déclaré et ne propose donc aucune INTENSIFICATION GLYCÉMIQUE (la palette
      d'intensification est commandée par l'intention, pas par la position). En revanche, les options de
      PROTECTION cardio-rénale continuent d'être proposées si elles sont indiquées : une carte
      « Introduire… » peut donc apparaître ci-dessous sans contredire ce message — elle est là pour le
      bénéfice cardiaque ou rénal, et le « proposé parce que » de chaque carte le nomme. C'est le
      comportement attendu si vous travaillez d'abord la tolérance, l'observance ou la simplification du
      schéma. Si un renforcement du contrôle glycémique est visé, déclarer l'intention « intensifier »
      ouvre les options correspondantes.
  # ÉLARGIE (2026-07-26, 4e série, red-team clinique sécurité HAUTE-3) : cette alerte ne testait jusqu'ici
  # que deux PROXYS de décompensation (HbA1c très élevée, symptômes de glucotoxicité) — jamais `cetonemie`
  # elle-même. Une cétonémie CONFIRMÉE sans ces deux proxys (le tableau typique de l'acidocétose
  # euglycémique sous iSGLT2, où la glycémie peut rester proche de la normale) ne déclenchait donc AUCUNE
  # alerte : `alertes: []` sur un profil où le fait le plus grave saisi était `cetonemie == true`.
  - quand: "HbA1c_actuelle >= 10 OR symptomes_glucotoxicite == true OR cetonemie == true"
    niveau: attention
    message: >-
      Contrôler la cétonémie capillaire (β‑hydroxybutyrate) : décompensation catabolique possible malgré une
      HbA1c non franchement élevée. ≥ 0,6 mmol/L → insuline d'initiation ; ≥ 3 mmol/L → urgence (insuline +
      hospitalisation).
  # AJOUT 2026-07-26 (orchestrateur) — COLMATAGE D'UNE RÉGRESSION INTRODUITE LE MÊME JOUR.
  # Le prérequis `ne_contient_pas insuline_basale AND … insuline_rapide` ajouté à « Insuline d'initiation » supprime cette option chez
  # un patient déjà sous insuline — décision correcte (« initier » n'a pas de sens, l'ajustement relève du
  # nœud E). Mais le message d'urgence sur la cétonémie vivait dans les `contre_indications` de cette
  # option : il disparaissait donc avec elle. Un patient cétonémique déjà sous insuline, HbA1c < 10 et sans
  # symptôme de glucotoxicité, ne recevait plus AUCUN signal — l'alerte ci-dessus ne couvre pas ce cas
  # (elle dit « CONTRÔLER la cétonémie », ce qui n'a pas de sens quand elle est déjà déclarée positive).
  # Aucun texte clinique inventé à la création : reprise des `contre_indications` et de l'`effet_attendu`
  # de l'option « Insuline d'initiation » (cétonémie ≥ 3 mmol/L → urgence ; suspicion de DT1 devant une
  # cétose).
  # VALIDÉE PAR LE RÉFÉRENT (2026-07-26, 2e série), AVEC UNE PRÉCISION CLINIQUE : « en pratique, une cétose
  # chez un patient sous insuline est très rare, sauf en cas de rupture thérapeutique. » Message complété
  # en conséquence — la RUPTURE THÉRAPEUTIQUE (arrêt, oubli, défaut d'administration, panne de pompe) est
  # désormais désignée comme la PREMIÈRE chose à rechercher devant ce tableau, avant d'orienter vers un
  # ajustement de schéma. Reste du message inchangé (seuil 3 mmol/L, suspicion de DT1, renvoi au nœud E).
  - quand: "intention != initier AND cetonemie == true AND traitements_en_cours contient insuline_basale OR intention != initier AND cetonemie == true AND traitements_en_cours contient insuline_rapide"
    niveau: attention
    message: >-
      État catabolique (cétonémie) chez un patient DÉJÀ sous insuline : rare en pratique — la PREMIÈRE
      chose à rechercher est une RUPTURE THÉRAPEUTIQUE (arrêt, oubli, défaut d'administration, panne de
      pompe). Si l'insuline est bien prise et correctement administrée, l'ajustement du schéma est urgent
      et relève du nœud « Insulinothérapie » (hors périmètre de ce nœud) — ne pas se contenter des agents
      non insuliniques. Cétonémie ≥ 3 mmol/L → urgence (insuline + hospitalisation). Suspecter un DT1
      devant une cétose ou un amaigrissement rapide chez un sujet non obèse.
  - quand: "DFG < 60 AND DFG >= 45"
    niveau: attention
    message: >-
      Metformine : dose maximale 2 000 mg/j si DFG 45‑59 (RCP ANSM) ; revoir au préalable les facteurs de
      risque d'acidose lactique.
  - quand: "DFG < 45 AND DFG >= 30"
    niveau: attention
    message: >-
      Metformine : dose maximale 1 000 mg/j, initiation ≤ 500 mg si DFG 30‑44 (RCP ANSM).
  # AUCUNE ALERTE RÉNALE DISTINCTE n'a été créée (décision référent 2026-07-27 : « l'alerte individuelle
  # est-elle nécessaire ? elle est présente dans chaque classe »). C'est juste : chaque option porte déjà
  # ses propres `contre_indications` rénales, et une alerte de nœud qui les recopie ne fait que les répéter
  # hors de leur contexte. Seule la QUEUE de ce message a été corrigée : « en dessous, relais par une autre
  # classe (nœud E) » routait vers l'INSULINOTHÉRAPIE un patient chez qui un AR GLP‑1 convient — le nœud E
  # est le nœud insuline. Le DFG restreint les agents à ÉLIMINATION RÉNALE ; il ne dit rien de la puissance
  # glycémique d'une classe, et ni l'AR GLP‑1 ni l'insuline n'ont de contre-indication rénale.
  - quand: "DFG < 30"
    niveau: attention
    message: >-
      Metformine CONTRE‑INDIQUÉE si DFG < 30 (RCP ANSM) : arrêter ; sulfamide aussi. Un iSGLT2 reste
      initiable jusqu'à DFG ≥ 20 (indication rénale). Ces limites portent sur l'ÉLIMINATION RÉNALE des
      agents, pas sur leur efficacité glycémique : l'AR GLP‑1 et l'insuline n'ont pas de contre‑indication
      liée au DFG et restent utilisables en dessous de 20.
  # R2 (docs/decision/GRAMMAIRE-NOEUD.md) — DÉCOUPÉE le 2026-07-25 (arbitrage référent). Cette alerte
  # confondait deux faits sous un même `quand` : le patient est DÉJÀ sous incrétine (fait observé) et le
  # moteur est SUR LE POINT d'en proposer un. La seconde branche s'écrivait `ASCVD_etablie == true OR
  # IMC >= 30`, c'est-à-dire une RECOPIE des conditions de déclenchement de l'option AR GLP‑1, faute de
  # pouvoir interroger ce que le moteur a retenu. Ce proxy se retournait contre lui-même : le terrain qui
  # ouvre l'indication (athérome, obésité) est aussi celui qui fait EXCLURE l'incrétine chez le sujet
  # maigre ou dénutri (IMC < 22, dénutrition), et l'alerte se déclenchait quand même — elle parlait d'un
  # traitement que le moteur venait d'écarter. Ne reste ici que la branche « déjà sous incrétine », qui
  # est un état du patient et non une supposition sur la sortie. La branche « on va en introduire un » est
  # devenue une alerte PORTÉE PAR L'OPTION (cf. `alertes` des options AR GLP‑1 et tirzépatide) : elle n'a
  # plus rien à deviner, elle s'affiche si et seulement si l'option est applicable.
  - quand: "intention != initier AND fragilite == true AND traitements_en_cours contient aGLP1 OR intention != initier AND fragilite == true AND traitements_en_cours contient tirzepatide"
    niveau: attention
    message: >-
      Sujet fragile déjà sous incrétine (AR GLP‑1 / tirzépatide) : surveiller le poids et l'état
      nutritionnel (risque de sarcopénie / anorexie). En cas de dénutrition ou d'IMC bas, réévaluer
      l'indication — réduire la posologie ou arrêter.
  - quand: "intention != initier AND infections_uro_genitales_recidivantes == true AND traitements_en_cours contient iSGLT2 OR infections_uro_genitales_recidivantes == true AND insuffisance_cardiaque == true OR infections_uro_genitales_recidivantes == true AND DFG < 60 OR infections_uro_genitales_recidivantes == true AND albuminurie != normo OR infections_uro_genitales_recidivantes == true AND ASCVD_etablie == true"
    niveau: attention
    message: >-
      iSGLT2 (en cours ou indiqué par la comorbidité) + infections génito‑urinaires récidivantes : réévaluer
      l'indication (ne pas initier / envisager l'arrêt) ; risque de gangrène de Fournier. Préférer une autre
      classe si une protection est requise.
  - quand: "intention != initier AND intolerance_traitement == true AND nature_intolerance contient digestive AND traitements_en_cours contient metformine AND traitements_en_cours contient aGLP1 OR intention != initier AND intolerance_traitement == true AND nature_intolerance contient digestive AND traitements_en_cours contient metformine AND traitements_en_cours contient tirzepatide"
    niveau: attention
    message: >-
      Intolérance digestive : la metformine ET l'AR GLP‑1 / tirzépatide en sont deux sources. Privilégier
      généralement la réduction / l'arrêt de la METFORMINE (bénéfice le plus faible). L'intolérance ou la
      contre‑indication à la metformine ouvre d'ailleurs le remboursement d'une MONOTHÉRAPIE d'AR GLP‑1
      (dulaglutide/liraglutide) en France — formulaire Assurance Maladie, Art. 61 de la convention médicale,
      arrêté du 10/01/2025 : « en monothérapie, quand l'utilisation de la metformine est considérée comme
      inappropriée en raison d'une intolérance ou de contre‑indications ».
  - quand: "isglt2_indisponible == true AND aglp1_indisponible == true AND risque_hypoglycemie_schema == eleve"
    niveau: attention
    message: >-
      Risque d'hypoglycémie élevé + place résiduelle : DÉCONSEILLER le sulfamide, préférer la gliptine
      (sitagliptine, sans hypoglycémie). Si un SU est retenu : gliclazide MR à dose basse, jamais le
      glibenclamide, avec éducation à l'hypoglycémie.
  - quand: "isglt2_indisponible == true AND aglp1_indisponible == true AND DFG < 45"
    niveau: attention
    message: >-
      Place résiduelle en insuffisance rénale : sitagliptine à dose réduite (50 mg si DFG 30‑44). En dessous
      de 30 (dialyse incluse), la SFD 2025 nomme la vildagliptine 50 mg/j — la forme sitagliptine 25 mg
      n'est pas commercialisée en France. Sulfamide gliclazide/glimépiride à dose réduite mais
      CONTRE‑INDIQUÉ < 30 ; jamais de glibenclamide.
  - quand: "intention != initier AND traitements_en_cours contient insuline_basale AND traitements_en_cours contient sulfamide OR intention != initier AND traitements_en_cours contient insuline_rapide AND traitements_en_cours contient sulfamide OR intention != initier AND traitements_en_cours contient insuline_basale AND traitements_en_cours contient glinide OR intention != initier AND traitements_en_cours contient insuline_rapide AND traitements_en_cours contient glinide"
    niveau: attention
    message: >-
      Association insuline + sulfamide / glinide : risque d'hypoglycémie cumulée. Envisager d'arrêter le
      sulfamide / le glinide, surtout à l'introduction ou à l'intensification de l'insuline.
  - quand: "preference_injection == refuse AND ASCVD_etablie == true OR preference_injection == refuse AND IMC >= 30"
    niveau: attention
    message: >-
      Refus des injections : privilégier une alternative ORALE (sémaglutide oral, iSGLT2, iDPP4) — les options
      injectables (AR GLP‑1 injectable, tirzépatide, association) sont reléguées en dernier. Si aucune
      alternative non injectable adaptée n'existe alors qu'un bénéfice cardio‑rénal prouvé est requis, un
      injectable reste à discuter avec le patient (le refus ne doit pas priver d'un traitement à bénéfice démontré).
  - quand: "position_vs_cible == a_l_objectif AND HbA1c_actuelle >= 9 OR position_vs_cible == sous_objectif AND HbA1c_actuelle >= 9"
    niveau: attention
    message: >-
      Cohérence : HbA1c ≥ 9 % alors que le patient est déclaré à l'objectif ou en dessous. Aucune cible
      individualisée ne dépasse 9 % (la bande la plus large est « < 9 % », réservée au sujet âgé
      dépendant) — vérifier l'objectif retenu : une INTENSIFICATION est probablement indiquée.
  - quand: "intention == intensifier AND hba1c_sous_cible == true"
    niveau: attention
    message: >-
      Cohérence : HbA1c < 6,5 % alors que l'intention saisie est « intensifier ». L'objectif est déjà dépassé
      sous agent hypoglycémiant — envisager plutôt une DÉPRESCRIPTION (rebasculer l'intention sur « déprescrire »).
  # NOUVEAU (2026-07-26, chantier prescription/intention — recette capture 6) : `intention` ne pilotait
  # jusqu'ici que 3 `visible_si` et un dérivé (`palette_glycemique_ouverte`), jamais un élément de la
  # SORTIE (capture 6 : « Déprescrire » + sous l'objectif → l'outil propose un ajout d'AR GLP‑1, ASCVD
  # oblige, et aucune déprescription — le patient n'est ni sous SU/glinide/insuline ni en excès de
  # metformine/iSGLT2 à ce jeu de critères). Cette alerte fait ENFIN agir `intention` sur la sortie —
  # mais par « expliquer », pas par « reléguer » : la relégation via `priorite` a été évaluée et écartée
  # (voir changelog) — dans ce nœud, un geste d'« Agent à ajouter » qui survit à `intention == deprescrire`
  # provient TOUJOURS d'une indication transverse (organe) ou d'un switch (`remplacement_agent_sans_
  # benefice`), jamais d'une voie purement glycémique (`palette_glycemique_ouverte` est déjà FERMÉE par
  # construction pour cette intention, `:179`) : le reléguer par un `priorite` conditionnel n'aurait donc
  # JAMAIS d'effet observable (options mutuellement exclusives par leurs propres `prerequis`) — un rang
  # qui ne change jamais rien à l'écran est le piège inverse que R5 signale pour les critères. Le
  # `quand` NE RECOPIE AUCUNE condition d'option (piège documenté par R2 plus haut, « ce proxy se
  # retournait contre lui-même ») : il ne teste QUE `intention`, jamais indéterminé, toujours vrai pour
  # cette seule intention — pas un `quand: "default"` (D21, interdit n°2).
  - quand: "intention == deprescrire"
    niveau: info
    message: >-
      Intention déclarée : déprescrire. Si un geste d'ajout s'affiche malgré tout ci‑dessous, il reflète
      une indication transverse (protection cardio‑rénale ou athéromateuse, valable quel que soit le motif
      de la consultation) ou le remplacement d'un agent sans bénéfice déjà en cours — jamais une
      contradiction avec l'intention saisie. Si aucun geste de désintensification ne s'affiche, c'est
      qu'aucun critère saisi ne le déclenche à ce jour (agent hypoglycémiant en cours, sur‑contrôle,
      hypoglycémie récente chez le fragile) : consultez « Pourquoi pas d'autres options ? » pour le détail
      des options non retenues sur ce patient.
  - quand: "intention != initier AND traitements_en_cours contient insuline_basale AND risque_hypoglycemie_schema == eleve OR intention != initier AND traitements_en_cours contient insuline_rapide AND risque_hypoglycemie_schema == eleve"
    niveau: attention
    message: >-
      Patient sous insuline à haut risque hypoglycémique : ÉVITER d'ajouter un sécrétagogue (sulfamide /
      glinide). Privilégier un agent sans hypoglycémie (iSGLT2 / AR GLP‑1) ou l'ajustement du schéma
      insulinique (titration, doses).
  # LEVÉE DU VERROU GLIPTINE (référent, 2026-07-25) : remplace la garantie structurelle retirée de l'option
  # « Introduire un AR GLP‑1 » (`ne_contient_pas gliptine`) — la non-association est désormais garantie par
  # l'affichage de cette alerte, dès que la gliptine est en cours. Texte dérivé mot pour mot de la prose déjà
  # sourcée dans l'option « Remplacer la gliptine » (règle dure Nauck/ADA/KDIGO/HAS).
  - quand: "intention != initier AND traitements_en_cours contient gliptine"
    niveau: attention
    message: >-
      Non-association incrétine : si un AR GLP‑1 ou le tirzépatide est introduit, la gliptine doit être
      ARRÊTÉE — même voie incrétine, aucun bénéfice additif (Nauck 2017 ; ADA §9 ; KDIGO PP4.2.3 ;
      HAS R.80). Ne jamais les associer.
argumentaire: >
  Ce nœud unique outille toute la prescription non‑insulinique du DT2, à partir de L'INTENTION du praticien
  (initier / intensifier / optimiser / déprescrire) qui organise la saisie et déduit la position vs objectif,
  sans jamais masquer un geste transverse indiqué. La hiérarchie de valeur est constante : iSGLT2 et AR GLP‑1
  ont un bénéfice d'organe démontré (CVOT vs placebo, critères durs) EN PRÉSENCE de la comorbidité
  correspondante (IC/rein pour l'iSGLT2, athérome pour l'AR GLP‑1) ; sulfamides et gliptines n'ont aucun
  bénéfice d'organe (essais de sécurité CV neutres). Quand l'objectif n'est pas atteint, iSGLT2 et AR GLP‑1
  sont aussi des LEVIERS GLYCÉMIQUES à part entière (sans hypoglycémie, perte de poids), disponibles même sans
  comorbidité — la comorbidité les PRIORISE, elle ne conditionne pas leur disponibilité (ordre préférentiel
  HAS R.74 : iSGLT2/AR GLP‑1 > iDPP4 > sulfamide) ; insuline, sulfamide et gliptine restent des agents
  possibles « avec leurs limites » (bas rang), l'insuline en repli quand la palette non‑insulinique est
  épuisée. Fix de préférence : en athérome pur, l'AR GLP‑1 passe DEVANT l'iSGLT2 (sans effet démontré sur
  l'IDM/l'AVC). On SWITCHE un agent de faible valeur ou mal toléré, jamais en associant gliptine + AR GLP‑1
  (même voie incrétine). On DÉPRESCRIT (fort sur les hypoglycémiants ; réduction ou arrêt) : un HbA1c < 6,5 %
  sous agent hypoglycémiant est une iatrogénie à corriger à tout âge, sans jamais retirer un agent protecteur.
  Un gating négatif de terrain empêche les erreurs du sujet fragile : AR GLP‑1 et tirzépatide exclus chez le
  maigre (IMC < 22) ou le dénutri (même obèse), tirzépatide réservé à l'obésité, iSGLT2 déconseillé en cas
  d'infections génito‑urinaires récidivantes. En état catabolique, une insuline d'initiation (transitoire)
  s'impose ; son schéma (titration, doses) est ensuite ajusté et suivi dans la durée. NB EBM : lorsqu'iSGLT2/AR GLP‑1 sont proposés au SEUL titre
  glycémique (sans comorbidité), leur bénéfice attendu est glycémique (absence d'hypoglycémie, poids), PAS le
  bénéfice d'organe des populations enrichies des CVOT (EMPA-REG OUTCOME ; DAPA-CKD, NNT 19/2,4 ans ;
  EMPEROR-Reduced, NNT 19) — d'où une place plus restreinte pour la dapagliflozine hors indication d'organe
  (divergence de degré, cf. divergence).
  VOLET RÉNAL, repris en source primaire le 2026-07-27 : le seuil de 30 des sulfamides n'est plus présenté
  comme une « convention KDIGO » — la KDIGO ne porte aucun chiffre sur cette classe, c'est la SFD qui cite le
  seuil dans la même phrase que la contre-indication, sur deux éditions. Le glinide en est distingué : aucune
  contre-indication rénale à son RCP, élimination hépatobiliaire, exposition doublée en IRC sévère qui
  justifie une prudence posologique — et deux sources françaises le nomment nommément sous DFG 15. Le sujet
  âgé FRAGILE se voit désormais retirer le sulfamide par une exclusion (la SFD 2025 a durci « éviter » en
  « ne jamais utiliser » chez le dépendant ; sur-blocage assumé, le nœud n'ayant pas cette catégorie). Le
  garde-fou d'HbA1c devient conditionnel : 7 % si DFG < 30 sous glinide ou insuline, 6,5 % sinon. Et sous
  DFG 30, la gliptine nommée est la VILDAGLIPTINE 50 mg/j — la forme sitagliptine 25 mg n'est pas
  commercialisée en France, vérifié par le référent.
