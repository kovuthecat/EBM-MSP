  synthese_critique:
    donnee: >-
      Sur socle metformine, quand l'objectif n'est pas atteint : ajouter un AR GLP‑1 (sémaglutide ou
      dulaglutide en premier choix) est le plus souvent indiqué, surtout à risque cardiovasculaire élevé ;
      la dapagliflozine (voire l'empagliflozine) est réservée à l'insuffisance cardiaque ou à
      l'insuffisance rénale modérée avec protéinurie — le bénéfice d'organe des iSGLT2 étant démontré dans
      des essais menés sur des populations enrichies en IC/rein (EMPA-REG OUTCOME ; DAPA-CKD, NNT 19/2,4
      ans ; EMPEROR-Reduced, NNT 19), pas dans une population purement glycémique. Le tirzépatide n'est pas
      supérieur au dulaglutide sur les événements cardiovasculaires (SURPASS-CVOT, non-infériorité). Sur
      les gliptines : aucun bénéfice sur critère dur dans 4 CVOT (TECOS neutre ; SAVOR-TIMI 53, signal
      d'insuffisance cardiaque HR 1,27 pour la saxagliptine), et effets indésirables documentés
      (pemphigoïde bulleuse HR 1,42, signal de pancréatite) — une lecture plus prudente les écarte
      entièrement quand HAS/SFD les gardent en place résiduelle bien tolérée pour le reste : c'est le même
      socle de preuve, soupesé différemment. Sur les sulfamides : hypoglycémie fréquente (34-42 % de toute
      hypoglycémie sous SU dans les essais), aucun bénéfice sur critère dur. Le bénéfice de la metformine
      en 1re intention n'est pas démontré sur critère dur contre placebo (Griffin 2017, méta-analyse) — un
      argument distinct du coût, inopérant en France (remboursement identique). Chez l'espérance de vie
      faible, ne pas ajouter de nouvel agent tant que l'HbA1c reste ≤ 8,5-9 %. Intensification pilotée par
      les comorbidités, relégation des sulfamides et des gliptines (aucun bénéfice d'organe démontré),
      désintensification du sujet âgé fragile validée par un essai randomisé (Grant 2025 : hypoglycémie
      sévère non aggravée par l'allègement, 4,7 % vs 6,5 % NS).
    references:
      - nom: "Médicalement Geek"
        lien: "https://www.medicalement-geek.com/2023/01/les-traitements-du-diabete-formule-all.html"
      - nom: "Prescrire"
        detail: "Résumé sous droit d'auteur ; réf. Rev Prescrire 2023;43(478):595-605 ; synthèses docs/decision/sources/prescrire-dt2.md."
  reco_officielle:
    source: "HAS 2024 (Stratégie thérapeutique DT2, R.45‑R.105) ; SFD 2025 (Med Mal Metab 2025;19:630‑662, Avis 3/5/5bis/6/11‑15) ; ADA Standards of Care 2026 ; KDIGO 2022 ; RCP metformine/iSGLT2/incrétines (ANSM)"
    position: >-
      Sur socle metformine + mode de vie : en cas de maladie CV établie, IC ou MRC, prescrire d'emblée un
      iSGLT2 ou un AR GLP‑1 (ou tirzépatide) à bénéfice prouvé, quel que soit l'HbA1c ; en obésité (IMC ≥ 30),
      AR GLP‑1 ou tirzépatide. Sulfamides plus la stratégie préférentielle (R.69) ; ne pas associer GLP‑1 et
      iDPP4 (R.80) ; chez le sujet âgé sur‑traité, éviter le surtraitement et désintensifier (R.102/103/105 ;
      SFD Avis 5 bis ; ADA 13.14), en maintenant iSGLT2/AR GLP‑1. Sécurité rénale metformine : 3 g ≥ 60,
      2 g 45‑59, 1 g 30‑44, CI < 30.
    divergence: true
    explication: >-
      Convergence forte sur la direction (relégation SU/gliptines, priorité iSGLT2/AR GLP‑1 par comorbidité,
      non‑association gliptine+GLP‑1, désintensification). Divergences : (1) sur les gliptines — aucun
      bénéfice sur critère dur dans 4 CVOT (TECOS neutre ; SAVOR-TIMI 53, signal d'insuffisance cardiaque
      HR 1,27 pour la saxagliptine) et effets indésirables documentés (pemphigoïde bulleuse HR 1,42, signal
      de pancréatite) : une lecture plus prudente les écarte entièrement de la place résiduelle, là où
      HAS/SFD les y maintiennent, bien tolérées pour le reste — même socle de preuve, soupesé différemment ;
      (2) granularité EBM — l'outil ne
      durcit pas les gains hypo/poids/HbA1c en bénéfice cardio‑rénal, nomme la molécule quand la protection est
      molécule‑spécifique, et ajoute un gating négatif de terrain (IMC bas/dénutrition/infections uro) absent
      des recos en tant que règle algorithmique. L'association iSGLT2 + AR GLP‑1 = coexistence de deux
      indications (séquençage), pas synergie prouvée (bénéfice dur additif non démontré). (3) DÉPRESCRIPTION
      METFORMINE (2026-07-26, 2e série, arbitrage référent) : la HAS maintient la metformine comme socle
      quelles que soient les comorbidités ; l'outil propose désormais sa déprescription sous 3 conditions
      cumulatives strictes (sur-traitement déclaré + fragilité + tous les autres agents en cours à bénéfice
      dur démontré, cf. option dédiée et `metformine_deprescriptible`) — appui sur l'absence de bénéfice
      démontré vs placebo (Griffin 2017, Boussageon 2012 NS), déclaré comme divergence dans l'option
      elle-même, jamais présenté comme un alignement HAS/SFD/ADA.
incertitudes:
  - "Seuils de terrain (IMC 22 pour les AR GLP‑1 ; obésité 30 pour le tirzépatide) = repères pragmatiques (décision référent) : la preuve borne la direction, pas le chiffre exact."
  - "Remboursement FR « intolérance/CI metformine → monothérapie AR GLP‑1 » : CONFIRMÉ (formulaire Assurance Maladie dulaglutide/liraglutide, Art. 61 convention médicale, arrêté du 10/01/2025). Le formulaire vise dulaglutide/liraglutide ; sémaglutide/autres = formulaires propres (même logique)."
  - "Bénéfice dur de la substitution elle-même : jamais testé en switch (argument indirect = valeur comparée des classes)."
  - "Additivité iSGLT2 + AR GLP‑1 sur critères durs : non démontrée (PRECIDENTD en cours) ; additivité glycémique/pondérale acquise."
  - "Désintensification : preuve faible / accord d'experts ; pas d'ECR de devenirs durs."
  - "Chaînage inter-nœuds A→prescription : PAS de chaînage (R1, docs/decision/GRAMMAIRE-NOEUD.md) — la cible individualisée du nœud A n'est pas importée automatiquement, la position vs objectif est DÉCLARÉE ici (`position_vs_cible`), le nœud A restant une aide, jamais un prérequis ; le garde-fou < 6,5 % (`hba1c_sous_cible`) reste absolu, indépendant de la cible. Chaînage prescription→E (insuline) : hors moteur (P3+)."
  - "PRÉMISSE FAUSSE, entrée corrigée le 2026-07-27 (question du référent : « pourquoi l'intensification glycémique est-elle fermée par l'IMC > 30 ? »). Elle ne l'est PAS : aucun verrou IMC ne ferme l'intensification dans ce nœud — vérifié en faisant tourner le profil dans le moteur. Un obèse dénutri, au-dessus de sa cible, avec l'intention INTENSIFIER reçoit bien iSGLT2, gliptine et sulfamide ; seules les incrétines sont écartées, par la dénutrition, à juste titre. La sortie appauvrie [socle metformine, poursuivre] décrite par l'ancienne entrée ne survient qu'avec l'intention OPTIMISER, où la palette glycémique est fermée par l'INTENTION DÉCLARÉE (`palette_glycemique_ouverte`, séquençage référent S8) — l'IMC n'y est pour rien. Reste, si on veut, une vraie question de cohérence sans rapport avec l'obésité : que faire d'un patient déclaré au-dessus de sa cible dont le praticien déclare l'intention « optimiser » ? Le nœud lui propose alors le socle et la poursuite, ce qui est fidèle à l'intention déclarée (R1) mais peut surprendre."
  - "classes_a_benefice_indisponibles == true supprime désormais l'introduction d'iSGLT2 / AR GLP-1 / tirzépatide / association et l'intensification glycémique résiduelle (correction S3-S7, M1) : cohérent avec la niche SU/gliptine qui n'existe que lorsque ces classes sont inutilisables."
  - "Repli O11 (« pas de remplaçant protecteur pertinent ») : encodé en ALERTE A9 (2 disjonctions pur-AND, causes IMC<22 / dénutrition sans indication iSGLT2) + rappel en prose dans l'option. Couvre le cas sans indication protectrice ; ne se déclenche pas si un remplaçant serait valide."
  - "Élargir la désintensification au SOCLE (metformine, iSGLT2 sans indication d'organe), au-delà de sulfamide/glinide/insuline : demandé par le référent (recette capture 6, 2026-07-26) — PARTIELLEMENT TRANCHÉ le 2026-07-26 (2e série) pour la METFORMINE SEULE : l'arbitrage référent (« sur-traitement chez une personne fragile et tous les autres agents à bénéfice dur ») est désormais encodé (option « Déprescrire la metformine », critère `metformine_deprescriptible`). TRANCHÉ le 2026-07-27 pour l'iSGLT2 : PAS de déprescription sur le seul motif de l'absence d'indication d'organe (statu quo). Motif référent : un iSGLT2 sans indication d'organe garde un effet glycémique et un bénéfice rénal possible ; le retirer sur ce seul fondement demanderait une preuve que le dossier ne contient pas. Il ne s'allège donc que s'il pose un risque avéré — c'est l'option « Reconsidérer un agent protecteur prescrit hors indication ET posant un risque », déjà en place. Reste NON tranché : TRANCHÉ le 2026-07-27 (référent) — le comportement actuel est SUFFISANT et devient une décision assumée : un patient sur-traité qui ne réunit pas les 3 conditions relève des options d'allègement existantes (sulfamide, glinide, insuline), la metformine étant le SOCLE et donc le dernier agent qu'on retire. La séquence n'a pas besoin d'être encodée davantage : elle découle de ce qui est proposé. Conséquence sur le profil de la capture 6 (ASCVD établie + sous_objectif + intention déprescrire, sans SU/glinide/insuline en cours) : SI ce profil est aussi `fragilite == true`, il devient désormais éligible à la nouvelle option de déprescription de la metformine (en plus de la carte « Introduire un AR GLP‑1 » déjà affichée, indication transverse légitime, `:342`) ; si `fragilite == false`, son comportement reste inchangé (aucune option de désintensification applicable) — non revérifié sur la vignette exacte de la capture 6, dont le détail de `fragilite` n'est pas reproduit dans ce commentaire (invariant CLAUDE.md 6 : signaler plutôt qu'inventer)."
  - "GLINIDE SEUL (sans sulfamide) + DFG < 30 : RÉSOLU le 2026-07-26 (5e série) — l'option unique
    « Réduire la posologie du sulfamide / du glinide » a été SCINDÉE en deux, l'exclusion `DFG < 30`
    ne portant plus que sur la branche sulfamide. La vérification en source primaire
    (`docs/decision/validation/chantier-2026-07-26/rcp-glinide-insuffisance-renale.md`) établit que le
    répaglinide n'a AUCUNE contre-indication rénale au RCP (rubrique 4.3), s'élimine à > 90 % par voie
    hépatobiliaire, et que l'exposition doublée en IRC sévère (ASC ×2 entre 20 et 39 ml/min, rubrique 5.2)
    justifie une prudence posologique — c'est-à-dire précisément le geste que l'option propose. L'exclusion
    héritée retirait donc à ce patient le geste que son propre RCP recommande. RÉSIDUELS SIGNALÉS, non
    comblés : (a) le RCP est SILENCIEUX en dessous de 20 ml/min (dialyse) — l'option reste offerte, sans
    donnée pour la borner, ce que porte son `inconvenients` ; (b) aucune source de société savante
    (SFD/HAS) propre au répaglinide en IRC n'a été récupérée — le sourçage repose sur le seul RCP ;
    (c) le RCP centralisé EMA de Novonorm n'a pas pu être lu (PDF non extractible) : les deux RCP de
    génériques consultés (specid 66773421) en tiennent lieu, harmonisés par construction réglementaire."
  - "SEUIL « DFG < 30 » DU SULFAMIDE — convention, pas citation : ni le RCP du gliclazide ni celui du
    glimépiride ne donnent de valeur chiffrée de DFG ; ils disent « insuffisance rénale sévère » sans la
    définir. Le seuil de 30 utilisé ici est la convention KDIGO/SFD usuelle (stades G4-G5), une
    transposition raisonnable et non une invention — signalée pour ce qu'elle est (invariant CLAUDE.md 6).
    Un sourçage plus dur (grille HAS/SFD explicite) reste à faire si le référent le souhaite."
