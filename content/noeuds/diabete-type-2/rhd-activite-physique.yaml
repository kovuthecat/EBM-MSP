      resume: >-
        Création initiale (brouillon v0.1) depuis `rhd-collecte-activite-physique.md` (révisée après
        red-team) + `CONCEPTION-module-rhd.md` §4bis. Nœud dédié à l'axe activité physique du module RHD
        (dont sédentarité, famille pilote), remplaçant à terme le volet activité de `rhd` (non touché ici).
        Règle structurelle appliquée (mouvement, jamais cible chiffrée) ; zéro piste EBM-dur (réserve
        majeure confirmée par la collecte de preuve dédiée). 13 pistes (dont un renforcement positif
        « Poursuivre les habitudes actuelles… », condition NÉCESSAIRE du cas entièrement silencieux — pas
        un sentinel `default`, dont la conjonction à 8 axes échappait à l'échantillonnage stratifié du
        banc mécanique, vérifié par `evaluateNode` direct), 6 familles cumulables, verrou sécurité à
        l'effort (4 signes, 3 `confirmation_requise`) bloquant uniquement la pratique structurée en
        `exclusions`, hypoglycémie et déshydratation du sujet fragile en alertes de nœud (arbitrage
        référent explicite : hypoglycémie = alerte simple, pas blocage). Ajv, tsc, couches
        couverture/invariants du banc : verts. Couche caractérisation (snapshots golden-master)
        volontairement NON régénérée (chantier parallèle de refonte du dispositif) — nouveaux snapshots à
