  synthese_critique:
    donnee: >-
      Aucune revue secondaire indépendante consultée pour ce chantier ne revendique de bénéfice
      cardiovasculaire dur propre à l'exercice isolé dans le diabète de type 2 établi — position cohérente
      avec le constat de preuve retenu ici (le bénéfice cardiovasculaire dur des mesures hygiéno-diététiques
      reste porté par le régime méditerranéen, nœud sœur `rhd-alimentation`, pas par l'activité physique
      seule). Aucune synthèse dédiée spécifiquement aux gestes d'activité physique de ce nœud n'a été
      identifiée dans le corpus rassemblé pour ce chantier (signalé plutôt qu'inventé).
    references:
      - nom: "Prescrire"
        detail: "Fiche Diabète de type 2 : situe l'activité physique, avec les mesures diététiques, en 1er choix — sans revendiquer elle-même de bénéfice cardiovasculaire dur propre à l'exercice isolé."
      - nom: "Médicalement Geek / DragiWebdo"
        lien: "https://www.medicalement-geek.com/2017/12/dragi-webdo-n163.html"
        detail: "Ligne éditoriale générale (EBM francophone, anti-sur-traitement) cohérente avec la position de ce nœud, sans source spécifique rattachée à une piste précise de cet axe."
  reco_officielle:
    source: >-
      HAS — Stratégie thérapeutique du DT2 (2024, R.16/R.19/R.24/R.25/R.27/R.28) ; HAS — Guide des
      connaissances sur l'activité physique et la sédentarité (2022) ; HAS — Parcours surpoids-obésité de
      l'adulte, Fiche 5 (2023) ; Santé publique France (« 10 petites astuces anti-sédentarité »,
      « Augmenter l'activité physique », « Réduire le temps passé assis ») ; Lifestyle education in type 2
      diabetes (EBM Guidelines/Duodecim, gradé selon la section).
    position: >-
      Programme d'activité physique adaptée d'endurance et de renforcement musculaire recommandé (2-3
      séances/semaine, 3 mois renouvelables, grade AE) ; repère de volume hebdomadaire pour la population
      générale (150-300 minutes d'intensité modérée, sans volume minimal requis pour un bénéfice) ; rupture
      de la sédentarité encouragée (au moins une minute toutes les heures, grade C) ; orientation
      systématique vers les structures d'activité physique adaptée du territoire (grade AE).
    divergence: true
    explication: >-
      Les repères officiels (HAS, PNNS) s'expriment en valeurs chiffrées (minutes hebdomadaires, nombre de
      séances, nombre de pas). Ce nœud choisit délibérément de NE JAMAIS les administrer comme objectif
      chiffré au patient (décision référent, CONCEPTION-module-rhd.md §4bis-0) — administrer une cible
      reviendrait à mesurer un écart, donc un score d'adhérence, proscrit par l'invariant « aucun score
      caché » ; c'est d'ailleurs la HAS elle-même qui met en garde contre le dogme du chiffre pour le
      nombre de pas quotidien. Seconde divergence, plus profonde : contrairement au discours grand public
      qui associe volontiers activité physique et bénéfice cardiovasculaire, ce nœud affiche explicitement
      qu'aucun essai contrôlé d'exercice isolé, dans le DT2 établi, ne démontre ce bénéfice sur un critère
      dur (Look AHEAD neutre) — les repères officiels mobilisés ici enrichissent le registre des pistes
      proposées, jamais leur niveau de preuve.
incertitudes:
  - "Aucune piste de ce nœud ne porte l'étiquette « bénéfice EBM sur critère dur » — constat de l'état réel de la preuve sur cet axe (Look AHEAD neutre sur le critère cardiovasculaire primaire et sur la mortalité ; aucun ECR d'exercice isolé dans le DT2 établi ne montre de bénéfice sur critère dur), pas une lacune de cette collecte."
  - "Seuil de rupture de sédentarité : divergence documentée entre 3 sources HAS/institutionnelles pour le même geste (« au moins 1 minute toutes les heures », grade C, DT2, retenu par défaut ; « 4 à 5 minutes toutes les heures et demie », non gradée, fiche métier obésité ; « minimum 1 à 5 minutes », non gradée, avec réserve explicite d'incertitude sur la littérature internationale sous-jacente) — signalé, tranché par le référent en faveur du repère le plus bas et le mieux gradé, pas résolu au sens d'une convergence des sources."
  - "Le verrou de sécurité à l'effort bloque, par construction, l'ensemble de la famille « pratique structurée » dès qu'un signe est positif — y compris pour une neuropathie/mal perforant plantaire, dont une source HAS précise que la contre-indication porte spécifiquement sur l'activité physique des membres INFÉRIEURS (les activités des membres supérieurs restant permises). TRANCHÉ le 2026-07-27 (référent) : garder le blocage, mais RESTITUER l'information par une alerte de nœud dédiée (`neuropathie_ou_mal_perforant_plantaire == true`), qui nomme ce qui reste possible — activités des membres supérieurs, travail en décharge — et invite à orienter vers une pratique adaptée plutôt qu'à conclure à l'absence d'activité possible. La distinction membres supérieurs/inférieurs n'est toujours PAS modélisée dans les options (le nœud ne recueille pas de quoi qualifier chaque piste par segment corporel, et le faire coûterait un critère de plus pour une situation peu fréquente) : le choix est donc de dire, plutôt que de filtrer. Alerte de NŒUD et non d'option, délibérément — une alerte d'option ne serait jamais rendue, l'option étant précisément exclue."
  - "G1 (évaluation médicale avant intensité si inactif/facteur de risque cardiovasculaire) et G7 (glycémie avant l'effort, seuil de vigilance 2,5 g/L) sont portés par une alerte D'OPTION sur « Envisager un programme d'activité physique adaptée », pas par des critères d'entrée collectés : ce sont des rappels de bonne pratique et d'auto-surveillance ponctuelle, pas des données chroniques du patient."
  - "L'hypoglycémie sous insuline/sulfamide/glinide reste une alerte simple (jamais un blocage) : arbitrage référent explicite qui tranche le point laissé ouvert par le red-team des collectes (finding B-3) — le mécanisme visé ici (hypoglycémie À L'EFFORT) est cliniquement distinct de celui déjà arbitré côté alimentation (hypoglycémie par restriction des apports), les deux nœuds convergent malgré tout vers le même canal (alerte, pas exclusion)."
  - "PLAFOND D'AFFICHAGE — RÉSOLU le 2026-07-27 (décision référent). La dette était consignée à l'identique dans les DEUX nœuds RHD : le rang (`priorite`) était déclaré dans le contenu mais l'écran affichait tout à plat, si bien que le rang n'était jamais vu. L'écran REPLIE désormais les pistes au-delà du meilleur rang derrière un bouton « Autres pistes possibles (N) » (`lib/replierAffichage.ts`, testé à part). CE QUE CE N'EST PAS : un plafond. Rien n'est retiré ni filtré — la partition conserve exactement les options d'entrée, le bouton porte leur nombre exact, et un clic les rend. Trois cas ne replient délibérément rien : moins de 4 options applicables (écran non encombré), aucun rang défini (nœud en `ordered-first-match`, où `priorite` est ignoré par D11), et toutes les options au même rang (le contenu les déclare équivalentes ; en cacher une partie inventerait une hiérarchie qu'il ne pose pas). Une option sans rang est traitée comme prioritaire : le doute ne cache jamais."
  - "« Poursuivre les habitudes actuelles… » n'est pas un sentinel `default` : sa condition (2-3×/semaine ET rupture de sédentarité déjà habituelle) est un sous-ensemble NÉCESSAIRE, mais pas exactement équivalent, du cas où les 8 axes de recueil sont tous favorables — elle peut donc aussi s'afficher (à raison, cumulée à d'autres pistes) chez un patient favorable sur ces deux seuls axes sans l'être sur tous les autres. Choix assumé, même logique que le nœud sœur `rhd-alimentation`."
  - "TRANCHÉ le 2026-07-27 (référent) : PAS de nommage de structures dans le contenu clinique. La piste GÉNÉRIQUE existe déjà (« Orienter vers une structure d'activité physique adaptée… », déclenchée par une limitation physique, une difficulté d'accès ou une offre de proximité inconnue) et suffit — le praticien connaît son secteur. Aucun code n'a donc été nécessaire. Décision de fond : nommer des structures figerait dans un nœud clinique des données qui vieillissent et créerait une dépendance à `annuaire-msp` ; si un annuaire arrive, il sera consommé par l'écran, jamais recopié dans le contenu."
