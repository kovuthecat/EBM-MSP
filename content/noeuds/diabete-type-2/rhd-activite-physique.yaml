# Module RHD — nœud ACTIVITÉ PHYSIQUE — BROUILLON v0.1 (2026-07-26), pas encore validé référent.
# Autorité : docs/decision/validation/chantier-2026-07-26/CONCEPTION-module-rhd.md (structure, décisions
# référent §4bis) + rhd-collecte-activite-physique.md (grille + bibliothèque de pistes, révisée après
# red-team) + redteam-collectes-rhd.md.
#
# REMPLACE, À TERME, LE VOLET ACTIVITÉ DU NŒUD `rhd` (perte de poids/rémission, en cours de bascule —
# `rhd.yaml` n'est PAS modifié ici, un agent parallèle y travaille sur ses `sources`). Ce nœud ne traite
# QUE l'axe activité physique (dont sédentarité, famille de pistes pilote à l'intérieur de ce nœud,
# décision référent — extractible en nœud distinct plus tard si le volume le justifie) ; l'objectif de
# perte de poids/rémission reste porté par `rhd`.
#
# ⚠ RÉSERVE MAJEURE, confirmée par une passe de preuve dédiée et son red-team (`preuve-activite-physique.md`
# cité par CONCEPTION-module-rhd.md §3, `H-rhd.md` §3 sous-dossier H3, `rhd-collecte-activite-physique.md`
# §0/P3) : AUCUNE piste de ce nœud ne porte l'étiquette « bénéfice EBM sur critère dur ». Aucun ECR
# d'exercice isolé, dans le DT2 établi, ne démontre de bénéfice sur un critère cardiovasculaire ou de
# mortalité (Look AHEAD : critère CV primaire neutre HR 0,95, essai arrêté pour futilité ; mortalité non
# réduite ; le bras exercice seul de Da Qing n'est pas significatif). Le seul bénéfice CV dur des mesures
# hygiéno-diététiques est porté par le régime méditerranéen (nœud sœur `rhd-alimentation`), pas par
# l'activité physique isolée. Le corpus HAS/PNNS mobilisé ci-dessous enrichit le REGISTRE officiel des
# pistes, PAS leur niveau de preuve — toutes les options portent donc l'étiquette « recommandation
# officielle » ou « savoir-faire (non EBM) ».
#
# RÈGLE STRUCTURELLE (référent 2026-07-26, CONCEPTION-module-rhd.md §4bis-0/§0, prioritaire) : le nœud
# SUGGÈRE des pistes pour se rapprocher de la régularité démontrée prédictive (EBM Guidelines/Duodecim,
# grade A : « l'activité physique régulière prédit un bon résultat à long terme, pas la perte de poids
# rapide au début ») — il ne propose JAMAIS de cible chiffrée (150 min/sem., 10 000 pas). Conséquences :
#   1. Le recueil porte sur une FRÉQUENCE/DURÉE DÉCLARÉE en BANDES, jamais une quantité comparée à un
#      seuil précis.
#   2. Aucune piste n'affiche de valeur à atteindre : les repères chiffrés officiels (150-300 min/sem.,
#      2-3 séances d'APA/sem., + 1 000-3 000 pas/sem.) vivent en CONTEXTE (avantages/argumentaire),
#      jamais dans le geste proposé. La HAS elle-même déconseille le dogme du chiffre pour le pas
#      quotidien (« proposer d'augmenter progressivement… chaque pas en plus est bénéfique ») — c'est la
#      meilleure illustration trouvée du principe « mouvement, pas cible », reprise en piste dédiée.
#   3. Aucun score d'adhérence.
#   4. Le rang d'une piste (`priorite`) est déclaré : 1 = renforcement positif du patient déjà actif et
#      rupture de sédentarité (repère le plus bas, le mieux gradé, le plus atteignable) ; au-delà =
#      activité quotidienne puis pratique structurée (accompagnement, effort de mise en œuvre plus élevé).
#
# GARDE-FOUS — DES `exclusions`, PAS DES ALERTES (D21), ancrés HAS DT2 R.19/R.27/R.28 : le verrou
# « sécurité à l'effort » (`verrou_effort`, dérivé de 4 signes, tous `presomption_non` ABSENT — D30/T-018,
# P4/S1 : ce sont exactement les 4 signes qui gardent l'exclusion de la famille « pratique structurée »,
# donc jamais éligibles à une présomption de « non » — limitation physique connue, symptômes d'ischémie à
# l'effort, rétinopathie non stabilisée/proliférante, neuropathie périphérique/mal perforant plantaire)
# bloque UNIQUEMENT la montée d'intensité/pratique
# structurée (décision de bucketing du référent, CONCEPTION-module-rhd.md §4) ; il laisse passer
# l'activité quotidienne, les déplacements actifs et la rupture de sédentarité. L'hypoglycémie sous
# insuline/sulfamide/glinide reste une ALERTE simple, jamais un blocage (arbitrage référent explicite,
# tranchant le point laissé ouvert par le red-team, finding B-3).
#
# SÉDENTARITÉ — seuil de rupture retenu : REPÈRE (pas un seuil administré) « au moins 1 minute par heure »
# (HAS DT2 R.16, grade C — le plus bas des seuils voisins, le mieux gradé, le plus atteignable ; une
# source HAS parallèle juge par ailleurs les preuves insuffisantes sur ce chiffre précis, signalé en
# argumentaire).
#
# TERRAIN PARTAGÉ (I4) : `fragilite` et `traitements_en_cours` sont déclarés IDENTIQUES au reste du
# domaine et au nœud sœur `rhd-alimentation` (mêmes noms, même type, même énumération). `age`/
# `esperance_vie` NE SONT PAS déclarés ici : aucune règle de ce nœud ne les rend décisifs (R5).
#
# PORTÉE VOLONTAIREMENT RÉDUITE vs la collecte (R5, charge de saisie) : S7 (goûts/préférence d'activité)
# NON repris — la source elle-même le décrit comme une aide à la négociation qui « ne bloque rien »,
# donc jamais décisif ; la conversation directe en consultation y pourvoit (même traitement que la
# culture culinaire du nœud sœur `rhd-alimentation`). AA5/AA6 (vécu négatif, peur de se blesser, crainte
# des moqueries) FUSIONNÉS en un seul critère (`experience_activite_negative`) : les deux alimentaient la
# même piste unique (5.2), une distinction plus fine n'aurait rien changé au geste proposé. G1
# (évaluation médicale avant intensité si inactif/FDR CV) et G7 (glycémie avant l'effort, seuil 2,5 g/L)
# NE SONT PAS des critères d'entrée : ce sont des rappels attachés à l'option « pratique structurée »
# (alerte d'option), pas des données chroniques à recueillir — G7 est un repère d'auto-surveillance
# ponctuel du patient, pas une donnée que le praticien saisit dans ce nœud.
id: rhd-activite-physique
domaine: diabete-type-2
module: RHD
titre: "Activité physique — se rapprocher de la régularité"
population_cible: >-
  Adulte DT2, en consultation de médecine générale. Nœud du module RHD (axe activité physique, y compris
  sédentarité) : recueil bref des habitudes de pratique, de déplacement et de sédentarité, puis pistes
  concrètes et négociables de rapprochement de la régularité — jamais un objectif chiffré à atteindre,
  jamais un score d'adhérence. Autonome : évaluable seul, sans prérequis d'un autre nœud (R1). Hors
  périmètre : objectif de perte de poids et rémission (aucun nœud ne les porte à ce jour) ; bilan
  d'aptitude physique détaillé (endurance cardiorespiratoire, force, souplesse — évaluation professionnelle
  d'un enseignant en activité physique adaptée) ; questionnaire structuré (GPAQ, ONAPS — aucun repris ici).
selection: multi-options
argumentaire_exhaustif: "rhd-activite-physique.argumentaire.md"
familles:
  - libelle: "Déplacements actifs"
    exclusive: false
  - libelle: "Rupture de sédentarité"
    exclusive: false
  - libelle: "Activité quotidienne"
    exclusive: false
  - libelle: "Pratique structurée"
    exclusive: false
  - libelle: "Orientation vers une ressource"
    exclusive: false
  - libelle: "Maintien"
    exclusive: false
criteres_entree:
  # ── Terrain partagé (I4 : identique à rhd.yaml/prescription.yaml/insuline.yaml/rhd-alimentation.yaml) ──
  - nom: fragilite
    type: bool
    groupe: Terrain
  - nom: traitements_en_cours
    type: liste
    groupe: Terrain
    valeurs: [metformine, iSGLT2, aGLP1, tirzepatide, sulfamide, gliptine, insuline_basale, insuline_rapide, glinide]
    # T-018 (P4/S1, D30) : éligible mécaniquement à presomption_non SUR CE NŒUD (ne participe ici à
    # aucune condition d'option `role: securite` ni à aucune `exclusions` — seulement une `alerte` de
    # nœud, canal distinct). Déjà connu DIVERGENT entre nœuds (`engine/banc/coherence-inter-noeuds.test.ts`
    # — `valeurs` différentes sur `insuline`) : sur `prescription`, ce même nom NE reçoit PAS
    # presomption_non (il y gate plusieurs options `role: securite` et exclusions rénales/cétose).
    presomption_non: true
  # ── Socle — habitudes d'activité physique (S1-S5) ──
  - nom: frequence_activite_structuree
    type: enum
    groupe: Habitudes d'activité physique
    valeurs: [jamais, une_fois_semaine, deux_a_trois_fois_semaine, quatre_fois_ou_plus_semaine]
  - nom: duree_seance
    type: enum
    groupe: Habitudes d'activité physique
    valeurs: [moins_10_min, dix_a_trente_min, plus_30_min]
  - nom: mode_deplacement_courts_trajets
    type: enum
    groupe: Habitudes d'activité physique
    valeurs: [actif_pied_ou_velo, motorise_ou_assis, mixte]
  - nom: temps_assis_quotidien
    type: enum
    groupe: Habitudes d'activité physique
    valeurs: [moins_4h, quatre_a_huit_h, plus_8h]
  - nom: rupture_sedentarite_habituelle
    type: bool
    groupe: Habitudes d'activité physique
    # T-018 (P4/S1, D30) — RETIRÉ après vérification empirique par I21 (`engine/banc/vierge.test.ts`,
    # T-019) : ce critère satisfait la lecture LITTÉRALE de l'étape 4 (aucune condition d'option
    # `role: securite`, aucune `exclusions`), mais I21 a montré que le poser reproduisait EXACTEMENT le
    # défaut D-01 de la recette navigateur du 2026-07-28 (4 cartes « Recommandée » sur un formulaire
    # vierge) — ce critère est lu comme `rupture_sedentarite_habituelle == false` dans une disjonction
    # `OR` de 3 options « geste » (« Se lever et bouger… », « S'appuyer sur un repère… », « Transformer
    # une pause… ») : présumé « non » (donc « false »), ce terme devient VRAI À LUI SEUL et suffit à
    # rendre les 3 options applicables sans qu'aucune autre donnée n'ait été saisie. La lecture littérale
    # de l'étape 4 (role: securite + exclusions) ne suffit donc pas à garantir « l'absence de réponse ne
    # peut pas nuire » quand le défaut du critère sert de DÉCLENCHEUR positif d'un `OR` plutôt que d'un
    # simple repli neutre — I21 est l'arbitre empirique final, cf. rapport de tâche T-018.
  # ── Verrou — sécurité à l'effort (S6 + G2/G4/G5, HAS R.19/R.27/R.28). Bloque UNIQUEMENT la pratique
  #    structurée (décision de bucketing du référent) ; laisse passer déplacements actifs, activité
  #    quotidienne et rupture de sédentarité. Chaque signe garde `presomption_non` ABSENT — aucun des
  #    quatre n'est éligible mécaniquement (T-018, P4/S1) : ils gardent tous l'exclusion de la famille
  #    « pratique structurée » (cf. `verrou_effort` ci-dessous et l'option qu'il exclut). Avant D30, ces
  #    quatre portaient `confirmation_requise: true` (même effet : indéterminé tant que non répondu) ; le
  #    renommage D30 inverse le SENS du champ (une déclaration positive présume désormais le « non », pas
  #    l'inverse), donc ils PERDENT le champ plutôt que de le porter sous le nouveau nom. ──
  - nom: limitation_physique_connue
    type: bool
    groupe: Sécurité à l'effort
  - nom: symptomes_ischemie_effort
    type: bool
    groupe: Sécurité à l'effort
  - nom: retinopathie_non_stabilisee_ou_proliferante
    type: bool
    groupe: Sécurité à l'effort
  - nom: neuropathie_ou_mal_perforant_plantaire
    type: bool
    groupe: Sécurité à l'effort
  - nom: verrou_effort
    type: bool
    groupe: Sécurité à l'effort
    derive: >-
      limitation_physique_connue == true OR symptomes_ischemie_effort == true
      OR retinopathie_non_stabilisee_ou_proliferante == true OR neuropathie_ou_mal_perforant_plantaire == true
  # ── Approfondissement (décisifs uniquement, R5) ──
  # T-018 (P4/S1, D30) : éligible mécaniquement à presomption_non (aucune condition d'option
  # `role: securite`, aucune `exclusions` de ce nœud) — et vérifié par I21 (`engine/banc/vierge.test.ts`,
  # T-019) : sa seule lecture (« Orienter vers une structure… », condition `limitation_physique_connue ==
  # true OR difficulte_acces_activite == true OR offre_proximite_connue == false ») l'utilise comme
  # déclencheur POSITIF (`== true`) — présumé « non », ce terme reste FAUX et ne peut jamais, à lui seul,
  # rendre l'option applicable sur un formulaire vierge.
  - nom: difficulte_acces_activite
    type: bool
    groupe: Approfondissement (si besoin)
    presomption_non: true
  - nom: offre_proximite_connue
    type: bool
    groupe: Approfondissement (si besoin)
    # T-018 (P4/S1, D30) — RETIRÉ après vérification empirique par I21 (`engine/banc/vierge.test.ts`,
    # T-019) : satisfait la lecture littérale de l'étape 4, mais sa seule lecture (« Orienter vers une
    # structure… ») le cite `OR offre_proximite_connue == false` — présumé « non » (donc `false`), ce
    # terme devient VRAI À LUI SEUL et rend l'option applicable sur un formulaire vierge (même famille de
    # défaut D-01 que `rupture_sedentarite_habituelle` ci-dessus). I21 est l'arbitre empirique final.
  - nom: experience_activite_negative
    type: bool
    groupe: Approfondissement (si besoin)
    # T-018 (P4/S1, D30) : éligible mécaniquement à presomption_non, vérifié par I21 — sa seule lecture
    # (« Proposer un bilan avec un enseignant en activité physique adaptée… ») l'utilise comme
    # déclencheur POSITIF (`experience_activite_negative == true`), jamais comme terme `== false` : présumé
    # « non », le terme reste FAUX, sans risque de rendre l'option applicable à tort.
    presomption_non: true
options:
  # ═══════════ FAMILLE DÉPLACEMENTS ACTIFS ═══════════
  - intitule: "Remplacer un trajet motorisé par la marche ou le vélo, une à deux fois par semaine"
    role: geste
    conditions:
      - "mode_deplacement_courts_trajets == motorise_ou_assis"
    priorite: 5
    famille: "Déplacements actifs"
    avantages:
      - "Provenance : savoir-faire (non EBM). Rapproche de l'activité intégrée aux déplacements quotidiens, sans passer par une pratique structurée — un trajet à la fois, sans viser l'exhaustivité."
    inconvenients:
      - "Extrapolation raisonnée d'un principe général (l'activité dans les déplacements quotidiens compte) plutôt qu'un essai contrôlé testant spécifiquement ce report modal."
    effet_attendu: "Non chiffrable pour ce geste isolé — contribue au volume d'activité quotidienne."
    niveau_preuve: faible
  - intitule: "Pour les courses, préférer plusieurs petits déplacements actifs à un grand trajet motorisé"
    role: geste
    conditions:
      - "mode_deplacement_courts_trajets == motorise_ou_assis"
    priorite: 5
    famille: "Déplacements actifs"
    avantages:
      - "Provenance : recommandation officielle. Multiplie les occasions de bouger dans la semaine plutôt qu'une seule sortie motorisée — repère concret de Santé publique France, cohérent avec l'incitation à la marche, au vélo ou à la trottinette dans les activités quotidiennes."
    inconvenients:
      - "Dépend de la proximité réelle des commerces — à négocier selon le contexte du patient."
    effet_attendu: "Non chiffrable pour ce geste isolé — contribue au volume d'activité quotidienne."
    niveau_preuve: faible
  # ═══════════ FAMILLE RUPTURE DE SÉDENTARITÉ ═══════════
  - intitule: "Se lever et bouger quelques minutes à chaque heure de position assise prolongée"
    role: geste
    conditions:
      - "temps_assis_quotidien == quatre_a_huit_h OR temps_assis_quotidien == plus_8h OR rupture_sedentarite_habituelle == false"
    priorite: 2
    famille: "Rupture de sédentarité"
    avantages:
      - "Provenance : recommandation officielle. Réduit le temps de sédentarité continue — repère HAS DT2 (« au moins une minute toutes les heures », le plus atteignable des seuils voisins, cf. argumentaire pour la nuance de gradation)."
      - "Formulé à chaque pause ou changement de tâche plutôt qu'en objectif abstrait de « moins s'asseoir »."
    inconvenients:
      - "Le chiffre d'une minute par heure est un REPÈRE, pas un seuil validé par un essai contrôlé dédié — une source HAS parallèle juge d'ailleurs les preuves encore insuffisantes sur ce point précis (signalé en argumentaire, sans en changer le statut gradé de la source retenue)."
    effet_attendu: "Réduit le temps de sédentarité continue ; non chiffrable pour ce geste isolé."
    niveau_preuve: faible
  - intitule: "S'appuyer sur un repère du quotidien pour penser à se lever (téléphone hors de portée, appel pris en marchant)"
    role: geste
    conditions:
      - "temps_assis_quotidien == quatre_a_huit_h OR temps_assis_quotidien == plus_8h OR rupture_sedentarite_habituelle == false"
    priorite: 3
    famille: "Rupture de sédentarité"
    avantages:
      - "Provenance : recommandation officielle. Donne un déclencheur concret et mémorisable à la rupture de sédentarité, plutôt qu'une intention abstraite — repère de Santé publique France (astuces anti-sédentarité)."
    inconvenients:
      - "Formulé initialement pour le télétravail dans la source ; généralisé ici à toute activité assise prolongée (bureau, écrans) — signalé en argumentaire."
    effet_attendu: "Non chiffrable pour ce geste isolé."
    niveau_preuve: faible
  - intitule: "Transformer une pause déjà prise dans la journée en occasion de bouger quelques instants"
    role: geste
    conditions:
      - "temps_assis_quotidien == quatre_a_huit_h OR temps_assis_quotidien == plus_8h OR rupture_sedentarite_habituelle == false"
    priorite: 3
    famille: "Rupture de sédentarité"
    avantages:
      - "Provenance : recommandation officielle. Rattache la rupture de sédentarité à un moment déjà existant (pause café, changement de dossier) plutôt qu'à un nouvel effort à programmer — repère de Santé publique France."
    inconvenients:
      - "Extrapolation d'un principe général : aucun essai contrôlé dédié à cette tactique spécifique."
    effet_attendu: "Non chiffrable pour ce geste isolé."
    niveau_preuve: faible
  # ═══════════ FAMILLE ACTIVITÉ QUOTIDIENNE ═══════════
  - intitule: "Intégrer du mouvement dans les tâches déjà présentes dans la journée (escaliers, ménage, jardinage, courses portées)"
    role: geste
    conditions:
      - "frequence_activite_structuree == jamais OR frequence_activite_structuree == une_fois_semaine"
    priorite: 2
    famille: "Activité quotidienne"
    avantages:
      - "Provenance : recommandation officielle. Contribue au volume global d'activité recommandée sans nécessiter de pratique structurée — un guide EBM européen (grade A, triple référence) considère que cela contribue autant qu'une séance planifiée à la gestion du poids et de la dépense énergétique (un critère de SUBSTITUTION, pas un critère cardiovasculaire dur)."
    inconvenients:
      - "Le bénéfice porte sur la gestion du poids et de la dépense énergétique, pas sur un critère cardiovasculaire dur (voir la réserve majeure de ce nœud, en tête de fichier)."
    effet_attendu: "Contribue au volume d'activité quotidienne recommandée ; effet propre non chiffrable."
    niveau_preuve: modere
    references:
      - has-guide-ap
      - spf-antisedentarite
  - intitule: "Répartir l'activité en plusieurs séances courtes dans la journée plutôt qu'une seule longue"
    role: geste
    conditions:
      - "duree_seance == moins_10_min"
    priorite: 3
    famille: "Activité quotidienne"
    avantages:
      - "Provenance : recommandation officielle. Lève l'obstacle « pas le temps » : un guide EBM européen indique que plusieurs périodes courtes d'exercice donnent presque le même bénéfice qu'une période plus longue."
      - "Cohérent avec le repère officiel : il n'y a pas de volume minimal en dessous duquel il n'y a aucun bénéfice, et une période même inférieure à 10 minutes compte dans le calcul."
    inconvenients:
      - "Repère de composition d'un programme, pas un essai contrôlé comparant directement les deux modalités sur un critère dur."
    effet_attendu: "Non chiffrable pour ce geste isolé — lève un obstacle pratique à la régularité."
    niveau_preuve: modere
    references:
      - has-guide-ap
      - duodecim-ap
  - intitule: "Suivre son nombre de pas et chercher à en faire un peu plus que la semaine précédente"
    role: geste
    conditions:
      - "frequence_activite_structuree == jamais OR frequence_activite_structuree == une_fois_semaine"
    priorite: 2
    famille: "Activité quotidienne"
    avantages:
      - "Provenance : recommandation officielle. C'est la HAS elle-même qui déconseille d'ériger un chiffre de pas quotidien en dogme et invite à proposer une progression graduelle plutôt qu'un total précis (« chaque pas en plus est bénéfique ») — la meilleure illustration trouvée du principe « mouvement, pas cible » retenu par ce module."
    inconvenients:
      - "Repère de bonne pratique (guide de connaissances HAS), pas un essai contrôlé randomisant un objectif de pas contre un autre."
    effet_attendu: "Rapproche du volume de marche quotidienne recommandé, par une progression auto-mesurée sans seuil fixé ; non chiffrable pour ce geste isolé."
    niveau_preuve: faible
  # ═══════════ FAMILLE PRATIQUE STRUCTURÉE (verrou sécurité) ═══════════
  - intitule: "Envisager un programme d'activité physique adaptée (endurance et renforcement), avec l'accompagnement d'un professionnel"
    role: geste
    conditions:
      - "frequence_activite_structuree == jamais OR frequence_activite_structuree == une_fois_semaine"
    exclusions:
      - "verrou_effort == true"
    priorite: 4
    famille: "Pratique structurée"
    alertes:
      - quand: "default"
        niveau: info
        message: >-
          Une évaluation médicale minimale est recommandée avant de commencer ou d'augmenter une activité
          physique d'intensité au moins modérée, en particulier si le patient est actuellement inactif ou
          porteur d'un facteur de risque cardiovasculaire (HAS R.19). Avant l'effort, une glycémie très
          élevée (seuil de vigilance cité par la HAS : 2,5 g/L) expose à une instabilité glycémique — à
          vérifier par le patient lui-même, pas une donnée à recueillir dans ce nœud (HAS R.28).
    avantages:
      - "Provenance : recommandation officielle. Rapproche de la structure d'un programme recommandé (endurance et renforcement musculaire, encadrement) — une reprise cadrée plutôt qu'une reprise seule et non structurée."
      - "L'activité physique adaptée est une prise en charge réglementée (article D. 1172-1 du code de la santé publique), dispensée par un professionnel formé."
    inconvenients:
      - "Réservée par construction aux patients sans contre-indication à l'effort connue (voir le verrou de sécurité) ; nécessite un accompagnement, donc un délai et une disponibilité de l'offre locale."
    effet_attendu: >-
      Rapproche de la structure d'un programme d'activité physique adaptée recommandé (endurance +
      renforcement musculaire) ; effet propre de ce geste isolé sur un critère dur non démontré (voir la
      réserve majeure de ce nœud).
    niveau_preuve: faible
  - intitule: "Maintenir la pratique actuelle ; envisager de diversifier (endurance et renforcement)"
    role: geste
    conditions:
      - "frequence_activite_structuree == quatre_fois_ou_plus_semaine AND rupture_sedentarite_habituelle == true"
    priorite: 1
    famille: "Pratique structurée"
    avantages:
      - "Provenance : recommandation officielle. La régularité de l'activité physique est le repère le mieux établi comme prédicteur d'un bon résultat à long terme — mieux que la perte de poids rapide en début de prise en charge (guide EBM européen, grade A)."
      - "Reformulation en « maintenir/renforcer » plutôt qu'« améliorer » : évite le conseil condescendant à un patient qui fait déjà l'effort — s'il n'associe pas encore endurance et renforcement musculaire, en discuter la diversification."
    inconvenients:
      - "Pas de bénéfice cardiovasculaire dur propre à l'exercice à revendiquer (voir la réserve majeure de ce nœud) : le bénéfice mis en avant ici est la régularité elle-même, un facteur prédictif, pas un événement évité."
    effet_attendu: "Non chiffrable — renforcement positif d'une pratique déjà régulière."
    niveau_preuve: modere
    references:
      - has-dt2-ap
      - duodecim-ap
  # ═══════════ FAMILLE ORIENTATION VERS UNE RESSOURCE ═══════════
  - intitule: "Orienter vers une structure d'activité physique adaptée pour un bilan et un accompagnement progressif"
    role: geste
    conditions:
      - "limitation_physique_connue == true OR difficulte_acces_activite == true OR offre_proximite_connue == false"
    priorite:
      - quand: "limitation_physique_connue == true"
        rang: 1
      - quand: "default"
        rang: 5
    famille: "Orientation vers une ressource"
    avantages:
      - "Provenance : recommandation officielle. Lève l'obstacle d'accès, de compétence ou de sécurité identifié en socle/approfondissement : tout professionnel de santé en contact avec un patient DT2 doit se renseigner sur les structures d'orientation existantes sur son territoire (maison sport-santé, enseignant en activité physique adaptée)."
    inconvenients:
      - "Le contenu précis de l'offre locale n'est pas détaillé par ce nœud (aucun annuaire de structures mobilisé ici) ; dépend de la disponibilité réelle de la ressource."
    effet_attendu: "Non chiffrable — orientation, pas un geste d'activité physique en soi."
    niveau_preuve: faible
  - intitule: "Proposer un bilan avec un enseignant en activité physique adaptée avant toute reprise"
    role: geste
    conditions:
      - "experience_activite_negative == true"
    priorite: 2
    famille: "Orientation vers une ressource"
    avantages:
      - "Provenance : recommandation officielle. Sécurise et débloque une reprise freinée par un vécu négatif (expérience difficile, peur de se blesser, crainte du regard des autres), en co-construisant un projet tenant compte des craintes et des capacités exprimées — jamais une prescription d'intensité d'emblée."
      - "Associer la notion de plaisir et de bien-être à la pratique est un préalable à l'adoption d'habitudes actives durables (guide HAS parcours surpoids-obésité)."
    inconvenients:
      - "Nécessite une orientation et un délai avant la reprise effective."
    effet_attendu: "Non chiffrable — bilan préalable, pas un geste d'activité physique en soi."
    niveau_preuve: faible
  # ═══════════ FAMILLE MAINTIEN ═══════════
  # Volontairement PAS un sentinel `["default"]` : preuve directe (evaluateNode, profil construit à la
  # main) que la conjonction complète des 8 axes de recueil simultanément favorables existe et doit
  # recevoir une réponse (patient déjà actif 2-3×/sem, actif dans ses trajets, peu sédentaire, sans
  # contre-indication ni vécu négatif — proche du profil « B » de la recette), mais qu'un sentinel
  # `["default"]` échoue à couvrir dans le banc mécanique (couverture.test.ts) : la conjonction est trop
  # étroite pour l'échantillonnage stratifié indépendant sur 1520 profils. Condition ci-dessous : un
  # SOUS-ENSEMBLE NÉCESSAIRE et démontré du cas muet complet — `frequence_activite_structuree ==
  # deux_a_trois_fois_semaine` est la SEULE valeur qui, combinée à `rupture_sedentarite_habituelle ==
  # true`, laisse à la fois « Intégrer du mouvement… »/« Suivre ses pas » silencieuses (qui exigent jamais/
  # 1×/sem) ET « Maintenir/diversifier » silencieuse (qui exige 4×/sem ou plus) ET « Se lever et bouger… »
  # silencieuse (qui exige `rupture_sedentarite_habituelle == false` sur l'un de ses termes) — donc
  # nécessairement vraie dès que le cas muet complet se produit. Indépendamment plus fréquente (se
  # déclenche dès que ces deux marqueurs sont favorables, cumulable avec d'autres pistes par ailleurs).
  - intitule: "Poursuivre les habitudes actuelles et rester attentif à la régularité"
    role: geste
    conditions:
      - "frequence_activite_structuree == deux_a_trois_fois_semaine AND rupture_sedentarite_habituelle == true"
    famille: "Maintien"
    avantages:
      - "Provenance : recommandation officielle. Vous pratiquez déjà une activité physique 2 à 3 fois par semaine et rompez déjà régulièrement les périodes assises : la régularité de l'activité physique est le repère le mieux établi comme prédicteur d'un bon résultat à long terme (guide EBM européen, grade A) — la maintenir est déjà la bonne direction."
    inconvenients:
      - "Ne signifie pas qu'aucune marge de progression n'existe sur d'autres axes : cette piste peut s'afficher en même temps que d'autres suggestions, elle ne les remplace pas."
    effet_attendu: "Non chiffrable — renforcement positif d'une situation déjà favorable sur ces deux axes."
    niveau_preuve: faible
alertes:
  # DÉCISION RÉFÉRENT 2026-07-27 : le verrou d'effort retire toute la famille « pratique structurée » dès
  # qu'un signe est positif — y compris pour une neuropathie / un mal perforant plantaire, alors que la
  # source HAS restreint la contre-indication aux membres INFÉRIEURS. Arbitrage : garder le blocage
  # (le nœud ne recueille pas de quoi qualifier chaque piste par segment corporel) mais RESTITUER
  # l'information par une alerte, pour qu'un patient neuropathe ne reparte pas sans aucune piste.
  # Alerte de NŒUD et non d'option (D21) : elle doit s'afficher précisément quand l'option a disparu —
  # une alerte d'option ne serait jamais rendue, l'option étant exclue.
  - quand: "neuropathie_ou_mal_perforant_plantaire == true"
    niveau: attention
    message: >-
      Neuropathie périphérique ou mal perforant plantaire : la source HAS restreint la limitation aux
      activités en CHARGE des membres inférieurs (marche prolongée, course) — les activités sollicitant
      les membres supérieurs et le travail en décharge (vélo assis, activités en position assise,
      renforcement du haut du corps, activités aquatiques après avis podologique) restent possibles.
      L'outil retire ici la famille « pratique structurée » dans son ensemble, faute de recueillir de quoi
      distinguer les pistes par segment corporel : orienter vers une pratique adaptée plutôt que de
      conclure à l'absence d'activité possible. Surveillance podologique et chaussage adaptés dans tous
      les cas.
  - quand: "traitements_en_cours contient insuline_basale OR traitements_en_cours contient insuline_rapide OR traitements_en_cours contient sulfamide OR traitements_en_cours contient glinide"
    niveau: attention
    message: >-
      Sous insuline, sulfamide ou glinide, toute augmentation de la dépense énergétique majore le risque
      d'hypoglycémie À L'EFFORT : signaler le risque au patient (resucrage à disposition, autosurveillance
      autour de l'effort) — arbitrage référent : alerte simple, pas un blocage des pistes proposées.
  - quand: "fragilite == true"
    niveau: attention
    message: >-
      Sujet fragile : éviter les activités physiques prolongées par forte chaleur, favoriser l'hydratation
      même en l'absence de sensation de soif, et éviter les activités de renforcement musculaire de forte
      intensité en ambiance chaude (HAS, guide des connaissances sur l'activité physique et la sédentarité).
argumentaire: >
  Sur l'axe activité physique, aucun essai contrôlé randomisé d'exercice isolé, dans le diabète de type 2
  établi, ne démontre de bénéfice sur un critère cardiovasculaire ou de mortalité (Look AHEAD : critère
  cardiovasculaire primaire neutre, HR 0,95, essai arrêté pour futilité ; mortalité toutes causes non
  réduite ; le bras exercice seul de Da Qing n'atteint pas la significativité) — le seul bénéfice
  cardiovasculaire DUR des mesures hygiéno-diététiques est porté par le régime méditerranéen (nœud sœur
  `rhd-alimentation`), pas par l'activité physique isolée. C'est un constat de l'état réel de la preuve sur
  cet axe, pas une lacune de ce nœud, et il ne doit pas être édulcoré : aucune piste ci-dessous ne porte
  l'étiquette « bénéfice EBM sur critère dur ». La cible EBM la mieux étayée n'est d'ailleurs pas un chiffre
  de fréquence ou de durée, mais un principe de prédiction (guide EBM européen, grade A) : l'activité
  physique RÉGULIÈRE prédit un bon résultat à long terme, davantage que l'intensité ou la perte de poids
  initiale — c'est cette régularité, plus qu'un volume, que le recueil et les pistes cherchent à faire
  progresser. Les repères chiffrés officiels (150-300 minutes hebdomadaires d'intensité modérée, sans
  volume minimal en dessous duquel il n'y aurait aucun bénéfice, fractionnement possible y compris en
  périodes de moins de 10 minutes ; 2-3 séances d'activité physique adaptée par semaine ; progression de
  1 000 à 3 000 pas hebdomadaires plutôt qu'un objectif de 10 000 pas érigé en dogme, formule de la HAS
  elle-même) ne figurent dans aucune piste : ils vivent en contexte, jamais comme cible affichée au
  patient — la HAS fournit ici la meilleure illustration trouvée du principe « chaque petit pas compte »
  qui gouverne ce module. Les pistes sont organisées en six familles cumulables : déplacements actifs,
  rupture de sédentarité (seuil retenu comme repère : au moins une minute toutes les heures, HAS DT2 grade
  C — le plus bas des seuils voisins, le mieux gradé, le plus atteignable ; une source HAS parallèle
  internationale juge par ailleurs les preuves encore insuffisantes sur ce chiffre précis, sans changer le
  statut gradé de la source retenue), activité quotidienne, pratique structurée et orientation vers une
  ressource. Un verrou de sécurité à l'effort (limitation physique connue, symptômes d'ischémie à l'effort,
  rétinopathie non stabilisée ou proliférante, neuropathie périphérique ou mal perforant plantaire — HAS
  R.19/R.27/R.28) bloque uniquement la montée d'intensité et la pratique structurée, jamais les
  déplacements actifs ni la rupture de sédentarité (décision de bucketing du référent) ; l'hypoglycémie
  sous insuline, sulfamide ou glinide reste une alerte, jamais un blocage, dès qu'une piste augmente la
  dépense énergétique.
