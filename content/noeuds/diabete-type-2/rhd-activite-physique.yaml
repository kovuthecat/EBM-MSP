meta:
  date_revue: "2026-07-26"
  auteur: "Claude Code (agent dédié) + référent DT2 (Thibault) — encodage en attente de validation clinique"
  statut: brouillon
  version: "0.7"
  changelog:
    - date: "2026-07-28"
      auteur: "Claude Code (P4/S1, T-018) — correctif mécanique, en attente de relecture référent"
      resume: >-
        D30 (amende D20) inverse le défaut de détermination des critères `bool`/`liste` : indéterminés
        par défaut, sauf `presomption_non: true` explicite, réservé aux critères qui ne participent à
        aucune condition d'option `role: securite` ni à aucune `exclusions` du nœud. Audit mécanique de
        l'étape 4 de T-018 : `traitements_en_cours`, `difficulte_acces_activite` et
        `experience_activite_negative` reçoivent `presomption_non: true` (éligibles). Les quatre signes
        du verrou de sécurité à l'effort perdent `confirmation_requise` (devenu inutile, son effet —
        indéterminé tant que non répondu — est désormais le défaut universel) mais ne reçoivent PAS
        `presomption_non`. `rupture_sedentarite_habituelle` et `offre_proximite_connue` satisfont la
        lecture littérale de l'étape 4 mais N'EN REÇOIVENT PAS NON PLUS : l'invariant I21
        (`engine/banc/vierge.test.ts`, T-019) a montré empiriquement que les présumer « non » reproduit
        le défaut D-01 (formulaire vierge → cartes « Recommandée ») — cf. commentaires en regard de
        chaque critère pour le détail. Aucun changement de logique clinique sur les critères qui reçoivent
        le champ — oubli de bump/changelog corrigé à la consolidation P4 (D5).
    - date: "2026-07-27"
      auteur: "référent DT2 + Claude Code"
      resume: >-
        A3 — chaque option DÉCLARE désormais son rôle (`role` : socle / securite / geste / repli), champ
        rendu OBLIGATOIRE au schéma. Motif : le contenu n'avait aucun moyen de dire ce qu'une option EST.
        `priorite` portait trois sens incompatibles (ordre de tri, porte d'affichage du repli, marqueur de
        socle par le rang 0), et le seul indice restant de la nature d'une carte était un LIBELLÉ DE
        FAMILLE en français — que le moteur a interdiction de lire (D8). Cinq constats de recette
        convergeaient sur ce manque, dont un repli d'affichage qui avait caché une carte de sécurité.
        Les rôles ont été posés MÉCANIQUEMENT, sans arbitrage clinique : `socle`/`repli` depuis les
        sentinelles `conditions`, `securite` depuis les familles que le nœud déclare déjà comme telles,
        `geste` pour le reste. Invariant I17 : `role` ne peut pas contredire les sentinelles, dans les DEUX
