    # ── VERSÉE le 2026-07-27 ─────────────────────────────────────────────────────────────────────────
    # Source de la réécriture de la piste viande/charcuterie (décision référent du 2026-07-27). C'est elle
    # qui établit que la charcuterie et la viande relèvent de « Réduire » tandis que le fromage, produit
    # laitier, relève d'« Aller vers » — deux DIRECTIONS différentes, que l'ancien intitulé fusionnait.
    - id: manger-bouger-affiche
      titre: "Santé publique France / Manger-Bouger — « Pour un mode de vie plus équilibré, chaque petit pas compte » (DT05-177-24A). Trois colonnes de DIRECTIONS, sans aucune quantité : Augmenter (fruits et légumes, légumes secs, fruits à coque, fait maison, activité physique) · Aller vers (céréales complètes, poissons gras et maigres, huiles de colza/noix/olive, produits laitiers en consommation suffisante mais limitée, saison et local, bio) · Réduire (produits sucrés et boissons sucrées, produits salés, CHARCUTERIE, VIANDE — porc, bœuf, veau, mouton, agneau, abats —, Nutri-Score D et E, temps assis)"
      annee: 2024
      type_critere: substitution
      lien: "docs/decision/sources/4DDK001_400x600_50PC_AFF_reco chaque petit pas compte_E2_VDEF.pdf"
  synthese_critique:
    donnee: >-
      Le repère huile d'olive/eau comme éléments du motif méditerranéen, et un signal de prudence
      épidémiologique sur les édulcorants intenses (association à un risque accru de diabète de type 2,
      sans référence bibliographique précise pour ce point dans la revue qui le rapporte) sont les seuls
      éléments de synthèse critique indépendante identifiés pour les gestes alimentaires de ce nœud —
      cités comme repères ou signaux de prudence, jamais comme l'argument lui-même, qui reste la donnée
      publiée (D23). Aucune synthèse dédiée spécifiquement à cette bibliothèque de pistes n'a été
      identifiée dans le corpus rassemblé pour ce chantier (signalé plutôt qu'inventé) ; la couverture la
      plus proche disponible dans le domaine porte sur l'intervention de perte de poids en soins primaires
      (DiRECT, régime méditerranéen) au niveau du nœud `rhd`, dont le périmètre est plus large que les
      pistes alimentaires ci-dessus.
    references:
      - nom: "Prescrire"
        detail: "Fiche Diabète de type 2, résumé critique interne (docs/decision/sources/prescrire-dt2.md, P9/P10)."
      - nom: "Médicalement Geek / DragiWebdo"
        lien: "https://www.medicalement-geek.com/2017/12/dragi-webdo-n163.html"
        detail: "Couverture générale de l'intervention de perte de poids en soins primaires (DiRECT, régime méditerranéen), pas une synthèse dédiée aux gestes alimentaires de ce nœud."
  reco_officielle:
    source: >-
      HAS — Stratégie thérapeutique du DT2 (2024, R.30-R.38) et Parcours surpoids-obésité de l'adulte (2023) ;
      SFD 2025 (prise de position, §8.7/Avis n°15, scope MASLD/MASH — pas une reco DT2 générale sur ce point,
      corrigé après red-team) ; Santé publique France/PNNS (« 50 petites astuces… ») ; Lifestyle education in
      type 2 diabetes (EBM Guidelines/Duodecim, gradé selon la section).
    position: >-
      Alimentation de type méditerranéen recommandée en 1re ligne, avec des repères chiffrés destinés à la
      population générale (au moins 5 fruits et légumes par jour, poisson 2 fois par semaine dont 1 gras,
      légumineuses au moins 2 fois par semaine, une petite poignée de fruits à coque par jour, réduire les
      boissons sucrées et les produits ultratransformés) et une insistance sur la non-culpabilisation
      (« la stabilisation du poids est déjà un succès », éviter les régimes restrictifs rigides).
    divergence: true
    explication: >-
      Les repères officiels (HAS, PNNS) s'expriment en valeurs chiffrées quotidiennes ou hebdomadaires.
      Ce nœud choisit délibérément de NE JAMAIS les administrer comme objectif chiffré au patient (décision
      référent, CONCEPTION-module-rhd.md §4bis-0) : administrer une cible reviendrait à mesurer un écart, donc
      à calculer un score d'adhérence — exactement ce que l'invariant « aucun score caché » proscrit, et le
      registre culpabilisant que la HAS elle-même met en garde contre. Les repères chiffrés restent cités,
      mais uniquement comme CONTEXTE de ce qui a été recommandé ou testé (en-tête du module et argumentaire
      exhaustif), jamais comme une cible affichée dans une piste.
incertitudes:
  - "L'étiquette « bénéfice EBM sur critère dur » du régime méditerranéen (PREDIMED, CORDIOPREV) porte sur le motif alimentaire supplémenté dans son ensemble, jamais sur une piste isolée de ce nœud (décision référent) — y compris l'huile d'olive et les fruits à coque, les deux composants réellement randomisés."
  - "Aucune version française validée du MEDAS n'a été identifiée (recherche documentée, cible-mediterraneenne-medas.md §4) : l'instrument sert ici uniquement de cadre de définition des axes recueillis (S9-S12, A12), jamais d'instrument administré ou scoré — ce qui rend l'absence de validation linguistique sans conséquence pour cet usage."
  - "CHANGEMENT DE RÔLE DU VERROU TCA — 2026-07-27, décision référent, sur un principe qui recadre tout le nœud : « dans le cadre des RHD en médecine générale on ne propose pas de restriction calorique, en tout cas pas chiffrée ; on propose des modifications d'habitudes alimentaires, jamais de régime. » Conséquence directe : un verrou qui existe pour empêcher qu'on demande une restriction à un patient à risque de TCA n'a plus d'objet dans un nœud qui n'en propose aucune. Les TROIS exclusions qu'il portait sont retirées, et l'inventaire de ce qu'elles bloquaient réellement montre qu'aucune n'était à sa place : (a) « repérer un moment de grignotage et lui trouver une ALTERNATIVE » est une substitution, rien n'y est retiré ni chiffré ; (b) « se repérer aux proportions dans l'assiette » est un RELIQUAT — ce blocage protégeait de la piste de PESÉE supprimée la veille, et son propre `inconvenients` continuait de décrire une piste qui n'existait plus ; (c) la piste viande/charcuterie était bien un geste chiffré (« diviser par deux »), mais elle a été RÉÉCRITE sans chiffre sur les repères de Santé publique France / Manger-Bouger. Le verrou conditionne désormais les deux options d'ORIENTATION, et rien d'autre. Ce qu'il reste vrai d'en dire : il reformule 3 signes d'appel HAS, ce n'est pas un instrument validé — un résultat négatif ne garantit rien, un positif ne confirme rien."
  - "PERFORMANCE DU VERROU TCA : TOUJOURS INCONNUE — mais l'enjeu a changé de nature le 2026-07-27. Aucune étude n'a évalué ce OU logique de 3 signes larges ; rien ne permet d'affirmer que sa spécificité vaut mieux que celle du SCOFF-F. Tant qu'il servait de TEST BLOQUANT, c'était un vrai problème : un blocage binaire fondé sur une spécificité inconnue, et le dossier de collecte refusait le SCOFF-F au motif que ses défauts sont MESURÉS tout en conservant une alternative dont les défauts ne le sont pas (asymétrie relevée par le red-team). En DÉCLENCHEUR D'ORIENTATION, la même incertitude coûte beaucoup moins cher : un faux positif propose une orientation de plus, là où il retirait auparavant des pistes au patient. L'incertitude demeure, sa conséquence a été réduite. Pour mémoire, chiffres corrigés par le red-team : la VPP attendue du SCOFF-F dans cette population n'est pas « ≈ 20 % » comme l'écrivait la collecte mais comprise entre ≈ 21 % (Kutz 2020) et ≈ 38 % (Botella 2013, méta-analyse non cherchée par la collecte) ; et sa VPN de ≈ 99 % reflète surtout la faible prévalence — à 5 % de prévalence la probabilité pré-test est déjà de 95 %, le gain d'un test négatif est de 4 points. Ne pas s'en servir pour « lever » la prudence."
  - "DIVERGENCE DE RECOMMANDATIONS sur le repérage lui-même, portée ici faute d'un champ dédié dans le schéma (`sources.reco_officielle.divergence` est un booléen qui qualifie la position de l'OUTIL, pas un conflit entre deux institutions). La HAS 2019 : « Rechercher SYSTÉMATIQUEMENT une hyperphagie boulimique en cas de situation de surpoids ou d'obésité. » L'USPSTF 2022, à l'inverse : « les preuves actuelles sont INSUFFISANTES pour évaluer la balance bénéfices-risques du dépistage des troubles du comportement alimentaire chez l'adolescent et l'adulte » (I statement, chez les personnes sans signes ni symptômes). Le nœud se tient entre les deux — il ne dépiste pas systématiquement, mais pose trois signes d'appel. CE POSITIONNEMENT N'EST TOUJOURS PAS ARBITRÉ EXPLICITEMENT et reste, à ce jour, un résultat de construction. Le lot du 2026-07-27 en réduit toutefois l'enjeu : le repérage ne FERME plus aucune piste, il ouvre seulement des orientations, ce qui rapproche le nœud de la position USPSTF (pas de dépistage à conséquence) sans renoncer à ce que demande la HAS (chercher, chez ces patients-là). Réserve de périmètre à connaître : le patient de ce nœud — adulte DT2 d'âge moyen ou avancé, en surpoids — n'appartient à la population cible DÉCLARÉE d'aucun des deux documents HAS invoqués (RBP 2010 : enfants, adolescents et jeunes adultes, anorexie mentale ; fiche 2019 : jeunes, en particulier adolescentes et jeunes femmes)."
  - "TRANCHÉ le 2026-07-27 (référent) : la piste de PESÉE est SUPPRIMÉE — « trop contraignant et difficile en consultation de médecine générale ». Cela résout aussi la tension de source qui était consignée ici : le rapport SFD situait la pesée chez les patients pratiquant un comptage précis (insulinothérapie fonctionnelle) et sa généralisation au DT2 tout-venant n'était pas soutenue. La famille « Portions » ne conserve qu'une piste, recentrée sur les PROPORTIONS DANS L'ASSIETTE. RÉSIDUEL ASSUMÉ : aucune proportion chiffrée n'est affirmée (pas de « moitié de légumes, quart de féculents ») — le dossier de preuve de ce nœud ne source aucun ratio, et l'inventer irait contre l'invariant 6. Le repère reste donc qualitatif : la place RELATIVE des composantes. Si le référent veut un ratio explicite, il faudra le sourcer (guides Manger-Bouger / HAS déjà au dossier du module, non dépouillés sur ce point précis)."
  - "PLAFOND D'AFFICHAGE — RÉSOLU le 2026-07-27 (décision référent). La dette était consignée à l'identique dans les DEUX nœuds RHD : le rang (`priorite`) était déclaré dans le contenu mais l'écran affichait tout à plat, si bien que le rang n'était jamais vu. L'écran REPLIE désormais les pistes au-delà du meilleur rang derrière un bouton « Autres pistes possibles (N) » (`lib/replierAffichage.ts`, testé à part). CE QUE CE N'EST PAS : un plafond. Rien n'est retiré ni filtré — la partition conserve exactement les options d'entrée, le bouton porte leur nombre exact, et un clic les rend. Trois cas ne replient délibérément rien : moins de 4 options applicables (écran non encombré), aucun rang défini (nœud en `ordered-first-match`, où `priorite` est ignoré par D11), et toutes les options au même rang (le contenu les déclare équivalentes ; en cacher une partie inventerait une hiérarchie qu'il ne pose pas). Une option sans rang est traitée comme prioritaire : le doute ne cache jamais."
  - "Mal perforant plantaire, rétinopathie et autres contre-indications à l'EFFORT (verrou du nœud sœur `rhd-activite-physique`) n'ont aucune portée ici : ce nœud ne collecte que des critères alimentaires."
  - "« Continuer ce qui fonctionne déjà » n'est pas un sentinel `default` : sa condition (huile d'olive ET fruits à coque réguliers) est un sous-ensemble NÉCESSAIRE, mais pas exactement équivalent, du cas où les 13 axes de recueil sont tous favorables — elle peut donc aussi s'afficher (à raison, cumulée à d'autres pistes) chez un patient favorable sur ces deux seuls axes sans l'être sur tous les autres. Choix assumé : couvrir à coup sûr le cas muet complet plutôt que viser une équivalence stricte impossible à exprimer dans le DSL sans sentinel réellement atteignable."
  - "Le rapprochement entre `alimentation_emotionnelle` (déclencheur de « Manger sans se presser ») et la tachyphagie citée par la source pour cette même piste est une extrapolation raisonnée (les deux notions sont voisines mais non identiques dans le corpus) — signalé, pas inventé."
