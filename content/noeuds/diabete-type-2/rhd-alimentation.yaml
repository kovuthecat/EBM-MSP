meta:
  date_revue: "2026-07-26"
  auteur: "Claude Code (agent dédié) + référent DT2 (Thibault) — encodage en attente de validation clinique"
  statut: brouillon
  version: "0.5"
  changelog:
    - date: "2026-07-27"
      auteur: "référent DT2 + Claude Code"
      resume: >-
        LOT « BASE CONSOLIDÉE » — question du référent : « toutes les nouvelles données cherchées ont-elles
        été intégrées, avec leur niveau de preuve, dans la base consolidée ? » Réponse vérifiée : NON. Une
        vingtaine d'essais portaient des chiffres AFFICHÉS dans les options sans figurer dans
        `sources.references_primaires`. Rien ne pouvait le signaler — aucun invariant ne reliait une option
        à ses sources. Nouveau champ `id` sur les références, nouveau champ `references` sur les options,
        et invariant I8 (a : ids uniques ; b : tout id cité existe ; c : une option en preuve modérée ou
        élevée déclare au moins une référence).
        SUR CE NŒUD : l'affiche Santé publique France / Manger-Bouger est versée — c'est elle qui porte la
        réécriture de la piste viande/charcuterie décidée le jour même, et elle n'y figurait pas. 3 options
        adossées. Aucun changement de comportement.
    - date: "2026-07-27"
      auteur: "référent DT2 + Claude Code"
      resume: >-
        LE VERROU TCA CESSE DE BLOQUER, ET LA PISTE VIANDE EST RÉÉCRITE SUR MANGER-BOUGER — décision
        référent, prise sur un principe qui recadre tout le nœud : « dans le cadre des RHD en médecine
        générale on ne propose pas de restriction calorique, en tout cas pas chiffrée ; on propose des
        modifications d'habitudes alimentaires, jamais de régime. »
        (1) LES TROIS EXCLUSIONS `verrou_tca` SONT RETIRÉES. Un verrou anti-restriction n'a pas d'objet
        dans un nœud qui ne propose aucune restriction — et l'inventaire de ce qu'il bloquait le confirme :
        une substitution (grignotage), un repère qualitatif (proportions dans l'assiette — RELIQUAT du
        blocage de la piste de PESÉE supprimée la veille, dont l'`inconvenients` décrivait encore une piste
        disparue), et un seul geste réellement chiffré, réécrit par ce même lot. Le verrou conditionne
        désormais les deux options d'ORIENTATION, et rien d'autre. `fragilite` est MAINTENU partout où il
        était : c'est un motif nutritionnel (protéines, apport énergétique), pas comportemental — les deux
        garde-fous étaient réunis dans la même ligne d'exclusion sans avoir la même raison d'être.
        (2) « Diviser par deux la portion habituelle de fromage et de charcuterie, préférer la volaille »
        devient « Réduire la charcuterie et la viande rouge (porc, bœuf, veau, mouton, agneau, abats) ».
        Objection clinique du référent : cet intitulé « mélange des choses bien différentes ». L'affiche
        Santé publique France / Manger-Bouger versée au dossier lui donne raison noir sur blanc — la
        charcuterie et la viande sont DEUX lignes de la colonne « Réduire », tandis que le fromage relève
        des produits laitiers, rangés en « Aller vers » sous « une consommation suffisante mais limitée ».
        Deux directions opposées dans un même geste. Trois retraits : le fromage (mauvaise colonne), le
        chiffre (Manger-Bouger n'énonce jamais de quantité), et « préférer la volaille » (l'affiche ne la
        recommande pas — elle se contente de ne pas la faire figurer dans la liste à réduire ; absence
        d'une liste n'est pas une recommandation positive). Nouvelle famille « Viande et charcuterie » :
        la piste n'a plus sa place en « Matières grasses ».
        (3) PLAFOND D'AFFICHAGE — dette levée (voir `incertitudes`) : l'écran replie les pistes au-delà du
        meilleur rang derrière « Autres pistes possibles (N) ». Rien n'est retiré ni filtré.
        IMPACT GOLDEN MASTER : 124 profils sur 180 changent — 77 gagnent la piste grignotage, 58 la piste
        proportions, 41 la piste viande/charcuterie ; aucune option perdue en dehors de celle qui est
        renommée. Total d'options applicables 1366 → 1533. Mesure cross-validée par comptage brut après
        que les DEUX premiers instruments se soient trompés (découpage sur la virgule du nouvel intitulé,
        puis alternation de séparateurs incomplète qui perdait 15 occurrences d'une option inchangée).
    - date: "2026-07-27"
      auteur: "référent DT2 + Claude Code"
      resume: >-
        LOT « REPÉRAGE TCA » — 2 arbitrages référent, après collecte de preuve
        (`docs/decision/validation/chantier-2026-07-27/preuve-repérage-tca.md`) et red-team adversarial
        (`redteam-repérage-tca.md`).
        (1) VERROU MAINTENU, PROSE ENRICHIE. La collecte affirmait que l'incertitude du nœud était « fausse
        au sens littéral » ; le red-team a établi qu'elle ne l'était PAS — elle portait sur le corpus local,
        et le corpus local ne contient effectivement aucun des deux documents HAS invoqués. Le défaut
        n'était pas d'être faux mais d'être trop étroit : l'entrée dit désormais ce que la littérature
        contient réellement (SCOFF-F, Expali™, Binge Eating Scale française) et POURQUOI le verrou reste
        préféré malgré cela — au premier rang, le fait qu'un item du SCOFF est INVERSÉ chez ce patient (la
        perte de poids récente y est un signe d'alerte, alors qu'ici c'est un objectif thérapeutique).
        Deux motifs de la collecte ont en revanche été ÉCARTÉS parce que le red-team les a démolis : la VPP
        « ≈ 20 % » est en réalité comprise entre 21 et 38 % selon la méta-analyse retenue (une seconde
        existait, non cherchée), et le « 4 patients bloqués à tort sur 5 » confondait positifs et patients
        — la proportion réelle est d'environ 16 %, soit une surestimation d'un facteur 5. Deux entrées
        `incertitudes` ajoutées : la performance du verrou est INCONNUE (raison de prudence des deux côtés,
        pas un argument pour le statu quo), et la divergence HAS 2019 (« rechercher systématiquement ») vs
        USPSTF 2022 (« preuves insuffisantes ») est désormais portée au lieu d'être arbitrée en silence.
        (2) OPTION D'ORIENTATION AJOUTÉE. Le verrou ne déclenchait qu'une orientation vers le diététicien,
        alors que le guide HAS surpoids-obésité — PDF déjà présent au dépôt — écrit qu'une orientation vers
        un psychologue ou un psychiatre spécialiste des TCA peut être nécessaire EN COMPLÉMENT. La nouvelle
        option coexiste avec la précédente (même rang), sur une condition plus étroite : le verrou TCA seul.
    - date: "2026-07-27"
      auteur: "référent DT2 + Claude Code"
      resume: >-
        DÉCISION RÉFÉRENT : la piste de PESÉE des féculents est SUPPRIMÉE — « trop contraignant et
        difficile en consultation de médecine générale ». La famille « Portions » ne conserve qu'une piste,
        RECENTRÉE sur les proportions dans l'assiette (« Se repérer aux proportions dans l'assiette plutôt
        qu'aux quantités pesées ») : la part relative des composantes, praticable à chaque repas, sans
        matériel ni calcul. Aucune proportion CHIFFRÉE n'est affirmée — le dossier de ce nœud n'en source
        aucune, et l'inventer irait contre l'invariant 6 ; le repère reste qualitatif. Cette décision clôt
        du même coup la tension de source consignée en incertitude (le rapport SFD situait la pesée en
        insulinothérapie fonctionnelle, pas chez le DT2 tout-venant). Golden master : 7 profils perdent la
        carte de pesée, aucun n'en perd d'autre.
    - date: "2026-07-26"
      auteur: "Claude Code (agent dédié)"
      resume: >-
        Création initiale (brouillon v0.1) depuis `rhd-collecte-alimentation.md` (révisée après red-team,
        4 findings HAUTE corrigés) + `CONCEPTION-module-rhd.md` §4bis + `cible-mediterraneenne-medas.md`.
        Nœud dédié à l'axe alimentation du module RHD, remplaçant à terme le volet alimentation de `rhd`
