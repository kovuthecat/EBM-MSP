        analogue basal de 2ᵉ génération » : « ebmfrance niveau B » retiré, SFD 2025 Avis 18 bis conservé
        (recommandation officielle, légitime) ; pointe désormais vers la réduction d'hypoglycémie détaillée
        au bullet suivant (SWITCH 2, EDITION) et dans les `inconvenients` (DEVOTE). `inconvenients` de
        l'option prémix : « (ebmfrance) » retiré, la donnée (Bertuol, 4T) portait déjà seule l'argument dans
