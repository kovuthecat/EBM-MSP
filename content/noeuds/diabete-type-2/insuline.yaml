    # Cette option était étiquetée `modere`. Son fondement est un accord d'experts (ADA §13, HAS R.103, SFD Avis 5 bis) — il n'existe
    # aucun essai qui l'établisse, et il n'en existera pas. Au sens GRADE, la certitude est donc FAIBLE,
    # quelle que soit la force de la recommandation qui la porte. Les deux notions étaient confondues.
    # Le geste reste EXACTEMENT le même : c'est l'étiquette qui devient honnête, pas la conduite.
    niveau_preuve: faible
  - intitule: "Optimiser la répartition du basal-bolus (guidé par l'AGP et les doses actuelles)"
    role: geste
    famille: "Ajuster le schéma en place"
    # 12.11 (recette) : condition unique = situation, préemptant le repli — un patient à l'objectif,
    # sans hypoglycémie ni variabilité, recevait quand même cette option sur le seul fait d'être sous
    # basal-bolus. Mêmes seuils que la situation « basale seule » (TBR/TBR_severe/CV_glycemique/
    # hypo nocturne) : il n'y a rien à optimiser si le contrôle est atteint et le schéma stable.
    #
    # I1/F2 (redteam-clinique-silences.md, 2026-07-26, 4ᵉ lot) : 1er item ÉLARGI à « basale_plus_bolus »
    # (RÉUTILISATION, aucun contenu clinique nouveau). Jusqu'ici, une fois les 2 options d'escalade de
