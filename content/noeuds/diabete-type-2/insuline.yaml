    - date: "2026-07-26"
      auteur: "référent DT2 + Opus"
      resume: >-
        Arbitrages référent 2026-07-26 (2ᵉ série), 2 décisions ciblées sur 12.6/12.7/12.8-12.9 (points
        laissés ouverts par le lot précédent du même jour). (1) `over_basalisation` : l'alerte D21 portée
        par « Titrer la basale » (lot précédent) était une consigne erronée — elle laissait la carte
        recommander la titration tout en portant une alerte disant de ne pas titrer, contradiction
        simplement déplacée d'un cran. `over_basalisation == true` devient une `exclusions` de « Titrer la
        basale » (alerte D21 retirée, devenue redondante) ; en miroir, l'option de relais « Ne pas
        sur-titrer la basale — intensifier autrement » est ÉLARGIE (`gaj_a_cible == true OR
        over_basalisation == true`, au lieu de `gaj_a_cible == true` seul) pour éviter le MUTISME que
        produirait l'exclusion seule — le texte de l'ex-alerte devient le déclencheur du geste alternatif.
        Condition validée par le référent en forme normale disjonctive (DSL sans parenthèses, AND prime sur
        OR) puis encodée, de façon logiquement équivalente, comme conjonction de 3 items `conditions`
        (`situation`, `cible_atteinte == false`, `gaj_a_cible == true OR over_basalisation == true`) — le
        moteur ANDe déjà les items, ce qui évite de répéter les 2 termes communs aux deux disjoncts.
        Vérifié : aucun cas `over_basalisation == true` en « basale seule » ne se retrouve sans option (cf.
        vérifications manuelles). (2) Alignement de 2 options sur `risque_hypoglycemique_eleve` (dérivé incluant
        `age >= 75`) plutôt que sur le triplet brut `risque_hypoglycemie_schema == eleve OR fragilite ==
        true OR esperance_vie == limitee`, qui omettait l'âge — la même relaxation que gatent déjà les
        alertes de cibles MCG assouplies : « Choisir un analogue basal de 2ᵉ génération » (naïf, alignement
        direct, triplet identique à celui décrit) et « Désintensifier / alléger le schéma » (basal-bolus).
        Décision référent : aligner les OPTIONS sur `risque_hypoglycemique_eleve` (pas l'inverse) — le sur-traitement du
        sujet âgé est le risque autour duquel le nœud A est construit. Cas vérifié : un patient de 80 ans,
        HbA1c 6 % pour une cible de 7 %, sous basal-bolus, case « fragile » non cochée, reçoit désormais
        l'allègement (auparavant aucune option, l'âge seul ne déclenchait rien). ⚠ Signalé, non tranché
        (invariant 6) : la condition d'origine de « Désintensifier » n'était PAS le triplet décrit par la
        consigne — elle portait `hypo_severe_recurrente` (antécédent d'hypoglycémie sévère) au lieu de
        `risque_hypoglycemie_schema`. Ce terme est CONSERVÉ comme déclencheur indépendant
        (`risque_hypoglycemique_eleve == true OR hypo_severe_recurrente == true`), son retrait n'ayant pas été demandé ;
        seul le sous-groupe fragilité est remplacé par `risque_hypoglycemique_eleve`. (3) Point structurel CONSIGNÉ,
        NON implémenté (hors périmètre de ce lot) : le référent signale pour la 2ᵉ fois (recette capture 8)
        que la glycémie à jeun est rarement le critère utilisé pour la basale — l'aspect nocturne de la
        courbe prime en pratique. `gaj_a_cible` reste pourtant le PIVOT de la situation « basale seule »
        (départage « Titrer » de « Ne pas sur-titrer »). Détail de ce que deviendrait ce pivot sous un
        critère nocturne, et des options qui en dépendent, versé aux `incertitudes` du nœud.
