    # sur-traitement du sujet âgé est le risque autour duquel le nœud A est construit ; le manquer est plus
    # grave que de proposer l'analogue de 2ᵉ génération à tort.
    # I3/F4 (2026-07-26, 4ᵉ lot) : `risque_hypoglycemique_eleve` inclut désormais `hypo_severe_recurrente` (cf.
    # `criteres_entree`) — cette option couvre donc maintenant aussi le patient dont le SEUL signal de
    # risque est un antécédent d'hypoglycémie sévère récurrente (auparavant silencieux ici alors que ce
    # même signal pilotait déjà « Désintensifier / alléger le schéma » plus loin dans ce nœud).
    conditions:
