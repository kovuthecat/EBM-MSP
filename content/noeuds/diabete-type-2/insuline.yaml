        « Corriger l'hypoglycémie » (la conjonction avec le schéma est retirée) : c'est une propriété du
        patient, pas du schéma. (3) SCISSION de `risque_hypoglycemique_eleve` en deux dérivés — les alertes de cibles MCG
        lisent désormais `terrain_cible_assouplie` (âge/fragilité/horizon, SANS signal d'hypoglycémie), parce
        qu'« une hypo sévère appelle une optimisation du traitement, pas un assouplissement des cibles ». Ce ne
        sont pas deux encodages d'un concept (I4) mais deux concepts que la fusion confondait. 4 vignettes
        (A27-1 à A27-3b). Golden master : AUCUNE liste d'options modifiée sur les 180 profils — seules des
        justifications s'enrichissent ; les gains cliniques réels ne sont visibles que par les vignettes, le
        générateur ne produisant pas le cas du signal isolé. Profils gelés complétés (colonne
        `hypo_interprandiale`, valeurs existantes inchangées).
    - date: "2026-07-26"
      auteur: "référent DT2 + Claude Code"
      resume: >-
        D24 (résorption de la dette I6) : l'alerte de nœud en `quand: "default"` — « l'insuline n'a pas de
        bénéfice cardiovasculaire démontré, ORIGIN neutre » — est DÉPLACÉE dans le nouveau champ `cadrage`,
        TEXTE INCHANGÉ. Elle violait D21 (interdit n°2 : une alerte affichée pour tous ne signale plus
        rien, et dévalue par contagion les alertes conditionnelles rendues à côté d'elle), mais elle était
        incorrigible tant que `alertes` restait le seul canal : cet énoncé porte sur l'état des preuves du
        nœud, jamais sur la situation d'un patient — rien n'aurait pu le rendre conditionnel. Aucun effet
        moteur (le champ n'entre dans aucune sélection d'option) ; à l'écran il passe sous le titre, AVANT
        le formulaire, avec un traitement volontairement neutre — pas celui d'une alerte.
    - date: "2026-07-26"
      auteur: "référent DT2 + Claude Code"
      resume: >-
        D23, lot 2 : les 4 occurrences restées dans les `options` (le lot précédent excluait
        délibérément `options`/`criteres_entree`/`alertes` de son périmètre) sont reformulées — l'argument
        s'appuie désormais sur la donnée déjà citée dans le même fichier, jamais sur le nom d'une revue.
        `avantages` de « Initier une insuline basale » : « est l'insulinothérapie de choix du DT2
