        `engine/banc/coherence-inter-noeuds.test.ts`). Aucun changement de logique clinique — seule la
        source de vérité du silence change ; oubli de bump/changelog corrigé à la consolidation P4 (D5).
    - date: "2026-07-27"
      auteur: "référent DT2 + Claude Code"
      resume: >-
        K6 — les critères `HbA1c_actuelle` (et `HbA1c_cible` sur le nœud E) sont déclarés `partage` :
        leur valeur SAISIE est reprise d'un nœud à l'autre dans la même consultation, pré-remplie et
        signalée comme telle à l'écran, jamais imposée. Décision référent : « on peut garder une
        persistance par session — un reload de la page reset tout ». Ce qui circule est une valeur saisie
        par le praticien, JAMAIS une conclusion du moteur : le garde-fou R1 (aucun chaînage entre nœuds)
        est respecté, et un critère DÉRIVÉ n'est jamais mémorisé. Mémoire de session uniquement — aucune
        écriture disque, aucun réseau (invariant 1). Le champ est déclaré par le CONTENU et non par le
        socle, qui n'a pas le droit de connaître `HbA1c_cible` par son nom (D8). Invariant I19 : un critère
        `partage` doit avoir le même encodage (type, bornes, valeurs) sur tous les nœuds qui le déclarent,
        sans quoi on ferait circuler un concept sous un nom commun avec deux définitions. Aucun effet sur
        la sélection des options : aucun golden master modifié.
    - date: "2026-07-27"
      auteur: "référent DT2 + Claude Code"
      resume: >-
        A4/F — `traitements_en_cours` masque désormais « insuline basale » et « insuline rapide » chez un
        patient déclaré NAÏF, grâce au nouveau champ de schéma `valeurs_visible_si`. La recette avait
        constaté que les deux cases restaient cochables ; le contenu ne pouvait rien y faire et le disait
        déjà lui-même sur `profil_glycemique` — « `visible_si` porte sur un champ entier : impossible de
        masquer UNE valeur d'une liste dont les quatre autres restent pertinentes ». Le contournement
        employé deux fois (scinder la valeur en critère propre) ne s'appliquait pas ici : ce critère est
        PARTAGÉ avec `prescription`. Troisième occurrence du même manque, d'où le mécanisme générique.
        Il ne fait PAS double emploi avec la contrainte de saisie ajoutée le même jour sur la même
        incohérence : R8 (« une alerte ne retire rien : elle commente une saisie qu'il faudrait
        empêcher ») — le masquage EMPÊCHE la saisie à l'écran, la contrainte reste indispensable au BANC,
        qui ignore `visible_si`. Sûreté à la maille de la valeur : une valeur cochée puis masquée est
        RETIRÉE de la saisie, sans quoi elle piloterait le moteur en silence. Aucun golden master modifié.
    - date: "2026-07-27"
      auteur: "référent DT2 + Claude Code"
      resume: >-
        A3 — chaque option DÉCLARE désormais son rôle (`role` : socle / securite / geste / repli), champ
        rendu OBLIGATOIRE au schéma. Motif : le contenu n'avait aucun moyen de dire ce qu'une option EST.
        `priorite` portait trois sens incompatibles (ordre de tri, porte d'affichage du repli, marqueur de
        socle par le rang 0), et le seul indice restant de la nature d'une carte était un LIBELLÉ DE
        FAMILLE en français — que le moteur a interdiction de lire (D8). Cinq constats de recette
        convergeaient sur ce manque, dont un repli d'affichage qui avait caché une carte de sécurité.
        Les rôles ont été posés MÉCANIQUEMENT, sans arbitrage clinique : `socle`/`repli` depuis les
        sentinelles `conditions`, `securite` depuis les familles que le nœud déclare déjà comme telles,
        `geste` pour le reste. Invariant I17 : `role` ne peut pas contredire les sentinelles, dans les DEUX
        sens. ZÉRO changement de comportement — aucun golden master modifié.
    - date: "2026-07-27"
      auteur: "référent DT2 + Claude Code"
      resume: >-
        CONTRAINTES DE SAISIE (nouveau champ de schéma) + prérequis de repli enfin posé. (1) Le nœud
        déclare désormais deux relations entre critères qui doivent rester vraies : `TBR_severe <= TBR`
        (le temps sous 54 mg/dL est INCLUS dans le temps sous 70 — la seconde recette navigateur avait
        saisi TBR 1 % / TBR sévère 95 % et obtenu trois cartes « Recommandée », dont un ajout de bolus
        chez un patient décrit comme passant 95 % du temps en hypoglycémie sévère), et « naïf d'insuline
        vs insuline déjà cochée ». (2) La SECONDE a MIGRÉ depuis `alertes` : elle disait elle-même être
        « une incohérence de SAISIE, pas une observation clinique sur le patient » et vivait dans le
        panneau de résultats faute d'un canal pour le dire. Elle s'affiche désormais dans le FORMULAIRE,
        à côté des deux champs qui se contredisent ; sa portée est élargie de `insuline_basale` seule à
        `insuline_basale` OU `insuline_rapide`. (3) Le prérequis `situation_insuline != naif` du repli
        « Poursuivre le schéma d'insuline en cours » (R9/I15, tranché le 2026-07-26 puis retiré le jour
        même) est POSÉ : les 7 profils du banc qui faisaient échouer l'invariant I2′ étaient tous des
        saisies impossibles, que le générateur n'engendre plus. Aucune revendication clinique nouvelle ;
        aucun changement pour un patient dont la saisie est cohérente.
    - date: "2026-07-27"
      auteur: "référent DT2 + Claude Code"
      resume: >-
        LOT « BASE CONSOLIDÉE » — question du référent : « toutes les nouvelles données cherchées ont-elles
        été intégrées, avec leur niveau de preuve, dans la base consolidée ? » Réponse vérifiée : NON. Une
        vingtaine d'essais portaient des chiffres AFFICHÉS dans les options sans figurer dans
        `sources.references_primaires`. Rien ne pouvait le signaler — aucun invariant ne reliait une option
        à ses sources. Nouveau champ `id` sur les références, nouveau champ `references` sur les options,
        et invariant I8 (a : ids uniques ; b : tout id cité existe ; c : une option en preuve modérée ou
        élevée déclare au moins une référence).
        SUR CE NŒUD : les 22 références reçoivent un id, 8 options sur 9 sont adossées. La neuvième
        (« Désintensifier / alléger le schéma ») repose sur un accord d'experts — l'ECR de déprescription
        du sujet âgé est versé dans `prescription`, pas ici. Aucun changement de comportement.
    - date: "2026-07-27"
      auteur: "référent DT2 + Claude Code"
      resume: >-
        ENTRÉE `incertitudes` PÉRIMÉE, purgée. Elle annonçait que les dérivés, les tooltips AGP et
        `hypo_severe_recurrente` « restent à câbler » — tout cela avait été fait le 2026-07-24, et
