        Reste réellement ouvert, et rien d'autre : l'AFFICHAGE du nombre de dose calculé (le moteur le
        calcule déjà). Aucun changement de contenu clinique ni de comportement.
    - date: "2026-07-27"
      auteur: "référent DT2 + Claude Code"
      resume: >-
        SUR-BASALISATION — l'exclusion est RETIRÉE (arbitrage référent, après collecte de preuve et
        red-team). Le seuil de 0,5 U/kg ne retire plus « Titrer la basale » ; il reste déclencheur de
        « Ne pas sur-titrer — intensifier autrement », les deux cartes coexistant sous le tri par rang.
        Motif : seuil issu d'un post-hoc financé par le fabricant où il n'était pas pré-spécifié, RETIRÉ
        des Standards ADA en 2025 (verbatim du Summary of Revisions) mais MAINTENU par l'AACE depuis
        2018, jamais testé comme règle de décision, et coupant au milieu de la plage de doses d'entretien
        réellement atteintes à la cible (0,34-0,78 U/kg). Retirer un geste est le canal le plus fort de
        D21 ; ce niveau de preuve ne le porte pas. Sourçage corrigé et daté : l'attribution « SFD /
        Médicalement Geek » était inexacte sur les DEUX termes. NON retiré, en revanche : la mention
        « majore l'hypoglycémie » — la collecte la disait démentie, le red-team a établi que c'était une
        lecture sélective (le volet intra-patient de la source montre une probabilité accrue APRÈS
        franchissement). Deux vignettes révisées (E-04a, E-05) : leur attente venait du référent, elle a
        changé. E-05 y gagne — elle vérifie désormais les deux bords du mécanisme D20.
    - date: "2026-07-27"
      auteur: "référent DT2 + Claude Code"
      resume: >-
        Deux arbitrages référent (3ᵉ lot). (1) ÉCART POST-PRANDIAL en « basale seule » : quand le jeûne ou
        le profil nocturne est DÉJÀ à la cible et que l'HbA1c reste au-dessus, les deux gestes concrets
        (« Ajouter un GLP-1 / association fixe », « Ajouter un bolus ») s'ouvrent enfin — le patient ne
        recevait que la prose de « Ne pas sur-titrer… — intensifier autrement », qui dit d'intensifier sans
        nommer par quoi. Vignette A27-4 ; aucun profil gelé ne change (le cas isolé n'est pas produit par
        le générateur). (2) RENOMMAGE `terrain_fragile` → `risque_hypoglycemique_eleve` : le nom disait
        « fragilité gériatrique » là où le dérivé calcule un risque hypoglycémique, confusion devenue
        gênante depuis que les cibles sont passées à `terrain_cible_assouplie`. Aucun changement de
        comportement. Au passage, une DIVERGENCE INTER-NŒUDS est mise au jour et consignée : `prescription`
        déclare un `terrain_fragile` de définition différente — I4 étant vérifié par nœud, il ne pouvait
        pas la voir. À arbitrer.
    - date: "2026-07-27"
      auteur: "référent DT2 + Claude Code"
      resume: >-
        FAMILLES DÉCLARÉES (arbitrage référent, 2ᵉ lot d'incertitudes). Les rangs `priorite` 1-2-3 sont
        réutilisés par les quatre blocs de situation : « Corriger l'hypoglycémie » (rang 1, sécurité) et
        « Ajouter un GLP-1 » (rang 1, escalade) pouvaient donc s'afficher sous la mention « à égalité ».
        Six familles, dans l'ordre d'affichage voulu — sécurité d'abord : Sécurité / Instaurer /
        Intensifier / Ajuster / Alléger / Aucun geste. Les `priorite` ne sont PAS renumérotées (remaniement
        large, sans gain, et golden master illisible) : le chevauchement subsiste dans les données mais
        devient sans conséquence à l'écran. Toutes `exclusive: false`, faute d'une famille dont les options
        soient de vraies alternatives — à reconfirmer visuellement. Golden master : aucune liste d'options
        modifiée (les familles sont un fait d'affichage).
    - date: "2026-07-27"
      auteur: "référent DT2 + Claude Code"
      resume: >-
        Trois arbitrages référent, session « régler les incertitudes ». (1) `hypo_interprandiale` SORTI de la
        liste `profil_glycemique` et promu en critère propre, recueilli seulement dans les schémas avec bolus
        (`visible_si`) : ce signal accuse le BOLUS, pas la basale — il ouvre « Optimiser la répartition du
        basal-bolus » et ne bloque délibérément pas la titration. Motif structurel de la scission : `visible_si`
        porte sur un champ entier, on ne peut pas masquer une seule valeur d'une liste dont les autres restent
