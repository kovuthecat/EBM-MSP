# Nœud E « Insuline » — contenu BROUILLON (2026-07-24).
# Autorité : docs/decision/noeuds/E-insuline.md (dossier de preuve : 5 agents A × OpenEvidence 2ᵉ passe ×
# red-team B1/B2/B3, PMID/DOI vérifiés/corrigés contre source primaire — §5b) + .argumentaire.md (niveau 3).
# EN ATTENTE DE VALIDATION RÉFÉRENT (arbitrages §8-1→8-7 tranchés). Les valeurs cliniques ne se modifient pas
# hors workflow veille → algorithme (D5).
#
# NŒUD MULTI-OPTIONS ROUTÉ PAR `situation_insuline` (4 situations séquentielles mutuellement exclusives :
# naif → basale_seule → basale_plus_bolus → basal_bolus). Chaque option porte le gate de sa situation ;
# dans une situation, plusieurs recommandations s'empilent, triées par `priorite` (rang croissant).
#
# DIMENSION MCG (§8-4) : deux axes. Axe CONTRÔLE (TIR/TAR/GMI) = redondant avec l'HbA1c qui gate déjà →
# interprétation + alertes (cibles = CONSENSUS Battelino 2019, PAS un critère dur). Axe SÉCURITÉ
# (TBR/TBR_severe/CV/hypo nocturnes) = critère DUR (EBM DEVOTE) → gate les recommandations de sécurité.
#
# DÉRIVÉS FORMULAIRE (le DSL ne compare pas 2 variables ni ne calcule de seuil — précédent nœud C) :
# `cible_atteinte` (HbA1c_actuelle <= HbA1c_cible), `gaj_a_cible` (GAJ dans la cible), `over_basalisation`
# (dose_basale_actuelle / poids > 0,5 U/kg — repère [À VÉRIFIER] ; depuis 2026-07-26, EXCLUSION dure de
# « Titrer la basale » et déclencheur, avec `gaj_a_cible`, de « Ne pas sur-titrer... » — plus une simple
# alerte d'option), `terrain_fragile` (fragilite OR esperance_vie==limitee OR age>=75 OR
# risque_hypoglycemie_schema==eleve OR hypo_severe_recurrente==true, aligné sur la relaxation du nœud A ; depuis 2026-07-26, gate aussi
# « Choisir un analogue basal de 2ᵉ génération » et « Désintensifier / alléger le schéma », qui utilisaient
# jusque-là un triplet brut sans l'âge — cf. changelog. `hypo_severe_recurrente` FUSIONNÉ dans ce dérivé
# le 2026-07-26 (4ᵉ lot, arbitrage I3 du rapport red-team `docs/decision/validation/chantier-2026-07-26/
# redteam-clinique-silences.md` F4) : même concept de sécurité encodé deux fois — `terrain_fragile` ici,
# `hypo_severe_recurrente` en OR littéral sur « Désintensifier » seulement — le défaut que l'invariant I4
# (« un concept, un encodage », `docs/decision/CONSTRUIRE-UN-MODULE.md`) cite nommément pour ce nœud.
# Conséquence à noter : élargit aussi la population qui reçoit les cibles de MCG ASSOUPLIES (alertes
# ci-dessous) à un patient dont le SEUL signal est un antécédent d'hypoglycémie sévère récurrente —
# décision non distinctement revue par le référent, cf. incertitudes).
#
# DOSES (§8-7) : aide au CALCUL à partir de `poids` (initiation = poids × 0,1-0,2 U/kg ; repli fixe 10 U) et
# des doses actuelles (majorations +2 U ou +10-20 % ; diminutions −2 à −4 U ou −10-20 % ; basal-plus ≈ 10 % de
# la basale). Ratios dans l'argumentaire ; calcul câblé au formulaire (P3). Scope basal → basal-bolus (§8-5) ;
# HORS périmètre : ratios glucides-insuline / facteur de sensibilité formels, pompe & boucle fermée.
#
# ⚠ MESSAGES À NE JAMAIS TENIR : « l'insuline réduit les événements CV / la mortalité » (ORIGIN neutre) ; les
# cibles TIR ne sont PAS un critère dur (consensus) ; prandial/prémix systématique n'est pas fondé sur les
# preuves ; la réduction d'hypo SÉVÈRE des analogues 1ʳᵉ gén vs NPH n'est PAS significative (Cochrane 2020) ;
# Prescrire ne pose PAS la NPH en référence (invention écartée) ; il n'existe pas de position CMG dédiée.
id: insuline
domaine: diabete-type-2
titre: "Insulinothérapie du DT2 : Initier, optimiser, intensifier"
population_cible: >-
  Adulte DT2 (hors DT1, grossesse, diabètes secondaires) chez qui une insulinothérapie est justifiée. Aide à
  la prescription en médecine générale : initiation et titration d'une basale, intensification par étapes
  (GLP-1 / combo fixe avant le bolus, puis basal-plus), adaptation d'un basal-bolus. Hors périmètre : pompe à
  insuline et boucle fermée (centres initiateurs) ; calcul formel des ratios glucides-insuline / facteur de
  sensibilité (éducation spécialisée).
selection: multi-options
argumentaire_exhaustif: "insuline.argumentaire.md"
criteres_entree:
  - nom: situation_insuline
    type: enum
    valeurs: [naif, basale_seule, basale_plus_bolus, basal_bolus]
  - nom: age
    type: nombre
    min: 18
    max: 105
  - nom: HbA1c_actuelle
    type: nombre
    min: 4
    max: 18
  - nom: HbA1c_cible
    type: nombre
    min: 6
    max: 9.5
  - nom: cible_atteinte
    type: bool
    derive: "HbA1c_actuelle <= HbA1c_cible"
  - nom: DFG
    type: nombre
    min: 3
    max: 150
  - nom: fragilite
    type: bool
  - nom: esperance_vie
    type: enum
    valeurs: [longue, intermediaire, limitee]
  - nom: risque_hypoglycemie_schema
    type: enum
    valeurs: [faible, eleve]
  - nom: terrain_fragile
    type: bool
    # I3/F4 (redteam-clinique-silences.md, 2026-07-26, 4ᵉ lot) : `hypo_severe_recurrente` ajouté ici.
    # Arbitrage référent À CONFIRMER : le signal était déjà décisif plus loin dans le nœud (déclencheur
    # indépendant de « Désintensifier / alléger le schéma »), mais jamais lu par « Choisir un analogue
    # basal de 2ᵉ génération » — même concept de sécurité, deux encodages (invariant I4). Choix retenu :
    # FUSION dans ce dérivé plutôt qu'un 2ᵉ déclencheur indépendant sur chaque option consommatrice,
    # pour qu'un futur consommateur de `terrain_fragile` hérite automatiquement du signal, sans risque de
    # ré-diverger comme ici. Conséquence : élargit aussi la population des alertes MCG « cibles
    # assouplies » (ci-dessous) à un patient dont le seul signal est cet antécédent.
    derive: "fragilite OR esperance_vie == limitee OR age >= 75 OR risque_hypoglycemie_schema == eleve OR hypo_severe_recurrente == true"
  - nom: hypo_severe_recurrente
    type: bool
  - nom: symptomes_glucotoxicite
    type: bool
  - nom: traitements_en_cours
    type: liste
    valeurs: [metformine, iSGLT2, aGLP1, tirzepatide, sulfamide, glinide, gliptine, insuline_basale, insuline_rapide]
  - nom: preference_injection
    type: enum
    valeurs: [accepte, refuse, indifferent]
  # T4/(a) (chantier visible_si, capture 7) : ce groupe de 7 champs n'a d'objet que pour un patient DÉJÀ
  # sous insuline (surveillance/titration) — un patient « naïf » n'a ni dose en cours ni MCG à interpréter.
  # Masquer les remet à leur valeur par défaut (P1) ; vérifié sans conséquence pour ces 7 : aucune règle
  # d'option ne les lit hors de leur situation propre, à l'exception des alertes I6/I7 (gatées par
  # `mcg_disponible == true`, donc naturellement inertes une fois celui-ci remis à `false`) et de l'alerte
  # `mcg_disponible == false` (piège actif, corrigée ci-dessous par un second terme de situation).
  - nom: mcg_disponible
    type: bool
    visible_si: "situation_insuline != naif"
  - nom: TBR
    type: nombre
    min: 0
    max: 100
    visible_si: "situation_insuline != naif"
  - nom: TBR_severe
    type: nombre
    min: 0
    max: 100
    # Piège P1 : également lu par l'alerte non filtrée `hypo_severe_recurrente == true OR CV_glycemique >
    # 36 OR TBR_severe > 1` (ci-dessous). Sans conséquence : remis à 0, ce terme de la disjonction devient
    # simplement toujours faux (0 n'est jamais > 1) — il ne peut pas déclencher l'alerte à tort ; les deux
    # autres termes de la disjonction restent, eux, de vrais signaux indépendants de la situation.
    visible_si: "situation_insuline != naif"
  - nom: CV_glycemique
    type: nombre
    min: 0
    max: 100
    # Même piège, même conclusion que TBR_severe ci-dessus (0 n'est jamais > 36).
    visible_si: "situation_insuline != naif"
  - nom: profil_glycemique
    type: liste
    valeurs: [hypo_nocturne, phenomene_aube, excursions_postprandiales, hypo_interprandiale, stable]
    visible_si: "situation_insuline != naif"
  - nom: GAJ
    type: nombre
    min: 0.4
    max: 5
    visible_si: "situation_insuline != naif"
  - nom: gaj_a_cible
    type: bool
    derive: "GAJ >= 0.7 AND GAJ <= 1.2"
  # E-03 (2026-07-26) : PIVOT nocturne de la situation « basale seule ». Référent, dit trois fois (dont
  # recette capture 8) : « titrer sur la courbe nocturne, pas la GAJ ; la GAJ est le cas de repli quand il
  # n'y a pas de MCG, ce qui est maintenant rare. » Ces deux dérivés lisent `profil_glycemique` (jamais
  # `GAJ`) et remplacent `gaj_a_cible` comme pivot de « Titrer la basale » / « Ne pas sur-titrer... »
  # QUAND `mcg_disponible == true` (`gaj_a_cible` reste le pivot du repli SANS MCG, comportement inchangé
  # — cf. ces deux options plus bas). Un seul niveau de dérivation (ne référencent que `profil_glycemique`,
  # jamais un autre dérivé — `deriveCritere.ts` n'enchaîne pas les dérivés).
  - nom: profil_nocturne_permet_titration
    type: bool
    # Vrai si le praticien a coché un profil qui n'écarte PAS la titration : « stable » (rien de notable,
    # pas d'hypo) ou « phénomène de l'aube » (glycémie qui remonte en fin de nuit — la basale est
    # insuffisante). ⚠ VIGILANCE (référent) : une liste VIDE (aucune case cochée) n'est PAS un profil
    # « stable » — `contient` exige la valeur explicitement cochée, un profil non renseigné reste donc
    # `false` ici (ni rassurant, ni un motif de titrer) — c'est le défaut D20 (ne jamais lire l'absence de
    # coche comme une réponse) qu'on évite ici SANS passer par le mécanisme `confirmation_requise` (qui ne
    # s'applique qu'à l'indétermination D20 ; ceci est une question de contenu clinique, pas de saisie
    # manquante — ce nœud ne déclare `confirmation_requise` sur aucun critère).
    derive: "profil_glycemique contient stable OR profil_glycemique contient phenomene_aube"
  - nom: profil_nocturne_a_cible
    type: bool
    # Vrai si le profil montre des excursions POST-PRANDIALES : la nuit/le jeûne sont déjà à la cible,
    # l'écart d'HbA1c est diurne — monter la basale n'aiderait pas (même rationale que `gaj_a_cible ==
    # true` côté GAJ). Volontairement restreint à cette seule valeur : `hypo_interprandiale` n'est PAS un
    # signal nocturne et n'implique rien sur la GAJ/le pivot (non tranché par le référent, laissé de côté).
    derive: "profil_glycemique contient excursions_postprandiales"
  - nom: poids
    type: nombre
    min: 35
    max: 250
  - nom: dose_basale_actuelle
    type: nombre
    min: 0
    max: 150
    # T4/(a) : un naïf n'a par définition aucune dose de basale en cours (12.10/capture 7) — pourtant
    # comptée parmi les critères décisifs non confirmés dans la recette. Sûr au masquage : aucune option
    # de la situation « naïf » ne lit ce champ ; `over_basalisation` resterait à 0 (faux), le comportement
    # déjà voulu pour un naïf.
    visible_si: "situation_insuline != naif"
  - nom: dose_rapide_actuelle
    type: nombre
    min: 0
    max: 150
    # Seul le `calculs` de « Optimiser la répartition du basal-bolus » lit ce champ (dose totale = basale +
    # rapide). I1/F2 (2026-07-26, 4ᵉ lot) : cette option couvre désormais aussi « basale_plus_bolus » (un
    # bolus y est déjà en place, donc `dose_rapide_actuelle` y est tout aussi réel qu'en « basal_bolus ») —
    # `visible_si` élargi en conséquence, sinon le calcul « dose totale » aurait silencieusement ignoré la
    # dose de bolus déjà administrée (remise à 0 par défaut) pour cette situation.
    visible_si: "situation_insuline == basal_bolus OR situation_insuline == basale_plus_bolus"
  - nom: over_basalisation
    type: bool
    derive: "dose_basale_actuelle / poids > 0.5"
options:
  # ═══════════ SITUATION 1 — NAÏF D'INSULINE ═══════════
  - intitule: "Envisager un GLP-1 (ou une association fixe basale + GLP-1) avant ou avec l'insuline"
    conditions:
      - "situation_insuline == naif"
      # 12.11 (recette) : sans ce second terme, cette option se déclenchait sur la seule situation —
      # préemptant structurellement le repli du nœud pour TOUTE entrée en situation « naïf ». Même
      # déclencheur que l'option sœur « Initier une insuline basale » (ligne suivante) : un naïf à
      # l'objectif et sans glucotoxicité n'a, à ce stade, aucun geste d'insulinothérapie à envisager.
      - "cible_atteinte == false OR symptomes_glucotoxicite == true"
    # R6 (docs/decision/GRAMMAIRE-NOEUD.md, arbitrage indication/prérequis) : garde-fou de cohérence
    # (ne pas déjà prendre la classe visée) — jamais montré comme justification.
    prerequis:
      - "traitements_en_cours ne_contient_pas aGLP1"
    priorite: 1
    avantages:
      - "Le GLP-1 (AR GLP-1 ou co-agoniste GIP/GLP-1) est préféré à l'insuline comme premier injectable (ADA 2026 rec 9.21 ; SFD 2025 Avis 19) : moins d'hypoglycémie, perte de poids, et bénéfice cardiovasculaire propre (démontré au niveau de la classe — voir nœud prescription) que l'insuline n'a pas (ORIGIN neutre)."
      - "Les associations à ratio fixe (IDegLira, iGlarLixi) simplifient le schéma (1 injection) tout en apportant l'effet du GLP-1."
    inconvenients:
      - "Effets indésirables digestifs ; le GLP-1 ne remplace pas l'insuline en cas de glucotoxicité sévère, de cétose ou d'hyperglycémie très symptomatique."
      - "Les associations fixes n'ont pas de CVOT dédié : leur bénéfice cardiovasculaire s'infère de leurs composants, il n'est pas démontré pour la combinaison elle-même."
    effet_attendu: >-
      Ajout d'un GLP-1 : baisse d'HbA1c avec perte de poids et peu d'hypoglycémie (chiffres et choix de la
      molécule : voir nœud prescription). Priorité EBM : épargner l'insuline tant qu'un GLP-1 est possible et suffisant.
    niveau_preuve: modere
  - intitule: "Initier une insuline basale (en maintenant les antidiabétiques en cours)"
    conditions:
      - "situation_insuline == naif"
      - "cible_atteinte == false OR symptomes_glucotoxicite == true"
    # R6 : garde-fou de cohérence — les déclarations « situation » et « traitements en cours » n'étaient
    # jamais recoupées (12.10, recette) : un patient déjà sous insuline basale mais dont la situation
    # restait déclarée « naïf » se voyait recommander de l'« initier » et une dose de départ calculée.
    prerequis:
      - "traitements_en_cours ne_contient_pas insuline_basale"
    priorite: 2
    avantages:
      - "L'insuline basale du soir associée aux antidiabétiques (oraux et/ou GLP-1) est l'insulinothérapie de choix du DT2 (ebmfrance/Duodecim, niveau B) ; réalisable en soins primaires."
      - "Meilleur profil hypoglycémie / poids que les schémas prandial ou prémélangé (4T : hypo 2,3 vs 12,0 événements/patient/an et poids +1,9 vs +5,7 kg vs prandial à 1 an)."
    inconvenients:
      - "Hypoglycémie (ORIGIN : hypo sévère 1,00 vs 0,31 pour 100 personnes-années) et prise de poids (~+1,6 kg) ; aucun bénéfice sur les événements cardiovasculaires (ORIGIN : MACE HR 1,02)."
      - "Le bénéfice microvasculaire est extrapolé du contrôle glycémique (UKPDS), non démontré par un essai dédié à l'insuline sur critère dur."
    effet_attendu: >-
      Dose d'initiation = poids × 0,1-0,2 U/kg/j (repli fixe : 10 U le soir — ebmfrance). Titration par
      auto-ajustement : +2 U si la glycémie à jeun est au-dessus de la cible 3 matins de suite (ou +10-20 % par
      paliers si dose > 40 U), à adapter tous les 3 jours ; cible de glycémie à jeun ~0,70-1,20 g/L
      (individualisée). Maintenir metformine ± iSGLT2 ± GLP-1 ; arrêter sulfamide/glinide (voir alerte).
    niveau_preuve: modere
    contre_indications:
      - "Pas de contre-indication absolue à l'insuline. Arrêter le sulfamide / glinide à l'introduction (risque d'hypoglycémie cumulée)."
    calculs:
      - { libelle: "Dose initiale (0,1 U/kg)", expression: "poids * 0.1", unite: "U/j" }
      - { libelle: "Dose initiale (0,2 U/kg)", expression: "poids * 0.2", unite: "U/j" }
  - intitule: "Choisir un analogue basal de 2ᵉ génération (glargine U300 ou degludec) si risque hypoglycémique"
    # Arbitrage référent 2026-07-26 (2ᵉ série, 12.6/12.7) : condition alignée sur `terrain_fragile` au lieu
    # du triplet brut `risque_hypoglycemie_schema == eleve OR fragilite == true OR esperance_vie == limitee`,
    # qui omettait l'âge — alors que `terrain_fragile` (age >= 75 inclus) gate déjà les alertes de cibles MCG
    # assouplies. Décision référent : aligner les OPTIONS sur `terrain_fragile` (pas l'inverse) — le
    # sur-traitement du sujet âgé est le risque autour duquel le nœud A est construit ; le manquer est plus
    # grave que de proposer l'analogue de 2ᵉ génération à tort.
    # I3/F4 (2026-07-26, 4ᵉ lot) : `terrain_fragile` inclut désormais `hypo_severe_recurrente` (cf.
    # `criteres_entree`) — cette option couvre donc maintenant aussi le patient dont le SEUL signal de
    # risque est un antécédent d'hypoglycémie sévère récurrente (auparavant silencieux ici alors que ce
    # même signal pilotait déjà « Désintensifier / alléger le schéma » plus loin dans ce nœud).
    conditions:
      - "situation_insuline == naif"
      - "terrain_fragile == true"
    priorite: 3
    avantages:
      - "Chez le patient à risque d'hypoglycémie (âgé, fragile, insuffisance rénale, hypoglycémies nocturnes), préférer glargine U300 ou degludec à glargine U100 / détémir, a fortiori à la NPH (ebmfrance niveau B ; SFD 2025 Avis 18 bis)."
      - "Réduction démontrée de l'hypoglycémie nocturne / symptomatique (SWITCH 2 : RR 0,70 globale, 0,58 nocturne ; EDITION U300 : −31 % nocturne)."
    inconvenients:
      - "Le bénéfice sur l'hypoglycémie SÉVÈRE (critère dur) n'est démontré que pour degludec vs glargine U100 (DEVOTE : RR 0,60, NNT ~59 sur ~2 ans, en population à très haut risque) ; il n'y a PAS de supériorité démontrée d'un analogue de 2ᵉ génération sur l'autre (BRIGHT : équivalence ; CONCLUDE : critère primaire négatif)."
      - "Pour la 1ʳᵉ génération vs NPH, la réduction de l'hypoglycémie sévère n'est PAS significative (Cochrane 2020 : RR 0,68, IC 0,46-1,01) ; surcoût à peser. Aucun bénéfice cardiovasculaire."
    effet_attendu: >-
      Recommandation au niveau de la CLASSE (« analogue basal de 2ᵉ génération : glargine U300 ou degludec »),
      l'EBM ne départageant pas les deux molécules (D12). Bénéfice attendu = moins d'hypoglycémie nocturne
      (substitut) ; hypoglycémie sévère : degludec vs glargine U100 seulement.
    niveau_preuve: modere
  # ═══════════ SITUATION 2 — BASALE SEULE À OPTIMISER ═══════════
  - intitule: "Corriger l'hypoglycémie ou la variabilité (réduire la dose, passer en 2ᵉ génération, relâcher la cible)"
    # I2/F3 (redteam-clinique-silences.md, 2026-07-26, 4ᵉ lot) : option RÉUTILISÉE (aucun contenu clinique
    # nouveau) pour couvrir aussi « basale_plus_bolus », qui n'avait jusqu'ici AUCUNE option de sécurité —
    # 401/401 profils du banc avec un signal d'hypoglycémie documenté (TBR > 4 OU TBR_severe > 1 OU
    # hypo_severe_recurrente) n'avaient aucune réponse, et les 2 options d'escalade de cette situation
    # (ci-dessous, même lot) portent désormais des `exclusions` sur ces mêmes signaux : sans ce relais,
    # l'exclusion aurait converti le défaut en silence (renvoyant au seul repli « Poursuivre... », dont le
    # texte affirme à tort « sans hypoglycémie » — R4/incertitudes).
    # 2ᵉ item en forme normale disjonctive (DSL sans parenthèses, AND prime sur OR) : les 4 signaux MCG
    # restent EXACTEMENT ceux de « basale_seule » (comportement rigoureusement inchangé pour cette
    # situation) ; `hypo_severe_recurrente == true` ne s'ajoute QUE pour « basale_plus_bolus » (dernier
    # terme, conjonction avec la situation) — c'est le seul signal qui déclenche cette option sur le
    # profil exact du rapport (TBR=1, TBR_severe=0 : les 4 signaux MCG n'y suffisent pas). Choix référent
    # À CONFIRMER (invariant 6) : `hypo_severe_recurrente` n'a volontairement PAS été ajouté au même titre
    # pour « basale_seule » — prudence de portée, hors mandat de ce lot, cf. incertitudes.
    conditions:
      - "situation_insuline == basale_seule OR situation_insuline == basale_plus_bolus"
      - "TBR > 4 OR TBR_severe > 1 OR CV_glycemique > 36 OR profil_glycemique contient hypo_nocturne OR situation_insuline == basale_plus_bolus AND hypo_severe_recurrente == true"
    priorite: 1
    avantages:
      - "Sécurité prioritaire : l'hypoglycémie est le critère DUR qui pilote le schéma. Réduire la basale de −2 à −4 U (ou −10-20 % de la dose actuelle), envisager un analogue de 2ᵉ génération, relâcher la cible."
    inconvenients:
      - "Peut relâcher transitoirement le contrôle glycémique — objectif assumé chez le patient à risque d'hypoglycémie."
    effet_attendu: >-
      Déclenchée par l'axe SÉCURITÉ de la MCG (TBR > 4 %, TBR sévère > 1 %, CV > 36 %) ou un profil AGP d'hypo
      nocturne. Sans MCG : hypoglycémies symptomatiques / glycémie à jeun basse répétée.
    niveau_preuve: modere
    calculs:
      - { libelle: "Basale réduite (−20 %)", expression: "dose_basale_actuelle * 0.8", unite: "U/j" }
  - intitule: "Ne pas sur-titrer la basale — intensifier autrement (GLP-1 puis bolus)"
    # Arbitrage référent 2026-07-26 (2ᵉ série) : condition ÉLARGIE pour éviter un MUTISME. `over_basalisation
    # == true` devient une exclusion de « Titrer la basale » (ci-dessous) ; sans ce second déclencheur, un
    # patient sur-basalisé (dose/poids > 0,5 U/kg) mais dont la glycémie à jeun reste hors cible
    # (`gaj_a_cible == false`) perdait TOUTE option en situation « basale seule » — échange perdant. Condition
    # validée par le référent, en forme normale disjonctive (le DSL n'a pas de parenthèses, AND prime sur OR) :
    # « situation_insuline == basale_seule AND cible_atteinte == false AND gaj_a_cible == true
    #   OR situation_insuline == basale_seule AND cible_atteinte == false AND over_basalisation == true ».
    # Les deux disjoncts partagent leurs 2 premiers termes (situation, cible_atteinte) : par distributivité,
    # encodée ci-dessous comme conjonction de 3 items `conditions` (le moteur les ANDe) dont le dernier est
    # le OR restant (`gaj_a_cible == true OR over_basalisation == true`) — logiquement identique au texte
    # validé, sans répétition. Rationale (mots du référent) : la sur-basalisation est EN ELLE-MÊME une raison
    # de ne pas titrer davantage, indépendamment de la glycémie à jeun — c'est ce que disait l'ex-alerte
    # `over_basalisation` (retirée de « Titrer la basale » ci-dessous) ; son propre texte devient le
    # déclencheur du geste alternatif.
    #
    # E-03 (2026-07-26) : le 3ᵉ item ci-dessous est réécrit pour le PIVOT nocturne (référent, 3 fois : « la
    # GAJ est le cas de repli quand il n'y a pas de MCG »). `gaj_a_cible == true` ne gouverne plus QUE le
    # repli sans MCG (`mcg_disponible == false`, comportement 2026-07-26 2ᵉ série inchangé) ; quand la MCG
    # est disponible, c'est `profil_nocturne_a_cible` (excursions post-prandiales : la nuit est déjà à la
    # cible, l'écart est diurne) qui joue le même rôle. `over_basalisation == true` reste un déclencheur
    # INDÉPENDANT de la MCG (3ᵉ terme de l'OR, inchangé) : la sur-basalisation est une raison de ne pas
    # titrer que la MCG soit disponible ou non.
    conditions:
      - "situation_insuline == basale_seule"
      - "cible_atteinte == false"
      - "mcg_disponible == false AND gaj_a_cible == true OR mcg_disponible == true AND profil_nocturne_a_cible == true OR over_basalisation == true"
    priorite: 2
    avantages:
      - "Glycémie à jeun à la cible (écart alors POST-PRANDIAL) — ou dose de basale déjà élevée (> 0,5 U/kg, repère « over-basalisation ») même si la glycémie à jeun reste hors cible : dans les deux cas, augmenter la basale n'aidera pas (ou plus) et majore l'hypoglycémie. Ajouter un GLP-1 (ou passer à une association fixe), sinon passer au bolus."
      - "Le GLP-1 / l'association fixe donne le même contrôle que le basal-bolus avec moins d'hypoglycémie et de poids (DUAL VII : HbA1c non-inférieure, hypo rate ratio 0,11, −3,6 kg, 1 injection vs ≥ 4 ; méta Eng vs basal-bolus : hypo RR 0,67)."
    inconvenients:
      - "Nécessite d'ajouter une classe (GLP-1) ou une injection prandiale ; le seuil de 0,5 U/kg est un repère, non validé par un essai."
    effet_attendu: >-
      Réorienter vers la couverture post-prandiale plutôt que d'empiler une basale inefficace. Renvoi à la
      situation « ajout d'un bolus » si le GLP-1 est déjà en place ou insuffisant.
    niveau_preuve: modere
    exclusions:
      - "TBR > 4"
      - "TBR_severe > 1"
      - "CV_glycemique > 36"
      - "profil_glycemique contient hypo_nocturne"
  - intitule: "Titrer la basale (augmenter la dose)"
    # E-03 (2026-07-26) : 3ᵉ item réécrit pour le PIVOT nocturne, symétrique de « Ne pas sur-titrer »
    # ci-dessus. Sans MCG (`mcg_disponible == false`) : repli inchangé sur `gaj_a_cible == false` (GAJ hors
    # cible). Avec MCG : `profil_nocturne_permet_titration` (« stable » ou « phénomène de l'aube » coché —
    # aucun signal d'hypo, rien n'écarte la titration) remplace la GAJ. Une liste `profil_glycemique` VIDE
    # (aucune case cochée) ne vaut PAS « stable » — `profil_nocturne_permet_titration` reste `false`, donc
    # cet item reste faux et l'option ne se propose pas en silence (cf. commentaire du dérivé,
    # `criteres_entree`) : absence de coche = ne pas se prononcer, jamais une lecture rassurante.
    conditions:
      - "situation_insuline == basale_seule"
      - "cible_atteinte == false"
      - "mcg_disponible == false AND gaj_a_cible == false OR mcg_disponible == true AND profil_nocturne_permet_titration == true"
    priorite: 3
    avantages:
      - "Glycémie à jeun au-dessus de la cible sans hypoglycémie : +2 U si la glycémie à jeun reste au-dessus de la cible 3 matins de suite (ou +10-20 % par paliers si dose > 40 U), à adapter tous les 3 jours. Algorithme validé (Treat-to-Target : ~60 % atteignent la cible)."
    inconvenients:
      - "Risque d'hypoglycémie si sur-titration — surveiller la glycémie à jeun basse / le temps sous la cible (TBR)."
    effet_attendu: "Titration simple, réalisable en soins primaires, guidée par la glycémie à jeun (ou la MCG : glucose nocturne / TAR nocturne)."
    niveau_preuve: modere
    calculs:
      - { libelle: "Basale après +2 U", expression: "dose_basale_actuelle + 2", unite: "U/j" }
    exclusions:
      - "TBR > 4"
      - "TBR_severe > 1"
      - "CV_glycemique > 36"
      - "profil_glycemique contient hypo_nocturne"
      - "over_basalisation == true"
    # Arbitrage référent 2026-07-26 (2ᵉ série) : `over_basalisation` passe d'ALERTE D21 (portée par cette
    # option depuis 2026-07-25, voir ex-commentaire ci-dessous) à EXCLUSION de cette même option. La
    # consigne D21 était erronée : une alerte d'option laisse la carte recommander « Titrer la basale, +2 U »
    # tout en affichant, sur cette même carte, un message disant de ne PAS poursuivre la majoration —
    # contradiction simplement déplacée d'un cran (avant D21 : contradiction nœud/option ; avec D21 :
    # contradiction interne à l'option). L'exclusion retire l'option quand elle se contredirait elle-même ;
    # le texte de l'ex-alerte devient, sur l'option « Ne pas sur-titrer la basale » ci-dessus, le
    # déclencheur (avec `gaj_a_cible`) du geste alternatif — cf. commentaire de cette option pour la
    # vérification d'absence de mutisme. Ancien texte D21 (pour mémoire) : « Dose basale déjà élevée
    # (> 0,5 U/kg — repère) : avant de poursuivre cette majoration, envisager plutôt l'ajout d'un GLP-1 ou
    # d'un bolus prandial (l'excès de basale majore l'hypoglycémie sans corriger l'écart post-prandial). »
  # ═══════════ SITUATION 3 — AJOUT D'UN BOLUS / BASAL-PLUS ═══════════
  # E-04b/E-06 (2026-07-26) : les DEUX options ci-dessous sont désormais aussi applicables en situation
  # « basale seule » (3ᵉ item du 1er `conditions`) — RÉUTILISÉES telles quelles (même intitulé, même
  # argumentaire, mêmes `prerequis`), pas de contenu clinique nouveau, conformément à la décision référent
  # (« appuie-toi sur l'option existante… plutôt que d'inventer »). Cause commune aux 2 vignettes : en
  # « basale seule », dès que le geste de SÉCURITÉ (« Corriger l'hypoglycémie… ») ou le geste
  # « Ne pas sur-titrer... » est indiqué (HbA1c au-dessus de la cible malgré tout), le patient restait SANS
  # AUCUNE option d'EFFICACITÉ — seul un texte en prose (`avantages` de « Ne pas sur-titrer... ») évoquait
  # le GLP-1/bolus, jamais une carte actionnable. Référent : « oui, action de contrôle glycémique en
  # fonction des autres critères : soit un traitement non insulinique, soit ajouter un bolus. » Sécurité et
  # efficacité sont CUMULABLES, jamais une alternative — les deux options ci-dessous s'ajoutent donc à côté
  # du geste de sécurité/temporisation, sans le remplacer ; le choix entre elles reste porté par leurs
  # `prerequis` existants (ne pas déjà prendre la classe visée), déjà « les critères déjà collectés ».
  #
  # Déclencheur en « basale seule » : `cible_atteinte == false` ET l'un des 2 signaux nommés par le
  # référent — hypoglycémie/variabilité nocturne (les 4 termes du déclencheur de « Corriger
  # l'hypoglycémie… », répétés ici à l'identique, aucun contenu nouveau) OU sur-basalisation
  # (`over_basalisation == true`, même dérivé que « Ne pas sur-titrer... »). ⚠ Portée volontairement
  # LIMITÉE à ces 2 signaux explicitement nommés : le cas « GAJ/profil nocturne déjà à la cible, sans
  # aucun autre signal » (`gaj_a_cible == true` seul, ou son équivalent MCG `profil_nocturne_a_cible`)
  # n'ouvre PAS ce déclencheur — laissé en l'état (prose seule sur « Ne pas sur-titrer... »), non demandé
  # par le référent, non testé par une vignette ; signalé comme limite plutôt que généralisé sans mandat.
  - intitule: "Ajouter un GLP-1 / une association fixe d'abord (si non encore fait)"
    conditions:
      - "situation_insuline == basale_plus_bolus OR situation_insuline == basale_seule"
      # 12.11 (recette) : condition unique = situation, préemptant le repli pour toute entrée en
      # « basale_plus_bolus ». Ce geste d'intensification n'a d'objet que si l'objectif n'est pas atteint.
      - "cible_atteinte == false"
      # E-04b/E-06 : en « basale_plus_bolus », 1er terme toujours vrai (comportement inchangé, aucun
      # déclencheur supplémentaire) ; en « basale_seule », le 1er terme est faux et seul l'un des 5
      # signaux restants peut satisfaire cet item — cf. bloc de commentaire ci-dessus.
      - "situation_insuline == basale_plus_bolus OR TBR > 4 OR TBR_severe > 1 OR CV_glycemique > 36 OR profil_glycemique contient hypo_nocturne OR over_basalisation == true"
    # R6 : garde-fou de cohérence (ne pas déjà prendre l'une des classes visées) — jamais montré comme
    # justification.
    prerequis:
      - "traitements_en_cours ne_contient_pas aGLP1 AND traitements_en_cours ne_contient_pas tirzepatide"
    priorite: 1
    avantages:
      - "Avant tout bolus prandial : ajouter un GLP-1 ou passer à une association fixe (IDegLira, iGlarLixi) — même HbA1c que le basal-bolus, avec moins d'hypoglycémie et de poids et une seule injection (DUAL VII ; métas Eng, Maiorino)."
    inconvenients:
      - "Effets digestifs ; pas de CVOT dédié aux associations fixes (bénéfice substitutif)."
    effet_attendu: "Épargne d'insuline prandiale et bénéfice pondéral ; réserver le bolus aux cas où basale + GLP-1 restent insuffisants."
    niveau_preuve: modere
    # I2/F3 (redteam-clinique-silences.md, 2026-07-26, 4ᵉ lot) : AUCUNE exclusion ne portait jusqu'ici sur
    # cette option, contrairement à « Titrer la basale » (4 signaux). 401/401 profils du banc en
    # « basale_plus_bolus » avec un signal d'hypoglycémie documenté (TBR > 4 OU TBR_severe > 1 OU
    # hypo_severe_recurrente) recevaient malgré tout une escalade sans aucun garde-fou. Modèle repris :
    # les 4 signaux MCG de « Titrer la basale » (`over_basalisation` exclu à dessein — repère de
    # sur-titration de la BASALE, sans rapport avec l'ajout d'un GLP-1/bolus, et déjà ce qui pousse VERS
    # cette option ailleurs dans ce nœud) + `hypo_severe_recurrente`, absent du modèle cité par la mission
    # mais nécessaire pour couvrir le profil exact du rapport (TBR=1, TBR_severe=0 : seul ce signal
    # déclenche l'exclusion) — même signal déjà utilisé comme déclencheur indépendant ailleurs dans ce
    # nœud (ex-« Désintensifier », désormais fondu dans `terrain_fragile`, cf. I3/F4). Choix référent À
    # CONFIRMER (invariant 6) : extension au-delà des 4 signaux cités par la mission. GATÉ sur
    # `situation_insuline == basale_plus_bolus` pour laisser INCHANGÉ le comportement de cette même option
    # en « basale_seule » (E-06, référent 2026-07-26 : sécurité et efficacité y sont explicitement
    # CUMULABLES, pas une exclusion) — sans ce garde de situation, ces mêmes 5 termes casseraient la
    # vignette E-06. Réponse laissée en cas d'exclusion (R4, jamais un silence) : « Corriger
    # l'hypoglycémie ou la variabilité... » couvre désormais aussi « basale_plus_bolus » (même lot,
    # ci-dessus).
    exclusions:
      - "situation_insuline == basale_plus_bolus AND TBR > 4"
      - "situation_insuline == basale_plus_bolus AND TBR_severe > 1"
      - "situation_insuline == basale_plus_bolus AND CV_glycemique > 36"
      - "situation_insuline == basale_plus_bolus AND profil_glycemique contient hypo_nocturne"
      - "situation_insuline == basale_plus_bolus AND hypo_severe_recurrente == true"
  - intitule: "Ajouter un bolus au repas principal (basal-plus, par étapes)"
    conditions:
      - "situation_insuline == basale_plus_bolus OR situation_insuline == basale_seule"
      # 12.11 (recette) : même préemption que l'option précédente, condition unique = situation.
      - "cible_atteinte == false"
      # E-04b/E-06 : même déclencheur que l'option sœur ci-dessus, cf. le bloc de commentaire de tête de
      # situation.
      - "situation_insuline == basale_plus_bolus OR TBR > 4 OR TBR_severe > 1 OR CV_glycemique > 36 OR profil_glycemique contient hypo_nocturne OR over_basalisation == true"
    # R6 : garde-fou de cohérence — même faille que « Initier une insuline basale » (12.10) : sans ce
    # prérequis, un bolus déjà en place pouvait être re-« ajouté ».
    prerequis:
      - "traitements_en_cours ne_contient_pas insuline_rapide"
    priorite: 2
    avantages:
      - "Commencer par UN bolus d'analogue rapide au repas le plus hyperglycémiant (guidé par le profil AGP : excursions post-prandiales), plutôt qu'un basal-bolus complet d'emblée : non-inférieur avec moins d'hypoglycémie (FullSTEP : rate ratio 0,58) et une meilleure satisfaction."
    inconvenients:
      - "Ajoute une injection et une autosurveillance (profils capillaires 6-7 points si pas de MCG). N'escalader vers 2 puis 3 bolus que si nécessaire."
    effet_attendu: >-
      Dose de bolus ≈ 10 % de la dose basale (ou 4 U), 10-15 min avant le repas ; ajuster sur la glycémie
      post-prandiale (< 1,80 g/L à 2 h) ou le TAR post-prandial.
    niveau_preuve: modere
    calculs:
      - { libelle: "Bolus initial (~10 % de la basale)", expression: "dose_basale_actuelle * 0.1", unite: "U" }
    # I2/F3 (redteam-clinique-silences.md, 2026-07-26, 4ᵉ lot) : même défaut, même correctif que l'option
    # sœur ci-dessus (« Ajouter un GLP-1... ») — cf. son commentaire pour le détail du modèle repris
    # (« Titrer la basale ») et du choix d'y ajouter `hypo_severe_recurrente`. C'est d'ailleurs CETTE
    # option qui était la sortie observée sur le profil exact du rapport (« Ajouter un bolus au repas
    # principal », seule applicable — le GLP-1 sœur étant déjà bloquée par son `prerequis`, tirzépatide en
    # cours) : ajouter un bolus prandial à un patient dont l'antécédent d'hypoglycémie sévère récurrente
    # est coché est le cas le plus direct que cette exclusion doit couvrir. Même garde de situation, même
    # raison (E-06, basale_seule inchangée).
    exclusions:
      - "situation_insuline == basale_plus_bolus AND TBR > 4"
      - "situation_insuline == basale_plus_bolus AND TBR_severe > 1"
      - "situation_insuline == basale_plus_bolus AND CV_glycemique > 36"
      - "situation_insuline == basale_plus_bolus AND profil_glycemique contient hypo_nocturne"
      - "situation_insuline == basale_plus_bolus AND hypo_severe_recurrente == true"
  - intitule: "Insuline prémélangée — option dégradée, dernier recours"
    conditions:
      - "situation_insuline == basale_plus_bolus"
      - "preference_injection == refuse"
    priorite: 3
    avantages:
      - "Uniquement si le patient refuse les injections multiples et a des repas réguliers (ADA 2026) : 1-2 prémélangées/jour, plus simple qu'un basal-bolus."
    inconvenients:
      - "Non fondé sur les preuves en 1ʳᵉ intention (ebmfrance) : moins souple, plus d'hypoglycémie et de poids (Bertuol : biphasique −0,24 % d'HbA1c seulement ; 4T : le moins performant pour la cible). À ne JAMAIS proposer avant un GLP-1 / une association fixe ou un basal-plus."
    effet_attendu: "Compromis de simplicité pour un patient réticent aux injections multiples, au prix d'un moins bon rapport bénéfice/risque que l'association fixe ou le basal-plus."
    niveau_preuve: faible
  # ═══════════ SITUATION 4 — BASAL-BOLUS COMPLET ═══════════
  - intitule: "Désintensifier / alléger le schéma"
    # Arbitrage référent 2026-07-26 (2ᵉ série, 12.6/12.7) : condition alignée sur `terrain_fragile` — même
    # décision que ci-dessus pour « Choisir un analogue... » (situation « naïf »). Cas vérifié : patient de
    # 80 ans, HbA1c 6 % pour une cible de 7 %, sous basal-bolus, case « fragile » NON cochée — ne recevait
    # aucun allègement (âge absent de l'ancienne condition) ; `terrain_fragile` (age >= 75 inclus) corrige.
    # RÉSOLU 2026-07-26 (4ᵉ lot, I3/F4 — cf. `redteam-clinique-silences.md`) : le point ci-dessus, laissé
    # ouvert plus tôt le même jour, est tranché. `hypo_severe_recurrente` figurait ici en OR littéral, et
    # nulle part ailleurs — le même concept de sécurité (antécédent d'hypoglycémie sévère) n'orientait PAS
    # le choix de la molécule à l'initiation (« Choisir un analogue... »), silence relevé par le red-team.
    # Arbitrage retenu : FUSION dans `terrain_fragile` (cf. `criteres_entree`) plutôt qu'un 2nd déclencheur
    # indépendant sur chaque option consommatrice — un concept, un encodage (invariant I4). Le OR littéral
    # `hypo_severe_recurrente == true` est donc RETIRÉ ici : redondant, `terrain_fragile` le couvre déjà.
    # Comportement de CETTE option rigoureusement inchangé pour tout profil déjà testé (E-07/E-08 : `hypo_
    # severe_recurrente` y vaut `false`) ; seul gagne un cas nouveau, non testé avant ce lot : basal-bolus,
    # SEUL signal = hypo_severe_recurrente (ni fragile, ni âgé, ni EV limitée, ni risque de schéma élevé).
    # À confirmer par le référent (invariant 6) : la fusion élargit aussi la population des alertes MCG
    # « cibles assouplies » (ci-dessous) au même signal — cf. incertitudes.
    conditions:
      - "situation_insuline == basal_bolus"
      - "terrain_fragile == true"
    priorite: 1
    avantages:
      - "Chez le sujet fragile, à espérance de vie limitée ou avec hypoglycémies sévères : relâcher la cible, simplifier le schéma, réduire les doses (à partir des doses actuelles), envisager un GLP-1 pour réduire les besoins en insuline. Éviter le surtraitement (HAS 2024 R.103 ; SFD 2025 Avis 21)."
    inconvenients:
      - "Contrôle glycémique volontairement moins strict — bénéfice = réduction du risque d'hypoglycémie."
    effet_attendu: "Priorité à la sécurité et à la qualité de vie ; cibles glycémiques et de MCG relâchées (voir alerte)."
    niveau_preuve: modere
  - intitule: "Optimiser la répartition du basal-bolus (guidé par l'AGP et les doses actuelles)"
    # 12.11 (recette) : condition unique = situation, préemptant le repli — un patient à l'objectif,
    # sans hypoglycémie ni variabilité, recevait quand même cette option sur le seul fait d'être sous
    # basal-bolus. Mêmes seuils que la situation « basale seule » (TBR/TBR_severe/CV_glycemique/
    # hypo nocturne) : il n'y a rien à optimiser si le contrôle est atteint et le schéma stable.
    #
    # I1/F2 (redteam-clinique-silences.md, 2026-07-26, 4ᵉ lot) : 1er item ÉLARGI à « basale_plus_bolus »
    # (RÉUTILISATION, aucun contenu clinique nouveau). Jusqu'ici, une fois les 2 options d'escalade de
    # cette situation épuisées (GLP-1/tirzépatide ET bolus déjà en place), le patient retombait sur le
    # seul repli « Poursuivre... » malgré une cible non atteinte (60/92 profils du banc, F2). Le calcul
    # « Dose totale quotidienne » (basale + rapide, ci-dessous) reste correct : `dose_rapide_actuelle` est
    # désormais aussi visible en « basale_plus_bolus » (cf. `criteres_entree`, même lot). Portée non
    # affinée (limite du moteur, R3 `docs/decision/GRAMMAIRE-NOEUD.md` — « ce qui ne s'encode pas ») :
    # cette option devient offerte dès `cible_atteinte == false` en « basale_plus_bolus », QUE les 2
    # options d'escalade soient épuisées (prerequis) ou non — le moteur ne sait pas conditionner une
    # option sur l'inapplicabilité d'une autre. Sans conséquence clinique pour le patient (options
    # cumulables, principe déjà établi E-04b/E-06 de ce nœud) ; cf. incertitudes pour le chevauchement de
    # `priorite` que cela introduit avec les options d'escalade réutilisées.
    conditions:
      - "situation_insuline == basal_bolus OR situation_insuline == basale_plus_bolus"
      - "cible_atteinte == false OR TBR > 4 OR TBR_severe > 1 OR CV_glycemique > 36 OR profil_glycemique contient hypo_nocturne"
    priorite: 2
    avantages:
      - "Prise en charge du basal-bolus par le médecin généraliste : équilibrer basal/bolus (~50/50) et ajuster à partir des doses actuelles, guidé par le profil AGP — hypo nocturne → réduire la basale ; phénomène de l'aube → augmenter la basale ; excursions post-prandiales → augmenter le bolus / avancer le timing ; hypo interprandiale → réduire le bolus."
    inconvenients:
      - "Le calcul formel des ratios glucides-insuline et du facteur de sensibilité n'est pas inclus (éducation spécialisée). Si le déséquilibre PERSISTE malgré l'optimisation, ou en situation particulière → orienter vers le spécialiste (voir alerte)."
    effet_attendu: "Ajustement lisible, piloté par la forme des courbes (AGP) et les doses en cours, dans le périmètre de la médecine générale."
    niveau_preuve: faible
    calculs:
      - { libelle: "Dose totale quotidienne", expression: "dose_basale_actuelle + dose_rapide_actuelle", unite: "U/j" }
  - intitule: "Poursuivre le schéma d'insuline en cours et réévaluer"
    conditions:
      - "default"
    avantages:
      - "Aucun ajustement n'est indiqué : objectif atteint, sans hypoglycémie ni variabilité justifiant une correction et sans levier d'intensification à mobiliser. Poursuivre le schéma et réévaluer à 3-6 mois."
    inconvenients:
      - "Réévaluer à chaque consultation la tolérance, les hypoglycémies et l'adhésion : l'apparition d'une hypoglycémie, d'une variabilité excessive ou d'un objectif manqué rouvre l'ajustement."
    effet_attendu: >-
      Pas de modification. Surveillance du contrôle, de la tolérance et de l'apparition d'un signal de
      sécurité.
    niveau_preuve: faible
alertes:
  # E-02 (2026-07-26). Référent : « si il est naïf, il ne peut pas avoir une basale dans son traitement —
  # c'est une erreur du praticien. » Le prérequis 12.10 (recette 2026-07-25) fait déjà TAIRE
  # silencieusement « Initier une insuline basale » quand ce cas se présente (`traitements_en_cours
  # ne_contient_pas insuline_basale`, correct et inchangé) — mais rien ne le DISAIT au praticien. Alerte de
  # NŒUD (D15, jamais liée à une option retenue) : le fait est vrai quel que soit le geste par ailleurs
  # affiché, c'est une incohérence de SAISIE (situation vs traitements déclarés), pas une observation
  # clinique sur le patient.
  - quand: "situation_insuline == naif AND traitements_en_cours contient insuline_basale"
    niveau: attention
    message: >-
      Incohérence de saisie : la situation « naïf d'insuline » et une insuline basale déjà cochée dans les
      traitements en cours sont contradictoires — un patient naïf ne peut pas être déjà sous insuline basale.
      Vérifier la situation renseignée ou la liste des traitements en cours.
  - quand: "hypo_severe_recurrente == true OR CV_glycemique > 36 OR TBR_severe > 1"
    niveau: attention
    message: >-
      Orienter vers le spécialiste (± pompe à insuline / boucle fermée = centres initiateurs) si le déséquilibre
      PERSISTE malgré l'optimisation, ou en situation particulière : hypoglycémies sévères récurrentes /
      non-perception, instabilité marquée (CV élevé, temps en hypoglycémie sévère), grossesse ou projet de
      grossesse. En attendant : relâcher l'objectif, envisager une 2ᵉ génération, éduquer, envisager une MCG.
  - quand: "traitements_en_cours contient sulfamide OR traitements_en_cours contient glinide"
    niveau: attention
    message: "À l'introduction ou l'intensification de l'insuline : arrêter le sulfamide / le glinide (risque d'hypoglycémie cumulée)."
  - quand: "traitements_en_cours contient iSGLT2"
    niveau: attention
    message: >-
      iSGLT2 + insuline : maintenir l'iSGLT2 pour le bénéfice cardio-rénal, mais informer du risque
      d'acidocétose euglycémique — suspendre en cas de jeûne, de chirurgie ou de maladie aiguë intercurrente.
  - quand: "DFG < 45"
    niveau: attention
    message: >-
      Insuffisance rénale : besoins en insuline réduits et risque d'hypoglycémie majoré (adapter les doses,
      renforcer la surveillance) ; sulfamide (s'il est encore utilisé) : gliclazide/glimépiride à dose réduite
      et surveillance rapprochée si DFG 30-44, contre-indiqué si DFG < 30 (convention KDIGO/SFD — cf. nœud
      prescription, place résiduelle SU/gliptine) ; adapter ou arrêter la metformine selon le DFG.
  - quand: "mcg_disponible == true AND terrain_fragile == false"
    niveau: info
    message: >-
      Cibles de MCG standard (consensus international Battelino 2019 — repères d'interprétation, PAS un critère
      dur validé sur les complications) : temps dans la cible (TIR) > 70 %, temps en hypoglycémie (TBR) < 4 %
      et < 1 % (< 54 mg/dL), temps au-dessus (TAR) < 25 % et < 5 % (> 250 mg/dL), coefficient de variation ≤ 36 %.
  - quand: "mcg_disponible == true AND terrain_fragile == true"
    niveau: info
    message: >-
      Sujet âgé / fragile / à haut risque d'hypoglycémie : cibles de MCG ASSOUPLIES — TIR > 50 %, TBR < 1 %,
      TAR plus permissif (cohérent avec la cible d'HbA1c relâchée issue du nœud A).
  - quand: "mcg_disponible == false AND situation_insuline != naif"
    # Garde-fou T4/P1 (chantier visible_si) : `mcg_disponible` est masqué (donc remis à `false`, sa valeur
    # par défaut) pour la situation « naïf » (cf. `criteres_entree` ci-dessus). Sans ce second terme, le
    # masquage AFFIRMERAIT — via cette alerte non filtrée — un message de titration prématuré pour un
    # patient qui n'a pas encore d'insuline à titrer.
    niveau: info
    message: >-
      Sans MCG : titrer la basale sur la glycémie à jeun (cible ~0,70-1,20 g/L) ; utiliser des profils
      capillaires 6-7 points (avant/après les 3 repas + coucher) pour guider l'intensification prandiale.
  - quand: "default"
    niveau: info
    message: >-
      L'insuline améliore le contrôle glycémique et prévient les complications microvasculaires, mais N'A PAS
      de bénéfice cardiovasculaire démontré (ORIGIN neutre) : ne pas la survendre ; surveiller le poids et les
      hypoglycémies, et maintenir les traitements à bénéfice cardio-rénal (iSGLT2, GLP-1).
argumentaire: >
  Quand une insuline devient nécessaire dans le DT2, le schéma de choix est une insuline BASALE ajoutée aux
  antidiabétiques (oraux et/ou GLP-1), le GLP-1 étant préféré comme premier injectable (ADA 2026, SFD 2025) ;
  les schémas prandial et prémélangé systématiques ne sont pas fondés sur les preuves (surcroît d'hypoglycémie
  et de poids sans gain durable — 4T, Bertuol). L'intensification privilégie le GLP-1 ou l'association fixe
  AVANT le bolus (même contrôle que le basal-bolus, moins d'hypoglycémie et de poids — DUAL VII, méta Eng),
  puis le basal-plus par étapes avant le basal-bolus complet (FullSTEP). Le choix de molécule et de cible se
  pilote sur le RISQUE hypoglycémique : analogues de 2ᵉ génération (glargine U300 ou degludec) si risque
  élevé, fragilité ou hypoglycémies nocturnes — bénéfice démontré sur l'hypoglycémie nocturne (substitut), et
  sur l'hypoglycémie sévère pour degludec vs glargine U100 seulement (DEVOTE, NNT ~59). L'insuline est
  cardiovasculairement neutre (ORIGIN) : son bénéfice est glycémique et microvasculaire (extrapolé), jamais
  une promesse de survie. Les métriques de MCG servent l'INTERPRÉTATION (lecture de l'AGP) et les ALERTES de
  sécurité — leurs cibles sont un consensus d'experts, pas un critère dur (le lien TIR-complications est
  observationnel, le bénéfice de la MCG en DT2 porte sur des substituts) ; seule la dimension hypoglycémie
  (TBR, variabilité, hypo nocturnes) pilote des recommandations de sécurité. Les doses d'initiation et
  d'ajustement se calculent à partir du poids et des doses en cours (ratios dans l'argumentaire exhaustif),
  dans le périmètre de la médecine générale (basale → basal-bolus), l'orientation vers le spécialiste étant
  réservée au déséquilibre persistant ou aux situations particulières.
