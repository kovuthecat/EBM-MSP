        chantier-2026-07-26/sourcage-position-critique.md` (occurrences IN11/IN12/IN13/IN14).
    - date: "2026-07-26"
      auteur: "Claude Code"
      resume: >-
        4ᵉ lot 2026-07-26, correctifs ciblés issus du red-team clinique « silence et omission »
        (`docs/decision/validation/chantier-2026-07-26/redteam-clinique-silences.md`, findings F2/F3/F4
        sur ce nœud — angle : patient qui a besoin d'un geste et reçoit un silence, ou une escalade sans
        contrepoids de sécurité). Périmètre strict : `insuline.yaml` + `insuline.argumentaire.md` +
        `evaluateNode.insuline.test.ts` (3 agents en parallèle sur d'autres nœuds). (1) F3/I2, PRIORITÉ —
        situation « basale_plus_bolus » : les 2 options d'escalade (« Ajouter un GLP-1... », « Ajouter un
        bolus... ») n'avaient AUCUNE `exclusions`, contrairement à « Titrer la basale » (4 signaux) — 401
        profils du banc avec un signal d'hypoglycémie documenté recevaient malgré tout une escalade sans
        garde-fou. `exclusions` ajoutées (modèle « Titrer la basale » : TBR/TBR_severe/CV_glycemique/
        profil nocturne, + `hypo_severe_recurrente` — 5ᵉ signal nécessaire pour couvrir le profil exact du
        rapport, extension au-delà des 4 cités par la mission, à confirmer par le référent), GATÉES sur
        `situation_insuline == basale_plus_bolus` pour laisser `basale_seule` rigoureusement inchangée
        (E-06 : sécurité et efficacité y sont explicitement cumulables). R4 (jamais un silence à la place
        d'un défaut) : « Corriger l'hypoglycémie ou la variabilité... » (jusqu'ici propre à « basale
        seule ») est RÉUTILISÉE (aucun contenu clinique nouveau) pour couvrir aussi « basale_plus_bolus »,
        déclenchée par les mêmes 4 signaux MCG + `hypo_severe_recurrente` (ce dernier UNIQUEMENT pour
        cette situation). (2) F2/I1 — même situation, silence total une fois les 2 gestes d'ajout épuisés
        malgré une cible non atteinte (60/92 profils) : « Optimiser la répartition du basal-bolus »
        (jusqu'ici propre à « basal_bolus ») RÉUTILISÉE pour couvrir aussi « basale_plus_bolus » ; son
        calcul « dose totale » reste correct grâce à l'élargissement du `visible_si` de
        `dose_rapide_actuelle`. Limite assumée et documentée (`incertitudes`) : le moteur ne sait pas
        conditionner cette réutilisation sur « les 2 options d'ajout sont épuisées » (R3), elle s'offre
        donc dès `cible_atteinte == false` en « basale_plus_bolus », cumulée avec les options d'escalade
        si elles restent par ailleurs applicables — sans conséquence clinique (options cumulables, déjà le
        principe du nœud). (3) F4/I3 — ARBITRAGE : `hypo_severe_recurrente`, signal de sécurité le plus
        direct du nœud, n'orientait jamais le choix de la molécule à l'initiation (« Choisir un analogue
        basal de 2ᵉ génération » ne lisait que `risque_hypoglycemique_eleve`), alors qu'il pilotait déjà, en OR
        littéral, « Désintensifier / alléger le schéma » plus loin dans le même nœud — même concept de
        sécurité, deux encodages (invariant I4, cité nommément pour ce nœud dans
        `docs/decision/CONSTRUIRE-UN-MODULE.md`). Choix retenu (arbitrage possible dans les deux sens,
        laissé au jugement de ce lot) : FUSION de `hypo_severe_recurrente` dans le dérivé `risque_hypoglycemique_eleve`
        plutôt qu'un 2nd déclencheur indépendant par option consommatrice — un futur consommateur hérite
        automatiquement du signal, sans risque de re-diverger comme ici ; le OR littéral, devenu redondant,
        est retiré de « Désintensifier ». Effet de bord à confirmer par le référent : élargit aussi la
        population des 2 alertes « cibles MCG assouplies »/« cibles MCG standard » au même signal. 4
        nouvelles vignettes (`evaluateNode.insuline.test.ts`, profils exacts du rapport red-team) ; les 10
        vignettes existantes non touchées, vérifiées vertes. `rhd-alimentation` (couverture rouge, hors
        périmètre de cette tâche) non touché.
