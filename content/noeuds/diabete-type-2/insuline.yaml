  synthese_critique:
    donnee: >-
      Schéma de choix = insuline basale ajoutée aux antidiabétiques oraux/GLP-1, avec le meilleur profil
      tolérance/poids observé en essai randomisé (4T : hypo 2,3 vs 12,0 évén./patient/an, poids +1,9 vs
      +5,7 kg vs un schéma prandial à 1 an, PMID 17890232) ; les schémas prandial et prémélangé
      systématiques restent hors 1ʳᵉ intention (gain d'HbA1c modeste, −0,24 à −0,38 %, critère de
      substitution — Bertuol, méta-analyse en réseau 2026, 58 essais/19 122 patients) ; le GLP-1 est
      préféré avant tout bolus, avec un contrôle équivalent et moins d'hypoglycémie/de poids (DUAL VII ;
      métas Eng et Maiorino). Vigilance sur le surtraitement du sujet âgé : aucune métrique, HbA1c ou
      MCG, ne prédit fiablement le risque d'hypoglycémie, et les cibles de Time in Range restent un
      consensus d'experts (Battelino/ATTD 2019), non un critère dur validé sur les complications — le
      lien TIR-complications est observationnel (Beck 2019 en DT1 ; Lu 2021 en DT2). Insuline en ajout
      lorsque l'HbA1c est très élevée ou si éviter la prise de poids n'est pas prioritaire ; effets
      indésirables : hypoglycémie, prise de poids, aggravation d'une rétinopathie préexistante en cas de
      baisse rapide de l'HbA1c. Remarque de sourçage : la synthèse Prescrire consultée ne traite pas la
      hiérarchie NPH / analogues de 2ᵉ génération — cet argument s'appuie ici sur les essais dédiés
      (SWITCH 2, DEVOTE, EDITION, BRIGHT, CONCLUDE, Cochrane Semlitsch).
    references:
      - nom: "ebmfrance/Duodecim"
        lien: "https://www.ebmfrance.net/Guidelines/Details/ebm00491"
      - nom: "Médicalement Geek / DragiWebdo"
      - nom: "Prescrire"
        detail: "Résumé sous droit d'auteur ; réf. prescrire-dt2.md P1/P3/P5/P8."
  reco_officielle:
    source: >-
      SFD 2025 (Darmon P et al., Médecine des maladies Métaboliques 2025;19(8):630-662) — reco française de
      référence affichée ; HAS 2024 (« Stratégie thérapeutique du patient vivant avec un DT2 ») ; ADA Standards
      of Care 2026 (chap. 7 Technologie & 9 Traitement pharmacologique) ; ADA/EASD 2022 (Davies, PMID 36148880) ;
      AACE 2022/2026. Position d'experts MCG en médecine générale : Joubert M et al. 2025 (Méd. Mal. Métab. 19:331-347).
    position: >-
      Consensus : insuline basale ajoutée aux antidiabétiques ; GLP-1 préféré comme premier injectable et avant
      le bolus (SFD 2025 Avis 19, ADA 2026 rec 9.21) ; analogues de 2ᵉ génération si risque d'hypoglycémie
      (SFD 2025 Avis 18 bis) ; désintensification du sujet âgé (SFD 2025 Avis 21, HAS 2024 R.103) ; MCG
      recommandée et remboursée chez le patient traité par insuline (SFD 2025 Avis 23, ADA 2026 rec 7.15 grade A),
      avec les cibles de Time in Range de Battelino 2019.
    divergence: true
    explication: >-
      Deux frictions officielles : (1) la HAS 2024 (R.88, grade accord d'experts) place l'insuline prémélangée
      à parité avec le basal-bolus et reste muette sur la préférence 2ᵉ génération et sur « le GLP-1 avant le
      bolus » — deux préférences appuyées sur des essais publiés : réduction démontrée de l'hypoglycémie
      nocturne (SWITCH 2 RR 0,70 ; EDITION U300 −31 %) et, vs glargine U100, de l'hypoglycémie sévère (DEVOTE,
      NNT ~59/2 ans) pour le choix de génération ; même contrôle avec moins d'hypoglycémie et de poids
      (DUAL VII ; méta Eng/Maiorino) pour le GLP-1 avant le bolus — la SFD 2025 les énonce explicitement, la
      HAS reste silencieuse ; (2) sur la MCG / le Time in Range, un axe SFD 2025 / ADA 2026 technophile (MCG
      grade A, délivrance automatisée d'insuline désormais proposée aussi en DT2, avec d'importants conflits
      d'intérêt avec les fabricants de dispositifs) s'oppose à une HAS réservée (MCG « encouragée », sans
      cible de TIR) et au fait que les cibles de Time in Range restent un consensus d'experts (Battelino/ATTD
      2019), non un critère dur — le lien TIR-complications est observationnel (Beck 2019 en DT1 ; Lu 2021 en
      DT2) et aucune métrique ne prédit fiablement l'hypoglycémie, d'où un risque de surtraitement guidé par
      la technologie. L'outil affiche la reco française (SFD 2025, convergente avec l'EBM sur l'essentiel) et
      signale ces divergences ; il ne revendique jamais de bénéfice cardiovasculaire pour l'insuline (ORIGIN
      neutre).
incertitudes:
  - "MCG : les cibles (TIR > 70 %, etc.) sont un consensus d'experts (Battelino 2019), pas un critère dur ; le lien TIR-complications est observationnel (Beck, ré-analyse du DCCT en DT1 ; Lu, cohorte T2D) ; le bénéfice de la MCG en DT2 porte sur des substituts (HbA1c, TIR), sans preuve sur les complications dures ni la mortalité (Jancev)."
  - "Bénéfice microvasculaire de l'insuline = extrapolé du contrôle glycémique (UKPDS), non démontré par un essai dédié à l'insuline sur critère dur."
  - "Seuil d'over-basalisation de 0,5 U/kg = repère (SFD / Médicalement Geek), non validé par un essai — à confirmer ; modélisé, depuis 2026-07-26, comme EXCLUSION dure de « Titrer la basale » et déclencheur (avec `gaj_a_cible`) de « Ne pas sur-titrer... » — un repère non-EBM sert donc maintenant de gate, arbitrage référent assumé (auparavant : simple alerte d'option D21)."
  - "PIVOT nocturne (E-03, implémenté 2026-07-26) : le référent a dit 3 fois (dont recette capture 8) que la GAJ n'est plus le bon pivot de « basale seule » — l'aspect NOCTURNE de la courbe prime, la GAJ n'étant qu'un repli sans MCG. Fait : `profil_nocturne_permet_titration` (« stable » ou « phénomène de l'aube ») et `profil_nocturne_a_cible` (« excursions post-prandiales ») remplacent `gaj_a_cible` comme pivot QUAND `mcg_disponible == true` ; `gaj_a_cible` reste le pivot du repli sans MCG, inchangé. Reste NON tranché par le référent : (1) `hypo_interprandiale` (5ᵉ valeur de `profil_glycemique`) n'alimente aucun des deux nouveaux dérivés — signal ni nocturne ni franchement post-prandial, laissé de côté faute de mandat ; (2) l'assimilation « phénomène de l'aube → titrer la basale » est une lecture clinique standard (cf. §5 de l'argumentaire, « phénomène de l'aube → augmenter la basale » déjà énoncé pour le basal-bolus) mais n'a pas été explicitement validée pour ce nouveau dérivé — à confirmer."
  - "Cumul sécurité/efficacité en « basale seule » (E-04b/E-06, implémenté 2026-07-26) : les 2 options d'intensification de la situation « basale_plus_bolus » (GLP-1/association fixe, ajout d'un bolus) sont désormais réutilisées en « basale seule », déclenchées par les 2 signaux nommés par le référent (hypoglycémie/variabilité nocturne, sur-basalisation). Volontairement NON généralisé au cas « GAJ/profil nocturne déjà à la cible sans autre signal » (`gaj_a_cible == true` seul ou son équivalent MCG) : ce cas reste sans option d'efficacité dédiée, seulement la prose de « Ne pas sur-titrer... » — un gap de même nature, non nommé par le référent, non testé, laissé pour un futur lot plutôt que tranché sans mandat. Autre point non tranché : ces 2 options portent leurs `priorite` d'origine (1 et 2, hérités de « basale_plus_bolus ») ; en « basale seule », ces rangs chevauchent ceux, sans rapport, de « Corriger l'hypoglycémie » (1) et « Ne pas sur-titrer » (2) — le nœud ne déclare pas de `familles`, donc ce chevauchement peut regrouper « à égalité » des gestes de nature différente (sécurité vs efficacité) à l'affichage ; signalé, non corrigé (changement de structure hors périmètre de ce lot). MÊME chevauchement introduit en sens inverse le 2026-07-26 (4ᵉ lot, I1/I2) : « Corriger l'hypoglycémie... » (priorite 1) et « Optimiser la répartition du basal-bolus » (priorite 2) sont désormais réutilisées en « basale_plus_bolus », où elles chevauchent « Ajouter un GLP-1... » (priorite 1) et « Ajouter un bolus... » (priorite 2) — même limite structurelle, même non-correction assumée."
  - "I1/I2 (redteam-clinique-silences.md F2/F3, 2026-07-26, 4ᵉ lot) : « basale_plus_bolus » avait ZÉRO option de sécurité (401/401 profils à risque du banc) et ZÉRO option d'efficacité une fois les 2 gestes d'ajout épuisés (60/92 profils cible non atteinte). Corrigé par RÉUTILISATION de 2 options déjà écrites pour d'autres situations (« Corriger l'hypoglycémie... », « Optimiser la répartition du basal-bolus ») + `exclusions` sur les 2 options d'escalade, modèle « Titrer la basale ». Deux points à confirmer par le référent (invariant 6) : (1) les `exclusions` ajoutées incluent `hypo_severe_recurrente == true`, un 5ᵉ signal au-delà des 4 cités dans la consigne (TBR/TBR_severe/CV_glycemique/profil nocturne) — nécessaire pour couvrir le profil exact du rapport F3 (TBR=1, TBR_severe=0, où seul cet antécédent signale le risque), mais c'est une extension du périmètre décidée sans mandat explicite pour CE signal précis dans CE canal ; (2) `hypo_severe_recurrente` n'a volontairement PAS été ajouté au déclencheur de « Corriger l'hypoglycémie... » pour la situation « basale_seule » (portée gardée strictement à « basale_plus_bolus », prudence de portée) — à généraliser ou non selon la même logique que (1)."
  - "RÉSOLU 2026-07-26 (4ᵉ lot, I3/F4) : « Désintensifier / alléger le schéma » (basal-bolus) portait `hypo_severe_recurrente == true` en OR littéral, jamais lu par « Choisir un analogue basal de 2ᵉ génération » (naïf) — même concept de sécurité, deux encodages (invariant I4, cité nommément pour ce nœud dans `docs/decision/CONSTRUIRE-UN-MODULE.md`). Arbitrage retenu (les deux étaient possibles, cf. mission) : FUSION dans `terrain_fragile` plutôt qu'un 2nd déclencheur indépendant par option — un futur consommateur de `terrain_fragile` hérite désormais automatiquement du signal. Le OR littéral sur « Désintensifier » est retiré (redondant). À CONFIRMER par le référent : la fusion élargit aussi la population des 2 alertes « cibles MCG » (ligne ~530 et suivante) à un patient dont le SEUL signal est cet antécédent — un effet de bord non distinctement demandé, mais cohérent avec le principe déjà appliqué (`risque_hypoglycemie_schema == eleve` y était déjà inclus)."
  - "2ᵉ génération : hypoglycémie SÉVÈRE démontrée pour degludec vs glargine U100 seulement (DEVOTE) ; pour la 1ʳᵉ génération vs NPH, elle n'est pas significative (Cochrane 2020) ; pas de supériorité d'un analogue de 2ᵉ génération sur l'autre (BRIGHT, CONCLUDE)."
  - "Associations fixes (IDegLira, iGlarLixi) : bénéfice substitutif, aucun essai de morbi-mortalité cardiovasculaire dédié."
  - "Câblage formulaire (P3) : dérivés cible_atteinte / gaj_a_cible / over_basalisation / terrain_fragile, calcul des doses (poids + doses actuelles), tooltips de lecture de l'AGP par profil, et la variable hypo_severe_recurrente restent à câbler."
  - "Intégration inter-nœuds : HbA1c_cible provient du nœud A et terrain_fragile reprend ses déclencheurs de relaxation — cohérence à maintenir."
