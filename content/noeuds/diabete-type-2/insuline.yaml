      resume: >-
        Arbitrages référent 2026-07-26 (2ᵉ série), 2 décisions ciblées sur 12.6/12.7/12.8-12.9 (points
        laissés ouverts par le lot précédent du même jour). (1) `over_basalisation` : l'alerte D21 portée
        par « Titrer la basale » (lot précédent) était une consigne erronée — elle laissait la carte
        recommander la titration tout en portant une alerte disant de ne pas titrer, contradiction
