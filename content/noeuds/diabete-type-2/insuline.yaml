      - "situation_insuline == basale_plus_bolus OR TBR > 4 OR TBR_severe > 1 OR CV_glycemique > 36 OR profil_glycemique contient hypo_nocturne OR over_basalisation == true OR gaj_a_cible == true OR profil_nocturne_a_cible == true"
