  synthese_critique:
    donnee: >-
      Schéma de choix = insuline basale ajoutée aux antidiabétiques oraux/GLP-1, avec le meilleur profil
      tolérance/poids observé en essai randomisé (4T : hypo 2,3 vs 12,0 évén./patient/an, poids +1,9 vs
      +5,7 kg vs un schéma prandial à 1 an, PMID 17890232) ; les schémas prandial et prémélangé
      systématiques restent hors 1ʳᵉ intention (gain d'HbA1c modeste, −0,24 à −0,38 %, critère de
      substitution — Bertuol, méta-analyse en réseau 2026, 58 essais/19 122 patients) ; le GLP-1 est
      préféré avant tout bolus, avec un contrôle équivalent et moins d'hypoglycémie/de poids (DUAL VII ;
      métas Eng et Maiorino). Vigilance sur le surtraitement du sujet âgé : aucune métrique, HbA1c ou
      MCG, ne prédit fiablement le risque d'hypoglycémie, et les cibles de Time in Range restent un
      consensus d'experts (Battelino/ATTD 2019), non un critère dur validé sur les complications — le
      lien TIR-complications est observationnel (Beck 2019 en DT1 ; Lu 2021 en DT2). Insuline en ajout
      lorsque l'HbA1c est très élevée ou si éviter la prise de poids n'est pas prioritaire ; effets
      indésirables : hypoglycémie, prise de poids, aggravation d'une rétinopathie préexistante en cas de
      baisse rapide de l'HbA1c. Remarque de sourçage : la synthèse Prescrire consultée ne traite pas la
      hiérarchie NPH / analogues de 2ᵉ génération — cet argument s'appuie ici sur les essais dédiés
      (SWITCH 2, DEVOTE, EDITION, BRIGHT, CONCLUDE, Cochrane Semlitsch).
    references:
      - nom: "ebmfrance/Duodecim"
        lien: "https://www.ebmfrance.net/Guidelines/Details/ebm00491"
      - nom: "Médicalement Geek / DragiWebdo"
      - nom: "Prescrire"
        detail: "Résumé sous droit d'auteur ; réf. prescrire-dt2.md P1/P3/P5/P8."
  reco_officielle:
    source: >-
      SFD 2025 (Darmon P et al., Médecine des maladies Métaboliques 2025;19(8):630-662) — reco française de
      référence affichée ; HAS 2024 (« Stratégie thérapeutique du patient vivant avec un DT2 ») ; ADA Standards
      of Care 2026 (chap. 7 Technologie & 9 Traitement pharmacologique) ; ADA/EASD 2022 (Davies, PMID 36148880) ;
      AACE 2022/2026. Position d'experts MCG en médecine générale : Joubert M et al. 2025 (Méd. Mal. Métab. 19:331-347).
    position: >-
      Consensus : insuline basale ajoutée aux antidiabétiques ; GLP-1 préféré comme premier injectable et avant
      le bolus (SFD 2025 Avis 19, ADA 2026 rec 9.21) ; analogues de 2ᵉ génération si risque d'hypoglycémie
      (SFD 2025 Avis 18 bis) ; désintensification du sujet âgé (SFD 2025 Avis 21, HAS 2024 R.103) ; MCG
      recommandée et remboursée chez le patient traité par insuline (SFD 2025 Avis 23, ADA 2026 rec 7.15 grade A),
      avec les cibles de Time in Range de Battelino 2019.
    divergence: true
    explication: >-
      Deux frictions officielles : (1) la HAS 2024 (R.88, grade accord d'experts) place l'insuline prémélangée
      à parité avec le basal-bolus et reste muette sur la préférence 2ᵉ génération et sur « le GLP-1 avant le
      bolus » — deux préférences appuyées sur des essais publiés : réduction démontrée de l'hypoglycémie
      nocturne (SWITCH 2 RR 0,70 ; EDITION U300 −31 %) et, vs glargine U100, de l'hypoglycémie sévère (DEVOTE,
      NNT ~59/2 ans) pour le choix de génération ; même contrôle avec moins d'hypoglycémie et de poids
      (DUAL VII ; méta Eng/Maiorino) pour le GLP-1 avant le bolus — la SFD 2025 les énonce explicitement, la
      HAS reste silencieuse ; (2) sur la MCG / le Time in Range, un axe SFD 2025 / ADA 2026 technophile (MCG
      grade A, délivrance automatisée d'insuline désormais proposée aussi en DT2, avec d'importants conflits
      d'intérêt avec les fabricants de dispositifs) s'oppose à une HAS réservée (MCG « encouragée », sans
      cible de TIR) et au fait que les cibles de Time in Range restent un consensus d'experts (Battelino/ATTD
      2019), non un critère dur — le lien TIR-complications est observationnel (Beck 2019 en DT1 ; Lu 2021 en
      DT2) et aucune métrique ne prédit fiablement l'hypoglycémie, d'où un risque de surtraitement guidé par
      la technologie. L'outil affiche la reco française (SFD 2025, convergente avec l'EBM sur l'essentiel) et
      signale ces divergences ; il ne revendique jamais de bénéfice cardiovasculaire pour l'insuline (ORIGIN
      neutre).
incertitudes:
  - "RENOMMAGE `terrain_fragile` → `risque_hypoglycemique_eleve` (2026-07-27, référent) : le dérivé désignait un RISQUE HYPOGLYCÉMIQUE (il inclut le schéma à risque et l'antécédent d'hypoglycémie sévère), pas une fragilité gériatrique — nom trompeur depuis la scission du même jour, qui a confié les CIBLES à `terrain_cible_assouplie`. Aucun changement de comportement. TROUVAILLE au passage, à trancher : le nœud `prescription` déclare LUI AUSSI un dérivé nommé `terrain_fragile`, avec une définition DIFFÉRENTE (sans `hypo_severe_recurrente`, qu'il ne recueille pas). Deux nœuds, un même nom, deux encodages — exactement ce que l'invariant I4 interdit, mais l'invariant est vérifié PAR NŒUD et ne pouvait pas le voir. Le renommage rend la divergence visible plutôt que de la corriger : soit `prescription` recueille l'antécédent d'hypoglycémie sévère et les deux convergent, soit son dérivé est renommé à son tour pour dire ce qu'il calcule réellement. À arbitrer."
  - "MCG : les cibles (TIR > 70 %, etc.) sont un consensus d'experts (Battelino 2019), pas un critère dur ; le lien TIR-complications est observationnel (Beck, ré-analyse du DCCT en DT1 ; Lu, cohorte T2D) ; le bénéfice de la MCG en DT2 porte sur des substituts (HbA1c, TIR), sans preuve sur les complications dures ni la mortalité (Jancev)."
  - "Bénéfice microvasculaire de l'insuline = extrapolé du contrôle glycémique (UKPDS), non démontré par un essai dédié à l'insuline sur critère dur."
  - "SEUIL D'OVER-BASALISATION 0,5 U/kg — SOURÇAGE ÉTABLI ET CORRIGÉ le 2026-07-27 (collecte + red-team, `chantier-2026-07-27/preuve-sur-basalisation.md` et `redteam-sur-basalisation.md`). L'attribution précédente (« repère SFD / Médicalement Geek ») était INEXACTE SUR LES DEUX TERMES : aucune source SFD ne porte ce seuil, et Médicalement Geek en était un relais des Standards ADA 2020. Trajectoire réelle : le chiffre circule d'abord comme avis d'expert, puis reçoit un support de données avec le post-hoc poolé de 3 essais glargine d'Umpierrez 2019 (N=458, financé par le fabricant, deux auteurs salariés) — où il n'est PAS pré-spécifié : c'est la lecture de l'inflexion d'une courbe dose-réponse. Porté par l'ADA de 2018 à 2023 (rec 9.14, grade E), puis explicitement RETIRÉ en 2025 (« Recommendation 9.27 was revised to remove consideration of basal insulin doses exceeding 0.5 units/kg/day as evidence of overbasalization ») et absent en 2026 — mais MAINTENU par l'AACE depuis 2018. Les deux sociétés divergent : ce seuil n'est ni consensuel ni abandonné. Aucun essai n'a comparé « plafonner puis intensifier autrement » à « continuer à titrer ». Repère concurrent le plus gênant : les doses d'entretien réellement atteintes à la cible s'étalent de 0,34 à 0,78 U/kg. CONSÉQUENCE ENCODÉE : le seuil n'est plus une EXCLUSION de « Titrer la basale » (retirée le 2026-07-27) ; il reste DÉCLENCHEUR de « Ne pas sur-titrer… », les deux options coexistant sous le tri par rang. La mention « majore l'hypoglycémie » est CONSERVÉE : la collecte la disait démentie, le red-team a établi que c'était une lecture sélective (Reid 2016 a un volet intra-patient montrant une probabilité d'hypoglycémie accrue APRÈS franchissement du seuil)."
  - "PIVOT nocturne (E-03, implémenté 2026-07-26) : le référent a dit 3 fois (dont recette capture 8) que la GAJ n'est plus le bon pivot de « basale seule » — l'aspect NOCTURNE de la courbe prime, la GAJ n'étant qu'un repli sans MCG. Fait : `profil_nocturne_permet_titration` (« stable » ou « phénomène de l'aube ») et `profil_nocturne_a_cible` (« excursions post-prandiales ») remplacent `gaj_a_cible` comme pivot QUAND `mcg_disponible == true` ; `gaj_a_cible` reste le pivot du repli sans MCG, inchangé. TRANCHÉ par le référent le 2026-07-27, les deux points : (1) `hypo_interprandiale` ne rejoint AUCUN des deux dérivés nocturnes — il accuse le BOLUS (dose trop importante par rapport au repas), pas la basale. Il a été SORTI de la liste `profil_glycemique` et promu en critère propre, recueilli seulement dans les schémas comportant un bolus (`visible_si`), et il ouvre « Optimiser la répartition du basal-bolus » — l'option qui portait déjà « hypo interprandiale → réduire le bolus » dans son texte. Il ne bloque délibérément pas la titration de la basale : si l'hypoglycémie est post-bolus, la basale n'est pas en cause. (2) L'assimilation « phénomène de l'aube → titrer la basale » est CONFIRMÉE (lecture clinique standard, déjà énoncée dans l'argumentaire pour le basal-bolus) : aucun changement de code, l'incertitude est levée."
  - "Cumul sécurité/efficacité en « basale seule » (E-04b/E-06, implémenté 2026-07-26) : les 2 options d'intensification de la situation « basale_plus_bolus » (GLP-1/association fixe, ajout d'un bolus) sont désormais réutilisées en « basale seule », déclenchées par les 2 signaux nommés par le référent (hypoglycémie/variabilité nocturne, sur-basalisation). TRANCHÉ le 2026-07-27 (référent) : le cas « jeûne/nuit DÉJÀ à la cible, HbA1c au-dessus » — l'écart est donc post-prandial — ouvre désormais les DEUX gestes concrets (`gaj_a_cible == true OR profil_nocturne_a_cible == true` ajoutés au déclencheur de « Ajouter un GLP-1 / association fixe » et de « Ajouter un bolus »). Motif : la carte « Ne pas sur-titrer… — intensifier autrement » disait d'intensifier sans nommer par quoi ; monter la basale n'aiderait pas, mais le patient repartait sans geste nommé. Vignette A27-4. Comme pour les autres arbitrages de ce lot, AUCUN des 180 profils gelés ne change de liste d'options : le cas isolé n'est pas produit par le générateur, seule la vignette le couvre. Autre point, RÉSOLU depuis : ces 2 options portent leurs `priorite` d'origine (1 et 2, hérités de « basale_plus_bolus ») ; en « basale seule », ces rangs chevauchent ceux, sans rapport, de « Corriger l'hypoglycémie » (1) et « Ne pas sur-titrer » (2) — traité le 2026-07-27 (arbitrage référent) : le nœud DÉCLARE désormais six `familles` (sécurité / instaurer / intensifier / ajuster / alléger / aucun geste), si bien que le rang ne regroupe plus qu'à l'intérieur d'une même nature de geste — un geste de sécurité et un geste d'escalade ne peuvent plus s'afficher sous la mention « à égalité ». Le chevauchement de rangs SUBSISTE dans les données (les quatre blocs de situation réutilisent 1-2-3) mais il est devenu sans conséquence d'affichage. Les `priorite` n'ont volontairement pas été renumérotées : ce serait un remaniement large, sans gain, et qui rendrait le golden master illisible. Toutes les familles sont `exclusive: false` — aucune n'est un vrai choix entre alternatives (« Initier une basale » et « Choisir un analogue de 2ᵉ génération » sont un geste et sa modalité) ; à reconfirmer visuellement."
  - "I1/I2 (redteam-clinique-silences.md F2/F3, 2026-07-26, 4ᵉ lot) : « basale_plus_bolus » avait ZÉRO option de sécurité (401/401 profils à risque du banc) et ZÉRO option d'efficacité une fois les 2 gestes d'ajout épuisés (60/92 profils cible non atteinte). Corrigé par RÉUTILISATION de 2 options déjà écrites pour d'autres situations (« Corriger l'hypoglycémie... », « Optimiser la répartition du basal-bolus ») + `exclusions` sur les 2 options d'escalade, modèle « Titrer la basale ». TRANCHÉ par le référent le 2026-07-27 : GÉNÉRALISATION. `hypo_severe_recurrente` déclenche désormais « Corriger l'hypoglycémie... » dans TOUTES les situations où cette option existe (« basale_seule » comme « basale_plus_bolus »), la conjonction avec la situation ayant été retirée. Motif du référent : un antécédent d'hypoglycémie sévère récurrente est une propriété DU PATIENT, pas du schéma — il n'y a aucune raison qu'il ouvre un geste correctif sous un schéma et se taise sous l'autre. La restriction d'origine était une prudence de portée, jamais un choix clinique. Le point (1) — ce même signal en 5ᵉ terme des `exclusions` d'escalade — est validé par la même décision. Vignette A27-1 : basale seule, MCG rassurante, cet antécédent pour seul signal → le geste correctif apparaît. NB : ce gain n'est visible dans AUCUN des 180 profils gelés (le générateur cumule volontiers plusieurs signaux d'hypoglycémie ; le cas du signal isolé n'y figure pas), d'où la vignette."
  - "RÉSOLU 2026-07-26 (4ᵉ lot, I3/F4) : « Désintensifier / alléger le schéma » (basal-bolus) portait `hypo_severe_recurrente == true` en OR littéral, jamais lu par « Choisir un analogue basal de 2ᵉ génération » (naïf) — même concept de sécurité, deux encodages (invariant I4, cité nommément pour ce nœud dans `docs/decision/CONSTRUIRE-UN-MODULE.md`). Arbitrage retenu (les deux étaient possibles, cf. mission) : FUSION dans `risque_hypoglycemique_eleve` plutôt qu'un 2nd déclencheur indépendant par option — un futur consommateur de `risque_hypoglycemique_eleve` hérite désormais automatiquement du signal. Le OR littéral sur « Désintensifier » est retiré (redondant). TRANCHÉ par le référent le 2026-07-27, et l'effet de bord est REFUSÉ : la fusion reste valable pour le CHOIX DU TRAITEMENT (analogue de 2ᵉ génération, désintensification), mais elle ne doit pas toucher les CIBLES. Principe énoncé par le référent : « la cible doit être assouplie en fonction des comorbidités et de l'impact supposé des complications à long terme ; des hypoglycémies sévères appellent une OPTIMISATION DU TRAITEMENT, pas un assouplissement des cibles » — le même principe qui lui avait fait retirer `risque_hypoglycemie_schema` du nœud A. Les 2 alertes « cibles MCG » lisent donc désormais un dérivé DISTINCT, `terrain_cible_assouplie` (âge / fragilité / espérance de vie, sans aucun signal d'hypoglycémie). Ce ne sont pas deux encodages d'un même concept (I4) mais deux concepts que la fusion confondait. Vignettes A27-3 / A27-3b : à 55 ans le même antécédent laisse les cibles STANDARD, à 82 ans elles sont assouplies — par l'âge, pas par l'hypoglycémie."
  - "2ᵉ génération : hypoglycémie SÉVÈRE démontrée pour degludec vs glargine U100 seulement (DEVOTE) ; pour la 1ʳᵉ génération vs NPH, elle n'est pas significative (Cochrane 2020) ; pas de supériorité d'un analogue de 2ᵉ génération sur l'autre (BRIGHT, CONCLUDE)."
  - "Associations fixes (IDegLira, iGlarLixi) : bénéfice substitutif, aucun essai de morbi-mortalité cardiovasculaire dédié."
  - "Câblage formulaire — ENTRÉE PÉRIMÉE, corrigée le 2026-07-27. Elle annonçait que les dérivés (`cible_atteinte`, `gaj_a_cible`, `over_basalisation`, `risque_hypoglycemique_eleve`), les tooltips AGP et `hypo_severe_recurrente` « restent à câbler » : tout cela a été fait le 2026-07-24 (câblage GÉNÉRIQUE via le champ `derive` + `engine/deriveCritere.ts`, nombres optionnels via `criteresReferences`, tooltips AGP), et l'entrée n'a jamais été purgée. Elle décrivait donc un défaut corrigé comme s'il subsistait — le cas exact que `docs/decision/CONSTRUIRE-UN-MODULE.md` §5 nomme « une entrée périmée est pire qu'absente ». RESTE RÉELLEMENT OUVERT, et rien d'autre : l'AFFICHAGE du nombre de dose calculé (le moteur le calcule, l'écran ne le rend pas encore) — P3+."
  - "Intégration inter-nœuds : HbA1c_cible provient du nœud A et risque_hypoglycemique_eleve reprend ses déclencheurs de relaxation — cohérence à maintenir."
