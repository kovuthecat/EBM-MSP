        redondance incrétine chez un patient déjà sous tirzépatide) ; (D7) message de l'alerte `DFG < 45`
        corrigé pour ne plus proscrire les sulfamides en bloc — aligné sur le nœud D (référence documentaire
        sulfamides) : dose réduite + surveillance rapprochée si DFG 30-44, contre-indication seulement
        si DFG < 30 (convention KDIGO/SFD).
